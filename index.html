 ],
 plan:["Xotira turlarining ajratilishi","Dastur xotirasi","Ma'lumot xotirasi","Banklar va SFR","Stek sohasi","EEPROM bilan ishlash"],
 body:[
  ["h","Xotira turlarining ajratilishi"],
  ["p","Garvard arxitekturasiga asoslangan mikrokontrollerda dastur va ma'lumot xotirasi jismonan ajratilgan: ularning razryadliligi, adres fazosi va murojaat usuli har xil. Masalan PIC16 da buyruq so'zi 14 bitli, ma'lumot yacheykasi esa 8 bitli; AVR da esa buyruq 16 bitli, ma'lumot 8 bitli bo'ladi."],
  ["fig","mem","1-rasm. Mikrokontroller xotira fazosining taqsimoti"],
  ["t",["Xotira","Turi","Energiyaga bog'liqligi","Vazifasi"],[
   ["Flash (programma xotirasi)","Doimiy, blok-blok yoziladi","Yo'q","Dastur kodi va doimiy jadvallar"],
   ["SRAM (qiymatlar xotirasi)","O'zgaruvchan","Ha","O'zgaruvchilar, buferlar, stek"],
   ["EEPROM","Doimiy, bayt-bayt yoziladi","Yo'q","Sozlamalar, kalibrlash koeffitsientlari"],
   ["SFR","Registrlar sohasi","Ha","Periferiyani boshqarish va holatini o'qish"]
  ]],
  ["h","Dastur xotirasi"],
  ["p","Dastur xotirasi hajmi so'zlarda o'lchanadi: PIC16F877A da 8 K × 14 bit, ATmega328P da 32 KB (16 K so'z). Unga ish jarayonida odatda faqat o'qish uchun murojaat qilinadi. Doimiy ma'lumotlarni — matn satrlari, kod jadvallari, koeffitsientlar — shu yerda saqlash SRAM ni tejaydi."],
  ["c","/* Doimiy jadvalni dastur xotirasida saqlash */\n/* PIC (XC8):   */   const uint8_t kod[10] = {0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F};\n/* AVR (GCC):   */   const uint8_t kod[] PROGMEM = {0x3F,0x06,0x5B,0x4F,0x66};\n                     b = pgm_read_byte(&kod[i]);   /* maxsus funksiya orqali o'qiladi */"],
  ["p","Garvard arxitekturasida dastur xotirasidagi ma'lumotga oddiy ko'rsatkich bilan murojaat qilib bo'lmaydi — maxsus buyruq yoki funksiya kerak bo'ladi. Aynan shuning uchun AVR da PROGMEM va pgm_read_byte, PIC da esa RETLW jadvali yoki maxsus o'qish buyruqlari qo'llanadi."],
  ["h","Ma'lumot xotirasi va banklar"],
  ["p","SRAM hajmi odatda kichik bo'ladi: PIC16F877A da 368 bayt, ATmega328P da 2 KB. U to'rt qismga taqsimlanadi: global o'zgaruvchilar sohasi, dinamik ajratiladigan soha (heap), stek va maxsus funksional registrlar."],
  ["p","PIC16 da ma'lumot xotirasi banklarga bo'lingan, chunki buyruq formatida adres uchun atigi 7 razryad ajratilgan (128 yacheyka). Kerakli bank STATUS registrining RP0 va RP1 bitlari bilan tanlanadi. Bank noto'g'ri tanlansa, dastur butunlay boshqa registrni o'zgartiradi — bu boshlovchilarning eng ko'p uchraydigan xatosi."],
  ["t",["PIC16F877A","Bank 0","Bank 1"],[
   ["Portlar","PORTA…PORTE","TRISA…TRISE"],
   ["ADC","ADRESH, ADCON0","ADRESL, ADCON1"],
   ["Umumiy soha","0x20–0x7F","0xA0–0xEF"],
   ["Tanlash","RP0 = 0","RP0 = 1"]
  ]],
  ["h","Stek sohasi"],
  ["p","Stek qism dasturga o'tishda qaytish adresini saqlaydi. PIC16 da stek apparat ko'rinishida va chuqurligi 8 daraja bilan cheklangan, AVR da esa stek SRAM da joylashadi va uning chuqurligi faqat bo'sh xotira bilan chegaralanadi. Ikkinchi holatda stek o'zgaruvchilar sohasiga o'sib kirib borishi mumkin — bu stek to'lib ketishi deb ataladi va dasturning tasodifiy ishdan chiqishiga olib keladi."],
  ["n","Xotira sarfini kamaytirish qoidalari: katta massivlarni lokal emas, global e'lon qiling; doimiy jadvallarni dastur xotirasida saqlang; rekursiyadan voz keching; float o'rniga butun sonli hisobni qo'llang; buferlarni haqiqiy ehtiyojdan ortiq olmang."],
  ["h","EEPROM bilan ishlash"],
  ["p","EEPROM sozlamalar, kalibrlash koeffitsientlari va hisoblagich qiymatlarini saqlash uchun ishlatiladi. Uning ikkita muhim cheklovi bor: bitta baytni yozish 4–10 ms davom etadi va yozish sikllari soni chegaralangan (odatda 100 000 dan 1 000 000 gacha)."],
  ["ul",[

  ]],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Mikrokontrollerda dastur xotirasi (Flash) va qiymatlar xotirasi (SRAM) ajratilgan bo'lib, razryadliligi va murojaat usuli har xil. Doimiy jadvallarni dastur xotirasida saqlash cheklangan SRAM ni tejaydi. PIC16 da ma'lumot xotirasi banklarga bo'lingan va bank tanlashni unutish tipik xato hisoblanadi. EEPROM sozlamalarni saqlash uchun qulay, ammo yozish sikllari cheklangani uchun undan tejab foydalaniladi."]
 ],

{
 id:"S2-L2", sem:2, week:2, type:"lab", no:2,
 title:"Arduino qurilmasida oddiy amallar bajarish",
 goal:"Raqamli chiqishlarni boshqarish, o'zgaruvchilar va sikllar bilan ishlash hamda Serial port orqali natijani kuzatishni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","LED 8 dona, rezistor 330 Ω — 8 dona","Maket plata va ulash simlari","Multimetr"],
 plan:["Chiqishlarni sozlash","Sikl va massivlar","Yuguruvchi olov","Serial port bilan ishlash","Arifmetik amallar","Vaqtni o'lchash"],
 body:[
  ["h","Nazariy qism"],
  ["p","Arduino da har bir raqamli chiqish alohida funksiya bilan boshqariladi, ammo ko'p chiqish bilan ishlashda massiv va sikl ishlatish kodni ancha qisqartiradi. Bu yondashuv PIC dagi portni bir butun bayt sifatida boshqarishga o'xshash natija beradi."],
  ["n","Xavfsizlik: sakkizta LED ni bir vaqtda yoqqanda umumiy tok 5 V liniyasi chegarasidan oshmasligi kerak. Har bir LED uchun 330 Ω rezistor ishlatilsa, bitta LED toki taxminan 9 mA, sakkiztasiniki 72 mA bo'ladi — bu ruxsat etilgan chegarada."],
  ["h","Massiv va sikl bilan ishlash"],
  ["c","const int led[8] = {2, 3, 4, 5, 6, 7, 8, 9};\n\nvoid setup()\n{\n    for (int i = 0; i < 8; i++)\n        pinMode(led[i], OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    // yuguruvchi olov: oldinga\n    for (int i = 0; i < 8; i++)\n    {\n        digitalWrite(led[i], HIGH);\n        delay(100);\n        digitalWrite(led[i], LOW);\n    }\n    // orqaga\n    for (int i = 6; i > 0; i--)\n    {\n        digitalWrite(led[i], HIGH);\n        delay(100);\n        digitalWrite(led[i], LOW);\n    }\n}"],
  ["h","Baytni razryadlarga ajratib chiqarish"],
  ["c","void baytni_chiqar(byte qiymat)\n{\n    for (int i = 0; i < 8; i++)\n        digitalWrite(led[i], bitRead(qiymat, i));   // i-razryadni o'qib chiqarish\n}\n\nvoid loop()\n{\n    for (int n = 0; n < 256; n++)      // ikkilik hisoblagich\n    {\n        baytni_chiqar((byte)n);\n        Serial.print(\"Qiymat: \");\n        Serial.print(n);\n        Serial.print(\"  HEX: \");\n        Serial.println(n, HEX);\n        delay(300);\n    }\n}"],
  ["p","bitRead(qiymat, i) funksiyasi baytning i-razryadini qaytaradi — bu maskalash amalining tayyor ko'rinishi. Serial.println(n, HEX) esa sonni o'n oltilik sistemada chiqaradi, bu sanoq sistemalari o'rtasidagi bog'liqlikni kuzatish uchun qulay."],
  ["h","Arifmetik amallar va vaqtni o'lchash"],
  ["c","void loop()\n{\n    unsigned long t1 = micros();          // boshlanish vaqti\n\n    long a = 1234, b = 567;\n    long yigindi = a + b;\n    long kopaytma = a * b;\n    long bolinma  = a / b;\n    long qoldiq   = a % b;\n\n    unsigned long t2 = micros();\n\n    Serial.print(\"Yigindi: \");   Serial.println(yigindi);\n    Serial.print(\"Kopaytma: \");  Serial.println(kopaytma);\n    Serial.print(\"Bolinma: \");   Serial.print(bolinma);\n    Serial.print(\" qoldiq \");    Serial.println(qoldiq);\n    Serial.print(\"Hisob vaqti: \"); Serial.print(t2 - t1); Serial.println(\" us\");\n\n    delay(2000);\n}"],
  ["p","micros() funksiyasi ishga tushgandan beri o'tgan mikrosekundlarni qaytaradi. Ikki o'lchov farqi kod qismining bajarilish vaqtini beradi — bu turli amallarning narxini taqqoslashning sodda usuli. Ko'paytirish va bo'lish qo'shishdan sezilarli ko'proq vaqt olishini shu tarzda amalda ko'rish mumkin."],
  ["h","Interaktiv qism"],
  ["sim","port"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Sakkizta LED ni D2–D9 chiqishlariga ulang va sxemani chizing.",
   "Yuguruvchi olov dasturini yuklang va tezligini o'zgartirib ko'ring.",
   "Ikkilik hisoblagich dasturini yozing; Serial Monitor da o'nlik va o'n oltilik qiymatlarni solishtiring.",
   "Variant raqamingiz N bo'lsin: hisoblagichni (10·N) dan boshlab 255 gacha sanaydigan qiling.",
   "micros() yordamida qo'shish, ko'paytirish va bo'lish amallarining vaqtini o'lchang va jadvalga yozing.",
   "LED toki multimetr bilan o'lchang va hisob bilan solishtiring.",
   "Serial Monitor ekrani va yig'ilgan sxema rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Massiv va sikl ishlatish ko'p chiqishli qurilmalar kodini sezilarli qisqartiradi. bitRead funksiyasi baytni razryadlarga ajratib indikatorga chiqarish imkonini beradi. Serial port dastur ichidagi qiymatlarni kuzatishning eng qulay vositasi, micros() esa kod qismlarining bajarilish vaqtini bevosita o'lchashga imkon beradi."]
 ],
 tests:[
  {q:"Massiv va sikl ishlatishning afzalligi nimada?",o:["Tezroq ishlaydi","Ko'p chiqish bilan ishlaganda kod qisqaradi va tartibli bo'ladi","Kam tok sarflaydi","Xotira talab qilmaydi"],a:1,e:"Bir xil amallar sikl ichida takrorlanadi."},
  {q:"bitRead(x, 3) nima qaytaradi?",o:["x ning 3-razryadini","x ning qiymatini","3 ni","x ning uzunligini"],a:0,e:"Bu maskalash amalining tayyor ko'rinishi."},
  {q:"Serial.println(n, HEX) nima qiladi?",o:["Sonni o'nlikda chiqaradi","Sonni o'n oltilikda chiqaradi","Sonni ikkilikda chiqaradi","Xatolik beradi"],a:1,e:"Ikkinchi parametr sanoq sistemasini belgilaydi."},
  {q:"micros() funksiyasi nimani qaytaradi?",o:["Joriy vaqtni","Ishga tushgandan beri o'tgan mikrosekundlarni","Kechikish qiymatini","Chastotani"],a:1,e:"Ikki o'lchov farqi kod vaqtini beradi."},
  {q:"330 Ω rezistor bilan bitta LED toki taxminan qancha?",o:["1 mA","9 mA","25 mA","40 mA"],a:1,e:"(5−2)/330 ≈ 9 mA."},
  {q:"Sakkizta LED bir vaqtda yonganda umumiy tok qancha bo'ladi?",o:["9 mA","36 mA","72 mA","200 mA"],a:2,e:"8 · 9 mA = 72 mA."},
  {q:"pinMode ni siklda chaqirish nima uchun qulay?",o:["Tezroq","Barcha chiqishlarni bir xil tartibda sozlash uchun","Xotira uchun","Tok uchun"],a:1,e:"Massivdagi har bir element uchun bir xil sozlash bajariladi."},
  {q:"a % b amali nimani beradi?",o:["Butun bo'linmani","Bo'lish qoldig'ini","Ko'paytmani","Darajani"],a:1,e:"Modul amali qoldiqni qaytaradi."},
  {q:"Qaysi amal odatda eng uzoq bajariladi?",o:["Qo'shish","Ayirish","Bo'lish","Inkrement"],a:2,e:"Bo'lish 8 razryadli MK da eng ko'p takt talab qiladi."},
  {q:"unsigned long turi nima uchun ishlatiladi?",o:["Kasr sonlar uchun","Katta musbat qiymatlar (masalan vaqt) uchun","Belgilar uchun","Massivlar uchun"],a:1,e:"micros() qaytaradigan qiymat tez o'sadi va katta diapazon talab qiladi."}
 ]
},
{
 id:"S2-M18", sem:2, week:3, type:"lecture", no:18,
 title:"Mikrokontrollerlarning apparat vositalari. Taymerlar",
 goal:"Taymer-hisoblagich modullarining tuzilishi, rejimlari va vaqt intervallarini hisoblash usullarini o'zlashtirish.",
 outcomes:[
  "Taymer va hisoblagich rejimlarini farqlay oladi",

 ],
 plan:["Taymerning vazifasi","Taymer va hisoblagich rejimlari","Oldindan bo'luvchi","PIC16F877A taymerlari","Vaqt hisoblari","Taymer uzilishi"],
 body:[
  ["h","Taymerning vazifasi"],
  ["p","Taymer — impulslarni sanaydigan hisoblagich. Agar u ichki takt signalini sanasa, taymer rejimida ishlaydi va vaqtni o'lchaydi; tashqi kirishdan kelgan impulslarni sanasa, hisoblagich rejimida ishlaydi va hodisalar sonini yoki chastotani o'lchaydi."],
  ["p","Dasturiy kechikish (delay) protsessorni band qiladi va boshqa ishni bajarishga to'sqinlik qiladi. Taymer esa yadrodan mustaqil ishlaydi: protsessor asosiy vazifani bajarayotganda taymer fonda sanaydi va vaqt tugaganda uzilish beradi. Shu sababli real qurilmalarda vaqt intervallari taymer orqali shakllantiriladi."],
  ["fig","tmr","1-rasm. Taymer-hisoblagich modulining tuzilma sxemasi"],
  ["h","PIC16F877A taymerlari"],
  ["t",["Modul","Razryad","Bo'luvchi","Xususiyati"],[
   ["Timer0","8","1:2 … 1:256","Ichki yoki tashqi manba (RA4), eng sodda"],
   ["Timer1","16","1:1 … 1:8","Uyqu rejimida ham ishlay oladi, alohida kvarts ulash mumkin"],
   ["Timer2","8","1:1, 1:4, 1:16","Solishtirish registri PR2 bilan, PWM uchun asos"]
  ]],
  ["h","Vaqt hisoblari"],
  ["f","T_bir_qadam = 4 · K / f_osc","K — bo'luvchi qiymati. f = 8 MHz, K = 64 → 32 µs."],
  ["f","T_tolish = (2^n − preload) · 4 · K / f_osc","To'lib ketish davri."],
  ["f","preload = 2^n − T · f_osc / (4 · K)","Kerakli interval uchun boshlang'ich qiymat."],
  ["p","Misol 1. Timer0, 8 razryad, K = 256, f = 8 MHz. Bir qadam 128 µs, to'liq davr 256 · 128 µs = 32,8 ms."],
  ["p","Misol 2. 10 ms interval kerak, f = 8 MHz, K = 64. Qadamlar soni = 10 ms / 32 µs = 312,5 — bu 256 dan katta, demak 8 razryadli Timer0 yetmaydi. Yechim: K = 256 tanlanadi (qadam 128 µs), qadamlar soni 78, preload = 256 − 78 = 178."],
  ["c","; Timer0 ni 10 ms ga sozlash (f = 8 MHz)\n    OPTION_REG = 0x07;   /* ichki manba, bo'luvchi 1:256 */\n    TMR0 = 178;          /* preload */\n    T0IF = 0;            /* bayroqni tozalash */\n    while (!T0IF);       /* to'lishini kutish */"],
  ["h","Taymer uzilishi"],
  ["p","Taymer to'lib ketganda bayroq (T0IF, TMR1IF, TMR2IF) o'rnatiladi. Agar mos ruxsat biti (T0IE) va umumiy ruxsat GIE yoqilgan bo'lsa, uzilish hosil bo'ladi va dastur 0x0004 adresidagi xizmat qism dasturiga o'tadi. Bayroq apparat tomonidan tozalanmaydi — uni dasturda tozalash majburiy, aks holda uzilish cheksiz takrorlanadi."],
  ["c","void __interrupt() isr(void)\n{\n    if (T0IF)\n    {\n        T0IF = 0;            /* bayroqni tozalash — majburiy */\n        TMR0 = 178;          /* preload ni qayta yuklash     */\n        PORTBbits.RB0 = ~PORTBbits.RB0;   /* 10 ms da bir almashadi */\n    }\n}"],
  ["h","Taymerning amaliy qo'llanishi"],
  ["ul",[
   "Aniq vaqt intervallarini shakllantirish (soat, sekundomer, taymer)",
   "PWM signalini hosil qilish va dvigatel tezligini boshqarish",
   "Chastota va impuls davomiyligini o'lchash",
   "Klaviatura va datchiklarni davriy so'rov qilish jadvali",
   "Dinamik indikatsiyada razryadlarni navbatlash",
   "Watchdog kabi nazorat funksiyalari"
  ]],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Taymer ichki taktni sanaganda vaqtni, tashqi impulslarni sanaganda hodisalarni o'lchaydi. Interval davomiyligi razryadlilik, bo'luvchi va preload qiymati bilan belgilanadi. Uzilish rejimi protsessorni bo'shatadi, ammo bayroqni dasturda tozalash va preload ni qayta yuklash majburiy qadamlar hisoblanadi."]
 ],
 tests:[
  {q:"Taymer va hisoblagich rejimlarining farqi nimada?",o:["Razryadliligida","Sanaladigan impuls manbaida: ichki takt yoki tashqi kirish","Bo'luvchida","Uzilishda"],a:1,e:"Ichki takt — taymer, tashqi impuls — hisoblagich rejimi."},
  {q:"Oldindan bo'luvchi (prescaler) nima qiladi?",o:["Chastotani oshiradi","Sanash chastotasini kamaytirib, o'lchanadigan intervalni uzaytiradi","Razryadlilikni oshiradi","Bayroqni tozalaydi"],a:1,e:"K marta bo'linish bir qadam vaqtini K marta uzaytiradi."},
  {q:"Timer1 necha razryadli?",o:["8","10","16","32"],a:2,e:"Timer1 — 16 razryadli taymer."},
  {q:"f = 8 MHz, K = 64 bo'lsa bir qadam qancha davom etadi?",o:["8 µs","32 µs","64 µs","128 µs"],a:1,e:"4·64/8 MHz = 32 µs."},
  {q:"8 razryadli taymer, qadam 128 µs bo'lsa to'liq davr qancha?",o:["3,2 ms","16,4 ms","32,8 ms","65,5 ms"],a:2,e:"256 · 128 µs = 32,768 ms."},
  {q:"Preload qiymati nima uchun kerak?",o:["Taymerni o'chirish uchun","To'lib ketishgacha bo'lgan qadamlar sonini kamaytirib, kerakli interval olish uchun","Bayroqni tozalash uchun","Bo'luvchini o'zgartirish uchun"],a:1,e:"Hisoblash noldan emas, preload dan boshlanadi."},
  {q:"Uzilish xizmat qism dasturida bayroqni tozalash unutilsa nima bo'ladi?",o:["Hech nima","Uzilish cheksiz takrorlanadi","Taymer to'xtaydi","Port o'chadi"],a:1,e:"Bayroq apparat tomonidan tozalanmaydi."},
  {q:"Qaysi taymer PWM modulining asosi hisoblanadi?",o:["Timer0","Timer1","Timer2","Watchdog"],a:2,e:"Timer2 va PR2 registri PWM davrini belgilaydi."},
  {q:"Uzilish ishlashi uchun qaysi bitlar yoqilishi kerak?",o:["Faqat GIE","Faqat T0IE","GIE va mos ruxsat biti (masalan T0IE)","Hech qaysi"],a:2,e:"Umumiy va lokal ruxsat bitlari birga yoqiladi."},
  {q:"Taymerning dasturiy kechikishdan asosiy afzalligi nimada?",o:["Aniqroq kod","Protsessor fonda boshqa ishni bajara olishi","Kam xotira","Yuqori chastota"],a:1,e:"Taymer yadrodan mustaqil sanaydi."}
 ]

{
 id:"S2-L3", sem:2, week:3, type:"lab", no:3,
 title:"Arduino qurilmasida knopkalar bilan ishlash",
 goal:"Tugma signalini o'qish, ichki pull-up dan foydalanish, drebezgni filtrlash va bosishlarni hisoblash dasturini tuzish.",
 equip:["Arduino Uno va USB kabel","Tugmalar 3 dona","Rezistor 10 kΩ (ixtiyoriy), 330 Ω — 3 dona","LED 3 dona","Maket plata va ulash simlari"],
 plan:["Kirishni sozlash","Ichki pull-up","Drebezgni filtrlash","Front bo'yicha ishlov","Hisoblagich","Uzun bosish"],
 body:[
  ["h","Nazariy qism"],
  ["p","Arduino da kirish uchta rejimda sozlanishi mumkin: INPUT (yuqori qarshilikli, tashqi rezistor kerak), INPUT_PULLUP (ichki tortuvchi rezistor yoqiladi) va OUTPUT. Amaliyotda INPUT_PULLUP eng qulay: tashqi rezistorsiz ishlaydi, tugma esa liniyani umumiy simga tortadi."],
  ["p","INPUT_PULLUP rejimida mantiq teskari bo'ladi: bosilmagan tugma HIGH, bosilgan tugma LOW beradi. Bu holatni kodda aniq izohlash xatolarning oldini oladi."],
  ["fig","btn","1-rasm. Tugmani kirish liniyasiga ulash va mantiqiy darajalar"],
  ["n","Xavfsizlik: tugmani 5 V va GND orasiga bevosita ulash qisqa tutashuv hosil qiladi. To'g'ri ulash — bir uchi kirish chiqishiga, ikkinchisi umumiy simga."],
  ["h","Sodda o'qish"],
  ["c","const int TUGMA = 2;\nconst int LED   = 8;\n\nvoid setup()\n{\n    pinMode(TUGMA, INPUT_PULLUP);   // ichki pull-up yoqiladi\n    pinMode(LED, OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    if (digitalRead(TUGMA) == LOW)   // LOW = bosilgan\n        digitalWrite(LED, HIGH);\n    else\n        digitalWrite(LED, LOW);\n}"],
  ["h","Front bo'yicha ishlov va drebezg filtri"],
  ["p","Ko'p vazifalarda tugmaning holati emas, balki bosilish payti (front) muhim. Buning uchun oldingi holat saqlanadi va joriy holat bilan taqqoslanadi. Drebezgni filtrlash uchun oxirgi o'zgarishdan beri o'tgan vaqt tekshiriladi — bu usul delay() dan farqli o'laroq dasturni bloklamaydi."],
  ["c","const int TUGMA = 2, LED = 8;\nint  oldingi = HIGH;\nbool led_holat = false;\nunsigned long oxirgi_vaqt = 0;\nconst unsigned long FILTR = 25;    // ms\nunsigned long hisob = 0;\n\nvoid setup()\n{\n    pinMode(TUGMA, INPUT_PULLUP);\n    pinMode(LED, OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    int hozir = digitalRead(TUGMA);\n\n    if (hozir != oldingi && (millis() - oxirgi_vaqt) > FILTR)\n    {\n        oxirgi_vaqt = millis();\n\n        if (hozir == LOW)              // tushuvchi front = bosildi\n        {\n            led_holat = !led_holat;    // holatni almashtirish\n            digitalWrite(LED, led_holat);\n            hisob++;\n            Serial.print(\"Bosishlar soni: \");\n            Serial.println(hisob);\n        }\n        oldingi = hozir;\n    }\n}"],
  ["p","millis() funksiyasi ishga tushgandan beri o'tgan millisekundlarni qaytaradi. Uning yordamida kutish jarayoni protsessorni band qilmaydi: dastur sikl davomida boshqa vazifalarni ham bajara oladi. Bu real qurilmalar uchun asosiy yondashuv hisoblanadi."],
  ["h","Uzun va qisqa bosishni ajratish"],
  ["c","unsigned long bosilgan_vaqt = 0;\n\nvoid loop()\n{\n    int hozir = digitalRead(TUGMA);\n\n    if (hozir == LOW && oldingi == HIGH)          // endi bosildi\n        bosilgan_vaqt = millis();\n\n    if (hozir == HIGH && oldingi == LOW)          // qo'yib yuborildi\n    {\n        unsigned long davomiyligi = millis() - bosilgan_vaqt;\n        if (davomiyligi > 1000)  Serial.println(\"Uzun bosish\");\n        else if (davomiyligi > 30) Serial.println(\"Qisqa bosish\");\n    }\n    oldingi = hozir;\n}"],

  ["ol",[

  ["h","Xulosa"],
  ["p","INPUT_PULLUP rejimi tashqi rezistorsiz ishonchli kirish hosil qiladi, bunda bosilgan holat LOW ga mos keladi. Front bo'yicha ishlov holat o'zgarishini aniqlash imkonini beradi, millis() asosidagi filtr esa drebezgni dasturni bloklamasdan bartaraf etadi. Bosish davomiyligini o'lchash bitta tugmaga bir necha vazifa biriktirishga imkon beradi."]

  ["c","/* Taymer bo'yicha vazifalar jadvali */\nvolatile uint16_t tick = 0;      /* har 1 ms da uzilishda oshadi */\n\nvoid loop_asosiy(void)\n{\n    static uint16_t t10 = 0, t100 = 0, t1000 = 0;\n\n    if (tick - t10 >= 10)     { t10 = tick;     tugmalarni_oqish(); }\n    if (tick - t100 >= 100)   { t100 = tick;    haroratni_olchash(); }\n    if (tick - t1000 >= 1000) { t1000 = tick;   ekranni_yangilash(); }\n}"],
  ["p","Bu tuzilmada har bir vazifa o'z davriga ega: tugmalar 10 ms da, o'lchash 100 ms da, indikatsiya 1 s da bajariladi. Uzilish esa faqat hisoblagichni oshiradi va shu sababli juda qisqa bo'ladi."],
  ["h","Kechikish va jitter"],
  ["f","t_javob = t_aniqlash + t_ishlov + t_ijro","Tizimning to'liq javob vaqti."],
  ["p","Polling usulida javob vaqti eng yomon holatda asosiy sikl davomiyligiga teng bo'ladi. Uzilishda esa u uzilish kechikishi (bir necha takt) va xizmat qism dasturining uzunligi bilan aniqlanadi. Javob vaqtining takrorlanishdan takrorlanishga o'zgarishi jitter deb ataladi va aniq vaqtli o'lchashlarda u xatoga aylanadi."],

{
 id:"S2-L4", sem:2, week:4, type:"lab", no:4,
 title:"Arduino qurilmasida sekundomer qurilmasini loyihalash",
 goal:"Vaqtni millis() asosida aniq o'lchash, start/stop/reset boshqaruvini va natijani indikatorga chiqarishni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","Tugmalar 2 dona","LCD 16×2 yoki Serial Monitor","Rezistorlar, maket plata, simlar"],
 plan:["Sekundomer mantiqi","millis() bilan vaqt o'lchash","Holatlar mashinasi","Boshqaruv tugmalari","Formatlab chiqarish","Aniqlikni baholash"],
 body:[
  ["h","Nazariy qism"],
  ["p","Sekundomer — ikki hodisa orasidagi vaqtni o'lchaydigan qurilma. Uning mantiqi uchta holatdan iborat: to'xtagan, sanayotgan va pauzada. Bunday vazifalar holatlar mashinasi (state machine) ko'rinishida yozilganda kod tartibli va kengaytirishga qulay bo'ladi."],
  ["p","Vaqt delay() bilan emas, millis() bilan o'lchanadi. delay() protsessorni bloklaydi va tugmalarni o'qishga imkon bermaydi; millis() esa fonda ishlaydigan taymerga tayanadi va sanash davomida boshqa vazifalarni bajarishga to'sqinlik qilmaydi."],
  ["f","o'tgan_vaqt = millis() − boshlanish + yig'ilgan","Pauzadan keyin davom ettirish uchun avvalgi qismlar yig'ib boriladi."],
  ["h","Dastur"],
  ["c","const int START_STOP = 2;\nconst int RESET_TUGMA = 3;\n\nenum Holat { TOXTAGAN, SANAYOTGAN };\nHolat holat = TOXTAGAN;\n\nunsigned long boshlanish = 0;     // sanash boshlangan payt\nunsigned long yigilgan   = 0;     // avvalgi qismlar yig'indisi\nunsigned long oxirgi_bosish = 0;\nconst unsigned long FILTR = 30;\n\nunsigned long otgan()\n{\n    if (holat == SANAYOTGAN) return yigilgan + (millis() - boshlanish);\n    return yigilgan;\n}\n\nvoid setup()\n{\n    pinMode(START_STOP, INPUT_PULLUP);\n    pinMode(RESET_TUGMA, INPUT_PULLUP);\n    Serial.begin(9600);\n    Serial.println(\"Sekundomer tayyor\");\n}\n\nvoid loop()\n{\n    // --- boshqaruv tugmalari ---\n    if (digitalRead(START_STOP) == LOW && millis() - oxirgi_bosish > FILTR)\n    {\n        oxirgi_bosish = millis();\n        if (holat == TOXTAGAN) { boshlanish = millis(); holat = SANAYOTGAN; }\n        else                   { yigilgan = otgan();   holat = TOXTAGAN;   }\n        while (digitalRead(START_STOP) == LOW);   // qo'yib yuborishni kutish\n    }\n\n    if (digitalRead(RESET_TUGMA) == LOW && millis() - oxirgi_bosish > FILTR)\n    {\n        oxirgi_bosish = millis();\n        holat = TOXTAGAN;\n        yigilgan = 0;\n        while (digitalRead(RESET_TUGMA) == LOW);\n    }\n\n    // --- ko'rsatish (har 100 ms da) ---\n    static unsigned long oxirgi_chiqish = 0;\n    if (millis() - oxirgi_chiqish >= 100)\n    {\n        oxirgi_chiqish = millis();\n        unsigned long t = otgan();\n        unsigned int  daq = t / 60000UL;\n        unsigned int  sek = (t / 1000UL) % 60;\n        unsigned int  yuz = (t % 1000UL) / 10;\n\n        Serial.print(daq < 10 ? \"0\" : \"\"); Serial.print(daq); Serial.print(':');\n        Serial.print(sek < 10 ? \"0\" : \"\"); Serial.print(sek); Serial.print('.');\n        Serial.print(yuz < 10 ? \"0\" : \"\"); Serial.println(yuz);\n    }\n}"],
  ["h","Formatlash mantiqi"],
  ["t",["Kattalik","Hisoblash","Namuna (t = 93 456 ms)"],[
   ["Daqiqa","t / 60000","1"],["Sekund","(t / 1000) % 60","33"],
   ["Yuzdan bir","(t % 1000) / 10","45"],["Natija","—","01:33.45"]
  ]],
  ["h","Aniqlikni baholash"],
  ["p","millis() ning aniqligi plata kvarts rezonatorining aniqligi bilan belgilanadi. 16 MHz kvartsning tipik xatosi ±50 ppm ni tashkil qiladi — bu bir soatda taxminan 0,18 sekund og'ish degani. Qisqa o'lchashlar uchun bu xato ahamiyatsiz, uzoq muddatli soat uchun esa alohida aniq vaqt moduli (RTC) ishlatiladi."],
  ["n","millis() taxminan 49,7 kunda to'lib ketadi va noldan boshlanadi. Vaqt farqini unsigned long turi bilan hisoblash (millis() − oldingi) bu holatda ham to'g'ri natija beradi — shuning uchun vaqtni doim farq sifatida hisoblash kerak, bevosita taqqoslash emas."],
  ["sim","timer"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Ikkita tugmani D2 va D3 ga ulang, sxemani chizing va INPUT_PULLUP rejimida sozlang.",
   "Sekundomer dasturini yuklang; start, stop va davom ettirish funksiyalarini tekshiring.",
   "Ko'rsatkichni etalon sekundomer (telefon) bilan 60 sekund davomida solishtiring va farqni yozing.",
   "Variant raqamingiz N bo'lsin: ko'rsatishni yangilash davrini (50 + 10·N) ms qiling va farqni kuzating.",
   "Natijani LCD ga chiqaruvchi qismni qo'shing.",
   "Oraliq natijani saqlash (lap) funksiyasini uchinchi tugma bilan qo'shing.",
   "Sxema va o'lchash natijalari rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Sekundomer holatlar mashinasi sifatida qurilganda mantiq aniq va kengaytirishga qulay bo'ladi. Vaqt millis() farqi orqali hisoblanadi, pauzadan keyin davom ettirish uchun esa avvalgi qismlar yig'ib boriladi. O'lchash aniqligi kvarts rezonatorining barqarorligi bilan cheklanadi."]
 ],
 tests:[
  {q:"Sekundomerda vaqt nima uchun millis() bilan o'lchanadi?",o:["Aniqroq bo'lgani uchun","delay() dasturni bloklab, tugmalarni o'qishga imkon bermagani uchun","Xotira tejagani uchun","Kod qisqargani uchun"],a:1,e:"millis() bloklamaydi va boshqa vazifalar bajarilaveradi."},
  {q:"Holatlar mashinasi yondashuvining afzalligi nimada?",o:["Tezligida","Mantiqning aniq va kengaytirishga qulay bo'lishida","Xotira tejashda","Tok kamayishida"],a:1,e:"Holatlar va o'tishlar aniq ajratiladi."},
  {q:"Pauzadan keyin davom ettirish uchun nima kerak?",o:["Hech nima","Avvalgi qismlarni yig'ib borish","Reset qilish","Taymerni o'chirish"],a:1,e:"yigilgan o'zgaruvchisiga avvalgi vaqt qo'shiladi."},
  {q:"t = 93456 ms bo'lsa sekundlar qismi qancha?",o:["33","93","56","1"],a:0,e:"(93456/1000) % 60 = 33."},
  {q:"Yuzdan bir ulush qanday hisoblanadi?",o:["t % 100","(t % 1000) / 10","t / 100","t % 10"],a:1,e:"Millisekund qoldig'i 10 ga bo'linadi."},
  {q:"millis() taxminan qancha vaqtda to'lib ketadi?",o:["24 soat","49,7 kun","1 yil","Hech qachon"],a:1,e:"32 razryadli hisoblagich chegarasi."},
  {q:"To'lib ketish muammosining oldini olish uchun nima qilinadi?",o:["Qurilmani qayta ishga tushirish","Vaqtni har doim farq sifatida hisoblash","Taymerni o'chirish","int turini ishlatish"],a:1,e:"unsigned long farqi to'lib ketganda ham to'g'ri qoladi."},
  {q:"16 MHz kvartsning tipik xatosi qancha?",o:["±1 ppm","±50 ppm","±1000 ppm","±5 %"],a:1,e:"Bir soatda taxminan 0,18 s og'ish beradi."},
  {q:"Uzoq muddatli aniq vaqt uchun nima ishlatiladi?",o:["Katta kondensator","Alohida RTC moduli","Ko'proq LED","Tezroq protsessor"],a:1,e:"RTC o'z kvarts va batareyasiga ega."},
  {q:"static unsigned long oxirgi_chiqish o'zgaruvchisi nima uchun static?",o:["Tezlik uchun","Funksiya chaqiriqlari orasida qiymati saqlanishi uchun","Xotira uchun","Xatolik"],a:1,e:"static o'zgaruvchi loop() qayta chaqirilganda ham qiymatini yo'qotmaydi."}
 ]
},

  ["p","Mikrokontroller dasturi kompyuter dasturidan tubdan farq qiladi: u tugamaydi, operatsion tizimga tayanmaydi va cheklangan resurslar bilan ishlaydi. Dastur ikki qismdan iborat: bir marta bajariladigan boshlang'ich sozlash va cheksiz takrorlanadigan asosiy sikl."],

{
 id:"S2-L5", sem:2, week:5, type:"lab", no:5,
 title:"Arduino qurilmasida taymer qurilmasini loyihalash",
 goal:"Teskari sanoq taymerini loyihalash, vaqtni tugmalar bilan sozlash va tugaganda signal berishni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","Tugmalar 3 dona","Zumzuma yoki LED","LCD 16×2 (ixtiyoriy)","Rezistorlar va simlar"],
 plan:["Sekundomer va taymer farqi","Vaqtni sozlash","Teskari sanoq","Tugash signali","Apparat taymer uzilishi","Aniqlikni oshirish"],
 body:[
  ["h","Nazariy qism"],
  ["p","Sekundomer o'tgan vaqtni oldinga sanaydi, taymer esa berilgan vaqtdan noldan tomon teskari sanaydi va nolga yetganda hodisa hosil qiladi. Loyihalash nuqtai nazaridan farq kichik, ammo taymerda qo'shimcha ikki vazifa paydo bo'ladi: boshlang'ich vaqtni kiritish va tugash signalini berish."],
  ["f","qolgan = belgilangan − (millis() − boshlanish)","Teskari sanoq formulasi; natija manfiy bo'lib ketmasligi uchun tekshiriladi."],
  ["h","Dastur"],
  ["c","const int START = 2, PLUS = 3, MINUS = 4;\nconst int ZUMZUMA = 8;\n\nenum Holat { SOZLASH, SANASH, TUGADI };\nHolat holat = SOZLASH;\n\nunsigned long belgilangan = 60000UL;   // 60 s\nunsigned long boshlanish  = 0;\nunsigned long oxirgi = 0;\nconst unsigned long FILTR = 30;\n\nbool bosildi(int pin)\n{\n    if (digitalRead(pin) == LOW && millis() - oxirgi > FILTR)\n    {\n        oxirgi = millis();\n        while (digitalRead(pin) == LOW);\n        return true;\n    }\n    return false;\n}\n\nvoid setup()\n{\n    pinMode(START, INPUT_PULLUP);\n    pinMode(PLUS,  INPUT_PULLUP);\n    pinMode(MINUS, INPUT_PULLUP);\n    pinMode(ZUMZUMA, OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    switch (holat)\n    {\n        case SOZLASH:\n            if (bosildi(PLUS))  belgilangan += 10000UL;            // +10 s\n            if (bosildi(MINUS) && belgilangan > 10000UL)\n                                belgilangan -= 10000UL;\n            if (bosildi(START)) { boshlanish = millis(); holat = SANASH; }\n            break;\n\n        case SANASH:\n        {\n            unsigned long otgan = millis() - boshlanish;\n            if (otgan >= belgilangan) { holat = TUGADI; break; }\n            unsigned long qolgan = belgilangan - otgan;\n            static unsigned long oxirgi_chiqish = 0;\n            if (millis() - oxirgi_chiqish >= 250)\n            {\n                oxirgi_chiqish = millis();\n                Serial.print(\"Qolgan: \");\n                Serial.print(qolgan / 60000UL); Serial.print(':');\n                Serial.println((qolgan / 1000UL) % 60);\n            }\n            if (bosildi(START)) holat = SOZLASH;    // bekor qilish\n            break;\n        }\n\n        case TUGADI:\n            for (int i = 0; i < 6; i++)\n            {\n                digitalWrite(ZUMZUMA, HIGH); delay(200);\n                digitalWrite(ZUMZUMA, LOW);  delay(200);\n            }\n            Serial.println(\"Vaqt tugadi\");\n            holat = SOZLASH;\n            break;\n    }\n}"],
  ["h","Apparat taymer uzilishi bilan variant"],
  ["p","millis() ga tayanish ko'p vazifalarda yetarli, ammo aniq davriy amallar uchun apparat taymer uzilishi afzal. ATmega328P da Timer1 ni sozlab, aniq 1 sekundlik uzilish olish mumkin."],
  ["c","volatile unsigned int sekundlar = 0;\n\nvoid setup()\n{\n    noInterrupts();\n    TCCR1A = 0;\n    TCCR1B = 0;\n    TCNT1  = 0;\n    OCR1A  = 15624;              // 16 MHz / 1024 / 1 Hz - 1\n    TCCR1B |= (1 << WGM12);      // CTC rejimi\n    TCCR1B |= (1 << CS12) | (1 << CS10);   // bo'luvchi 1024\n    TIMSK1 |= (1 << OCIE1A);     // solishtirish uzilishiga ruxsat\n    interrupts();\n}\n\nISR(TIMER1_COMPA_vect)           // har sekundda bir marta\n{\n    sekundlar++;\n}"],
  ["p","volatile kalit so'zi majburiy: u kompilyatorga o'zgaruvchi uzilishda o'zgarishi mumkinligini bildiradi va optimizatsiya tufayli eski qiymat ishlatilishining oldini oladi. OCR1A qiymati 16 MHz, bo'luvchi 1024 va 1 Hz uchun hisoblangan."],
  ["f","OCR1A = f_osc / (K · f_kerakli) − 1","16 000 000 / (1024 · 1) − 1 = 15 624."],
  ["n","Uzilish xizmat qism dasturi ichida Serial.print() yoki delay() ishlatish tavsiya etilmaydi: ular uzoq bajariladi va boshqa uzilishlarni kechiktiradi. ISR ichida faqat bayroq yoki hisoblagichni o'zgartirib, asosiy ishni loop() da bajarish to'g'ri yondashuv hisoblanadi."],
  ["sim","timer"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Uchta tugma va zumzumani ulang, sxemani chizing.",
   "Taymer dasturini yuklang; vaqtni sozlash, ishga tushirish va bekor qilishni tekshiring.",
   "Variant raqamingiz N bo'lsin: sozlash qadamini (5 + N) sekund qilib o'zgartiring.",
   "60 sekundlik oraliqni etalon soat bilan solishtiring va xatoni hisoblang.",
   "Timer1 uzilishi asosidagi variantni yozing va millis() varianti bilan aniqlik bo'yicha taqqoslang.",
   "OCR1A qiymatini 2 Hz uzilish uchun qayta hisoblang va tekshiring.",
   "Natijani LCD ga chiqaruvchi qismni qo'shing.",
   "Sxema va Serial Monitor rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Taymer qurilmasi sozlash, teskari sanoq va tugash holatlaridan iborat holatlar mashinasi sifatida quriladi. millis() asosidagi yechim sodda va ko'p vazifalar uchun yetarli, apparat taymer uzilishi esa aniqroq va protsessordan mustaqil ishlaydi. Uzilishda o'zgaradigan o'zgaruvchilar volatile deb e'lon qilinishi, ISR esa imkon qadar qisqa bo'lishi shart."]
 ],
 tests:[
  {q:"Taymer sekundomerdan nimasi bilan farq qiladi?",o:["Aniqroq","Belgilangan vaqtdan noldan tomon teskari sanaydi","Tugma talab qilmaydi","Xotira ishlatmaydi"],a:1,e:"Nolga yetganda hodisa hosil qiladi."},
  {q:"Qolgan vaqt qanday hisoblanadi?",o:["millis() + belgilangan","belgilangan − (millis() − boshlanish)","millis() / belgilangan","belgilangan + boshlanish"],a:1,e:"O'tgan vaqt belgilangan qiymatdan ayiriladi."},
  {q:"CTC rejimi nima uchun ishlatiladi?",o:["PWM uchun","Solishtirish qiymatiga yetganda taymerni nollab uzilish berish uchun","Quvvat tejash uchun","ADC uchun"],a:1,e:"Clear Timer on Compare — aniq davriy uzilish beradi."},
  {q:"16 MHz, bo'luvchi 1024 va 1 Hz uchun OCR1A qancha?",o:["1023","15624","62500","65535"],a:1,e:"16 000 000/(1024·1) − 1 = 15 624."},
  {q:"2 Hz uzilish uchun OCR1A qiymati qanday bo'ladi?",o:["7811","15624","31249","62500"],a:0,e:"16 000 000/(1024·2) − 1 = 7811."},
  {q:"volatile kalit so'zi nima uchun kerak?",o:["Tezlik uchun","O'zgaruvchi uzilishda o'zgarishini kompilyatorga bildirish uchun","Xotira tejash uchun","Xatolikni oldini olish uchun faqat"],a:1,e:"Aks holda optimizatsiya eski qiymatni ishlatishi mumkin."},
  {q:"ISR ichida nima qilish tavsiya etilmaydi?",o:["Hisoblagichni oshirish","Serial.print() va delay() ishlatish","Bayroq o'rnatish","Registr o'qish"],a:1,e:"Uzun amallar boshqa uzilishlarni kechiktiradi."},
  {q:"TIMSK1 registri nimani boshqaradi?",o:["Bo'luvchini","Taymer uzilishiga ruxsatni","Portni","ADC ni"],a:1,e:"OCIE1A biti solishtirish uzilishini yoqadi."},
  {q:"noInterrupts() funksiyasi nima qiladi?",o:["Taymerni o'chiradi","Uzilishlarni vaqtincha taqiqlaydi","Portni tozalaydi","Dasturni to'xtatadi"],a:1,e:"Sozlash paytida uzilish kelib qolmasligi uchun."},
  {q:"Apparat taymer uzilishining millis() dan afzalligi nimada?",o:["Kod qisqaroq","Aniqroq va protsessor yuklamasidan mustaqil ishlashi","Xotira tejashi","Tugma kerak emasligi"],a:1,e:"Uzilish davri asosiy sikl bajarilishiga bog'liq emas."}

{
 id:"S2-L6", sem:2, week:6, type:"lab", no:6,
 title:"Arduino qurilmasida svetofor qurilmasini loyihalash",
 goal:"Ko'p fazali vaqt diagrammasiga ega boshqarish qurilmasini holatlar mashinasi asosida loyihalash.",
 equip:["Arduino Uno va USB kabel","LED: qizil, sariq, yashil (2 to'plam)","Rezistor 330 Ω — 6 dona","Tugma (piyoda uchun)","Maket plata va simlar"],
 plan:["Svetofor algoritmi","Fazalar diagrammasi","Holatlar mashinasi","Bloklanmaydigan amalga oshirish","Piyoda rejimi","Ikki yo'nalishli svetofor"],
 body:[
  ["h","Nazariy qism"],
  ["p","Svetofor — belgilangan vaqt diagrammasi bo'yicha ishlaydigan ko'p fazali boshqarish qurilmasi. U real avtomatlashtirish masalalarining klassik namunasi: fazalar ketma-ketligi qat'iy, har birining davomiyligi belgilangan va tashqi hodisa (piyoda tugmasi) siklga aralasha oladi."],
  ["t",["Faza","Chiroqlar","Davomiyligi","Kod (Q S Y)"],[
   ["1","Qizil","5 s","1 0 0"],["2","Qizil + sariq","2 s","1 1 0"],
   ["3","Yashil","4 s","0 0 1"],["4","Yashil miltillash","2 s","0 0 ~"],["5","Sariq","2 s","0 1 0"]
  ]],
  ["h","Bloklanmaydigan amalga oshirish"],
  ["p","delay() bilan yozilgan svetofor ishlaydi, lekin piyoda tugmasini o'qiy olmaydi: dastur kechikish ichida qotib turadi. Shuning uchun fazalar millis() va holatlar mashinasi orqali amalga oshiriladi — bu real boshqarish qurilmalarining standart yondashuvi."],
  ["c","const int QIZIL = 8, SARIQ = 9, YASHIL = 10;\nconst int TUGMA = 2;\n\nstruct Faza { byte q, s, y; unsigned long vaqt; };\n\nFaza fazalar[] = {\n    {1, 0, 0, 5000},   // qizil\n    {1, 1, 0, 2000},   // qizil + sariq\n    {0, 0, 1, 4000},   // yashil\n    {0, 1, 0, 2000}    // sariq\n};\nconst int FAZA_SONI = 4;\n\nint faza = 0;\nunsigned long faza_boshi = 0;\nbool sorov = false;      // piyoda so'rovi\n\nvoid fazani_qoy(int i)\n{\n    digitalWrite(QIZIL,  fazalar[i].q);\n    digitalWrite(SARIQ,  fazalar[i].s);\n    digitalWrite(YASHIL, fazalar[i].y);\n}\n\nvoid setup()\n{\n    pinMode(QIZIL, OUTPUT); pinMode(SARIQ, OUTPUT); pinMode(YASHIL, OUTPUT);\n    pinMode(TUGMA, INPUT_PULLUP);\n    faza_boshi = millis();\n    fazani_qoy(0);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    // tugma har doim o'qiladi — dastur bloklanmagan\n    if (digitalRead(TUGMA) == LOW) sorov = true;\n\n    unsigned long davom = fazalar[faza].vaqt;\n\n    // piyoda so'ragan bo'lsa yashil fazani qisqartiramiz\n    if (sorov && faza == 2) davom = 1500;\n\n    if (millis() - faza_boshi >= davom)\n    {\n        faza = (faza + 1) % FAZA_SONI;\n        faza_boshi = millis();\n        fazani_qoy(faza);\n        if (faza == 0) sorov = false;    // qizil fazaga o'tildi, so'rov bajarildi\n        Serial.print(\"Faza: \"); Serial.println(faza + 1);\n    }\n}"],
  ["p","Fazalar massiv va struktura ko'rinishida saqlangani uchun yangi faza qo'shish yoki vaqtni o'zgartirish faqat jadvalni tahrirlashdan iborat — kod mantiqiga tegish kerak emas. Bu yondashuv sanoat kontrollerlarida keng qo'llanadi."],
  ["n","Xavfsizlik mantiqi: ikki yo'nalishli svetoforda hech qachon ikkala yo'nalishda bir vaqtda yashil yonmasligi kerak. Shuning uchun fazalar jadvali ikkala yo'nalish uchun birga tuziladi va oraliq qizil faza (hamma yo'nalish qizil) qo'shiladi."],
  ["h","Ikki yo'nalishli svetofor"],
  ["t",["Faza","A yo'nalish","B yo'nalish","Vaqt"],[
   ["1","Yashil","Qizil","6 s"],["2","Sariq","Qizil","2 s"],
   ["3","Qizil","Qizil","1 s"],["4","Qizil","Yashil","6 s"],
   ["5","Qizil","Sariq","2 s"],["6","Qizil","Qizil","1 s"]
  ]],
  ["h","Interaktiv qism"],
  ["sim","traffic"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Uchta LED ni D8–D10 ga rezistorlar orqali ulang va sxemani chizing.",
   "Fazalar jadvali asosidagi dasturni yuklang va vaqtlarni ossillograf yoki sekundomer bilan tekshiring.",
   "Variant raqamingiz N bo'lsin: yashil faza davomiyligini (4 + N) sekund qiling.",
   "Piyoda tugmasini qo'shing va so'rov bajarilishini kuzating.",
   "Yashil fazaning oxirgi 2 sekundida miltillash rejimini qo'shing.",
   "Ikki yo'nalishli svetoforni oltita LED bilan amalga oshiring va xavfsizlik shartini tekshiring.",
   "delay() va millis() variantlarini tugmaga javob berish nuqtai nazaridan taqqoslang.",
   "Sxema va ishlayotgan qurilma rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Svetofor fazalar jadvali va holatlar mashinasi asosida qurilganda kod tartibli bo'ladi va vaqtlarni o'zgartirish faqat jadvalni tahrirlashdan iborat. millis() asosidagi bloklanmaydigan yondashuv tashqi hodisalarga (piyoda tugmasi) javob berish imkonini beradi. Ko'p yo'nalishli tizimda xavfsizlik sharti — bir vaqtda ikki yashil bo'lmasligi — jadval tuzilishida ta'minlanadi."]
 ],
 tests:[
  {q:"Nima uchun svetofor dasturida delay() tavsiya etilmaydi?",o:["Aniq emasligi uchun","Dastur bloklanib, tugmani o'qiy olmagani uchun","Xotira sarflagani uchun","Kod uzayishi uchun"],a:1,e:"delay() ichida boshqa hech nima bajarilmaydi."},
  {q:"Fazalarni massiv va struktura ko'rinishida saqlashning afzalligi nimada?",o:["Tezroq ishlaydi","Vaqt va fazalarni o'zgartirish faqat jadvalni tahrirlashdan iborat bo'lishi","Kam tok sarflashi","Xotira tejashi"],a:1,e:"Kod mantiqiga tegmasdan konfiguratsiya o'zgartiriladi."},
  {q:"faza = (faza + 1) % FAZA_SONI ifodasi nima qiladi?",o:["Fazani oshiradi va oxiriga yetganda boshiga qaytaradi","Fazani nollaydi","Fazani ikki barobar oshiradi","Xatolik beradi"],a:0,e:"Modul amali doiraviy o'tishni ta'minlaydi."},
  {q:"Piyoda so'rovi qanday qayd etiladi?",o:["Fazani darhol o'zgartirib","Bayroq o'zgaruvchisiga yozib, keyin hisobga olinadi","Dasturni to'xtatib","Uzilish bilan faqat"],a:1,e:"So'rov saqlanadi va mos fazada qo'llanadi."},
  {q:"Ikki yo'nalishli svetoforda asosiy xavfsizlik sharti nima?",o:["Sariq har doim yonishi","Hech qachon ikkala yo'nalishda bir vaqtda yashil bo'lmasligi","Qizil eng uzun bo'lishi","Vaqtlar teng bo'lishi"],a:1,e:"Aks holda to'qnashuv xavfi paydo bo'ladi."},
  {q:"Oraliq \"hamma qizil\" fazasi nima uchun kerak?",o:["Quvvat tejash uchun","Kesishmani bo'shatish uchun xavfsizlik oralig'i","Indikatsiya uchun","Tugmani o'qish uchun"],a:1,e:"Yo'nalishlar almashishida xavfsizlik zaxirasi beradi."},
  {q:"millis() - faza_boshi >= davom sharti nimani tekshiradi?",o:["Tugma bosilganini","Joriy faza vaqti tugaganini","Quvvatni","Xatolikni"],a:1,e:"Vaqt farqi faza davomiyligiga yetganda keyingi fazaga o'tiladi."},
  {q:"Yashil miltillash fazasi nima vazifani bajaradi?",o:["Chiroqni tejash","Yashil tugayotganini oldindan ogohlantirish","Tugmani tekshirish","Vaqt o'lchash"],a:1,e:"Haydovchiga faza tugashi haqida signal beradi."},
  {q:"struct Faza tuzilmasi nima uchun ishlatilgan?",o:["Tezlik uchun","Bir fazaga oid chiroq holatlari va vaqtni bitta yozuvda saqlash uchun","Xotira uchun","Uzilish uchun"],a:1,e:"Bog'liq ma'lumotlar birga saqlanadi."},
  {q:"Fazalar jadvaliga yangi faza qo'shish uchun nima o'zgartiriladi?",o:["Butun mantiq","Faqat massiv va FAZA_SONI qiymati","Portlar","Setup funksiyasi"],a:1,e:"Jadval asosidagi yondashuvning asosiy afzalligi shunda."}
 ]
},
{
 id:"S2-M22", sem:2, week:7, type:"lecture", no:22,
 title:"Dolzarb operatsion tizimlar va qobiqlar. Servis tizimlar",
 goal:"Real vaqt operatsion tizimlarining tuzilishini, vazifalarni rejalashtirishni va servis dasturlarining vazifasini o'zlashtirish.",
 outcomes:[
  "Real vaqt operatsion tizimining zarurligini asoslay oladi",
  "Vazifa, prioritet va rejalashtiruvchi tushunchalarini tushuntira oladi",
  "Vazifalar o'rtasidagi o'zaro ta'sir vositalarini farqlay oladi",
  "Servis tizimlari va qobiqlarning vazifasini izohlay oladi"
 ],
 plan:["Nima uchun operatsion tizim kerak","Real vaqt tushunchasi","RTOS tuzilishi","Vazifalarni rejalashtirish","Vazifalar o'rtasidagi aloqa","Qobiqlar va servis tizimlari"],
 body:[
  ["h","Nima uchun operatsion tizim kerak"],
  ["p","Oddiy super loop tuzilmasida barcha vazifalar ketma-ket bajariladi va har biri keyingisini kutadi. Vazifalar soni ortib, ularning davriyligi va muhimligi har xil bo'lganda bunday tuzilma boshqarib bo'lmas holga keladi: bitta uzoq amal boshqa vazifalarning muddatini buzadi."],
  ["p","Real vaqt operatsion tizimi (RTOS) shu muammoni hal qiladi: har bir vazifa alohida dastur kabi yoziladi, ularni navbat bilan bajarish va prioritetlarni hisobga olish esa rejalashtiruvchi (scheduler) zimmasiga tushadi."],
  ["fig","rtos","1-rasm. Vazifalarni prioritet bo'yicha rejalashtirish diagrammasi"],
  ["h","Real vaqt tushunchasi"],
  ["t",["Turi","Muddat buzilsa","Namuna"],[
   ["Qattiq real vaqt","Avariya, tizim ishdan chiqadi","Dvigatel boshqaruvi, xavfsizlik tizimlari"],
   ["Qat'iy real vaqt","Natija foydasiz bo'lib qoladi","Radar ma'lumotini qayta ishlash"],
   ["Yumshoq real vaqt","Sifat pasayadi, ish davom etadi","Indikator yangilanishi, tovush"]
  ]],
  ["p","Muhim nuqta: real vaqt tizimi eng tez tizim degani emas. U natijani kafolatlangan vaqt ichida beradigan tizim. Shuning uchun RTOS da eng yomon holatdagi javob vaqti (worst-case) hisoblanadi va u talab qilingan muddatdan kichik bo'lishi tekshiriladi."],
  ["h","RTOS ning asosiy tushunchalari"],
  ["ul",[
   "Vazifa (task) — mustaqil bajariladigan dastur bo'lagi, o'z steki va holatiga ega",
   "Vazifa holatlari — bajarilmoqda, tayyor, bloklangan, to'xtatilgan",
   "Prioritet — vazifaning muhimligi; yuqori prioritetli vazifa pastini uzib qo'ya oladi",
   "Rejalashtiruvchi — qaysi vazifa hozir bajarilishini tanlaydi",
   "Kontekstni almashtirish — joriy vazifa registrlari saqlanib, yangisiniki tiklanadi",
   "Tizim takti (tick) — taymer uzilishi, rejalashtiruvchining vaqt asosi"
  ]],
  ["t",["Rejalashtirish usuli","Mohiyati","Xususiyati"],[
   ["Kooperativ","Vazifa boshqaruvni o'zi qaytaradi","Sodda, lekin bitta vazifa hammani bloklashi mumkin"],
   ["Vaqt kvanti bo'yicha (round-robin)","Har bir vazifaga teng vaqt beriladi","Adolatli, real vaqt kafolati yo'q"],
   ["Prioritet bo'yicha uzuvchi","Yuqori prioritetli vazifa darhol bajariladi","Real vaqt tizimlarining asosiy usuli"]
  ]],
  ["h","Vazifalar o'rtasidagi aloqa"],
  ["p","Bir necha vazifa bitta resursdan (port, interfeys, bufer) foydalanganda ularning ishini muvofiqlashtirish kerak bo'ladi. Buning uchun RTOS maxsus vositalarni taqdim etadi."],
  ["ul",[
   "Semafor — resursdan bir vaqtda faqat bitta vazifa foydalanishini ta'minlaydi",
   "Muteks — semaforning maxsus turi, resursni qulflash uchun",
   "Xabarlar navbati (queue) — vazifalar o'rtasida ma'lumot uzatish",
   "Hodisa bayroqlari — vazifani hodisa yuz berguncha bloklash",
   "Tanqidiy soha — uzilishlar vaqtincha taqiqlanadigan qisqa kod bo'lagi"
  ]],
  ["n","Prioritet inversiyasi — RTOS dagi klassik muammo: past prioritetli vazifa resursni band qilganda, yuqori prioritetli vazifa uni kutishga majbur bo'ladi. Yechim sifatida prioritetni vaqtincha ko'tarish (priority inheritance) mexanizmi qo'llanadi."],
  ["h","Mikrokontrollerlar uchun RTOS"],
  ["p","Kichik mikrokontrollerlar uchun yengil RTOS lar ishlatiladi: FreeRTOS, uC/OS, ChibiOS, Zephyr. Ular bir necha kilobayt Flash va yuzlab bayt SRAM talab qiladi. Har bir vazifa o'z stekiga ega bo'lgani uchun SRAM sarfi vazifalar soniga proporsional ortadi."],
  ["c","/* FreeRTOS uslubidagi tuzilma */\nvoid vOlchash(void *p)      { for(;;) { olchash(); vTaskDelay(100); } }\nvoid vIndikatsiya(void *p)  { for(;;) { ekran(); vTaskDelay(500); } }\n\nint main(void)\n{\n    sozlash();\n    xTaskCreate(vOlchash,     \"olch\", 128, NULL, 3, NULL);   /* prioritet 3 */\n    xTaskCreate(vIndikatsiya, \"ekr\",  128, NULL, 1, NULL);   /* prioritet 1 */\n    vTaskStartScheduler();\n    for(;;);\n}"],
  ["p","vTaskDelay() funksiyasi delay() dan tubdan farq qiladi: u protsessorni bo'shatadi va shu vaqt ichida boshqa vazifalar bajariladi. Aynan shu xususiyat RTOS ning asosiy afzalligi hisoblanadi."],
  ["h","Qobiqlar va servis tizimlari"],
  ["t",["Vosita","Vazifasi"],[
   ["Monitor dasturi","Kristalldagi eng sodda qobiq: xotirani ko'rish, o'zgartirish, dasturni ishga tushirish"],
   ["Bootloader","Yangi dasturni interfeys orqali qabul qilib, Flash ga yozadi"],
   ["Buyruqlar qobig'i (CLI)","UART orqali matnli buyruqlar bilan qurilmani boshqarish"],
   ["Diagnostika moduli","O'z-o'zini tekshirish: xotira, datchiklar, interfeyslar"],
   ["Konfiguratsiya xizmati","Sozlamalarni EEPROM da saqlash va tiklash"],
   ["Jurnal (log) xizmati","Hodisalar va xatolarni qayd etish"]
  ]],
  ["p","Servis tizimlari qurilmaning asosiy vazifasiga bevosita aloqador bo'lmasa-da, uni ishga tushirish, sozlash va nosozlikni topishni sezilarli osonlashtiradi. Ishlab chiqarishda esa ular sinov va kalibrlash jarayonining asosi bo'lib xizmat qiladi."],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Vazifalar soni va ularning vaqt talablari ortganda super loop tuzilmasi yetarli bo'lmay qoladi va real vaqt operatsion tizimiga ehtiyoj tug'iladi. RTOS vazifalarni prioritet bo'yicha rejalashtiradi, ular o'rtasidagi aloqani semafor va navbatlar orqali tashkil qiladi. Servis tizimlari — monitor, bootloader, CLI va diagnostika — qurilmani sozlash va xizmat ko'rsatishni osonlashtiradi."]
 ],
 tests:[
  {q:"Real vaqt tizimi nima?",o:["Eng tez ishlaydigan tizim","Natijani kafolatlangan vaqt ichida beradigan tizim","Uzilishsiz tizim","Ko'p yadroli tizim"],a:1,e:"Muhimi tezlik emas, muddatning kafolatlanishi."},
  {q:"Qattiq real vaqt tizimida muddat buzilsa nima bo'ladi?",o:["Sifat pasayadi","Avariya holati yuzaga keladi","Hech nima","Tizim sekinlashadi"],a:1,e:"Masalan dvigatel yoki xavfsizlik tizimlarida."},
  {q:"Rejalashtiruvchi (scheduler) nima qiladi?",o:["Kodni kompilyatsiya qiladi","Qaysi vazifa hozir bajarilishini tanlaydi","Xotirani tozalaydi","Uzilishni o'chiradi"],a:1,e:"Prioritet va holatlarga qarab vazifa tanlanadi."},
  {q:"Kontekstni almashtirish nimani anglatadi?",o:["Dasturni almashtirish","Joriy vazifa registrlarini saqlab, yangisiniki tiklash","Xotirani ko'chirish","Portni o'zgartirish"],a:1,e:"Shu tufayli vazifa uzilgan joydan davom etadi."},
  {q:"Prioritet bo'yicha uzuvchi rejalashtirishning xususiyati nima?",o:["Har kimga teng vaqt","Yuqori prioritetli vazifa pastini uzib, darhol bajariladi","Vazifa o'zi boshqaruvni qaytaradi","Tasodifiy tanlov"],a:1,e:"Real vaqt tizimlarining asosiy usuli."},
  {q:"Semafor nima uchun ishlatiladi?",o:["Vaqtni o'lchash","Resursdan bir vaqtda faqat bitta vazifa foydalanishini ta'minlash","Kod tezligini oshirish","Xotira ajratish"],a:1,e:"Umumiy resursga kirishni muvofiqlashtiradi."},
  {q:"Prioritet inversiyasi muammosi nima?",o:["Prioritetlar teskari yozilishi","Past prioritetli vazifa resursni band qilib, yuqorisini kutishga majbur qilishi","Vazifa o'chib qolishi","Xotira to'lishi"],a:1,e:"Yechim — prioritetni vaqtincha ko'tarish."},
  {q:"vTaskDelay() delay() dan nimasi bilan farq qiladi?",o:["Aniqroq","Protsessorni bo'shatib, boshqa vazifalarga imkon beradi","Tezroq","Xotira tejaydi"],a:1,e:"Kutish davomida boshqa vazifalar bajariladi."},
  {q:"RTOS da SRAM sarfi nimaga proporsional ortadi?",o:["Kod hajmiga","Vazifalar soniga (har birining o'z steki bor)","Chastotaga","Uzilishlar soniga"],a:1,e:"Har bir vazifaga alohida stek ajratiladi."},
  {q:"Bootloader qanday servis vazifasini bajaradi?",o:["Xotirani tozalaydi","Interfeys orqali kelgan yangi dasturni Flash ga yozadi","Datchiklarni o'qiydi","Ekranga chiqaradi"],a:1,e:"Tashqi programmatorsiz yangilash imkonini beradi."}
 ]

{
 id:"S2-L7", sem:2, week:7, type:"lab", no:7,
 title:"7 segmentli indikatorga berilgan axborotni chiqarish",
 goal:"7-segmentli indikatorning ulash sxemalarini, segment kodlarini va dinamik indikatsiya usulini o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","7-segmentli indikator (1 va 4 razryadli)","Rezistor 220–330 Ω — 8 dona","Tranzistorlar (razryad kalitlari uchun)","Maket plata va simlar"],
 plan:["Indikator tuzilishi","Umumiy anod va katod","Segment kodlari","Statik indikatsiya","Dinamik indikatsiya","Ko'p razryadli son chiqarish"],
 body:[
  ["h","Nazariy qism"],
  ["p","7-segmentli indikator yettita chiziqli segment (a…g) va nuqtadan (dp) iborat. Har bir segment alohida LED bo'lib, kerakli segmentlar kombinatsiyasini yoqish orqali 0 dan 9 gacha raqamlar va ba'zi harflar hosil qilinadi."],
  ["fig","seg7w","1-rasm. 7-segmentli indikatorning ulanish sxemasi va dinamik indikatsiya"],
  ["t",["Ulanish turi","Umumiy chiqish","Segment yonadi","Kod"],[

   ["Umumiy anod","+5 V ga ulanadi","Segmentga 0 berilganda","Inversiyalangan"]

  ["p","Har bir segment uchun tok cheklovchi rezistor majburiy. Sakkizta segment bir vaqtda yonganda umumiy tok 8 · 10 mA = 80 mA ga yetadi, shuning uchun ko'p razryadli indikatorda razryadlar tranzistor kalitlari orqali ulanadi."],
  ["h","Segment kodlari"],
  ["c","/* Umumiy katod uchun kodlar: bitlar dp g f e d c b a tartibida */\nconst byte kod[10] = {\n    0x3F, // 0 : a b c d e f\n    0x06, // 1 : b c\n    0x5B, // 2 : a b g e d\n    0x4F, // 3 : a b g c d\n    0x66, // 4 : f g b c\n    0x6D, // 5 : a f g c d\n    0x7D, // 6 : a f g e d c\n    0x07, // 7 : a b c\n    0x7F, // 8 : barcha segmentlar\n    0x6F  // 9 : a b c d f g\n};\n/* Umumiy anod uchun: ~kod[i] (inversiya) */"],
  ["h","Statik indikatsiya"],
  ["c","const int segment[8] = {2,3,4,5,6,7,8,9};   // a,b,c,d,e,f,g,dp\n\nvoid setup()\n{\n    for (int i = 0; i < 8; i++) pinMode(segment[i], OUTPUT);\n}\n\nvoid raqam_chiqar(byte n)\n{\n    byte b = kod[n];\n    for (int i = 0; i < 8; i++)\n        digitalWrite(segment[i], bitRead(b, i));\n}\n\nvoid loop()\n{\n    for (byte n = 0; n < 10; n++) { raqam_chiqar(n); delay(700); }\n}"],
  ["h","Dinamik indikatsiya"],
  ["p","To'rt razryadli indikatorda har bir razryadga alohida 8 ta liniya ajratish 32 ta chiqishni talab qiladi — bu amalda mumkin emas. Dinamik indikatsiyada segment liniyalari umumiy qilinadi, razryadlar esa navbat bilan qisqa vaqtga yoqiladi. Almashinuv 50 Hz dan tez bo'lsa, ko'z barcha razryadlarni bir vaqtda yonayotgandek qabul qiladi."],
  ["f","f_razryad = f_yangilanish · N","4 razryad va 50 Hz yangilanish uchun razryadlar 200 Hz tezlikda almashtiriladi, ya'ni har biriga 5 ms."],
  ["c","const int razryad[4] = {10, 11, 12, 13};   // razryad kalitlari\nint son = 1234;\n\nvoid loop()\n{\n    int raqamlar[4] = { son/1000, (son/100)%10, (son/10)%10, son%10 };\n\n    for (int r = 0; r < 4; r++)\n    {\n        for (int i = 0; i < 4; i++) digitalWrite(razryad[i], LOW);  // hammasini o'chirish\n        raqam_chiqar(raqamlar[r]);                                   // segment kodini qo'yish\n        digitalWrite(razryad[r], HIGH);                              // faqat bitta razryadni yoqish\n        delay(5);                                                    // 5 ms ko'rsatish\n    }\n}"],
  ["n","Razryadni yoqishdan oldin segment kodini qo'yish tartibi muhim: aks holda oldingi razryad kodi qisqa vaqtga yangi razryadda ko'rinadi va ekranda \"soyalar\" (ghosting) paydo bo'ladi. Buning oldini olish uchun razryadlar segment kodi o'zgartirilayotganda butunlay o'chiriladi."],
  ["h","Yorqinlikni hisoblash"],
  ["p","Dinamik indikatsiyada har bir razryad vaqtning faqat 1/N qismida yonadi, shuning uchun o'rtacha yorqinlik shuncha marta kamayadi. Buni qoplash uchun impuls toki oshiriladi (indikator hujjatida ruxsat etilgan impuls toki doimiy tokdan bir necha barobar katta bo'ladi) yoki yangilanish davri qisqartiriladi."],
  ["sim","seg7"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Bir razryadli indikatorni ulang va 0–9 raqamlarini ketma-ket chiqaruvchi dasturni yuklang.",
   "Umumiy anod va umumiy katod uchun kodlar farqini jadvalga yozing.",
   "Variant raqamingiz N bo'lsin: ekranda (1000 + 111·N) sonini ko'rsating.",
   "To'rt razryadli indikatorni dinamik usulda ulang va sonni chiqaring.",
   "Razryad almashtirish davrini 5 ms dan 30 ms ga oshirib, miltillash sezilishini kuzating va chegarani aniqlang.",
   "Ghosting effektini ataylab hosil qiling va uni bartaraf etish usulini izohlang.",
   "Har bir segment tokini o'lchab, umumiy tokni hisoblang.",
   "Sxema va ishlayotgan indikator rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","7-segmentli indikatorda raqam segment kodlari jadvali orqali hosil qilinadi; umumiy anod va katod sxemalari uchun kodlar bir-birining inversiyasi bo'ladi. Ko'p razryadli indikatorda dinamik usul qo'llanadi: segment liniyalari umumiy, razryadlar esa navbat bilan yoqiladi. Yangilanish chastotasi 50 Hz dan yuqori bo'lishi va razryadlar kod o'zgartirilayotganda o'chirilishi ekran sifatining asosiy shartlari hisoblanadi."]
 ],
 tests:[
  {q:"7-segmentli indikatorda nechta yorug'lik elementi bor (nuqta bilan)?",o:["7","8","9","10"],a:1,e:"Yettita segment va bitta nuqta (dp)."},
  {q:"Umumiy katodli indikatorda segment qachon yonadi?",o:["Segmentga 0 berilganda","Segmentga 1 berilganda","Har doim","Umumiy chiqish uzilganda"],a:1,e:"Umumiy chiqish GND ga ulanadi."},
  {q:"Umumiy anodli indikator uchun kodlar qanday bo'ladi?",o:["Bir xil","Umumiy katod kodlarining inversiyasi","Ikki barobar","Tasodifiy"],a:1,e:"Segment 0 berilganda yonadi."},
  {q:"0x3F kodi qaysi raqamga mos keladi?",o:["0","3","8","9"],a:0,e:"a, b, c, d, e, f segmentlari yonadi."},
  {q:"0x7F kodi nimani ko'rsatadi?",o:["0","6","8","9"],a:2,e:"Barcha yetti segment yonadi — 8 raqami."},
  {q:"Dinamik indikatsiyaning mohiyati nimada?",o:["Barcha razryadlar doimiy yonadi","Razryadlar navbat bilan qisqa vaqtga yoqiladi","Yorqinlik o'zgaradi","Segmentlar almashtiriladi"],a:1,e:"Ko'z tez almashinuvni uzluksiz deb qabul qiladi."},
  {q:"4 razryad va 50 Hz yangilanish uchun razryad almashtirish chastotasi qancha?",o:["50 Hz","100 Hz","200 Hz","400 Hz"],a:2,e:"50 · 4 = 200 Hz, har biriga 5 ms."},
  {q:"Ghosting (soya) effekti nima uchun paydo bo'ladi?",o:["Tok katta bo'lgani uchun","Segment kodi o'zgartirilayotganda razryad yoqilgan bo'lgani uchun","Chastota past bo'lgani uchun","Rezistor kichik bo'lgani uchun"],a:1,e:"Kod o'zgartirishdan oldin razryadlar o'chiriladi."},
  {q:"Dinamik indikatsiyada o'rtacha yorqinlik nega kamayadi?",o:["Tok kam bo'lgani uchun","Har bir razryad vaqtning 1/N qismida yongani uchun","Rezistor kattaligi uchun","Kod noto'g'ri bo'lgani uchun"],a:1,e:"Buni impuls tokini oshirish bilan qoplash mumkin."},
  {q:"Ko'p razryadli indikatorda razryadlar nima orqali ulanadi?",o:["Bevosita port chiqishiga","Tranzistor kalitlari orqali","Rezistor orqali faqat","Kondensator orqali"],a:1,e:"Razryad toki port chegarasidan oshadi."}

{
 id:"S2-M23", sem:2, week:8, type:"lecture", no:23,
 title:"Mikrokontrollerning qo'shimcha apparat vositalari. Mikrokontrollerlarning takt generatorlari",
 goal:"Mikrokontrollerning yordamchi tugunlarini — reset, watchdog, quvvat nazorati va takt generatorlarini o'zlashtirish.",
 outcomes:[
  "Boshlang'ich o'rnatish tugunlarining vazifasini tushuntira oladi",
  "Watchdog taymerning ishlash tartibini izohlay oladi",
  "Takt manbalarini aniqlik va narx bo'yicha qiyoslay oladi",
  "Quvvat tejash rejimlarini tanlay oladi"
 ],
 plan:["Qo'shimcha tugunlar tarkibi","Boshlang'ich o'rnatish sxemalari","Watchdog taymer","Quvvat nazorati","Takt generatorlari","Chastotani taqsimlash va PLL","Quvvat tejash rejimlari"],
 body:[
  ["h","Qo'shimcha tugunlar tarkibi"],
  ["p","Yadro va periferiyadan tashqari har bir mikrokontrollerda uning ishonchli ishlashini ta'minlovchi yordamchi tugunlar mavjud: boshlang'ich o'rnatish sxemasi, takt generatori, watchdog taymer, quvvat kuchlanishini nazorat qiluvchi sxema va quvvat tejash boshqaruvi."],
  ["h","Boshlang'ich o'rnatish (reset)"],
  ["ul",[
   "Tashqi reset — MCLR yoki RESET liniyasiga past daraja berilganda",
   "Quvvat berilgandagi reset (POR) — kuchlanish ishchi darajaga chiqqanda avtomatik",
   "Quvvat pasayishi reseti (BOR) — kuchlanish belgilangan chegaradan pastga tushganda",
   "Watchdog reseti — dastur qotib qolganda",
   "Dasturiy reset — maxsus buyruq yoki registr orqali"
  ]],
  ["p","Reset holatida barcha registrlar hujjatda ko'rsatilgan boshlang'ich qiymatlarni oladi, PC esa nolga (yoki reset vektori adresiga) o'rnatiladi. Reset sababini maxsus bitlar orqali aniqlash mumkin — bu nosozlikni topishda juda foydali: masalan qurilma watchdog tufayli qayta yuklangani aniqlansa, dasturda qotib qolish joyi borligi ma'lum bo'ladi."],
  ["n","Quvvat berilgandan keyin kvarts generatorining tebranishi barqarorlashishi uchun bir necha millisekund kerak. Shu sababli PWRTE (Power-up Timer) biti yoqiladi: u dasturning boshlanishini kechiktiradi va generator barqarorlashguncha kutadi."],
  ["h","Watchdog taymer"],
  ["p","Watchdog — mustaqil generatordan ishlaydigan taymer. Dastur uni belgilangan vaqt ichida tozalab turishi shart; tozalanmasa, taymer to'lib ketadi va tizimni qayta ishga tushiradi. Bu mexanizm dastur cheksiz siklda qotib qolgan yoki noto'g'ri adresga o'tib ketgan holatlarda qurilmani tiklaydi."],
  ["c","/* Watchdog bilan to'g'ri ishlash */\nwhile (1)\n{\n    CLRWDT();              /* asosiy sikl boshida bir marta tozalanadi */\n    tugmalarni_oqish();\n    olchash();\n    ekranni_yangilash();\n}\n/* NOTO'G'RI: CLRWDT() ni kutish sikli ichiga qo'yish — qotib qolgan dastur ham\n   watchdog ni tozalayveradi va himoya ishlamay qoladi */"],
  ["h","Quvvat kuchlanishini nazorat qilish"],
  ["p","Kuchlanish pasayganda mikrokontroller noto'g'ri ishlashi, xotiraga xato yozishi mumkin. BOR (Brown-out Reset) sxemasi kuchlanish chegaradan pastga tushganda kristallni reset holatida ushlab turadi va faqat kuchlanish tiklangach ishga tushiradi. Ko'pchilik MK larda chegara qiymati konfiguratsiya bitlari bilan tanlanadi."],
  ["h","Takt generatorlari"],
  ["fig","clock","1-rasm. Kvarts rezonatorli va RC generatorlarni ulash"],
  ["t",["Rejim","Manba","Aniqligi","Tashqi elementlar"],[
   ["LP","Past chastotali kvarts (32,768 kHz)","Juda yuqori","Kvarts + 2 kondensator"],
   ["XT","O'rtacha chastotali kvarts (1–4 MHz)","Yuqori","Kvarts + 2 kondensator"],
   ["HS","Yuqori chastotali kvarts (4–20 MHz)","Yuqori","Kvarts + 2 kondensator"],
   ["RC","Tashqi RC zanjir","±5–10 %","Rezistor + kondensator"],
   ["INTOSC","Ichki RC generator","±1–2 %","Kerak emas"],
   ["EC","Tashqi generator","Manbaga bog'liq","Tayyor generator moduli"]
  ]],
  ["p","32,768 kHz li kvarts alohida o'rin tutadi: bu chastota 2^15 ga teng bo'lgani uchun 15 razryadli bo'luvchidan keyin aniq 1 Hz hosil bo'ladi. Shu sababli u soat va kalendar tugunlarida standart hisoblanadi."],
  ["h","Chastotani taqsimlash va PLL"],
  ["p","Zamonaviy mikrokontrollerlarda takt manbai bevosita yadroga berilmaydi: u avval fazali avtosozlash halqasi (PLL) orqali ko'paytiriladi, so'ng bo'luvchilar orqali yadro, periferiya va interfeyslarga taqsimlanadi. Masalan 8 MHz kvarts PLL bilan 72 MHz ga ko'paytirilib, USB moduliga 48 MHz, periferiyaga esa 36 MHz beriladi."],
  ["f","f_yadro = f_kvarts · M / N","PLL da ko'paytirish va bo'lish koeffitsientlari bilan chastota shakllantiriladi."],
  ["h","Quvvat tejash rejimlari"],
  ["t",["Rejim","Nima o'chadi","Uyg'onish","Iste'mol"],[
   ["Faol","—","—","Bir necha mA"],
   ["Idle / Sleep","Yadro to'xtaydi, periferiya ishlaydi","Uzilish","O'nlab µA"],
   ["Power-down","Generator ham to'xtaydi","Tashqi uzilish, watchdog, reset","1 µA dan kam"],
   ["Power-save","Faqat soat taymeri ishlaydi","Taymer uzilishi","Bir necha µA"]
  ]],
  ["p","Batareyadan ishlaydigan qurilmalarda dastur vaqtining katta qismini uyqu rejimida o'tkazadi va faqat o'lchash yoki tugma bosilishi paytida uyg'onadi. Shu yondashuv bilan bir xil batareyada ishlash muddatini o'nlab marta uzaytirish mumkin."],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Qo'shimcha apparat vositalari — reset sxemalari, watchdog, quvvat nazorati va takt generatori — mikrokontrollerning ishonchli ishlashini ta'minlaydi. Takt manbai aniqlik, narx va tashqi elementlar soni bo'yicha tanlanadi; kvarts eng aniq, ichki RC generator esa eng qulay yechim. PLL va bo'luvchilar chastotani tugunlar bo'yicha taqsimlaydi, quvvat tejash rejimlari esa batareyali qurilmalarning ishlash muddatini uzaytiradi."]
 ],
 tests:[
  {q:"POR nimani anglatadi?",o:["Tashqi reset","Quvvat berilgandagi avtomatik reset","Dasturiy reset","Watchdog reseti"],a:1,e:"Power-on Reset kuchlanish ishchi darajaga chiqqanda ishlaydi."},
  {q:"BOR sxemasi nima qiladi?",o:["Chastotani oshiradi","Kuchlanish chegaradan pastga tushganda kristallni reset holatida ushlaydi","Xotirani tozalaydi","Uzilish beradi"],a:1,e:"Brown-out Reset noto'g'ri ishlashning oldini oladi."},
  {q:"PWRTE biti nima uchun yoqiladi?",o:["Quvvat tejash uchun","Generator barqarorlashguncha dastur boshlanishini kechiktirish uchun","Watchdog uchun","ADC uchun"],a:1,e:"Kvarts tebranishi bir necha ms da barqarorlashadi."},
  {q:"Watchdog taymer qanday ishlaydi?",o:["Vaqtni o'lchaydi","Belgilangan vaqtda tozalanmasa tizimni qayta ishga tushiradi","Uzilish beradi faqat","Chastotani bo'ladi"],a:1,e:"Dastur qotib qolganda qurilmani tiklaydi."},
  {q:"CLRWDT() ni qayerga qo'yish noto'g'ri?",o:["Asosiy sikl boshiga","Kutish sikli ichiga","Sozlashdan keyin","Uzilishdan tashqariga"],a:1,e:"Qotib qolgan dastur ham tozalab, himoyani yo'qqa chiqaradi."},
  {q:"32,768 kHz kvarts nima uchun standart hisoblanadi?",o:["Arzonligi uchun","2^15 ga teng bo'lib, bo'lishdan keyin aniq 1 Hz berishi uchun","Tezligi uchun","Kichikligi uchun"],a:1,e:"Soat tugunlarida shu sababli qo'llanadi."},
  {q:"INTOSC rejimining afzalligi nimada?",o:["Eng yuqori aniqlik","Tashqi elementlar talab qilmasligi","Eng yuqori chastota","Quvvat sarfi nolligi"],a:1,e:"Ichki RC generator kvartssiz ishlaydi."},
  {q:"PLL nima uchun ishlatiladi?",o:["Kuchlanishni oshirish","Takt chastotasini ko'paytirish","Xotirani kengaytirish","Uzilish yaratish"],a:1,e:"Past chastotali kvartsdan yuqori yadro chastotasi olinadi."},
  {q:"Power-down rejimida nima to'xtaydi?",o:["Faqat yadro","Yadro va generator","Faqat periferiya","Hech nima"],a:1,e:"Iste'mol 1 µA dan kamga tushadi."},
  {q:"Reset sababini aniqlash nima uchun foydali?",o:["Tezlikni oshirish uchun","Nosozlik manbasini topish uchun (masalan watchdog reseti)","Xotira tejash uchun","Chastotani o'lchash uchun"],a:1,e:"Maxsus bitlar oxirgi reset turini ko'rsatadi."}
 ]
},
{
 id:"S2-L8", sem:2, week:8, type:"lab", no:8,
 title:"Knopkalar va klaviaturadan axborot kiritish",
 goal:"Matritsali klaviaturani ulash, skanerlash algoritmini amalga oshirish va kiritilgan ma'lumotni qayta ishlashni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","4×4 matritsali klaviatura","Diodlar 1N4148 — 16 dona (ixtiyoriy)","LCD 16×2","Rezistorlar va simlar"],
 plan:["Matritsa tamoyili","Ulash sxemasi","Skanerlash algoritmi","Drebezg va ghosting","Sonni kiritish","Menyu boshqaruvi"],
 body:[
  ["h","Nazariy qism"],
  ["p","16 ta tugmaning har biriga alohida liniya ajratish 16 ta port chiqishini talab qiladi. Matritsa usulida tugmalar 4 satr va 4 ustun kesishmasiga joylashtiriladi — natijada atigi 8 ta liniya yetarli bo'ladi. Umumiy holda N ta tugma uchun 2·√N ta liniya kerak bo'ladi."],
  ["fig","keypad","1-rasm. 4×4 matritsali klaviaturaning ulanish sxemasi va skanerlash tartibi"],
  ["f","Liniyalar soni = satrlar + ustunlar","4×4 uchun 8 liniya, 4×3 uchun 7 liniya."],
  ["h","Skanerlash algoritmi"],
  ["ol",[
   "Satr liniyalari chiqish, ustun liniyalari kirish (pull-up bilan) qilib sozlanadi",
   "Barcha satrlarga yuqori daraja beriladi",
   "Birinchi satrga past daraja beriladi, qolganlari yuqori qoladi",
   "Ustunlar o'qiladi: agar biror ustunda past daraja bo'lsa, shu satr va ustun kesishmasidagi tugma bosilgan",
   "Keyingi satr uchun takrorlanadi",
   "Tugma topilgach drebezg filtri qo'llanadi va kod jadvaldan olinadi"
  ]],
  ["c","const byte SATR = 4, USTUN = 4;\nconst int satr[SATR]   = {9, 8, 7, 6};\nconst int ustun[USTUN] = {5, 4, 3, 2};\nconst char belgi[SATR][USTUN] = {\n    {'1','2','3','A'},\n    {'4','5','6','B'},\n    {'7','8','9','C'},\n    {'*','0','#','D'}\n};\n\nvoid setup()\n{\n    for (byte s = 0; s < SATR; s++)  { pinMode(satr[s], OUTPUT); digitalWrite(satr[s], HIGH); }\n    for (byte u = 0; u < USTUN; u++) pinMode(ustun[u], INPUT_PULLUP);\n    Serial.begin(9600);\n}\n\nchar tugma_oqish(void)\n{\n    for (byte s = 0; s < SATR; s++)\n    {\n        digitalWrite(satr[s], LOW);              /* faqat shu satr faol */\n        for (byte u = 0; u < USTUN; u++)\n        {\n            if (digitalRead(ustun[u]) == LOW)\n            {\n                delay(20);                       /* drebezg filtri */\n                if (digitalRead(ustun[u]) == LOW)\n                {\n                    while (digitalRead(ustun[u]) == LOW);   /* qo'yib yuborishni kutish */\n                    digitalWrite(satr[s], HIGH);\n                    return belgi[s][u];\n                }\n            }\n        }\n        digitalWrite(satr[s], HIGH);\n    }\n    return 0;                                     /* hech narsa bosilmagan */\n}\n\nvoid loop()\n{\n    char t = tugma_oqish();\n    if (t) { Serial.print(\"Bosildi: \"); Serial.println(t); }\n}"],
  ["h","Ghosting va diodlar"],
  ["p","Bir vaqtda uchta tugma bosilganda matritsada soxta ulanish yo'li hosil bo'lishi mumkin: skanerlash to'rtinchi, bosilmagan tugmani ham bosilgan deb qayd etadi. Bu hodisa ghosting (soyabon) deb ataladi. Uning oldini olish uchun har bir tugmaga ketma-ket diod ulanadi — diod tokning faqat bir yo'nalishda o'tishiga ruxsat beradi va soxta yo'lni uzadi."],
  ["n","Xavfsizlik va montaj: ikkita satr liniyasi bir vaqtda chiqish rejimida turib, biri yuqori, ikkinchisi past daraja berayotganda tugma bosilsa, chiqishlar o'rtasida qisqa tutashuv hosil bo'ladi. Shuning uchun skanerlashda faqat bitta satr past darajaga o'tkaziladi, qolganlari esa yuqori darajada yoki kirish rejimida qoldiriladi."],
  ["h","Sonni kiritish"],
  ["c","long son = 0;\n\nvoid loop()\n{\n    char t = tugma_oqish();\n    if (!t) return;\n\n    if (t >= '0' && t <= '9')\n    {\n        son = son * 10 + (t - '0');        /* yangi raqamni qo'shish */\n        if (son > 99999) son = 99999;      /* chegaralash */\n        Serial.println(son);\n    }\n    else if (t == '*') { son = 0; Serial.println(\"Tozalandi\"); }\n    else if (t == '#') { Serial.print(\"Qabul qilindi: \"); Serial.println(son); son = 0; }\n}"],
  ["p","Belgidan raqamga o'tish uchun ASCII kodidan '0' ayiriladi. Kiritilgan raqam har safar oldingi qiymatni 10 ga ko'paytirib qo'shish orqali yig'iladi — bu o'nlik sonni kiritishning standart usuli."],
  ["h","Menyu boshqaruvi"],
  ["t",["Tugma","Vazifasi","Holat"],[
   ["A","Menyuda yuqoriga","Har qanday"],["B","Menyuda pastga","Har qanday"],
   ["C","Tanlash / kirish","Menyu"],["D","Orqaga / bekor qilish","Har qanday"],
   ["0–9","Qiymat kiritish","Tahrirlash"],["#","Tasdiqlash","Tahrirlash"],["*","Tozalash","Tahrirlash"]
  ]],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",[
   "4×4 klaviaturani D2–D9 liniyalariga ulang va sxemani chizing.",
   "Skanerlash dasturini yuklang; har bir tugma bosilganda Serial Monitor da kod chiqishini tekshiring.",
   "Bosilgan tugma satr va ustun raqamini jadvalga yozing (16 ta tugma uchun).",
   "Variant raqamingiz N bo'lsin: kiritilgan sonni (10 + N) ga ko'paytirib ekranga chiqaring.",
   "Ikki va uchta tugmani bir vaqtda bosib, ghosting hodisasini kuzating.",
   "Sonni kiritish, tozalash va tasdiqlash funksiyalarini LCD bilan birga amalga oshiring.",
   "Skanerlash davomiyligini micros() bilan o'lchang va butun klaviaturani skanerlash vaqtini hisoblang.",
   "Sxema va Serial Monitor rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Matritsali klaviatura tugmalar sonini kamaytirmasdan port liniyalarini tejash imkonini beradi: 16 ta tugma uchun 8 liniya yetarli. Skanerlash satrlarga navbat bilan past daraja berib, ustunlarni o'qish orqali bajariladi. Drebezg dasturiy filtrlanadi, bir vaqtda ko'p tugma bosilganda paydo bo'ladigan ghosting esa diodlar bilan bartaraf etiladi."]

{
 id:"S2-L9", sem:2, week:9, type:"lab", no:9,
 title:"Simvolli-grafik indikatorga axborot chiqarish",
 goal:"Simvolli LCD va grafik indikatorga matn, maxsus belgi va sodda grafik chiqarishni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","LCD 16×2 (HD44780)","Grafik indikator 128×64 (ixtiyoriy)","Potensiometr 10 kΩ","Rezistor 220 Ω, simlar"],
 plan:["Simvolli indikator","Kutubxona bilan ishlash","Maxsus belgilar (CGRAM)","Progress bar","Grafik indikator","Ma'lumotni formatlash"],
 body:[
  ["h","Simvolli indikator"],
  ["p","HD44780 boshqaruvchisidagi LCD ichida uchta xotira sohasi bor: DDRAM — ekranda ko'rinadigan belgilar kodlari, CGROM — tayyor belgilar shakllari, CGRAM — foydalanuvchi yaratadigan sakkiztagacha maxsus belgi. Indikator RS, E va to'rt yoki sakkiz ma'lumot liniyasi orqali boshqariladi."],
  ["fig","lcdwire","1-rasm. LCD indikatorni 4 bitli rejimda ulash"],
  ["c","#include <LiquidCrystal.h>\n\n/* LiquidCrystal(RS, E, D4, D5, D6, D7) */\nLiquidCrystal lcd(12, 11, 5, 4, 3, 2);\n\nvoid setup()\n{\n    lcd.begin(16, 2);                 /* 16 ustun, 2 qator */\n    lcd.print(\"MIKROPROTSESSOR\");\n    lcd.setCursor(0, 1);              /* 0-ustun, 1-qator */\n    lcd.print(\"TEXNIKASI  TDTU\");\n}\n\nvoid loop()\n{\n    lcd.setCursor(11, 1);\n    lcd.print(millis() / 1000);       /* ishlash vaqti, sekundda */\n    delay(500);\n}"],
  ["h","Maxsus belgilar (CGRAM)"],
  ["p","CGRAM ga sakkiztagacha o'z belgingizni yozish mumkin. Har bir belgi 8 qatordan iborat va har bir qator 5 bitli — ya'ni belgi 5×8 nuqtadan tashkil topadi. Bu daraja va gradus belgilari, batareya, antenna kabi piktogrammalarni yaratish imkonini beradi."],
  ["c","byte gradus[8] = {\n    0b00110,\n    0b01001,\n    0b01001,\n    0b00110,\n    0b00000,\n    0b00000,\n    0b00000,\n    0b00000\n};\n\nvoid setup()\n{\n    lcd.begin(16, 2);\n    lcd.createChar(0, gradus);        /* 0-raqamli maxsus belgi */\n    lcd.setCursor(0, 0);\n    lcd.print(\"Harorat: 24\");\n    lcd.write(byte(0));               /* maxsus belgini chiqarish */\n    lcd.print(\"C\");\n}"],
  ["h","Progress bar"],
  ["p","Maxsus belgilardan foydalanib, simvolli indikatorda ham to'ldirish shkalasini hosil qilish mumkin: har bir belgi o'rniga to'liq yoki qisman to'ldirilgan blok chiqariladi. 16 ta belgi va har birida 5 ustun bo'lgani uchun shkala 80 pog'onali bo'ladi."],
  ["f","pog'onalar = 16 · 5 = 80","16 belgili qatorda progress bar ayirish qobiliyati."],
  ["h","Grafik indikator"],
  ["t",["Belgi","Simvolli (16×2)","Grafik (128×64)"],[
   ["Chiqariladigan ma'lumot","Faqat belgilar","Nuqta, chiziq, shakl, shrift"],
   ["Xotira talabi","Kichik","Kadr buferi 1 KB (128·64/8)"],
   ["Boshqaruvchi","HD44780","KS0108, ST7920, SSD1306"],
   ["Ulanish","4/8 bit parallel","Parallel yoki SPI/I2C"],
   ["Qo'llanishi","Sodda ko'rsatkichlar","Grafik, menyu, diagramma"]
  ]],
  ["p","Grafik indikatorda tasvir kadr buferida shakllantiriladi va so'ng butunlay indikatorga uzatiladi. 128×64 nuqtali ekran uchun bufer 1024 bayt joy egallaydi — bu ATmega328P ning 2 KB SRAM ining yarmi. Shuning uchun kichik mikrokontrollerlarda tasvir sahifalab (page) chiqariladi yoki buferi ichida joylashgan indikatorlar tanlanadi."],
  ["n","Kontrast va ko'rinish: simvolli LCD da kontrast VO liniyasidagi kuchlanish bilan sozlanadi. Kontrast noto'g'ri bo'lsa ekranda hech nima ko'rinmaydi yoki barcha kataklar qora bo'lib qoladi — bu ko'pincha \"indikator ishlamayapti\" deb xato baholanadi."],
  ["h","Ma'lumotni formatlash"],
  ["c","void harorat_chiqar(int t10)          /* t10 — 0,1 °C birliklarida */\n{\n    lcd.setCursor(0, 1);\n    lcd.print(t10 / 10);\n    lcd.print('.');\n    lcd.print(t10 % 10);\n    lcd.write(byte(0));\n    lcd.print(\"C  \");                 /* oxirgi bo'shliqlar eski belgilarni o'chiradi */\n}"],
  ["p","Muhim amaliy detal: LCD eski belgilarni avtomatik o'chirmaydi. Agar oldin \"100\" chiqarilgan bo'lib, keyin \"99\" yozilsa, ekranda \"990\" ko'rinadi. Shuning uchun qiymatdan keyin bo'shliqlar chiqariladi yoki qator to'liq qayta yoziladi."],
  ["sim","lcd"],
  ["h","Topshiriqlar"],
  ["ol",[
   "LCD ni 4 bitli rejimda ulang, kontrastni sozlang va sxemani chizing.",
   "Birinchi qatorga ism-familiyangizni, ikkinchisiga guruhingizni chiqaring.",
   "CGRAM da gradus belgisini yarating va uni ekranga chiqaring.",
   "Variant raqamingiz N bo'lsin: o'z maxsus belgingizni (N ta nuqtadan iborat shakl) yarating.",
   "Progress bar amalga oshiring va uni 0 dan 100 % gacha o'zgartiring.",
   "Eski belgilarni o'chirmaslik xatosini ataylab hosil qiling va uni bartaraf eting.",
   "Imkoni bo'lsa grafik indikatorga chiziq va to'rtburchak chizing.",
   "Sxema va ishlayotgan indikator rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Simvolli LCD DDRAM ga belgilar kodlarini yozish orqali boshqariladi, CGRAM esa sakkiztagacha o'z belgini yaratishga imkon beradi. Grafik indikator nuqtalar bilan ishlaydi va kadr buferi uchun sezilarli SRAM talab qiladi. Ma'lumot chiqarishda eski belgilarni tozalash va kontrastni to'g'ri sozlash — ekran bilan ishlashdagi eng ko'p uchraydigan amaliy masalalar."]
 ],

  {q:"Bu muammoni qanday bartaraf etiladi?",o:["Kontrastni oshirish bilan","Qiymatdan keyin bo'shliq chiqarish yoki qatorni qayta yozish bilan","Chastotani oshirish bilan","Kursorni o'chirish bilan"],a:1,e:"Ortiqcha belgilar bo'shliq bilan yopiladi."},

  ["n","Diqqat: RA4 liniyasi ochiq stokli — u liniyani faqat umumiy simga torta oladi, yuqori darajaga tortmaydi. Shuning uchun unga LED ni odatdagidek ulash ishlamaydi: tashqi pull-up rezistor qo'yiladi yoki LED anodi quvvat manbaiga ulanib, teskari mantiq qo'llanadi."],
  ["h","Xotira tashkil etilishi"],
  ["p","Dastur xotirasi 1 K so'z bo'lib, 0x0000 adresidan boshlanadi. Reset vektori 0x0000, uzilish vektori esa 0x0004 adresida joylashgan. Shuning uchun dastur odatda 0x0000 da GOTO bilan boshlanadi va asosiy kod uzilish vektoridan keyin yoziladi."],
  ["c","      ORG    0x0000        ; reset vektori\n      GOTO   MAIN\n\n      ORG    0x0004        ; uzilish vektori\n      GOTO   ISR\n\nMAIN: BSF    STATUS, RP0   ; 1-bankka o'tish\n      MOVLW  0x00\n      MOVWF  TRISB         ; PORTB chiqish\n      BCF    STATUS, RP0   ; 0-bankka qaytish\n      CLRF   PORTB"],

  ["h","EEPROM bilan ishlash"],

  ["h","Xulosa"],
  ["p","PIC16F8X — minimal resursli, ammo to'liq tuzilmali mikrokontrollerlar turkumi. PIC16F84A da 1 K so'z Flash, 68 bayt SRAM, 64 bayt EEPROM, 13 ta kirish-chiqish liniyasi va bitta taymer mavjud. Xotira ikki bankka bo'lingan, reset va uzilish vektorlari 0x0000 va 0x0004 adreslarida joylashgan. Turkum sodda boshqarish masalalari va o'quv jarayoni uchun mo'ljallangan."]

{
 id:"S2-L10", sem:2, week:10, type:"lab", no:10,
 title:"RS-232 interfeysi va USARTni tadqiq etish",
 goal:"USART modulining ishlashini, RS-232 signal darajalarini va kompyuter bilan ma'lumot almashishni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","MAX232 mikrosxemasi va kondensatorlar (ixtiyoriy)","RS-232 razyomi (DB-9)","Ossillograf","Ikkinchi Arduino platasi (aloqa uchun)"],
 plan:["USART moduli","Kadr tuzilishi","Bod tezligi","RS-232 darajalari va MAX232","Kompyuter bilan aloqa","Ikki MK o'rtasida aloqa","Protokol tuzish"],
 body:[
  ["h","USART moduli"],
  ["p","USART (Universal Synchronous/Asynchronous Receiver/Transmitter) — ketma-ket aloqa moduli. Asinxron rejimda takt liniyasi uzatilmaydi: qabul qiluvchi va uzatuvchi bir xil oldindan kelishilgan tezlikda ishlaydi, har bir bayt esa start va stop bitlari bilan ajratiladi."],
  ["fig","rs232","1-rasm. UART kadri, TTL va RS-232 signal darajalari hamda MAX232 orqali ulanish"],
  ["h","Kadr tuzilishi"],
  ["t",["Bit","Vazifasi","Qiymati"],[
   ["Start","Uzatish boshlanishini bildiradi","Har doim 0"],
   ["D0–D7","Ma'lumot bitlari, kichik bitdan boshlab","Bayt qiymati"],
   ["Paritet","Xatolikni aniqlash (ixtiyoriy)","Juft yoki toq"],
   ["Stop","Kadr oxiri","1 yoki 2 bit, qiymati 1"]
