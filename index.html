  ["t",["U_o'lchangan, V","Kutilayotgan kod","Olingan kod","Farq"],[["0,00","0","—","—"],["1,00","205","—","—"],["2,00","409","—","—"],["2,50","511","—","—"],["3,30","675","—","—"],["5,00","1023","—","—"]]],
  ["h","Opora manbaining ta'siri"],
  ["p","Standart sozlamada opora sifatida quvvat kuchlanishi (VDD) ishlatiladi. Agar quvvat manbai beqaror bo'lsa yoki USB orqali kuchlanish 4,7 V ga tushsa, barcha o'lchashlar mos ravishda siljiydi — bu tizimli xato hisoblanadi."],
  ["c","analogReference(INTERNAL);   /* ichki 1,1 V opora */\ndelay(10);\nanalogRead(A0);              /* birinchi o'lchash tashlab yuboriladi */\nint kod = analogRead(A0);"],
  ["n","Opora manbaini almashtirgandan keyin birinchi o'lchash natijasi ishonchsiz bo'ladi, chunki ichki zanjir barqarorlashishi uchun vaqt kerak. Shuning uchun birinchi natija tashlab yuboriladi. Bundan tashqari INTERNAL rejimida kirish kuchlanishi 1,1 V dan oshmasligi kerak — aks holda kod 1023 da to'yinadi."],
  ["h","Shovqin va o'rtachalash"],
  ["p","Real o'lchashda kod bir necha birlikka tebranadi. Buning sabablari: quvvat manbaidagi pulsatsiya, raqamli tugunlardan kelgan shovqin, uzun ulash simlari va manba qarshiligining kattaligi."],
  ["f","σ_o'rtacha = σ / √n","n marta o'rtachalashda tasodifiy xato √n marta kamayadi."],
  ["p","Misol. Bitta o'lchashda tarqalish ±3 kod bo'lsa, 16 marta o'rtachalashdan keyin u ±0,75 kod atrofiga tushadi. Shuning uchun o'rtachalash eng sodda va samarali dasturiy filtr hisoblanadi."],
  ["c","int adc_ortacha(byte kanal, byte n)\n{\n    long s = 0;\n    for (byte i = 0; i < n; i++) { s += analogRead(kanal); delayMicroseconds(200); }\n    return (int)(s / n);\n}"],
  ["h","Diskretlash chastotasi"],
  ["p","Arduino da analogRead() taxminan 100 µs davom etadi, demak maksimal diskretlash chastotasi 10 kHz atrofida bo'ladi. Kotelnikov shartiga ko'ra bu 5 kHz gacha bo'lgan signallarni o'lchash imkonini beradi, amalda esa zaxira bilan 1 kHz gacha signal tavsiya etiladi."],
  ["f","f_diskret ≥ 2 · f_max","Shart buzilsa aliasing yuzaga keladi va uni keyinchalik tuzatib bo'lmaydi."],
  ["sim","adc"],
  ["h","Topshiriqlar"],
  ["ol",["Potensiometrni A0 ga ulang va o'zgartirish tavsifi jadvalini kamida 10 nuqta bo'yicha to'ldiring.","Kutilayotgan va olingan kodlar farqini hisoblang, xato grafigini chizing.","Kvantlash qadamini va maksimal kvantlash xatosini Uref = 5 V uchun hisoblang.","Variant raqamingiz N bo'lsin: kirish kuchlanishi (0,5 + 0,2·N) V bo'lganda kutilayotgan kodni hisoblang va tajriba bilan solishtiring.","Ichki 1,1 V oporaga o'ting va kvantlash qadamining o'zgarishini tajribada tasdiqlang.","Bitta nuqtada 50 ta o'lchash olib, tarqalishni (min, maks, o'rtacha) aniqlang.","4, 16 va 64 marta o'rtachalashda tarqalish qanday kamayishini jadvalga yozing.","Kirishga RC filtr qo'yib, natijani filtrsiz holat bilan solishtiring.","O'lchash jadvallari va grafiklar rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","ADC ning asosiy parametrlari — razryadlilik, opora kuchlanishi va o'zgartirish vaqti — o'lchash aniqligini bevosita belgilaydi. Kvantlash xatosi printsipial va ±q/2 dan oshmaydi, tasodifiy shovqin esa o'rtachalash bilan √n marta kamaytiriladi. Opora manbaini to'g'ri tanlash va diskretlash chastotasini Kotelnikov shartiga muvofiq belgilash o'lchash natijasining ishonchliligini ta'minlaydi."],

{
 id:"S2-L13", sem:2, week:13, type:"lab", no:13,
 title:"Chastotometrni tadqiq qilish",
 goal:"Chastota va davrni o'lchash usullarini, ularning xatolarini va mikrokontrollerda amalga oshirishni o'zlashtirish.",
 outcomes:[],
 plan:["O'lchash usullari","Impulslarni sanash","Davrni o'lchash","Usullarni tanlash chegarasi","Uzilish asosidagi amalga oshirish","Xatolarni baholash"],
 equip:["Arduino Uno va USB kabel","Signal generatori yoki ikkinchi Arduino (signal manbai sifatida)","Ossillograf","LCD 16×2","Rezistorlar, simlar"],
 body:[
  ["h","O'lchash usullari"],
  ["p","Chastotani mikrokontrollerda ikki xil usulda o'lchash mumkin va ularning har biri o'z diapazonida aniqroq ishlaydi."],
  ["fig","freq","1-rasm. Chastotani bevosita sanash va davrni o'lchash usullari"],
  ["t",["Usul","Mohiyati","Aniq bo'ladigan diapazon","Asosiy xatosi"],[["Bevosita sanash","Belgilangan vaqt (masalan 1 s) ichidagi impulslar soni sanaladi","Yuqori chastotalar","±1 impuls"],["Davrni o'lchash","Bitta davr davomiyligi takt impulslari bilan o'lchanadi","Past chastotalar","±1 takt va trigger xatosi"],["Bir necha davrni o'lchash","N ta davr o'lchanib, N ga bo'linadi","O'rtacha diapazon","Xato N marta kamayadi"]]],
  ["f","f = N / t_o'lchash","Bevosita sanash: 1 s da 1000 impuls → 1 kHz."],
  ["f","f = 1 / T","Davrni o'lchash orqali chastota."],
  ["f","δ = ±1 / N · 100 %","Bevosita sanashning nisbiy xatosi. N = 1000 → 0,1 %."],
  ["h","Impulslarni sanash usuli"],
  ["c","volatile unsigned long impuls = 0;\nunsigned long oxirgi = 0;\n\nvoid sanash(void) { impuls++; }          /* uzilish ishlovchisi */\n\nvoid setup()\n{\n    pinMode(2, INPUT);\n    attachInterrupt(digitalPinToInterrupt(2), sanash, RISING);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    if (millis() - oxirgi >= 1000)        /* aniq 1 sekundlik oyna */\n    {\n        oxirgi = millis();\n        noInterrupts();\n        unsigned long f = impuls;\n        impuls = 0;\n        interrupts();\n        Serial.print(f); Serial.println(\" Hz\");\n    }\n}"],
  ["p","Hisoblagichni o'qish va nollash uzilishlar taqiqlangan holda bajariladi — aks holda o'qish paytida kelgan impuls yo'qolishi mumkin. Bu ko'p oqimli kodlardagi klassik poyga holatining oldini olish usuli."],
  ["h","Davrni o'lchash usuli"],
  ["c","void loop()\n{\n    unsigned long t_yuqori = pulseIn(3, HIGH);   /* impuls davomiyligi, µs */\n    unsigned long t_past   = pulseIn(3, LOW);\n    unsigned long T = t_yuqori + t_past;         /* to'liq davr */\n\n    if (T > 0)\n    {\n        float f = 1000000.0 / T;                 /* Hz */\n        float duty = 100.0 * t_yuqori / T;       /* to'ldirish, % */\n        Serial.print(f); Serial.print(\" Hz, D = \");\n        Serial.print(duty); Serial.println(\" %\");\n    }\n}"],
  ["p","Bu usulda bitta davr o'lchangani uchun natija tez olinadi, ammo past chastotalarda o'lchash vaqti uzayadi va shovqin bitta o'lchashga to'liq ta'sir qiladi. Shuning uchun amalda bir necha davr o'lchanib, o'rtachasi olinadi."],
  ["h","Usullarni tanlash chegarasi"],
  ["p","Ikkala usulning xatosi teng bo'ladigan chastota chegaraviy chastota deb ataladi. Undan yuqorida bevosita sanash, pastda esa davrni o'lchash aniqroq natija beradi."],
  ["f","f_chegara ≈ √(f_takt / t_o'lchash)","f_takt = 1 MHz va t = 1 s uchun chegara taxminan 1 kHz."],
  ["t",["Chastota","Tavsiya etiladigan usul","Sabab"],[["< 100 Hz","Davrni o'lchash","Sanash usulida 1 s da juda kam impuls"],["100 Hz – 10 kHz","Bir necha davrni o'lchash","Xato N marta kamayadi"],["> 10 kHz","Bevosita sanash","1 s da ko'p impuls, ±1 xatosi ahamiyatsiz"]]],
  ["n","Kirish signalini moslashtirish: o'lchanayotgan signal sinusoidal yoki shovqinli bo'lsa, uni avval Shmitt trigger yoki komparator orqali to'g'ri burchakli shaklga keltirish kerak. Aks holda bitta o'tishda bir necha soxta impuls hisoblanadi va natija bir necha marta oshib ketadi."],
  ["h","Xatolarni baholash"],
  ["ul",["±1 impuls xatosi — sanash usulida ajralmas, o'lchash oynasini uzaytirish bilan kamayadi","Vaqt asosi xatosi — kvarts aniqligi bilan belgilanadi (±50 ppm)","Trigger xatosi — shovqin tufayli o'tish momenti siljiydi","Uzilish kechikishi — yuqori chastotalarda impulslar yo'qolishi mumkin","Diskretlash xatosi — davrni o'lchashda takt davri bilan cheklanadi"]],
  ["p","Arduino da uzilish orqali sanash amalda 100–200 kHz gacha ishonchli ishlaydi; undan yuqori chastotalarda apparat taymer-hisoblagich kirishidan (T1 liniyasi) foydalanish kerak, chunki u impulslarni protsessor ishtirokisiz sanaydi."],
  ["sim","timer"],
  ["h","Topshiriqlar"],
  ["ol",["Signal manbaini D2 kirishiga ulang va bevosita sanash dasturini yuklang.","10 Hz dan 10 kHz gacha bo'lgan kamida 6 ta chastotada o'lchang va etalon qiymat bilan solishtiring.","Har bir nuqtada nisbiy xatoni hisoblab, jadvalga yozing.","Variant raqamingiz N bo'lsin: o'lchash oynasini (0,5 + 0,1·N) sekund qilib o'zgartiring va xatoning o'zgarishini kuzating.","pulseIn asosidagi davrni o'lchash dasturini yozing va past chastotalarda ikki usulni solishtiring.","Chegaraviy chastotani hisoblang va tajribada tasdiqlang.","Kirishga shovqinli signal berib, Shmitt trigger zaruratini ko'rsating.","Natijalarni LCD ga chiqaruvchi qismni qo'shing.","O'lchash jadvali va ossillogramma rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Chastota ikki usulda o'lchanadi: belgilangan vaqt ichidagi impulslarni sanash yoki davr davomiyligini o'lchash. Birinchisi yuqori chastotalarda, ikkinchisi past chastotalarda aniqroq; ular teng aniqlik beradigan nuqta chegaraviy chastota deb ataladi. O'lchash xatosi ±1 impuls, vaqt asosi aniqligi va trigger xatosidan tashkil topadi; kirish signalini to'g'ri burchakli shaklga keltirish esa ishonchli sanashning shartidir."],

{

 title:"USB orqali qurilmani MK ga ulash va tadqiq etish",
 goal:"USB interfeysi orqali mikrokontrollerni kompyuterga ulash, ma'lumot almashish va uzatish tezligini tadqiq etishni o'zlashtirish.",
 outcomes:[],
 plan:["USB haqida umumiy ma'lumot","USB-UART o'zgartirgich","Ma'lumot almashish","Uzatish tezligini o'lchash","Protokol va nazorat","Quvvat masalasi"],
 equip:["Arduino Uno va USB kabel","Kompyuter va terminal dasturi","Ossillograf (ixtiyoriy)","USB-UART moduli (CH340, CP2102)","LCD 16×2"],
 body:[
  ["h","USB haqida umumiy ma'lumot"],
  ["p","USB (Universal Serial Bus) — kompyuter va periferiya o'rtasidagi universal ketma-ket interfeys. Uning asosiy xususiyatlari: to'rt simli kabel (VBUS, D+, D−, GND), differensial uzatish, avtomatik aniqlash (plug and play) va periferiyani shina orqali quvvatlantirish imkoniyati."],
  ["t",["Versiya","Tezligi","Nomi"],[["USB 1.1","1,5 / 12 Mbit/s","Low / Full Speed"],["USB 2.0","480 Mbit/s","High Speed"],["USB 3.x","5–20 Gbit/s","Super Speed"]]],
  ["p","USB da aloqani har doim xost (kompyuter) boshlaydi: qurilma o'z tashabbusi bilan ma'lumot yubora olmaydi, u faqat so'rovga javob beradi. Har bir qurilma ulanganda o'zining identifikatorlarini (VID va PID) xostga yuboradi va shu asosda kerakli drayver yuklanadi."],
  ["h","USB-UART o'zgartirgich"],
  ["p","Oddiy mikrokontrollerlarda USB kontrolleri bo'lmaydi, chunki USB protokoli murakkab va sezilarli resurs talab qiladi. Shuning uchun amalda USB-UART o'zgartirgich mikrosxemasi qo'llanadi: u kompyuter tomonidan virtual COM port sifatida ko'rinadi, mikrokontroller tomonidan esa oddiy UART bo'lib ishlaydi."],

  ["t",["Mikrosxema","Xususiyati"],[["CH340","Arzon, keng tarqalgan, drayver talab qilishi mumkin"],["CP2102","Barqaror, kam shovqinli"],["FT232","Sanoat sifatida, qimmatroq"],["ATmega16U2","Arduino Uno da ishlatiladi, dasturlanadigan"]]],
  ["p","Arduino Uno da aynan shu yechim qo'llanadi: platadagi ATmega16U2 kompyuter uchun virtual COM port yaratadi va uni asosiy ATmega328P ning UART liniyalariga ulaydi. Shu sababli Serial.print() bilan yuborilgan ma'lumot kompyuterda Serial Monitor da ko'rinadi."],
  ["h","Ma'lumot almashish"],
  ["c","void setup()\n{\n    Serial.begin(115200);\n    Serial.println(\"USB aloqa tayyor\");\n}\n\nvoid loop()\n{\n    if (Serial.available())\n    {\n        String s = Serial.readStringUntil('\\n');\n        s.trim();\n\n        if (s == \"OLCH\")   { Serial.print(\"ADC=\"); Serial.println(analogRead(A0)); }\n        else if (s == \"VAQT\") { Serial.print(\"T=\");   Serial.println(millis()/1000); }\n        else if (s.startsWith(\"LED \"))\n        {\n            digitalWrite(13, s.substring(4).toInt() ? HIGH : LOW);\n            Serial.println(\"OK\");\n        }\n        else Serial.println(\"XATO: noma'lum buyruq\");\n    }\n}"],
  ["h","Uzatish tezligini o'lchash"],
  ["f","v_amaliy = N_bayt / t","Amaliy o'tkazuvchanlik. 10 000 bayt 1,2 s da uzatilsa ≈ 8,3 kbayt/s."],
  ["c","void tezlikni_olchash(void)\n{\n    unsigned long t1 = millis();\n    for (int i = 0; i < 1000; i++) Serial.println(\"0123456789\");   /* 12 bayt x 1000 */\n    Serial.flush();                       /* buferning bo'shashini kutish */\n    unsigned long t2 = millis();\n\n    Serial.print(\"12000 bayt uzatildi: \");\n    Serial.print(t2 - t1); Serial.println(\" ms\");\n}"],
  ["p","Serial.flush() funksiyasi majburiy: usiz o'lchash faqat buferga yozish vaqtini ko'rsatadi, haqiqiy uzatish esa fonda davom etadi. Amaliy tezlik nazariy qiymatdan doim past bo'ladi — kadr qo'shimcha bitlari, USB paketlari va xost tomonidagi bufer kechikishi hisobiga."],
  ["h","Protokol va nazorat"],
  ["ul",["Kadr chegaralarini aniq belgilash (masalan '\\n' bilan tugatish)","Buyruq va parametrlarni ajratish qoidasini kelishish","Nazorat yig'indisi yoki CRC qo'shish","Har bir buyruqqa javob (OK yoki XATO) qaytarish","Javob kelmasa qayta yuborish va urinishlar sonini cheklash","Uzun ma'lumotni bloklarga bo'lib uzatish"]],
  ["n","Diqqat: Arduino ning ketma-ket buferi 64 bayt. Agar kompyuter ma'lumotni dastur o'qib ulgurganidan tezroq yuborsa, bufer to'lib ketadi va baytlar yo'qoladi. Buning oldini olish uchun blokli uzatish va tasdiqlash (javob kutish) qo'llanadi."],
  ["h","Quvvat masalasi"],
  ["p","USB porti odatda 500 mA (USB 2.0) gacha tok berishi mumkin. Arduino platasi va unga ulangan kichik yuklamalar shu chegarada ishlaydi, ammo dvigatel, rele yoki lenta LED uchun alohida quvvat manbai kerak. Tashqi manba ishlatilganda umumiy sim albatta birlashtiriladi."],
  ["sim","uart"],
  ["h","Topshiriqlar"],
  ["ol",["Platani USB orqali ulang va qurilma menejerida virtual COM port raqamini aniqlang.","Buyruqli aloqa dasturini yuklang va OLCH, VAQT, LED buyruqlarini sinab ko'ring.","Variant raqamingiz N bo'lsin: o'z buyrug'ingizni qo'shing (masalan (100 + N) qiymatini qaytaruvchi).","9600, 57600 va 115200 bod tezliklarida 12 000 bayt uzatish vaqtini o'lchang va jadvalga yozing.","Har bir tezlik uchun nazariy va amaliy o'tkazuvchanlikni solishtiring, farq sababini izohlang.","Buferni ataylab to'ldirib, baytlar yo'qolishini kuzating va tasdiqlash mexanizmi bilan bartaraf eting.","Nazorat yig'indili protokol yozing va buzilgan kadr rad etilishini tekshiring.","O'lchash jadvali va terminal oynasining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Oddiy mikrokontroller USB bilan bevosita emas, USB-UART o'zgartirgich orqali ishlaydi va kompyuterda virtual COM port sifatida ko'rinadi. Amaliy uzatish tezligi nazariydan past bo'ladi, chunki kadr qo'shimcha bitlari va bufer kechikishlari hisobga olinadi. Ishonchli aloqa uchun kadr chegaralari, nazorat yig'indisi va tasdiqlash mexanizmi bo'lgan protokol tuziladi."],

 plan:["Tizimli magistral tushunchasi","ISA magistrali","ISA signallari","Magistrallarning rivojlanishi","PCI va PCI Express","Tashqi interfeyslar","Mikrokontrollerni kompyuterga ulash"],
 body:[
  ["h","Tizimli magistral tushunchasi"],
  ["p","Tizimli magistral — kompyuterning kengaytirish kartalarini ona platagaz ulash uchun mo'ljallangan standartlashtirilgan interfeys. U mexanik (razyom o'lchami va kontaktlar soni), elektr (signal darajalari) va protokol (almashinuv tartibi) jihatdan to'liq tavsiflanadi."],
  ["fig","isa","1-rasm. ISA magistralining tuzilishi va signallar guruhlari"],
  ["h","ISA magistrali"],
  ["p","ISA (Industry Standard Architecture) — 1981-yilda IBM PC bilan birga paydo bo'lgan magistral. Dastlabki varianti 8 razryadli ma'lumot shinasi va 20 razryadli adres shinasiga ega bo'lgan; 1984-yilda 16 razryadli kengaytirilgan versiyasi chiqarilib, adres shinasi 24 razryadga yetkazildi."],
  ["t",["Ko'rsatkich","ISA-8","ISA-16"],[["Ma'lumot shinasi","8 bit","16 bit"],["Adres shinasi","20 bit (1 MB)","24 bit (16 MB)"],["Takt chastotasi","4,77 MHz","8 MHz"],["O'tkazuvchanlik","~1 MB/s","~8 MB/s"],["Uzilish liniyalari","IRQ2–IRQ7","IRQ2–IRQ15"],["DMA kanallari","4 ta","8 ta"],["Razyom","62 kontakt","62 + 36 kontakt"]]],
  ["p","ISA ning tarixiy ahamiyati katta: u ochiq standart bo'lgani uchun uchinchi tomon ishlab chiqaruvchilari uchun kengaytirish kartalari bozorini ochib berdi va shaxsiy kompyuterning ommalashuviga asos bo'ldi. Bugungi kunda ISA iste'moldan chiqqan, ammo uning tuzilishi magistral tamoyillarini o'rganish uchun klassik namuna bo'lib qolmoqda."],
  ["h","ISA signallari"],
  ["t",["Guruh","Signallar","Vazifasi"],[["Adres","SA0–SA19, LA17–LA23","Yacheyka yoki port adresi"],["Ma'lumot","SD0–SD15","Ma'lumot uzatish"],["Boshqaruv","MEMR, MEMW, IOR, IOW","Xotira va port bilan o'qish/yozish"],["Uzilish","IRQ3–IRQ15","Qurilmadan uzilish so'rovi"],["DMA","DRQ0–DRQ7, DACK","To'g'ridan-to'g'ri xotiraga murojaat"],["Sinxronlash","CLK, ALE, IOCHRDY","Takt, adresni qulflash, tayyorlik"],["Xizmat","RESET, AEN, IOCHCK","Boshlang'ich o'rnatish, xatolik"]]],
  ["p","IOCHRDY signali sekin qurilmalar uchun kutish taktlarini qo'shish imkonini beradi: qurilma tayyor bo'lmaguncha protsessor siklni cho'zib turadi. Bu mexanizm turli tezlikdagi kartalarni bitta magistralda ishlatishga imkon bergan."],
  ["h","Magistrallarning rivojlanishi"],
  ["t",["Magistral","Yili","Kengligi","O'tkazuvchanligi"],[["ISA","1981/1984","8/16 bit","1–8 MB/s"],["EISA","1988","32 bit","33 MB/s"],["VLB","1992","32 bit","130 MB/s"],["PCI","1993","32/64 bit","133–533 MB/s"],["AGP","1997","32 bit","266–2100 MB/s"],["PCI Express","2004","Ketma-ket liniyalar","250 MB/s dan har bir liniyaga"]]],
  ["p","Rivojlanishning umumiy yo'nalishi aniq ko'rinadi: parallel shinalardan ketma-ket liniyalarga o'tish. Parallel magistralda razryadlar orasidagi vaqt nomuvofiqligi chastotani oshirishga to'sqinlik qiladi; ketma-ket differensial liniyada esa bunday muammo yo'q va chastotani ancha yuqori ko'tarish mumkin."],
  ["h","PCI va PCI Express"],
  ["ul",["PCI — umumiy parallel shina, barcha kartalar o'tkazuvchanlikni bo'lishadi","PCI da avtomatik konfiguratsiya (Plug and Play) joriy etilgan: resurslar qo'lda emas, tizim tomonidan taqsimlanadi","PCI Express — har bir qurilmaga alohida ketma-ket liniyalar (x1, x4, x8, x16)","Liniyalar soni ortishi bilan o'tkazuvchanlik proporsional oshadi","Topologiya kommutator (switch) asosida, ya'ni qurilmalar bir-biriga xalaqit bermaydi"]],
  ["h","Tashqi interfeyslar"],
  ["t",["Interfeys","Vazifasi","Xususiyati"],[["USB","Universal periferiya ulash","Plug and play, quvvat beradi"],["SATA / NVMe","Tashqi xotirani ulash","Yuqori tezlik"],["HDMI / DisplayPort","Video va audio uzatish","Raqamli signal"],["Ethernet","Tarmoq aloqasi","100 Mbit/s – 10 Gbit/s"],["RS-232 / RS-485","Sanoat qurilmalari bilan aloqa","Uzoq masofa, sodda protokol"],["Bluetooth / Wi-Fi","Simsiz aloqa","Ko'chma qurilmalar uchun"]]],
  ["h","Mikrokontrollerni kompyuterga ulash"],
  ["p","O'quv va sanoat masalalarida mikrokontroller kompyuterga odatda uch yo'l bilan ulanadi: USB-UART o'zgartirgich orqali (eng sodda va keng tarqalgan), RS-485 orqali (uzoq masofa va ko'p qurilma) yoki Ethernet moduli orqali (tarmoq tizimlari). Har uch holatda ham ma'lumot almashinuvi kadr chegaralari va nazorat yig'indisiga ega sodda protokol asosida quriladi."],
  ["n","Umumiy tamoyil: magistral qanchalik murakkab bo'lmasin, uning asosida bir xil g'oyalar yotadi — adreslash, boshqaruv signallari, uzilish va tayyorlikni bildirish. Mikrokontroller shinalarini tushungan talaba kompyuter magistrallarini ham shu tamoyillar asosida oson o'zlashtiradi."],
  ["sim","uart"],
  ["h","Xulosa"],
  ["p","Tizimli magistral kengaytirish kartalarini ulash uchun mexanik, elektr va protokol jihatdan standartlashtirilgan interfeysdir. ISA — 8 va 16 razryadli klassik magistral bo'lib, adres, ma'lumot, boshqaruv, uzilish va DMA signallari guruhlaridan iborat. Magistrallar rivojlanishi parallel shinalardan ketma-ket differensial liniyalarga o'tish bilan tavsiflanadi; PCI Express shu yo'nalishning zamonaviy natijasi hisoblanadi."],

  ["f","R_s = R_L · (U_cc − U_chiqish) / U_chiqish","Sezgir element qarshiligi; R_L — yuk rezistori (odatda 10 kΩ)."],
  ["f","ppm = A · (R_s / R_0)^B","Konsentratsiyani baholash; A va B koeffitsientlari datchik hujjatidagi grafikdan olinadi, R_0 — toza havodagi qarshilik."],
  ["h","Isitish va barqarorlashish"],
  ["n","Muhim: MQ datchigining isitgichi taxminan 150 mA tok iste'mol qiladi va ishlaganda sezilarli qiziydi. Uni Arduino ning 5 V chiqishidan quvvatlantirish mumkin, lekin bir necha datchik yoki qo'shimcha yuklama bo'lsa alohida manba kerak. Datchikni ishga tushirgandan keyin kamida 1–2 daqiqa (birinchi marta ishlatilganda 24 soatgacha) qizdirish talab qilinadi, aks holda ko'rsatkichlar suzib yuradi."],
  ["h","Dastur"],
  ["c","const int DATCHIK = A0, ZUMZUMA = 8, QIZIL = 9, YASHIL = 10;\nint chegara = 400;                 /* ADC kodi bo'yicha chegara */\nconst int GISTEREZIS = 30;\nbool signal = false;\nint R0_kod = 0;\n\nint olchash(void)                  /* 16 marta o'rtachalash */\n{\n    long s = 0;\n    for (byte i = 0; i < 16; i++) { s += analogRead(DATCHIK); delay(5); }\n    return (int)(s >> 4);\n}\n\nvoid setup()\n{\n    pinMode(ZUMZUMA, OUTPUT); pinMode(QIZIL, OUTPUT); pinMode(YASHIL, OUTPUT);\n    Serial.begin(9600);\n    Serial.println(\"Datchik qizimoqda...\");\n    for (int i = 0; i < 60; i++) { delay(1000); }      /* 60 s qizdirish */\n    R0_kod = olchash();                                 /* toza havo darajasi */\n    Serial.print(\"Toza havo darajasi: \"); Serial.println(R0_kod);\n}\n\nvoid loop()\n{\n    int kod = olchash();\n\n    if (!signal && kod > chegara)              signal = true;\n    else if (signal && kod < chegara - GISTEREZIS) signal = false;\n\n    digitalWrite(ZUMZUMA, signal);\n    digitalWrite(QIZIL,   signal);\n    digitalWrite(YASHIL, !signal);\n\n    Serial.print(\"Kod: \");   Serial.print(kod);\n    Serial.print(\"  Holat: \"); Serial.println(signal ? \"XAVF\" : \"normal\");\n    delay(500);\n}"],
  ["p","Kodda uchta muhim yechim qo'llangan: 16 martalik o'rtachalash shovqinni kamaytiradi, 60 sekundlik qizdirish datchikni ishchi rejimga chiqaradi, gisterezis esa chegara atrofida signalizatsiyaning tez-tez yonib-o'chishining oldini oladi."],

  ["p","Nosozlikni aniqlash — ishonchli qurilmaning majburiy elementi. Datchik simi uzilsa, kirish nol yoki maksimal qiymatda qotib qoladi; dastur buni normal o'lchash deb qabul qilmasligi va xato haqida xabar berishi kerak."],

  ["ol",["Datchikni toza havoda 20–30 daqiqa qizdiring va barqaror kodni R0 sifatida yozib oling","Nazorat manbai (masalan gaz zajigalkasidan chiqqan gaz) ni datchikdan 20–30 sm masofada qisqa vaqt bering","Kodning o'sishini va qaytish vaqtini qayd eting","Chegarani toza havo darajasidan 30–50 % yuqori qilib belgilang","Gisterezis qiymatini tanlang va signalizatsiyaning barqarorligini tekshiring","Reaksiya vaqtini o'lchang: gaz berilgandan signalizatsiya ishlaguncha o'tgan vaqt","Natijalarni sinov bayonnomasiga yozing"]],
  ["n","Xavfsizlik: sinovda ochiq olov, katta miqdordagi gaz yoki yopiq xonada tajriba o'tkazish qat'iyan man etiladi. Faqat juda kichik miqdordagi nazorat manbai va yaxshi shamollatiladigan xonada ishlang. Bu qurilma o'quv maketi bo'lib, sertifikatlangan gaz signalizatori o'rnini bosa olmaydi."],
  ["h","Loyihani kengaytirish yo'nalishlari"],

  ["sim","adc"],

   INTERAKTIV SIMULYATORLAR
   ===================================================================== */
const TIMERS = [];
function clearTimers(){ while(TIMERS.length) clearInterval(TIMERS.pop()); }
function every(ms, fn){ const t = setInterval(fn, ms); TIMERS.push(t); return t; }
const ledSvg = (id,c) => `<svg width="54" height="70" viewBox="0 0 54 70"><ellipse id="${id}" cx="27" cy="26" rx="17" ry="20" fill="${c}" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="40" width="34" height="7" fill="none" stroke="currentColor"/><path d="M20 47v20M34 47v20" stroke="currentColor" stroke-width="2"/></svg>`;
const bin8 = v => v.toString(2).padStart(8,"0").replace(/(....)(....)/,"$1 $2");
const hex2 = v => v.toString(16).toUpperCase().padStart(2,"0");

const SIMS = {
led:{ t:"LED simulyatori — chiqish porti", h:"PORT razryadiga yozilgan qiymat chiqish darajasini belgilaydi. Qo'lda yoqing yoki avtomatik miltillashni ishga tushiring.",

   <div>${ledSvg("L1","var(--rail)")}</div>
   <div style="flex:1;min-width:180px"><div class="readout" id="ro"></div></div></div>
   <div class="ctrls">
    <button class="btn sm" id="tg">Yoqish</button>
    <button class="btn sm ghost" id="bl">Avtomatik miltillash</button>
    <label>Chastota <input type="range" id="fr" min="1" max="10" value="2"><b id="fv">2 Hz</b></label>
   </div>`;
  let on=false, run=null;
  const draw=()=>{ $("#L1",b).setAttribute("fill", on?"#ff4d3d":"var(--rail)");
   $("#ro",b).textContent = `DDRB.0 = 1   (chiqish rejimi)\nPORTB.0 = ${on?1:0}\nUchiqish ≈ ${on?"4.8 V":"0.0 V"}\nI_LED  ≈ ${on?"9 mA":"0 mA"}`;
   $("#tg",b).textContent = on?"O'chirish":"Yoqish"; };
  $("#tg",b).onclick=()=>{ on=!on; draw(); };
  $("#fr",b).oninput=e=>{ $("#fv",b).textContent=e.target.value+" Hz"; if(run){stop();start();} };
  const start=()=>{ const hz=+$("#fr",b).value; run=every(500/hz,()=>{on=!on;draw();}); $("#bl",b).textContent="To'xtatish"; };
  const stop=()=>{ clearInterval(run); const i=TIMERS.indexOf(run); if(i>-1)TIMERS.splice(i,1); run=null; $("#bl",b).textContent="Avtomatik miltillash"; };
  $("#bl",b).onclick=()=>{ run?stop():start(); };
  draw();
 }},

 make(b){
  b.innerHTML=`<div class="ctrls"><label>f <select id="f" style="width:auto"><option>8</option><option selected>16</option><option>12</option></select> MHz</label>
   <label>Bo'luvchi <select id="p" style="width:auto"><option>1</option><option>8</option><option selected>64</option><option>256</option><option>1024</option></select></label>

  const draw=()=>{ const {f,p,n,pl}=par(), max=Math.pow(2,n), steps=max-pl, T=steps*p/f;
   $("#bar",b).style.width=((cnt-pl)/steps*100).toFixed(1)+"%";
   $("#ro",b).textContent=`Takt: ${(1e9/f).toFixed(1)} ns,  bo'lingan takt: ${(p*1e9/f).toFixed(1)} ns\nQadamlar soni: ${max} − ${pl} = ${steps}\nTo'lib ketish davri: T = ${steps} · ${p} / ${(f/1e6)} MHz = ${(T*1000).toFixed(3)} ms\nTCNT = ${cnt}   to'lib ketishlar: ${ovf}`; };
  $("#go",b).onclick=()=>{ if(run){clearInterval(run);run=null;$("#go",b).textContent="Sanashni boshlash";return;}
   const {n,pl}=par(); cnt=pl; run=every(40,()=>{ const {n,pl}=par(); const max=Math.pow(2,n);
    cnt+=Math.max(1,Math.round((max-pl)/40)); if(cnt>=max){cnt=pl;ovf++;} draw(); });
   $("#go",b).textContent="To'xtatish"; };
  ["f","p","n","pl"].forEach(i=>{ $("#"+i,b).onchange=()=>{cnt=par().pl;draw();}; });
  draw();
 }},

uart:{ t:"UART kadr simulyatori", h:"Belgi kiriting — start, ma'lumot, paritet va stop bitlaridan iborat kadrni ko'ring.",
 make(b){
  b.innerHTML=`<div class="ctrls"><label>Belgi <input id="ch" maxlength="1" value="A" style="width:56px"></label>
   <label>Tezlik <select id="br" style="width:auto"><option>2400</option><option selected>9600</option><option>115200</option></select> bod</label>
   <label>Paritet <select id="pr" style="width:auto"><option selected>yo'q</option><option>juft</option><option>toq</option></select></label></div>
   <svg id="w" viewBox="0 0 540 96" style="width:100%;height:96px"></svg><div class="readout" id="ro"></div>`;
  const draw=()=>{ const c=($("#ch",b).value||"A").charCodeAt(0)&255, br=+$("#br",b).value, pm=$("#pr",b).value;
   const bits=[]; for(let i=0;i<8;i++) bits.push((c>>i)&1);
   const ones=bits.filter(x=>x).length;
   const par = pm==="yo'q"?null:(pm==="juft"?(ones%2):(1-ones%2));
   const seq=[{v:0,n:"ST"}].concat(bits.map((v,i)=>({v,n:"D"+i})));
   if(par!==null) seq.push({v:par,n:"P"}); seq.push({v:1,n:"SP"});
   const w=500/seq.length; let d=`M20 ${seq[0].v?20:70}`, x=20, lab="";
   seq.forEach((s,i)=>{ const y=s.v?20:70; d+=`L${x} ${y}L${x+w} ${y}`; lab+=`<text x="${x+w/2}" y="88" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="monospace">${s.n}</text><line x1="${x}" y1="14" x2="${x}" y2="76" stroke="var(--line)"/>`; x+=w; });
   $("#w",b).innerHTML=`${lab}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
   const tb=(seq.length)/br*1000;
   $("#ro",b).textContent=`Belgi '${String.fromCharCode(c)}' = 0x${hex2(c)} = 0b${c.toString(2).padStart(8,"0")}\nUzatish tartibi: start(0) → D0..D7 (kichik bitdan) ${par!==null?"→ paritet("+par+")":""} → stop(1)\nBitlar soni: ${seq.length},  1 bit vaqti = ${(1e6/br).toFixed(1)} µs\nKadr vaqti ≈ ${tb.toFixed(3)} ms,  sekundiga ≈ ${Math.floor(br/seq.length)} belgi`; };
  ["ch","br","pr"].forEach(i=>{ $("#"+i,b).oninput=draw; $("#"+i,b).onchange=draw; }); draw();
 }},

alu:{ t:"ALU va bayroqlar simulyatori", h:"Operandlar va amalni tanlang — natija hamda C, Z, N, V bayroqlari hisoblanadi.",
 make(b){
  b.innerHTML=`<div class="ctrls"><label>A <input id="a" value="7F" maxlength="2" style="width:64px"> h</label>
   <label>B <input id="bb" value="01" maxlength="2" style="width:64px"> h</label>
   <label>Amal <select id="op" style="width:auto"><option>ADD</option><option>SUB</option><option>AND</option><option>OR</option><option>XOR</option><option>SHL</option><option>SHR</option></select></label></div>
   <div class="readout" id="ro"></div>`;
  const draw=()=>{ const A=parseInt($("#a",b).value,16)&255||0, B=parseInt($("#bb",b).value,16)&255||0, op=$("#op",b).value;
   let r=0,C=0,V=0;
   if(op==="ADD"){ const s=A+B; r=s&255; C=s>255?1:0; V=((~(A^B)&(A^r))&128)?1:0; }
   else if(op==="SUB"){ const s=A-B; r=s&255; C=s<0?1:0; V=(((A^B)&(A^r))&128)?1:0; }
   else if(op==="AND") r=A&B; else if(op==="OR") r=A|B; else if(op==="XOR") r=A^B;
   else if(op==="SHL"){ r=(A<<1)&255; C=(A&128)?1:0; }
   else { r=A>>1; C=A&1; }
   const Z=r===0?1:0, N=(r&128)?1:0;
   $("#ro",b).textContent=`A = 0x${hex2(A)} = ${bin8(A)} = ${A}\nB = 0x${hex2(B)} = ${bin8(B)} = ${B}\n${op} natija: 0x${hex2(r)} = ${bin8(r)} = ${r}  (ishorali: ${r>127?r-256:r})\n\nBayroqlar:  C=${C}   Z=${Z}   N=${N}   V=${V}`; };
  ["a","bb","op"].forEach(i=>{ $("#"+i,b).oninput=draw; $("#"+i,b).onchange=draw; }); draw();
 }}

/* =====================================================================
   SERVER BILAN SINXRONLASH (Google Apps Script)
   Darslik Apps Script orqali ochilganda avtomatik server rejimiga o'tadi.
   Oddiy faylda ochilsa, hamma narsa avvalgidek lokal ishlaydi.
   ===================================================================== */
/* Joriy seans paroli. sessionStorage da saqlanadi: sahifa yangilanganda
   yo'qolmaydi, brauzer yopilganda esa o'chib ketadi. */
let SESSION_PW = (function(){ try { return sessionStorage.getItem("mpt.spw") || ""; } catch(e){ return ""; } })();
function setSessionPw(p){
  SESSION_PW = p || "";
  try { p ? sessionStorage.setItem("mpt.spw", p) : sessionStorage.removeItem("mpt.spw"); } catch(e){}
}
const QKEY = "mpt.queue.v1";

/* ---------------------------------------------------------------
   SERVER HAVOLASI (Apps Script /exec manzili).
   Darslik Apps Script ichidan ochilsa, bu qator ishlatilmaydi.
   Boshqa joyga (GitHub Pages, sayt) joylashtirilganda ana shu havola
   orqali baza bilan bog'lanadi. Havolani admin panelidan ham
   o'zgartirish mumkin — u brauzer xotirasida saqlanadi.
   --------------------------------------------------------------- */
const MPT_API_ASOSIY = "https://script.google.com/macros/s/AKfycbwEgE14BnWx7Y8d_qdHqIY8t4MzZuPMBWCwZjONjBeI2QkeM1iXxwBHgusiIjSEbS0/exec";
let MPT_API = (function(){ try { return localStorage.getItem("mpt.api") || MPT_API_ASOSIY; }
                           catch(e){ return MPT_API_ASOSIY; } })();
function setApi(u){
  MPT_API = (u || "").trim();
  try { MPT_API ? localStorage.setItem("mpt.api", MPT_API) : localStorage.removeItem("mpt.api"); } catch(e){}
  cloudBadge();
}

const Cloud = {
  /* Apps Script muhitida google.script.run mavjud bo'ladi.
     Har safar tekshiramiz — sahifa yuklanish tartibiga bog'liq bo'lmasligi uchun. */
  get gs(){ return !!(window.google && window.google.script && window.google.script.run); },
  get on(){ return Cloud.gs || !!MPT_API; },
  init(){ cloudBadge(); },
  raw(action, payload){
    const sorov = JSON.stringify(Object.assign({ action }, payload));
    if(!Cloud.gs && MPT_API){                       /* havola orqali ishlash */
      if(typeof fetch !== "function") return Promise.reject(aloqaXato());
      return fetch(MPT_API, { method:"POST", redirect:"follow",
          headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: sorov })
        .then(res => res.text(), () => { throw aloqaXato(); })
        .then(txt => {
          let r;
          try { r = JSON.parse(txt); }
          catch(e){
            /* Apps Script JSON o'rniga HTML qaytardi — bu deyarli har doim
               server kodi eski versiyada ekanini yoki havola noto'g'riligini bildiradi */
            const t = String(txt || "");
            if(/Malformed HTML/i.test(t))
              throw serverXato("Serverdagi HTML fayllar eski — Apps Script dagi index, css va js fayllarini yangilang, so'ng New version chiqaring");
            if(/^\s*</.test(t))
              throw serverXato("Server JSON o'rniga sahifa qaytardi — deployment eski versiyada yoki havola noto'g'ri");
            throw aloqaXato();
          }
          if(!r.ok) throw serverXato(r.xato); return r;
        });
    }
    return new Promise((ok, err) => {
      if(!Cloud.gs) return err(aloqaXato());
      let tugadi = false;
      const t = setTimeout(()=>{ if(!tugadi){ tugadi=true; err(aloqaXato("Server javob bermadi")); } }, 30000);
      google.script.run
        .withSuccessHandler(txt => {
          if(tugadi) return; tugadi=true; clearTimeout(t);
          let r; try { r = JSON.parse(txt); } catch(e){ return err(aloqaXato()); }
          r.ok ? ok(r) : err(serverXato(r.xato));
        })
        .withFailureHandler(e => { if(tugadi) return; tugadi=true; clearTimeout(t);
          err(aloqaXato(e && e.message ? e.message : String(e))); })
        .api(sorov);
    });
  }
};
/* aloqa xatosi — internet yoki server yetib bormadi (lokal davom etsa bo'ladi)
   server xatosi  — server javob berdi, lekin amalni rad etdi (masalan login band) */
function aloqaXato(matn){ const e = new Error(matn || "Serverga ulanib bo'lmadi"); e.aloqa = true; return e; }
function serverXato(matn){ const e = new Error(matn || "Server xatosi"); e.aloqa = false; return e; }

const cred = () => { const u = me(); return u ? { login: u.login, pw: u.role === "admin" ? SESSION_PW : (u.pw || SESSION_PW) } : {}; };

/* ---------- yuborilmagan amallar navbati ---------- */
function qAll(){ try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch(e){ return []; } }
function qSet(q){ try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){} }
function qAdd(action, payload){ const q = qAll(); q.push({ action, payload }); qSet(q); cloudBadge(); }

async function qFlush(){
  if(!Cloud.on) return;
  const q = qAll(); if(!q.length) return;
  const qoldi = [];
  for(const op of q){
    try { await Cloud.raw(op.action, op.payload); }
    catch(e){ if(e.aloqa) qoldi.push(op); }   /* server rad etgan yozuv navbatda qolmaydi */
  }
  qSet(qoldi); cloudBadge();
}

/* ---------- fon rejimida yuborish ----------
   ok(r)   — muvaffaqiyatli yuborilganda
   xato(e) — yuborilmaganda (server rad etdi yoki parol yo'q)
   Faqat aloqa uzilganda navbatga qo'yiladi; server rad etsa qayta urinilmaydi. */
function cloudPush(action, payload, ok, xato){
  const p = Object.assign({}, payload, cred());
  if(!Cloud.on || !p.login) return;
  if(!p.pw){ if(xato) xato(new Error("Parolingiz xotiradan o'chgan — qayta kiriting")); return; }
  Cloud.raw(action, p)
    .then(r => { cloudBadge(); if(ok) ok(r); })
    .catch(e => { if(e.aloqa) qAdd(action, p); cloudBadge(); if(xato) xato(e); });
}

/* ---------- holat ko'rsatkichi ---------- */
function cloudBadge(){
  const b = $("#cloudb"); if(!b) return;
  const n = qAll().length;
  if(!Cloud.on){ b.textContent = "lokal"; b.title = "Ma'lumot faqat shu qurilmada saqlanmoqda"; b.className = "badge"; }
  else if(n){ b.textContent = n + " kutmoqda"; b.title = "Yuborilmagan yozuvlar bor, ulanish tiklanganda jo'natiladi"; b.className = "badge warn"; }
  else { b.textContent = "server"; b.title = "Ma'lumot umumiy bazaga saqlanmoqda"; b.className = "badge ok"; }
}

/* ---------- talaba uchun: o'z ma'lumotini tortib olish ---------- */
async function cloudPullMe(login, pw){
  const r = await Cloud.raw("mening", { login, pw });
  if(r.data){
    const saqla={}; const eski=userData(login).progress||{};
    const oqi={};
    Object.keys(eski).forEach(id=>{ if(eski[id] && eski[id].mashq) saqla[id]=eski[id].mashq; if(eski[id] && eski[id].read) oqi[id]=eski[id].read; });
    S.data[login] = Object.assign(userData(login), r.data);
    Object.keys(saqla).forEach(id=>{ lp(login,id).mashq = saqla[id]; });
    Object.keys(oqi).forEach(id=>{ lp(login,id).read = oqi[id]; });
  }
  if(r.access){ S.access.g = r.access.g || {}; S.access.u[login] = (r.access.u||{})[login] || {}; }
  save();
  return r;
}

function lessonState(login,id){
  const p=userData(login).progress[id];
  if(!p) return "none";
  if(BAHOLI()){ if(p.test && p.test.score>=p.test.total*0.6) return "done"; }
  else if(p.mashq && p.mashq.pct>=60) return "done";
  if(p.opened) return "part";
  return "none";
}
/* Imtihon: barcha darslar o'zlashtirilgandan keyin ochiladi.
   Admin alohida ruxsat bersa (EXAM1/EXAM2), shart tekshirilmaydi. */
function imtihonOchiq(login,sem){
  const kalit="EXAM"+sem;
  const shaxsiy=S.access.u[login]||{};
  if(shaxsiy[kalit]!==undefined) return !!shaxsiy[kalit];
  const ls=semLessons(sem);
  return ls.length>0 && ls.every(l=>lessonState(login,l.id)==="done");
}
function qolganDarslar(login,sem){
  return semLessons(sem).filter(l=>lessonState(login,l.id)!=="done");
}
function progressOf(login,sem){
  const ls=semLessons(sem); if(!ls.length) return 0;
  let s=0; ls.forEach(l=>{ const st=lessonState(login,l.id); s+= st==="done"?1: st==="part"?0.4:0; });
  return Math.round(s/ls.length*100);
}
function avgScore(login){
  const d=userData(login); let t=0,n=0;
  Object.values(d.progress).forEach(p=>{ const q=tn(p); if(q){ t+=q.score/q.total*100; n++; } });
  return n? Math.round(t/n):0;
}
function typeAvg(login,type){
  const d=userData(login); let t=0,n=0;
  LESSONS.filter(l=>l.type===type).forEach(l=>{ const q=tn(d.progress[l.id]); if(q){ t+=q.score/q.total*100; n++; } });
  return n?Math.round(t/n):0;
}

/* ---------- O'QISH NAZORATI (serverga yuk tushmaydi: hammasi brauzerda) ---------- */
const nazoratSoni = l => (l && l.checks) ? l.checks.length : 0;
const nazoratOtgan = (login,l) => { if(isAdmin()) return nazoratSoni(l); const p=lp(login,l.id); return Math.min(p.read||0, nazoratSoni(l)); };
const nazoratTugagan = (login,l) => isAdmin() || nazoratOtgan(login,l) >= nazoratSoni(l);
function segmentli(l, otgan){
  const ch=l.checks||[]; if(!ch.length) return blocks2html(l.body);
  let h="", from=0;
  ch.forEach((c,k)=>{
    h+=`<section class="seg ${k>otgan?"seglock":""}" data-seg="${k}">${blocks2html(l.body.slice(from,c.at+1))}`;
    if(k<otgan) h+=`<div class="chk done"><b>✓ O'qish nazorati o'tildi</b></div>`;
    else if(k===otgan) h+=chkHtml(c,k,ch.length);
    h+=`</section>`; from=c.at+1;
  });
  return h+`<section class="seg tail ${otgan<ch.length?"seglock":""}" data-seg="${ch.length}">${blocks2html(l.body.slice(from))}`+"@@TAIL@@"+`</section>`;
}
function chkHtml(c,k,n){
  return `<div class="chk" data-k="${k}"><div class="chkh">O'qish nazorati · ${k+1} / ${n}</div>
    <p class="chkq">${esc(c.q)}</p>
    ${c.o.map((o,i)=>`<button class="opt" data-v="${i}">${esc(o)}</button>`).join("")}
    <div class="chkm"></div></div>`;
}
function nazoratUlash(l){
  const u=me(), p=lp(u.login,l.id), ch=l.checks||[];
  $$(".chk[data-k]").forEach(box=>{
    const k=+box.dataset.k, c=ch[k];
    $$(".opt",box).forEach(btn=>btn.onclick=()=>{
      const v=+btn.dataset.v, m=$(".chkm",box);
      if(v===c.a){
        $$(".opt",box).forEach(x=>x.disabled=true); btn.classList.add("ok");
        p.read=Math.max(p.read||0,k+1); save();
        m.innerHTML=`<div class="msg ok">To'g'ri. ${esc(c.e||"")}</div>`;
        const next=$(`.seg[data-seg="${k+1}"]`);
        if(next){ next.classList.remove("seglock"); if(next.scrollIntoView) next.scrollIntoView({behavior:"smooth",block:"start"}); }
        box.classList.add("done");
        if(k+1<ch.length){ const ns=$(`.seg[data-seg="${k+1}"]`); if(ns && !$(".chk",ns)){ ns.insertAdjacentHTML("beforeend",chkHtml(ch[k+1],k+1,ch.length)); nazoratUlash(l); } }
        else { const ti=$("#tichki"); if(ti){ ti.innerHTML=testIchki(u,l,p,darsOchiq(u.login,l.id)); const t=$("#totest"); if(t) t.onclick=()=>go("#/test/"+l.id); } toast("Barcha nazoratlar o'tildi"); }
      } else {
        btn.classList.add("bad"); btn.disabled=true;
        m.innerHTML=`<div class="msg warn">Noto'g'ri. Yuqoridagi matnni qayta o'qib chiqing va yana urinib ko'ring.</div>`;
      }
    });
  });
}

        baho ham serverda qo'yiladi. Sahifa kodidan javob topib bo'lmaydi.
     3. Savol ochiq turganda oyna almashtirilsa (boshqa ilova, boshqa
        varaq, kichraytirish), O'SHA SAVOL BEKOR qilinadi — ball berilmaydi.
     4. Har bir chiqish serverda qayd etiladi va o'qituvchiga ko'rinadi.
     5. Bankda 30 ta savol, har bir talabaga 15 tasi tasodifiy beriladi;

        savol — oldindan tayyorlangan javoblar ro'yxati yaroqsiz bo'ladi.
   ===================================================================== */

/* joriy seans; test ketayotganini shu obyekt ko'rsatadi */
let TEST = null;
const testKetmoqda = () => !!(TEST && TEST.tok && !TEST.tugadi);

/* serverga so'rov — login va parol bilan, javobni kutib */
function testSorov(action, payload){
  const p = Object.assign({}, payload, cred());
  if(!Cloud.on)  return Promise.reject(serverXato("Test umumiy bazaga yoziladi — internet aloqasi kerak"));
  if(!p.login)   return Promise.reject(serverXato("Tizimga qaytadan kiring"));
  if(!p.pw)      return Promise.reject(serverXato("Parolingiz xotiradan o'chgan — qaytadan kiring"));
  return Cloud.raw(action, p);
}

  try{
    const r=await testSorov("testBoshla",{darsId:id});
    if(!Array.isArray(r.kalit)||r.kalit.length!==(r.savollar||[]).length)
      throw new Error("Server eski versiyada: Code.gs yangilanmagan. O'qituvchi Code.gs va Javoblar.gs ni yangi versiya (New version) qilib joylashi kerak.");
    TEST={ id, tok:r.tok, kalit:r.kalit||[], savollar:r.savollar||[], javoblar:{}, bekorlar:{},
           chiqish:r.chiqish||0, idx:0, band:false, tugadi:false, boshlandi:Date.now() };
    (r.javoblar||[]).forEach(j=>{
      TEST.javoblar[j.i]={ v:j.v, ok:!!Number(j.ok) };
      if(Number(j.b)) TEST.bekorlar[j.i]=true;
    });
    TEST.idx=TEST.savollar.findIndex((x,i)=>TEST.javoblar[i]===undefined);
    if(TEST.idx<0) TEST.idx=TEST.savollar.length;
    kuzatuvniYoq();
    if(r.davom) toast("Tashlab ketilgan test davom etmoqda");
    qChiz();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent="Testni boshlash"; }
    const qoshimcha = e.aloqa
      ? "<p class=\"sub\">Test javoblari umumiy bazada hisoblanadi, shuning uchun test topshirish uchun internet aloqasi zarur. Ma'ruza, simulyatorlar va amaliy qismlar aloqasiz ham ishlaydi.</p>"
      : "";
    tz.innerHTML=`<div class="card"><div class="msg bad">${esc(e.message)}</div>${qoshimcha}
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="tstart">Qayta urinib ko'rish</button>
      <button class="btn ghost" id="back">Darsga qaytish</button></div></div>`;
    afterTest(id);
  }
}

/* ---------- joriy savolni chizish ---------- */
function qChiz(){
  const tz=$("#tzona"); if(!tz||!TEST) return;
  const n=TEST.savollar.length;
  if(TEST.idx>=n) return testYakunla();

  const q=TEST.savollar[TEST.idx];
  const l=byId(TEST.id);
  let matn="", variantlar=[], sim="";
  if(q.t==="b"){
    const bank=(l.tests||[])[q.n]||{q:"",o:[]};
    matn=bank.q;
    variantlar=q.p.map(j=>bank.o[j]);
  }else{
    matn=q.q; variantlar=q.o||[]; sim=q.sim||"";
  }

  const berilgan=Object.keys(TEST.javoblar).length;
  const foiz=Math.round(berilgan/n*100);
  tz.innerHTML=`<div class="tbar">
     <div class="tprog"><span style="width:${foiz}%"></span></div>
     <div class="tmeta"><b>${TEST.idx+1} / ${n}</b> savol
       ${TEST.chiqish?`<span class="tag bad">${cx(TEST.chiqish)} ta chiqish qayd etildi</span>`:""}</div>
   </div>
   <div class="card qcard">
     <h4 class="qtext">${esc(matn)}</h4>
     ${sim&&SIMS[sim]?`<div class="sim" data-sim="${esc(sim)}"></div>`:""}
     <div id="opts">${variantlar.map((o,i)=>
        `<label class="opt" data-v="${i}"><input type="radio" name="tq" value="${i}"><span>${esc(o)}</span></label>`).join("")}</div>
     <div id="qres"></div>
     <div id="qnav" style="margin-top:14px"></div>
   </div>
   <p class="hint">Oynani almashtirmang: bu savol bekor qilinadi.</p>`;
  if(sim&&SIMS[sim]) mountSims(tz);
  $$("#opts .opt").forEach(o=>o.onclick=ev=>{ ev.preventDefault(); javobYubor(+o.dataset.v); });
}

/* ---------- javobni serverga yuborish ---------- */
function javobYubor(v){
  if(!TEST||TEST.band) return;
  const i=TEST.idx;
  if(TEST.javoblar[i]!==undefined) return;
  const k=TEST.kalit[i];
  if(!k){ const res=$("#qres"); if(res) res.innerHTML=`<div class="msg bad">Javob kaliti topilmadi — testni qaytadan oching.</div>`; return; }
  const ok = v===k.a;
  TEST.javoblar[i]={v,ok};
  $$("#opts input").forEach(x=>x.disabled=true);
  belgila(k.a, v, ok, k.e);
}

/* javob natijasini ko'rsatish */
function belgila(togriPos, tanlangan, togri, izoh){
  $$("#opts .opt").forEach(o=>{
    const j=+o.dataset.v;
    if(j===togriPos) o.classList.add("right");
    else if(j===tanlangan) o.classList.add("wrong");
    const inp=$("input",o); if(inp) inp.disabled=true;
  });
  const res=$("#qres");
  if(res) res.innerHTML=`<div class="msg ${togri?"ok":"bad"}">${togri?"To'g'ri":"Noto'g'ri"}</div>
    ${izoh?`<div class="exp">${esc(izoh)}</div>`:""}`;
  keyingiTugma();
}

/* savol bekor qilinganini ko'rsatish */
function bekorKorsat(){
  $$("#opts .opt").forEach(o=>{ o.classList.add("bekor"); const i=$("input",o); if(i) i.disabled=true; });
  const res=$("#qres");
  if(res) res.innerHTML=`<div class="msg bad"><b>Bu savol bekor qilindi.</b>
    Savol ochiq turganda oyna almashtirildi, shuning uchun unga ball berilmaydi.</div>`;
  keyingiTugma();
}

function keyingiTugma(){
  const nav=$("#qnav"); if(!nav||!TEST) return;
  const oxirgi = TEST.idx >= TEST.savollar.length-1;
  nav.innerHTML=`<button class="btn" id="qnext">${oxirgi?"Testni yakunlash":"Keyingi savol →"}</button>`;
  $("#qnext").onclick=()=>{ TEST.idx++; qChiz(); };
}

/* ---------- oyna almashtirildi ---------- */
let OYNA_BAND=false;
function oynaOzgardi(){
  if(!testKetmoqda()) return;
  if(Date.now()-TEST.boshlandi<400) return;          /* boshlanishdagi tasodifiy hodisa */
  const i=TEST.idx;
  const ochiq = i<TEST.savollar.length && TEST.javoblar[i]===undefined;
  TEST.chiqish=(TEST.chiqish||0)+1;
  if(ochiq){
    TEST.bekorlar[i]=true;
    TEST.javoblar[i]={v:-1,ok:false};
    bekorKorsat();
  } else {
    const tm=$(".tmeta");
    if(tm) tm.innerHTML=`<b>${Math.min(TEST.idx+1,TEST.savollar.length)} / ${TEST.savollar.length}</b> savol
      <span class="tag bad">${cx(TEST.chiqish)} ta chiqish qayd etildi</span>`;
  }
}

function kuzatuvniYoq(){
  if(window.__mptKuzatuv) return;
  window.__mptKuzatuv=true;
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) oynaOzgardi(); });
  window.addEventListener("blur",()=>oynaOzgardi());
  window.addEventListener("beforeunload",e=>{
    if(!testKetmoqda()) return;
    e.preventDefault(); e.returnValue="Test tugatilmagan. Sahifadan chiqsangiz ochiq savol bekor qilinadi.";
    return e.returnValue;
  });
}

/* ---------- testni yakunlash ---------- */
async function testYakunla(){
  const tz=$("#tzona"); if(!tz||!TEST) return;
  const id=TEST.id, l=byId(id), u=me();
  tz.innerHTML=`<div class="card"><p class="hint">Natija hisoblanmoqda...</p></div>`;
  try{
    const jv=Object.keys(TEST.javoblar).map(i=>({i:+i, v:TEST.javoblar[i].v, b:TEST.bekorlar[i]?1:0}));
    const r=await testSorov("testTopshir",{tok:TEST.tok,javoblar:jv,chiqish:TEST.chiqish||0,tur:TYPE_NM[l.type],mavzu:l.title});
    TEST.tugadi=true;
    const p=lp(u.login,id);
    const prev=p.test?p.test.attempts:0;
    p.test={score:r.ball,total:r.jami,date:nowISO(),attempts:prev+1,chiqish:r.chiqish,bekor:r.bekor};
    if(qaytaRuxsat(u.login,id)) ruxsatBer("RETRY:"+id,false,u.login);
    save();
    const pc=r.foiz;
    tz.innerHTML=`<div class="card" style="text-align:center">
      <div class="score" style="color:${pc>=60?"var(--ok)":"var(--bad)"}">${r.ball} / ${r.jami}</div>
      <p class="sub">${pc}% · ${pc>=86?"a'lo":pc>=71?"yaxshi":pc>=60?"qoniqarli":"takrorlash tavsiya etiladi"}</p>
      ${r.bekor?`<div class="msg warn">Oyna almashtirilgani uchun ${r.bekor} ta savol bekor qilindi.
         Bu savollarga ball berilmadi va holat o'qituvchiga ko'rinadi.</div>`:""}
      ${r.chiqish?`<p class="hint">Test davomida ${cx(r.chiqish)} marta sahifadan chiqish qayd etildi.</p>`:""}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" id="b2">Darsga qaytish</button>
        <button class="btn ghost" id="b3">Natijalarim</button></div></div>`;
    $("#b2").onclick=()=>go("#/lesson/"+id);
    $("#b3").onclick=()=>go("#/results");
    TEST=null;
  }catch(e){
    tz.innerHTML=`<div class="card"><div class="msg bad">${esc(e.message)}</div>
      <button class="btn" id="qr">Natijani qayta so'rash</button></div>`;
    $("#qr").onclick=()=>testYakunla();
  }
}

/* testdan chiqib ketish — ochiq savol bekor qilinadi, seans saqlanadi */
async function testdanChiqish(){
  if(!testKetmoqda()) return;
  const i=TEST.idx;
  if(i<TEST.savollar.length && TEST.javoblar[i]===undefined){ TEST.bekorlar[i]=true; TEST.javoblar[i]={v:-1,ok:false}; TEST.chiqish=(TEST.chiqish||0)+1; }
  /* kalit brauzerda bo'lgani uchun testni tashlab ketib qaytish mumkin emas: shu paytgacha berilgan javoblar topshiriladi */
  const jv=Object.keys(TEST.javoblar).map(k=>({i:+k, v:TEST.javoblar[k].v, b:TEST.bekorlar[k]?1:0}));
  const l=byId(TEST.id);
  try{ await testSorov("testTopshir",{tok:TEST.tok,javoblar:jv,chiqish:TEST.chiqish||0,tur:TYPE_NM[l.type],mavzu:l.title}); }catch(e){}
  toast("Testdan chiqdingiz — berilgan javoblar topshirildi");
  TEST=null;
}

/* =====================================================================
   MASHQ REJIMI — testlar bahoga ta'sir qilmaydi
   Savollar va variantlar brauzerda aralashtiriladi, to'g'ri javoblar
   serverdan BITTA so'rov bilan olinadi. Jadvalga yozilmaydi: server yuki yo'q.
   ===================================================================== */
let MASHQ=null;

function mashqSahifa(id){
  const l=byId(id);
  return page(`<h1>Mashq testi — ${esc(l.title)}</h1>
   <div id="tzona"><div class="card">
    <h3 style="margin-top:0">Mashq rejimi</h3>
    <ol class="rules">
     <li>Savollar <b>birma-bir</b> beriladi, har bir javobdan keyin <b>izoh</b> ko'rsatiladi.</li>
     <li>Bu test <b>bahoga ta'sir qilmaydi</b> — mavzuni mustahkamlash uchun. Istagancha takrorlashingiz mumkin.</li>
     <li>Savollar bankdan tasodifiy tanlanadi, variantlar har safar aralashadi.</li>
     <li>Mashqda <b>60 % va undan yuqori</b> natija mavzuni o'zlashtirilgan deb hisoblanadi (imtihonga ruxsat uchun).</li>
    </ol>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button class="btn" id="mstart">Mashqni boshlash</button>
      <button class="btn ghost" id="back">Darsga qaytish</button>
      <a class="btn ghost" href="${QUIZ_URL}" target="_blank" rel="noopener">Baholanuvchi test — QuizUz</a>
    </div>
   </div></div>`);
}

async function mashqBoshla(id){
  const l=byId(id), tz=$("#tzona"), btn=$("#mstart");
  if(btn){ btn.disabled=true; btn.textContent="Yuklanmoqda..."; }
  try{
    const bank=l.tests||[];
    const idx=bank.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=rnd(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    const tanlangan=idx.slice(0,Math.min(15,idx.length));
    const r=await testSorov("mashq",{darsId:id,idx:tanlangan});
    const savollar=r.items.map(it=>{
      const q=bank[it.n];
      const p=q.o.map((_,k)=>k);
      for(let i=p.length-1;i>0;i--){ const j=rnd(i+1); [p[i],p[j]]=[p[j],p[i]]; }
      return {n:it.n,p,a:p.indexOf(it.a),e:it.e};
    });
    MASHQ={id,savollar,idx:0,ball:0,javob:{}};
    mashqChiz();
  }catch(e){
    tz.innerHTML=`<div class="card"><div class="msg bad">${esc(e.message)}</div>
      <p class="sub">Mashq savollari uchun internet aloqasi kerak. Ma'ruza va simulyatorlar aloqasiz ham ishlaydi.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="mstart">Qayta urinib ko'rish</button>
      <button class="btn ghost" id="back">Darsga qaytish</button></div></div>`;
    afterTest(id);
  }
}

function mashqChiz(){
  const tz=$("#tzona"); if(!tz||!MASHQ) return;
  const m=MASHQ, n=m.savollar.length;
  if(m.idx>=n) return mashqYakun();
  const q=m.savollar[m.idx], bank=byId(m.id).tests[q.n];
  tz.innerHTML=`<div class="tbar">
     <div class="tprog"><span style="width:${Math.round(m.idx/n*100)}%"></span></div>
     <div class="tmeta"><b>${m.idx+1} / ${n}</b> savol <span class="tag">mashq</span></div></div>
   <div class="card qcard">
     <h4 class="qtext">${esc(bank.q)}</h4>
     <div id="opts">${q.p.map((j,i)=>`<label class="opt" data-v="${i}"><input type="radio" name="tq" value="${i}"><span>${esc(bank.o[j])}</span></label>`).join("")}</div>
     <div id="qres"></div><div id="qnav" style="margin-top:14px"></div>
   </div>`;
  $$("#opts .opt").forEach(o=>o.onclick=ev=>{ ev.preventDefault(); mashqJavob(+o.dataset.v); });
}

function mashqJavob(v){
  const m=MASHQ; if(!m||m.javob[m.idx]!==undefined) return;
  const q=m.savollar[m.idx], togri=(v===q.a);
  m.javob[m.idx]=v; if(togri) m.ball++;
  $$("#opts .opt").forEach(o=>{
    const j=+o.dataset.v;
    if(j===q.a) o.classList.add("right"); else if(j===v) o.classList.add("wrong");
    const inp=$("input",o); if(inp) inp.disabled=true;
  });
  const res=$("#qres");
  if(res) res.innerHTML=`<div class="msg ${togri?"ok":"bad"}">${togri?"To'g'ri":"Noto'g'ri"}</div>${q.e?`<div class="exp">${esc(q.e)}</div>`:""}`;
  const nav=$("#qnav"), oxirgi=m.idx>=m.savollar.length-1;
  nav.innerHTML=`<button class="btn" id="qnext">${oxirgi?"Mashqni yakunlash":"Keyingi savol →"}</button>`;
  $("#qnext").onclick=()=>{ m.idx++; mashqChiz(); };
}

function mashqYakun(){
  const tz=$("#tzona"); if(!tz||!MASHQ) return;
  const m=MASHQ, u=me(), p=lp(u.login,m.id), jami=m.savollar.length;
  const pc=Math.round(m.ball/jami*100), eski=p.mashq||{attempts:0,pct:0};
  p.mashq={score:m.ball,total:jami,date:nowISO(),attempts:eski.attempts+1,pct:Math.max(eski.pct||0,pc)};
  save();
  tz.innerHTML=`<div class="card" style="text-align:center">
     <div class="score" style="color:${pc>=60?"var(--ok)":"var(--bad)"}">${m.ball} / ${jami}</div>
     <p class="sub">${pc}% · ${pc>=86?"a'lo":pc>=71?"yaxshi":pc>=60?"qoniqarli":"mavzuni qayta o'qib, takrorlang"}</p>
     <p class="hint">Mashq natijasi bahoga ta'sir qilmaydi.</p>
     <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
       <button class="btn" id="m1">Yana mashq qilish</button>
       <button class="btn ghost" id="m2">Darsga qaytish</button></div></div>`;
  const id=m.id; MASHQ=null;
  $("#m1").onclick=()=>go("#/test/"+id);
  $("#m2").onclick=()=>go("#/lesson/"+id);
}

function downloadCSV(rows,name){
  const csv="\uFEFF"+rows.map(r=>r.map(c=>{ const s=String(c==null?"":c).replace(/"/g,'""'); return /[";\n,]/.test(s)?`"${s}"`:s; }).join(";")).join("\r\n");
  const a=el("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  toast("Fayl yuklab olindi");
}

/* ---------- diagramma ---------- */
function barChart(data,unit){
  if(!data.length) return `<div class="empty">Ma'lumot yo'q</div>`;
  const W=520,H=190,pad=28, max=Math.max(100,...data.map(d=>d.v)), bw=(W-pad*2)/data.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
   ${[0,.25,.5,.75,1].map(t=>`<line class="gl" x1="${pad}" y1="${10+(H-46)*t}" x2="${W-6}" y2="${10+(H-46)*t}"/>
     <text x="2" y="${14+(H-46)*t}">${Math.round(max*(1-t))}</text>`).join("")}
   ${data.map((d,i)=>{ const h=(H-46)*(d.v/max), x=pad+i*bw+bw*.18, w=bw*.64;
     return `<rect x="${x}" y="${10+(H-46)-h}" width="${w}" height="${Math.max(1,h)}" fill="var(--accent)" rx="2"/>
      <text x="${x+w/2}" y="${H-20}" text-anchor="middle">${esc(d.l)}</text>
      <text x="${x+w/2}" y="${6+(H-46)-h}" text-anchor="middle">${d.v}${unit||""}</text>`; }).join("")}</svg>`;
}

        <div class="row" style="margin-top:8px"><input id="apiu" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(MPT_API)}">

  if($("#apiok2")) $("#apiok2").onclick=async ()=>{

      $("#apim").innerHTML=`<div class="msg err">Havola /exec bilan tugashi kerak.</div>`; return; }

  if($("#apiok")) $("#apiok").onclick=()=>{

      toast("Havola /exec bilan tugashi kerak", true); return; }

    setTimeout(()=>{ const b=$("#pull"); if(b) b.click(); }, 60);
  };

  $$("[data-u]").forEach(b=>b.onclick=()=>showStudent(b.dataset.u));

  if($("#e1")) $("#e1").onclick=()=>{ const r=[["Familiya","Ism","Sharif","Guruh","Login","Parol","1-sem %","2-sem %","O'rtacha %","Ro'yxatdan o'tgan","So'nggi faollik"]];

    downloadCSV(r,"talabalar.csv"); };
  if($("#e2")) $("#e2").onclick=()=>{ const r=[["Talaba","Guruh","Semestr","Hafta","Tur","Mavzu","Ball","Maksimal","Foiz","Urinish","Oynadan chiqish","Bekor qilingan savol","Sana"]];

      r.push([`${u.familiya} ${u.ism}`,u.guruh,l.sem,l.week,TYPE_NM[l.type],l.title,p.test.score,p.test.total,Math.round(p.test.score/p.test.total*100),p.test.attempts,cxT(p.test.chiqish||0),p.test.bekor||0,dstr(p.test.date)]); }));
    downloadCSV(r,"test_natijalari.csv"); };
  if($("#e3")) $("#e3").onclick=()=>{ const r=[["Talaba","Guruh","Semestr","Variant","Savol","Javob","Ball","Sana"]];

    downloadCSV(r,"imtihon_javoblari.csv"); };
  if($("#e4")) $("#e4").onclick=()=>{ const r=[["Talaba","Guruh","Tur","Mavzu","Hisobot","Rasmlar soni"]];
    students().forEach(u=>LESSONS.filter(l=>l.type!=="lecture").forEach(l=>{ const p=userData(u.login).progress[l.id];
      if(p&&(p.tasks||p.images.length)) r.push([`${u.familiya} ${u.ism}`,u.guruh,TYPE_NM[l.type],l.title,p.tasks,p.images.length]); }));
    downloadCSV(r,"hisobotlar.csv"); };
  if($("#bk")) $("#bk").onclick=()=>{ const a=el("a");

  if($("#rs")) $("#rs").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader();

    fr.readAsText(f); };

function showStudent(lg){

    return `<tr><td>${TYPE_NM[l.type]} ${l.no}</td><td>${esc(l.title)}</td>
     <td>${t?`${t.score}/${t.total}`:"—"}</td>
     <td style="text-align:center">${t?cx(t.chiqish||0):"—"}</td>
     <td style="text-align:center">${t?((t.bekor||0)?`<b style="color:var(--bad)">${t.bekor}</b>`:"0"):"—"}</td>
     <td>${p&&p.tasks?"bor":"—"}</td><td>${p?p.images.length:0}</td></tr>`; }).join("");
  const chiqishJami=LESSONS.reduce((a,l)=>{ const t=(d.progress[l.id]||{}).test; return a+(t&&t.chiqish||0); },0);
  const bekorJami=LESSONS.reduce((a,l)=>{ const t=(d.progress[l.id]||{}).test; return a+(t&&t.bekor||0); },0);
  const imgs=[]; LESSONS.forEach(l=>{ const p=d.progress[l.id]; if(p&&p.images) p.images.forEach(s=>imgs.push([l,s])); });
  const works=LESSONS.filter(l=>{ const p=d.progress[l.id]; return p&&p.tasks; })
    .map(l=>`<div style="margin-bottom:10px"><b style="font-size:14px">${esc(l.title)}</b><div class="readout">${esc(d.progress[l.id].tasks)}</div></div>`).join("");
  modal(`<h3 style="margin:0 0 4px">${esc(u.familiya)} ${esc(u.ism)} ${esc(u.sharif||"")}</h3>

   ${(chiqishJami||bekorJami)?`<div class="msg warn">Test paytida <b>${cx(chiqishJami)}</b> marta oyna almashtirilgan;
      shu sababli <b>${bekorJami}</b> ta savol bekor qilingan.</div>`:`<div class="msg ok">Testlar oyna almashtirilmasdan topshirilgan.</div>`}
   <div class="scroll"><table><thead><tr><th>Mashg'ulot</th><th>Mavzu</th><th>Test</th>
     <th title="Test paytida sahifadan chiqish soni">Chiqish</th>
     <th title="Oyna almashtirilgani uchun bekor qilingan savollar">Bekor</th>
     <th>Hisobot</th><th>Rasm</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${works?`<h4>Hisobotlar</h4>${works}`:""}
   ${imgs.length?`<h4>Yuklangan rasmlar</h4><div style="display:flex;gap:8px;flex-wrap:wrap">${imgs.map(([l,s])=>`<img class="thumb" src="${s}" title="${esc(l.title)}">`).join("")}</div>`:""}
   <h4>Shu talaba uchun alohida ruxsat</h4>
   <p class="sub">Dars umumiy ro'yxatda yopiq bo'lsa ham, shu talabaga alohida ochish mumkin — masalan mavzuni qayta o'zlashtirish uchun.</p>
   <div class="row" style="align-items:flex-end">
     <label class="fld" style="margin:0"><span>Mashg'ulot</span>
       <select id="rsel">${LESSONS.map(l=>`<option value="${l.id}">${l.sem}-sem · ${l.week}-hafta · ${TYPE_NM[l.type]} ${l.no} — ${esc(l.title.slice(0,40))}</option>`).join("")}</select></label>
     <button class="btn sm" id="rop" style="flex:0 0 auto">Ochish</button>
     <button class="btn sm ghost" id="rcl" style="flex:0 0 auto">Yopish</button>
     <button class="btn sm ghost" id="rdel" style="flex:0 0 auto">Alohida ruxsatni bekor qilish</button>
     <button class="btn sm" id="rretry" style="flex:0 0 auto">Testni qayta topshirishga ruxsat</button>
   </div>
   ${(()=>{ const o=S.access.u[lg]||{}; const k=Object.keys(o).filter(x=>/^RETRY:/.test(x)&&o[x]===1);
     return k.length?`<p class="sub">Qayta topshirishga ruxsat berilgan: ${k.map(x=>{ const l=byId(x.slice(6)); return l?`${TYPE_NM[l.type]} ${l.no}`:x; }).join(", ")}</p>`:""; })()}
   ${(()=>{ const o=S.access.u[lg]||{}; const k=Object.keys(o).filter(x=>!/^EXAM/.test(x));
     return k.length?`<div class="readout">${k.map(id=>{ const l=byId(id); return (l?`${TYPE_NM[l.type]} ${l.no} — ${esc(l.title)}`:id)+" : "+(o[id]?"ochiq":"yopiq"); }).join("\n")}</div>`
       :`<p class="sub">Alohida ruxsat berilmagan.</p>`; })()}
   <h4>Imtihonga ruxsat</h4>
   <p class="sub">Odatda imtihon semestrning barcha darslari o'zlashtirilgach o'ziga ochiladi. Bu yerdan qo'lda ham ochish mumkin.</p>
   <div class="row">
     ${[1,2].map(s=>{ const o=(S.access.u[lg]||{})["EXAM"+s];
       return `<button class="btn sm ghost" data-ex-open="${s}">${s}-semestr imtihonini ${o?"yopish":"ochish"}</button>`; }).join("")}
   </div>
   <h4>Hisob ma'lumotlari</h4>
   <div id="am"></div>
   <div class="row"><label class="fld"><span>Login</span><input id="ulg" value="${esc(u.login)}"></label>
    <label class="fld"><span>Parol</span><input id="upw" value="${esc(u.pw||"")}"></label></div>
   <button class="btn" id="usave">Login va parolni saqlash</button>`);

  const yangila=()=>{ $("#modal").innerHTML=""; showStudent(lg); };
  $("#rop").onclick=()=>{ ruxsatBer($("#rsel").value, true, lg); toast("Talabaga ochildi"); yangila(); };
  $("#rcl").onclick=()=>{ ruxsatBer($("#rsel").value, false, lg); toast("Talabaga yopildi"); yangila(); };
  $("#rdel").onclick=()=>{ const id=$("#rsel").value;
    if(S.access.u[lg]) delete S.access.u[lg][id];
    save(); cloudPush("ruxsat",{items:[{login:lg,darsId:id,holat:-1}]}); toast("Alohida ruxsat bekor qilindi"); yangila(); };
  $("#rretry").onclick=()=>{ const id=$("#rsel").value; const l=byId(id);
    ruxsatBer("RETRY:"+id, true, lg);
    toast((l?TYPE_NM[l.type]+" "+l.no:id)+" testini qayta topshirishga ruxsat berildi"); yangila(); };
  $$("[data-ex-open]").forEach(b=>b.onclick=()=>{ const s=b.dataset.exOpen;
    const hozir=(S.access.u[lg]||{})["EXAM"+s];
    ruxsatBer("EXAM"+s, !hozir, lg); toast(hozir?"Imtihon yopildi":"Imtihon ochildi"); yangila(); });

  $("#usave").onclick=()=>{
    const nlg=$("#ulg").value.trim().toLowerCase(), npw=$("#upw").value;
    const err=[];
    if(nlg.length<3) err.push("Login kamida 3 ta belgidan iborat bo'lsin.");
    if(/\s/.test(nlg)) err.push("Loginda bo'sh joy bo'lmasin.");
    if(nlg!==u.login && S.users.some(x=>x.login===nlg)) err.push("Bu login band.");
    if(npw.length<5) err.push("Parol kamida 5 ta belgidan iborat bo'lsin.");
    if(err.length){ $("#am").innerHTML=`<div class="msg err">${err.map(esc).join("<br>")}</div>`; return; }

    if(nlg!==u.login){                       /* login o'zgarsa, ma'lumotlar ham ko'chiriladi */
      if(S.data[u.login]){ S.data[nlg]=S.data[u.login]; delete S.data[u.login]; }
      if(S.session===u.login) S.session=nlg;
      u.login=nlg;
    }
    const eskiLogin=nlg!==u.login?u.login:nlg;
    u.pw=npw; u.salt=salty(); u.hash=hashPw(npw,u.salt);
    save();
    if(Cloud.on) Cloud.raw("hisobniOzgartirish",Object.assign({nishon:eskiLogin,yangiLogin:nlg,yangiPw:npw},cred()))
      .catch(e=>toast(e.message||"Serverda yangilanmadi",true));
    $("#modal").innerHTML=""; toast("Hisob ma'lumotlari yangilandi"); render();
  };
}
function showExam(lg,s){
  const u=S.users.find(x=>x.login===lg), d=userData(lg), e=d.exam[s];
  modal(`<h3 style="margin:0 0 4px">${esc(u.familiya)} ${esc(u.ism)} — ${s}-semestr, ${e.variant}-variant</h3>
   <p class="sub">${esc(u.guruh)} · ${dstr(e.date)}</p>
   ${EXAMS[s][e.variant-1].map((q,i)=>`<div style="margin-bottom:12px"><b style="font-size:14px">${i+1}. ${esc(q)}</b>
     <div class="readout">${esc((e.answers||[])[i]||"javob yozilmagan")}</div></div>`).join("")}
   <label class="fld"><span>Ball qo'yish (0–100)</span><input type="number" id="sc" min="0" max="100" value="${e.score!=null?e.score:""}"></label>
   <button class="btn" id="ok">Bahoni saqlash</button>`);
  $("#ok").onclick=()=>{ const v=parseInt($("#sc").value,10);
    e.score=isNaN(v)?null:Math.max(0,Math.min(100,v)); save();
    if(Cloud.on) Cloud.raw("baho",Object.assign({nishon:lg,sem:s,ball:e.score},cred())).catch(()=>{});
    $("#modal").innerHTML=""; toast("Baho saqlandi"); render(); };
}

/* =====================================================================
   MARSHRUTLASH
   ===================================================================== */
function render(){
  clearTimers();
  const h=location.hash||"#/";
  /* test ketayotganda boshqa sahifaga o'tish — ochiq savol bekor qilinadi */
  if(testKetmoqda() && h!=="#/test/"+TEST.id) testdanChiqish();
  const parts=h.replace(/^#\/?/,"").split("/");
  const p1=parts[0]||"", p2=parts[1]||"";
  const app=$("#app"), u=me();
  const need = r => { if(!u){ location.hash="#/login"; return false; } return true; };
  let after=null;
  if(p1==="" ){ app.innerHTML=vHome(); after=afterHome; }
  else if(p1==="login"){ if(u){ location.hash=u.role==="admin"?"#/admin":"#/dash"; return; } app.innerHTML=vLogin(); after=afterLogin; }
  else if(p1==="register"){ if(u){ location.hash="#/dash"; return; } app.innerHTML=vRegister(); after=afterRegister; }
  else if(p1==="about"){ app.innerHTML=vAbout(); }
  else if(p1==="help"){ app.innerHTML=vHelp(); after=afterHelp; }
  else if(p1==="dasturi"){ app.innerHTML=vCurriculum(); }
  else if(p1==="theme"){ app.innerHTML=vTheme(); after=afterTheme; }
  else if(!need()) return;
  else if(p1==="dash"){ if(u.role==="admin"){ location.hash="#/admin"; return; } app.innerHTML=vDash(); after=afterDash; }
  else if(p1==="sem"){ app.innerHTML=vSem(+p2||1); after=afterSem; }
  else if(p1==="lesson"){ app.innerHTML=vLesson(p2); after=()=>afterLesson(p2); }
  else if(p1==="test"){ app.innerHTML=vTest(p2); after=()=>afterTest(p2); }
  else if(p1==="results"){ app.innerHTML=vResults(); after=afterResults; }
  else if(p1==="exam"){ app.innerHTML=vExam(); after=afterExam; }
  else if(p1==="exampaper"){ app.innerHTML=vExamPaper(p2); after=()=>afterExamPaper(p2); }
  else if(p1==="profile"){ app.innerHTML=vProfile(); after=afterProfile; }
  else if(p1==="admin"){ if(u.role!=="admin"){ location.hash="#/dash"; return; } app.innerHTML=vAdmin(); after=afterAdmin; }
  else { app.innerHTML=plain(`<div class="card"><div class="empty">Sahifa topilmadi. <a href="#/">Bosh sahifaga qaytish</a></div></div>`); }
  paintNav();
  if(after) try{ after(); }catch(e){ console.error(e); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
(async function boot(){
  Cloud.init();
  await Store.init();
  await loadState();
  applyTheme();
  render();
  cloudBadge();
  if(Cloud.on){
    qFlush();
    setInterval(qFlush, 60000);

    /* Talaba uchun ruxsatlarni serverdan davriy yangilab turamiz:
       o'qituvchi darsni ochsa yoki yopsa, qayta kirmasdan ham ta'sir qiladi. */
    const yangila=()=>{
      const u=me(); if(!u || u.role==="admin") return;
      if(testKetmoqda()||MASHQ) return;
      const c=cred(); if(!c.pw) return;
      const eski=JSON.stringify(S.access);
      cloudPullMe(u.login, c.pw).then(()=>{
        if(testKetmoqda()||MASHQ) return;          /* test ketmoqda — sahifani buzmaymiz */
        if(JSON.stringify(S.access)!==eski && /^#\/(sem|dash|exam|lesson|test)/.test(location.hash||"")) render();
      }).catch(()=>{});
    };
    setTimeout(yangila, 2000);
    /* Server yukini kamaytirish uchun: 5 daqiqada bir, faqat sahifa ochiq bo'lganda */
    setInterval(()=>{ if(!document.hidden) yangila(); }, 300000);
    window.addEventListener("focus", yangila);
  }
})();
</script>
</body>
