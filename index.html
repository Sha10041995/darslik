  {q:"Uzilish bo'yicha almashinuv nimani talab qiladi?",o:["Faqat dasturiy kechikishlarni talab qilib qo'yadi","Uzilishlar tizimi va prioritetlar mexanizmini talab qiladi","Qo'shimcha DMA kontrollerini talab qilib qoladi","Kutish taktlarini majburan qo'shishni talab qiladi"]},
  {q:"DMA usulining mohiyati nimada?",o:["Ma'lumot protsessorsiz, kontroller boshqaruvida uzatiladi","Protsessor qurilma holatini davriy tekshirib turadi","Ma'lumot kutish taktlari qo'shilgan holda uzatiladi","Qurilma tayyor bo'lganda protsessorga signal beradi"]},

 checks:[{at:6,q:"Yozish siklidagi setup time va hold time nimani bildiradi?",o:["WR atrofida ma'lumot barqaror turishi kerak bo'lgan vaqtlar","Uzilish so'rovi kelgandan xizmat boshlanguncha o'tgan vaqtlar","Adres chiqqandan keyin tanlash signalini kutish vaqtlari","Mashina siklining boshlanishi va tugashi orasidagi vaqtlar"],a:0,e:"Bu talablar buzilsa, xotiraga noto'g'ri qiymat yoziladi."},{at:10,q:"Kutish taktlari (wait states) qachon qo'shiladi?",o:["Protsessor faqat ichki xotira bilan ishlaganda har safar","Sekin qurilma READY orqali kutishni so'raganda","Dastur siklining oxirgi buyrug'i bajarilayotganda doim","Har bir uzilish so'rovi kelganda avtomatik ravishda"],a:1,e:"Ichki xotirali MK larda kutish taktlari kerak emas."},{at:13,q:"Uzilish sikli boshlanganda protsessor stekka nimani joylashtiradi?",o:["Faqat akkumulyatorni va bayroqlarni","Uzilish vektori adresini va stek ko'rsatkichini","PC ni va holat registrini","Barcha SFR registrlarini birma-bir"],a:2,e:"Xizmat tugagach RETFIE saqlangan qiymatlarni tiklaydi."},{at:15,q:"f = 20 MHz da qurilma 2 ta kutish takti talab qilsa, sikl necha ns bo'ladi?",o:["200 ns","800 ns","400 ns","600 ns"],a:2,e:"Sikl 200 ns dan 400 ns gacha cho'ziladi, tezlik ikki baravar kamayadi."}]

{

 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Programmator — kompyuterdagi HEX faylni mikrokontrollerning doimiy xotirasiga yozadigan qurilma. Yozish jarayonida dastur kodi Flash xotiraga, konfiguratsiya so'zi maxsus yacheykaga, zarur bo'lsa boshlang'ich ma'lumotlar esa EEPROM ga joylashtiriladi."],

  ["h","ICSP interfeysi"],
  ["p","ICSP (In-Circuit Serial Programming) — kristallni platadan chiqarmasdan, atigi beshta liniya orqali dasturlash usuli. Bu liniyalar: VPP (MCLR), VDD, VSS, PGD (ma'lumot, RB7) va PGC (takt, RB6)."],
  ["fig","icsp","1-rasm. ICSP orqali programmatorni mikrokontrollerga ulash"],
  ["ol",["Programmator MCLR liniyasiga dasturlash kuchlanishini beradi va kristallni dasturlash rejimiga o'tkazadi","PGC liniyasi bo'yicha takt impulslari uzatiladi","PGD liniyasi bo'yicha buyruq va ma'lumot bitlari ketma-ket uzatiladi","Flash xotiraga blok-blok yozish bajariladi","Yozilgan ma'lumot qayta o'qib solishtiriladi (verify)","Konfiguratsiya so'zi yoziladi va kristall ishchi rejimga qaytariladi"]],
  ["n","Muhim: ICSP ishlatilganda RB6 va RB7 liniyalariga yuklama (LED, kondensator, past qarshilikli element) ulanmasligi kerak, aks holda dasturlash signallari buziladi va yozish xatolik bilan tugaydi."],
  ["h","Programmator bilan yozish tartibi (mikroC PRO for PIC va PICkit)"],
  ["ol",["Programmatorni USB orqali kompyuterga, ICSP razyomini esa platadagi ICSP uyasiga ulang.","mikroC PRO for PIC da loyihani kompilyatsiya qiling: Build (Ctrl+F9), .hex fayl hosil bo'ladi.","Programmator dasturini (PICkit yoki mikroProg Suite) oching, Device maydonida PIC16F877A ni tanlang.","Connect tugmasi bilan programmatorni ulang; qurilma ID si aniqlanishi kerak.","Browse orqali HEX faylni tanlang.","Kerak bo'lsa Erase bilan kristallni tozalang.","Program (Write) tugmasi bilan yozishni boshlang va jarayon oynasini kuzating.","Verify bilan yozilgan kodni tekshiring, so'ng programmatorni uzib qurilmaga ishchi quvvat bering."]],
  ["t",["Xato xabari","Sababi","Yechimi"],[["Target device not found","Ulanish uzilgan yoki quvvat yo'q","ICSP simlarini va VDD ni tekshirish"],["Failed to program","RB6/RB7 da yuklama bor","Yuklamani uzish yoki jumper qo'yish"],["Verify failed","Flash eskirgan yoki ulanish shovqinli","Simlarni qisqartirish, qayta yozish"],["Device ID = 0x0000","MCLR da kuchlanish yetishmaydi","Pull-up rezistorni tekshirish"],["Kod o'qilmayapti","CP (kod himoyasi) yoqilgan","To'liq o'chirish (Erase) qilish"]]],
  ["h","Himoya bitlari"],
  ["p","CP (Code Protect) biti yoqilganda dastur kodini kristalldan qayta o'qib bo'lmaydi — bu intellektual mulkni himoya qiladi. CPD biti EEPROM ma'lumotlarini himoyalaydi, WRT esa dasturning o'z Flash xotirasiga yozishini cheklaydi. O'quv jarayonida bu bitlar odatda o'chirilgan holda qoldiriladi."],
  ["h","Interaktiv qism"],
  ["sim","uart"],
  ["p","Yuqoridagi model ketma-ket uzatishning bit darajasidagi tuzilishini ko'rsatadi; ICSP da ham ma'lumot xuddi shunday, takt bilan sinxronlangan holda bitma-bit uzatiladi."],
  ["h","Topshiriqlar"],
  ["ol",["ICSP razyomining besh liniyasini nomlab, ularning vazifasini jadvalga yozing.","Programmatorni ulab, tayyor HEX faylni kristallga yozing va Verify natijasini qayd eting.","Yozishdan oldin va keyin MCLR liniyasidagi kuchlanishni o'lchang.","Variant raqamingiz N bo'lsin: PORTB ga (0x80 >> (N % 8)) qiymatini chiqaruvchi dasturni yozib, kristallda tekshiring.","CP bitini yoqib, kodni qayta o'qishga urinib ko'ring va natijani izohlang.","Yozish jarayoni oynasi va ishlayotgan qurilma rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Dasturni kristallga kiritish HEX faylni programmator orqali Flash xotiraga yozishdan iborat. Zamonaviy amaliyotda ICSP usuli qo'llanadi: kristall platadan chiqarilmaydi, beshta liniya yetarli bo'ladi. Yozishdan keyin Verify bosqichi majburiy, chunki u xotiraga tushgan kodning manba fayl bilan bir xilligini tasdiqlaydi."],
 ],

{
 id:"S1-M9", sem:1, week:9, type:"lecture", no:9,
 title:"Boshqaruv sxemalari. Mikroprotsessorning ichki ma'lumotlar shinasi",
 goal:"Boshqaruv qurilmasining tuzilishini, boshqaruv signallarini shakllantirishni va mikroprotsessorning ichki ma'lumotlar shinasini o'zlashtirish.",
 outcomes:["PC ning har bir buyruqdan keyingi holatini aniqlay oladi","Shartsiz va shartli o'tishlarni ajrata oladi","Qism dasturga o'tish va qaytish mexanizmini stek orqali tushuntira oladi","Uzilish paytida PC bilan bo'ladigan amallarni bayon qila oladi"],
 plan:["Boshqaruv qurilmasining tuzilishi","Ichki ma'lumotlar shinasi","Boshqaruv signallari","Komandalar hisoblagichi","Qism dastur va stek","Uzilishda boshqaruvning uzatilishi"],
 body:[
  ["h","Boshqaruv qurilmasining tuzilishi"],
  ["p","Boshqaruv qurilmasi (boshqaruv sxemasi) — protsessorning barcha tugunlariga kerakli vaqtda kerakli signalni yuboradigan qismi. U buyruq registridagi kodni tahlil qilib, uni elementar amallar ketma-ketligiga aylantiradi va har bir taktda qaysi registr ochilishi, ALU qaysi amalni bajarishi, natija qayerga yozilishini belgilaydi."],
  ["ul",["Buyruq registri (IR) — bajarilayotgan buyruq kodini saqlaydi","Operatsiyalar deshifratori — kodni tanib, mos boshqaruv chizig'ini faollashtiradi","Takt generatori va fazalar shakllantirgichi — amallarni vaqt bo'yicha taqsimlaydi","Boshqaruv signallari matritsasi — deshifrator chiqishi va takt fazalarini birlashtiradi","Uzilishlar va tashqi so'rovlarni qabul qilish sxemasi"]],
  ["h","Ichki ma'lumotlar shinasi"],
  ["p","Protsessor ichidagi barcha tugunlar — ALU, akkumulyator, umumiy registrlar, buyruq registri va adres shakllantirgich — umumiy ichki ma'lumotlar shinasi orqali bog'langan. Bu shina tashqi shinadan farq qiladi: u faqat kristall ichida ishlaydi, kengroq bo'lishi mumkin va tashqi qurilmalarga chiqmaydi."],
  ["p","Bir vaqtda faqat bitta manba ichki shinaga qiymat qo'yishi mumkin. Boshqaruv qurilmasi kerakli registrning chiqish buferini ochadi va qabul qiluvchi registrga yozish signalini beradi — shu tarzda bitta takt ichida bir registrdan ikkinchisiga ko'chirish bajariladi."],
  ["c","Misol: MOV R1, R2 buyrug'ini bajarish bosqichlari\n  1-takt: IR <- xotiradan buyruq kodi\n  2-takt: deshifrator kodni taniydi\n  3-takt: R2 ning chiqish buferi ochiladi -> ichki shina\n  4-takt: R1 ga yozish signali beriladi -> ko'chirish tugadi"],
  ["h","Komandalar hisoblagichi"],
  ["p","Komandalar hisoblagichi (PC — Program Counter) keyingi bajariladigan buyruqning dastur xotirasidagi adresini saqlaydi. Har bir buyruq olingandan so'ng PC avtomatik ravishda buyruq uzunligiga mos ravishda ortadi. Aynan shu avtomatik ortish dasturning ketma-ket bajarilishini ta'minlaydi."],
  ["fig","cycle","1-rasm. Buyruq bajarilish sikli va PC ning o'zgarishi"],
  ["p","PIC16F877A da PC 13 razryadli bo'lib, 8 K so'z dastur xotirasini adreslaydi. Uning quyi bayti PCL registri sifatida dasturga ochiq, yuqori qismi esa PCLATH registri orqali yuklanadi. PCL ga to'g'ridan-to'g'ri yozish ham o'tishning bir turi hisoblanadi va jadval asosidagi tanlovlarda ishlatiladi."],
  ["h","Dastur oqimini o'zgartirish"],
  ["t",["Amal","Buyruq namunasi","PC bilan nima bo'ladi"],[["Ketma-ket bajarish","MOVLW, ADDWF","PC ← PC + 1"],["Shartsiz o'tish","GOTO adres","PC ← adres"],["Shartli bajarish","BTFSS, DECFSZ","Shart bajarilsa PC ← PC + 2"],["Qism dasturni chaqirish","CALL adres","PC + 1 stekka, PC ← adres"],["Qaytish","RETURN, RETLW","PC ← stekdan olingan adres"],["Uzilish","apparat hodisa","PC stekka, PC ← vektor adresi"]]],
  ["h","Qism dastur va stek"],
  ["p","CALL buyrug'i bajarilganda qaytish adresi (joriy PC + 1) stekka joylashtiriladi va PC ga qism dastur adresi yoziladi. RETURN buyrug'i stekdan adresni olib PC ga qaytaradi va dastur uzilgan joydan davom etadi. PIC16 da stek apparat ko'rinishida bo'lib, chuqurligi 8 daraja bilan cheklangan."],
  ["n","Agar ichma-ich chaqiriqlar chuqurligi sakkiztadan oshsa, eng eski qaytish adresi yo'qoladi va dastur RETURN dan keyin noto'g'ri joyga qaytadi. Bu xato dastur \"tasodifiy\" ishdan chiqishining tipik sababi hisoblanadi."],
  ["c","; Qism dasturli dastur tuzilmasi\n      ORG    0x0000\n      GOTO   MAIN\n\n      ORG    0x0004          ; uzilish vektori\n      GOTO   ISR\n\nMAIN: CALL   INIT            ; PC+1 stekka, INIT ga o'tish\nLOOP: CALL   KECHIKISH\n      BSF    PORTB, 0\n      CALL   KECHIKISH\n      BCF    PORTB, 0\n      GOTO   LOOP            ; cheksiz sikl\n\nINIT: BCF    STATUS, RP0\n      CLRF   PORTB\n      RETURN                 ; stekdan qaytish adresi olinadi"],
  ["h","Uzilish va PC"],
  ["p","Uzilish so'rovi kelganda protsessor joriy buyruqni oxirigacha bajaradi, so'ng PC ni stekka saqlaydi, umumiy uzilish ruxsatini (GIE) tozalaydi va PC ga uzilish vektori adresini yozadi. PIC16 da bu adres 0x0004. Xizmat qism dasturi RETFIE buyrug'i bilan tugaydi: u PC ni stekdan tiklaydi va GIE ni qayta yoqadi."],
  ["p","Muhim farq: CALL da o'tishni dastur o'zi rejalashtiradi, uzilishda esa o'tish istalgan vaqtda apparat hodisasi tufayli yuz beradi. Shuning uchun xizmat qism dasturida o'zgartiriladigan registrlar (W, STATUS) boshida saqlanib, oxirida tiklanishi kerak."],
  ["h","Dastur oqimini hisoblash"],
  ["p","Misol. f = 8 MHz, mashina sikli 500 ns. Sikl tanasida 4 ta bir sikli buyruq, 1 ta CALL (2 sikl), qism dasturda 6 ta bir sikli buyruq va RETURN (2 sikl) bo'lsa: jami 4 + 2 + 6 + 2 = 14 sikl, ya'ni 7 µs. Bir sekundda sikl taxminan 143 000 marta takrorlanadi."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Komandalar hisoblagichi dastur oqimini belgilovchi asosiy registr: uning avtomatik ortishi ketma-ket bajarishni, unga yangi qiymat yozish esa o'tishni anglatadi. Qism dastur chaqirig'ida qaytish adresi stekka saqlanadi, uzilishda ham shu mexanizm ishlatiladi. Stek chuqurligining chegarasi va uzilishda registrlarni saqlash zarurati amaliy dasturlashda alohida e'tibor talab qiladi."],
 ],

{
 id:"S1-A9", sem:1, week:9, type:"practice", no:9,
 title:"Portlar bilan ishlash",
 goal:"Kiritish-chiqarish portlarini sozlash, razryadlar bilan maskalash amallarini bajarish va port orqali ma'lumot almashishni o'zlashtirish.",
 outcomes:[],
 plan:["Port registrlari","Yo'nalishni sozlash","Bit va bayt amallar","Maskalash","Yuguruvchi olov","Tokni hisoblash"],
 equip:["PIC o'quv stendi yoki Proteus","LED 8 dona, rezistor 330 Ω","Tugmalar va 10 kΩ rezistorlar","Multimetr","Darslikning port va LED simulyatorlari"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PIC16F877A da beshta port bor: PORTA (6 liniya), PORTB, PORTC, PORTD (8 tadan) va PORTE (3 liniya). Har bir portga ikkita registr biriktirilgan: TRISx — yo'nalish registri (1 — kirish, 0 — chiqish) va PORTx — ma'lumot registri. Yo'nalishni sozlamasdan chiqishga qiymat yozish natija bermaydi."],
  ["fig","port","1-rasm. Chiqish portiga LED ni ulash va tokni hisoblash"],
  ["f","R = (U_cc − U_led) / I_led","U_cc = 5 V, U_led = 2 V, I = 10 mA → R = 300 Ω, standart qatordan 330 Ω olinadi."],
  ["p","Chiqish liniyasining ruxsat etilgan toki PIC16F877A uchun 25 mA, butun port uchun 100 mA, kristall uchun jami 200 mA ni tashkil qiladi. Sakkizta LED ni bir vaqtda 20 mA bilan yoqish port chegarasidan oshib ketadi, shuning uchun tok 8–10 mA atrofida tanlanadi yoki tashqi drayver qo'yiladi."],
  ["h","Portni sozlash va boshqarish"],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","__CONFIG(_HS_OSC & _WDT_OFF & _LVP_OFF);\n\nvoid main()\n{\n    ADCON1 = 0x06;      // PORTA raqamli rejim\n    TRISB  = 0x00;      // PORTB butunlay chiqish\n    TRISD  = 0xFF;      // PORTD butunlay kirish\n    TRISC  = 0xF0;      // RC0-RC3 chiqish, RC4-RC7 kirish\n    PORTB  = 0x00;\n\n    while (1)\n    {\n        PORTB = PORTD;           // kirishdagi kodni chiqishga uzatish\n        PORTB.F7 = 1;            // faqat 7-razryadni yoqish\n        PORTB |= 0x03;           // 0 va 1-razryadlarni yoqish\n        PORTB &= ~0x0C;          // 2 va 3-razryadlarni o'chirish\n        PORTB ^= 0x10;           // 4-razryad holatini almashtirish\n        Delay_ms(200);\n    }\n}"],
  ["h","Maskalash amallari"],
  ["t",["Vazifa","Amal","Namuna"],[["Razryadni yoqish","OR maska bilan","PORTB |= 0x01"],["Razryadni o'chirish","AND inversiyalangan maska bilan","PORTB &= ~0x01"],["Razryad holatini almashtirish","XOR maska bilan","PORTB ^= 0x01"],["Razryadni tekshirish","AND maska va solishtirish","if (PORTD & 0x01)"],["Quyi tetradani ajratish","AND 0x0F","x = PORTD & 0x0F"],["Yuqori tetradani quyiga ko'chirish","O'ngga siljitish","x = PORTD >> 4"]]],
  ["h","Yuguruvchi olov"],
  ["c","    unsigned short m = 0x01;\n    while (1)\n    {\n        PORTB = m;\n        Delay_ms(120);\n        m <<= 1;              // keyingi razryadga siljitish\n        if (m == 0)           // chetdan chiqib ketdi\n            m = 0x01;         // boshidan boshlash\n    }"],
  ["p","Bu dastur PORTB ning razryadlarini navbat bilan yoqadi. Siljitish 8 marta bajarilgach qiymat nolga aylanadi va tekshiruv uni qayta boshlang'ich holatga qaytaradi."],
  ["h","Interaktiv qism"],
  ["sim","port"],
  ["h","Topshiriqlar"],
  ["ol",["Variant raqamingiz N bo'lsin: PORTB ga (0x0F + N) qiymatini chiqaring va LED holatlarini jadvalga yozing.","TRISC = 0xF0 sozlamasida qaysi liniyalar kirish, qaysilari chiqish ekanini aniqlang.","PORTD ning quyi tetradasini o'qib, uni PORTB ning yuqori tetradasiga ko'chiruvchi kod yozing.","Yuguruvchi olov dasturini yozing va ikki tomonlama (oldinga-orqaga) harakat qiladigan qilib o'zgartiring.","Sakkizta LED bir vaqtda yonganda umumiy tokni hisoblang va port chegarasi bilan solishtiring.","Ishlayotgan sxema yoki simulyator ekranining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Port bilan ishlash TRIS registrida yo'nalishni belgilashdan boshlanadi, keyin PORT registri orqali qiymat yoziladi yoki o'qiladi. Alohida razryadlarni boshqarish uchun OR, AND va XOR maskalari ishlatiladi — bu usul qolgan razryadlarga tegmaydi. Chiqish toklarining chegaralarini hisobga olish sxemaning ishonchliligini ta'minlaydi."],
 ],
 tests:[

  {q:"Yo'nalishni sozlamasdan chiqishga qiymat yozsak nima bo'ladi?",o:["Natija bermaydi, liniya kirish holatida qoladi","Kompilyator xato berib, dastur yig'ilmay qoladi","Kristall reset holatiga o'tib, dastur qaytadan boshlanadi","Qiymat yoziladi va liniya avtomatik chiqishga o'tadi"]},

  {q:"PIC16F877A kristalli uchun jami ruxsat etilgan tok qancha?",o:["200 mA ni tashkil etadi","1000 mA ni tashkil etadi","25 mA ni tashkil etadi","100 mA ni tashkil etadi"]},
  {q:"Sakkizta LED ni bir vaqtda 20 mA bilan yoqish mumkinmi?",o:["Mumkin emas, 160 mA port chegarasidan oshib ketadi","Mumkin, chunki jami tok 100 mA dan kichik bo'ladi","Mumkin, agar rezistor qiymati 100 Ω qilib olinsa","Mumkin, chunki har bir liniya mustaqil hisoblanadi"]},
  {q:"Sakkizta LED ni bir vaqtda yoqish uchun tok qanday tanlanadi?",o:["25 mA qilib tanlanadi, bu liniya chegarasiga teng","50 mA qilib tanlanadi, yorqinlik yuqori bo'lishi uchun","8–10 mA atrofida tanlanadi yoki tashqi drayver qo'yiladi","Tok umuman cheklanmaydi, LED o'zi chidaydi"]},
  {q:"TRISC = 0xF0 sozlamasi qanday natija beradi?",o:["Butun PORTC kirish sifatida sozlanadi","Butun PORTC chiqish sifatida sozlanadi","RC0–RC3 chiqish, RC4–RC7 kirish bo'ladi","RC0–RC3 kirish, RC4–RC7 chiqish bo'ladi"]},

  {q:"Razryadni yoqish uchun qanday maskalash amali ishlatiladi?",o:["OR amali maska bilan: PORTB |= 0x01","Siljitish amali: PORTB <<= 1","AND amali inversiyalangan maska bilan: PORTB &= ~0x01","XOR amali maska bilan: PORTB ^= 0x01"]},
  {q:"Razryadni o'chirish uchun qaysi amal ishlatiladi?",o:["AND amali inversiyalangan maska bilan: PORTB &= ~0x01","OR amali maska bilan: PORTB |= 0x01","O'ngga siljitish amali: PORTB >>= 1","XOR amali maska bilan: PORTB ^= 0x01"]},
  {q:"Razryad holatini almashtirish (toggle) uchun qaysi amal ishlatiladi?",o:["Chapga siljitish amali: PORTB <<= 1","OR amali maska bilan: PORTB |= 0x01","XOR amali maska bilan: PORTB ^= 0x01","AND amali maska bilan: PORTB &= 0x01"]},
  {q:"PORTB |= 0x03 ifodasi qaysi razryadlarni yoqadi?",o:["0 va 1-razryadlarni yoqadi","2 va 3-razryadlarni yoqadi","Faqat 3-razryadni yoqib qo'yadi","6 va 7-razryadlarni yoqadi"]},

{
 id:"S1-A10", sem:1, week:10, type:"practice", no:10,
 title:"PIC mikrokontrolleri uchun knopka bilan LEDlarni boshqaruvchi dastur tuzish",
 goal:"Kirish liniyasidan tugma holatini o'qish, kontaktlar titrashini filtrlash va LED ni boshqaruvchi dastur tuzishni o'zlashtirish.",
 outcomes:[],
 plan:["Kirish liniyasini sozlash","Pull-up rezistor","Drebezg hodisasi","Dasturiy filtr","Holat almashtirish rejimi","Tekshirish"],
 equip:["PIC o'quv stendi yoki Proteus","Tugma (tactile switch)","Rezistor 10 kΩ va 330 Ω","LED 2 dona","Ossillograf yoki mantiqiy probnik","Darslikning tugma simulyatori"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Kirish rejimiga o'tkazilgan liniya yuqori qarshilikli holatda bo'ladi. Unga hech nima ulanmasa, liniya shovqin ta'sirida tasodifiy qiymat ko'rsatadi. Buning oldini olish uchun tortuvchi rezistor qo'yiladi. PIC16F877A da PORTB liniyalarida ichki pull-up rezistorlar mavjud va ular OPTION_REG registrining RBPU biti bilan yoqiladi."],
  ["fig","btn","1-rasm. Tugmani pull-up rezistor bilan kirish portiga ulash"],
  ["p","Sxemada tugma bosilmagan holatda liniya 10 kΩ rezistor orqali quvvat manbasiga tortilgan va mantiqiy 1 o'qiladi; bosilganda liniya umumiy simga ulanib, mantiqiy 0 beradi. Demak dasturda \"bosilgan\" holat nolga mos keladi."],
  ["n","Xavfsizlik: tugmani rezistorsiz to'g'ridan-to'g'ri quvvat manbasi va umumiy sim orasiga ulash qisqa tutashuv hosil qiladi. Sxemani yig'ishdan oldin tortuvchi rezistor mavjudligini tekshiring."],
  ["h","Kontaktlar titrashi"],
  ["p","Mexanik kontakt ulanish va uzilish paytida bir necha marta sakraydi va 1–10 ms davomida o'nlab noto'g'ri o'tishlar hosil qiladi. Filtrlanmasa, bitta bosish bir necha marta qayd etiladi. Dasturiy filtr eng sodda va arzon yechim: birinchi o'zgarish aniqlangach 15–20 ms kutiladi va holat qayta tekshiriladi."],
  ["h","Ikki ish rejimi"],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","/* 1-rejim: tugma bosilgan vaqtda LED yonadi */\n__CONFIG(_HS_OSC & _WDT_OFF & _PWRTE_ON & _BODEN_ON & _LVP_OFF & _CP_OFF & _WRT_OFF & _CPD_OFF);\n\nvoid main()\n{\n    ADCON1 = 0x06;\n    TRISB.F0 = 0;          // LED chiqish\n    TRISD.F0 = 1;          // tugma kirish\n\n    while (1)\n    {\n        if (PORTD.F0 == 0) PORTB.F0 = 1;\n        else               PORTB.F0 = 0;\n    }\n}"],
  ["c","/* 2-rejim: har bosishda LED holati almashadi (toggle) */\nwhile (1)\n{\n    if (PORTD.F0 == 0)                 // bosildi?\n    {\n        Delay_ms(20);                  // drebezg filtri\n        if (PORTD.F0 == 0)             // hamon bosilganmi?\n        {\n            PORTB.F0 = !PORTB.F0;      // holatni almashtirish\n            while (PORTD.F0 == 0);     // qo'yib yuborishni kutish\n            Delay_ms(20);\n        }\n    }\n}"],
  ["p","Ikkinchi rejimda uchta muhim element bor: filtr kechikishi, holatni inversiyalash va tugma qo'yib yuborilishini kutish. Oxirgi qadam bo'lmasa, tugma ushlab turilganda LED uzluksiz miltillaydi."],
  ["h","Assembler varianti"],
  ["c","; 3-rejim: assembler variant (inline asm)\nasm {\nLOOP:\n    BTFSC  PORTD, 0     ; RD0 = 0 bo'lsa keyingisini tashlab ket\n    GOTO   OCHIQ        ; RD0 = 1 -> tugma bosilmagan\n    BSF    PORTB, 0     ; bosilgan -> LED yonadi\n    GOTO   LOOP\nOCHIQ:\n    BCF    PORTB, 0\n    GOTO   LOOP\n}"],
  ["h","Interaktiv qism"],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",["Sxemani yig'ing va tugma bosilgan hamda bosilmagan holatlarda liniyadagi kuchlanishni o'lchang.","1-rejim dasturini yozing va ishlashini tekshiring.","Filtrsiz toggle dasturini yozib, bosishlar sonini hisoblang va noto'g'ri hisoblash hodisasini qayd eting.","Filtr qo'shib natijani qayta tekshiring va ikkala holatni jadvalda taqqoslang.","Variant raqamingiz N bo'lsin: tugma bosilganda PORTB ga (0x0F + N) chiqaruvchi dastur yozing.","Ichki pull-up ni OPTION_REG orqali yoqib, tashqi rezistorsiz ishlashini tekshiring.","Sxema yoki simulyator ekranining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Tugmani o'qish kirish liniyasini sozlash va tortuvchi rezistorni ta'minlashdan boshlanadi. Pull-up sxemasida bosilgan holat mantiqiy nolga mos keladi. Kontaktlar titrashi dasturiy kechikish bilan bartaraf etiladi, holatni almashtirish rejimida esa tugma qo'yib yuborilishini kutish majburiy qadam hisoblanadi."],
 ],

{
 id:"S1-M11", sem:1, week:11, type:"lecture", no:11,
 title:"Magistral qurilmalar funksiyalari",
 goal:"Tizimli magistral tugunlarining vazifalarini, uch holatli buferlar va shina boshqaruvi tamoyillarini o'zlashtirish.",
 outcomes:["Magistralga ulangan qurilmalarning funksiyalarini tushuntira oladi","Uch holatli buferning ishlash prinsipini izohlay oladi","Shina egasi (master) va qul (slave) tushunchalarini ajrata oladi","Adres deshifratori vazifasini va hisobini tushuntira oladi"],
 plan:["Magistral tushunchasi","Magistral qurilmalari","Uch holatli buferlar","Adres deshifratori","Shina boshqaruvi va arbitraj","Shina yuklamasi"],
 body:[
  ["h","Magistral tushunchasi"],
  ["p","Tizimli magistral — tizim tugunlarini birlashtiruvchi umumiy o'tkazgichlar to'plami hamda ular bo'yicha almashinuv qoidalari majmuasi. Magistral nafaqat simlar, balki signal darajalari, vaqt diagrammalari va almashinuv protokolini ham o'z ichiga oladi."],
  ["h","Magistralga ulangan qurilmalar"],
  ["t",["Qurilma","Funksiyasi","Magistraldagi roli"],[["Protsessor","Adres shakllantiradi, almashinuvni boshlaydi","Master (shina egasi)"],["Xotira (ROM, RAM)","Ma'lumot saqlaydi va uzatadi","Slave (qul)"],["Kiritish-chiqarish portlari","Tashqi qurilmalar bilan bog'laydi","Slave"],["Adres deshifratori","Adres bo'yicha kerakli qurilmani tanlaydi","Xizmat tuguni"],["Bufer va magistral formirovkalari","Signal quvvatini oshiradi, yo'nalishni boshqaradi","Xizmat tuguni"],["DMA kontroller","Protsessorsiz almashinuvni boshqaradi","Vaqtincha master bo'la oladi"]]],
  ["h","Uch holatli buferlar"],
  ["p","Bitta ma'lumot liniyasiga bir nechta qurilma ulangan. Agar ular bir vaqtda chiqish beruvchi bo'lsa, konflikt yuz beradi va mikrosxemalar ishdan chiqishi mumkin. Shuning uchun magistralga ulanadigan barcha chiqishlar uch holatli bo'ladi: mantiqiy 0, mantiqiy 1 va yuqori qarshilikli (Z) holat. Faqat tanlangan qurilma faol holatga o'tadi, qolganlari Z holatda shinadan uzilgan bo'ladi."],
  ["fig","tri","1-rasm. Uch holatli buferlar orqali qurilmalarni umumiy shinaga ulash"],
  ["n","Agar adres deshifratori xato ishlab, ikkita qurilma bir vaqtda tanlansa, shina konflikti yuz beradi: bittasi 0, ikkinchisi 1 bersa, chiqishlar orqali katta tok oqadi va mikrosxema qiziydi. Loyihalashda bunday holat istisno qilinishi shart."],
  ["h","Adres deshifratori"],
  ["p","Deshifrator adres shinasining yuqori razryadlarini tahlil qilib, qaysi qurilma tanlanishini aniqlaydi va unga CS (Chip Select) signalini beradi. Quyi razryadlar esa tanlangan qurilma ichidagi yacheykani ko'rsatadi."],
  ["f","A_yuqori → CS,  A_quyi → yacheyka","Adres fazosini taqsimlash tamoyili."],
  ["p","Misol. 16 razryadli adres shinasi va har biri 8 K bo'lgan xotira mikrosxemalari ishlatilsin. 8 K = 2^13, demak quyi 13 razryad yacheykani, yuqori 3 razryad esa 8 ta qurilmadan bittasini tanlaydi. Bu 3→8 deshifrator (masalan, 74HC138) bilan amalga oshiriladi."],
  ["h","Shina boshqaruvi va arbitraj"],
  ["p","Magistralda bir vaqtning o'zida faqat bitta master bo'lishi mumkin. Odatiy holatda master — protsessor. DMA kontroller ma'lumot uzatish uchun so'rov (HOLD) yuboradi, protsessor tasdiqlash (HLDA) berib shinani vaqtincha bo'shatadi va o'z chiqishlarini Z holatga o'tkazadi. Bir necha master bo'lgan tizimlarda arbitraj sxemasi navbatni prioritet bo'yicha taqsimlaydi."],
  ["h","Shina yuklamasi"],
  ["p","Har bir ulangan kirish shinaga sig'im va tok yuklamasini beradi. Yuklama ortgan sari signal fronti cho'ziladi va maksimal chastota pasayadi. Shu sababli ko'p qurilma ulanganda magistral buferlari (masalan 74HC245) qo'llanadi: ular signalni qayta tiklaydi va yo'nalishni DIR signali bilan boshqaradi."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Magistral qurilmalari master va slave sifatida ajratiladi: almashinuvni protsessor boshlaydi, xotira va portlar esa unga javob beradi. Umumiy shinaga bir nechta qurilmani ulash uch holatli buferlar hisobiga mumkin bo'ladi, kerakli qurilmani esa adres deshifratori tanlaydi. Shina yuklamasi va konflikt xavfi loyihalashda albatta hisobga olinadi."],
 ],

{
 id:"S1-A11", sem:1, week:11, type:"practice", no:11,
 title:"PIC mikrokontrolleri uchun bir nechta knopka bilan LEDlarni boshqaruvchi dastur tuzish",
 goal:"Bir nechta kirish signalini birgalikda tahlil qilish, prioritet va kombinatsiyalarni qayta ishlash dasturini tuzishni o'zlashtirish.",
 outcomes:[],
 plan:["Bir nechta kirishni o'qish","Portni bir butun sifatida tahlil qilish","Prioritetli ishlov","Kombinatsiyalarni aniqlash","Matritsa usuli","Tekshirish"],
 equip:["PIC o'quv stendi yoki Proteus","Tugmalar 4 dona","Rezistorlar 10 kΩ (4 dona), 330 Ω (8 dona)","LED 8 dona","Ulash simlari","Darslikning port va tugma simulyatorlari"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Bir nechta tugma bilan ishlashda ikki yondashuv mavjud. Birinchisi — har bir tugmani alohida tekshirish; bu sodda, lekin tugmalar soni ortganda kod uzayadi. Ikkinchisi — portni bir butun bayt sifatida o'qib, maskalash orqali kombinatsiyani aniqlash; bu usul ixcham va tez."],
  ["p","Pull-up sxemasida bosilmagan tugmalar 1 beradi, shuning uchun o'qilgan qiymat inversiyalanadi — shunda bosilgan tugmalar mantiqiy bir bilan belgilanadi va kod o'qilishi osonlashadi."],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","unsigned short k;\n\nk = ~PORTD & 0x0F;       // faqat RD0..RD3, bosilganlar = 1\n\nswitch (k)\n{\n    case 0x01: PORTB = 0x0F; break;   // 1-tugma\n    case 0x02: PORTB = 0xF0; break;   // 2-tugma\n    case 0x03: PORTB = 0xFF; break;   // 1 va 2 birgalikda\n    case 0x04: PORTB = 0xAA; break;   // 3-tugma\n    case 0x08: PORTB = 0x55; break;   // 4-tugma\n    default:   PORTB = 0x00; break;   // hech biri\n}"],
  ["h","Prioritetli ishlov"],
  ["p","Agar bir vaqtda bir nechta tugma bosilishi mumkin bo'lsa va faqat bittasi hisobga olinishi kerak bo'lsa, prioritet tartibi belgilanadi. Quyidagi kodda pastki raqamli tugma yuqori prioritetga ega: birinchi mos kelgan shart bajarilgach qolganlari tekshirilmaydi."],
  ["c","if      (!PORTD.F0) PORTB = 0x01;   // eng yuqori prioritet\nelse if (!PORTD.F1) PORTB = 0x02;\nelse if (!PORTD.F2) PORTB = 0x04;\nelse if (!PORTD.F3) PORTB = 0x08;\nelse                PORTB = 0x00;"],
  ["h","Uch tugmali boshqaruv namunasi"],
  ["t",["Tugma","Vazifasi","Amal"],[["RD0 — START","Yuguruvchi olovni ishga tushirish","bayroq = 1"],["RD1 — STOP","To'xtatish va joriy holatni saqlash","bayroq = 0"],["RD2 — RESET","Boshlang'ich holatga qaytish","maska = 0x01, PORTB = 0"],["RD0 + RD1","Yo'nalishni almashtirish","yonalish = ~yonalish"]]],
  ["c","unsigned short m = 0x01, ishla = 0, yonalish = 0, k;\n\nwhile (1)\n{\n    k = ~PORTD & 0x07;\n    if (k) { Delay_ms(20); k = ~PORTD & 0x07; }   // drebezg filtri\n\n    if      (k == 0x03) { yonalish = !yonalish; while (~PORTD & 0x07); }\n    else if (k == 0x01)   ishla = 1;\n    else if (k == 0x02)   ishla = 0;\n    else if (k == 0x04) { m = 0x01; PORTB = 0; }\n\n    if (ishla)\n    {\n        PORTB = m;\n        if (yonalish) { m <<= 1; if (!m) m = 0x01; }\n        else          { m >>= 1; if (!m) m = 0x80; }\n        Delay_ms(150);\n    }\n}"],
  ["h","Klaviatura matritsasi haqida"],
  ["p","Tugmalar soni ko'p bo'lganda har biriga alohida liniya ajratish isrof bo'ladi. Matritsa usulida 16 ta tugma atigi 8 ta liniyaga (4 satr + 4 ustun) ulanadi: satrlarga navbat bilan nol beriladi va ustunlar o'qiladi, nol qaytgan ustun bosilgan tugmani ko'rsatadi. Bu usul keyingi semestrdagi klaviatura ishida batafsil o'rganiladi."],
  ["n","Bir vaqtda ikkita tugma bosilganda matritsada \"soyabon\" (ghosting) effekti paydo bo'ladi: bosilmagan tugma ham bosilgandek ko'rinadi. Buning oldini olish uchun har bir tugmaga ketma-ket diod qo'yiladi."],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",["To'rtta tugma va sakkizta LED dan iborat sxemani yig'ing.","Har bir tugmaga alohida LED kombinatsiyasini biriktiruvchi dastur yozing va jadval tuzing.","Variant raqamingiz N bo'lsin: RD0 bosilganda PORTB = (0x11 · N) mod 256 qiymatini chiqaring.","Prioritetli ishlov dasturini yozing va bir vaqtda ikki tugma bosilgandagi natijani izohlang.","START/STOP/RESET boshqaruvli yuguruvchi olov dasturini amalga oshiring.","Ikki tugma birgalikda bosilganda alohida amal bajariladigan qismni qo'shing.","Ishlayotgan sxema yoki simulyator rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Bir nechta kirishni portni bir butun sifatida o'qib, maskalash orqali tahlil qilish eng ixcham yechim hisoblanadi. Pull-up sxemasida o'qilgan qiymatni inversiyalash kodni ancha tushunarli qiladi. Bir vaqtda bosilgan tugmalar alohida kombinatsiya sifatida qayta ishlanishi yoki prioritet tartibida hal qilinishi mumkin — tanlov masalaning talabiga bog'liq."],
 ],
 tests:[
  {q:"Bir nechta tugma bilan ishlashda qanday ikki yondashuv mavjud?",o:["Faqat assemblerda yoki faqat C tilida yozib o'qish","Har birini alohida tekshirish yoki portni bir butun bayt sifatida o'qish","Faqat uzilish orqali yoki faqat DMA orqali o'qish","Faqat analog rejimda yoki faqat raqamli rejimda o'qish"]},
  {q:"Har bir tugmani alohida tekshirish usulining kamchiligi nima?",o:["Tugmalar soni ortganda kod uzayib ketadi","Drebezg filtrini qo'llash imkoni yo'qoladi","Kombinatsiyalarni umuman aniqlab bo'lmaydi","Faqat bitta tugma bilan ishlash mumkin bo'ladi"]},
  {q:"Portni bir butun bayt sifatida o'qish usulining afzalligi nimada?",o:["Drebezg filtrini butunlay keraksiz qilib qo'yadi","Tugmalar sonini cheksiz oshirish imkonini beradi","Port yo'nalishini sozlashni talab qilmay qo'yadi","Ixcham va tez, maskalash orqali kombinatsiya aniqlanadi"]},

  {q:"k = ~PORTD & 0x0F ifodasi nimani bajaradi?",o:["Faqat RD0 ni ajratib, qolganlarini nollab qo'yadi","RD0..RD3 ni ajratib oladi, bosilganlarni 1 bilan belgilaydi","Butun portni inversiyalab, hech narsani ajratmaydi","RD4..RD7 ni ajratib oladi va inversiyalab beradi"]},
  {q:"switch (k) konstruksiyasida case 0x03 qanday holatga mos keladi?",o:["Faqat 3-tugma bosilgan holatga mos keladi","Faqat 2-tugma bosilgan holatga mos keladi","Hech bir tugma bosilmagan holatga mos keladi","1 va 2-tugma birgalikda bosilgan holatga mos keladi"]},
  {q:"Namunadagi dasturda case 0x04 qaysi tugmaga mos keladi?",o:["4-tugmaga mos keladi va PORTB = 0x55 bo'ladi","3-tugmaga mos keladi va PORTB = 0xAA bo'ladi","1-tugmaga mos keladi va PORTB = 0x0F bo'ladi","2-tugmaga mos keladi va PORTB = 0xF0 bo'ladi"]},
  {q:"switch dagi default tarmoqchasi qachon bajariladi?",o:["Faqat drebezg aniqlanganda bajariladi","Hech bir tugma bosilmaganda bajariladi","Faqat birinchi tugma bosilganda bajariladi","Barcha tugmalar birga bosilganda bajariladi"]},
  {q:"Prioritetli ishlov qanday holatda kerak bo'ladi?",o:["Faqat matritsa klaviaturasi ishlatilgan hollarda","Tugmalar umuman bosilmaydigan holatlar uchun","Faqat bitta tugma mavjud bo'lgan sodda sxemalarda","Bir vaqtda bir nechta tugma bosilib, faqat bittasi hisobga olinishi kerak bo'lsa"]},
  {q:"else if zanjiri bilan yozilgan prioritetli kodda qaysi tugma yuqori prioritetga ega?",o:["Oxirgi tekshirilgan, ya'ni yuqori raqamli tugma","Birinchi tekshirilgan, ya'ni pastki raqamli tugma","Barcha tugmalar teng prioritetga ega bo'ladi","Eng uzoq ushlab turilgan tugma prioritet oladi"]},
  {q:"if (!PORTDbits.RD0) sharti nimani tekshiradi?",o:["RD0 birga teng, ya'ni tugma bosilmaganini tekshiradi","RD0 ning holati o'zgarganini tekshiradi","RD0 chiqish sifatida sozlanganini tekshiradi","RD0 nolga teng, ya'ni tugma bosilganini tekshiradi"]},
  {q:"Uch tugmali boshqaruvda RD0 (START) tugmasi nima qiladi?",o:["Boshlang'ich holatga qaytarib, portni nollaydi","Harakatni to'xtatib, joriy holatni saqlab qoladi","Yuguruvchi olovni ishga tushiradi, bayroq = 1 qilinadi","Harakat yo'nalishini teskarisiga almashtiradi"]},
  {q:"RD1 (STOP) tugmasining vazifasi nima?",o:["Ishga tushiradi va bayroqni 1 ga o'rnatib qo'yadi","To'xtatadi va joriy holatni saqlab qoladi, bayroq = 0","Maskani 0x01 ga qaytarib, PORTB ni nollaydi","Yo'nalishni teskarisiga almashtirib qo'yadi"]},
  {q:"RD2 (RESET) tugmasi bosilganda nima bajariladi?",o:["Yo'nalish o'zgaruvchisi teskarisiga almashtiriladi","Bayroq 0 ga tushirilib, harakat to'xtatiladi","Bayroq 1 ga o'rnatilib, harakat boshlanadi","Maska 0x01 ga qaytariladi va PORTB nollanadi"]},
  {q:"RD0 va RD1 birgalikda bosilganda qanday amal bajariladi?",o:["Dastur to'xtatilib, kutish rejimiga o'tiladi","Harakat ishga tushirilib, bayroq 1 bo'ladi","Yo'nalish teskarisiga almashtiriladi","Boshlang'ich holatga qaytilib, port nollanadi"]},
  {q:"Namunadagi dasturda k = ~PORTD & 0x07 ifodasi nechta tugmani o'qiydi?",o:["Bitta tugmani — faqat RD0 ni o'qib oladi","Sakkizta tugmani — butun portni o'qib oladi","To'rtta tugmani — RD0 dan RD3 gacha o'qiydi","Uchta tugmani — RD0, RD1 va RD2 ni o'qiydi"]},
  {q:"if (k) { __delay_ms(20); k = ~PORTD & 0x07; } qismi nima uchun kerak?",o:["Portni chiqish sifatida sozlab qo'yish uchun","Yo'nalishni almashtirish uchun kerak bo'ladi","Harakat tezligini sozlab, kechikish berish uchun","Drebezg filtri sifatida — holat qayta tekshiriladi"]},
  {q:"while(~PORTD & 0x07); qatori yo'nalish almashtirilgandan keyin nima uchun qo'yilgan?",o:["Portni qaytadan sozlab olish uchun qo'yilgan","Tugmalar qo'yib yuborilishini kutish uchun qo'yilgan","Maskani boshlang'ich holatga qaytarish uchun","Harakat tezligini pasaytirib qo'yish uchun qo'yilgan"]},
  {q:"yonalish = 1 bo'lganda maska qanday o'zgaradi?",o:["m butunlay nollanadi va harakat to'xtaydi","m <<= 1 — chapga siljiydi, nol bo'lsa 0x01 ga qaytadi","m >>= 1 — o'ngga siljiydi, nol bo'lsa 0x80 ga qaytadi","m qiymati o'zgarmaydi, faqat port yangilanadi"]},
  {q:"yonalish = 0 bo'lganda maska nol bo'lib qolsa qanday qiymat beriladi?",o:["0x80 qiymati beriladi, ya'ni eng yuqori razryaddan boshlanadi","0x01 qiymati beriladi, ya'ni eng quyi razryaddan boshlanadi","0xFF qiymati beriladi, barcha LED yonadi","0x00 qiymati saqlanadi va harakat to'xtaydi"]},

{
 id:"S1-M12", sem:1, week:12, type:"lecture", no:12,
 title:"Operandlarni adreslash. Adreslash usullari",
 goal:"Buyruqlar tizimining tuzilishini, buyruq formatini va operandlarni adreslash usullarini o'zlashtirish.",
 outcomes:["Buyruq formatining tarkibiy qismlarini ajrata oladi","Operand turlarini va ularning joylashishini tushuntira oladi","Asosiy adreslash usullarini misollar bilan farqlay oladi","Buyruq kodidan operandni aniqlay oladi"],
 plan:["Buyruqlar tizimi tushunchasi","Buyruq formati","Operand turlari","Adreslash usullari","PIC16 da adreslash","Adreslashning unumdorlikka ta'siri"],
 body:[
  ["h","Buyruqlar tizimi"],
  ["p","Buyruqlar tizimi (komandalar tizimi) — mikroprotsessor bajara oladigan barcha buyruqlarning to'liq to'plami hamda ularning kodlanish qoidalari. Buyruqlar tizimi protsessor arxitekturasining eng muhim tavsifi bo'lib, aynan u dasturchi uchun mashinaning imkoniyatlarini belgilaydi."],
  ["p","Har bir buyruq ikki qismdan iborat: operatsiya kodi (COP — nima qilish kerak) va operandlar (nima ustida qilish kerak). Operandlar buyruq ichida bevosita berilishi, registrda yoki xotirada joylashishi mumkin."],
  ["h","Buyruq formati"],
  ["fig","fmt","1-rasm. PIC16 buyruq formatlari va ularning maydonlari"],
  ["t",["Format","Razryadlar taqsimoti","Namuna"],[["Bayt bilan ishlash","6 bit COP + 1 bit d + 7 bit f","ADDWF f,d"],["Bit bilan ishlash","4 bit COP + 3 bit b + 7 bit f","BSF f,b"],["Konstanta bilan ishlash","6 bit COP + 8 bit k","MOVLW k"],["O'tish buyruqlari","3 bit COP + 11 bit adres","GOTO adres"]]],
  ["p","PIC16 da buyruq so'zi 14 razryadli. Bayt formatidagi f maydoni 7 razryadli bo'lgani uchun bevosita 128 ta yacheykani adreslaydi; qolgan xotira banklar orqali, STATUS registrining RP0 va RP1 bitlari bilan tanlanadi."],
  ["h","Operand turlari"],
  ["ul",["Bevosita operand (immediate, konstanta) — qiymat buyruq kodining ichida: MOVLW 0x25","Registr operandi — qiymat W registrda yoki fayl registrida: ADDWF 0x20,1","Xotira operandi — qiymat ma'lumot xotirasining yacheykasida","Bilvosita operand — qiymat adresi boshqa registrda saqlanadi: INDF va FSR juftligi","Bit operandi — yacheykaning alohida razryadi: BSF PORTB,3"]],
  ["h","Adreslash usullari"],
  ["t",["Usul","Mohiyati","PIC16 dagi namuna"],[["Bevosita (immediate)","Operand buyruq kodida","MOVLW 0x0F"],["To'g'ri (direct)","Buyruqda yacheyka adresi ko'rsatilgan","MOVWF 0x20"],["Bilvosita (indirect)","Adres FSR registrida, murojaat INDF orqali","MOVWF INDF"],["Registr","Operand W registrda","ADDWF f,0"],["Nisbiy","Adres joriy PC ga nisbatan beriladi","boshqa oilalarda keng qo'llanadi"],["Bit adreslash","Yacheyka va razryad raqami","BCF STATUS,RP0"]]],
  ["c","; Bilvosita adreslash: 0x20 dan 0x2F gacha yacheykalarni nollash\n      MOVLW  0x20\n      MOVWF  FSR        ; FSR <- boshlang'ich adres\nCLEAR:\n      CLRF   INDF       ; FSR ko'rsatgan yacheyka nollanadi\n      INCF   FSR, 1     ; keyingi adresga o'tish\n      MOVLW  0x30\n      SUBWF  FSR, 0     ; FSR 0x30 ga yetdimi?\n      BTFSS  STATUS, Z\n      GOTO   CLEAR\n      RETURN"],
  ["p","Bilvosita adreslash massivlar va buferlar bilan ishlashda majburiy: adresni dastur davomida o'zgartirish faqat shu usulda mumkin. To'g'ri adreslashda esa adres buyruq kodiga qotirib qo'yilgan bo'ladi va ish vaqtida o'zgarmaydi."],
  ["h","Adreslashning unumdorlikka ta'siri"],
  ["p","Bevosita va registr adreslash eng tez, chunki qo'shimcha xotira murojaati talab qilmaydi. Bilvosita adreslash qo'shimcha qadamlar (FSR ni yuklash va oshirish) hisobiga sekinroq, ammo moslashuvchan. Shuning uchun tez ishlashi kerak bo'lgan sikl tanasida imkon qadar registr operandlaridan foydalaniladi."],
  ["n","Bank tanlashni unutish — PIC dagi eng ko'p uchraydigan xato. TRISB registri 1-bankda, PORTB esa 0-bankda joylashgan; bank noto'g'ri bo'lsa dastur mutlaqo boshqa registrni o'zgartiradi."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Buyruq operatsiya kodi va operandlardan tashkil topadi; buyruq formati esa bu maydonlarning razryadlar bo'yicha taqsimotini belgilaydi. Operand bevosita buyruqda, registrda yoki xotirada joylashishi mumkin va unga murojaat usuli adreslash usuli deb ataladi. PIC16 da bevosita, to'g'ri, bilvosita va bit adreslash qo'llanadi; bilvosita usul massivlar bilan ishlashning yagona vositasi hisoblanadi."],
 ],

{
 id:"S1-A12", sem:1, week:12, type:"practice", no:12,
 title:"PIC mikrokontrolleri uchun LCD ekranga dastur tuzish",
 goal:"HD44780 boshqaruvchili simvolli LCD indikatorni ulash, boshlang'ich sozlash va unga matn hamda son chiqarishni o'zlashtirish.",
 outcomes:[],
 plan:["LCD tuzilishi","Ulash sxemasi","Buyruqlar va ma'lumot rejimlari","Boshlang'ich sozlash","Matn chiqarish","Sonni matnga aylantirish"],
 equip:["PIC o'quv stendi yoki Proteus","LCD 16×2 (HD44780 mos)","O'zgaruvchan rezistor 10 kΩ (kontrast uchun)","Rezistor 220 Ω (yorug'lik uchun)","Ulash simlari","Darslikning LCD simulyatori"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Simvolli LCD indikator HD44780 boshqaruvchisi asosida ishlaydi. Uning ichida uchta xotira sohasi bor: DDRAM — ekranda ko'rinadigan belgilar, CGROM — tayyor belgilar shakllari, CGRAM — foydalanuvchi yaratgan sakkiztagacha belgi. Boshqaruvchi mikrokontrollerdan buyruq yoki ma'lumot baytini qabul qiladi."],
  ["fig","lcdwire","1-rasm. LCD indikatorni 4 bitli rejimda mikrokontrollerga ulash"],
  ["t",["Liniya","Vazifasi"],[["RS","0 — buyruq rejimi, 1 — ma'lumot (belgi) rejimi"],["RW","0 — yozish, 1 — o'qish; odatda umumiy simga ulanadi"],["E","Ma'lumotni qabul qilish strobi: yuqoridan pastga fronti bo'yicha yoziladi"],["D4–D7","4 bitli rejimda ma'lumot liniyalari"],["VO","Kontrast; 10 kΩ o'zgaruvchan rezistor orqali sozlanadi"],["A, K","Orqa yorug'lik anodi va katodi, 220 Ω rezistor orqali"]]],
  ["p","4 bitli rejimda har bir bayt ikki qismga bo'lib uzatiladi: avval yuqori tetrada, so'ng quyi tetrada. Bu usul to'rtta liniyani tejaydi va amalda ustun hisoblanadi."],
  ["h","Asosiy buyruqlar"],
  ["t",["Kod","Buyruq","Bajarilish vaqti"],[["0x01","Ekranni tozalash va kursorni boshga qaytarish","~1,6 ms"],["0x02","Kursorni boshga qaytarish","~1,6 ms"],["0x06","Yozishdan keyin kursor o'ngga suriladi","40 µs"],["0x0C","Ekran yoqiladi, kursor ko'rinmaydi","40 µs"],["0x0E","Ekran va kursor yoqiladi","40 µs"],["0x28","4 bitli rejim, 2 qator, 5×8 shrift","40 µs"],["0x80","Kursorni 1-qator boshiga qo'yish","40 µs"],["0xC0","Kursorni 2-qator boshiga qo'yish","40 µs"]]],
  ["n","Diqqat: 0x01 va 0x02 buyruqlari boshqa buyruqlardan ancha uzoq bajariladi. Ular berilgandan keyin kamida 2 ms kutilmasa, keyingi buyruq yo'qoladi va ekranda buzilgan belgilar paydo bo'ladi."],
  ["h","Boshlang'ich sozlash va chiqarish"],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","/* LCD 2x16 (HD44780), 4 bitli rejim, PORTD ga ulangan — mikroC LCD kutubxonasi */\nsbit LCD_RS at RD2_bit;\nsbit LCD_EN at RD3_bit;\nsbit LCD_D4 at RD4_bit;\nsbit LCD_D5 at RD5_bit;\nsbit LCD_D6 at RD6_bit;\nsbit LCD_D7 at RD7_bit;\nsbit LCD_RS_Direction at TRISD2_bit;\nsbit LCD_EN_Direction at TRISD3_bit;\nsbit LCD_D4_Direction at TRISD4_bit;\nsbit LCD_D5_Direction at TRISD5_bit;\nsbit LCD_D6_Direction at TRISD6_bit;\nsbit LCD_D7_Direction at TRISD7_bit;"],
  ["c","void main()\n{\n    ADCON1 = 0x06;\n    TRISD  = 0x00;\n    Lcd_Init();\n    Lcd_Cmd(_LCD_CLEAR);\n    Lcd_Cmd(_LCD_CURSOR_OFF);\n\n    Lcd_Out(1, 1, \"MIKROPROTSESSOR\");\n    Lcd_Out(2, 1, \"TEXNIKASI  TDTU\");\n\n    while (1) { }\n}"],
  ["h","Sonni ekranga chiqarish"],
  ["p","LCD faqat belgilarni ko'rsatadi, shuning uchun sonni avval raqamlarga ajratib, har biriga 0x30 qo'shish kerak — shunda ASCII kodi hosil bo'ladi."],
  ["c","/* Uch xonali sonni LCD ga chiqarish: 0..999 */\nvoid lcd_son(unsigned int n)\n{\n    Lcd_Chr_Cp((n / 100) + '0');\n    Lcd_Chr_Cp(((n / 10) % 10) + '0');\n    Lcd_Chr_Cp((n % 10) + '0');\n}"],
  ["h","Interaktiv qism"],
  ["sim","lcd"],
  ["h","Topshiriqlar"],
  ["ol",["LCD ni 4 bitli rejimda ulang, kontrastni o'zgaruvchan rezistor bilan sozlang.","Birinchi qatorga ism-familiyangizni, ikkinchi qatorga guruhingizni chiqaruvchi dastur yozing.","Variant raqamingiz N bo'lsin: ekranga (100 + N) sonini lcd_son funksiyasi bilan chiqaring.","Ekranni tozalash buyrug'idan keyingi kechikishni olib tashlab, natijani kuzating va izohlang.","Har sekundda birga oshib boradigan hisoblagichni ekranda ko'rsating.","0x0E buyrug'i bilan kursorni yoqib, 0x0C bilan o'chirib, farqni tavsiflang.","Ishlayotgan indikator yoki simulyator ekranining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","HD44780 mos LCD indikator RS, E va to'rtta ma'lumot liniyasi orqali boshqariladi. Boshlang'ich sozlash qat'iy belgilangan ketma-ketlikni va kechikishlarni talab qiladi — ular buzilsa indikator ishga tushmaydi. Matn DDRAM ga belgilar kodini yozish orqali chiqariladi, sonlar esa avval ASCII belgilariga aylantiriladi."],

{
 id:"S1-M13", sem:1, week:13, type:"lecture", no:13,
 title:"Mikrokontrollerlarni tashkil etilishi. ATF15XX AS/L mikrokontrolleri",
 goal:"Mikrokontrollerlarning tashkil etilishini, resurslari va oilalarini hamda ATF15XX AS/L turkumining xususiyatlarini o'zlashtirish.",
 outcomes:["Mikrokontroller va mikroprotsessor farqini asoslay oladi","Asosiy MK oilalarini va ularning belgilarini qiyoslay oladi","PIC16F877A ning tuzilma sxemasini va resurslarini tushuntira oladi","Masala uchun mos mikrokontrollerni tanlash mezonlarini qo'llay oladi"],
 plan:["Mikrokontroller ta'rifi","Tarkibi va resurslari","MK oilalari","PIC16F877A tuzilishi","Chiqishlar va portlar","Tanlash mezonlari"],
 body:[
  ["h","Ta'rif va tarkib"],
  ["p","Mikrokontroller — bitta kristallda protsessor yadrosi, dastur xotirasi, ma'lumot xotirasi, kiritish-chiqarish portlari va periferiya tugunlari birgalikda joylashtirilgan qurilma. Ya'ni mikrokontroller — bitta korpusga jamlangan tugallangan mikroprotsessorli tizim, shu sababli u \"bir kristalli mikro-EHM\" deb ham ataladi."],
  ["t",["Belgi","Mikroprotsessor","Mikrokontroller"],[["Tarkibi","Faqat yadro","Yadro + xotira + periferiya"],["Tashqi xotira","Majburiy","Odatda shart emas"],["Razryadlilik","32/64 bit ustun","8/16/32 bit ustun"],["Chastota","GHz","MHz"],["Quvvat sarfi","Yuqori","Past (mA va undan kam)"],["Qo'llanish","Kompyuter, smartfon","Boshqaruv va o'lchash qurilmalari"]]],
  ["h","Mikrokontroller resurslari"],
  ["ul",["Dastur xotirasi — Flash, kod va doimiy jadvallar uchun","Ma'lumot xotirasi — SRAM (o'zgaruvchilar) va EEPROM (sozlamalarni saqlash)","Kiritish-chiqarish portlari — har bir razryad alohida kirish yoki chiqish qilib sozlanadi","Taymer-hisoblagichlar — vaqt oraliqlarini shakllantirish, impulslarni sanash, PWM","ADC — analog kattalikni raqamli kodga o'zgartirish","Analog komparator va ichki kuchlanish manbai","Ketma-ket interfeyslar — USART, SPI, I2C","Uzilishlar tizimi, watchdog taymer, quvvat tejash rejimlari"]],
  ["h","Mikrokontroller oilalari"],
  ["t",["Oila","Ishlab chiqaruvchi","Razryad","Xususiyati"],[["PIC10/12/16/18","Microchip","8","RISC, 35 buyruq, sodda va arzon, o'quv jarayonida keng tarqalgan"],["AVR (ATmega, ATtiny)","Microchip/Atmel","8","RISC, Arduino platalari asosi"],["MCS-51 (8051)","Intel va klonlar","8","Klassik CISC, sanoatda hamon qo'llanadi"],["STM32","STMicroelectronics","32","ARM Cortex-M yadrosi, boy periferiya"],["ESP32","Espressif","32","Wi-Fi va Bluetooth integratsiyalangan"]]],
  ["h","ATF15XX AS/L turkumi"],
  ["p","ATF15XX AS/L — Atmel (hozirda Microchip) ishlab chiqargan dasturlanadigan mantiqiy integral sxemalar (CPLD) turkumi. Ular klassik mikrokontrollerdan farq qiladi: buyruqlarni ketma-ket bajarmaydi, balki foydalanuvchi tomonidan tavsiflangan mantiqiy funksiyalarni apparat darajasida, parallel bajaradi."],
  ["t",["Belgi","Mikrokontroller","ATF15XX (CPLD)"],[["Ishlash usuli","Buyruqlarni ketma-ket bajaradi","Mantiqiy funksiyalarni parallel bajaradi"],["Dasturlash","C yoki assembler","VHDL, Verilog yoki mantiqiy tenglamalar"],["Javob vaqti","Buyruqlar soniga bog'liq","Bir necha nanosekund, oldindan aniq"],["Moslashuvchanlik","Dastur bilan","Ichki ulanishlarni qayta konfiguratsiyalash bilan"],["Tipik vazifa","Algoritmlar, hisob, interfeys","Tez mantiq, deshifrator, kengaytirgich"]]],
  ["ul",["AS va L indekslari quvvat kuchlanishi va iste'mol bo'yicha variantlarni bildiradi: L — past kuchlanishli (3,3 V) va kam quvvat sarflovchi turkum","Ichki tuzilma mantiqiy bloklar (macrocell) va ularni bog'lovchi qayta konfiguratsiyalanadigan matritsadan iborat","Konfiguratsiya energiyaga bog'liq bo'lmagan xotirada saqlanadi, shuning uchun quvvat berilishi bilan sxema darhol ishlaydi","ISP (In-System Programming) orqali platadan chiqarmasdan qayta dasturlanadi","Mikrokontroller bilan birga ishlatilganda tez mantiqiy amallarni o'z zimmasiga oladi va yadroni bo'shatadi"]],
  ["p","Amaliyotda CPLD va mikrokontroller bir-birini to'ldiradi: mikrokontroller algoritm va hisob-kitobni bajaradi, CPLD esa nanosekundlar talab qiladigan tez mantiqni — adres deshifratsiyasi, signal sinxronizatsiyasi, portlarni kengaytirish vazifalarini bajaradi."],
  ["h","PIC16F877A tuzilishi"],
  ["fig","pic","1-rasm. PIC16F877A mikrokontrollerining tuzilmaviy sxemasi va port tarkibi"],
  ["t",["Resurs","Qiymati"],[["Dastur xotirasi (Flash)","8 K × 14 bit so'z"],["Ma'lumot xotirasi (SRAM)","368 bayt"],["EEPROM","256 bayt"],["Kiritish-chiqarish liniyalari","33 ta (PORTA…PORTE)"],["Taymerlar","Timer0 (8 bit), Timer1 (16 bit), Timer2 (8 bit)"],["ADC","10 razryadli, 8 kanal"],["Ketma-ket interfeyslar","USART, MSSP (SPI va I2C)"],["Maksimal chastota","20 MHz (mashina sikli 200 ns)"],["Uzilish manbalari","14 ta"],["Quvvat manbai","2,0–5,5 V"]]],
  ["h","Portlar"],
  ["p","PIC16F877A da beshta port bor: PORTA (6 liniya), PORTB (8), PORTC (8), PORTD (8), PORTE (3). Har bir portga ikkita registr biriktirilgan: TRISx — yo'nalish registri (1 — kirish, 0 — chiqish) va PORTx — ma'lumot registri. Aksariyat liniyalar ko'p vazifali: masalan PORTA razryadlari ADC kirishlari sifatida, PORTC razryadlari esa USART va SPI liniyalari sifatida ham ishlatiladi."],
  ["n","Muhim: PORTA va PORTE liniyalari ishga tushganda analog rejimda bo'ladi. Ularni raqamli kirish sifatida ishlatish uchun ADCON1 registrida mos konfiguratsiya o'rnatilishi kerak, aks holda o'qilgan qiymat har doim nol bo'ladi."],
  ["c","/* Portlarni sozlash namunasi */\n    ADCON1 = 0x06;   /* PORTA butunlay raqamli rejimga o'tkaziladi */\n    TRISB  = 0x00;   /* PORTB — chiqish (LED)   */\n    TRISD  = 0xFF;   /* PORTD — kirish (tugmalar) */\n    PORTB  = 0x00;   /* boshlang'ich holat */"],
  ["h","Tanlash mezonlari"],
  ["ol",["Kerakli kiritish-chiqarish liniyalari soni va turi","Zarur periferiya: ADC razryadliligi, taymerlar soni, interfeyslar","Dastur va ma'lumot xotirasi hajmi","Unumdorlik: takt chastotasi va mashina sikli","Quvvat manbai kuchlanishi va iste'mol toki","Korpus turi, narxi, bozorda mavjudligi va hujjatlar sifati"]],
  ["h","Interaktiv model"],
  ["p","Port registri simulyatorida TRIS va PORT registrlari orasidagi bog'liqlikni tushunish uchun razryadlarni alohida o'zgartiring."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Mikrokontroller yadro, xotira va periferiyani bitta kristallda birlashtiradi va shu sababli boshqaruv masalalari uchun asosiy elementga aylangan. PIC16F877A o'quv maqsadlari uchun qulay: 8 K dastur xotirasi, 33 ta liniya, uchta taymer, 10 razryadli ADC va ketma-ket interfeyslarga ega. Har bir portning yo'nalishi TRIS registri bilan, holati esa PORT registri bilan belgilanadi."],

{
 id:"S1-A13", sem:1, week:13, type:"practice", no:13,
 title:"PIC mikrokontrollerida ADCni loyihalash",
 goal:"O'rnatilgan analog-raqamli o'zgartirgichni sozlash, o'lchash natijasini o'qish va kuchlanishga aylantirishni o'zlashtirish.",
 outcomes:[],
 plan:["ADC tuzilishi","Registrlarni sozlash","O'zgartirish takti","O'lchash tartibi","Natijani hisoblash","Aniqlikni oshirish"],
 equip:["PIC o'quv stendi yoki Proteus","O'zgaruvchan rezistor 10 kΩ","LCD 16×2 yoki 8 ta LED","Multimetr","Darslikning ADC simulyatori"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PIC16F877A da 10 razryadli ketma-ket yaqinlashuvchi ADC o'rnatilgan. U 8 ta kanalga ega va kanal multipleksor orqali tanlanadi. O'zgartirish natijasi 10 bit bo'lgani uchun ikkita registrda saqlanadi: ADRESH va ADRESL."],
  ["f","N = U_kirish / U_ref · (2^n − 1)","10 razryad va Uref = 5 V uchun: U = 2,5 V → N = 511."],
  ["f","U = N · U_ref / (2^n − 1)","Teskari hisob: kod 512 bo'lsa U ≈ 2,503 V."],
  ["f","q = U_ref / (2^n − 1)","Kvantlash qadami: 5 V / 1023 ≈ 4,88 mV."],
  ["h","Sozlash registrlari"],
  ["t",["Registr","Maydon","Vazifasi"],[["ADCON0","ADCS1:ADCS0","O'zgartirish taktining bo'luvchisi"],["ADCON0","CHS2:CHS0","Kanal tanlash (AN0–AN7)"],["ADCON0","GO/DONE","1 yozilsa o'zgartirish boshlanadi, tugagach 0 bo'ladi"],["ADCON0","ADON","ADC modulini yoqish"],["ADCON1","PCFG3:PCFG0","Qaysi liniyalar analog, qaysilari raqamli"],["ADCON1","ADFM","Natijani tekislash: 1 — o'ngga, 0 — chapga"]]],
  ["p","O'zgartirish takti TAD 1,6 µs dan kichik bo'lmasligi kerak. f = 8 MHz da FOSC/16 bo'luvchisi TAD = 2 µs beradi — bu talabga javob beradi. To'liq o'zgartirish 12 TAD, ya'ni taxminan 24 µs davom etadi."],
  ["n","Kanal almashtirilgandan keyin darhol o'zgartirishni boshlash mumkin emas: ichki namuna-saqlash kondensatori zaryadlanishi uchun kamida 20 µs kutish (acquisition time) talab qilinadi. Bu qadam tashlab ketilsa, natija oldingi kanal qiymatiga aralashadi."],
  ["h","Dastur"],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","__CONFIG(_HS_OSC & _WDT_OFF & _LVP_OFF);\n\n/* ADC modul: mikroC ADC kutubxonasi (ADC_Init, ADC_Read — 10 bitli natija, 0..1023) */\nvoid main()\n{\n    unsigned int kod;\n    unsigned long mv;\n\n    ADC_Init();\n    TRISB = 0x00;\n\n    while (1)\n    {\n        kod = ADC_Read(0);                              // AN0 kanali\n        mv  = (unsigned long)kod * 5000UL / 1023UL;     // millivoltda\n        PORTB = (unsigned short)(kod >> 2);             // 10 bitdan 8 bitni LEDlarga\n        Delay_ms(200);\n    }\n}"],
  ["p","Kodda kuchlanish millivoltda hisoblanadi, chunki mikrokontrollerda kasr sonlar bilan ishlash ko'p resurs talab qiladi. 32 razryadli oraliq turga keltirish esa ko'paytirishda to'lib ketishning oldini oladi."],
  ["h","Aniqlikni oshirish usullari"],
  ["ol",["Kirishga RC filtr qo'yish (masalan 1 kΩ va 0,1 µF) — yuqori chastotali shovqinni yutadi","Bir necha o'lchashning o'rtachasini olish: 8 yoki 16 marta o'lchab, yig'indini siljitish bilan bo'lish","VREF+ sifatida aniq tashqi kuchlanish manbaidan foydalanish","Analog va raqamli umumiy simlarni bitta nuqtada birlashtirish","Datchik chiqishi yuqori qarshilikli bo'lsa, operatsion kuchaytirgichli bufer qo'yish"]],
  ["c","/* 8 o'lchashning o'rtachasi */\nunsigned int adc_ortacha(unsigned short kanal)\n{\n    unsigned long s = 0;\n    unsigned short i;\n    for (i = 0; i < 8; i++)\n    {\n        s += ADC_Read(kanal);\n        Delay_us(50);\n    }\n    return (unsigned int)(s >> 3);     // 8 ga bo'lish\n}"],
  ["sim","adc"],
  ["h","Topshiriqlar"],
  ["ol",["O'zgaruvchan rezistorni AN0 kanaliga ulang va ADC ni sozlang.","Rezistorni 0 dan maksimumgacha burib, kod va multimetr ko'rsatkichini jadvalga yozing (kamida 6 nuqta).","Variant raqamingiz N bo'lsin: kirish kuchlanishi (1 + N/10) V bo'lganda kutilayotgan kodni hisoblang va tajriba bilan solishtiring.","Kvantlash qadamini hisoblang va o'lchash xatosini baholang.","8 martalik o'rtachalash funksiyasini qo'shib, natijaning barqarorlashuvini kuzating.","Natijani LCD ga voltda chiqaruvchi kod qismini yozing.","O'lchash jadvali yoki ekran rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","ADC ni ishlatish uchun ADCON1 bilan analog liniyalarni, ADCON0 bilan taktni va kanalni sozlash, so'ng GO/DONE bitini o'rnatish kerak. Kanal almashtirilgandan keyin namuna olish vaqtini kutish majburiy. 10 razryadli natija ikkita registrdan yig'iladi va formulalar orqali kuchlanishga aylantiriladi; o'rtachalash va filtrlash esa o'lchash barqarorligini sezilarli oshiradi."],

{

 goal:"Mikrokontroller protsessor yadrosining strukturasini, buyruqlar sistemasi tuzilishini va KR580VM80A buyruqlar tizimini o'zlashtirish.",

 plan:["Buyruqlar tasnifi","Ko'chirish buyruqlari","Arifmetik va mantiqiy guruhlar","Siljitish buyruqlari","O'tish va chaqiriq buyruqlari","Boshqaruv buyruqlari"],
 body:[
  ["h","Buyruqlar tasnifi"],
  ["t",["Guruh","Vazifasi","PIC16 dagi namunalar"],[["Ko'chirish","Ma'lumotni bir joydan boshqasiga uzatish","MOVLW, MOVWF, MOVF, SWAPF"],["Arifmetik","Qo'shish, ayirish, inkrement, dekrement","ADDWF, SUBWF, ADDLW, INCF, DECF"],["Mantiqiy","AND, OR, XOR, inversiya","ANDWF, IORWF, XORWF, COMF"],["Siljitish","Razryadlarni chapga yoki o'ngga surish","RLF, RRF"],["Bit bilan ishlash","Razryadni o'rnatish, tozalash, tekshirish","BSF, BCF, BTFSS, BTFSC"],["O'tish va chaqiriq","Dastur oqimini o'zgartirish","GOTO, CALL, RETURN, RETLW, RETFIE"],["Boshqaruv","Protsessor rejimini boshqarish","NOP, SLEEP, CLRWDT"]]],
  ["h","Ko'chirish buyruqlari"],
  ["p","Ko'chirish buyruqlari ALU ni ishlatmaydi va (MOVF dan tashqari) bayroqlarga ta'sir qilmaydi. MOVF f,1 buyrug'i yacheykani o'ziga ko'chiradi, ammo Z bayrog'ini yangilaydi — shuning uchun u yacheyka nolga tengligini tekshirishning standart usuli hisoblanadi."],
  ["c","    MOVLW  0x3A     ; W <- konstanta\n    MOVWF  0x20     ; (0x20) <- W\n    MOVF   0x20, 0  ; W <- (0x20), Z bayrog'i yangilanadi\n    SWAPF  0x20, 1  ; tetradalar joyini almashtiradi: 3A -> A3"],
  ["h","Siljitish buyruqlari"],
  ["p","RLF va RRF buyruqlari C bayrog'i orqali aylantirish (rotate through carry) amalini bajaradi: chetdan chiqqan bit C ga tushadi, C dagi eski qiymat esa qarama-qarshi chetdan kiradi. Shuning uchun siljitishdan oldin C ni tozalash odatiy amaliyot hisoblanadi."],
  ["c","    BCF    STATUS, C   ; C ni tozalash\n    RLF    0x20, 1      ; (0x20) 2 ga ko'paytiriladi\n    BCF    STATUS, C\n    RRF    0x20, 1      ; (0x20) 2 ga bo'linadi"],
  ["h","O'tish va chaqiriq buyruqlari"],
  ["p","GOTO va CALL ikki mashina siklida bajariladi, chunki PC qayta yuklanganda konveyer tozalanadi. RETLW buyrug'i qaytishdan oldin W registriga konstanta yozadi — bu jadval asosidagi kod o'zgartirish (masalan 7-segment kodlari) uchun klassik usul."],
  ["c","; 7-segment kodlari jadvali (umumiy katod)\nJADVAL:\n    ADDWF  PCL, 1     ; PC ga W qo'shiladi - jadvalga sakrash\n    RETLW  0x3F       ; 0\n    RETLW  0x06       ; 1\n    RETLW  0x5B       ; 2\n    RETLW  0x4F       ; 3\n    RETLW  0x66       ; 4"],
  ["n","Jadval usulida PCL ga qo'shish faqat bitta sahifa ichida to'g'ri ishlaydi. Jadval sahifa chegarasidan o'tib ketsa, PCLATH registri ham to'g'ri sozlanishi kerak, aks holda dastur noto'g'ri adresga sakraydi."],
  ["h","Skip buyruqlari va vaqt"],
  ["p","BTFSS, BTFSC, DECFSZ va INCFSZ buyruqlari shart bajarilganda keyingi buyruqni tashlab ketadi. Tashlangan buyruq o'rniga NOP bajariladi, shuning uchun bunday holatda buyruq ikki sikl oladi. Aks holda bitta sikl yetarli."],
  ["f","t = (N1 + 2·N2) · 4 / f_osc","N1 — bir sikli, N2 — ikki sikli (o'tish yoki tashlangan) buyruqlar soni."],
  ["h","KR580VM80A mikroprotsessorining buyruqlar sistemasi"],
  ["p","KR580VM80A — Intel 8080A ning mahalliy analogi bo'lgan 8 razryadli mikroprotsessor. U o'quv jarayonida klassik namuna sifatida qo'llanadi, chunki uning registrlar to'plami va buyruqlar tizimi keyingi avlod protsessorlari uchun asos bo'lgan."],
  ["t",["Registr","Razryad","Vazifasi"],[["A","8","Akkumulyator — arifmetik amallar operandi va natijasi"],["B, C, D, E, H, L","8","Umumiy registrlar; juft holda BC, DE, HL sifatida ishlatiladi"],["HL","16","Xotiraga bilvosita murojaat uchun asosiy ko'rsatkich"],["SP","16","Stek ko'rsatkichi"],["PC","16","Komandalar hisoblagichi"],["F","5 bit","Flaglar: S, Z, AC, P, C"]]],
  ["p","Buyruqlar tizimi 78 ta asosiy buyruqdan iborat bo'lib, ular besh guruhga bo'linadi: uzatish (MOV, MVI, LXI, LDA, STA), arifmetik (ADD, ADI, SUB, INR, DCR), mantiqiy (ANA, ORA, XRA, CMP), siljitish va aylantirish (RLC, RRC, RAL, RAR) hamda boshqaruv (JMP, JZ, JC, CALL, RET, PUSH, POP, HLT, EI, DI)."],
  ["c","; KR580VM80A: ikki sonni qo'shib xotiraga yozish\n      LXI  H, 2000H    ; HL <- 2000H (xotira ko'rsatkichi)\n      MOV  A, M        ; A <- (HL)\n      INX  H           ; HL <- HL + 1\n      ADD  M           ; A <- A + (HL), flaglar yangilanadi\n      INX  H\n      MOV  M, A        ; natija (HL) ga yoziladi\n      HLT              ; to'xtash"],
  ["p","Buyruq uzunligi 1, 2 yoki 3 baytni tashkil qiladi: birinchi bayt — operatsiya kodi, keyingilari esa konstanta yoki 16 razryadli adres. Buyruqlar 4 dan 18 gacha taktda bajariladi, shuning uchun dastur vaqtini hisoblashda har bir buyruqning takt soni jadvaldan olinadi."],
  ["h","Boshqaruv buyruqlari"],
  ["ul",["NOP — hech qanday amal bajarmaydi, aniq vaqt kechikishini shakllantirishda ishlatiladi","SLEEP — protsessorni quvvat tejash rejimiga o'tkazadi; uyg'onish uzilish yoki reset bilan bo'ladi","CLRWDT — watchdog taymerni tozalaydi va reset bo'lishini oldini oladi"]],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Buyruqlar funksional jihatdan ko'chirish, arifmetik, mantiqiy, siljitish, bit, o'tish va boshqaruv guruhlariga bo'linadi. Ko'chirish buyruqlari bayroqlarga ta'sir qilmaydi, siljitish esa C bayrog'i orqali bajariladi. O'tish va tashlab ketish holatlari ikki sikl talab qiladi — bu dastur vaqtini hisoblashda hisobga olinadi."],
 ],

  {q:"KR580VM80A o'quv jarayonida nima uchun qo'llanadi?",o:["Faqat o'zbek tilidagi hujjatlari mavjud bo'lgani uchun","Registrlar to'plami va buyruqlar tizimi keyingi avlodlar uchun asos bo'lgan","Eng yuqori unumdorlikka ega protsessor hisoblangani uchun","Hozirgi kunda ham sanoatda eng keng tarqalgan protsessor bo'lgani uchun"]},

{
 id:"S1-A14", sem:1, week:14, type:"practice", no:14,
 title:"PIC mikrokontrollerida PWMni loyihalash",
 goal:"CCP modulini PWM rejimida sozlash, chastota va to'ldirish koeffitsientini hisoblash hamda yuklamani boshqarishni o'zlashtirish.",
 outcomes:[],
 plan:["PWM tushunchasi","CCP moduli","Chastotani hisoblash","To'ldirishni hisoblash","Dastur","Yuklamani ulash"],
 equip:["PIC o'quv stendi yoki Proteus","LED yoki kichik dvigatel va drayver","Ossillograf","O'zgaruvchan rezistor 10 kΩ","Darslikning PWM simulyatori"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PWM (Pulse Width Modulation) — davri o'zgarmas, impuls davomiyligi esa boshqariladigan signal. O'rtacha kuchlanish impuls davomiyligiga proporsional bo'lgani uchun PWM yorqinlik, tezlik va quvvatni raqamli usulda, deyarli yo'qotishsiz boshqarish imkonini beradi."],
  ["f","D = t_impuls / T · 100 %","To'ldirish koeffitsienti."],
  ["f","U_ortacha = D · U_cc","D = 40 %, U = 5 V → 2 V."],
  ["p","PWM tranzistorni faqat to'liq ochiq yoki to'liq yopiq holatda ushlaydi, shuning uchun unda issiqlik yo'qotishi rezistorli boshqaruvga qaraganda ancha kam bo'ladi."],
  ["h","CCP moduli va hisoblar"],
  ["p","PIC16F877A da ikkita CCP moduli bor; PWM rejimida ular Timer2 va PR2 registri bilan ishlaydi. Chiqish CCP1 uchun RC2, CCP2 uchun RC1 liniyasida shakllanadi."],
  ["f","PR2 = f_osc / (4 · K · f_pwm) − 1","PWM chastotasini belgilash. f = 8 MHz, K = 16, f_pwm = 1 kHz → PR2 = 124."],
  ["f","CCPR1L:CCP1CON<5:4> = 4 · (PR2 + 1) · D","10 razryadli to'ldirish qiymati. D = 0,5 va PR2 = 124 → 250."],
  ["p","To'ldirish 10 razryadli qiymat bilan beriladi: yuqori 8 bit CCPR1L registrida, quyi 2 bit esa CCP1CON registrining 4- va 5-razryadlarida saqlanadi. Amaliyotda ko'pincha faqat CCPR1L ishlatiladi va bu 8 razryadli aniqlik beradi."],
  ["h","Dastur"],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","__CONFIG(_HS_OSC & _WDT_OFF & _LVP_OFF);\n\nvoid pwm_init()\n{\n    PR2      = 124;       // f_pwm = 1 kHz (K = 16)\n    CCP1CON  = 0x0C;      // CCP1 PWM rejimida\n    T2CON    = 0x06;      // Timer2 yoqilgan, bo'luvchi 1:16\n    TRISC.F2 = 0;         // CCP1 chiqishi\n}\n\nvoid pwm_duty(unsigned short percent)     // 0..100 %\n{\n    unsigned long d = (4UL * (PR2 + 1) * percent) / 100UL;\n    CCPR1L  = (unsigned short)(d >> 2);\n    CCP1CON = (unsigned short)((CCP1CON & 0xCF) | ((d & 0x03) << 4));\n}\n\nvoid main()\n{\n    unsigned short p;\n    pwm_init();\n    while (1)\n    {\n        for (p = 0; p <= 100; p += 5) { pwm_duty(p); Delay_ms(60); }\n        for (p = 100; p > 0; p -= 5)  { pwm_duty(p); Delay_ms(60); }\n    }\n}"],
  ["p","Bu dastur LED yorqinligini silliq oshirib-kamaytiradi. Dvigatel boshqarishda pwm_duty funksiyasiga ADC dan olingan qiymat uzatiladi — shunda potensiometr bilan tezlik boshqariladi."],
  ["h","Yuklamani ulash"],
  ["t",["Yuklama","Ulash","Izoh"],[["LED","Rezistor orqali bevosita","10 mA gacha"],["Kichik dvigatel","MOSFET yoki tranzistor kaliti","Teskari diod majburiy"],["Dvigatelni ikki yo'nalishda","L293D ko'prigi orqali","PWM ruxsat kirishiga beriladi"],["Isitgich, lampa","Optron va simistor orqali","Tarmoq kuchlanishida galvanik ajratish shart"],["Analog kuchlanish","RC past chastotali filtr","Kesish chastotasi f_pwm dan ancha kichik bo'lsin"]]],
  ["n","Xavfsizlik: induktiv yuklamani (dvigatel, rele) tranzistorsiz va teskari diodsiz ulash mumkin emas. Kalit yopilganda paydo bo'ladigan o'z-o'zidan induksiya EYK i tranzistorni ham, mikrokontrollerni ham teshib yuborishi mumkin."],
  ["h","Chastotani tanlash"],
  ["ul",["LED yorqinligi uchun 100 Hz dan yuqori — ko'z miltillashni sezmaydi","Dvigatel uchun 5–20 kHz — eshitiladigan g'ing'illashdan qochish uchun","Isitish uchun 1 Hz ham yetarli — inersiya katta","Chastota qancha yuqori bo'lsa, kalitlash yo'qotishlari shuncha ortadi"]],
  ["sim","pwm"],
  ["h","Topshiriqlar"],
  ["ol",["CCP1 modulini 1 kHz chastotaga sozlang va ossillograf bilan davrni o'lchang.","To'ldirishni 25, 50 va 75 % qilib, impuls davomiyligini o'lchang va jadvalga yozing.","Variant raqamingiz N bo'lsin: f_pwm = (1 + N/10) kHz uchun PR2 qiymatini hisoblang.","Har bir holatda o'rtacha kuchlanishni voltmetr bilan o'lchab, nazariy qiymat bilan solishtiring.","ADC dan olingan qiymat bilan to'ldirishni boshqaruvchi dastur yozing (potensiometr bilan yorqinlik).","PWM chiqishiga RC filtr ulab, analog kuchlanish olinishini kuzating.","Ossillogramma yoki simulyator ekranining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","PWM davri Timer2 va PR2 registri bilan, to'ldirish esa CCPR1L va CCP1CON razryadlari bilan belgilanadi. O'rtacha kuchlanish to'ldirish koeffitsientiga to'g'ri proporsional bo'lgani uchun PWM quvvatni samarali boshqarish usuli hisoblanadi. Chastota yuklama turiga qarab tanlanadi, induktiv yuklama esa albatta kalit va teskari diod orqali ulanadi."],

{
 id:"S1-M15", sem:1, week:15, type:"lecture", no:15,
 title:"Fon Neyman va Garvard arxitekturali mikrokontrollerlar",
 goal:"Fon Neyman va Garvard arxitekturalarini, CISC va RISC yondashuvlarini hamda konveyer prinsipini o'zlashtirish.",
 outcomes:["Ikki asosiy arxitekturani qiyoslay oladi","Xotira fazosining taqsimotini tushuntira oladi","CISC va RISC farqini asoslay oladi","Konveyerning unumdorlikka ta'sirini izohlay oladi"],
 plan:["Arxitektura tushunchasi","Fon Neyman sxemasi","Garvard va modifikatsiyalangan Garvard","Xotira fazosi","CISC va RISC","Konveyer"],
 body:[
  ["h","Arxitektura tushunchasi"],
  ["p","Arxitektura deganda tizimning dasturchiga ko'rinadigan tuzilishi tushuniladi: registrlar to'plami, buyruqlar tizimi, adreslash usullari va xotira modeli. Bitta arxitektura turli kristallarda turlicha texnik yechim bilan amalga oshirilishi mumkin — bu mikroarxitektura deb ataladi."],
  ["h","Fon Neyman arxitekturasi"],
  ["p","Bu sxemada buyruqlar ham, ma'lumotlar ham bitta umumiy xotirada saqlanadi va ularga bitta umumiy shina orqali murojaat qilinadi. Natijada protsessor bitta taktda yo buyruqni o'qiy oladi, yo ma'lumotni — ikkalasini bir vaqtda emas. Bu cheklov fon Neyman to'sig'i deb ataladi."],
  ["fig","arch","1-rasm. Fon Neyman va Garvard arxitekturalarining qiyosiy sxemasi"],
  ["h","Garvard arxitekturasi"],
  ["p","Garvard sxemasida buyruq xotirasi va ma'lumot xotirasi jismonan ajratilgan, har birining o'z shinasi bor. Buyruqni o'qish va ma'lumotga murojaat bir taktda parallel bajariladi. PIC, AVR va aksariyat mikrokontrollerlar shu sxemada qurilgan. PIC16 oilasida buyruq so'zi 14 bitli, ma'lumot yacheykasi esa 8 bitli — bu faqat ajratilgan xotira bilan mumkin."],
  ["p","Amalda ko'pincha modifikatsiyalangan Garvard qo'llanadi: xotira ajratilgan, ammo maxsus buyruqlar orqali dastur xotirasidan doimiy jadvallarni o'qish imkoni qoldiriladi."],
  ["t",["Belgi","Fon Neyman","Garvard"],[["Xotira","Umumiy","Ajratilgan"],["Shina soni","Bitta","Ikkita mustaqil"],["Bir taktda murojaat","Faqat bittasiga","Buyruq va ma'lumotga"],["Buyruq va ma'lumot razryadi","Bir xil","Har xil bo'lishi mumkin"],["Tipik qo'llanish","Umumiy maqsadli protsessorlar","Mikrokontroller, DSP"]]],
  ["h","Xotira fazosining tuzilishi"],
  ["fig","mem","2-rasm. Mikrokontroller xotira fazosining tipik taqsimoti"],
  ["p","Stek — LIFO tamoyilida ishlaydigan soha; unga qism dasturga o'tishda qaytish adresi joylashtiriladi. PIC16 da stek apparat ko'rinishida bo'lib, chuqurligi 8 daraja bilan cheklangan — bu chuqur ichma-ich chaqiriqlarga to'siq qo'yadi. Periferiya registrlari (SFR) ham adres fazosida joylashgani uchun ularga oddiy xotira buyruqlari bilan murojaat qilinadi."],
  ["h","CISC va RISC"],
  ["t",["Belgi","CISC","RISC"],[["Buyruqlar soni","Ko'p (100+)","Kam (35–80)"],["Buyruq uzunligi","O'zgaruvchan","Doimiy"],["Bajarish vaqti","Har xil","Asosan 1 sikl"],["Registrlar soni","Kam","Ko'p"],["Vakillar","x86, 8051","PIC, AVR, ARM, RISC-V"]]],
  ["p","PIC16 oilasi RISC yondashuvining yorqin namunasi: butun buyruqlar tizimi 35 ta buyruqdan iborat, barcha buyruqlar bir xil 14 bitli formatda va o'tishdan tashqari hammasi bitta mashina siklida bajariladi. Bu dasturning bajarilish vaqtini oldindan aniq hisoblash imkonini beradi — real vaqt tizimlari uchun muhim xususiyat."],
  ["h","Konveyer"],
  ["p","Konveyer buyruq bosqichlarini parallel bajarish imkonini beradi: joriy buyruq bajarilayotganda keyingisi xotiradan olinadi. PIC da ikki bosqichli konveyer qo'llanadi va shu sababli oddiy buyruqlar samarali bir siklda tugaydi. O'tish bajarilganda oldindan olingan buyruq yaroqsiz bo'lib qoladi, konveyer tozalanadi va buyruq ikki sikl oladi."],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Fon Neyman arxitekturasi soddaligi va moslashuvchanligi, Garvard esa parallel murojaat imkoniyati bilan ajralib turadi. Mikrokontrollerlarda xotira dastur, ma'lumot, stek va periferiya registrlari sohalariga bo'linadi. RISC yondashuvi va konveyer birgalikda past chastotada ham barqaror, oldindan hisoblanadigan unumdorlikni ta'minlaydi."],
 ],

{
 id:"S1-A15", sem:1, week:15, type:"practice", no:15,
 title:"PIC mikrokontrollerida termometrni loyihalash",
 goal:"Harorat datchigidan signal olish, uni ADC bilan o'lchash, haroratga aylantirish va indikatorga chiqarish tizimini to'liq loyihalash.",
 outcomes:[],
 plan:["Tizimning tuzilmasi","Datchikni tanlash","Signalni o'lchash","Haroratga aylantirish","Indikatsiya","Kalibrlash va boshqaruv"],
 equip:["PIC o'quv stendi yoki Proteus","LM35 harorat datchigi (yoki NTC termistor)","LCD 16×2","Rezistor 10 kΩ, kondensator 0,1 µF","Multimetr va etalon termometr","Darslikning ADC va LCD simulyatorlari"],
 body:[
  ["h","Tizimning tuzilmasi"],
  ["p","Raqamli termometr to'rt bosqichdan iborat: datchik haroratni elektr signalga aylantiradi, ADC signalni raqamli kodga o'zgartiradi, mikrokontroller kodni haroratga aylantiradi, indikator natijani ko'rsatadi. Bu tuzilma har qanday o'lchash qurilmasi uchun umumiy hisoblanadi."],
  ["fig","temp","1-rasm. Mikrokontrollerli termometrning tuzilmaviy va ulanish sxemasi"],
  ["t",["Datchik","Chiqish signali","Diapazon","Xususiyati"],[["LM35","10 mV/°C, chiziqli","0…100 °C","Kalibrlash talab qilmaydi, ulash oson"],["NTC termistor","Qarshilik, chiziqsiz","−40…125 °C","Arzon, hisob murakkab"],["DS18B20","Raqamli, 1-Wire","−55…125 °C","ADC kerak emas, yuqori aniqlik"],["Termojuft","mV darajasidagi EYK","0…1000 °C dan yuqori","Kuchaytirgich va sovuq spay kompensatsiyasi kerak"]]],
  ["h","LM35 bilan o'lchash"],
  ["p","LM35 chiqishida harorat bilan chiziqli bog'liq kuchlanish hosil bo'ladi: 25 °C uchun 250 mV. Uref = 5 V va 10 razryadli ADC da kvantlash qadami 4,88 mV, demak bitta kod taxminan 0,49 °C ga mos keladi."],
  ["f","U = 10 mV · T","LM35 ning asosiy tavsifi."],
  ["f","T = N · U_ref / (1023 · 0,01)","Kod orqali haroratni hisoblash. Uref = 5 V uchun T ≈ N · 0,489."],
  ["p","Aniqlikni oshirish uchun Uref sifatida 2,56 V yoki 1,024 V li aniq manbadan foydalanish mumkin — shunda kvantlash qadami ikki-besh barobar kichrayadi va bitta kod 0,1–0,25 °C ni beradi."],
  ["h","Dastur"],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","__CONFIG(_HS_OSC & _WDT_OFF & _LVP_OFF);\n\n/* LCD va ADC: oldingi ishdagi sbit e'lonlari, ADC_Init va Lcd_* funksiyalari */\nunsigned int harorat_olish()          /* natija 0,1 °C birliklarida */\n{\n    unsigned long s = 0;\n    unsigned short i;\n    for (i = 0; i < 16; i++) { s += ADC_Read(0); Delay_ms(2); }\n    s >>= 4;                                   /* 16 ta o'lchashning o'rtachasi */\n    return (unsigned int)(s * 4890UL / 1000UL);   /* kod -> 0,1 °C (LM35: 10 mV/°C) */\n}\n\nvoid main()\n{\n    unsigned int t;\n\n    ADC_Init();\n    TRISB = 0x00;\n    Lcd_Init();\n    Lcd_Cmd(_LCD_CLEAR);\n    Lcd_Cmd(_LCD_CURSOR_OFF);\n    Lcd_Out(1, 1, \"Harorat:\");\n\n    while (1)\n    {\n        t = harorat_olish();\n\n        Lcd_Chr(2, 1, (t / 100) + '0');\n        Lcd_Chr(2, 2, ((t / 10) % 10) + '0');\n        Lcd_Chr(2, 3, '.');\n        Lcd_Chr(2, 4, (t % 10) + '0');\n        Lcd_Chr(2, 5, ' ');\n        Lcd_Chr(2, 6, 0xDF);            /* daraja belgisi */\n        Lcd_Chr(2, 7, 'C');\n\n        if (t >= 400)      PORTB.F0 = 1;   /* 40,0 °C dan yuqori — signal */\n        else if (t <= 380) PORTB.F0 = 0;   /* 2 °C gisterezis */\n\n        Delay_ms(500);\n    }\n}"],
  ["p","Kodda 0,1 °C birliklari ishlatilgani uchun kasr sonlar talab qilinmaydi — butun sonlar bilan ishlash mikrokontrollerda ancha tez va kam xotira oladi. Signalizatsiya chegarasida 2 °C gisterezis qo'llangan, bu chegara atrofida relening tez-tez kalitlanishini oldini oladi."],
  ["h","Kalibrlash"],
  ["ol",["Qurilmani etalon termometr bilan bir xil sharoitga qo'ying va 10 daqiqa barqarorlashtiring.","Ikki nuqtada (masalan xona harorati va muzli suv) ko'rsatkichlarni yozib oling.","Farqni hisoblang: agar u butun diapazonda bir xil bo'lsa — nol siljishi, o'zgarib borsa — koeffitsient xatosi.","Nol siljishini dasturda doimiy tuzatma sifatida hisobga oling.","Koeffitsient xatosini hisoblash formulasidagi ko'paytuvchini o'zgartirib tuzating.","Tuzatmalarni EEPROM ga yozib qo'ying — shunda ular quvvat uzilganda ham saqlanadi."]],
  ["n","O'lchash aniqligiga ta'sir qiluvchi omillar: datchik va ADC kirishini bog'lovchi uzun simlar (shovqin), quvvat manbaining beqarorligi (Uref sifatida VDD ishlatilganda), datchikning o'z-o'zidan qizishi va yaqindagi issiqlik manbalari."],
  ["h","Interaktiv qism"],
  ["sim","adc"],
  ["sim","lcd"],
  ["h","Topshiriqlar"],
  ["ol",["LM35 ni AN0 kanaliga ulang, kirishga RC filtr qo'ying va sxemani chizing.","Xona haroratini o'lchab, ADC kodi va hisoblangan qiymatni etalon termometr bilan solishtiring.","Variant raqamingiz N bo'lsin: signalizatsiya chegarasini (30 + N) °C qilib belgilang va gisterezisni 2 °C qoldiring.","Haroratni LCD ga 0,1 °C aniqligida chiqaruvchi dasturni yozing va ishlashini tekshiring.","16 martalik o'rtachalashni o'chirib va yoqib, ko'rsatkichning tebranishini taqqoslang.","Ikki nuqtali kalibrlashni bajaring va tuzatmani dasturga kiriting.","O'lchash jadvali va ishlayotgan qurilma rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Raqamli termometr datchik, ADC, hisoblash va indikatsiya bosqichlaridan iborat yaxlit o'lchash tizimidir. LM35 ning chiziqli tavsifi hisobni soddalashtiradi, butun sonli birliklar esa mikrokontroller resurslarini tejaydi. O'rtachalash, filtrlash va ikki nuqtali kalibrlash o'lchash aniqligini sezilarli oshiradi; chegaraviy signalizatsiyada gisterezis majburiy element hisoblanadi."],
 ],

{

 body:[
  ["h","Aloqa tushunchasi"],
  ["p","Mikrokontroller kamdan-kam hollarda yolg'iz ishlaydi: u datchiklardan ma'lumot oladi, indikator va ijro mexanizmlarini boshqaradi, kompyuter yoki boshqa kontrollerlar bilan ma'lumot almashadi. Shu almashinuvni tashkil etuvchi qoidalar va apparat vositalari majmuasi interfeys deb ataladi."],
  ["p","Har qanday interfeys uchta darajada tavsiflanadi: fizik daraja (simlar soni, signal darajalari, ulagichlar), kanal darajasi (kadr tuzilishi, sinxronlash, xatolarni aniqlash) va protokol darajasi (buyruqlar, adreslar, javoblar tartibi)."],
  ["h","Parallel va ketma-ket uzatish"],
  ["t",["Belgi","Parallel","Ketma-ket"],[["Liniyalar soni","Razryadlar soniga teng (8, 16)","1–4 ta"],["Tezligi","Qisqa masofada yuqori","Uzoq masofada afzal"],["Masofasi","0,5 m gacha","O'nlab va yuzlab metr"],["Narxi","Yuqori (ko'p sim, ulagich)","Past"],["Muammosi","Razryadlar o'rtasida vaqt nomuvofiqligi","Qo'shimcha sinxronlash kerak"],["Qo'llanishi","Tashqi xotira, LCD","Datchiklar, kompyuter, tarmoq"]]],
  ["p","Zamonaviy tizimlarda ketma-ket interfeyslar ustun turadi: liniyalar kam, ulagich sodda, uzoq masofada ishonchli. Parallel uzatish faqat qisqa masofali va yuqori tezlikli ulanishlarda (tashqi xotira, indikator) saqlanib qolgan."],
  ["h","Sinxron va asinxron aloqa"],
  ["p","Sinxron aloqada qabul qiluvchi va uzatuvchi umumiy takt signali bo'yicha ishlaydi — bu SPI va I2C da qo'llanadi. Asinxron aloqada esa takt liniyasi yo'q, ikkala tomon oldindan kelishilgan tezlikda ishlaydi va har bir bayt start va stop bitlari bilan ajratiladi — bu UART ning ish tamoyili."],

  ["f","t = n_bit / v","Uzatish vaqti. 9600 bit/s da 10 bitli kadr 1,04 ms davom etadi."],
  ["p","Misol. 1 kbayt ma'lumotni UART orqali 9600 bod tezlikda uzatish uchun har bir bayt 10 bit (start + 8 ma'lumot + stop) bilan uzatiladi: 1024 · 10 / 9600 ≈ 1,07 s. Xuddi shu hajm SPI orqali 1 Mbit/s tezlikda 8,2 ms da uzatiladi."],

  ["h","Interfeysni tanlash mezonlari"],
  ["ol",["Uzatiladigan ma'lumot hajmi va talab qilinadigan tezlik","Qurilmalar soni va ularni adreslash zarurati","Masofa va shovqin sharoiti","Bo'sh port liniyalari soni","Galvanik ajratish talabi","Tayyor kutubxona va komponentlar mavjudligi"]],
  ["n","Amaliy qoida: datchiklar uchun ko'pincha I2C yoki 1-Wire, tez ADC va xotira uchun SPI, kompyuter bilan aloqa uchun UART yoki USB, sanoat masofasi uchun RS-485 yoki CAN tanlanadi."],
  ["sim","uart"],
