 ],
 body:[
  ["h","Boshqaruv qurilmasining tuzilishi"],
  ["p","Boshqaruv qurilmasi (boshqaruv sxemasi) — protsessorning barcha tugunlariga kerakli vaqtda kerakli signalni yuboradigan qismi. U buyruq registridagi kodni tahlil qilib, uni elementar amallar ketma-ketligiga aylantiradi va har bir taktda qaysi registr ochilishi, ALU qaysi amalni bajarishi, natija qayerga yozilishini belgilaydi."],
  ["ul",[
   "Buyruq registri (IR) — bajarilayotgan buyruq kodini saqlaydi",
   "Operatsiyalar deshifratori — kodni tanib, mos boshqaruv chizig'ini faollashtiradi",
   "Takt generatori va fazalar shakllantirgichi — amallarni vaqt bo'yicha taqsimlaydi",
   "Boshqaruv signallari matritsasi — deshifrator chiqishi va takt fazalarini birlashtiradi",
   "Uzilishlar va tashqi so'rovlarni qabul qilish sxemasi"
  ]],
  ["h","Ichki ma'lumotlar shinasi"],
  ["p","Protsessor ichidagi barcha tugunlar — ALU, akkumulyator, umumiy registrlar, buyruq registri va adres shakllantirgich — umumiy ichki ma'lumotlar shinasi orqali bog'langan. Bu shina tashqi shinadan farq qiladi: u faqat kristall ichida ishlaydi, kengroq bo'lishi mumkin va tashqi qurilmalarga chiqmaydi."],
  ["p","Bir vaqtda faqat bitta manba ichki shinaga qiymat qo'yishi mumkin. Boshqaruv qurilmasi kerakli registrning chiqish buferini ochadi va qabul qiluvchi registrga yozish signalini beradi — shu tarzda bitta takt ichida bir registrdan ikkinchisiga ko'chirish bajariladi."],
  ["c","Misol: MOV R1, R2 buyrug'ini bajarish bosqichlari\n  1-takt: IR <- xotiradan buyruq kodi\n  2-takt: deshifrator kodni taniydi\n  3-takt: R2 ning chiqish buferi ochiladi -> ichki shina\n  4-takt: R1 ga yozish signali beriladi -> ko'chirish tugadi"],

  ["h","Komandalar hisoblagichi"],
  ["p","Komandalar hisoblagichi (PC — Program Counter) keyingi bajariladigan buyruqning dastur xotirasidagi adresini saqlaydi. Har bir buyruq olingandan so'ng PC avtomatik ravishda buyruq uzunligiga mos ravishda ortadi. Aynan shu avtomatik ortish dasturning ketma-ket bajarilishini ta'minlaydi."],
  ["fig","cycle","1-rasm. Buyruq bajarilish sikli va PC ning o'zgarishi"],
  ["p","PIC16F877A da PC 13 razryadli bo'lib, 8 K so'z dastur xotirasini adreslaydi. Uning quyi bayti PCL registri sifatida dasturga ochiq, yuqori qismi esa PCLATH registri orqali yuklanadi. PCL ga to'g'ridan-to'g'ri yozish ham o'tishning bir turi hisoblanadi va jadval asosidagi tanlovlarda ishlatiladi."],
  ["h","Dastur oqimini o'zgartirish"],
  ["t",["Amal","Buyruq namunasi","PC bilan nima bo'ladi"],[
   ["Ketma-ket bajarish","MOVLW, ADDWF","PC ← PC + 1"],
   ["Shartsiz o'tish","GOTO adres","PC ← adres"],
   ["Shartli bajarish","BTFSS, DECFSZ","Shart bajarilsa PC ← PC + 2"],
   ["Qism dasturni chaqirish","CALL adres","PC + 1 stekka, PC ← adres"],
   ["Qaytish","RETURN, RETLW","PC ← stekdan olingan adres"],

  ["h","Qism dastur va stek"],
  ["p","CALL buyrug'i bajarilganda qaytish adresi (joriy PC + 1) stekka joylashtiriladi va PC ga qism dastur adresi yoziladi. RETURN buyrug'i stekdan adresni olib PC ga qaytaradi va dastur uzilgan joydan davom etadi. PIC16 da stek apparat ko'rinishida bo'lib, chuqurligi 8 daraja bilan cheklangan."],
  ["n","Agar ichma-ich chaqiriqlar chuqurligi sakkiztadan oshsa, eng eski qaytish adresi yo'qoladi va dastur RETURN dan keyin noto'g'ri joyga qaytadi. Bu xato dastur \"tasodifiy\" ishdan chiqishining tipik sababi hisoblanadi."],
  ["c","; Qism dasturli dastur tuzilmasi\n      ORG    0x0000\n      GOTO   MAIN\n\n      ORG    0x0004          ; uzilish vektori\n      GOTO   ISR\n\nMAIN: CALL   INIT            ; PC+1 stekka, INIT ga o'tish\nLOOP: CALL   KECHIKISH\n      BSF    PORTB, 0\n      CALL   KECHIKISH\n      BCF    PORTB, 0\n      GOTO   LOOP            ; cheksiz sikl\n\nINIT: BCF    STATUS, RP0\n      CLRF   PORTB\n      RETURN                 ; stekdan qaytish adresi olinadi"],
  ["h","Uzilish va PC"],
  ["p","Uzilish so'rovi kelganda protsessor joriy buyruqni oxirigacha bajaradi, so'ng PC ni stekka saqlaydi, umumiy uzilish ruxsatini (GIE) tozalaydi va PC ga uzilish vektori adresini yozadi. PIC16 da bu adres 0x0004. Xizmat qism dasturi RETFIE buyrug'i bilan tugaydi: u PC ni stekdan tiklaydi va GIE ni qayta yoqadi."],
  ["p","Muhim farq: CALL da o'tishni dastur o'zi rejalashtiradi, uzilishda esa o'tish istalgan vaqtda apparat hodisasi tufayli yuz beradi. Shuning uchun xizmat qism dasturida o'zgartiriladigan registrlar (W, STATUS) boshida saqlanib, oxirida tiklanishi kerak."],
  ["h","Dastur oqimini hisoblash"],
  ["p","Misol. f = 8 MHz, mashina sikli 500 ns. Sikl tanasida 4 ta bir sikli buyruq, 1 ta CALL (2 sikl), qism dasturda 6 ta bir sikli buyruq va RETURN (2 sikl) bo'lsa: jami 4 + 2 + 6 + 2 = 14 sikl, ya'ni 7 µs. Bir sekundda sikl taxminan 143 000 marta takrorlanadi."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Komandalar hisoblagichi dastur oqimini belgilovchi asosiy registr: uning avtomatik ortishi ketma-ket bajarishni, unga yangi qiymat yozish esa o'tishni anglatadi. Qism dastur chaqirig'ida qaytish adresi stekka saqlanadi, uzilishda ham shu mexanizm ishlatiladi. Stek chuqurligining chegarasi va uzilishda registrlarni saqlash zarurati amaliy dasturlashda alohida e'tibor talab qiladi."]
 ],

{
 id:"S1-A9", sem:1, week:9, type:"practice", no:9,
 title:"Portlar bilan ishlash",
 goal:"Kiritish-chiqarish portlarini sozlash, razryadlar bilan maskalash amallarini bajarish va port orqali ma'lumot almashishni o'zlashtirish.",
 equip:["PIC o'quv stendi yoki Proteus","LED 8 dona, rezistor 330 Ω","Tugmalar va 10 kΩ rezistorlar","Multimetr","Darslikning port va LED simulyatorlari"],
 plan:["Port registrlari","Yo'nalishni sozlash","Bit va bayt amallar","Maskalash","Yuguruvchi olov","Tokni hisoblash"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PIC16F877A da beshta port bor: PORTA (6 liniya), PORTB, PORTC, PORTD (8 tadan) va PORTE (3 liniya). Har bir portga ikkita registr biriktirilgan: TRISx — yo'nalish registri (1 — kirish, 0 — chiqish) va PORTx — ma'lumot registri. Yo'nalishni sozlamasdan chiqishga qiymat yozish natija bermaydi."],
  ["fig","port","1-rasm. Chiqish portiga LED ni ulash va tokni hisoblash"],
  ["f","R = (U_cc − U_led) / I_led","U_cc = 5 V, U_led = 2 V, I = 10 mA → R = 300 Ω, standart qatordan 330 Ω olinadi."],
  ["p","Chiqish liniyasining ruxsat etilgan toki PIC16F877A uchun 25 mA, butun port uchun 100 mA, kristall uchun jami 200 mA ni tashkil qiladi. Sakkizta LED ni bir vaqtda 20 mA bilan yoqish port chegarasidan oshib ketadi, shuning uchun tok 8–10 mA atrofida tanlanadi yoki tashqi drayver qo'yiladi."],
  ["h","Portni sozlash va boshqarish"],
  ["c","#include <xc.h>\n#pragma config FOSC = HS, WDTE = OFF, LVP = OFF\n#define _XTAL_FREQ 8000000UL\n\nvoid main(void)\n{\n    ADCON1 = 0x06;      /* PORTA raqamli rejim */\n    TRISB  = 0x00;      /* PORTB butunlay chiqish */\n    TRISD  = 0xFF;      /* PORTD butunlay kirish  */\n    TRISC  = 0xF0;      /* RC0-RC3 chiqish, RC4-RC7 kirish */\n    PORTB  = 0x00;\n\n    while (1)\n    {\n        PORTB = PORTD;           /* kirishdagi kodni chiqishga uzatish */\n        PORTBbits.RB7 = 1;       /* faqat 7-razryadni yoqish */\n        PORTB |=  0x03;          /* 0 va 1-razryadlarni yoqish */\n        PORTB &= ~0x0C;          /* 2 va 3-razryadlarni o'chirish */\n        PORTB ^=  0x10;          /* 4-razryad holatini almashtirish */\n        __delay_ms(200);\n    }\n}"],
  ["h","Maskalash amallari"],
  ["t",["Vazifa","Amal","Namuna"],[
   ["Razryadni yoqish","OR maska bilan","PORTB |= 0x01"],
   ["Razryadni o'chirish","AND inversiyalangan maska bilan","PORTB &= ~0x01"],
   ["Razryad holatini almashtirish","XOR maska bilan","PORTB ^= 0x01"],
   ["Razryadni tekshirish","AND maska va solishtirish","if (PORTD & 0x01)"],
   ["Quyi tetradani ajratish","AND 0x0F","x = PORTD & 0x0F"],
   ["Yuqori tetradani quyiga ko'chirish","O'ngga siljitish","x = PORTD >> 4"]
  ]],
  ["h","Yuguruvchi olov"],
  ["c","    uint8_t m = 0x01;\n    while (1)\n    {\n        PORTB = m;\n        __delay_ms(120);\n        m <<= 1;              /* keyingi razryadga siljitish */\n        if (m == 0)           /* chetdan chiqib ketdi */\n            m = 0x01;         /* boshidan boshlash    */\n    }"],
  ["p","Bu dastur PORTB ning razryadlarini navbat bilan yoqadi. Siljitish 8 marta bajarilgach qiymat nolga aylanadi va tekshiruv uni qayta boshlang'ich holatga qaytaradi."],
  ["h","Interaktiv qism"],
  ["sim","port"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Variant raqamingiz N bo'lsin: PORTB ga (0x0F + N) qiymatini chiqaring va LED holatlarini jadvalga yozing.",
   "TRISC = 0xF0 sozlamasida qaysi liniyalar kirish, qaysilari chiqish ekanini aniqlang.",
   "PORTD ning quyi tetradasini o'qib, uni PORTB ning yuqori tetradasiga ko'chiruvchi kod yozing.",
   "Yuguruvchi olov dasturini yozing va ikki tomonlama (oldinga-orqaga) harakat qiladigan qilib o'zgartiring.",
   "Sakkizta LED bir vaqtda yonganda umumiy tokni hisoblang va port chegarasi bilan solishtiring.",
   "Ishlayotgan sxema yoki simulyator ekranining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Port bilan ishlash TRIS registrida yo'nalishni belgilashdan boshlanadi, keyin PORT registri orqali qiymat yoziladi yoki o'qiladi. Alohida razryadlarni boshqarish uchun OR, AND va XOR maskalari ishlatiladi — bu usul qolgan razryadlarga tegmaydi. Chiqish toklarining chegaralarini hisobga olish sxemaning ishonchliligini ta'minlaydi."]
 ],
 tests:[
  {q:"TRISB = 0x00 sozlamasi nimani anglatadi?",o:["PORTB butunlay kirish","PORTB butunlay chiqish","PORTB analog rejimda","PORTB o'chirilgan"],a:1,e:"TRIS razryadidagi 0 — chiqish rejimi."},
  {q:"TRISC = 0xF0 bo'lsa qaysi liniyalar kirish?",o:["RC0–RC3","RC4–RC7","Barchasi","Hech qaysi"],a:1,e:"Yuqori tetradadagi birlar RC4–RC7 ni kirish qiladi."},
  {q:"PORTB |= 0x03 amali nima qiladi?",o:["Butun portni 3 qiladi","0 va 1-razryadlarni yoqadi, qolganlariga tegmaydi","Portni nollaydi","Portni o'qiydi"],a:1,e:"OR amali faqat maskadagi bitlarni o'rnatadi."},
  {q:"Razryadni o'chirish uchun qaysi amal ishlatiladi?",o:["OR maska","AND inversiyalangan maska","XOR maska","Siljitish"],a:1,e:"PORTB &= ~maska kerakli bitni tozalaydi."},
  {q:"PORTB ^= 0x10 amali natijasi qanday?",o:["4-razryad 1 bo'ladi","4-razryad 0 bo'ladi","4-razryad holati teskarisiga o'zgaradi","Port o'zgarmaydi"],a:2,e:"XOR amali bitni inversiyalaydi (toggle)."},
  {q:"PORTD & 0x0F ifodasi nimani beradi?",o:["Yuqori tetradani","Quyi tetradani","Butun portni","Nolni"],a:1,e:"0x0F maskasi quyi 4 bitni ajratadi."},
  {q:"PORTD >> 4 amali nima uchun ishlatiladi?",o:["Portni yoqish","Yuqori tetradani quyi holatga ko'chirish","Tokni kamaytirish","Chastotani o'lchash"],a:1,e:"O'ngga 4 razryad siljitish yuqori tetradani quyiga tushiradi."},
  {q:"PIC16F877A da bitta chiqish liniyasining maksimal toki qancha?",o:["5 mA","10 mA","25 mA","100 mA"],a:2,e:"Bitta liniya uchun 25 mA, butun port uchun 100 mA."},
  {q:"Yuguruvchi olovda m <<= 1 sakkiz marta bajarilgach qiymat qanday bo'ladi?",o:["0xFF","0x80","0x00","0x01"],a:2,e:"Barcha bitlar chetga chiqib ketadi, qiymat nolga aylanadi."},
  {q:"PORTA dan ma'lumot o'qish uchun nima majburiy?",o:["Kvartsni almashtirish","ADCON1 bilan raqamli rejimga o'tkazish","Uzilishni yoqish","Taymerni ishga tushirish"],a:1,e:"PORTA ishga tushganda analog rejimda bo'ladi."}
 ]

 body:[
  ["h","Ta'rif va tasnif"],
  ["p","Mikroprotsessor — bitta yarim o'tkazgichli kristallda tayyorlangan, dastur bo'yicha arifmetik va mantiqiy amallarni bajaruvchi hamda tizim ishini boshqaruvchi qurilma. Mikroprotsessor o'z-o'zicha tugallangan qurilma emas: unga tashqi xotira, taktlovchi generator va kiritish-chiqarish tugunlari ulanishi shart."],

   "Universal mikroprotsessorlar — keng doiradagi masalalar uchun (x86, ARM Cortex-A)",

  ]],
  ["h","Yadroning tuzilmasi"],
  ["p","Mikroprotsessor yadrosi uch funksional guruhga bo'linadi: operatsion qism (ALU va registrlar), boshqaruv qismi (buyruq registri, deshifrator, boshqaruv qurilmasi) va interfeys qismi (shina drayverlari, adres shakllantirgich)."],

  ["h","Arifmetik-mantiqiy qurilma"],
  ["p","ALU ikki operand ustida arifmetik (qo'shish, ayirish, inkrement, dekrement), mantiqiy (AND, OR, XOR, NOT) hamda siljitish va aylantirish amallarini bajaradi. Amal turi boshqaruv qurilmasidan keladigan kod bilan tanlanadi. Natija akkumulyatorga yoki ko'rsatilgan registrga yoziladi va shu bilan birga bayroqlar yangilanadi."],
  ["h","Registrlar"],
  ["t",["Registr","Nomi","Vazifasi"],[
   ["A (W)","Akkumulyator","Amalning bir operandi va natijasi"],
   ["R0–R7","Umumiy registrlar","Oraliq qiymatlar, ko'rsatkichlar"],
   ["PC","Komandalar hisoblagichi","Keyingi bajariladigan buyruq adresi"],
   ["SP","Stek ko'rsatkichi","Stek cho'qqisining adresi"],

  ]],
  ["p","PC registri har bir buyruq olingandan keyin avtomatik ortadi. O'tish buyruqlari esa PC ga yangi qiymat yozish orqali dastur oqimini o'zgartiradi — ya'ni o'tish amali aslida PC ni qayta yuklashdir."],
  ["h","Bayroqlar registri"],
  ["ul",[
   "C (Carry) — eng katta razryaddan chiqqan o'tkazma; ishorasiz solishtirish va ko'p baytli qo'shishda ishlatiladi",

  ["p","Shartli o'tish buyruqlari faqat bayroqlarga tayanadi. Ikki sonni solishtirish aslida ayirish amali bo'lib, natija saqlanmaydi, ammo bayroqlar o'rnatiladi va keyingi shartli o'tish shu bayroqlarni tekshiradi."],

 plan:["Kirish liniyasini sozlash","Pull-up rezistor","Drebezg hodisasi","Dasturiy filtr","Holat almashtirish rejimi","Tekshirish"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Kirish rejimiga o'tkazilgan liniya yuqori qarshilikli holatda bo'ladi. Unga hech nima ulanmasa, liniya shovqin ta'sirida tasodifiy qiymat ko'rsatadi. Buning oldini olish uchun tortuvchi rezistor qo'yiladi. PIC16F877A da PORTB liniyalarida ichki pull-up rezistorlar mavjud va ular OPTION_REG registrining RBPU biti bilan yoqiladi."],
  ["fig","btn","1-rasm. Tugmani pull-up rezistor bilan kirish portiga ulash"],
  ["p","Sxemada tugma bosilmagan holatda liniya 10 kΩ rezistor orqali quvvat manbasiga tortilgan va mantiqiy 1 o'qiladi; bosilganda liniya umumiy simga ulanib, mantiqiy 0 beradi. Demak dasturda \"bosilgan\" holat nolga mos keladi."],
  ["n","Xavfsizlik: tugmani rezistorsiz to'g'ridan-to'g'ri quvvat manbasi va umumiy sim orasiga ulash qisqa tutashuv hosil qiladi. Sxemani yig'ishdan oldin tortuvchi rezistor mavjudligini tekshiring."],
  ["h","Kontaktlar titrashi"],
  ["p","Mexanik kontakt ulanish va uzilish paytida bir necha marta sakraydi va 1–10 ms davomida o'nlab noto'g'ri o'tishlar hosil qiladi. Filtrlanmasa, bitta bosish bir necha marta qayd etiladi. Dasturiy filtr eng sodda va arzon yechim: birinchi o'zgarish aniqlangach 15–20 ms kutiladi va holat qayta tekshiriladi."],
  ["h","Ikki ish rejimi"],
  ["c","/* 1-rejim: tugma bosilgan vaqtda LED yonadi */\n#include <xc.h>\n#pragma config FOSC = HS, WDTE = OFF, LVP = OFF\n#define _XTAL_FREQ 8000000UL\n\nvoid main(void)\n{\n    ADCON1 = 0x06;\n    TRISBbits.TRISB0 = 0;      /* LED chiqish   */\n    TRISDbits.TRISD0 = 1;      /* tugma kirish  */\n\n    while (1)\n    {\n        if (PORTDbits.RD0 == 0)   PORTBbits.RB0 = 1;\n        else                      PORTBbits.RB0 = 0;\n    }\n}"],
  ["c","/* 2-rejim: har bosishda LED holati almashadi (toggle) */\n    while (1)\n    {\n        if (PORTDbits.RD0 == 0)          /* bosildi?          */\n        {\n            __delay_ms(20);              /* drebezg filtri    */\n            if (PORTDbits.RD0 == 0)      /* hamon bosilganmi? */\n            {\n                PORTBbits.RB0 = ~PORTBbits.RB0;   /* holatni almashtirish */\n                while (PORTDbits.RD0 == 0);       /* qo'yib yuborishni kutish */\n                __delay_ms(20);\n            }\n        }\n    }"],
  ["p","Ikkinchi rejimda uchta muhim element bor: filtr kechikishi, holatni inversiyalash va tugma qo'yib yuborilishini kutish. Oxirgi qadam bo'lmasa, tugma ushlab turilganda LED uzluksiz miltillaydi."],
  ["h","Assembler varianti"],
  ["c","LOOP:\n      BTFSC  PORTD, 0     ; RD0 = 0 bo'lsa keyingisini tashlab ket\n      GOTO   OCHIQ        ; RD0 = 1 -> tugma bosilmagan\n      BSF    PORTB, 0     ; bosilgan -> LED yonadi\n      GOTO   LOOP\nOCHIQ:\n      BCF    PORTB, 0\n      GOTO   LOOP"],
  ["h","Interaktiv qism"],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Sxemani yig'ing va tugma bosilgan hamda bosilmagan holatlarda liniyadagi kuchlanishni o'lchang.",
   "1-rejim dasturini yozing va ishlashini tekshiring.",
   "Filtrsiz toggle dasturini yozib, bosishlar sonini hisoblang va noto'g'ri hisoblash hodisasini qayd eting.",
   "Filtr qo'shib natijani qayta tekshiring va ikkala holatni jadvalda taqqoslang.",
   "Variant raqamingiz N bo'lsin: tugma bosilganda PORTB ga (0x0F + N) chiqaruvchi dastur yozing.",
   "Ichki pull-up ni OPTION_REG orqali yoqib, tashqi rezistorsiz ishlashini tekshiring.",
   "Sxema yoki simulyator ekranining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Tugmani o'qish kirish liniyasini sozlash va tortuvchi rezistorni ta'minlashdan boshlanadi. Pull-up sxemasida bosilgan holat mantiqiy nolga mos keladi. Kontaktlar titrashi dasturiy kechikish bilan bartaraf etiladi, holatni almashtirish rejimida esa tugma qo'yib yuborilishini kutish majburiy qadam hisoblanadi."]
 ],
 tests:[
  {q:"Pull-up sxemasida tugma bosilganda port qanday qiymat o'qiydi?",o:["1","0","Noaniq","Analog"],a:1,e:"Bosilganda liniya umumiy simga ulanib, 0 beradi."},
  {q:"Kirish liniyasiga hech nima ulanmasa nima yuz beradi?",o:["Doim 0","Doim 1","Holat noaniq, shovqinga bog'liq","Port ishdan chiqadi"],a:2,e:"Osilgan liniya tasodifiy qiymat ko'rsatadi."},
  {q:"PIC16F877A da ichki pull-up qaysi registr orqali yoqiladi?",o:["ADCON1","OPTION_REG (RBPU biti)","STATUS","INTCON"],a:1,e:"RBPU biti PORTB ning ichki pull-up larini boshqaradi."},
  {q:"Ichki pull-up qaysi portda mavjud?",o:["PORTA","PORTB","PORTC","PORTD"],a:1,e:"PIC16F877A da ichki tortuvchi rezistorlar PORTB da bor."},
  {q:"Drebezg necha millisekund davom etadi?",o:["0,1 ms dan kam","1–10 ms","100–500 ms","1 s dan ortiq"],a:1,e:"Mexanik sakrash bir necha millisekund davom etadi."},
  {q:"Dasturiy filtr qanday amalga oshiriladi?",o:["Chastotani oshirish bilan","O'zgarishdan keyin 15–20 ms kutib qayta tekshirish bilan","Portni chiqishga o'tkazish bilan","Uzilishni o'chirish bilan"],a:1,e:"Kechikishdan keyin holat barqarorligi tasdiqlanadi."},
  {q:"Toggle rejimida tugma qo'yib yuborilishini kutish nima uchun kerak?",o:["LED ni saqlash uchun","Tugma ushlab turilganda holat uzluksiz almashmasligi uchun","Tokni kamaytirish uchun","Chastotani o'lchash uchun"],a:1,e:"Aks holda sikl har o'tishda holatni o'zgartiraveradi."},
  {q:"BTFSC PORTD,0 buyrug'i qachon keyingi buyruqni tashlab ketadi?",o:["RD0 = 1 bo'lganda","RD0 = 0 bo'lganda","Har doim","Hech qachon"],a:1,e:"Bit Clear bo'lsa Skip — bit 0 bo'lganda tashlanadi."},
  {q:"PORTBbits.RB0 = ~PORTBbits.RB0; ifodasi nima qiladi?",o:["Bitni 1 qiladi","Bitni 0 qiladi","Bit holatini teskarisiga o'zgartiradi","Portni o'qiydi"],a:2,e:"Inversiya — toggle amali."},
  {q:"Pull-up rezistorning odatiy qiymati qanday?",o:["100 Ω","330 Ω","10 kΩ","10 MΩ"],a:2,e:"Odatda 4,7–10 kΩ oralig'ida tanlanadi."}
 ]
},
{
 id:"S1-M11", sem:1, week:11, type:"lecture", no:11,
 title:"Magistral qurilmalar funksiyalari",
 goal:"Tizimli magistral tugunlarining vazifalarini, uch holatli buferlar va shina boshqaruvi tamoyillarini o'zlashtirish.",
 outcomes:[
  "Magistralga ulangan qurilmalarning funksiyalarini tushuntira oladi",
  "Uch holatli buferning ishlash prinsipini izohlay oladi",
  "Shina egasi (master) va qul (slave) tushunchalarini ajrata oladi",
  "Adres deshifratori vazifasini va hisobini tushuntira oladi"
 ],
 plan:["Magistral tushunchasi","Magistral qurilmalari","Uch holatli buferlar","Adres deshifratori","Shina boshqaruvi va arbitraj","Shina yuklamasi"],
 body:[
  ["h","Magistral tushunchasi"],
  ["p","Tizimli magistral — tizim tugunlarini birlashtiruvchi umumiy o'tkazgichlar to'plami hamda ular bo'yicha almashinuv qoidalari majmuasi. Magistral nafaqat simlar, balki signal darajalari, vaqt diagrammalari va almashinuv protokolini ham o'z ichiga oladi."],
  ["h","Magistralga ulangan qurilmalar"],
  ["t",["Qurilma","Funksiyasi","Magistraldagi roli"],[
   ["Protsessor","Adres shakllantiradi, almashinuvni boshlaydi","Master (shina egasi)"],
   ["Xotira (ROM, RAM)","Ma'lumot saqlaydi va uzatadi","Slave (qul)"],
   ["Kiritish-chiqarish portlari","Tashqi qurilmalar bilan bog'laydi","Slave"],
   ["Adres deshifratori","Adres bo'yicha kerakli qurilmani tanlaydi","Xizmat tuguni"],
   ["Bufer va magistral formirovkalari","Signal quvvatini oshiradi, yo'nalishni boshqaradi","Xizmat tuguni"],
   ["DMA kontroller","Protsessorsiz almashinuvni boshqaradi","Vaqtincha master bo'la oladi"]
  ]],
  ["h","Uch holatli buferlar"],
  ["p","Bitta ma'lumot liniyasiga bir nechta qurilma ulangan. Agar ular bir vaqtda chiqish beruvchi bo'lsa, konflikt yuz beradi va mikrosxemalar ishdan chiqishi mumkin. Shuning uchun magistralga ulanadigan barcha chiqishlar uch holatli bo'ladi: mantiqiy 0, mantiqiy 1 va yuqori qarshilikli (Z) holat. Faqat tanlangan qurilma faol holatga o'tadi, qolganlari Z holatda shinadan uzilgan bo'ladi."],
  ["fig","tri","1-rasm. Uch holatli buferlar orqali qurilmalarni umumiy shinaga ulash"],
  ["n","Agar adres deshifratori xato ishlab, ikkita qurilma bir vaqtda tanlansa, shina konflikti yuz beradi: bittasi 0, ikkinchisi 1 bersa, chiqishlar orqali katta tok oqadi va mikrosxema qiziydi. Loyihalashda bunday holat istisno qilinishi shart."],
  ["h","Adres deshifratori"],
  ["p","Deshifrator adres shinasining yuqori razryadlarini tahlil qilib, qaysi qurilma tanlanishini aniqlaydi va unga CS (Chip Select) signalini beradi. Quyi razryadlar esa tanlangan qurilma ichidagi yacheykani ko'rsatadi."],
  ["f","A_yuqori → CS,  A_quyi → yacheyka","Adres fazosini taqsimlash tamoyili."],
  ["p","Misol. 16 razryadli adres shinasi va har biri 8 K bo'lgan xotira mikrosxemalari ishlatilsin. 8 K = 2^13, demak quyi 13 razryad yacheykani, yuqori 3 razryad esa 8 ta qurilmadan bittasini tanlaydi. Bu 3→8 deshifrator (masalan, 74HC138) bilan amalga oshiriladi."],
  ["h","Shina boshqaruvi va arbitraj"],
  ["p","Magistralda bir vaqtning o'zida faqat bitta master bo'lishi mumkin. Odatiy holatda master — protsessor. DMA kontroller ma'lumot uzatish uchun so'rov (HOLD) yuboradi, protsessor tasdiqlash (HLDA) berib shinani vaqtincha bo'shatadi va o'z chiqishlarini Z holatga o'tkazadi. Bir necha master bo'lgan tizimlarda arbitraj sxemasi navbatni prioritet bo'yicha taqsimlaydi."],
  ["h","Shina yuklamasi"],
  ["p","Har bir ulangan kirish shinaga sig'im va tok yuklamasini beradi. Yuklama ortgan sari signal fronti cho'ziladi va maksimal chastota pasayadi. Shu sababli ko'p qurilma ulanganda magistral buferlari (masalan 74HC245) qo'llanadi: ular signalni qayta tiklaydi va yo'nalishni DIR signali bilan boshqaradi."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Magistral qurilmalari master va slave sifatida ajratiladi: almashinuvni protsessor boshlaydi, xotira va portlar esa unga javob beradi. Umumiy shinaga bir nechta qurilmani ulash uch holatli buferlar hisobiga mumkin bo'ladi, kerakli qurilmani esa adres deshifratori tanlaydi. Shina yuklamasi va konflikt xavfi loyihalashda albatta hisobga olinadi."]
 ],
 tests:[
  {q:"Tizimli magistral nima?",o:["Faqat quvvat simlari","Tugunlarni bog'lovchi o'tkazgichlar va almashinuv qoidalari majmuasi","Xotira turi","Dastur tuzilmasi"],a:1,e:"Magistral — simlar va ular bo'yicha protokolning birgalikdagi nomi."},
  {q:"Uch holatli chiqishning uchinchi holati qaysi?",o:["Manfiy kuchlanish","Yuqori qarshilikli (Z) holat","Analog holat","Uzilish"],a:1,e:"Z holatda chiqish shinadan amalda uzilgan bo'ladi."},
  {q:"Nima uchun magistralga ulangan chiqishlar uch holatli bo'lishi kerak?",o:["Quvvatni tejash uchun","Bir vaqtda bir necha qurilma shinani boshqarib konflikt hosil qilmasligi uchun","Tezlikni oshirish uchun","Adresni qisqartirish uchun"],a:1,e:"Faqat tanlangan qurilma faol bo'ladi, qolganlari Z holatda turadi."},
  {q:"CS (Chip Select) signalini kim shakllantiradi?",o:["Xotira","Adres deshifratori","Taymer","Generator"],a:1,e:"Deshifrator adresning yuqori razryadlariga qarab qurilmani tanlaydi."},
  {q:"8 K hajmli xotira mikrosxemasida yacheykani tanlash uchun necha razryad kerak?",o:["8","10","13","16"],a:2,e:"8 K = 2^13, demak 13 razryad."},
  {q:"16 razryadli adres shinasida 8 K li mikrosxemalar ishlatilsa, nechta qurilmani tanlash mumkin?",o:["4","8","16","32"],a:1,e:"Qolgan 3 razryad 2^3 = 8 ta qurilmani tanlaydi."},
  {q:"Magistralda master kim?",o:["Almashinuvni boshlovchi qurilma","Faqat xotira","Faqat port","Deshifrator"],a:0,e:"Master adres qo'yadi va siklni boshlaydi; odatda bu protsessor."},
  {q:"DMA kontroller shinani egallashi uchun qanday signal almashinuvi bo'ladi?",o:["RD/WR","HOLD va HLDA","CS va OE","TX va RX"],a:1,e:"So'rov HOLD, tasdiqlash HLDA orqali beriladi."},
  {q:"Shina konflikti nima?",o:["Ikki qurilma bir vaqtda shinaga qarama-qarshi daraja berishi","Dastur xatosi","Xotira to'lishi","Uzilish kechikishi"],a:0,e:"Bu holat katta tokka va mikrosxemaning shikastlanishiga olib keladi."},
  {q:"74HC245 kabi magistral buferi nima uchun qo'yiladi?",o:["Xotirani kengaytirish uchun","Signalni qayta tiklash va yo'nalishni boshqarish uchun","Chastotani oshirish uchun","Uzilish yaratish uchun"],a:1,e:"Bufer yuklamani kamaytiradi va uzatish yo'nalishini DIR bilan belgilaydi."}
 ]
},
{
 id:"S1-A11", sem:1, week:11, type:"practice", no:11,
 title:"PIC mikrokontrolleri uchun bir nechta knopka bilan LEDlarni boshqaruvchi dastur tuzish",
 goal:"Bir nechta kirish signalini birgalikda tahlil qilish, prioritet va kombinatsiyalarni qayta ishlash dasturini tuzishni o'zlashtirish.",
 equip:["PIC o'quv stendi yoki Proteus","Tugmalar 4 dona","Rezistorlar 10 kΩ (4 dona), 330 Ω (8 dona)","LED 8 dona","Ulash simlari","Darslikning port va tugma simulyatorlari"],
 plan:["Bir nechta kirishni o'qish","Portni bir butun sifatida tahlil qilish","Prioritetli ishlov","Kombinatsiyalarni aniqlash","Matritsa usuli","Tekshirish"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Bir nechta tugma bilan ishlashda ikki yondashuv mavjud. Birinchisi — har bir tugmani alohida tekshirish; bu sodda, lekin tugmalar soni ortganda kod uzayadi. Ikkinchisi — portni bir butun bayt sifatida o'qib, maskalash orqali kombinatsiyani aniqlash; bu usul ixcham va tez."],
  ["p","Pull-up sxemasida bosilmagan tugmalar 1 beradi, shuning uchun o'qilgan qiymat inversiyalanadi — shunda bosilgan tugmalar mantiqiy bir bilan belgilanadi va kod o'qilishi osonlashadi."],
  ["c","    uint8_t k;\n    k = ~PORTD & 0x0F;   /* faqat RD0..RD3, bosilganlar = 1 */\n\n    switch (k)\n    {\n        case 0x01: PORTB = 0x0F; break;   /* 1-tugma          */\n        case 0x02: PORTB = 0xF0; break;   /* 2-tugma          */\n        case 0x03: PORTB = 0xFF; break;   /* 1 va 2 birgalikda */\n        case 0x04: PORTB = 0xAA; break;   /* 3-tugma          */\n        case 0x08: PORTB = 0x55; break;   /* 4-tugma          */\n        default:   PORTB = 0x00; break;   /* hech biri        */\n    }"],
  ["h","Prioritetli ishlov"],
  ["p","Agar bir vaqtda bir nechta tugma bosilishi mumkin bo'lsa va faqat bittasi hisobga olinishi kerak bo'lsa, prioritet tartibi belgilanadi. Quyidagi kodda pastki raqamli tugma yuqori prioritetga ega: birinchi mos kelgan shart bajarilgach qolganlari tekshirilmaydi."],
  ["c","    if      (!PORTDbits.RD0) PORTB = 0x01;   /* eng yuqori prioritet */\n    else if (!PORTDbits.RD1) PORTB = 0x02;\n    else if (!PORTDbits.RD2) PORTB = 0x04;\n    else if (!PORTDbits.RD3) PORTB = 0x08;\n    else                     PORTB = 0x00;"],
  ["h","Uch tugmali boshqaruv namunasi"],
  ["t",["Tugma","Vazifasi","Amal"],[
   ["RD0 — START","Yuguruvchi olovni ishga tushirish","bayroq = 1"],
   ["RD1 — STOP","To'xtatish va joriy holatni saqlash","bayroq = 0"],
   ["RD2 — RESET","Boshlang'ich holatga qaytish","maska = 0x01, PORTB = 0"],
   ["RD0 + RD1","Yo'nalishni almashtirish","yonalish = ~yonalish"]
  ]],
  ["c","    uint8_t m = 0x01, ishla = 0, yonalish = 0;\n\n    while (1)\n    {\n        uint8_t k = ~PORTD & 0x07;\n        if (k) { __delay_ms(20); k = ~PORTD & 0x07; }   /* drebezg filtri */\n\n        if      (k == 0x03) { yonalish = !yonalish; while(~PORTD & 0x07); }\n        else if (k == 0x01)   ishla = 1;\n        else if (k == 0x02)   ishla = 0;\n        else if (k == 0x04) { m = 0x01; PORTB = 0; }\n\n        if (ishla)\n        {\n            PORTB = m;\n            if (yonalish) { m <<= 1; if (!m) m = 0x01; }\n            else          { m >>= 1; if (!m) m = 0x80; }\n            __delay_ms(150);\n        }\n    }"],
  ["h","Klaviatura matritsasi haqida"],
  ["p","Tugmalar soni ko'p bo'lganda har biriga alohida liniya ajratish isrof bo'ladi. Matritsa usulida 16 ta tugma atigi 8 ta liniyaga (4 satr + 4 ustun) ulanadi: satrlarga navbat bilan nol beriladi va ustunlar o'qiladi, nol qaytgan ustun bosilgan tugmani ko'rsatadi. Bu usul keyingi semestrdagi klaviatura ishida batafsil o'rganiladi."],
  ["n","Bir vaqtda ikkita tugma bosilganda matritsada \"soyabon\" (ghosting) effekti paydo bo'ladi: bosilmagan tugma ham bosilgandek ko'rinadi. Buning oldini olish uchun har bir tugmaga ketma-ket diod qo'yiladi."],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",[
   "To'rtta tugma va sakkizta LED dan iborat sxemani yig'ing.",
   "Har bir tugmaga alohida LED kombinatsiyasini biriktiruvchi dastur yozing va jadval tuzing.",
   "Variant raqamingiz N bo'lsin: RD0 bosilganda PORTB = (0x11 · N) mod 256 qiymatini chiqaring.",
   "Prioritetli ishlov dasturini yozing va bir vaqtda ikki tugma bosilgandagi natijani izohlang.",
   "START/STOP/RESET boshqaruvli yuguruvchi olov dasturini amalga oshiring.",
   "Ikki tugma birgalikda bosilganda alohida amal bajariladigan qismni qo'shing.",
   "Ishlayotgan sxema yoki simulyator rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Bir nechta kirishni portni bir butun sifatida o'qib, maskalash orqali tahlil qilish eng ixcham yechim hisoblanadi. Pull-up sxemasida o'qilgan qiymatni inversiyalash kodni ancha tushunarli qiladi. Bir vaqtda bosilgan tugmalar alohida kombinatsiya sifatida qayta ishlanishi yoki prioritet tartibida hal qilinishi mumkin — tanlov masalaning talabiga bog'liq."]
 ],
 tests:[
  {q:"~PORTD & 0x0F ifodasi nima beradi?",o:["Butun portni","RD0–RD3 tugmalaridan bosilganlarini 1 bilan belgilaydi","Yuqori tetradani","Nolni"],a:1,e:"Inversiya bosilgan tugmani 1 qiladi, maska esa quyi to'rt bitni ajratadi."},
  {q:"Pull-up sxemasida o'qilgan qiymat nima uchun inversiyalanadi?",o:["Tezlik uchun","Bosilgan tugma mantiqiy bir bilan belgilanishi va kod o'qilishi oson bo'lishi uchun","Tokni kamaytirish uchun","Xotira tejash uchun"],a:1,e:"Bosilgan holat 0 bo'lgani uchun inversiya mantiqni tabiiylashtiradi."},
  {q:"switch (k) tuzilmasida k = 0x03 qiymati nimani anglatadi?",o:["3-tugma bosilgan","1- va 2-tugmalar birgalikda bosilgan","Hech biri","Xato"],a:1,e:"0x03 = 0b0011, ya'ni ikkita quyi bit birga."},
  {q:"Prioritetli ishlovda else if zanjiri nima beradi?",o:["Barcha shartlar tekshiriladi","Birinchi mos kelgan shart bajarilgach qolganlari tekshirilmaydi","Kod sekinlashadi","Bayroqlar tozalanadi"],a:1,e:"Shu tarzda yuqori prioritetli tugma ustunlik oladi."},
  {q:"m <<= 1 amalidan keyin m nolga aylansa nima qilinadi?",o:["Dastur to'xtatiladi","m qayta 0x01 ga o'rnatiladi","Port o'chiriladi","Uzilish chaqiriladi"],a:1,e:"Yuguruvchi olov boshidan takrorlanadi."},
  {q:"while(~PORTD & 0x07); operatori nima qiladi?",o:["Tugmalar qo'yib yuborilishini kutadi","LED ni yoqadi","Portni tozalaydi","Kechikish beradi"],a:0,e:"Barcha tugmalar qo'yib yuborilguncha sikl davom etadi."},
  {q:"16 ta tugmani matritsa usulida ulash uchun necha liniya kerak?",o:["4","8","12","16"],a:1,e:"4 satr + 4 ustun = 8 liniya."},
  {q:"Matritsani skanerlashda satrlarga nima beriladi?",o:["Navbat bilan nol","Doim bir","Analog kuchlanish","Hech nima"],a:0,e:"Faol satrga nol berilib, ustunlar o'qiladi."},
  {q:"Matritsadagi ghosting (soyabon) effekti nima?",o:["LED xira yonishi","Bir vaqtda bir nechta tugma bosilganda bosilmagan tugma ham bosilgandek ko'rinishi","Port qizishi","Kechikish"],a:1,e:"Buning oldini olish uchun tugmalarga diod qo'yiladi."},
  {q:"Har bir tugmani alohida tekshirish usulining kamchiligi nima?",o:["Ishlamaydi","Tugmalar soni ortganda kod uzayadi va sekinlashadi","Bayroqlarni buzadi","Xotira talab qilmaydi"],a:1,e:"Ixchamroq yechim portni bayt sifatida tahlil qilishdir."}
 ]
},
{

 title:"Operandlarni adreslash. Adreslash usullari",
 goal:"Buyruqlar tizimining tuzilishini, buyruq formatini va operandlarni adreslash usullarini o'zlashtirish.",
 outcomes:[
  "Buyruq formatining tarkibiy qismlarini ajrata oladi",
  "Operand turlarini va ularning joylashishini tushuntira oladi",
  "Asosiy adreslash usullarini misollar bilan farqlay oladi",

 ],
 plan:["Buyruqlar tizimi tushunchasi","Buyruq formati","Operand turlari","Adreslash usullari","PIC16 da adreslash","Adreslashning unumdorlikka ta'siri"],
 body:[
  ["h","Buyruqlar tizimi"],
  ["p","Buyruqlar tizimi (komandalar tizimi) — mikroprotsessor bajara oladigan barcha buyruqlarning to'liq to'plami hamda ularning kodlanish qoidalari. Buyruqlar tizimi protsessor arxitekturasining eng muhim tavsifi bo'lib, aynan u dasturchi uchun mashinaning imkoniyatlarini belgilaydi."],
  ["p","Har bir buyruq ikki qismdan iborat: operatsiya kodi (COP — nima qilish kerak) va operandlar (nima ustida qilish kerak). Operandlar buyruq ichida bevosita berilishi, registrda yoki xotirada joylashishi mumkin."],
  ["h","Buyruq formati"],
  ["fig","fmt","1-rasm. PIC16 buyruq formatlari va ularning maydonlari"],
  ["t",["Format","Razryadlar taqsimoti","Namuna"],[
   ["Bayt bilan ishlash","6 bit COP + 1 bit d + 7 bit f","ADDWF f,d"],
   ["Bit bilan ishlash","4 bit COP + 3 bit b + 7 bit f","BSF f,b"],
   ["Konstanta bilan ishlash","6 bit COP + 8 bit k","MOVLW k"],
   ["O'tish buyruqlari","3 bit COP + 11 bit adres","GOTO adres"]
  ]],
  ["p","PIC16 da buyruq so'zi 14 razryadli. Bayt formatidagi f maydoni 7 razryadli bo'lgani uchun bevosita 128 ta yacheykani adreslaydi; qolgan xotira banklar orqali, STATUS registrining RP0 va RP1 bitlari bilan tanlanadi."],
  ["h","Operand turlari"],
  ["ul",[
   "Bevosita operand (immediate, konstanta) — qiymat buyruq kodining ichida: MOVLW 0x25",
   "Registr operandi — qiymat W registrda yoki fayl registrida: ADDWF 0x20,1",
   "Xotira operandi — qiymat ma'lumot xotirasining yacheykasida",
   "Bilvosita operand — qiymat adresi boshqa registrda saqlanadi: INDF va FSR juftligi",
   "Bit operandi — yacheykaning alohida razryadi: BSF PORTB,3"
  ]],
  ["h","Adreslash usullari"],
  ["t",["Usul","Mohiyati","PIC16 dagi namuna"],[
   ["Bevosita (immediate)","Operand buyruq kodida","MOVLW 0x0F"],
   ["To'g'ri (direct)","Buyruqda yacheyka adresi ko'rsatilgan","MOVWF 0x20"],
   ["Bilvosita (indirect)","Adres FSR registrida, murojaat INDF orqali","MOVWF INDF"],
   ["Registr","Operand W registrda","ADDWF f,0"],
   ["Nisbiy","Adres joriy PC ga nisbatan beriladi","boshqa oilalarda keng qo'llanadi"],
   ["Bit adreslash","Yacheyka va razryad raqami","BCF STATUS,RP0"]
  ]],
  ["c","; Bilvosita adreslash: 0x20 dan 0x2F gacha yacheykalarni nollash\n      MOVLW  0x20\n      MOVWF  FSR        ; FSR <- boshlang'ich adres\nCLEAR:\n      CLRF   INDF       ; FSR ko'rsatgan yacheyka nollanadi\n      INCF   FSR, 1     ; keyingi adresga o'tish\n      MOVLW  0x30\n      SUBWF  FSR, 0     ; FSR 0x30 ga yetdimi?\n      BTFSS  STATUS, Z\n      GOTO   CLEAR\n      RETURN"],
  ["p","Bilvosita adreslash massivlar va buferlar bilan ishlashda majburiy: adresni dastur davomida o'zgartirish faqat shu usulda mumkin. To'g'ri adreslashda esa adres buyruq kodiga qotirib qo'yilgan bo'ladi va ish vaqtida o'zgarmaydi."],
  ["h","Adreslashning unumdorlikka ta'siri"],
  ["p","Bevosita va registr adreslash eng tez, chunki qo'shimcha xotira murojaati talab qilmaydi. Bilvosita adreslash qo'shimcha qadamlar (FSR ni yuklash va oshirish) hisobiga sekinroq, ammo moslashuvchan. Shuning uchun tez ishlashi kerak bo'lgan sikl tanasida imkon qadar registr operandlaridan foydalaniladi."],
  ["n","Bank tanlashni unutish — PIC dagi eng ko'p uchraydigan xato. TRISB registri 1-bankda, PORTB esa 0-bankda joylashgan; bank noto'g'ri bo'lsa dastur mutlaqo boshqa registrni o'zgartiradi."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Buyruq operatsiya kodi va operandlardan tashkil topadi; buyruq formati esa bu maydonlarning razryadlar bo'yicha taqsimotini belgilaydi. Operand bevosita buyruqda, registrda yoki xotirada joylashishi mumkin va unga murojaat usuli adreslash usuli deb ataladi. PIC16 da bevosita, to'g'ri, bilvosita va bit adreslash qo'llanadi; bilvosita usul massivlar bilan ishlashning yagona vositasi hisoblanadi."]
 ],
 tests:[

  {q:"Buyruq qanday ikki qismdan iborat?",o:["Adres va ma'lumot","Operatsiya kodi va operandlar","Kirish va chiqish","Bayroq va registr"],a:1,e:"COP nima qilishni, operandlar nima ustida qilishni ko'rsatadi."},

  {q:"Bilvosita adreslashda operand adresi qayerda saqlanadi?",o:["Buyruq kodida","FSR registrida","STATUS da","PC da"],a:1,e:"FSR adresni saqlaydi, murojaat INDF orqali bajariladi."},

  {q:"ADDWF f,d buyruqidagi d maydoni nimani belgilaydi?",o:["Adresni","Natija qayerga yozilishini","Bayroqlarni","Buyruq uzunligini"],a:1,e:"d=0 — natija W ga, d=1 — fayl registriga yoziladi."},
  {q:"PIC16 da f maydoni 7 razryadli bo'lgani uchun nima kerak bo'ladi?",o:["Kvarts","Banklarni tanlash (RP0, RP1)","Uzilish","DMA"],a:1,e:"128 dan ortiq yacheykaga murojaat bank tanlash orqali bajariladi."},
  {q:"Qaysi adreslash usuli eng tez bajariladi?",o:["Bilvosita","Bevosita va registr adreslash","Nisbiy","Indeksli"],a:1,e:"Qo'shimcha xotira murojaati bo'lmagani uchun."}

{
 id:"S1-A12", sem:1, week:12, type:"practice", no:12,
 title:"PIC mikrokontrolleri uchun LCD ekranga dastur tuzish",
 goal:"HD44780 boshqaruvchili simvolli LCD indikatorni ulash, boshlang'ich sozlash va unga matn hamda son chiqarishni o'zlashtirish.",
 equip:["PIC o'quv stendi yoki Proteus","LCD 16×2 (HD44780 mos)","O'zgaruvchan rezistor 10 kΩ (kontrast uchun)","Rezistor 220 Ω (yorug'lik uchun)","Ulash simlari","Darslikning LCD simulyatori"],
 plan:["LCD tuzilishi","Ulash sxemasi","Buyruqlar va ma'lumot rejimlari","Boshlang'ich sozlash","Matn chiqarish","Sonni matnga aylantirish"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Simvolli LCD indikator HD44780 boshqaruvchisi asosida ishlaydi. Uning ichida uchta xotira sohasi bor: DDRAM — ekranda ko'rinadigan belgilar, CGROM — tayyor belgilar shakllari, CGRAM — foydalanuvchi yaratgan sakkiztagacha belgi. Boshqaruvchi mikrokontrollerdan buyruq yoki ma'lumot baytini qabul qiladi."],
  ["fig","lcdwire","1-rasm. LCD indikatorni 4 bitli rejimda mikrokontrollerga ulash"],
  ["t",["Liniya","Vazifasi"],[
   ["RS","0 — buyruq rejimi, 1 — ma'lumot (belgi) rejimi"],
   ["RW","0 — yozish, 1 — o'qish; odatda umumiy simga ulanadi"],
   ["E","Ma'lumotni qabul qilish strobi: yuqoridan pastga fronti bo'yicha yoziladi"],
   ["D4–D7","4 bitli rejimda ma'lumot liniyalari"],
   ["VO","Kontrast; 10 kΩ o'zgaruvchan rezistor orqali sozlanadi"],
   ["A, K","Orqa yorug'lik anodi va katodi, 220 Ω rezistor orqali"]
  ]],
  ["p","4 bitli rejimda har bir bayt ikki qismga bo'lib uzatiladi: avval yuqori tetrada, so'ng quyi tetrada. Bu usul to'rtta liniyani tejaydi va amalda ustun hisoblanadi."],
  ["h","Asosiy buyruqlar"],
  ["t",["Kod","Buyruq","Bajarilish vaqti"],[
   ["0x01","Ekranni tozalash va kursorni boshga qaytarish","~1,6 ms"],
   ["0x02","Kursorni boshga qaytarish","~1,6 ms"],
   ["0x06","Yozishdan keyin kursor o'ngga suriladi","40 µs"],
   ["0x0C","Ekran yoqiladi, kursor ko'rinmaydi","40 µs"],
   ["0x0E","Ekran va kursor yoqiladi","40 µs"],
   ["0x28","4 bitli rejim, 2 qator, 5×8 shrift","40 µs"],
   ["0x80","Kursorni 1-qator boshiga qo'yish","40 µs"],
   ["0xC0","Kursorni 2-qator boshiga qo'yish","40 µs"]
  ]],
  ["n","Diqqat: 0x01 va 0x02 buyruqlari boshqa buyruqlardan ancha uzoq bajariladi. Ular berilgandan keyin kamida 2 ms kutilmasa, keyingi buyruq yo'qoladi va ekranda buzilgan belgilar paydo bo'ladi."],
  ["h","Boshlang'ich sozlash va chiqarish"],
  ["c","#include <xc.h>\n#define _XTAL_FREQ 8000000UL\n#define RS  PORTDbits.RD2\n#define EN  PORTDbits.RD3\n\nvoid lcd_nibble(uint8_t n)\n{\n    PORTD = (PORTD & 0x0F) | (n & 0xF0);  /* D4-D7 -> RD4..RD7 */\n    EN = 1; __delay_us(2); EN = 0; __delay_us(50);\n}\nvoid lcd_cmd(uint8_t c)\n{\n    RS = 0;\n    lcd_nibble(c & 0xF0);\n    lcd_nibble((uint8_t)(c << 4));\n    if (c == 0x01 || c == 0x02) __delay_ms(2);\n}\nvoid lcd_data(uint8_t d)\n{\n    RS = 1;\n    lcd_nibble(d & 0xF0);\n    lcd_nibble((uint8_t)(d << 4));\n}\nvoid lcd_init(void)\n{\n    __delay_ms(20);       /* quvvat berilgandan keyin kutish */\n    lcd_nibble(0x30); __delay_ms(5);\n    lcd_nibble(0x30); __delay_us(200);\n    lcd_nibble(0x30); __delay_us(200);\n    lcd_nibble(0x20);     /* 4 bitli rejimga o'tish */\n    lcd_cmd(0x28); lcd_cmd(0x0C); lcd_cmd(0x06); lcd_cmd(0x01);\n}\nvoid lcd_text(const char *s)\n{\n    while (*s) lcd_data((uint8_t)*s++);\n}"],
  ["c","void main(void)\n{\n    ADCON1 = 0x06;\n    TRISD  = 0x00;\n    lcd_init();\n\n    lcd_cmd(0x80);  lcd_text(\"MIKROPROTSESSOR\");\n    lcd_cmd(0xC0);  lcd_text(\"TEXNIKASI  TDTU\");\n\n    while (1) { }\n}"],
  ["h","Sonni ekranga chiqarish"],
  ["p","LCD faqat belgilarni ko'rsatadi, shuning uchun sonni avval raqamlarga ajratib, har biriga 0x30 qo'shish kerak — shunda ASCII kodi hosil bo'ladi."],
  ["c","void lcd_son(uint16_t n)          /* 0..999 */\n{\n    lcd_data((uint8_t)(n / 100)       + '0');\n    lcd_data((uint8_t)((n / 10) % 10) + '0');\n    lcd_data((uint8_t)(n % 10)        + '0');\n}"],
  ["h","Interaktiv qism"],
  ["sim","lcd"],
  ["h","Topshiriqlar"],
  ["ol",[
   "LCD ni 4 bitli rejimda ulang, kontrastni o'zgaruvchan rezistor bilan sozlang.",
   "Birinchi qatorga ism-familiyangizni, ikkinchi qatorga guruhingizni chiqaruvchi dastur yozing.",
   "Variant raqamingiz N bo'lsin: ekranga (100 + N) sonini lcd_son funksiyasi bilan chiqaring.",
   "Ekranni tozalash buyrug'idan keyingi kechikishni olib tashlab, natijani kuzating va izohlang.",
   "Har sekundda birga oshib boradigan hisoblagichni ekranda ko'rsating.",
   "0x0E buyrug'i bilan kursorni yoqib, 0x0C bilan o'chirib, farqni tavsiflang.",
   "Ishlayotgan indikator yoki simulyator ekranining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","HD44780 mos LCD indikator RS, E va to'rtta ma'lumot liniyasi orqali boshqariladi. Boshlang'ich sozlash qat'iy belgilangan ketma-ketlikni va kechikishlarni talab qiladi — ular buzilsa indikator ishga tushmaydi. Matn DDRAM ga belgilar kodini yozish orqali chiqariladi, sonlar esa avval ASCII belgilariga aylantiriladi."]
 ],
 tests:[
  {q:"HD44780 da DDRAM nima uchun xizmat qiladi?",o:["Belgilar shakllarini saqlash","Ekranda ko'rinadigan belgilar kodlarini saqlash","Buyruqlarni saqlash","Kontrastni sozlash"],a:1,e:"DDRAM — ekran xotirasi."},
  {q:"RS liniyasi 0 bo'lganda uzatilgan bayt nima sifatida qabul qilinadi?",o:["Belgi","Buyruq","Adres","Kontrast"],a:1,e:"RS = 0 — buyruq rejimi."},
  {q:"E liniyasining vazifasi nima?",o:["Quvvat berish","Ma'lumotni qabul qilish strobi","Kontrast sozlash","Yorug'lik yoqish"],a:1,e:"E ning fronti bo'yicha bayt indikatorga yoziladi."},
  {q:"4 bitli rejimda bitta bayt qanday uzatiladi?",o:["Bir marta to'liq","Avval yuqori tetrada, so'ng quyi tetrada","Faqat quyi tetrada","Bit-bit"],a:1,e:"Bayt ikki qismga bo'lib uzatiladi."},
  {q:"0x01 buyrug'i nima qiladi?",o:["Ekranni tozalaydi","Kursorni o'chiradi","2-qatorga o'tadi","Rejimni o'zgartiradi"],a:0,e:"Clear display; bajarilishi ~1,6 ms davom etadi."},
  {q:"0x01 buyrug'idan keyin nima uchun kechikish kerak?",o:["Quvvat barqarorlashishi uchun","Buyruq uzoq bajarilgani uchun keyingisi yo'qolmasligi uchun","Kontrast uchun","Kursor uchun"],a:1,e:"Kutilmasa keyingi buyruq qabul qilinmaydi."},
  {q:"0xC0 buyrug'i nimani bildiradi?",o:["Ekranni o'chirish","Kursorni 2-qator boshiga qo'yish","Tozalash","4 bitli rejim"],a:1,e:"Ikkinchi qator DDRAM adresi 0x40, buyruq 0x80 + 0x40 = 0xC0."},
  {q:"Kontrast qanday sozlanadi?",o:["Dastur orqali","VO liniyasiga ulangan o'zgaruvchan rezistor bilan","E liniyasi bilan","RW liniyasi bilan"],a:1,e:"10 kΩ potensiometr VO kuchlanishini o'zgartiradi."},
  {q:"Raqamni ekranga chiqarish uchun unga nima qo'shiladi?",o:["0x10","0x30","0x41","0xFF"],a:1,e:"ASCII da '0' belgisi 0x30 kodiga ega."},
  {q:"RW liniyasi odatda qayerga ulanadi?",o:["+5 V ga","Umumiy simga (GND)","Kontrastga","Ochiq qoldiriladi"],a:1,e:"Faqat yozish ishlatilgani uchun RW = 0 qilinadi."}
 ]

  ]],
  ["h","Portlar"],
  ["p","PIC16F877A da beshta port bor: PORTA (6 liniya), PORTB (8), PORTC (8), PORTD (8), PORTE (3). Har bir portga ikkita registr biriktirilgan: TRISx — yo'nalish registri (1 — kirish, 0 — chiqish) va PORTx — ma'lumot registri. Aksariyat liniyalar ko'p vazifali: masalan PORTA razryadlari ADC kirishlari sifatida, PORTC razryadlari esa USART va SPI liniyalari sifatida ham ishlatiladi."],
  ["n","Muhim: PORTA va PORTE liniyalari ishga tushganda analog rejimda bo'ladi. Ularni raqamli kirish sifatida ishlatish uchun ADCON1 registrida mos konfiguratsiya o'rnatilishi kerak, aks holda o'qilgan qiymat har doim nol bo'ladi."],
  ["c","/* Portlarni sozlash namunasi */\n    ADCON1 = 0x06;   /* PORTA butunlay raqamli rejimga o'tkaziladi */\n    TRISB  = 0x00;   /* PORTB — chiqish (LED)   */\n    TRISD  = 0xFF;   /* PORTD — kirish (tugmalar) */\n    PORTB  = 0x00;   /* boshlang'ich holat */"],
  ["h","Tanlash mezonlari"],
  ["ol",[
   "Kerakli kiritish-chiqarish liniyalari soni va turi",
   "Zarur periferiya: ADC razryadliligi, taymerlar soni, interfeyslar",
   "Dastur va ma'lumot xotirasi hajmi",
   "Unumdorlik: takt chastotasi va mashina sikli",
   "Quvvat manbai kuchlanishi va iste'mol toki",
   "Korpus turi, narxi, bozorda mavjudligi va hujjatlar sifati"
  ]],
  ["h","Interaktiv model"],
  ["p","Port registri simulyatorida TRIS va PORT registrlari orasidagi bog'liqlikni tushunish uchun razryadlarni alohida o'zgartiring."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Mikrokontroller yadro, xotira va periferiyani bitta kristallda birlashtiradi va shu sababli boshqaruv masalalari uchun asosiy elementga aylangan. PIC16F877A o'quv maqsadlari uchun qulay: 8 K dastur xotirasi, 33 ta liniya, uchta taymer, 10 razryadli ADC va ketma-ket interfeyslarga ega. Har bir portning yo'nalishi TRIS registri bilan, holati esa PORT registri bilan belgilanadi."]
 ],

 ]

{
 id:"S1-A13", sem:1, week:13, type:"practice", no:13,
 title:"PIC mikrokontrollerida ADCni loyihalash",
 goal:"O'rnatilgan analog-raqamli o'zgartirgichni sozlash, o'lchash natijasini o'qish va kuchlanishga aylantirishni o'zlashtirish.",
 equip:["PIC o'quv stendi yoki Proteus","O'zgaruvchan rezistor 10 kΩ","LCD 16×2 yoki 8 ta LED","Multimetr","Darslikning ADC simulyatori"],
 plan:["ADC tuzilishi","Registrlarni sozlash","O'zgartirish takti","O'lchash tartibi","Natijani hisoblash","Aniqlikni oshirish"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PIC16F877A da 10 razryadli ketma-ket yaqinlashuvchi ADC o'rnatilgan. U 8 ta kanalga ega va kanal multipleksor orqali tanlanadi. O'zgartirish natijasi 10 bit bo'lgani uchun ikkita registrda saqlanadi: ADRESH va ADRESL."],
  ["f","N = U_kirish / U_ref · (2^n − 1)","10 razryad va Uref = 5 V uchun: U = 2,5 V → N = 511."],
  ["f","U = N · U_ref / (2^n − 1)","Teskari hisob: kod 512 bo'lsa U ≈ 2,503 V."],
  ["f","q = U_ref / (2^n − 1)","Kvantlash qadami: 5 V / 1023 ≈ 4,88 mV."],
  ["h","Sozlash registrlari"],
  ["t",["Registr","Maydon","Vazifasi"],[
   ["ADCON0","ADCS1:ADCS0","O'zgartirish taktining bo'luvchisi"],
   ["ADCON0","CHS2:CHS0","Kanal tanlash (AN0–AN7)"],
   ["ADCON0","GO/DONE","1 yozilsa o'zgartirish boshlanadi, tugagach 0 bo'ladi"],
   ["ADCON0","ADON","ADC modulini yoqish"],
   ["ADCON1","PCFG3:PCFG0","Qaysi liniyalar analog, qaysilari raqamli"],
   ["ADCON1","ADFM","Natijani tekislash: 1 — o'ngga, 0 — chapga"]
  ]],
  ["p","O'zgartirish takti TAD 1,6 µs dan kichik bo'lmasligi kerak. f = 8 MHz da FOSC/16 bo'luvchisi TAD = 2 µs beradi — bu talabga javob beradi. To'liq o'zgartirish 12 TAD, ya'ni taxminan 24 µs davom etadi."],
  ["n","Kanal almashtirilgandan keyin darhol o'zgartirishni boshlash mumkin emas: ichki namuna-saqlash kondensatori zaryadlanishi uchun kamida 20 µs kutish (acquisition time) talab qilinadi. Bu qadam tashlab ketilsa, natija oldingi kanal qiymatiga aralashadi."],
  ["h","Dastur"],
  ["c","#include <xc.h>\n#pragma config FOSC = HS, WDTE = OFF, LVP = OFF\n#define _XTAL_FREQ 8000000UL\n\nvoid adc_init(void)\n{\n    ADCON1 = 0x80;    /* ADFM = 1 (o'ngga tekislash), AN0 analog, VREF = VDD */\n    ADCON0 = 0x41;    /* FOSC/16, kanal 0, ADON = 1 */\n    TRISAbits.TRISA0 = 1;\n}\n\nuint16_t adc_read(uint8_t kanal)\n{\n    ADCON0 &= 0xC5;                 /* eski kanalni tozalash */\n    ADCON0 |= (uint8_t)(kanal << 3);/* yangi kanalni tanlash */\n    __delay_us(30);                 /* namuna olish vaqti   */\n    GO_nDONE = 1;                   /* o'zgartirishni boshlash */\n    while (GO_nDONE);               /* tugashini kutish     */\n    return (uint16_t)((ADRESH << 8) | ADRESL);\n}\n\nvoid main(void)\n{\n    uint16_t kod;\n    uint16_t mv;\n\n    adc_init();\n    TRISB = 0x00;\n\n    while (1)\n    {\n        kod = adc_read(0);\n        mv  = (uint16_t)((uint32_t)kod * 5000UL / 1023UL);  /* millivoltda */\n        PORTB = (uint8_t)(kod >> 2);   /* 10 bitdan 8 bitni LEDlarga */\n        __delay_ms(200);\n    }\n}"],
  ["p","Kodda kuchlanish millivoltda hisoblanadi, chunki mikrokontrollerda kasr sonlar bilan ishlash ko'p resurs talab qiladi. 32 razryadli oraliq turga keltirish esa ko'paytirishda to'lib ketishning oldini oladi."],
  ["h","Aniqlikni oshirish usullari"],
  ["ol",[
   "Kirishga RC filtr qo'yish (masalan 1 kΩ va 0,1 µF) — yuqori chastotali shovqinni yutadi",
   "Bir necha o'lchashning o'rtachasini olish: 8 yoki 16 marta o'lchab, yig'indini siljitish bilan bo'lish",
   "VREF+ sifatida aniq tashqi kuchlanish manbaidan foydalanish",
   "Analog va raqamli umumiy simlarni bitta nuqtada birlashtirish",
   "Datchik chiqishi yuqori qarshilikli bo'lsa, operatsion kuchaytirgichli bufer qo'yish"
  ]],
  ["c","uint16_t adc_ortacha(uint8_t kanal)\n{\n    uint32_t s = 0;\n    for (uint8_t i = 0; i < 8; i++) { s += adc_read(kanal); __delay_us(50); }\n    return (uint16_t)(s >> 3);     /* 8 ga bo'lish */\n}"],
  ["sim","adc"],
  ["h","Topshiriqlar"],
  ["ol",[
   "O'zgaruvchan rezistorni AN0 kanaliga ulang va ADC ni sozlang.",
   "Rezistorni 0 dan maksimumgacha burib, kod va multimetr ko'rsatkichini jadvalga yozing (kamida 6 nuqta).",
   "Variant raqamingiz N bo'lsin: kirish kuchlanishi (1 + N/10) V bo'lganda kutilayotgan kodni hisoblang va tajriba bilan solishtiring.",
   "Kvantlash qadamini hisoblang va o'lchash xatosini baholang.",
   "8 martalik o'rtachalash funksiyasini qo'shib, natijaning barqarorlashuvini kuzating.",
   "Natijani LCD ga voltda chiqaruvchi kod qismini yozing.",
   "O'lchash jadvali yoki ekran rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","ADC ni ishlatish uchun ADCON1 bilan analog liniyalarni, ADCON0 bilan taktni va kanalni sozlash, so'ng GO/DONE bitini o'rnatish kerak. Kanal almashtirilgandan keyin namuna olish vaqtini kutish majburiy. 10 razryadli natija ikkita registrdan yig'iladi va formulalar orqali kuchlanishga aylantiriladi; o'rtachalash va filtrlash esa o'lchash barqarorligini sezilarli oshiradi."]
 ],
 tests:[
  {q:"PIC16F877A ning ADC si necha razryadli?",o:["8","10","12","16"],a:1,e:"10 razryadli, 8 kanalli ADC."},
  {q:"O'zgartirish natijasi qaysi registrlarda saqlanadi?",o:["ADCON0 va ADCON1","ADRESH va ADRESL","PORTA va PORTB","STATUS va W"],a:1,e:"10 bitli natija ikkita registrga taqsimlanadi."},
  {q:"Uref = 5 V, 10 razryad bo'lsa kvantlash qadami qancha?",o:["1,22 mV","4,88 mV","19,5 mV","50 mV"],a:1,e:"5 V / 1023 ≈ 4,88 mV."},
  {q:"Kirish kuchlanishi 2,5 V bo'lsa kod taxminan qancha bo'ladi?",o:["255","511","767","1023"],a:1,e:"N = 2,5/5 · 1023 ≈ 511."},
  {q:"GO/DONE biti nima uchun ishlatiladi?",o:["Kanal tanlash","O'zgartirishni boshlash va tugashini kuzatish","ADC ni yoqish","Natijani tekislash"],a:1,e:"1 yozilganda o'zgartirish boshlanadi, tugagach bit nolga tushadi."},
  {q:"Kanal almashtirilgandan keyin nima uchun kutish kerak?",o:["Quvvat barqarorlashishi uchun","Namuna-saqlash kondensatori zaryadlanishi uchun","Kvarts ishga tushishi uchun","Uzilish uchun"],a:1,e:"Acquisition time kutilmasa natija oldingi kanalga aralashadi."},
  {q:"ADFM biti nimani belgilaydi?",o:["Kanal raqamini","Natijaning o'ngga yoki chapga tekislanishini","Taktni","Uref manbaini"],a:1,e:"ADFM = 1 da natija o'ngga tekislanadi."},
  {q:"ADCON1 registri nimani sozlaydi?",o:["Qaysi liniyalar analog, qaysilari raqamli ekanini","Portlar yo'nalishini","Taymerni","Uzilishni"],a:0,e:"PCFG bitlari analog/raqamli konfiguratsiyani beradi."},
  {q:"O'lchashni barqarorlashtirishning eng sodda dasturiy usuli qaysi?",o:["Chastotani oshirish","Bir necha o'lchashning o'rtachasini olish","Portni o'chirish","Uzilishni yoqish"],a:1,e:"O'rtachalash tasodifiy shovqinni kamaytiradi."},
  {q:"10 bitli natijani 8 ta LEDga chiqarish uchun nima qilinadi?",o:["kod << 2","kod >> 2","kod & 0x03","kod * 4"],a:1,e:"Ikki razryadga o'ngga siljitib, yuqori 8 bit olinadi."}
 ]
},
{
 id:"S1-M14", sem:1, week:14, type:"lecture", no:14,
 title:"Mikrokontroller protsessor yadrosining strukturasi. Buyruqlar sistemasi. KR580VM80A mikroprotsessorining buyruqlar sistemasi",
 goal:"Mikrokontroller protsessor yadrosining strukturasini, buyruqlar sistemasi tuzilishini va KR580VM80A buyruqlar tizimini o'zlashtirish.",
 outcomes:[
  "Buyruqlarni funksional guruhlarga ajrata oladi",
  "Ko'chirish va o'tish buyruqlarining ishlashini tushuntira oladi",
  "Skip buyruqlarining bajarilish vaqtini hisoblay oladi",
  "Boshqaruv buyruqlarining vazifasini izohlay oladi"
 ],
 plan:["Buyruqlar tasnifi","Ko'chirish buyruqlari","Arifmetik va mantiqiy guruhlar","Siljitish buyruqlari","O'tish va chaqiriq buyruqlari","Boshqaruv buyruqlari"],
 body:[
  ["h","Buyruqlar tasnifi"],
  ["t",["Guruh","Vazifasi","PIC16 dagi namunalar"],[
   ["Ko'chirish","Ma'lumotni bir joydan boshqasiga uzatish","MOVLW, MOVWF, MOVF, SWAPF"],
   ["Arifmetik","Qo'shish, ayirish, inkrement, dekrement","ADDWF, SUBWF, ADDLW, INCF, DECF"],
   ["Mantiqiy","AND, OR, XOR, inversiya","ANDWF, IORWF, XORWF, COMF"],
   ["Siljitish","Razryadlarni chapga yoki o'ngga surish","RLF, RRF"],
   ["Bit bilan ishlash","Razryadni o'rnatish, tozalash, tekshirish","BSF, BCF, BTFSS, BTFSC"],
   ["O'tish va chaqiriq","Dastur oqimini o'zgartirish","GOTO, CALL, RETURN, RETLW, RETFIE"],
   ["Boshqaruv","Protsessor rejimini boshqarish","NOP, SLEEP, CLRWDT"]
  ]],
  ["h","Ko'chirish buyruqlari"],
  ["p","Ko'chirish buyruqlari ALU ni ishlatmaydi va (MOVF dan tashqari) bayroqlarga ta'sir qilmaydi. MOVF f,1 buyrug'i yacheykani o'ziga ko'chiradi, ammo Z bayrog'ini yangilaydi — shuning uchun u yacheyka nolga tengligini tekshirishning standart usuli hisoblanadi."],
  ["c","    MOVLW  0x3A     ; W <- konstanta\n    MOVWF  0x20     ; (0x20) <- W\n    MOVF   0x20, 0  ; W <- (0x20), Z bayrog'i yangilanadi\n    SWAPF  0x20, 1  ; tetradalar joyini almashtiradi: 3A -> A3"],
  ["h","Siljitish buyruqlari"],
  ["p","RLF va RRF buyruqlari C bayrog'i orqali aylantirish (rotate through carry) amalini bajaradi: chetdan chiqqan bit C ga tushadi, C dagi eski qiymat esa qarama-qarshi chetdan kiradi. Shuning uchun siljitishdan oldin C ni tozalash odatiy amaliyot hisoblanadi."],
  ["c","    BCF    STATUS, C   ; C ni tozalash\n    RLF    0x20, 1      ; (0x20) 2 ga ko'paytiriladi\n    BCF    STATUS, C\n    RRF    0x20, 1      ; (0x20) 2 ga bo'linadi"],
  ["h","O'tish va chaqiriq buyruqlari"],
  ["p","GOTO va CALL ikki mashina siklida bajariladi, chunki PC qayta yuklanganda konveyer tozalanadi. RETLW buyrug'i qaytishdan oldin W registriga konstanta yozadi — bu jadval asosidagi kod o'zgartirish (masalan 7-segment kodlari) uchun klassik usul."],
  ["c","; 7-segment kodlari jadvali (umumiy katod)\nJADVAL:\n    ADDWF  PCL, 1     ; PC ga W qo'shiladi - jadvalga sakrash\n    RETLW  0x3F       ; 0\n    RETLW  0x06       ; 1\n    RETLW  0x5B       ; 2\n    RETLW  0x4F       ; 3\n    RETLW  0x66       ; 4"],
  ["n","Jadval usulida PCL ga qo'shish faqat bitta sahifa ichida to'g'ri ishlaydi. Jadval sahifa chegarasidan o'tib ketsa, PCLATH registri ham to'g'ri sozlanishi kerak, aks holda dastur noto'g'ri adresga sakraydi."],
  ["h","Skip buyruqlari va vaqt"],
  ["p","BTFSS, BTFSC, DECFSZ va INCFSZ buyruqlari shart bajarilganda keyingi buyruqni tashlab ketadi. Tashlangan buyruq o'rniga NOP bajariladi, shuning uchun bunday holatda buyruq ikki sikl oladi. Aks holda bitta sikl yetarli."],
  ["f","t = (N1 + 2·N2) · 4 / f_osc","N1 — bir sikli, N2 — ikki sikli (o'tish yoki tashlangan) buyruqlar soni."],
  ["h","KR580VM80A mikroprotsessorining buyruqlar sistemasi"],
  ["p","KR580VM80A — Intel 8080A ning mahalliy analogi bo'lgan 8 razryadli mikroprotsessor. U o'quv jarayonida klassik namuna sifatida qo'llanadi, chunki uning registrlar to'plami va buyruqlar tizimi keyingi avlod protsessorlari uchun asos bo'lgan."],
  ["t",["Registr","Razryad","Vazifasi"],[
   ["A","8","Akkumulyator — arifmetik amallar operandi va natijasi"],
   ["B, C, D, E, H, L","8","Umumiy registrlar; juft holda BC, DE, HL sifatida ishlatiladi"],
   ["HL","16","Xotiraga bilvosita murojaat uchun asosiy ko'rsatkich"],
   ["SP","16","Stek ko'rsatkichi"],
   ["PC","16","Komandalar hisoblagichi"],
   ["F","5 bit","Flaglar: S, Z, AC, P, C"]
  ]],
  ["p","Buyruqlar tizimi 78 ta asosiy buyruqdan iborat bo'lib, ular besh guruhga bo'linadi: uzatish (MOV, MVI, LXI, LDA, STA), arifmetik (ADD, ADI, SUB, INR, DCR), mantiqiy (ANA, ORA, XRA, CMP), siljitish va aylantirish (RLC, RRC, RAL, RAR) hamda boshqaruv (JMP, JZ, JC, CALL, RET, PUSH, POP, HLT, EI, DI)."],
  ["c","; KR580VM80A: ikki sonni qo'shib xotiraga yozish\n      LXI  H, 2000H    ; HL <- 2000H (xotira ko'rsatkichi)\n      MOV  A, M        ; A <- (HL)\n      INX  H           ; HL <- HL + 1\n      ADD  M           ; A <- A + (HL), flaglar yangilanadi\n      INX  H\n      MOV  M, A        ; natija (HL) ga yoziladi\n      HLT              ; to'xtash"],
  ["p","Buyruq uzunligi 1, 2 yoki 3 baytni tashkil qiladi: birinchi bayt — operatsiya kodi, keyingilari esa konstanta yoki 16 razryadli adres. Buyruqlar 4 dan 18 gacha taktda bajariladi, shuning uchun dastur vaqtini hisoblashda har bir buyruqning takt soni jadvaldan olinadi."],

  ["h","Boshqaruv buyruqlari"],
  ["ul",[
   "NOP — hech qanday amal bajarmaydi, aniq vaqt kechikishini shakllantirishda ishlatiladi",
   "SLEEP — protsessorni quvvat tejash rejimiga o'tkazadi; uyg'onish uzilish yoki reset bilan bo'ladi",
   "CLRWDT — watchdog taymerni tozalaydi va reset bo'lishini oldini oladi"
  ]],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Buyruqlar funksional jihatdan ko'chirish, arifmetik, mantiqiy, siljitish, bit, o'tish va boshqaruv guruhlariga bo'linadi. Ko'chirish buyruqlari bayroqlarga ta'sir qilmaydi, siljitish esa C bayrog'i orqali bajariladi. O'tish va tashlab ketish holatlari ikki sikl talab qiladi — bu dastur vaqtini hisoblashda hisobga olinadi."]
 ],
 tests:[
  {q:"MOVWF f buyrug'i qaysi guruhga kiradi?",o:["Arifmetik","Ko'chirish","Mantiqiy","O'tish"],a:1,e:"Bu ma'lumotni W dan fayl registriga ko'chirish."},
  {q:"Qaysi ko'chirish buyrug'i Z bayrog'ini yangilaydi?",o:["MOVLW","MOVWF","MOVF","SWAPF"],a:2,e:"MOVF yacheyka nolga tengligini tekshirish uchun ishlatiladi."},
  {q:"SWAPF buyrug'i nima qiladi?",o:["Bitlarni aylantiradi","Tetradalar (4 bitli yarimlar) joyini almashtiradi","Registrni nollaydi","Bayroqlarni o'zgartiradi"],a:1,e:"0x3A → 0xA3 ko'rinishida almashtiradi."},
  {q:"RLF buyrug'ida chetdan chiqqan bit qayerga tushadi?",o:["Yo'qoladi","C bayrog'iga","Z bayrog'iga","W registrga"],a:1,e:"Aylantirish C bayrog'i orqali bajariladi."},
  {q:"RLF dan oldin C ni tozalash nima uchun kerak?",o:["Tezlik uchun","Eski C qiymati quyi razryadga kirib ketmasligi uchun","Xotira uchun","Uzilish uchun"],a:1,e:"C dagi qiymat aylanish orqali songa qo'shilib ketadi."},
  {q:"RETLW buyrug'i nima qiladi?",o:["Faqat qaytadi","Qaytishdan oldin W ga konstanta yozadi","Uzilishni yoqadi","Stekni tozalaydi"],a:1,e:"Jadval asosidagi kod o'zgartirishda ishlatiladi."},
  {q:"ADDWF PCL,1 buyrug'i nima uchun ishlatiladi?",o:["Qo'shish uchun","Jadvalga sakrash (hisoblangan o'tish) uchun","Bayroqlarni tozalash uchun","Portni o'qish uchun"],a:1,e:"PC ga indeks qo'shilib, jadvalning kerakli qatoriga o'tiladi."},
  {q:"Tashlab ketilgan buyruq necha sikl oladi?",o:["0","1","2","4"],a:2,e:"Uning o'rniga NOP bajariladi va ikki sikl ketadi."},
  {q:"SLEEP buyrug'i nima qiladi?",o:["Dasturni to'xtatadi va quvvat tejash rejimiga o'tkazadi","Xotirani tozalaydi","Taymerni yoqadi","Portni o'chiradi"],a:0,e:"Uyg'onish uzilish yoki reset orqali bo'ladi."},

{
 id:"S1-A14", sem:1, week:14, type:"practice", no:14,
 title:"PIC mikrokontrollerida PWMni loyihalash",
 goal:"CCP modulini PWM rejimida sozlash, chastota va to'ldirish koeffitsientini hisoblash hamda yuklamani boshqarishni o'zlashtirish.",
 equip:["PIC o'quv stendi yoki Proteus","LED yoki kichik dvigatel va drayver","Ossillograf","O'zgaruvchan rezistor 10 kΩ","Darslikning PWM simulyatori"],
 plan:["PWM tushunchasi","CCP moduli","Chastotani hisoblash","To'ldirishni hisoblash","Dastur","Yuklamani ulash"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PWM (Pulse Width Modulation) — davri o'zgarmas, impuls davomiyligi esa boshqariladigan signal. O'rtacha kuchlanish impuls davomiyligiga proporsional bo'lgani uchun PWM yorqinlik, tezlik va quvvatni raqamli usulda, deyarli yo'qotishsiz boshqarish imkonini beradi."],
  ["f","D = t_impuls / T · 100 %","To'ldirish koeffitsienti."],
  ["f","U_ortacha = D · U_cc","D = 40 %, U = 5 V → 2 V."],
  ["p","PWM tranzistorni faqat to'liq ochiq yoki to'liq yopiq holatda ushlaydi, shuning uchun unda issiqlik yo'qotishi rezistorli boshqaruvga qaraganda ancha kam bo'ladi."],
  ["h","CCP moduli va hisoblar"],
  ["p","PIC16F877A da ikkita CCP moduli bor; PWM rejimida ular Timer2 va PR2 registri bilan ishlaydi. Chiqish CCP1 uchun RC2, CCP2 uchun RC1 liniyasida shakllanadi."],
  ["f","PR2 = f_osc / (4 · K · f_pwm) − 1","PWM chastotasini belgilash. f = 8 MHz, K = 16, f_pwm = 1 kHz → PR2 = 124."],
  ["f","CCPR1L:CCP1CON<5:4> = 4 · (PR2 + 1) · D","10 razryadli to'ldirish qiymati. D = 0,5 va PR2 = 124 → 250."],
  ["p","To'ldirish 10 razryadli qiymat bilan beriladi: yuqori 8 bit CCPR1L registrida, quyi 2 bit esa CCP1CON registrining 4- va 5-razryadlarida saqlanadi. Amaliyotda ko'pincha faqat CCPR1L ishlatiladi va bu 8 razryadli aniqlik beradi."],
  ["h","Dastur"],
  ["c","#include <xc.h>\n#pragma config FOSC = HS, WDTE = OFF, LVP = OFF\n#define _XTAL_FREQ 8000000UL\n\nvoid pwm_init(void)\n{\n    PR2     = 124;      /* f_pwm = 1 kHz (K = 16) */\n    CCP1CON = 0x0C;     /* CCP1 PWM rejimida       */\n    T2CON   = 0x06;     /* Timer2 yoqilgan, bo'luvchi 1:16 */\n    TRISCbits.TRISC2 = 0;   /* CCP1 chiqishi */\n}\n\nvoid pwm_duty(uint8_t percent)      /* 0..100 % */\n{\n    uint16_t d = (uint16_t)((4UL * (PR2 + 1) * percent) / 100UL);\n    CCPR1L   = (uint8_t)(d >> 2);\n    CCP1CON  = (uint8_t)((CCP1CON & 0xCF) | ((d & 0x03) << 4));\n}\n\nvoid main(void)\n{\n    pwm_init();\n    while (1)\n    {\n        for (uint8_t p = 0; p <= 100; p += 5) { pwm_duty(p); __delay_ms(60); }\n        for (uint8_t p = 100; p > 0; p -= 5)  { pwm_duty(p); __delay_ms(60); }\n    }\n}"],
  ["p","Bu dastur LED yorqinligini silliq oshirib-kamaytiradi. Dvigatel boshqarishda pwm_duty funksiyasiga ADC dan olingan qiymat uzatiladi — shunda potensiometr bilan tezlik boshqariladi."],
  ["h","Yuklamani ulash"],
  ["t",["Yuklama","Ulash","Izoh"],[
   ["LED","Rezistor orqali bevosita","10 mA gacha"],
   ["Kichik dvigatel","MOSFET yoki tranzistor kaliti","Teskari diod majburiy"],
   ["Dvigatelni ikki yo'nalishda","L293D ko'prigi orqali","PWM ruxsat kirishiga beriladi"],
   ["Isitgich, lampa","Optron va simistor orqali","Tarmoq kuchlanishida galvanik ajratish shart"],
   ["Analog kuchlanish","RC past chastotali filtr","Kesish chastotasi f_pwm dan ancha kichik bo'lsin"]
  ]],
  ["n","Xavfsizlik: induktiv yuklamani (dvigatel, rele) tranzistorsiz va teskari diodsiz ulash mumkin emas. Kalit yopilganda paydo bo'ladigan o'z-o'zidan induksiya EYK i tranzistorni ham, mikrokontrollerni ham teshib yuborishi mumkin."],
  ["h","Chastotani tanlash"],
  ["ul",[
   "LED yorqinligi uchun 100 Hz dan yuqori — ko'z miltillashni sezmaydi",
   "Dvigatel uchun 5–20 kHz — eshitiladigan g'ing'illashdan qochish uchun",
   "Isitish uchun 1 Hz ham yetarli — inersiya katta",
   "Chastota qancha yuqori bo'lsa, kalitlash yo'qotishlari shuncha ortadi"
  ]],
  ["sim","pwm"],
  ["h","Topshiriqlar"],
  ["ol",[
   "CCP1 modulini 1 kHz chastotaga sozlang va ossillograf bilan davrni o'lchang.",
   "To'ldirishni 25, 50 va 75 % qilib, impuls davomiyligini o'lchang va jadvalga yozing.",
   "Variant raqamingiz N bo'lsin: f_pwm = (1 + N/10) kHz uchun PR2 qiymatini hisoblang.",
   "Har bir holatda o'rtacha kuchlanishni voltmetr bilan o'lchab, nazariy qiymat bilan solishtiring.",
   "ADC dan olingan qiymat bilan to'ldirishni boshqaruvchi dastur yozing (potensiometr bilan yorqinlik).",
   "PWM chiqishiga RC filtr ulab, analog kuchlanish olinishini kuzating.",
   "Ossillogramma yoki simulyator ekranining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","PWM davri Timer2 va PR2 registri bilan, to'ldirish esa CCPR1L va CCP1CON razryadlari bilan belgilanadi. O'rtacha kuchlanish to'ldirish koeffitsientiga to'g'ri proporsional bo'lgani uchun PWM quvvatni samarali boshqarish usuli hisoblanadi. Chastota yuklama turiga qarab tanlanadi, induktiv yuklama esa albatta kalit va teskari diod orqali ulanadi."]
 ],
 tests:[

  {q:"To'ldirish 40 %, Ucc = 5 V bo'lsa o'rtacha kuchlanish qancha?",o:["1 V","2 V","2,5 V","4 V"],a:1,e:"U = 0,4 · 5 = 2 V."},

 plan:["Arxitektura tushunchasi","Fon Neyman sxemasi","Garvard va modifikatsiyalangan Garvard","Xotira fazosi","CISC va RISC","Konveyer"],
 body:[
  ["h","Arxitektura tushunchasi"],
  ["p","Arxitektura deganda tizimning dasturchiga ko'rinadigan tuzilishi tushuniladi: registrlar to'plami, buyruqlar tizimi, adreslash usullari va xotira modeli. Bitta arxitektura turli kristallarda turlicha texnik yechim bilan amalga oshirilishi mumkin — bu mikroarxitektura deb ataladi."],
  ["h","Fon Neyman arxitekturasi"],
  ["p","Bu sxemada buyruqlar ham, ma'lumotlar ham bitta umumiy xotirada saqlanadi va ularga bitta umumiy shina orqali murojaat qilinadi. Natijada protsessor bitta taktda yo buyruqni o'qiy oladi, yo ma'lumotni — ikkalasini bir vaqtda emas. Bu cheklov fon Neyman to'sig'i deb ataladi."],
  ["fig","arch","1-rasm. Fon Neyman va Garvard arxitekturalarining qiyosiy sxemasi"],
  ["h","Garvard arxitekturasi"],
  ["p","Garvard sxemasida buyruq xotirasi va ma'lumot xotirasi jismonan ajratilgan, har birining o'z shinasi bor. Buyruqni o'qish va ma'lumotga murojaat bir taktda parallel bajariladi. PIC, AVR va aksariyat mikrokontrollerlar shu sxemada qurilgan. PIC16 oilasida buyruq so'zi 14 bitli, ma'lumot yacheykasi esa 8 bitli — bu faqat ajratilgan xotira bilan mumkin."],
  ["p","Amalda ko'pincha modifikatsiyalangan Garvard qo'llanadi: xotira ajratilgan, ammo maxsus buyruqlar orqali dastur xotirasidan doimiy jadvallarni o'qish imkoni qoldiriladi."],
  ["t",["Belgi","Fon Neyman","Garvard"],[
   ["Xotira","Umumiy","Ajratilgan"],["Shina soni","Bitta","Ikkita mustaqil"],
   ["Bir taktda murojaat","Faqat bittasiga","Buyruq va ma'lumotga"],
   ["Buyruq va ma'lumot razryadi","Bir xil","Har xil bo'lishi mumkin"],
   ["Tipik qo'llanish","Umumiy maqsadli protsessorlar","Mikrokontroller, DSP"]
  ]],
  ["h","Xotira fazosining tuzilishi"],
  ["fig","mem","2-rasm. Mikrokontroller xotira fazosining tipik taqsimoti"],
  ["p","Stek — LIFO tamoyilida ishlaydigan soha; unga qism dasturga o'tishda qaytish adresi joylashtiriladi. PIC16 da stek apparat ko'rinishida bo'lib, chuqurligi 8 daraja bilan cheklangan — bu chuqur ichma-ich chaqiriqlarga to'siq qo'yadi. Periferiya registrlari (SFR) ham adres fazosida joylashgani uchun ularga oddiy xotira buyruqlari bilan murojaat qilinadi."],
  ["h","CISC va RISC"],
  ["t",["Belgi","CISC","RISC"],[
   ["Buyruqlar soni","Ko'p (100+)","Kam (35–80)"],["Buyruq uzunligi","O'zgaruvchan","Doimiy"],
   ["Bajarish vaqti","Har xil","Asosan 1 sikl"],["Registrlar soni","Kam","Ko'p"],
   ["Vakillar","x86, 8051","PIC, AVR, ARM, RISC-V"]
  ]],
  ["p","PIC16 oilasi RISC yondashuvining yorqin namunasi: butun buyruqlar tizimi 35 ta buyruqdan iborat, barcha buyruqlar bir xil 14 bitli formatda va o'tishdan tashqari hammasi bitta mashina siklida bajariladi. Bu dasturning bajarilish vaqtini oldindan aniq hisoblash imkonini beradi — real vaqt tizimlari uchun muhim xususiyat."],
  ["h","Konveyer"],
  ["p","Konveyer buyruq bosqichlarini parallel bajarish imkonini beradi: joriy buyruq bajarilayotganda keyingisi xotiradan olinadi. PIC da ikki bosqichli konveyer qo'llanadi va shu sababli oddiy buyruqlar samarali bir siklda tugaydi. O'tish bajarilganda oldindan olingan buyruq yaroqsiz bo'lib qoladi, konveyer tozalanadi va buyruq ikki sikl oladi."],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Fon Neyman arxitekturasi soddaligi va moslashuvchanligi, Garvard esa parallel murojaat imkoniyati bilan ajralib turadi. Mikrokontrollerlarda xotira dastur, ma'lumot, stek va periferiya registrlari sohalariga bo'linadi. RISC yondashuvi va konveyer birgalikda past chastotada ham barqaror, oldindan hisoblanadigan unumdorlikni ta'minlaydi."]
 ],

  {q:"PIC16 buyruqlar tizimida nechta buyruq bor?",o:["16","35","80","120"],a:1,e:"Klassik PIC16 oilasida 35 ta buyruq mavjud."},

{
 id:"S1-A15", sem:1, week:15, type:"practice", no:15,
 title:"PIC mikrokontrollerida termometrni loyihalash",
 goal:"Harorat datchigidan signal olish, uni ADC bilan o'lchash, haroratga aylantirish va indikatorga chiqarish tizimini to'liq loyihalash.",
 equip:["PIC o'quv stendi yoki Proteus","LM35 harorat datchigi (yoki NTC termistor)","LCD 16×2","Rezistor 10 kΩ, kondensator 0,1 µF","Multimetr va etalon termometr","Darslikning ADC va LCD simulyatorlari"],
 plan:["Tizimning tuzilmasi","Datchikni tanlash","Signalni o'lchash","Haroratga aylantirish","Indikatsiya","Kalibrlash va boshqaruv"],
 body:[
  ["h","Tizimning tuzilmasi"],
  ["p","Raqamli termometr to'rt bosqichdan iborat: datchik haroratni elektr signalga aylantiradi, ADC signalni raqamli kodga o'zgartiradi, mikrokontroller kodni haroratga aylantiradi, indikator natijani ko'rsatadi. Bu tuzilma har qanday o'lchash qurilmasi uchun umumiy hisoblanadi."],
  ["fig","temp","1-rasm. Mikrokontrollerli termometrning tuzilmaviy va ulanish sxemasi"],
  ["t",["Datchik","Chiqish signali","Diapazon","Xususiyati"],[
   ["LM35","10 mV/°C, chiziqli","0…100 °C","Kalibrlash talab qilmaydi, ulash oson"],
   ["NTC termistor","Qarshilik, chiziqsiz","−40…125 °C","Arzon, hisob murakkab"],
   ["DS18B20","Raqamli, 1-Wire","−55…125 °C","ADC kerak emas, yuqori aniqlik"],
   ["Termojuft","mV darajasidagi EYK","0…1000 °C dan yuqori","Kuchaytirgich va sovuq spay kompensatsiyasi kerak"]
  ]],
  ["h","LM35 bilan o'lchash"],
  ["p","LM35 chiqishida harorat bilan chiziqli bog'liq kuchlanish hosil bo'ladi: 25 °C uchun 250 mV. Uref = 5 V va 10 razryadli ADC da kvantlash qadami 4,88 mV, demak bitta kod taxminan 0,49 °C ga mos keladi."],
  ["f","U = 10 mV · T","LM35 ning asosiy tavsifi."],
  ["f","T = N · U_ref / (1023 · 0,01)","Kod orqali haroratni hisoblash. Uref = 5 V uchun T ≈ N · 0,489."],
  ["p","Aniqlikni oshirish uchun Uref sifatida 2,56 V yoki 1,024 V li aniq manbadan foydalanish mumkin — shunda kvantlash qadami ikki-besh barobar kichrayadi va bitta kod 0,1–0,25 °C ni beradi."],
  ["h","Dastur"],
  ["c","#include <xc.h>\n#pragma config FOSC = HS, WDTE = OFF, LVP = OFF\n#define _XTAL_FREQ 8000000UL\n\n/* lcd_init, lcd_cmd, lcd_data, lcd_text — oldingi ishdan */\nuint16_t adc_read(uint8_t kanal);\n\nuint16_t harorat_olish(void)      /* natija 0,1 °C birliklarida */\n{\n    uint32_t s = 0;\n    for (uint8_t i = 0; i < 16; i++) { s += adc_read(0); __delay_ms(2); }\n    s >>= 4;                              /* 16 ta o'lchashning o'rtachasi */\n    return (uint16_t)(s * 4890UL / 1000UL / 10UL);   /* mV -> 0,1 °C */\n}\n\nvoid main(void)\n{\n    uint16_t t;\n    adc_init();\n    lcd_init();\n    TRISB = 0x00;\n\n    lcd_cmd(0x80); lcd_text(\"Harorat:\");\n\n    while (1)\n    {\n        t = harorat_olish();\n\n        lcd_cmd(0xC0);\n        lcd_data((uint8_t)(t / 100) + '0');\n        lcd_data((uint8_t)((t / 10) % 10) + '0');\n        lcd_data('.');\n        lcd_data((uint8_t)(t % 10) + '0');\n        lcd_data(' '); lcd_data(0xDF); lcd_data('C');   /* daraja belgisi */\n\n        if (t >= 400) PORTBbits.RB0 = 1;    /* 40,0 °C dan yuqori — signal */\n        else if (t <= 380) PORTBbits.RB0 = 0;  /* 2 °C gisterezis */\n\n        __delay_ms(500);\n    }\n}"],
  ["p","Kodda 0,1 °C birliklari ishlatilgani uchun kasr sonlar talab qilinmaydi — butun sonlar bilan ishlash mikrokontrollerda ancha tez va kam xotira oladi. Signalizatsiya chegarasida 2 °C gisterezis qo'llangan, bu chegara atrofida relening tez-tez kalitlanishini oldini oladi."],
  ["h","Kalibrlash"],
  ["ol",[
   "Qurilmani etalon termometr bilan bir xil sharoitga qo'ying va 10 daqiqa barqarorlashtiring.",
   "Ikki nuqtada (masalan xona harorati va muzli suv) ko'rsatkichlarni yozib oling.",
   "Farqni hisoblang: agar u butun diapazonda bir xil bo'lsa — nol siljishi, o'zgarib borsa — koeffitsient xatosi.",
   "Nol siljishini dasturda doimiy tuzatma sifatida hisobga oling.",
   "Koeffitsient xatosini hisoblash formulasidagi ko'paytuvchini o'zgartirib tuzating.",
   "Tuzatmalarni EEPROM ga yozib qo'ying — shunda ular quvvat uzilganda ham saqlanadi."
  ]],
  ["n","O'lchash aniqligiga ta'sir qiluvchi omillar: datchik va ADC kirishini bog'lovchi uzun simlar (shovqin), quvvat manbaining beqarorligi (Uref sifatida VDD ishlatilganda), datchikning o'z-o'zidan qizishi va yaqindagi issiqlik manbalari."],
  ["h","Interaktiv qism"],
  ["sim","adc"],
  ["sim","lcd"],
  ["h","Topshiriqlar"],
  ["ol",[
   "LM35 ni AN0 kanaliga ulang, kirishga RC filtr qo'ying va sxemani chizing.",
   "Xona haroratini o'lchab, ADC kodi va hisoblangan qiymatni etalon termometr bilan solishtiring.",
   "Variant raqamingiz N bo'lsin: signalizatsiya chegarasini (30 + N) °C qilib belgilang va gisterezisni 2 °C qoldiring.",
   "Haroratni LCD ga 0,1 °C aniqligida chiqaruvchi dasturni yozing va ishlashini tekshiring.",
   "16 martalik o'rtachalashni o'chirib va yoqib, ko'rsatkichning tebranishini taqqoslang.",
   "Ikki nuqtali kalibrlashni bajaring va tuzatmani dasturga kiriting.",
   "O'lchash jadvali va ishlayotgan qurilma rasmini yuklang."

{

  ["p","Har qanday interfeys uchta darajada tavsiflanadi: fizik daraja (simlar soni, signal darajalari, ulagichlar), kanal darajasi (kadr tuzilishi, sinxronlash, xatolarni aniqlash) va protokol darajasi (buyruqlar, adreslar, javoblar tartibi)."],

  ["p","Sinxron aloqada qabul qiluvchi va uzatuvchi umumiy takt signali bo'yicha ishlaydi — bu SPI va I2C da qo'llanadi. Asinxron aloqada esa takt liniyasi yo'q, ikkala tomon oldindan kelishilgan tezlikda ishlaydi va har bir bayt start va stop bitlari bilan ajratiladi — bu UART ning ish tamoyili."],
  ["fig","iface","1-rasm. Asosiy ketma-ket interfeyslarning ulanish sxemalari"],

  ["t",["Interfeys","Liniyalar","Tezligi","Qurilmalar soni","Xususiyati"],[

  ["ul",[

  ["n","Amaliy qoida: datchiklar uchun ko'pincha I2C yoki 1-Wire, tez ADC va xotira uchun SPI, kompyuter bilan aloqa uchun UART yoki USB, sanoat masofasi uchun RS-485 yoki CAN tanlanadi."],
  ["sim","uart"],

{
 id:"S2-L1", sem:2, week:1, type:"lab", no:1,
 title:"Arduino qurilmasi bilan tanishish",

 equip:["Arduino Uno platasi","USB kabel","Arduino IDE o'rnatilgan kompyuter","LED va rezistor 330 Ω","Maket plata va ulash simlari"],

 body:[
  ["h","Nazariy qism"],
  ["p","Arduino — ochiq arxitekturali apparat-dasturiy platforma. U ATmega mikrokontrolleri asosidagi plata va uni dasturlash uchun soddalashtirilgan muhitdan iborat. Platforma o'quv jarayoni va tez prototiplash uchun mo'ljallangan: dasturchi registrlarni bevosita sozlamasdan, tayyor funksiyalar bilan ishlaydi."],
  ["fig","ard","1-rasm. Arduino Uno platasining tarkibi va chiqishlari taqsimoti"],
  ["t",["Element","Vazifasi"],[
   ["ATmega328P","Asosiy mikrokontroller: 32 K Flash, 2 K SRAM, 1 K EEPROM"],

   ["USB-UART o'zgartirgich","Kompyuter bilan aloqa va dastur yuklash"],

   ["Reset tugmasi","Dasturni qayta ishga tushirish"],
   ["ICSP razyomi","Bootloadersiz dasturlash uchun"]
  ]],
  ["p","Platada bootloader oldindan yozilgan bo'ladi: u quvvat berilganda bir necha soniya USB portni kuzatadi va yangi dastur kelsa uni Flash xotiraga yozadi. Shuning uchun Arduino ni dasturlash uchun alohida programmator talab qilinmaydi."],
  ["n","Xavfsizlik: raqamli chiqishning maksimal toki 40 mA, butun plata uchun 200 mA. Dvigatel, rele yoki lenta LED ni bevosita platadan quvvatlantirmang — tashqi manba va drayver ishlating. 5 V liniyaga tashqaridan kuchlanish bermang."],
  ["h","Arduino IDE"],
  ["ol",[
   "Arduino IDE ni ishga tushiring.",
   "Tools → Board menyusidan Arduino Uno ni tanlang.",

   "Verify tugmasi bilan kompilyatsiya qiling, Upload tugmasi bilan platagaz yuklang.",

  ["h","Dastur tuzilmasi"],
  ["p","Arduino dasturi (eskiz) ikki majburiy funksiyadan iborat. setup() quvvat berilgandan keyin bir marta bajariladi va sozlashlarni o'z ichiga oladi; loop() esa cheksiz takrorlanadi va asosiy ish mantiqini bajaradi. Bu tuzilma C dagi main() ichidagi init va while(1) ga to'liq mos keladi."],
  ["c","const int LED = 13;        // platadagi o'rnatilgan LED\n\nvoid setup()\n{\n    pinMode(LED, OUTPUT);  // chiqish rejimi (PIC dagi TRIS ga mos)\n    Serial.begin(9600);    // kompyuter bilan aloqa\n    Serial.println(\"Tizim ishga tushdi\");\n}\n\nvoid loop()\n{\n    digitalWrite(LED, HIGH);   // LED yonadi\n    delay(500);                // 500 ms kechikish\n    digitalWrite(LED, LOW);    // LED o'chadi\n    delay(500);\n    Serial.println(\"Bir davr tugadi\");\n}"],
  ["t",["Arduino funksiyasi","PIC dagi muqobili"],[

  ["ol",[

   "Variant raqamingiz N bo'lsin: miltillash davrini (200 + 50·N) ms qilib o'zgartiring.",

   "Serial Monitor ni ochib, chiqayotgan xabarlarni kuzating va ekran rasmini oling.",
   "Arduino va PIC dasturlash usullarini qiyoslovchi jadval tuzing (kamida 5 ta belgi).",
   "Yig'ilgan sxema yoki Serial Monitor oynasining rasmini yuklang."

  ["h","Xulosa"],
  ["p","Arduino platasi ATmega mikrokontrolleri, takt generatori, USB-UART o'zgartirgich va quvvat qismini bitta platada birlashtiradi. Bootloader tufayli dastur alohida programmatorsiz yuklanadi. Eskiz setup() va loop() funksiyalaridan iborat bo'lib, ular mohiyatan boshlang'ich sozlash va cheksiz asosiy siklga mos keladi."]

{
 id:"S2-M17", sem:2, week:2, type:"lecture", no:17,
 title:"Mikrokontrollerlarning programma va qiymatlar xotirasi",
 goal:"Mikrokontroller xotira fazosining tashkil etilishini, dastur va ma'lumot xotirasi turlarini hamda ular bilan ishlash qoidalarini o'zlashtirish.",
 outcomes:[
  "Dastur va ma'lumot xotirasining farqini tushuntira oladi",
