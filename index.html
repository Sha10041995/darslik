{
 id:"S2-L1", sem:2, week:1, type:"lab", no:1,
 title:"Arduino qurilmasi bilan tanishish",
 goal:"Arduino platasining tarkibi, chiqishlari va dasturlash muhiti bilan tanishish, birinchi dasturni yuklash.",
 outcomes:[],
 plan:["Arduino platformasi","Uno platasining tarkibi","Chiqishlar taqsimoti","Arduino IDE","Birinchi dastur","Dastur tuzilmasi"],
 equip:["Arduino Uno platasi","USB kabel","Arduino IDE o'rnatilgan kompyuter","LED va rezistor 330 Ω","Maket plata va ulash simlari"],
 body:[
  ["h","Nazariy qism"],
  ["p","Arduino — ochiq arxitekturali apparat-dasturiy platforma. U ATmega mikrokontrolleri asosidagi plata va uni dasturlash uchun soddalashtirilgan muhitdan iborat. Platforma o'quv jarayoni va tez prototiplash uchun mo'ljallangan: dasturchi registrlarni bevosita sozlamasdan, tayyor funksiyalar bilan ishlaydi."],
  ["fig","ard","1-rasm. Arduino Uno platasining tarkibi va chiqishlari taqsimoti"],
  ["t",["Element","Vazifasi"],[["ATmega328P","Asosiy mikrokontroller: 32 K Flash, 2 K SRAM, 1 K EEPROM"],["Kvarts rezonator 16 MHz","Takt generatori"],["USB-UART o'zgartirgich","Kompyuter bilan aloqa va dastur yuklash"],["Kuchlanish stabilizatori","7–12 V kirishdan 5 V va 3,3 V hosil qilish"],["Raqamli chiqishlar D0–D13","Kirish yoki chiqish; D3, D5, D6, D9, D10, D11 — PWM"],["Analog kirishlar A0–A5","10 razryadli ADC kanallari"],["Reset tugmasi","Dasturni qayta ishga tushirish"],["ICSP razyomi","Bootloadersiz dasturlash uchun"]]],
  ["p","Platada bootloader oldindan yozilgan bo'ladi: u quvvat berilganda bir necha soniya USB portni kuzatadi va yangi dastur kelsa uni Flash xotiraga yozadi. Shuning uchun Arduino ni dasturlash uchun alohida programmator talab qilinmaydi."],
  ["n","Xavfsizlik: raqamli chiqishning maksimal toki 40 mA, butun plata uchun 200 mA. Dvigatel, rele yoki lenta LED ni bevosita platadan quvvatlantirmang — tashqi manba va drayver ishlating. 5 V liniyaga tashqaridan kuchlanish bermang."],
  ["h","Arduino IDE"],
  ["ol",["Arduino IDE ni ishga tushiring.","Tools → Board menyusidan Arduino Uno ni tanlang.","Tools → Port dan platangiz ulangan portni tanlang (COMx yoki /dev/ttyUSBx).","Yangi eskiz (sketch) oynasini oching yoki File → Examples dan tayyor misolni yuklang.","Verify tugmasi bilan kompilyatsiya qiling, Upload tugmasi bilan platagaz yuklang.","Yuklash paytida RX va TX indikatorlari miltillashi kerak."]],
  ["h","Dastur tuzilmasi"],
  ["p","Arduino dasturi (eskiz) ikki majburiy funksiyadan iborat. setup() quvvat berilgandan keyin bir marta bajariladi va sozlashlarni o'z ichiga oladi; loop() esa cheksiz takrorlanadi va asosiy ish mantiqini bajaradi. Bu tuzilma C dagi main() ichidagi init va while(1) ga to'liq mos keladi."],
  ["c","const int LED = 13;        // platadagi o'rnatilgan LED\n\nvoid setup()\n{\n    pinMode(LED, OUTPUT);  // chiqish rejimi (PIC dagi TRIS ga mos)\n    Serial.begin(9600);    // kompyuter bilan aloqa\n    Serial.println(\"Tizim ishga tushdi\");\n}\n\nvoid loop()\n{\n    digitalWrite(LED, HIGH);   // LED yonadi\n    delay(500);                // 500 ms kechikish\n    digitalWrite(LED, LOW);    // LED o'chadi\n    delay(500);\n    Serial.println(\"Bir davr tugadi\");\n}"],
  ["t",["Arduino funksiyasi","PIC dagi muqobili"],[["pinMode(pin, OUTPUT)","TRISBbits.TRISB0 = 0"],["digitalWrite(pin, HIGH)","PORTBbits.RB0 = 1"],["digitalRead(pin)","PORTDbits.RD0 ni o'qish"],["delay(ms)","__delay_ms(ms)"],["analogRead(A0)","ADC ni sozlash va GO/DONE bilan o'qish"],["analogWrite(pin, d)","CCP modulini PWM rejimida sozlash"]]],
  ["h","Interaktiv qism"],
  ["sim","led"],
  ["h","Topshiriqlar"],
  ["ol",["Platani kompyuterga ulang, IDE da plata va portni tanlang, natijani qayd eting.","O'rnatilgan LED ni miltillatuvchi dasturni yuklang va ishlashini tekshiring.","Variant raqamingiz N bo'lsin: miltillash davrini (200 + 50·N) ms qilib o'zgartiring.","Tashqi LED ni D8 chiqishiga rezistor orqali ulang va uni boshqaruvchi dastur yozing.","Serial Monitor ni ochib, chiqayotgan xabarlarni kuzating va ekran rasmini oling.","Arduino va PIC dasturlash usullarini qiyoslovchi jadval tuzing (kamida 5 ta belgi).","Yig'ilgan sxema yoki Serial Monitor oynasining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Arduino platasi ATmega mikrokontrolleri, takt generatori, USB-UART o'zgartirgich va quvvat qismini bitta platada birlashtiradi. Bootloader tufayli dastur alohida programmatorsiz yuklanadi. Eskiz setup() va loop() funksiyalaridan iborat bo'lib, ular mohiyatan boshlang'ich sozlash va cheksiz asosiy siklga mos keladi."],
 ],

 plan:["Chiqishlarni sozlash","Sikl va massivlar","Yuguruvchi olov","Serial port bilan ishlash","Arifmetik amallar","Vaqtni o'lchash"],

 body:[
  ["h","Nazariy qism"],
  ["p","Arduino da har bir raqamli chiqish alohida funksiya bilan boshqariladi, ammo ko'p chiqish bilan ishlashda massiv va sikl ishlatish kodni ancha qisqartiradi. Bu yondashuv PIC dagi portni bir butun bayt sifatida boshqarishga o'xshash natija beradi."],
  ["n","Xavfsizlik: sakkizta LED ni bir vaqtda yoqqanda umumiy tok 5 V liniyasi chegarasidan oshmasligi kerak. Har bir LED uchun 330 Ω rezistor ishlatilsa, bitta LED toki taxminan 9 mA, sakkiztasiniki 72 mA bo'ladi — bu ruxsat etilgan chegarada."],
  ["h","Massiv va sikl bilan ishlash"],
  ["c","const int led[8] = {2, 3, 4, 5, 6, 7, 8, 9};\n\nvoid setup()\n{\n    for (int i = 0; i < 8; i++)\n        pinMode(led[i], OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    // yuguruvchi olov: oldinga\n    for (int i = 0; i < 8; i++)\n    {\n        digitalWrite(led[i], HIGH);\n        delay(100);\n        digitalWrite(led[i], LOW);\n    }\n    // orqaga\n    for (int i = 6; i > 0; i--)\n    {\n        digitalWrite(led[i], HIGH);\n        delay(100);\n        digitalWrite(led[i], LOW);\n    }\n}"],
  ["h","Baytni razryadlarga ajratib chiqarish"],
  ["c","void baytni_chiqar(byte qiymat)\n{\n    for (int i = 0; i < 8; i++)\n        digitalWrite(led[i], bitRead(qiymat, i));   // i-razryadni o'qib chiqarish\n}\n\nvoid loop()\n{\n    for (int n = 0; n < 256; n++)      // ikkilik hisoblagich\n    {\n        baytni_chiqar((byte)n);\n        Serial.print(\"Qiymat: \");\n        Serial.print(n);\n        Serial.print(\"  HEX: \");\n        Serial.println(n, HEX);\n        delay(300);\n    }\n}"],
  ["p","bitRead(qiymat, i) funksiyasi baytning i-razryadini qaytaradi — bu maskalash amalining tayyor ko'rinishi. Serial.println(n, HEX) esa sonni o'n oltilik sistemada chiqaradi, bu sanoq sistemalari o'rtasidagi bog'liqlikni kuzatish uchun qulay."],
  ["h","Arifmetik amallar va vaqtni o'lchash"],
  ["c","void loop()\n{\n    unsigned long t1 = micros();          // boshlanish vaqti\n\n    long a = 1234, b = 567;\n    long yigindi = a + b;\n    long kopaytma = a * b;\n    long bolinma  = a / b;\n    long qoldiq   = a % b;\n\n    unsigned long t2 = micros();\n\n    Serial.print(\"Yigindi: \");   Serial.println(yigindi);\n    Serial.print(\"Kopaytma: \");  Serial.println(kopaytma);\n    Serial.print(\"Bolinma: \");   Serial.print(bolinma);\n    Serial.print(\" qoldiq \");    Serial.println(qoldiq);\n    Serial.print(\"Hisob vaqti: \"); Serial.print(t2 - t1); Serial.println(\" us\");\n\n    delay(2000);\n}"],
  ["p","micros() funksiyasi ishga tushgandan beri o'tgan mikrosekundlarni qaytaradi. Ikki o'lchov farqi kod qismining bajarilish vaqtini beradi — bu turli amallarning narxini taqqoslashning sodda usuli. Ko'paytirish va bo'lish qo'shishdan sezilarli ko'proq vaqt olishini shu tarzda amalda ko'rish mumkin."],
  ["h","Interaktiv qism"],
  ["sim","port"],
  ["h","Topshiriqlar"],
  ["ol",["Sakkizta LED ni D2–D9 chiqishlariga ulang va sxemani chizing.","Yuguruvchi olov dasturini yuklang va tezligini o'zgartirib ko'ring.","Ikkilik hisoblagich dasturini yozing; Serial Monitor da o'nlik va o'n oltilik qiymatlarni solishtiring.","Variant raqamingiz N bo'lsin: hisoblagichni (10·N) dan boshlab 255 gacha sanaydigan qiling.","micros() yordamida qo'shish, ko'paytirish va bo'lish amallarining vaqtini o'lchang va jadvalga yozing.","LED toki multimetr bilan o'lchang va hisob bilan solishtiring.","Serial Monitor ekrani va yig'ilgan sxema rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Massiv va sikl ishlatish ko'p chiqishli qurilmalar kodini sezilarli qisqartiradi. bitRead funksiyasi baytni razryadlarga ajratib indikatorga chiqarish imkonini beradi. Serial port dastur ichidagi qiymatlarni kuzatishning eng qulay vositasi, micros() esa kod qismlarining bajarilish vaqtini bevosita o'lchashga imkon beradi."],
 ],

{
 id:"S2-M18", sem:2, week:3, type:"lecture", no:18,
 title:"Mikrokontrollerlarning apparat vositalari. Taymerlar",
 goal:"Taymer-hisoblagich modullarining tuzilishi, rejimlari va vaqt intervallarini hisoblash usullarini o'zlashtirish.",
 outcomes:["Taymer va hisoblagich rejimlarini farqlay oladi","Oldindan bo'luvchi (prescaler) ta'sirini hisoblay oladi","To'lib ketish davri va preload qiymatini hisoblay oladi","Taymer uzilishining ishlash tartibini tushuntira oladi"],
 plan:["Taymerning vazifasi","Taymer va hisoblagich rejimlari","Oldindan bo'luvchi","PIC16F877A taymerlari","Vaqt hisoblari","Taymer uzilishi"],
 body:[
  ["h","Taymerning vazifasi"],
  ["p","Taymer — impulslarni sanaydigan hisoblagich. Agar u ichki takt signalini sanasa, taymer rejimida ishlaydi va vaqtni o'lchaydi; tashqi kirishdan kelgan impulslarni sanasa, hisoblagich rejimida ishlaydi va hodisalar sonini yoki chastotani o'lchaydi."],
  ["p","Dasturiy kechikish (delay) protsessorni band qiladi va boshqa ishni bajarishga to'sqinlik qiladi. Taymer esa yadrodan mustaqil ishlaydi: protsessor asosiy vazifani bajarayotganda taymer fonda sanaydi va vaqt tugaganda uzilish beradi. Shu sababli real qurilmalarda vaqt intervallari taymer orqali shakllantiriladi."],
  ["fig","tmr","1-rasm. Taymer-hisoblagich modulining tuzilma sxemasi"],
  ["h","PIC16F877A taymerlari"],
  ["t",["Modul","Razryad","Bo'luvchi","Xususiyati"],[["Timer0","8","1:2 … 1:256","Ichki yoki tashqi manba (RA4), eng sodda"],["Timer1","16","1:1 … 1:8","Uyqu rejimida ham ishlay oladi, alohida kvarts ulash mumkin"],["Timer2","8","1:1, 1:4, 1:16","Solishtirish registri PR2 bilan, PWM uchun asos"]]],
  ["h","Vaqt hisoblari"],
  ["f","T_bir_qadam = 4 · K / f_osc","K — bo'luvchi qiymati. f = 8 MHz, K = 64 → 32 µs."],
  ["f","T_tolish = (2^n − preload) · 4 · K / f_osc","To'lib ketish davri."],
  ["f","preload = 2^n − T · f_osc / (4 · K)","Kerakli interval uchun boshlang'ich qiymat."],
  ["p","Misol 1. Timer0, 8 razryad, K = 256, f = 8 MHz. Bir qadam 128 µs, to'liq davr 256 · 128 µs = 32,8 ms."],
  ["p","Misol 2. 10 ms interval kerak, f = 8 MHz, K = 64. Qadamlar soni = 10 ms / 32 µs = 312,5 — bu 256 dan katta, demak 8 razryadli Timer0 yetmaydi. Yechim: K = 256 tanlanadi (qadam 128 µs), qadamlar soni 78, preload = 256 − 78 = 178."],
  ["c","; Timer0 ni 10 ms ga sozlash (f = 8 MHz)\n    OPTION_REG = 0x07;   /* ichki manba, bo'luvchi 1:256 */\n    TMR0 = 178;          /* preload */\n    T0IF = 0;            /* bayroqni tozalash */\n    while (!T0IF);       /* to'lishini kutish */"],
  ["h","Taymer uzilishi"],
  ["p","Taymer to'lib ketganda bayroq (T0IF, TMR1IF, TMR2IF) o'rnatiladi. Agar mos ruxsat biti (T0IE) va umumiy ruxsat GIE yoqilgan bo'lsa, uzilish hosil bo'ladi va dastur 0x0004 adresidagi xizmat qism dasturiga o'tadi. Bayroq apparat tomonidan tozalanmaydi — uni dasturda tozalash majburiy, aks holda uzilish cheksiz takrorlanadi."],
  ["c","void __interrupt() isr(void)\n{\n    if (T0IF)\n    {\n        T0IF = 0;            /* bayroqni tozalash — majburiy */\n        TMR0 = 178;          /* preload ni qayta yuklash     */\n        PORTBbits.RB0 = ~PORTBbits.RB0;   /* 10 ms da bir almashadi */\n    }\n}"],
  ["h","Taymerning amaliy qo'llanishi"],
  ["ul",["Aniq vaqt intervallarini shakllantirish (soat, sekundomer, taymer)","PWM signalini hosil qilish va dvigatel tezligini boshqarish","Chastota va impuls davomiyligini o'lchash","Klaviatura va datchiklarni davriy so'rov qilish jadvali","Dinamik indikatsiyada razryadlarni navbatlash","Watchdog kabi nazorat funksiyalari"]],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Taymer ichki taktni sanaganda vaqtni, tashqi impulslarni sanaganda hodisalarni o'lchaydi. Interval davomiyligi razryadlilik, bo'luvchi va preload qiymati bilan belgilanadi. Uzilish rejimi protsessorni bo'shatadi, ammo bayroqni dasturda tozalash va preload ni qayta yuklash majburiy qadamlar hisoblanadi."],
 ],

{
 id:"S2-L3", sem:2, week:3, type:"lab", no:3,
 title:"Arduino qurilmasida knopkalar bilan ishlash",
 goal:"Tugma signalini o'qish, ichki pull-up dan foydalanish, drebezgni filtrlash va bosishlarni hisoblash dasturini tuzish.",
 outcomes:[],
 plan:["Kirishni sozlash","Ichki pull-up","Drebezgni filtrlash","Front bo'yicha ishlov","Hisoblagich","Uzun bosish"],
 equip:["Arduino Uno va USB kabel","Tugmalar 3 dona","Rezistor 10 kΩ (ixtiyoriy), 330 Ω — 3 dona","LED 3 dona","Maket plata va ulash simlari"],
 body:[
  ["h","Nazariy qism"],
  ["p","Arduino da kirish uchta rejimda sozlanishi mumkin: INPUT (yuqori qarshilikli, tashqi rezistor kerak), INPUT_PULLUP (ichki tortuvchi rezistor yoqiladi) va OUTPUT. Amaliyotda INPUT_PULLUP eng qulay: tashqi rezistorsiz ishlaydi, tugma esa liniyani umumiy simga tortadi."],
  ["p","INPUT_PULLUP rejimida mantiq teskari bo'ladi: bosilmagan tugma HIGH, bosilgan tugma LOW beradi. Bu holatni kodda aniq izohlash xatolarning oldini oladi."],
  ["fig","btn","1-rasm. Tugmani kirish liniyasiga ulash va mantiqiy darajalar"],
  ["n","Xavfsizlik: tugmani 5 V va GND orasiga bevosita ulash qisqa tutashuv hosil qiladi. To'g'ri ulash — bir uchi kirish chiqishiga, ikkinchisi umumiy simga."],
  ["h","Sodda o'qish"],
  ["c","const int TUGMA = 2;\nconst int LED   = 8;\n\nvoid setup()\n{\n    pinMode(TUGMA, INPUT_PULLUP);   // ichki pull-up yoqiladi\n    pinMode(LED, OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    if (digitalRead(TUGMA) == LOW)   // LOW = bosilgan\n        digitalWrite(LED, HIGH);\n    else\n        digitalWrite(LED, LOW);\n}"],
  ["h","Front bo'yicha ishlov va drebezg filtri"],
  ["p","Ko'p vazifalarda tugmaning holati emas, balki bosilish payti (front) muhim. Buning uchun oldingi holat saqlanadi va joriy holat bilan taqqoslanadi. Drebezgni filtrlash uchun oxirgi o'zgarishdan beri o'tgan vaqt tekshiriladi — bu usul delay() dan farqli o'laroq dasturni bloklamaydi."],
  ["c","const int TUGMA = 2, LED = 8;\nint  oldingi = HIGH;\nbool led_holat = false;\nunsigned long oxirgi_vaqt = 0;\nconst unsigned long FILTR = 25;    // ms\nunsigned long hisob = 0;\n\nvoid setup()\n{\n    pinMode(TUGMA, INPUT_PULLUP);\n    pinMode(LED, OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    int hozir = digitalRead(TUGMA);\n\n    if (hozir != oldingi && (millis() - oxirgi_vaqt) > FILTR)\n    {\n        oxirgi_vaqt = millis();\n\n        if (hozir == LOW)              // tushuvchi front = bosildi\n        {\n            led_holat = !led_holat;    // holatni almashtirish\n            digitalWrite(LED, led_holat);\n            hisob++;\n            Serial.print(\"Bosishlar soni: \");\n            Serial.println(hisob);\n        }\n        oldingi = hozir;\n    }\n}"],
  ["p","millis() funksiyasi ishga tushgandan beri o'tgan millisekundlarni qaytaradi. Uning yordamida kutish jarayoni protsessorni band qilmaydi: dastur sikl davomida boshqa vazifalarni ham bajara oladi. Bu real qurilmalar uchun asosiy yondashuv hisoblanadi."],
  ["h","Uzun va qisqa bosishni ajratish"],
  ["c","unsigned long bosilgan_vaqt = 0;\n\nvoid loop()\n{\n    int hozir = digitalRead(TUGMA);\n\n    if (hozir == LOW && oldingi == HIGH)          // endi bosildi\n        bosilgan_vaqt = millis();\n\n    if (hozir == HIGH && oldingi == LOW)          // qo'yib yuborildi\n    {\n        unsigned long davomiyligi = millis() - bosilgan_vaqt;\n        if (davomiyligi > 1000)  Serial.println(\"Uzun bosish\");\n        else if (davomiyligi > 30) Serial.println(\"Qisqa bosish\");\n    }\n    oldingi = hozir;\n}"],
  ["h","Interaktiv qism"],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",["Uchta tugmani D2, D3, D4 chiqishlariga INPUT_PULLUP rejimida ulang va sxemani chizing.","Sodda o'qish dasturini yuklab, tugma bosilgan holatdagi Serial Monitor qiymatini yozib oling.","Filtrsiz holatda bosishlar sonini hisoblang va drebezg tufayli qancha ortiqcha hisoblanganini qayd eting.","millis() asosidagi filtrni qo'shib, natijani jadvalda taqqoslang.","Variant raqamingiz N bo'lsin: filtr vaqtini (10 + 2·N) ms qilib o'zgartiring va ishonchli chegarani aniqlang.","Uzun va qisqa bosishni ajratuvchi dasturni yozing va uch xil vazifani (yoqish, o'chirish, rejim almashtirish) biriktiring.","delay() va millis() yondashuvlarini bloklash nuqtai nazaridan taqqoslab, xulosa yozing.","Serial Monitor va sxema rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","INPUT_PULLUP rejimi tashqi rezistorsiz ishonchli kirish hosil qiladi, bunda bosilgan holat LOW ga mos keladi. Front bo'yicha ishlov holat o'zgarishini aniqlash imkonini beradi, millis() asosidagi filtr esa drebezgni dasturni bloklamasdan bartaraf etadi. Bosish davomiyligini o'lchash bitta tugmaga bir necha vazifa biriktirishga imkon beradi."],
 ],

{

 title:"Mikrokontrollerning tashqi muhit bilan va vaqt bo'yicha aloqasi",
 goal:"Mikrokontrollerning datchiklar va ijro mexanizmlari bilan bog'lanishini hamda vaqt bo'yicha muvofiqlashtirish usullarini o'zlashtirish.",
 outcomes:["Kirish va chiqish signallarini moslashtirish usullarini tanlay oladi","So'rov, uzilish va taymer bo'yicha ishlash usullarini qiyoslay oladi","Vazifalar jadvalini tuza oladi","Real vaqt talablarini dastur tuzilmasiga o'tkaza oladi"],
 plan:["Tashqi muhit bilan bog'lanish","Kirish signallarini moslashtirish","Chiqish tugunlari","Vaqt bo'yicha muvofiqlashtirish","Vazifalar jadvali","Kechikish va jitter"],
 body:[
  ["h","Tashqi muhit bilan bog'lanish"],
  ["p","Mikrokontroller tashqi muhitni datchiklar orqali \"sezadi\" va ijro mexanizmlari orqali unga ta'sir ko'rsatadi. Ikkala yo'nalishda ham signal darajalarini, quvvatini va turini moslashtirish talab qilinadi — mikrokontroller faqat 0…5 V oralig'idagi kichik quvvatli raqamli signallar bilan ishlay oladi."],

  ["t",["Signal turi","Manbaga misol","Moslashtirish usuli"],[["Raqamli daraja","Tugma, kalit, optik datchik","Tortuvchi rezistor, Shmitt trigger"],["Analog kuchlanish","LM35, potensiometr","Bo'luvchi, filtr, ADC kirishi"],["Qarshilik o'zgarishi","NTC, fotorezistor","Kuchlanish bo'luvchi zanjiri"],["Tok signali 4–20 mA","Sanoat datchiklari","O'lchov rezistori (masalan 250 Ω)"],["Chastota yoki impuls","Aylanish datchigi, hisoblagich","Taymer-hisoblagich kirishi"],["Ketma-ket kod","DS18B20, I2C datchiklar","Interfeys moduli"]]],
  ["h","Kirish signallarini himoyalash"],
  ["ul",["Kirish diodlari — ruxsat etilgan kuchlanishdan oshib ketishdan himoya","Ketma-ket rezistor — tokni cheklaydi va diodlar bilan birgalikda ishlaydi","RC filtr — impuls shovqinini yutadi","Optron — galvanik ajratish, yuqori kuchlanishli zanjirlar uchun majburiy","Gisterezisli kirish — chegara atrofidagi chirsillashni yo'qotadi"]],
  ["h","Chiqish tugunlari"],
  ["p","Chiqishga ulanadigan yuklama toki port chegarasidan oshsa, oraliq kalit qo'yiladi: bipolyar tranzistor, MOSFET yoki drayver mikrosxema. Induktiv yuklama (rele, dvigatel, klapan) uchun teskari ulangan diod majburiy. Tarmoq kuchlanishidagi yuklama esa faqat optron va simistor yoki rele orqali boshqariladi."],
  ["h","Vaqt bo'yicha muvofiqlashtirish"],
  ["t",["Usul","Mohiyati","Afzalligi","Kamchiligi"],[["Dasturiy so'rov (polling)","Holat sikl ichida davriy tekshiriladi","Sodda, qo'shimcha resurs kerak emas","Javob vaqti sikl davomiyligiga bog'liq"],["Uzilish","Hodisa yuz berganda xizmat chaqiriladi","Tez va aniq javob","Dastur murakkablashadi, resurs almashinuvi muammosi"],["Taymer bo'yicha jadval","Har bir vazifa o'z davri bilan chaqiriladi","Bir necha vazifani tartibli bajarish","Jadvalni loyihalash talab qilinadi"],["DMA","Ma'lumot protsessorsiz uzatiladi","Yadroni butunlay bo'shatadi","Hamma mikrokontrollerda yo'q"]]],
  ["c","/* Taymer bo'yicha vazifalar jadvali */\nvolatile uint16_t tick = 0;      /* har 1 ms da uzilishda oshadi */\n\nvoid loop_asosiy(void)\n{\n    static uint16_t t10 = 0, t100 = 0, t1000 = 0;\n\n    if (tick - t10 >= 10)     { t10 = tick;     tugmalarni_oqish(); }\n    if (tick - t100 >= 100)   { t100 = tick;    haroratni_olchash(); }\n    if (tick - t1000 >= 1000) { t1000 = tick;   ekranni_yangilash(); }\n}"],
  ["p","Bu tuzilmada har bir vazifa o'z davriga ega: tugmalar 10 ms da, o'lchash 100 ms da, indikatsiya 1 s da bajariladi. Uzilish esa faqat hisoblagichni oshiradi va shu sababli juda qisqa bo'ladi."],
  ["h","Kechikish va jitter"],
  ["f","t_javob = t_aniqlash + t_ishlov + t_ijro","Tizimning to'liq javob vaqti."],
  ["p","Polling usulida javob vaqti eng yomon holatda asosiy sikl davomiyligiga teng bo'ladi. Uzilishda esa u uzilish kechikishi (bir necha takt) va xizmat qism dasturining uzunligi bilan aniqlanadi. Javob vaqtining takrorlanishdan takrorlanishga o'zgarishi jitter deb ataladi va aniq vaqtli o'lchashlarda u xatoga aylanadi."],
  ["n","Uzilishlar bir-birini kechiktiradi: uzun xizmat qism dasturi boshqa hodisalarning javob vaqtini oshiradi. Shuning uchun ISR ichida faqat bayroq o'rnatiladi yoki qiymat o'qiladi, asosiy ishlov esa loop() da bajariladi."],

 id:"S2-L4", sem:2, week:4, type:"lab", no:4,
 title:"Arduino qurilmasida sekundomer qurilmasini loyihalash",
 goal:"Vaqtni millis() asosida aniq o'lchash, start/stop/reset boshqaruvini va natijani indikatorga chiqarishni o'zlashtirish.",
 outcomes:[],
 plan:["Sekundomer mantiqi","millis() bilan vaqt o'lchash","Holatlar mashinasi","Boshqaruv tugmalari","Formatlab chiqarish","Aniqlikni baholash"],
 equip:["Arduino Uno va USB kabel","Tugmalar 2 dona","LCD 16×2 yoki Serial Monitor","Rezistorlar, maket plata, simlar"],
 body:[
  ["h","Nazariy qism"],
  ["p","Sekundomer — ikki hodisa orasidagi vaqtni o'lchaydigan qurilma. Uning mantiqi uchta holatdan iborat: to'xtagan, sanayotgan va pauzada. Bunday vazifalar holatlar mashinasi (state machine) ko'rinishida yozilganda kod tartibli va kengaytirishga qulay bo'ladi."],
  ["p","Vaqt delay() bilan emas, millis() bilan o'lchanadi. delay() protsessorni bloklaydi va tugmalarni o'qishga imkon bermaydi; millis() esa fonda ishlaydigan taymerga tayanadi va sanash davomida boshqa vazifalarni bajarishga to'sqinlik qilmaydi."],
  ["f","o'tgan_vaqt = millis() − boshlanish + yig'ilgan","Pauzadan keyin davom ettirish uchun avvalgi qismlar yig'ib boriladi."],
  ["h","Dastur"],
  ["c","const int START_STOP = 2;\nconst int RESET_TUGMA = 3;\n\nenum Holat { TOXTAGAN, SANAYOTGAN };\nHolat holat = TOXTAGAN;\n\nunsigned long boshlanish = 0;     // sanash boshlangan payt\nunsigned long yigilgan   = 0;     // avvalgi qismlar yig'indisi\nunsigned long oxirgi_bosish = 0;\nconst unsigned long FILTR = 30;\n\nunsigned long otgan()\n{\n    if (holat == SANAYOTGAN) return yigilgan + (millis() - boshlanish);\n    return yigilgan;\n}\n\nvoid setup()\n{\n    pinMode(START_STOP, INPUT_PULLUP);\n    pinMode(RESET_TUGMA, INPUT_PULLUP);\n    Serial.begin(9600);\n    Serial.println(\"Sekundomer tayyor\");\n}\n\nvoid loop()\n{\n    // --- boshqaruv tugmalari ---\n    if (digitalRead(START_STOP) == LOW && millis() - oxirgi_bosish > FILTR)\n    {\n        oxirgi_bosish = millis();\n        if (holat == TOXTAGAN) { boshlanish = millis(); holat = SANAYOTGAN; }\n        else                   { yigilgan = otgan();   holat = TOXTAGAN;   }\n        while (digitalRead(START_STOP) == LOW);   // qo'yib yuborishni kutish\n    }\n\n    if (digitalRead(RESET_TUGMA) == LOW && millis() - oxirgi_bosish > FILTR)\n    {\n        oxirgi_bosish = millis();\n        holat = TOXTAGAN;\n        yigilgan = 0;\n        while (digitalRead(RESET_TUGMA) == LOW);\n    }\n\n    // --- ko'rsatish (har 100 ms da) ---\n    static unsigned long oxirgi_chiqish = 0;\n    if (millis() - oxirgi_chiqish >= 100)\n    {\n        oxirgi_chiqish = millis();\n        unsigned long t = otgan();\n        unsigned int  daq = t / 60000UL;\n        unsigned int  sek = (t / 1000UL) % 60;\n        unsigned int  yuz = (t % 1000UL) / 10;\n\n        Serial.print(daq < 10 ? \"0\" : \"\"); Serial.print(daq); Serial.print(':');\n        Serial.print(sek < 10 ? \"0\" : \"\"); Serial.print(sek); Serial.print('.');\n        Serial.print(yuz < 10 ? \"0\" : \"\"); Serial.println(yuz);\n    }\n}"],
  ["h","Formatlash mantiqi"],
  ["t",["Kattalik","Hisoblash","Namuna (t = 93 456 ms)"],[["Daqiqa","t / 60000","1"],["Sekund","(t / 1000) % 60","33"],["Yuzdan bir","(t % 1000) / 10","45"],["Natija","—","01:33.45"]]],
  ["h","Aniqlikni baholash"],
  ["p","millis() ning aniqligi plata kvarts rezonatorining aniqligi bilan belgilanadi. 16 MHz kvartsning tipik xatosi ±50 ppm ni tashkil qiladi — bu bir soatda taxminan 0,18 sekund og'ish degani. Qisqa o'lchashlar uchun bu xato ahamiyatsiz, uzoq muddatli soat uchun esa alohida aniq vaqt moduli (RTC) ishlatiladi."],
  ["n","millis() taxminan 49,7 kunda to'lib ketadi va noldan boshlanadi. Vaqt farqini unsigned long turi bilan hisoblash (millis() − oldingi) bu holatda ham to'g'ri natija beradi — shuning uchun vaqtni doim farq sifatida hisoblash kerak, bevosita taqqoslash emas."],
  ["sim","timer"],
  ["h","Topshiriqlar"],
  ["ol",["Ikkita tugmani D2 va D3 ga ulang, sxemani chizing va INPUT_PULLUP rejimida sozlang.","Sekundomer dasturini yuklang; start, stop va davom ettirish funksiyalarini tekshiring.","Ko'rsatkichni etalon sekundomer (telefon) bilan 60 sekund davomida solishtiring va farqni yozing.","Variant raqamingiz N bo'lsin: ko'rsatishni yangilash davrini (50 + 10·N) ms qiling va farqni kuzating.","Natijani LCD ga chiqaruvchi qismni qo'shing.","Oraliq natijani saqlash (lap) funksiyasini uchinchi tugma bilan qo'shing.","Sxema va o'lchash natijalari rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Sekundomer holatlar mashinasi sifatida qurilganda mantiq aniq va kengaytirishga qulay bo'ladi. Vaqt millis() farqi orqali hisoblanadi, pauzadan keyin davom ettirish uchun esa avvalgi qismlar yig'ib boriladi. O'lchash aniqligi kvarts rezonatorining barqarorligi bilan cheklanadi."],
 ],

  {q:"otgan() funksiyasi to'xtagan holatda nimani qaytaradi?",o:["millis() − boshlanish qiymatini qaytaradi","Faqat yigilgan qiymatini qaytaradi","Nol qiymat qaytaradi, chunki sanash to'xtagan","Boshlanish vaqtining o'zini qaytaradi"]},
  {q:"START_STOP tugmasi to'xtagan holatda bosilsa nima bo'ladi?",o:["yigilgan = otgan() va holat TOXTAGAN da qoladi","Faqat ko'rsatish yangilanadi, holat o'zgarmaydi","boshlanish = millis() va holat SANAYOTGAN ga o'tadi","yigilgan nollanib, hisob boshidan boshlanadi"]},
  {q:"START_STOP tugmasi sanayotgan holatda bosilsa nima sodir bo'ladi?",o:["yigilgan nollanib, hisob boshidan boshlanadi","boshlanish = millis() va holat SANAYOTGAN da qoladi","Dastur to'xtab, Serial port yopilib qoladi","yigilgan = otgan() va holat TOXTAGAN ga o'tadi"]},

  {q:"while (digitalRead(START_STOP) == LOW); qatori nima uchun qo'yilgan?",o:["Tugma qo'yib yuborilishini kutish uchun qo'yilgan","Serial portga xabar yuborish uchun qo'yilgan","Drebezg filtri vaqtini hosil qilish uchun qo'yilgan","Vaqtni aniq o'lchab borish uchun qo'yilgan"]},

  {q:"Ko'rsatish qanday davriylikda yangilanadi?",o:["Har 30 ms da yangilanadi","Har 1000 ms da yangilanadi","Har 100 ms da yangilanadi","Har uzilishda, 1 ms da yangilanadi"]},

{
 id:"S2-L5", sem:2, week:5, type:"lab", no:5,
 title:"Arduino qurilmasida taymer qurilmasini loyihalash",
 goal:"Teskari sanoq taymerini loyihalash, vaqtni tugmalar bilan sozlash va tugaganda signal berishni o'zlashtirish.",
 outcomes:[],
 plan:["Sekundomer va taymer farqi","Vaqtni sozlash","Teskari sanoq","Tugash signali","Apparat taymer uzilishi","Aniqlikni oshirish"],
 equip:["Arduino Uno va USB kabel","Tugmalar 3 dona","Zumzuma yoki LED","LCD 16×2 (ixtiyoriy)","Rezistorlar va simlar"],
 body:[
  ["h","Nazariy qism"],
  ["p","Sekundomer o'tgan vaqtni oldinga sanaydi, taymer esa berilgan vaqtdan noldan tomon teskari sanaydi va nolga yetganda hodisa hosil qiladi. Loyihalash nuqtai nazaridan farq kichik, ammo taymerda qo'shimcha ikki vazifa paydo bo'ladi: boshlang'ich vaqtni kiritish va tugash signalini berish."],
  ["f","qolgan = belgilangan − (millis() − boshlanish)","Teskari sanoq formulasi; natija manfiy bo'lib ketmasligi uchun tekshiriladi."],
  ["h","Dastur"],
  ["c","const int START = 2, PLUS = 3, MINUS = 4;\nconst int ZUMZUMA = 8;\n\nenum Holat { SOZLASH, SANASH, TUGADI };\nHolat holat = SOZLASH;\n\nunsigned long belgilangan = 60000UL;   // 60 s\nunsigned long boshlanish  = 0;\nunsigned long oxirgi = 0;\nconst unsigned long FILTR = 30;\n\nbool bosildi(int pin)\n{\n    if (digitalRead(pin) == LOW && millis() - oxirgi > FILTR)\n    {\n        oxirgi = millis();\n        while (digitalRead(pin) == LOW);\n        return true;\n    }\n    return false;\n}\n\nvoid setup()\n{\n    pinMode(START, INPUT_PULLUP);\n    pinMode(PLUS,  INPUT_PULLUP);\n    pinMode(MINUS, INPUT_PULLUP);\n    pinMode(ZUMZUMA, OUTPUT);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    switch (holat)\n    {\n        case SOZLASH:\n            if (bosildi(PLUS))  belgilangan += 10000UL;            // +10 s\n            if (bosildi(MINUS) && belgilangan > 10000UL)\n                                belgilangan -= 10000UL;\n            if (bosildi(START)) { boshlanish = millis(); holat = SANASH; }\n            break;\n\n        case SANASH:\n        {\n            unsigned long otgan = millis() - boshlanish;\n            if (otgan >= belgilangan) { holat = TUGADI; break; }\n            unsigned long qolgan = belgilangan - otgan;\n            static unsigned long oxirgi_chiqish = 0;\n            if (millis() - oxirgi_chiqish >= 250)\n            {\n                oxirgi_chiqish = millis();\n                Serial.print(\"Qolgan: \");\n                Serial.print(qolgan / 60000UL); Serial.print(':');\n                Serial.println((qolgan / 1000UL) % 60);\n            }\n            if (bosildi(START)) holat = SOZLASH;    // bekor qilish\n            break;\n        }\n\n        case TUGADI:\n            for (int i = 0; i < 6; i++)\n            {\n                digitalWrite(ZUMZUMA, HIGH); delay(200);\n                digitalWrite(ZUMZUMA, LOW);  delay(200);\n            }\n            Serial.println(\"Vaqt tugadi\");\n            holat = SOZLASH;\n            break;\n    }\n}"],
  ["h","Apparat taymer uzilishi bilan variant"],
  ["p","millis() ga tayanish ko'p vazifalarda yetarli, ammo aniq davriy amallar uchun apparat taymer uzilishi afzal. ATmega328P da Timer1 ni sozlab, aniq 1 sekundlik uzilish olish mumkin."],

{
 id:"S2-L6", sem:2, week:6, type:"lab", no:6,
 title:"Arduino qurilmasida svetofor qurilmasini loyihalash",
 goal:"Ko'p fazali vaqt diagrammasiga ega boshqarish qurilmasini holatlar mashinasi asosida loyihalash.",
 outcomes:[],
 plan:["Svetofor algoritmi","Fazalar diagrammasi","Holatlar mashinasi","Bloklanmaydigan amalga oshirish","Piyoda rejimi","Ikki yo'nalishli svetofor"],
 equip:["Arduino Uno va USB kabel","LED: qizil, sariq, yashil (2 to'plam)","Rezistor 330 Ω — 6 dona","Tugma (piyoda uchun)","Maket plata va simlar"],
 body:[
  ["h","Nazariy qism"],
  ["p","Svetofor — belgilangan vaqt diagrammasi bo'yicha ishlaydigan ko'p fazali boshqarish qurilmasi. U real avtomatlashtirish masalalarining klassik namunasi: fazalar ketma-ketligi qat'iy, har birining davomiyligi belgilangan va tashqi hodisa (piyoda tugmasi) siklga aralasha oladi."],
  ["t",["Faza","Chiroqlar","Davomiyligi","Kod (Q S Y)"],[["1","Qizil","5 s","1 0 0"],["2","Qizil + sariq","2 s","1 1 0"],["3","Yashil","4 s","0 0 1"],["4","Yashil miltillash","2 s","0 0 ~"],["5","Sariq","2 s","0 1 0"]]],
  ["h","Bloklanmaydigan amalga oshirish"],
  ["p","delay() bilan yozilgan svetofor ishlaydi, lekin piyoda tugmasini o'qiy olmaydi: dastur kechikish ichida qotib turadi. Shuning uchun fazalar millis() va holatlar mashinasi orqali amalga oshiriladi — bu real boshqarish qurilmalarining standart yondashuvi."],
  ["c","const int QIZIL = 8, SARIQ = 9, YASHIL = 10;\nconst int TUGMA = 2;\n\nstruct Faza { byte q, s, y; unsigned long vaqt; };\n\nFaza fazalar[] = {\n    {1, 0, 0, 5000},   // qizil\n    {1, 1, 0, 2000},   // qizil + sariq\n    {0, 0, 1, 4000},   // yashil\n    {0, 1, 0, 2000}    // sariq\n};\nconst int FAZA_SONI = 4;\n\nint faza = 0;\nunsigned long faza_boshi = 0;\nbool sorov = false;      // piyoda so'rovi\n\nvoid fazani_qoy(int i)\n{\n    digitalWrite(QIZIL,  fazalar[i].q);\n    digitalWrite(SARIQ,  fazalar[i].s);\n    digitalWrite(YASHIL, fazalar[i].y);\n}\n\nvoid setup()\n{\n    pinMode(QIZIL, OUTPUT); pinMode(SARIQ, OUTPUT); pinMode(YASHIL, OUTPUT);\n    pinMode(TUGMA, INPUT_PULLUP);\n    faza_boshi = millis();\n    fazani_qoy(0);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    // tugma har doim o'qiladi — dastur bloklanmagan\n    if (digitalRead(TUGMA) == LOW) sorov = true;\n\n    unsigned long davom = fazalar[faza].vaqt;\n\n    // piyoda so'ragan bo'lsa yashil fazani qisqartiramiz\n    if (sorov && faza == 2) davom = 1500;\n\n    if (millis() - faza_boshi >= davom)\n    {\n        faza = (faza + 1) % FAZA_SONI;\n        faza_boshi = millis();\n        fazani_qoy(faza);\n        if (faza == 0) sorov = false;    // qizil fazaga o'tildi, so'rov bajarildi\n        Serial.print(\"Faza: \"); Serial.println(faza + 1);\n    }\n}"],
  ["p","Fazalar massiv va struktura ko'rinishida saqlangani uchun yangi faza qo'shish yoki vaqtni o'zgartirish faqat jadvalni tahrirlashdan iborat — kod mantiqiga tegish kerak emas. Bu yondashuv sanoat kontrollerlarida keng qo'llanadi."],
  ["n","Xavfsizlik mantiqi: ikki yo'nalishli svetoforda hech qachon ikkala yo'nalishda bir vaqtda yashil yonmasligi kerak. Shuning uchun fazalar jadvali ikkala yo'nalish uchun birga tuziladi va oraliq qizil faza (hamma yo'nalish qizil) qo'shiladi."],
  ["h","Ikki yo'nalishli svetofor"],
  ["t",["Faza","A yo'nalish","B yo'nalish","Vaqt"],[["1","Yashil","Qizil","6 s"],["2","Sariq","Qizil","2 s"],["3","Qizil","Qizil","1 s"],["4","Qizil","Yashil","6 s"],["5","Qizil","Sariq","2 s"],["6","Qizil","Qizil","1 s"]]],
  ["h","Interaktiv qism"],
  ["sim","traffic"],
  ["h","Topshiriqlar"],
  ["ol",["Uchta LED ni D8–D10 ga rezistorlar orqali ulang va sxemani chizing.","Fazalar jadvali asosidagi dasturni yuklang va vaqtlarni ossillograf yoki sekundomer bilan tekshiring.","Variant raqamingiz N bo'lsin: yashil faza davomiyligini (4 + N) sekund qiling.","Piyoda tugmasini qo'shing va so'rov bajarilishini kuzating.","Yashil fazaning oxirgi 2 sekundida miltillash rejimini qo'shing.","Ikki yo'nalishli svetoforni oltita LED bilan amalga oshiring va xavfsizlik shartini tekshiring.","delay() va millis() variantlarini tugmaga javob berish nuqtai nazaridan taqqoslang.","Sxema va ishlayotgan qurilma rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Svetofor fazalar jadvali va holatlar mashinasi asosida qurilganda kod tartibli bo'ladi va vaqtlarni o'zgartirish faqat jadvalni tahrirlashdan iborat. millis() asosidagi bloklanmaydigan yondashuv tashqi hodisalarga (piyoda tugmasi) javob berish imkonini beradi. Ko'p yo'nalishli tizimda xavfsizlik sharti — bir vaqtda ikki yashil bo'lmasligi — jadval tuzilishida ta'minlanadi."],
 ],
 tests:[
  {q:"Nima uchun svetofor dasturida delay() tavsiya etilmaydi?",o:["Aniq emasligi uchun","Dastur bloklanib, tugmani o'qiy olmagani uchun","Xotira sarflagani uchun","Kod uzayishi uchun"]},
  {q:"Fazalarni massiv va struktura ko'rinishida saqlashning afzalligi nimada?",o:["Tezroq ishlaydi","Vaqt va fazalarni o'zgartirish faqat jadvalni tahrirlashdan iborat bo'lishi","Kam tok sarflashi","Xotira tejashi"]},

  {q:"Piyoda so'rovi qanday qayd etiladi?",o:["Fazani darhol o'zgartirib","Bayroq o'zgaruvchisiga yozib, keyin hisobga olinadi","Dasturni to'xtatib","Uzilish bilan faqat"]},

  {q:"Oraliq \"hamma qizil\" fazasi nima uchun kerak?",o:["Quvvat tejash uchun","Kesishmani bo'shatish uchun xavfsizlik oralig'i","Indikatsiya uchun","Tugmani o'qish uchun"]},

  ["h","Real vaqt tushunchasi"],
  ["t",["Turi","Muddat buzilsa","Namuna"],[["Qattiq real vaqt","Avariya, tizim ishdan chiqadi","Dvigatel boshqaruvi, xavfsizlik tizimlari"],["Qat'iy real vaqt","Natija foydasiz bo'lib qoladi","Radar ma'lumotini qayta ishlash"],["Yumshoq real vaqt","Sifat pasayadi, ish davom etadi","Indikator yangilanishi, tovush"]]],
  ["p","Muhim nuqta: real vaqt tizimi eng tez tizim degani emas. U natijani kafolatlangan vaqt ichida beradigan tizim. Shuning uchun RTOS da eng yomon holatdagi javob vaqti (worst-case) hisoblanadi va u talab qilingan muddatdan kichik bo'lishi tekshiriladi."],
  ["h","RTOS ning asosiy tushunchalari"],
  ["ul",["Vazifa (task) — mustaqil bajariladigan dastur bo'lagi, o'z steki va holatiga ega","Vazifa holatlari — bajarilmoqda, tayyor, bloklangan, to'xtatilgan","Prioritet — vazifaning muhimligi; yuqori prioritetli vazifa pastini uzib qo'ya oladi","Rejalashtiruvchi — qaysi vazifa hozir bajarilishini tanlaydi","Kontekstni almashtirish — joriy vazifa registrlari saqlanib, yangisiniki tiklanadi","Tizim takti (tick) — taymer uzilishi, rejalashtiruvchining vaqt asosi"]],
  ["t",["Rejalashtirish usuli","Mohiyati","Xususiyati"],[["Kooperativ","Vazifa boshqaruvni o'zi qaytaradi","Sodda, lekin bitta vazifa hammani bloklashi mumkin"],["Vaqt kvanti bo'yicha (round-robin)","Har bir vazifaga teng vaqt beriladi","Adolatli, real vaqt kafolati yo'q"],["Prioritet bo'yicha uzuvchi","Yuqori prioritetli vazifa darhol bajariladi","Real vaqt tizimlarining asosiy usuli"]]],
  ["h","Vazifalar o'rtasidagi aloqa"],
  ["p","Bir necha vazifa bitta resursdan (port, interfeys, bufer) foydalanganda ularning ishini muvofiqlashtirish kerak bo'ladi. Buning uchun RTOS maxsus vositalarni taqdim etadi."],
  ["ul",["Semafor — resursdan bir vaqtda faqat bitta vazifa foydalanishini ta'minlaydi","Muteks — semaforning maxsus turi, resursni qulflash uchun","Xabarlar navbati (queue) — vazifalar o'rtasida ma'lumot uzatish","Hodisa bayroqlari — vazifani hodisa yuz berguncha bloklash","Tanqidiy soha — uzilishlar vaqtincha taqiqlanadigan qisqa kod bo'lagi"]],
  ["n","Prioritet inversiyasi — RTOS dagi klassik muammo: past prioritetli vazifa resursni band qilganda, yuqori prioritetli vazifa uni kutishga majbur bo'ladi. Yechim sifatida prioritetni vaqtincha ko'tarish (priority inheritance) mexanizmi qo'llanadi."],
  ["h","Mikrokontrollerlar uchun RTOS"],
  ["p","Kichik mikrokontrollerlar uchun yengil RTOS lar ishlatiladi: FreeRTOS, uC/OS, ChibiOS, Zephyr. Ular bir necha kilobayt Flash va yuzlab bayt SRAM talab qiladi. Har bir vazifa o'z stekiga ega bo'lgani uchun SRAM sarfi vazifalar soniga proporsional ortadi."],
  ["c","/* FreeRTOS uslubidagi tuzilma */\nvoid vOlchash(void *p)      { for(;;) { olchash(); vTaskDelay(100); } }\nvoid vIndikatsiya(void *p)  { for(;;) { ekran(); vTaskDelay(500); } }\n\nint main(void)\n{\n    sozlash();\n    xTaskCreate(vOlchash,     \"olch\", 128, NULL, 3, NULL);   /* prioritet 3 */\n    xTaskCreate(vIndikatsiya, \"ekr\",  128, NULL, 1, NULL);   /* prioritet 1 */\n    vTaskStartScheduler();\n    for(;;);\n}"],
  ["p","vTaskDelay() funksiyasi delay() dan tubdan farq qiladi: u protsessorni bo'shatadi va shu vaqt ichida boshqa vazifalar bajariladi. Aynan shu xususiyat RTOS ning asosiy afzalligi hisoblanadi."],
  ["h","Qobiqlar va servis tizimlari"],
  ["t",["Vosita","Vazifasi"],[["Monitor dasturi","Kristalldagi eng sodda qobiq: xotirani ko'rish, o'zgartirish, dasturni ishga tushirish"],["Bootloader","Yangi dasturni interfeys orqali qabul qilib, Flash ga yozadi"],["Buyruqlar qobig'i (CLI)","UART orqali matnli buyruqlar bilan qurilmani boshqarish"],["Diagnostika moduli","O'z-o'zini tekshirish: xotira, datchiklar, interfeyslar"],["Konfiguratsiya xizmati","Sozlamalarni EEPROM da saqlash va tiklash"],["Jurnal (log) xizmati","Hodisalar va xatolarni qayd etish"]]],
  ["p","Servis tizimlari qurilmaning asosiy vazifasiga bevosita aloqador bo'lmasa-da, uni ishga tushirish, sozlash va nosozlikni topishni sezilarli osonlashtiradi. Ishlab chiqarishda esa ular sinov va kalibrlash jarayonining asosi bo'lib xizmat qiladi."],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Vazifalar soni va ularning vaqt talablari ortganda super loop tuzilmasi yetarli bo'lmay qoladi va real vaqt operatsion tizimiga ehtiyoj tug'iladi. RTOS vazifalarni prioritet bo'yicha rejalashtiradi, ular o'rtasidagi aloqani semafor va navbatlar orqali tashkil qiladi. Servis tizimlari — monitor, bootloader, CLI va diagnostika — qurilmani sozlash va xizmat ko'rsatishni osonlashtiradi."],
 ],

{
 id:"S2-L7", sem:2, week:7, type:"lab", no:7,
 title:"7 segmentli indikatorga berilgan axborotni chiqarish",
 goal:"7-segmentli indikatorning ulash sxemalarini, segment kodlarini va dinamik indikatsiya usulini o'zlashtirish.",
 outcomes:[],
 plan:["Indikator tuzilishi","Umumiy anod va katod","Segment kodlari","Statik indikatsiya","Dinamik indikatsiya","Ko'p razryadli son chiqarish"],
 equip:["Arduino Uno va USB kabel","7-segmentli indikator (1 va 4 razryadli)","Rezistor 220–330 Ω — 8 dona","Tranzistorlar (razryad kalitlari uchun)","Maket plata va simlar"],
 body:[
  ["h","Nazariy qism"],
  ["p","7-segmentli indikator yettita chiziqli segment (a…g) va nuqtadan (dp) iborat. Har bir segment alohida LED bo'lib, kerakli segmentlar kombinatsiyasini yoqish orqali 0 dan 9 gacha raqamlar va ba'zi harflar hosil qilinadi."],
  ["fig","seg7w","1-rasm. 7-segmentli indikatorning ulanish sxemasi va dinamik indikatsiya"],
  ["t",["Ulanish turi","Umumiy chiqish","Segment yonadi","Kod"],[["Umumiy katod","GND ga ulanadi","Segmentga 1 berilganda","To'g'ri"],["Umumiy anod","+5 V ga ulanadi","Segmentga 0 berilganda","Inversiyalangan"]]],
  ["p","Har bir segment uchun tok cheklovchi rezistor majburiy. Sakkizta segment bir vaqtda yonganda umumiy tok 8 · 10 mA = 80 mA ga yetadi, shuning uchun ko'p razryadli indikatorda razryadlar tranzistor kalitlari orqali ulanadi."],
  ["h","Segment kodlari"],
  ["c","/* Umumiy katod uchun kodlar: bitlar dp g f e d c b a tartibida */\nconst byte kod[10] = {\n    0x3F, // 0 : a b c d e f\n    0x06, // 1 : b c\n    0x5B, // 2 : a b g e d\n    0x4F, // 3 : a b g c d\n    0x66, // 4 : f g b c\n    0x6D, // 5 : a f g c d\n    0x7D, // 6 : a f g e d c\n    0x07, // 7 : a b c\n    0x7F, // 8 : barcha segmentlar\n    0x6F  // 9 : a b c d f g\n};\n/* Umumiy anod uchun: ~kod[i] (inversiya) */"],
  ["h","Statik indikatsiya"],
  ["c","const int segment[8] = {2,3,4,5,6,7,8,9};   // a,b,c,d,e,f,g,dp\n\nvoid setup()\n{\n    for (int i = 0; i < 8; i++) pinMode(segment[i], OUTPUT);\n}\n\nvoid raqam_chiqar(byte n)\n{\n    byte b = kod[n];\n    for (int i = 0; i < 8; i++)\n        digitalWrite(segment[i], bitRead(b, i));\n}\n\nvoid loop()\n{\n    for (byte n = 0; n < 10; n++) { raqam_chiqar(n); delay(700); }\n}"],
  ["h","Dinamik indikatsiya"],
  ["p","To'rt razryadli indikatorda har bir razryadga alohida 8 ta liniya ajratish 32 ta chiqishni talab qiladi — bu amalda mumkin emas. Dinamik indikatsiyada segment liniyalari umumiy qilinadi, razryadlar esa navbat bilan qisqa vaqtga yoqiladi. Almashinuv 50 Hz dan tez bo'lsa, ko'z barcha razryadlarni bir vaqtda yonayotgandek qabul qiladi."],
  ["f","f_razryad = f_yangilanish · N","4 razryad va 50 Hz yangilanish uchun razryadlar 200 Hz tezlikda almashtiriladi, ya'ni har biriga 5 ms."],
  ["c","const int razryad[4] = {10, 11, 12, 13};   // razryad kalitlari\nint son = 1234;\n\nvoid loop()\n{\n    int raqamlar[4] = { son/1000, (son/100)%10, (son/10)%10, son%10 };\n\n    for (int r = 0; r < 4; r++)\n    {\n        for (int i = 0; i < 4; i++) digitalWrite(razryad[i], LOW);  // hammasini o'chirish\n        raqam_chiqar(raqamlar[r]);                                   // segment kodini qo'yish\n        digitalWrite(razryad[r], HIGH);                              // faqat bitta razryadni yoqish\n        delay(5);                                                    // 5 ms ko'rsatish\n    }\n}"],
  ["n","Razryadni yoqishdan oldin segment kodini qo'yish tartibi muhim: aks holda oldingi razryad kodi qisqa vaqtga yangi razryadda ko'rinadi va ekranda \"soyalar\" (ghosting) paydo bo'ladi. Buning oldini olish uchun razryadlar segment kodi o'zgartirilayotganda butunlay o'chiriladi."],
  ["h","Yorqinlikni hisoblash"],
  ["p","Dinamik indikatsiyada har bir razryad vaqtning faqat 1/N qismida yonadi, shuning uchun o'rtacha yorqinlik shuncha marta kamayadi. Buni qoplash uchun impuls toki oshiriladi (indikator hujjatida ruxsat etilgan impuls toki doimiy tokdan bir necha barobar katta bo'ladi) yoki yangilanish davri qisqartiriladi."],
  ["sim","seg7"],
  ["h","Topshiriqlar"],
  ["ol",["Bir razryadli indikatorni ulang va 0–9 raqamlarini ketma-ket chiqaruvchi dasturni yuklang.","Umumiy anod va umumiy katod uchun kodlar farqini jadvalga yozing.","Variant raqamingiz N bo'lsin: ekranda (1000 + 111·N) sonini ko'rsating.","To'rt razryadli indikatorni dinamik usulda ulang va sonni chiqaring.","Razryad almashtirish davrini 5 ms dan 30 ms ga oshirib, miltillash sezilishini kuzating va chegarani aniqlang.","Ghosting effektini ataylab hosil qiling va uni bartaraf etish usulini izohlang.","Har bir segment tokini o'lchab, umumiy tokni hisoblang.","Sxema va ishlayotgan indikator rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","7-segmentli indikatorda raqam segment kodlari jadvali orqali hosil qilinadi; umumiy anod va katod sxemalari uchun kodlar bir-birining inversiyasi bo'ladi. Ko'p razryadli indikatorda dinamik usul qo'llanadi: segment liniyalari umumiy, razryadlar esa navbat bilan yoqiladi. Yangilanish chastotasi 50 Hz dan yuqori bo'lishi va razryadlar kod o'zgartirilayotganda o'chirilishi ekran sifatining asosiy shartlari hisoblanadi."],
 ],

{
 id:"S2-M23", sem:2, week:8, type:"lecture", no:23,
 title:"Mikrokontrollerning qo'shimcha apparat vositalari. Mikrokontrollerlarning takt generatorlari",
 goal:"Mikrokontrollerning yordamchi tugunlarini — reset, watchdog, quvvat nazorati va takt generatorlarini o'zlashtirish.",
 outcomes:["Boshlang'ich o'rnatish tugunlarining vazifasini tushuntira oladi","Watchdog taymerning ishlash tartibini izohlay oladi","Takt manbalarini aniqlik va narx bo'yicha qiyoslay oladi","Quvvat tejash rejimlarini tanlay oladi"],
 plan:["Qo'shimcha tugunlar tarkibi","Boshlang'ich o'rnatish sxemalari","Watchdog taymer","Quvvat nazorati","Takt generatorlari","Chastotani taqsimlash va PLL","Quvvat tejash rejimlari"],
 body:[
  ["h","Qo'shimcha tugunlar tarkibi"],
  ["p","Yadro va periferiyadan tashqari har bir mikrokontrollerda uning ishonchli ishlashini ta'minlovchi yordamchi tugunlar mavjud: boshlang'ich o'rnatish sxemasi, takt generatori, watchdog taymer, quvvat kuchlanishini nazorat qiluvchi sxema va quvvat tejash boshqaruvi."],
  ["h","Boshlang'ich o'rnatish (reset)"],
  ["ul",["Tashqi reset — MCLR yoki RESET liniyasiga past daraja berilganda","Quvvat berilgandagi reset (POR) — kuchlanish ishchi darajaga chiqqanda avtomatik","Quvvat pasayishi reseti (BOR) — kuchlanish belgilangan chegaradan pastga tushganda","Watchdog reseti — dastur qotib qolganda","Dasturiy reset — maxsus buyruq yoki registr orqali"]],
  ["p","Reset holatida barcha registrlar hujjatda ko'rsatilgan boshlang'ich qiymatlarni oladi, PC esa nolga (yoki reset vektori adresiga) o'rnatiladi. Reset sababini maxsus bitlar orqali aniqlash mumkin — bu nosozlikni topishda juda foydali: masalan qurilma watchdog tufayli qayta yuklangani aniqlansa, dasturda qotib qolish joyi borligi ma'lum bo'ladi."],
  ["n","Quvvat berilgandan keyin kvarts generatorining tebranishi barqarorlashishi uchun bir necha millisekund kerak. Shu sababli PWRTE (Power-up Timer) biti yoqiladi: u dasturning boshlanishini kechiktiradi va generator barqarorlashguncha kutadi."],
  ["h","Watchdog taymer"],
  ["p","Watchdog — mustaqil generatordan ishlaydigan taymer. Dastur uni belgilangan vaqt ichida tozalab turishi shart; tozalanmasa, taymer to'lib ketadi va tizimni qayta ishga tushiradi. Bu mexanizm dastur cheksiz siklda qotib qolgan yoki noto'g'ri adresga o'tib ketgan holatlarda qurilmani tiklaydi."],
  ["c","/* Watchdog bilan to'g'ri ishlash */\nwhile (1)\n{\n    CLRWDT();              /* asosiy sikl boshida bir marta tozalanadi */\n    tugmalarni_oqish();\n    olchash();\n    ekranni_yangilash();\n}\n/* NOTO'G'RI: CLRWDT() ni kutish sikli ichiga qo'yish — qotib qolgan dastur ham\n   watchdog ni tozalayveradi va himoya ishlamay qoladi */"],
  ["h","Quvvat kuchlanishini nazorat qilish"],
  ["p","Kuchlanish pasayganda mikrokontroller noto'g'ri ishlashi, xotiraga xato yozishi mumkin. BOR (Brown-out Reset) sxemasi kuchlanish chegaradan pastga tushganda kristallni reset holatida ushlab turadi va faqat kuchlanish tiklangach ishga tushiradi. Ko'pchilik MK larda chegara qiymati konfiguratsiya bitlari bilan tanlanadi."],
  ["h","Takt generatorlari"],
  ["fig","clock","1-rasm. Kvarts rezonatorli va RC generatorlarni ulash"],
  ["t",["Rejim","Manba","Aniqligi","Tashqi elementlar"],[["LP","Past chastotali kvarts (32,768 kHz)","Juda yuqori","Kvarts + 2 kondensator"],["XT","O'rtacha chastotali kvarts (1–4 MHz)","Yuqori","Kvarts + 2 kondensator"],["HS","Yuqori chastotali kvarts (4–20 MHz)","Yuqori","Kvarts + 2 kondensator"],["RC","Tashqi RC zanjir","±5–10 %","Rezistor + kondensator"],["INTOSC","Ichki RC generator","±1–2 %","Kerak emas"],["EC","Tashqi generator","Manbaga bog'liq","Tayyor generator moduli"]]],
  ["p","32,768 kHz li kvarts alohida o'rin tutadi: bu chastota 2^15 ga teng bo'lgani uchun 15 razryadli bo'luvchidan keyin aniq 1 Hz hosil bo'ladi. Shu sababli u soat va kalendar tugunlarida standart hisoblanadi."],
  ["h","Chastotani taqsimlash va PLL"],
  ["p","Zamonaviy mikrokontrollerlarda takt manbai bevosita yadroga berilmaydi: u avval fazali avtosozlash halqasi (PLL) orqali ko'paytiriladi, so'ng bo'luvchilar orqali yadro, periferiya va interfeyslarga taqsimlanadi. Masalan 8 MHz kvarts PLL bilan 72 MHz ga ko'paytirilib, USB moduliga 48 MHz, periferiyaga esa 36 MHz beriladi."],
  ["f","f_yadro = f_kvarts · M / N","PLL da ko'paytirish va bo'lish koeffitsientlari bilan chastota shakllantiriladi."],
  ["h","Quvvat tejash rejimlari"],
  ["t",["Rejim","Nima o'chadi","Uyg'onish","Iste'mol"],[["Faol","—","—","Bir necha mA"],["Idle / Sleep","Yadro to'xtaydi, periferiya ishlaydi","Uzilish","O'nlab µA"],["Power-down","Generator ham to'xtaydi","Tashqi uzilish, watchdog, reset","1 µA dan kam"],["Power-save","Faqat soat taymeri ishlaydi","Taymer uzilishi","Bir necha µA"]]],
  ["p","Batareyadan ishlaydigan qurilmalarda dastur vaqtining katta qismini uyqu rejimida o'tkazadi va faqat o'lchash yoki tugma bosilishi paytida uyg'onadi. Shu yondashuv bilan bir xil batareyada ishlash muddatini o'nlab marta uzaytirish mumkin."],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Qo'shimcha apparat vositalari — reset sxemalari, watchdog, quvvat nazorati va takt generatori — mikrokontrollerning ishonchli ishlashini ta'minlaydi. Takt manbai aniqlik, narx va tashqi elementlar soni bo'yicha tanlanadi; kvarts eng aniq, ichki RC generator esa eng qulay yechim. PLL va bo'luvchilar chastotani tugunlar bo'yicha taqsimlaydi, quvvat tejash rejimlari esa batareyali qurilmalarning ishlash muddatini uzaytiradi."],
 ],

{
 id:"S2-L8", sem:2, week:8, type:"lab", no:8,
 title:"Knopkalar va klaviaturadan axborot kiritish",
 goal:"Matritsali klaviaturani ulash, skanerlash algoritmini amalga oshirish va kiritilgan ma'lumotni qayta ishlashni o'zlashtirish.",
 outcomes:[],
 plan:["Matritsa tamoyili","Ulash sxemasi","Skanerlash algoritmi","Drebezg va ghosting","Sonni kiritish","Menyu boshqaruvi"],
 equip:["Arduino Uno va USB kabel","4×4 matritsali klaviatura","Diodlar 1N4148 — 16 dona (ixtiyoriy)","LCD 16×2","Rezistorlar va simlar"],
 body:[
  ["h","Nazariy qism"],
  ["p","16 ta tugmaning har biriga alohida liniya ajratish 16 ta port chiqishini talab qiladi. Matritsa usulida tugmalar 4 satr va 4 ustun kesishmasiga joylashtiriladi — natijada atigi 8 ta liniya yetarli bo'ladi. Umumiy holda N ta tugma uchun 2·√N ta liniya kerak bo'ladi."],
  ["fig","keypad","1-rasm. 4×4 matritsali klaviaturaning ulanish sxemasi va skanerlash tartibi"],
  ["f","Liniyalar soni = satrlar + ustunlar","4×4 uchun 8 liniya, 4×3 uchun 7 liniya."],
  ["h","Skanerlash algoritmi"],
  ["ol",["Satr liniyalari chiqish, ustun liniyalari kirish (pull-up bilan) qilib sozlanadi","Barcha satrlarga yuqori daraja beriladi","Birinchi satrga past daraja beriladi, qolganlari yuqori qoladi","Ustunlar o'qiladi: agar biror ustunda past daraja bo'lsa, shu satr va ustun kesishmasidagi tugma bosilgan","Keyingi satr uchun takrorlanadi","Tugma topilgach drebezg filtri qo'llanadi va kod jadvaldan olinadi"]],
  ["c","const byte SATR = 4, USTUN = 4;\nconst int satr[SATR]   = {9, 8, 7, 6};\nconst int ustun[USTUN] = {5, 4, 3, 2};\nconst char belgi[SATR][USTUN] = {\n    {'1','2','3','A'},\n    {'4','5','6','B'},\n    {'7','8','9','C'},\n    {'*','0','#','D'}\n};\n\nvoid setup()\n{\n    for (byte s = 0; s < SATR; s++)  { pinMode(satr[s], OUTPUT); digitalWrite(satr[s], HIGH); }\n    for (byte u = 0; u < USTUN; u++) pinMode(ustun[u], INPUT_PULLUP);\n    Serial.begin(9600);\n}\n\nchar tugma_oqish(void)\n{\n    for (byte s = 0; s < SATR; s++)\n    {\n        digitalWrite(satr[s], LOW);              /* faqat shu satr faol */\n        for (byte u = 0; u < USTUN; u++)\n        {\n            if (digitalRead(ustun[u]) == LOW)\n            {\n                delay(20);                       /* drebezg filtri */\n                if (digitalRead(ustun[u]) == LOW)\n                {\n                    while (digitalRead(ustun[u]) == LOW);   /* qo'yib yuborishni kutish */\n                    digitalWrite(satr[s], HIGH);\n                    return belgi[s][u];\n                }\n            }\n        }\n        digitalWrite(satr[s], HIGH);\n    }\n    return 0;                                     /* hech narsa bosilmagan */\n}\n\nvoid loop()\n{\n    char t = tugma_oqish();\n    if (t) { Serial.print(\"Bosildi: \"); Serial.println(t); }\n}"],
  ["h","Ghosting va diodlar"],
  ["p","Bir vaqtda uchta tugma bosilganda matritsada soxta ulanish yo'li hosil bo'lishi mumkin: skanerlash to'rtinchi, bosilmagan tugmani ham bosilgan deb qayd etadi. Bu hodisa ghosting (soyabon) deb ataladi. Uning oldini olish uchun har bir tugmaga ketma-ket diod ulanadi — diod tokning faqat bir yo'nalishda o'tishiga ruxsat beradi va soxta yo'lni uzadi."],
  ["n","Xavfsizlik va montaj: ikkita satr liniyasi bir vaqtda chiqish rejimida turib, biri yuqori, ikkinchisi past daraja berayotganda tugma bosilsa, chiqishlar o'rtasida qisqa tutashuv hosil bo'ladi. Shuning uchun skanerlashda faqat bitta satr past darajaga o'tkaziladi, qolganlari esa yuqori darajada yoki kirish rejimida qoldiriladi."],
  ["h","Sonni kiritish"],
  ["c","long son = 0;\n\nvoid loop()\n{\n    char t = tugma_oqish();\n    if (!t) return;\n\n    if (t >= '0' && t <= '9')\n    {\n        son = son * 10 + (t - '0');        /* yangi raqamni qo'shish */\n        if (son > 99999) son = 99999;      /* chegaralash */\n        Serial.println(son);\n    }\n    else if (t == '*') { son = 0; Serial.println(\"Tozalandi\"); }\n    else if (t == '#') { Serial.print(\"Qabul qilindi: \"); Serial.println(son); son = 0; }\n}"],
  ["p","Belgidan raqamga o'tish uchun ASCII kodidan '0' ayiriladi. Kiritilgan raqam har safar oldingi qiymatni 10 ga ko'paytirib qo'shish orqali yig'iladi — bu o'nlik sonni kiritishning standart usuli."],
  ["h","Menyu boshqaruvi"],
  ["t",["Tugma","Vazifasi","Holat"],[["A","Menyuda yuqoriga","Har qanday"],["B","Menyuda pastga","Har qanday"],["C","Tanlash / kirish","Menyu"],["D","Orqaga / bekor qilish","Har qanday"],["0–9","Qiymat kiritish","Tahrirlash"],["#","Tasdiqlash","Tahrirlash"],["*","Tozalash","Tahrirlash"]]],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",["4×4 klaviaturani D2–D9 liniyalariga ulang va sxemani chizing.","Skanerlash dasturini yuklang; har bir tugma bosilganda Serial Monitor da kod chiqishini tekshiring.","Bosilgan tugma satr va ustun raqamini jadvalga yozing (16 ta tugma uchun).","Variant raqamingiz N bo'lsin: kiritilgan sonni (10 + N) ga ko'paytirib ekranga chiqaring.","Ikki va uchta tugmani bir vaqtda bosib, ghosting hodisasini kuzating.","Sonni kiritish, tozalash va tasdiqlash funksiyalarini LCD bilan birga amalga oshiring.","Skanerlash davomiyligini micros() bilan o'lchang va butun klaviaturani skanerlash vaqtini hisoblang.","Sxema va Serial Monitor rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Matritsali klaviatura tugmalar sonini kamaytirmasdan port liniyalarini tejash imkonini beradi: 16 ta tugma uchun 8 liniya yetarli. Skanerlash satrlarga navbat bilan past daraja berib, ustunlarni o'qish orqali bajariladi. Drebezg dasturiy filtrlanadi, bir vaqtda ko'p tugma bosilganda paydo bo'ladigan ghosting esa diodlar bilan bartaraf etiladi."],

{
 id:"S2-L9", sem:2, week:9, type:"lab", no:9,
 title:"Simvolli-grafik indikatorga axborot chiqarish",
 goal:"Simvolli LCD va grafik indikatorga matn, maxsus belgi va sodda grafik chiqarishni o'zlashtirish.",
 outcomes:[],
 plan:["Simvolli indikator","Kutubxona bilan ishlash","Maxsus belgilar (CGRAM)","Progress bar","Grafik indikator","Ma'lumotni formatlash"],
 equip:["Arduino Uno va USB kabel","LCD 16×2 (HD44780)","Grafik indikator 128×64 (ixtiyoriy)","Potensiometr 10 kΩ","Rezistor 220 Ω, simlar"],
 body:[
  ["h","Simvolli indikator"],
  ["p","HD44780 boshqaruvchisidagi LCD ichida uchta xotira sohasi bor: DDRAM — ekranda ko'rinadigan belgilar kodlari, CGROM — tayyor belgilar shakllari, CGRAM — foydalanuvchi yaratadigan sakkiztagacha maxsus belgi. Indikator RS, E va to'rt yoki sakkiz ma'lumot liniyasi orqali boshqariladi."],
  ["fig","lcdwire","1-rasm. LCD indikatorni 4 bitli rejimda ulash"],
  ["c","#include <LiquidCrystal.h>\n\n/* LiquidCrystal(RS, E, D4, D5, D6, D7) */\nLiquidCrystal lcd(12, 11, 5, 4, 3, 2);\n\nvoid setup()\n{\n    lcd.begin(16, 2);                 /* 16 ustun, 2 qator */\n    lcd.print(\"MIKROPROTSESSOR\");\n    lcd.setCursor(0, 1);              /* 0-ustun, 1-qator */\n    lcd.print(\"TEXNIKASI  TDTU\");\n}\n\nvoid loop()\n{\n    lcd.setCursor(11, 1);\n    lcd.print(millis() / 1000);       /* ishlash vaqti, sekundda */\n    delay(500);\n}"],
  ["h","Maxsus belgilar (CGRAM)"],
  ["p","CGRAM ga sakkiztagacha o'z belgingizni yozish mumkin. Har bir belgi 8 qatordan iborat va har bir qator 5 bitli — ya'ni belgi 5×8 nuqtadan tashkil topadi. Bu daraja va gradus belgilari, batareya, antenna kabi piktogrammalarni yaratish imkonini beradi."],
  ["c","byte gradus[8] = {\n    0b00110,\n    0b01001,\n    0b01001,\n    0b00110,\n    0b00000,\n    0b00000,\n    0b00000,\n    0b00000\n};\n\nvoid setup()\n{\n    lcd.begin(16, 2);\n    lcd.createChar(0, gradus);        /* 0-raqamli maxsus belgi */\n    lcd.setCursor(0, 0);\n    lcd.print(\"Harorat: 24\");\n    lcd.write(byte(0));               /* maxsus belgini chiqarish */\n    lcd.print(\"C\");\n}"],
  ["h","Progress bar"],
  ["p","Maxsus belgilardan foydalanib, simvolli indikatorda ham to'ldirish shkalasini hosil qilish mumkin: har bir belgi o'rniga to'liq yoki qisman to'ldirilgan blok chiqariladi. 16 ta belgi va har birida 5 ustun bo'lgani uchun shkala 80 pog'onali bo'ladi."],
  ["f","pog'onalar = 16 · 5 = 80","16 belgili qatorda progress bar ayirish qobiliyati."],
  ["h","Grafik indikator"],
  ["t",["Belgi","Simvolli (16×2)","Grafik (128×64)"],[["Chiqariladigan ma'lumot","Faqat belgilar","Nuqta, chiziq, shakl, shrift"],["Xotira talabi","Kichik","Kadr buferi 1 KB (128·64/8)"],["Boshqaruvchi","HD44780","KS0108, ST7920, SSD1306"],["Ulanish","4/8 bit parallel","Parallel yoki SPI/I2C"],["Qo'llanishi","Sodda ko'rsatkichlar","Grafik, menyu, diagramma"]]],
  ["p","Grafik indikatorda tasvir kadr buferida shakllantiriladi va so'ng butunlay indikatorga uzatiladi. 128×64 nuqtali ekran uchun bufer 1024 bayt joy egallaydi — bu ATmega328P ning 2 KB SRAM ining yarmi. Shuning uchun kichik mikrokontrollerlarda tasvir sahifalab (page) chiqariladi yoki buferi ichida joylashgan indikatorlar tanlanadi."],
  ["n","Kontrast va ko'rinish: simvolli LCD da kontrast VO liniyasidagi kuchlanish bilan sozlanadi. Kontrast noto'g'ri bo'lsa ekranda hech nima ko'rinmaydi yoki barcha kataklar qora bo'lib qoladi — bu ko'pincha \"indikator ishlamayapti\" deb xato baholanadi."],
  ["h","Ma'lumotni formatlash"],
  ["c","void harorat_chiqar(int t10)          /* t10 — 0,1 °C birliklarida */\n{\n    lcd.setCursor(0, 1);\n    lcd.print(t10 / 10);\n    lcd.print('.');\n    lcd.print(t10 % 10);\n    lcd.write(byte(0));\n    lcd.print(\"C  \");                 /* oxirgi bo'shliqlar eski belgilarni o'chiradi */\n}"],
  ["p","Muhim amaliy detal: LCD eski belgilarni avtomatik o'chirmaydi. Agar oldin \"100\" chiqarilgan bo'lib, keyin \"99\" yozilsa, ekranda \"990\" ko'rinadi. Shuning uchun qiymatdan keyin bo'shliqlar chiqariladi yoki qator to'liq qayta yoziladi."],
  ["sim","lcd"],
  ["h","Topshiriqlar"],
  ["ol",["LCD ni 4 bitli rejimda ulang, kontrastni sozlang va sxemani chizing.","Birinchi qatorga ism-familiyangizni, ikkinchisiga guruhingizni chiqaring.","CGRAM da gradus belgisini yarating va uni ekranga chiqaring.","Variant raqamingiz N bo'lsin: o'z maxsus belgingizni (N ta nuqtadan iborat shakl) yarating.","Progress bar amalga oshiring va uni 0 dan 100 % gacha o'zgartiring.","Eski belgilarni o'chirmaslik xatosini ataylab hosil qiling va uni bartaraf eting.","Imkoni bo'lsa grafik indikatorga chiziq va to'rtburchak chizing.","Sxema va ishlayotgan indikator rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Simvolli LCD DDRAM ga belgilar kodlarini yozish orqali boshqariladi, CGRAM esa sakkiztagacha o'z belgini yaratishga imkon beradi. Grafik indikator nuqtalar bilan ishlaydi va kadr buferi uchun sezilarli SRAM talab qiladi. Ma'lumot chiqarishda eski belgilarni tozalash va kontrastni to'g'ri sozlash — ekran bilan ishlashdagi eng ko'p uchraydigan amaliy masalalar."],

  ["p","Ko'rinib turibdiki, PIC16F84A ning dastur xotirasi atigi 1024 ta buyruq so'ziga teng. Bu sodda boshqarish masalalari — svetofor, taymer, kodli qulf, indikator boshqaruvi — uchun yetarli, ammo LCD kutubxonasi va murakkab hisoblar bilan birga ishlatilganda tez to'lib qoladi."],

  ["h","RS-232 darajalari va MAX232"],
  ["t",["Parametr","TTL/CMOS (MK)","RS-232 (kompyuter)"],[["Mantiqiy 1","+5 V (yoki +3,3 V)","−3…−15 V"],["Mantiqiy 0","0 V","+3…+15 V"],["Mantiq","To'g'ri","Inversiyalangan"],["Masofa","0,5 m gacha","15 m gacha"],["Shovqinga bardoshlik","Past","Yuqoriroq"]]],
  ["p","Ko'rinib turibdiki, darajalar nafaqat farq qiladi, balki inversiyalangan ham. Shuning uchun mikrokontrollerni kompyuterning COM portiga bevosita ulash mumkin emas — MAX232 kabi daraja o'zgartirgich ishlatiladi. U ichki kuchlanish nasosi yordamida +5 V dan ±10 V hosil qiladi va buning uchun to'rtta tashqi kondensator talab qiladi."],
  ["n","Xavfsizlik: RS-232 liniyasini bevosita mikrokontroller portiga ulash manfiy va katta kuchlanish tufayli kirishni darhol ishdan chiqaradi. Zamonaviy platalarda esa USB-UART o'zgartirgich ishlatiladi va u allaqachon TTL darajalarida ishlaydi."],
  ["h","Kompyuter bilan aloqa"],
  ["c","void setup()\n{\n    Serial.begin(9600);\n    Serial.println(\"Tizim tayyor. Buyruq kiriting:\");\n}\n\nvoid loop()\n{\n    if (Serial.available() > 0)              /* bufer bo'sh emasmi */\n    {\n        String buyruq = Serial.readStringUntil('\\n');\n        buyruq.trim();\n\n        if (buyruq == \"LED ON\")       { digitalWrite(13, HIGH); Serial.println(\"OK: yoqildi\"); }\n        else if (buyruq == \"LED OFF\") { digitalWrite(13, LOW);  Serial.println(\"OK: ochirildi\"); }\n        else if (buyruq == \"STATUS\")  { Serial.print(\"Ishlash vaqti: \"); Serial.println(millis()/1000); }\n        else                          Serial.println(\"XATO: noma'lum buyruq\");\n    }\n}"],
  ["h","Ikki mikrokontroller o'rtasida aloqa"],
  ["p","Ikki platani UART orqali bog'lash uchun birinchisining TX liniyasi ikkinchisining RX liniyasiga, va aksincha, ulanadi; umumiy sim (GND) albatta birlashtiriladi. Umumiy sim ulanmasa signal darajalari uchun mos yo'q bo'ladi va aloqa ishlamaydi — bu tipik xato."],
  ["h","Sodda protokol tuzish"],
  ["ul",["Kadr boshlanishi va oxirini belgilash (masalan ':' va '\\n')","Buyruq kodi va parametrlarni ajratish","Nazorat yig'indisi qo'shish (barcha baytlar yig'indisining quyi bayti)","Qabul qiluvchi tomonda javob (ACK) yoki xato kodi qaytarish","Javob kelmasa qayta yuborish va urinishlar sonini cheklash"]],

  ["ol",["Serial Monitor orqali buyruqlar bilan LED ni boshqaruvchi dasturni yuklang va tekshiring.","Ossillograf bilan TX liniyasidagi kadrni kuzating; bir bitning davomiyligini o'lchang va bod tezligi bilan solishtiring.","Variant raqamingiz N bo'lsin: (9600 · 2^(N mod 3)) tezlikda ishlashni sozlang va kadr davomiyligini hisoblang.","16 MHz va 9600 bod uchun UBRR qiymatini hisoblang va haqiqiy tezlik xatosini toping.","Ikki platani TX–RX qilib ulang va birinchisidan ikkinchisiga son yuboring.","Umumiy simni ataylab uzib, aloqa buzilishini kuzating va sababini izohlang.","Nazorat yig'indisi bilan sodda protokol yozing va buzilgan kadrni rad etishni tekshiring.","Ossillogramma va Serial Monitor rasmini yuklang."]],

  ["p","Misol. f = 4 MHz, mashina sikli 1 µs. Sikl tanasi 6 ta bir sikli va 2 ta ikki sikli buyruqdan iborat bo'lsa: t = (6 + 4) · 1 µs = 10 µs, ya'ni sikl sekundiga 100 000 marta takrorlanadi."],
  ["h","Tipik dastur bo'laklari"],
  ["c","; 1) Dasturiy kechikish (ichma-ich ikki sikl)\nDELAY: MOVLW  250\n       MOVWF  0x10\nD1:    MOVLW  200\n       MOVWF  0x11\nD2:    DECFSZ 0x11, 1\n       GOTO   D2\n       DECFSZ 0x10, 1\n       GOTO   D1\n       RETURN\n\n; 2) Portning yuguruvchi olovi\n       MOVLW  0x01\n       MOVWF  PORTB\nSHIFT: BCF    STATUS, C\n       RLF    PORTB, 1     ; chapga siljitish\n       CALL   DELAY\n       GOTO   SHIFT\n\n; 3) Jadval asosida kod o'zgartirish (7-segment)\nKOD:   ADDWF  PCL, 1\n       RETLW  0x3F        ; 0\n       RETLW  0x06        ; 1\n       RETLW  0x5B        ; 2"],
  ["n","PCL ga qo'shish orqali jadvalga sakrash faqat bitta sahifa ichida to'g'ri ishlaydi. Jadval sahifa chegarasidan o'tib ketsa, PCLATH registri ham to'g'ri sozlanishi kerak, aks holda dastur noto'g'ri adresga o'tadi."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","PIC16F8X ning 35 ta buyrug'i bayt, bit va konstanta formatlariga bo'linadi; barchasi bir xil 14 bitli so'z bilan kodlanadi. Shartli bajarilish skip buyruqlari orqali amalga oshiriladi, solishtirish esa ayirish va flaglarni tekshirishdan iborat. Buyruqlarning asosan bir siklda bajarilishi dastur vaqtini aniq hisoblash imkonini beradi."],

{
 id:"S2-L11", sem:2, week:11, type:"lab", no:11,
 title:"Mikrokontrollerli termometrni tadqiq etish",
 goal:"Harorat datchigidan signal olish, uni raqamlashtirish, kalibrlash va natijani indikatorga chiqarish tizimini tadqiq etish.",
 outcomes:[],
 plan:["Tizim tuzilmasi","Datchikni tanlash","LM35 bilan o'lchash","NTC bilan o'lchash","Raqamli datchik","Kalibrlash va xatolar"],
 equip:["Arduino Uno va USB kabel","LM35 yoki DS18B20 datchigi","NTC termistor 10 kΩ va rezistor 10 kΩ","LCD 16×2","Etalon termometr, muzli suv, issiq suv"],
 body:[
  ["h","Tizim tuzilmasi"],
  ["p","Raqamli termometr to'rt bosqichdan iborat: datchik haroratni elektr kattalikka aylantiradi, moslashtiruvchi zanjir signalni ADC diapazoniga keltiradi, mikrokontroller kodni haroratga aylantiradi, indikator natijani ko'rsatadi."],
  ["fig","temp","1-rasm. Mikrokontrollerli termometrning tuzilmaviy sxemasi"],
  ["t",["Datchik","Chiqishi","Diapazoni","Aniqligi","Xususiyati"],[["LM35","10 mV/°C, chiziqli","0…100 °C","±0,5 °C","Kalibrlash talab qilmaydi"],["NTC termistor","Qarshilik, chiziqsiz","−40…125 °C","±1…2 °C","Arzon, hisob murakkab"],["DS18B20","Raqamli, 1-Wire","−55…125 °C","±0,5 °C","ADC kerak emas, 12 razryad"],["Termojuft (K tipi)","mV EYK","0…1200 °C","±2 °C","Kuchaytirgich va kompensatsiya kerak"]]],
  ["h","LM35 bilan o'lchash"],
  ["c","const int DATCHIK = A0;\n\nint harorat_olish(void)          /* natija 0,1 °C birliklarida */\n{\n    long s = 0;\n    for (byte i = 0; i < 16; i++) { s += analogRead(DATCHIK); delay(2); }\n    s >>= 4;                                  /* 16 ta o'lchash o'rtachasi */\n    /* kod -> mV -> 0,1 C :  mV = s * 5000 / 1023 ;  T(0,1C) = mV / 1 */\n    return (int)(s * 5000L / 1023L / 10L);\n}"],
  ["f","T = N · U_ref · 1000 / (1023 · 10)","LM35 uchun kodni haroratga aylantirish (0,1 °C birliklarida)."],
  ["p","Uref = 5 V da bitta kod 4,88 mV ga, ya'ni 0,49 °C ga mos keladi. Aniqlikni oshirish uchun Arduino da ichki 1,1 V opora manbaiga o'tish mumkin: analogReference(INTERNAL) buyrug'idan keyin bitta kod 1,07 mV ni, ya'ni 0,107 °C ni tashkil qiladi."],
  ["h","NTC termistor bilan o'lchash"],
  ["p","NTC termistorning qarshiligi harorat ortishi bilan kamayadi va bu bog'liqlik chiziqsiz. Uni kuchlanish bo'luvchisiga ulab, qarshilikni hisoblash va Shtaynxart–Xart yoki B-parametr formulasi orqali haroratga o'tish kerak."],
  ["f","R_t = R_0 · U_ADC / (U_cc − U_ADC)","Bo'luvchidagi termistor qarshiligi."],
  ["f","1/T = 1/T0 + (1/B) · ln(R_t / R_0)","B-parametr formulasi; T kelvinda, T0 = 298,15 K, B ≈ 3950."],
  ["c","float ntc_harorat(int kod)\n{\n    float R = 10000.0 * kod / (1023.0 - kod);       /* termistor qarshiligi */\n    float t = 1.0 / (1.0/298.15 + log(R/10000.0)/3950.0);\n    return t - 273.15;                               /* selsiyga o'tish */\n}"],
  ["h","Raqamli datchik DS18B20"],
  ["p","DS18B20 haroratni o'zi o'lchaydi va natijani 1-Wire interfeysi orqali tayyor raqamli kod ko'rinishida beradi. ADC, kalibrlash va chiziqsizlik masalalari butunlay yo'qoladi. Bitta liniyaga bir necha datchik ulanishi mumkin, chunki har birining zavod seriya raqami noyob."],
  ["t",["Ko'rsatkich","LM35 + ADC","DS18B20"],[["Ulanish","Analog kirish","Bitta raqamli liniya + pull-up"],["Aniqlik","ADC va oporaga bog'liq","0,0625 °C gacha"],["Bir necha datchik","Har biriga kanal kerak","Bitta liniyada"],["O'qish vaqti","~0,1 ms","~750 ms (12 razryadda)"],["Narxi","Past","Yuqoriroq"]]],
  ["h","Kalibrlash va xatolar"],
  ["ol",["Qurilmani etalon termometr bilan bir xil sharoitda 10 daqiqa barqarorlashtiring","Ikki nuqtada o'lchang: muzli suv (0 °C) va xona yoki iliq suv harorati","Farq butun diapazonda bir xil bo'lsa — nol siljishi, o'zgarib borsa — koeffitsient xatosi","Tuzatmalarni dasturga kiriting va EEPROM da saqlang","Tuzatishdan keyin o'lchashni takrorlab, qoldiq xatoni baholang"]],
  ["n","Xato manbalari: uzun ulash simlari orqali kirgan shovqin, quvvat manbaining beqarorligi (Uref sifatida VDD ishlatilganda), datchikning o'z-o'zidan qizishi, yaqindagi issiqlik manbalari va datchikning issiqlik inersiyasi. Oxirgisi tufayli o'lchash haqiqiy haroratdan kechikib boradi."],
  ["sim","adc"],
  ["h","Topshiriqlar"],
  ["ol",["LM35 ni A0 kanaliga ulang, RC filtr qo'ying va sxemani chizing.","Xona haroratini o'lchab, ADC kodi, hisoblangan qiymat va etalon ko'rsatkichini jadvalga yozing.","Variant raqamingiz N bo'lsin: signalizatsiya chegarasini (28 + N) °C qilib belgilang, gisterezis 2 °C bo'lsin.","analogReference(INTERNAL) bilan aniqlikni oshiring va farqni qayd eting.","NTC termistor bilan o'lchashni amalga oshiring va LM35 natijasi bilan solishtiring.","Ikki nuqtali kalibrlash o'tkazing va tuzatmani dasturga kiriting.","Datchikni iliq suvga solib, ko'rsatkichning o'rnatilish vaqtini (inersiya) o'lchang.","O'lchash jadvali va qurilma rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Termometr datchik, ADC, hisoblash va indikatsiya bosqichlaridan iborat yaxlit o'lchash tizimi. LM35 chiziqli tavsifi bilan hisobni soddalashtiradi, NTC arzon lekin chiziqsiz, DS18B20 esa ADC va kalibrlashni butunlay yo'q qiladi. O'rtachalash, opora manbaini to'g'ri tanlash va ikki nuqtali kalibrlash o'lchash aniqligini sezilarli oshiradi."],
 ],

  {q:"B-parametr formulasida harorat qanday birlikda hisoblanadi?",o:["Selsiy","Kelvin","Farengeyt","Foiz"]},

  {q:"12 razryadli rejimda DS18B20 o'lchash qancha vaqt oladi?",o:["1 ms","100 ms","750 ms","5 s"]},
  {q:"Bitta 1-Wire liniyasiga bir necha datchik ulash mumkinmi?",o:["Yo'q","Ha, har birining noyob seriya raqami bor","Faqat ikkitasi","Faqat qisqa masofada"]},

  {q:"Datchikning issiqlik inersiyasi nimaga olib keladi?",o:["Ko'rsatkich haqiqiy haroratdan kechikishiga","Shovqinga","Nol siljishiga","Diapazon o'zgarishiga"]},

{
 id:"S2-M27", sem:2, week:12, type:"lecture", no:27,
 title:"Mikrokontroller asosidagi qurilmalarni sozlash vositalari va mikroprotsessor tizimlarini sozlash",
 goal:"Mikroprotsessor tizimlarini sozlash usullarini, otladka vositalarini va nosozlik qidirish tartibini o'zlashtirish.",
 outcomes:["Sozlash vositalarini turlariga ko'ra tasniflay oladi","Dasturiy va apparat otladka usullarini qiyoslay oladi","Nosozlik qidirishning tizimli tartibini qo'llay oladi","Otladka natijalarini rasmiylashtira oladi"],
 plan:["Sozlash tushunchasi","Nosozliklar tasnifi","Dasturiy vositalar","Apparat vositalari","Nosozlik qidirish tartibi","Sinov va hujjatlashtirish"],
 body:[
  ["h","Sozlash tushunchasi"],
  ["p","Sozlash (otladka) — loyihalangan qurilmani ishga tushirish va undagi xatolarni topib bartaraf etish jarayoni. Amaliyotda loyihaning umumiy mehnat sarfining 30–50 % i aynan shu bosqichga to'g'ri keladi, shuning uchun sozlash vositalarini bilish loyihalash bilan bir xil darajada muhim."],
  ["h","Nosozliklar tasnifi"],
  ["t",["Turi","Manbai","Tipik ko'rinishi"],[["Montaj xatolari","Noto'g'ri ulanish, sovuq payvand, qisqa tutashuv","Qurilma umuman ishlamaydi"],["Sxema xatolari","Nominal, qutblanish, yetishmayotgan element","Noto'g'ri darajalar, qizish"],["Konfiguratsiya xatolari","Generator, watchdog, LVP bitlari","Kristall ishga tushmaydi yoki qayta yuklanadi"],["Algoritm xatolari","Mantiq noto'g'ri tuzilgan","Ishlaydi, lekin natija noto'g'ri"],["Vaqt xatolari","Kechikish, uzilish, poyga holati","Beqaror, takrorlanmaydigan nosozlik"],["Resurs xatolari","Stek, xotira to'lib ketishi","Tasodifiy qayta yuklanish"]]],
  ["p","Eng qiyin turi — vaqt va resurs xatolari: ular takrorlanmaydi va otladchik ostida yo'qolib qolishi mumkin, chunki qadamma-qadam bajarish vaqt munosabatlarini o'zgartiradi."],
  ["h","Dasturiy sozlash vositalari"],
  ["ul",["Simulyator — kristallsiz, kompyuterda bajarish; registr va xotirani to'liq kuzatish imkonini beradi","Qadamma-qadam bajarish (Step Into / Step Over) — har bir buyruqdan keyin holatni ko'rish","To'xtash nuqtalari (breakpoint) — kerakli joyda to'xtatish; shartli breakpoint qiymat mos kelganda ishlaydi","Watch oynasi — tanlangan o'zgaruvchilarni real vaqtda kuzatish","Stopwatch — kod bo'lagining bajarilish vaqtini sikllarda o'lchash","Trassirovka — bajarilgan buyruqlar tarixini yozib borish","Modellashtirish muhiti (Proteus) — dastur va sxemani birga sinash"]],
  ["h","Apparat sozlash vositalari"],
  ["t",["Vosita","Nimani ko'rsatadi","Qachon zarur"],[["Multimetr","Kuchlanish, tok, qarshilik","Har doim, birinchi tekshiruv"],["Ossillograf","Signal shakli, davri, fronti","Vaqt munosabatlari, shovqin"],["Mantiqiy analizator","Bir necha raqamli liniya birga","Interfeys va shina tahlili"],["Ichki sxemali emulyator (ICE)","Kristall o'rnida ishlab, to'liq nazorat","Murakkab nosozliklar"],["Otladka moduli (ICD, JTAG)","Real kristallda breakpoint va kuzatish","Zamonaviy amaliyot"],["Protokol analizatori","UART, I2C, SPI kadrlarini dekodlash","Aloqa muammolari"]]],
  ["p","Simulyator va real kristalldagi otladka bir-birini to'ldiradi. Simulyator algoritm xatolarini topishda qulay, ammo u tashqi sxema, shovqin va real vaqt munosabatlarini aks ettirmaydi. Aksincha, ICD moduli real qurilmada ishlaydi, lekin ba'zi resurslarni (masalan bir necha port liniyasini) band qiladi."],
  ["h","Dasturiy diagnostika usullari"],
  ["ol",["Diagnostik chiqish: bo'sh port razryadiga LED yoki ossillograf ulab, dastur qaysi tarmoqqa kirganini ko'rsatish","UART orqali holat xabarlarini yuborish (eng ko'p ishlatiladigan usul)","Oraliq qiymatlarni EEPROM ga yozib, keyin o'qib chiqish","Reset sababini tekshirish va jurnalga yozish","O'z-o'zini tekshirish rejimi: ishga tushganda xotira, datchik va interfeyslarni sinash"]],
  ["c","/* Uzilish bajarilganini ossillografda ko'rish */\nISR(TIMER1_COMPA_vect)\n{\n    PORTB |=  (1 << PB5);   /* belgi boshlanishi */\n    ishlov();\n    PORTB &= ~(1 << PB5);   /* belgi tugashi — impuls kengligi ISR vaqtini beradi */\n}"],
  ["h","Nosozlik qidirish tartibi"],
  ["ol",["Nosozlikni aniq ta'riflang: nima kutilgan, nima sodir bo'ldi, qanday sharoitda takrorlanadi","Quvvat kuchlanishini va reset liniyasini o'lchang","Generator ishlayotganini ossillograf bilan tekshiring","Konfiguratsiya bitlarini qayta ko'rib chiqing","Eng sodda dasturni (LED miltillash) yuklab, apparat qismi sog'ligini tasdiqlang","Dasturni qismlarga bo'lib, har birini alohida sinang","Otladchikda breakpoint qo'yib, xato yuzaga keladigan joyni toraytiring","Xatoni tuzating va butun tizimni qaytadan sinovdan o'tkazing"]],
  ["n","Muhim qoida: bir vaqtda faqat bitta o'zgarish kiriting. Bir necha joyni birdaniga o'zgartirsangiz, nosozlik yo'qolganda uning sababi qaysi o'zgarish ekanini aniqlab bo'lmaydi."],
  ["h","Sinov va hujjatlashtirish"],
  ["p","Sozlash tugagach qurilma sinov dasturi bo'yicha tekshiriladi: har bir funksiya alohida, so'ng butun tizim chegaraviy sharoitlarda (minimal va maksimal kuchlanish, harorat, kirish qiymatlari) sinaladi. Sinov natijalari bayonnomaga yoziladi: nima sinaldi, qanday sharoitda, qanday natija olindi."],
  ["sim","btnled"],
  ["h","Xulosa"],
  ["p","Sozlash loyihaning mehnat sarfining katta qismini egallaydi va tizimli yondashuvni talab qiladi: nosozlikni ta'riflashdan boshlab, quvvat va generatordan dastur mantiqiga qarab harakat qilinadi. Dasturiy vositalar — simulyator, breakpoint, Watch, Stopwatch; apparat vositalari — multimetr, ossillograf, mantiqiy analizator va otladka moduli. Bir vaqtda bitta o'zgarish kiritish qoidasi nosozlik sababini aniq aniqlash imkonini beradi."],
 ],

{
 id:"S2-L12", sem:2, week:12, type:"lab", no:12,
 title:"ARO' (analog-raqamli o'zgartirgich) bilan ishlash",
 goal:"Analog-raqamli o'zgartirgichning parametrlarini tajribada aniqlash va o'lchash xatolarini baholashni o'zlashtirish.",
 outcomes:[],
 plan:["ADC parametrlari","O'zgartirish tavsifini olish","Kvantlash xatosi","Opora manbaining ta'siri","Shovqin va o'rtachalash","Diskretlash chastotasi"],
 equip:["Arduino Uno va USB kabel","Potensiometr 10 kΩ","Aniq multimetr","Rezistorlar 1 kΩ, kondensator 0,1 µF","Signal generatori (ixtiyoriy)"],
 body:[
  ["h","Nazariy qism"],
  ["p","Arduino Uno da ATmega328P ning 10 razryadli ketma-ket yaqinlashuvchi ADC si ishlatiladi. U 6 ta kanalga ega, o'zgartirish 13 ADC takti davom etadi va standart sozlamada taxminan 100 mikrosekundni tashkil qiladi."],
  ["fig","adcsar","1-rasm. Ketma-ket yaqinlashuvchi ADC ning tuzilmasi"],
  ["f","N = U_kirish / U_ref · 1023","Kod qiymati. Uref = 5 V, U = 2,5 V → N = 511."],
  ["f","q = U_ref / 1023","Kvantlash qadami: 5 V uchun 4,88 mV, 1,1 V uchun 1,07 mV."],
  ["f","Δ = ± q / 2","Kvantlash xatosi — printsipial, yo'qotib bo'lmaydi."],
  ["h","O'zgartirish tavsifini olish"],
  ["c","void setup()\n{\n    Serial.begin(9600);\n    Serial.println(\"kod;hisoblangan_mV\");\n}\n\nvoid loop()\n{\n    int kod = analogRead(A0);\n    long mv  = (long)kod * 5000L / 1023L;\n    Serial.print(kod); Serial.print(';'); Serial.println(mv);\n    delay(500);\n}"],
