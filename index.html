<!DOCTYPE html>
<html lang="uz" data-theme="tech">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikroprotsessor texnikasi — elektron darslik</title>
<style>
/* ============ TOKENS ============ */
:root{
  --f-ui: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans", Arial, sans-serif;
  --f-read: Georgia, "Times New Roman", "Noto Serif", serif;
  --f-mono: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  --r: 3px; --r2: 8px;
  --w: 1080px;
  --t: .16s ease;
}
html[data-theme="tech"]{
  --bg:#EDEFEA; --surface:#FFFFFF; --surface2:#F5F7F2; --ink:#121A16; --muted:#5C6B62;
  --line:#D2D9CF; --accent:#0B6E5F; --accent2:#F2B705; --on-accent:#FFFFFF;
  --ok:#1F7A46; --warn:#9A6A00; --bad:#A32B1E; --rail:#E3E7DE;
}
html[data-theme="light"]{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface2:#F0F0EE; --ink:#16181A; --muted:#5F6670;
  --line:#DCDEE0; --accent:#20507F; --accent2:#C9860B; --on-accent:#FFFFFF;
  --ok:#1F7A46; --warn:#8A6100; --bad:#9E2B20; --rail:#E8E9E7;
}
html[data-theme="dark"]{
  --bg:#0E1316; --surface:#151D22; --surface2:#1C262C; --ink:#E7EEEC; --muted:#93A5A0;
  --line:#2A3740; --accent:#2EC4B6; --accent2:#F2B705; --on-accent:#08201E;
  --ok:#3FBF77; --warn:#E0A72E; --bad:#E4695B; --rail:#1A242A;
}
html[data-theme="blue"]{
  --bg:#EDF2F9; --surface:#FFFFFF; --surface2:#E4ECF7; --ink:#101B2B; --muted:#516480;
  --line:#CBD8EA; --accent:#1B4E9B; --accent2:#E08A00; --on-accent:#FFFFFF;
  --ok:#1C7A55; --warn:#8A6100; --bad:#A22C24; --rail:#DFE8F5;
}
html[data-theme="green"]{
  --bg:#EFF4EC; --surface:#FFFFFF; --surface2:#E6EEE1; --ink:#121D14; --muted:#53674F;
  --line:#CDDAC6; --accent:#2F6B2A; --accent2:#B8760C; --on-accent:#FFFFFF;
  --ok:#2F6B2A; --warn:#8A6100; --bad:#9E2B20; --rail:#E3EBDE;
}
html[data-theme="purple"]{
  --bg:#F2EFF7; --surface:#FFFFFF; --surface2:#EAE4F3; --ink:#1B1426; --muted:#63587A;
  --line:#D9D0E8; --accent:#5B3A9B; --accent2:#C77A00; --on-accent:#FFFFFF;
  --ok:#2F7A54; --warn:#8A6100; --bad:#A22C4A; --rail:#E8E2F1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-ui);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  min-height:100vh;
}
body.hasbg::before{
  content:""; position:fixed; inset:0; z-index:-2;
  background-image:var(--bgimg); background-size:cover; background-position:center;
}
body.hasbg::after{
  content:""; position:fixed; inset:0; z-index:-1; background:var(--bg); opacity:.82;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent2); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

/* ============ SHELL ============ */
.top{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); display:flex; align-items:center;
  gap:14px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
}
.brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-.2px}
.brand svg{display:block}
.brand b{font-size:15px}
.brand span{display:block; font-size:11px; color:var(--muted); font-weight:400}
.topnav{margin-left:auto; display:flex; align-items:center; gap:6px}
.topnav .who{font-size:13px; color:var(--muted); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--surface2)}
.wrap{max-width:var(--w); margin:0 auto; padding:20px 16px 90px}

/* nav rail (desktop) */
.layout{display:grid; grid-template-columns:232px 1fr; gap:24px; max-width:var(--w); margin:0 auto; padding:20px 16px 90px}
.rail{position:sticky; top:66px; align-self:start; background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:8px}
.rail a{display:flex; gap:9px; align-items:center; padding:8px 10px; border-radius:var(--r); color:var(--ink); text-decoration:none; font-size:14px}
.rail a:hover{background:var(--surface2)}
.rail a.on{background:var(--accent); color:var(--on-accent)}
.rail hr{border:0; border-top:1px solid var(--line); margin:8px 4px}
.rail .cap{font-size:11px; color:var(--muted); padding:6px 10px 2px; letter-spacing:.02em}

/* mobile nav */
.mnav{display:none; position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--surface);
  border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(5,1fr)}
.mnav button{background:none; border:0; color:var(--muted); font-size:10.5px; display:flex;
  flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-family:inherit; cursor:pointer}
.mnav button.on{color:var(--accent)}
.mnav svg{width:20px;height:20px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr; padding-bottom:86px}
  .rail{display:none}
  .mnav{display:grid}
  .wrap{padding-bottom:86px}
}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:18px}
.card + .card{margin-top:14px}
.btn{font-family:inherit; font-size:14px; padding:9px 15px; border-radius:var(--r);
  border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); cursor:pointer;
  transition:filter var(--t)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:6px 11px; font-size:13px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.danger{background:var(--bad); border-color:var(--bad); color:#fff}
label.fld{display:block; margin:0 0 12px}
label.fld > span{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
input,select,textarea{font-family:inherit; font-size:15px; width:100%; padding:9px 11px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface); color:var(--ink)}
textarea{min-height:90px; resize:vertical}
input[type=file]{padding:7px; font-size:13px}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row > *{flex:1 1 200px}
.msg{padding:10px 12px; border-radius:var(--r); font-size:14px; margin:0 0 12px}
.msg.err{background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); border:1px solid color-mix(in srgb, var(--bad) 35%, transparent)}
.msg.ok{background:color-mix(in srgb, var(--ok) 12%, transparent); color:var(--ok); border:1px solid color-mix(in srgb, var(--ok) 35%, transparent)}
h1{font-size:26px; line-height:1.2; margin:0 0 6px; letter-spacing:-.4px}
h2{font-size:20px; margin:26px 0 8px; letter-spacing:-.2px}
h3{font-size:16px; margin:20px 0 6px}
.sub{color:var(--muted); font-size:14px; margin:0 0 18px}
.tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); background:var(--surface2)}
.tag.lec{border-color:var(--accent); color:var(--accent)}
.tag.pra{border-color:var(--accent2); color:var(--warn)}
.tag.lab{border-color:var(--ok); color:var(--ok)}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top}
th{background:var(--surface2); font-weight:600}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
code{font-family:var(--f-mono); font-size:13.5px; background:var(--surface2); padding:1px 4px; border-radius:3px}
pre{font-family:var(--f-mono); font-size:13px; background:var(--surface2); border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:var(--r); padding:12px; overflow-x:auto; line-height:1.45}
pre code{background:none; padding:0}
.bar{height:6px; background:var(--rail); border-radius:20px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:14px}
.stat b{display:block; font-size:28px; font-family:var(--f-mono); letter-spacing:-1px; line-height:1.1}
.stat span{font-size:12.5px; color:var(--muted)}
.empty{text-align:center; padding:34px 16px; color:var(--muted); font-size:14px}
.badge{font-family:var(--f-mono); font-size:11px; padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); background:var(--surface2); white-space:nowrap}
.badge.ok{border-color:var(--ok); color:var(--ok)}
.badge.warn{border-color:var(--accent2); color:var(--warn)}

/* ============ HERO (bosh sahifa) ============ */
.hero{position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r2); padding:28px 24px; overflow:hidden}
.hero .chip{display:inline-block; font-family:var(--f-mono); font-size:11.5px; color:var(--accent);
  border:1px solid var(--accent); border-radius:2px; padding:2px 6px}
.hero h1{font-size:clamp(27px,5.4vw,42px); margin:12px 0 10px; max-width:16ch}
.hero p{max-width:60ch; color:var(--muted); font-size:15.5px; margin:0 0 20px}
.hero .cta{display:flex; gap:10px; flex-wrap:wrap}
.chipline{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px; padding-top:18px; border-top:1px dashed var(--line)}
.chipline span{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.board{position:absolute; right:-40px; top:-10px; width:300px; opacity:.16; pointer-events:none}
@media (max-width:760px){.board{display:none}}

/* ============ HAFTA / DARS RO'YXATI ============ */
.weeks{display:flex; flex-direction:column; gap:10px}
.week{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); overflow:hidden}
.week > button{width:100%; display:flex; align-items:center; gap:12px; padding:13px 15px; background:none;
  border:0; font-family:inherit; font-size:15px; color:var(--ink); cursor:pointer; text-align:left}
.week > button:hover{background:var(--surface2)}
.wnum{font-family:var(--f-mono); font-size:12px; color:var(--on-accent); background:var(--accent);
  width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:none}
.week .ttl{flex:1; min-width:0}
.week .ttl b{display:block; font-weight:600; font-size:15px}
.week .ttl em{font-style:normal; font-size:12.5px; color:var(--muted)}
.week .pct{font-family:var(--f-mono); font-size:13px; color:var(--muted); flex:none}
.wbody{border-top:1px solid var(--line); padding:6px}
.lrow{display:flex; align-items:center; gap:10px; width:100%; padding:10px 11px; background:none; border:0;
  border-radius:var(--r); font-family:inherit; font-size:14.5px; color:var(--ink); cursor:pointer; text-align:left}
.lrow:hover{background:var(--surface2)}
.lrow .nm{flex:1; min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rail); flex:none}
.dot.part{background:var(--accent2)}
.dot.done{background:var(--ok)}

/* ============ DARS MATNI ============ */
.lesson{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:22px}
.lhead{border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px}
.lhead .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.lhead h1{font-size:clamp(21px,3.6vw,29px)}
.read{font-family:var(--f-read); font-size:17px; line-height:1.68; max-width:72ch}
.read p{margin:0 0 14px}
.read h2{font-family:var(--f-ui); font-size:19px; border-left:3px solid var(--accent); padding-left:10px}
.read h3{font-family:var(--f-ui)}
.read ul,.read ol{margin:0 0 14px; padding-left:22px}
.read li{margin-bottom:6px}
.read table{font-family:var(--f-ui); font-size:14px}
.formula{font-family:var(--f-mono); font-size:15.5px; background:var(--surface2); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 14px; text-align:center; margin:0 0 6px}
.fcap{font-size:13px; color:var(--muted); text-align:center; margin:0 0 16px; font-family:var(--f-ui)}
.note{font-family:var(--f-ui); font-size:14.5px; background:color-mix(in srgb, var(--accent2) 14%, transparent);
  border-left:3px solid var(--accent2); padding:11px 13px; border-radius:var(--r); margin:0 0 16px}
.fig{margin:0 0 18px; text-align:center}
.fig svg{max-width:100%; height:auto; background:var(--surface2); border:1px solid var(--line); border-radius:var(--r); padding:8px}
.fig figcaption{font-family:var(--f-ui); font-size:13px; color:var(--muted); margin-top:6px}
.pager{display:flex; gap:10px; justify-content:space-between; margin-top:20px}

/* ============ SIMULYATOR ============ */
.sim{background:var(--surface2); border:1px solid var(--line); border-radius:var(--r2); padding:14px; margin:0 0 18px; font-family:var(--f-ui)}
.sim h4{margin:0 0 4px; font-size:15px}
.sim .hint{font-size:13px; color:var(--muted); margin:0 0 12px}
.sim .ctrls{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px}
.sim .ctrls label{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px}
.sim input[type=range]{width:150px; padding:0}
.readout{font-family:var(--f-mono); font-size:13px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:8px 10px; margin-top:10px; white-space:pre-wrap; word-break:break-word}
.pinrow{display:flex; gap:6px; flex-wrap:wrap}
.pin{width:40px; height:40px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface);
  font-family:var(--f-mono); font-size:12px; cursor:pointer; color:var(--ink)}
.pin.hi{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}

/* ============ TEST ============ */
.q{border:1px solid var(--line); border-radius:var(--r2); padding:14px; margin-bottom:10px; background:var(--surface)}
.q h4{margin:0 0 10px; font-size:15.5px; font-weight:600}
.opt{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line);
  border-radius:var(--r); margin-bottom:6px; cursor:pointer; font-size:14.5px}
.opt:hover{background:var(--surface2)}
.opt input{width:auto; margin:3px 0 0; flex:none}
.opt.right{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 11%, transparent)}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 11%, transparent)}
.exp{font-size:13.5px; color:var(--muted); border-left:2px solid var(--accent); padding-left:9px; margin-top:8px}
.score{font-family:var(--f-mono); font-size:34px; letter-spacing:-1px}

/* ============ ADMIN ============ */
.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px; border-bottom:1px solid var(--line)}
.tabs button{background:none; border:0; border-bottom:2px solid transparent; padding:9px 12px;
  font-family:inherit; font-size:14px; color:var(--muted); cursor:pointer}
.tabs button.on{color:var(--ink); border-bottom-color:var(--accent)}
.chart{width:100%; height:190px}
.chart .gl{stroke:var(--line); stroke-width:1}
.chart text{font-size:10px; fill:var(--muted); font-family:var(--f-mono)}
.thumb{width:74px; height:52px; object-fit:cover; border-radius:var(--r); border:1px solid var(--line); cursor:pointer}
.swatches{display:flex; gap:8px; flex-wrap:wrap}
.sw{width:74px; border:1px solid var(--line); border-radius:var(--r2); padding:8px; cursor:pointer; background:var(--surface); font-size:12px; text-align:center; color:var(--ink); font-family:inherit}
.sw.on{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent)}
.sw i{display:block; height:26px; border-radius:var(--r); margin-bottom:5px; border:1px solid rgba(0,0,0,.12)}

/* ============ MODAL ============ */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55); display:grid; place-items:center; padding:16px}
.modal .box{background:var(--surface); border-radius:var(--r2); padding:18px; max-width:560px; width:100%; max-height:88vh; overflow:auto}
.modal img{max-width:100%; border-radius:var(--r)}
.hide{display:none!important}
@media print{.top,.rail,.mnav,.pager,.btn{display:none!important} .lesson{border:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="6" y="6" width="14" height="14" rx="2" fill="var(--accent)"/>
      <rect x="9.5" y="9.5" width="7" height="7" rx="1" fill="var(--on-accent)" opacity=".85"/>
      <g stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round">
        <path d="M9 6V2M13 6V2M17 6V2M9 24v-4M13 24v-4M17 24v-4M6 9H2M6 13H2M6 17H2M24 9h-4M24 13h-4M24 17h-4"/>
      </g>
    </svg>
    <div><b>Mikroprotsessor texnikasi</b><span>TDTU · elektron darslik</span></div>
  </div>
  <nav class="topnav" id="topnav"></nav>
</header>

<main id="app"></main>

<nav class="mnav" id="mnav"></nav>
<div id="modal"></div>
<script>
/* =====================================================================
   MIKROPROTSESSOR TEXNIKASI — elektron darslik (bitta fayl)
   Muallif: Abdukarimov Sherali Nurali o'g'li
   ===================================================================== */
"use strict";

/* ---------- kichik yordamchilar ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (tag, attrs, html) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === "class") n.className = attrs[k]; else n.setAttribute(k, attrs[k]); } if (html != null) n.innerHTML = html; return n; };
const pad = (n, w) => String(n).padStart(w || 2, "0");
const nowISO = () => new Date().toISOString();
const dstr = iso => { if (!iso) return "—"; const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const rnd = n => Math.floor(Math.random() * n);

/* ---------- SHA-256 (toza JS — file:// da ham ishlaydi) ---------- */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const K = [], H = [];
  let p = 2, n = 0;
  const isP = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  for (p = 2; n < 64; p++) { if (!isP(p)) continue; if (n < 8) H[n] = (Math.pow(p, .5) % 1 * 4294967296) | 0; K[n] = (Math.pow(p, 1 / 3) % 1 * 4294967296) | 0; n++; }
  const h = H.slice(0, 8);
  const bytes = [];
  const utf = unescape(encodeURIComponent(ascii));
  for (let i = 0; i < utf.length; i++) bytes.push(utf.charCodeAt(i) & 255);
  const bl = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push((i < 4 ? (bl / Math.pow(2, i * 8)) : 0) & 255);
  const w = new Array(64);
  for (let i = 0; i < bytes.length; i += 64) {
    for (let j = 0; j < 16; j++) w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
    for (let j = 16; j < 64; j++) {
      const s0 = rr(w[j - 15], 7) ^ rr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
      const s1 = rr(w[j - 2], 17) ^ rr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let j = 0; j < 64; j++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[j] + w[j]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

/* ---------- saqlash: IndexedDB, imkoni bo'lmasa localStorage ---------- */
const Store = {
  KEY: "mpt.state.v1", mode: "local", db: null,
  init() {
    return new Promise(res => {
      let done = false;
      const fin = m => { if (done) return; done = true; Store.mode = m; res(m); };
      try {
        if (!window.indexedDB) return fin("local");
        const rq = indexedDB.open("mpt_db", 1);
        rq.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv"); };
        rq.onsuccess = e => { Store.db = e.target.result; fin("idb"); };
        rq.onerror = () => fin("local");
        setTimeout(() => fin("local"), 1500);
      } catch (e) { fin("local"); }
    });
  },
  get() {
    return new Promise(res => {
      if (Store.mode === "idb" && Store.db) {
        try {
          const tx = Store.db.transaction("kv", "readonly").objectStore("kv").get(Store.KEY);
          tx.onsuccess = () => res(tx.result ? JSON.parse(tx.result) : null);
          tx.onerror = () => res(localGet());
          return;
        } catch (e) { }
      }
      res(localGet());
    });
    function localGet() { try { const v = localStorage.getItem(Store.KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  },
  set(obj) {
    const s = JSON.stringify(obj);
    try { localStorage.setItem(Store.KEY, s); } catch (e) { }
    if (Store.mode === "idb" && Store.db) { try { Store.db.transaction("kv", "readwrite").objectStore("kv").put(s, Store.KEY); } catch (e) { } }
  }
};

/* ---------- rasmni siqib dataURL qilish ---------- */
function fileToImg(file, maxW, q) {
  return new Promise((res, rej) => {
    if (!file) return rej("Fayl tanlanmadi");
    if (!/^image\//.test(file.type)) return rej("Faqat rasm fayli yuklanadi");
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width);
        const c = el("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q || .72));
      };
      img.onerror = () => rej("Rasmni o'qib bo'lmadi");
      img.src = fr.result;
    };
    fr.onerror = () => rej("Faylni o'qib bo'lmadi");
    fr.readAsDataURL(file);
  });
}

 equip:["Shaxsiy kompyuter yoki telefon","Blok-sxema chizish uchun daftar yoki grafik muharrir","Darslikning port va svetofor simulyatorlari","Kalkulyator"],
 plan:["Algoritm tushunchasi va xossalari","Tasvirlash usullari","Blok-sxema elementlari","Asosiy tuzilmalar","Amaliy masalalar yechish"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Algoritm — qo'yilgan masalani yechishga olib keladigan aniq, chekli va tartiblangan amallar ketma-ketligi. Mikrokontroller dasturi aslida algoritmning mashina tilidagi yozuvidir: dasturchi avval algoritmni ishlab chiqadi, so'ng uni C yoki assembler tilida ifodalaydi."],
  ["p","Algoritmning asosiy xossalari:"],
  ["ul",[
   "Diskretlik — amallar alohida qadamlarga ajratilgan",
   "Aniqlik — har bir qadam bir ma'noli tushuniladi",
   "Tushunarlilik — ijrochi bajara oladigan amallardan iborat",
   "Ommaviylik — bir turdagi masalalarning barchasi uchun yaroqli",
   "Natijaviylik — chekli qadamdan so'ng natija beradi"
  ]],
  ["p","Mikrokontroller dasturlarida natijaviylik xossasi o'ziga xos: asosiy sikl ataylab cheksiz qilinadi (while(1)), chunki qurilma quvvat berilgan vaqtning barchasida ishlashi kerak. Bu holda natijaviylik butun dasturga emas, uning har bir ichki qismiga qo'llanadi."],
  ["h","Algoritmni tasvirlash usullari"],
  ["t",["Usul","Mohiyati","Qo'llanishi"],[
   ["So'zli","Amallar oddiy jumlalar bilan bayon qilinadi","Boshlang'ich tavsif, texnik topshiriq"],
   ["Blok-sxema","Grafik belgilar va bog'lovchi chiziqlar","Loyiha hujjatlari, o'quv jarayoni"],
   ["Psevdokod","Dasturlash tiliga yaqin shartli yozuv","Kod yozishdan oldingi bosqich"],
   ["Dastur kodi","Tilning rasmiy sintaksisi","Bevosita bajarish"]
  ]],
  ["fig","flow","1-rasm. Blok-sxemaning asosiy elementlari va oddiy algoritm namunasi"],
  ["h","Asosiy tuzilmalar"],
  ["ol",[
   "Chiziqli tuzilma — amallar ketma-ket bajariladi. Masalan: portni sozlash, boshlang'ich qiymat berish, chiqishga qiymat yozish.",
   "Tarmoqlanuvchi tuzilma — shart tekshiriladi va natijaga qarab ikki yo'ldan biri tanlanadi. Masalan: tugma bosilganmi?",
   "Takrorlanuvchi tuzilma (sikl) — shart bajarilguncha amallar guruhi qayta bajariladi. Masalan: 8 ta LED ni navbat bilan yoqish.",
   "Qism dastur (funksiya) — takrorlanadigan amallar guruhi alohida nom bilan ajratiladi va kerak joyda chaqiriladi."
  ]],
  ["h","Masala namunasi"],
  ["p","Masala: tugma bosilganda LED yonsin, qo'yib yuborilganda o'chsin. Algoritmni uch usulda yozamiz."],
  ["c","So'zli:\n1. Portni sozla: LED chiqish, tugma kirish\n2. Tugma holatini o'qi\n3. Agar bosilgan bo'lsa LED ni yoq, aks holda o'chir\n4. 2-qadamga qayt\n\nPsevdokod:\n  sozlash()\n  while (rost) {\n      agar (tugma == 0) LED = 1\n      aks holda        LED = 0\n  }"],
  ["p","Ikkinchi masala: 1 dan N gacha sonlar yig'indisini hisoblash. Bu klassik sikl misoli bo'lib, mikrokontrollerda o'lchash natijalarini o'rtachalashda ishlatiladi."],
  ["c","yigindi = 0\ni = 1\nsikl:  agar i > N bo'lsa chiqish\n       yigindi = yigindi + i\n       i = i + 1\n       sikl ga qayt\nnatija = yigindi"],
  ["f","S = N · (N + 1) / 2","Tekshirish formulasi: N = 10 uchun S = 55. Algoritm natijasi shu qiymatga teng bo'lishi kerak."],
  ["h","Interaktiv qism"],
  ["p","Svetofor modeli tarmoqlanuvchi va takrorlanuvchi tuzilmalarning birgalikda ishlashini ko'rsatadi: har bir faza vaqti tugaganda keyingi holatga o'tiladi."],
  ["sim","traffic"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Variant raqamingiz N bo'lsin. 1 dan (10 + N) gacha sonlar yig'indisini hisoblovchi algoritmning blok-sxemasini chizing va natijani formula bilan tekshiring.",
   "Ikkita sonning kattasini aniqlovchi algoritmni blok-sxema va psevdokod ko'rinishida yozing.",
   "8 ta LED ni navbat bilan yoqadigan (yuguruvchi olov) algoritmni sikl yordamida tuzing.",
   "Svetofor algoritmini blok-sxemada tasvirlang; har bir faza davomiyligini ko'rsating.",
   "Cheksiz sikl mikrokontroller dasturida nima uchun zarurligini yozma asoslang.",
   "Chizgan blok-sxemangiz rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Algoritm dastur yozishning birinchi va eng muhim bosqichi. Blok-sxema algoritmni ko'rgazmali tasvirlab, xatolarni kod yozishdan oldin topish imkonini beradi. Har qanday murakkab mikrokontroller dasturi chiziqli, tarmoqlanuvchi va takrorlanuvchi tuzilmalarning kombinatsiyasidan iborat bo'ladi."]
 ],
 tests:[
  {q:"Algoritm nima?",o:["Dastur kodi","Masalani yechishga olib keladigan aniq va chekli amallar ketma-ketligi","Sxema chizish usuli","Xotira turi"],a:1,e:"Algoritm — tartiblangan, aniq va chekli amallar ketma-ketligi."},
  {q:"Algoritmning \"ommaviylik\" xossasi nimani bildiradi?",o:["Ko'p odam ishlatishini","Bir turdagi barcha masalalar uchun yaroqliligini","Tez bajarilishini","Qisqaligini"],a:1,e:"Ommaviylik — algoritm bitta emas, bir sinf masalalarni yechishi."},
  {q:"Blok-sxemada romb (to'rtburchak burchagida turgan shakl) nimani bildiradi?",o:["Boshlanish","Amal","Shartni tekshirish","Tugash"],a:2,e:"Romb — shartni tekshirish va tarmoqlanish belgisi."},
  {q:"Blok-sxemada parallelogramm nimani anglatadi?",o:["Kiritish-chiqarish","Hisoblash","Sikl","Qism dastur"],a:0,e:"Parallelogramm ma'lumot kiritish yoki chiqarishni bildiradi."},
  {q:"Mikrokontroller dasturida while(1) sikli nima uchun ishlatiladi?",o:["Xotirani tejash uchun","Qurilma quvvat berilgan vaqtda uzluksiz ishlashi uchun","Dasturni tugatish uchun","Chastotani oshirish uchun"],a:1,e:"MK dasturi to'xtamasligi kerak, shuning uchun asosiy sikl cheksiz bo'ladi."},
  {q:"Qaysi tuzilma shartga qarab ikki yo'ldan birini tanlaydi?",o:["Chiziqli","Tarmoqlanuvchi","Sikl","Qism dastur"],a:1,e:"Tarmoqlanuvchi tuzilmada shart natijasiga ko'ra yo'l tanlanadi."},
  {q:"1 dan 10 gacha sonlar yig'indisi qancha?",o:["45","50","55","100"],a:2,e:"S = 10·11/2 = 55."},
  {q:"Psevdokodning asosiy afzalligi nimada?",o:["Bevosita bajarilishida","Til sintaksisiga bog'lanmay algoritm mantiqini yozishida","Grafik ko'rinishida","Xotira tejashida"],a:1,e:"Psevdokod tilga bog'liq bo'lmagan oraliq yozuv."},
  {q:"Takrorlanadigan amallar guruhini alohida ajratish nima deyiladi?",o:["Sikl","Qism dastur (funksiya)","Shart","Massiv"],a:1,e:"Funksiya kodni takrorlamaslik va tuzilmani soddalashtirish imkonini beradi."},
  {q:"Algoritmni blok-sxemada tasvirlashning asosiy foydasi nima?",o:["Kod hajmini kamaytiradi","Mantiqiy xatolarni kod yozishdan oldin aniqlash imkonini beradi","Chastotani oshiradi","Xotirani tejaydi"],a:1,e:"Ko'rgazmali tasvir xatolarni erta bosqichda ochib beradi."}
 ]
},
{
 id:"S1-M2", sem:1, week:2, type:"lecture", no:2,
 title:"Mikroprotsessor ishlab chiqarish tarixi. Hisoblash sistemasida bir necha parallel protsessorlar. Mikroprotsessor turlari",
 goal:"Mikroprotsessorlarning rivojlanish bosqichlarini, parallel hisoblash tashkil etilishini va asosiy ishlab chiqaruvchilar mahsulotlarini o'zlashtirish.",
 outcomes:[
  "Mikroprotsessor avlodlarini asosiy belgilariga ko'ra tavsiflay oladi",
  "Mur qonunining mohiyatini va uning cheklovlarini tushuntira oladi",
  "Parallel hisoblash turlarini farqlay oladi",
  "Asosiy ishlab chiqaruvchilar va ularning mahsulotlarini qiyoslay oladi"
 ],
 plan:["Rivojlanish bosqichlari","Mur qonuni","Chastota o'sishining chegarasi","Parallel hisoblash turlari","Ko'p yadroli tizimlar","Mikroprotsessor turlari va ishlab chiqaruvchilar"],
 body:[
  ["h","Rivojlanish bosqichlari"],
  ["p","Birinchi mikroprotsessor 1971-yilda Intel 4004 nomi bilan chiqarildi. U 4 razryadli bo'lib, 2300 tranzistordan iborat edi va 740 kHz chastotada ishlagan. Undan keyingi ellik yil davomida tranzistorlar soni milliardlarga, chastota esa gigagertslarga yetdi."],
  ["t",["Avlod","Yillar","Vakil","Razryad","Xarakterli belgisi"],[
   ["I","1971–1973","Intel 4004, 8008","4/8","PMOS, past chastota, bir necha korpus"],
   ["II","1974–1977","Intel 8080, KR580VM80A, MOS 6502","8","NMOS, yagona +5 V manba, uzilishlar"],
   ["III","1978–1984","Intel 8086, Motorola 68000","16","Segmentli adreslash, konveyerning boshlanishi"],
   ["IV","1985–1995","i386, i486","32","Kesh, himoyalangan rejim, MMU"],
   ["V","1995–2005","Pentium, Athlon","32","Superskalyarlik, SIMD kengaytmalar"],
   ["VI","2005–hozir","Core, Ryzen, ARM Cortex","64","Ko'p yadrolilik, integratsiyalangan grafika"]
  ]],
  ["f","N(t) = N0 · 2^(t / 2)","Mur qonuni: kristalldagi tranzistorlar soni taxminan har ikki yilda ikki barobar ortadi."],
  ["p","Mur qonuni fizik qonun emas, balki sanoat rivojlanishining empirik kuzatuvi. So'nggi yillarda texnologik normalarning atom o'lchamiga yaqinlashishi tufayli uning bajarilishi sekinlashdi va rivojlanish asosan arxitektura hamda parallellik hisobiga davom etmoqda."],
  ["h","Chastota o'sishining chegarasi"],
  ["p","2000-yillarning boshigacha unumdorlik asosan takt chastotasini oshirish hisobiga o'sdi. Ammo CMOS sxemalarda dinamik quvvat sarfi chastotaga proporsional bo'lgani uchun chastota 3–4 GHz atrofida issiqlik chiqarish chegarasiga urildi."],
  ["f","P ≈ C · U² · f","Chastotani ikki barobar oshirish quvvatni ham taxminan ikki barobar oshiradi."],
  ["p","Shu sababli rivojlanish yo'nalishi o'zgardi: bitta yadroni tezlashtirish o'rniga bir nechta yadroni parallel ishlatishga o'tildi."],
  ["h","Parallel hisoblash turlari"],
  ["t",["Daraja","Mohiyati","Namunasi"],[
   ["Buyruqlar darajasida","Konveyer va superskalyarlik: bir taktda bir necha buyruq","Barcha zamonaviy yadrolar"],
   ["Ma'lumotlar darajasida (SIMD)","Bitta buyruq bir nechta ma'lumot ustida bajariladi","MMX, SSE, AVX, NEON"],
   ["Oqimlar darajasida","Bir yadroda bir necha mantiqiy oqim","Hyper-Threading"],
   ["Yadrolar darajasida","Bir kristalda bir necha to'liq yadro","Ko'p yadroli protsessorlar"],
   ["Tizim darajasida","Bir necha protsessor yoki kompyuter","Serverlar, klasterlar"]
  ]],
  ["p","Parallellikning samarasi cheklangan: dasturning ketma-ket bajariladigan qismi tezlashtirishga bo'ysunmaydi. Amdal qonuniga ko'ra, agar dasturning 10 % i ketma-ket bajarilsa, protsessorlar soni qancha bo'lishidan qat'i nazar tezlanish 10 barobardan oshmaydi."],
  ["f","S = 1 / (s + (1 − s)/n)","Amdal qonuni: s — ketma-ket qism ulushi, n — protsessorlar soni."],
  ["h","Mikroprotsessor turlari va ishlab chiqaruvchilar"],
  ["t",["Ishlab chiqaruvchi","Mahsulotlari","Sohasi"],[
   ["Intel","Core, Xeon, Celeron, Atom","Kompyuter, server, o'rnatilgan tizimlar"],
   ["AMD","Athlon, Ryzen, EPYC","Kompyuter va server protsessorlari"],
   ["VIA","C3, C7, Nano","Kam quvvatli x86 yechimlar"],
   ["NVIDIA","Tegra, grafik protsessorlar","Grafika va parallel hisoblash"],
   ["MCST","Elbrus","Mahalliy ishlab chiqarish, VLIW arxitekturasi"],
   ["Philips / NXP","LPC, mikrokontrollerlar","O'rnatilgan boshqarish tizimlari"],
   ["Hitachi / Renesas","SuperH, RX oilalari","Avtomobil va sanoat elektronikasi"],
   ["Sun / Oracle","SPARC","Server tizimlari"],
   ["ARM (litsenziya)","Cortex-A, Cortex-M","Smartfon, MK, IoT"]
  ]],
  ["p","Intel Celeron — kesh hajmi qisqartirilgan arzon turkum; AMD Athlon — x86 bozorida raqobat yaratgan oila; Elbrus — VLIW (keng buyruqli) arxitekturaga asoslangan, parallellikni kompilyator rejalashtiradigan protsessor. ARM esa o'zi kristall ishlab chiqarmay, arxitektura litsenziyasini sotadi va shu tufayli mobil qurilmalarda ustunlikka erishdi."],
  ["n","Muhim tendensiya: o'rnatilgan tizimlarda eng yuqori chastota emas, balki quvvat birligiga to'g'ri keladigan unumdorlik va kerakli periferiya tarkibi hal qiluvchi mezon bo'lib qolmoqda."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Mikroprotsessorlar 1971-yildan buyon olti avlodni bosib o'tdi; tranzistorlar soni Mur qonuni bo'yicha o'sdi, chastota esa quvvat chegarasiga urilib to'xtadi. Rivojlanish parallellikka — konveyer, SIMD, ko'p oqim va ko'p yadroga — o'tdi, ammo Amdal qonuni bu yo'lning ham chegarasini ko'rsatadi. Bugungi bozorda Intel, AMD, ARM, NVIDIA, Elbrus va boshqa ishlab chiqaruvchilar turli sohalarga ixtisoslashgan."]
 ],
 tests:[
  {q:"Birinchi mikroprotsessor qaysi va qachon chiqarilgan?",o:["Intel 8080, 1974","Intel 4004, 1971","Z80, 1976","MOS 6502, 1975"],a:1,e:"4 razryadli Intel 4004 birinchi mikroprotsessor hisoblanadi."},
  {q:"Mur qonuni nimani ta'riflaydi?",o:["Chastota o'sishini","Tranzistorlar sonining taxminan har ikki yilda ikki barobar ortishini","Quvvat sarfini","Xotira hajmini"],a:1,e:"Bu empirik kuzatuv, fizik qonun emas."},
  {q:"Takt chastotasi o'sishi nima sababdan to'xtadi?",o:["Tranzistor yetishmagani uchun","Quvvat sarfi va issiqlik chiqarish chegarasi tufayli","Dastur yozilmagani uchun","Xotira sekinligi uchun"],a:1,e:"P ≈ C·U²·f — chastota ortishi issiqlikni oshiradi."},
  {q:"SIMD nimani anglatadi?",o:["Bitta buyruq bir nechta ma'lumot ustida bajarilishini","Bir necha yadroni","Kesh darajasini","Xotira turini"],a:0,e:"Single Instruction Multiple Data — ma'lumotlar darajasidagi parallellik."},
  {q:"Hyper-Threading qaysi darajadagi parallellikka misol?",o:["Buyruqlar","Ma'lumotlar","Oqimlar","Tizim"],a:2,e:"Bitta yadroda bir necha mantiqiy oqim bajariladi."},
  {q:"Amdal qonuniga ko'ra dasturning 10 % i ketma-ket bo'lsa maksimal tezlanish qancha?",o:["2 marta","10 marta","100 marta","Cheksiz"],a:1,e:"S = 1/s = 1/0,1 = 10."},
  {q:"Intel Celeron turkumining xususiyati nima?",o:["Eng yuqori unumdorlik","Kesh hajmi qisqartirilgan arzon variant","Server protsessori","Grafik protsessor"],a:1,e:"Byudjet segmenti uchun mo'ljallangan."},
  {q:"Elbrus protsessorlari qaysi arxitekturaga asoslangan?",o:["CISC","RISC","VLIW","Garvard"],a:2,e:"Parallellikni kompilyator rejalashtiradi."},
  {q:"ARM kompaniyasining biznes modeli nimada?",o:["Kristall ishlab chiqarishda","Arxitektura litsenziyasini sotishda","Dastur sotishda","Xotira ishlab chiqarishda"],a:1,e:"Litsenziya modeli tufayli ARM mobil bozorda ustun."},
  {q:"NVIDIA asosan qaysi sohada tanilgan?",o:["Server SPARC protsessorlari","Grafik protsessorlar va parallel hisoblash","Mikrokontrollerlar","Xotira mikrosxemalari"],a:1,e:"GPU va Tegra platformasi shu kompaniyaga tegishli."}
 ]
},
{
 id:"S1-A2", sem:1, week:2, type:"practice", no:2,
 title:"Mikroprotsessor tizimlarida takt generatori",
 goal:"Taktlovchi generator turlarini, ularni mikrokontrollerga ulash sxemalarini va chastotaga bog'liq vaqt hisoblarini o'zlashtirish.",
 equip:["Mikrokontroller o'quv stendi yoki Proteus","Kvarts rezonator 4, 8, 20 MHz","Kondensatorlar 15–22 pF","Rezistor va kondensator RC generator uchun","Ossillograf yoki chastotomer","Darslikning taymer va PWM simulyatorlari"],
 plan:["Takt generatorining vazifasi","Generator turlari","Kvarts rezonatorli sxema","RC va ichki generator","Konfiguratsiya bitlari","Vaqt hisoblari"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Takt generatori — mikroprotsessorli tizimning barcha tugunlarini sinxronlashtiruvchi davriy impulslar manbai. Buyruqlarning bajarilishi, taymerlar, ADC va ketma-ket interfeyslarning ishlash tezligi — barchasi takt chastotasidan kelib chiqadi. Generator to'xtasa, protsessor ham to'xtaydi."],
  ["fig","clock","1-rasm. Kvarts rezonatorli va RC takt generatorlarini mikrokontrollerga ulash"],
  ["t",["Generator turi","Aniqligi","Chastota diapazoni","Qo'llanishi"],[
   ["Kvarts rezonator (XT, HS)","±0,001 % gacha","32 kHz – 20 MHz","UART, soat, o'lchash tizimlari"],
   ["Keramik rezonator","±0,5 %","1–20 MHz","Arzon maishiy qurilmalar"],
   ["RC zanjir (tashqi)","±5–10 %","100 kHz – 4 MHz","Vaqt aniqligi muhim bo'lmagan hollarda"],
   ["Ichki RC generator","±1–2 %","31 kHz – 8 MHz","Tashqi elementlarsiz loyihalar"],
   ["Tashqi generator (EC)","Manbaga bog'liq","0 – 20 MHz","Bir necha mikrosxemani sinxronlash"]
  ]],
  ["h","Kvarts rezonatorli sxema"],
  ["p","Kvarts rezonator OSC1 va OSC2 chiqishlariga ulanadi, har bir chiqish esa 15–22 pF kondensator orqali umumiy simga bog'lanadi. Kondensator qiymati rezonator hujjatidagi yuk sig'imiga qarab tanlanadi. Rezonator mikrokontroller korpusiga imkon qadar yaqin joylashtiriladi, o'tkazgichlar qisqa bo'ladi, ostidan boshqa signal yo'llari o'tkazilmaydi."],
  ["n","Xavfsizlik va montaj qoidasi: quvvat ulangan holda rezonatorni almashtirish mumkin emas. Kvarts korpusi metall bo'lsa, u umumiy simga ulanadi — aks holda sxema shovqinga sezgir bo'ladi."],
  ["h","Vaqt hisoblari"],
  ["f","T_takt = 1 / f_osc","Takt davri. f = 8 MHz → T = 125 ns."],
  ["f","T_sikl = 4 / f_osc","PIC da mashina sikli. f = 8 MHz → 500 ns; f = 20 MHz → 200 ns."],
  ["f","t = N · T_sikl","N ta bir sikli buyruq bajarilish vaqti — dasturiy kechikishlarni hisoblash asosi."],
  ["p","Misol. PIC16F877A, f = 4 MHz. Mashina sikli 1 µs. 1 ms kechikish uchun taxminan 1000 ta bir sikli buyruq kerak; bu odatda ichma-ich joylashgan ikki sikl bilan amalga oshiriladi."],
  ["c","/* XC8: konfiguratsiya va kechikish */\n#pragma config FOSC = HS      // yuqori chastotali kvarts generatori\n#pragma config WDTE = OFF     // watchdog o'chirilgan\n#define _XTAL_FREQ 8000000UL  // kompilyator kechikishni shu chastotaga hisoblaydi\n\nvoid main(void)\n{\n    TRISB = 0x00;             // PORTB chiqish\n    while(1)\n    {\n        PORTB = 0xFF;\n        __delay_ms(500);      // 500 ms\n        PORTB = 0x00;\n        __delay_ms(500);\n    }\n}"],
  ["p","Konfiguratsiya so'zidagi FOSC bitlari generator rejimini tanlaydi: LP — past chastotali kvarts (32 kHz), XT — o'rtacha (1–4 MHz), HS — yuqori chastotali (4–20 MHz), RC — tashqi RC zanjir, INTOSC — ichki generator. Noto'g'ri rejim tanlansa, mikrokontroller umuman ishga tushmaydi — bu boshlovchilar duch keladigan eng ko'p tarqalgan xato."],
  ["h","Interaktiv qism"],
  ["p","Taymer simulyatorida chastota va bo'luvchini o'zgartirib, to'lib ketish davri qanday hisoblanishini kuzating."],
  ["sim","timer"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Variant raqamingiz N bo'lsin. f = (4 + N) MHz uchun takt davrini va PIC mashina siklini hisoblang.",
   "Shu chastotada 100 ms kechikish uchun zarur mashina sikllari sonini toping.",
   "Kvarts rezonatorli ulash sxemasini chizing, kondensator qiymatlarini ko'rsating va tanlashni asoslang.",
   "XT, HS va INTOSC rejimlarini qiyoslovchi jadval tuzing: aniqlik, narx, tashqi elementlar.",
   "Generator chastotasini ikki barobar oshirsak, taymer davri va quvvat sarfi qanday o'zgarishini hisob bilan ko'rsating.",
   "Sxema yoki hisoblash daftaringiz rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Takt generatori tizimning barcha vaqt ko'rsatkichlarini belgilaydi. Kvarts rezonator eng yuqori aniqlikni beradi va ketma-ket aloqa uchun majburiy hisoblanadi, ichki RC generator esa tashqi elementlarni tejaydi. Konfiguratsiya bitlari orqali tanlangan generator rejimi dasturga emas, mikrokontrollerning apparat ishga tushishiga ta'sir qiladi."]
 ],

{
 id:"S1-A3", sem:1, week:3, type:"practice", no:3,
 title:"Ko'paytirish dasturini C dasturlash tilida tuzish",
 goal:"Ko'paytirish amalining dasturiy usullarini o'zlashtirish, uni C tilida amalga oshirish va bajarilish vaqtini baholash.",
 equip:["Shaxsiy kompyuter","MPLAB X + XC8 yoki istalgan C kompilyatori","Proteus (ixtiyoriy)","Darslikning ALU va port simulyatorlari"],
 plan:["Masalaning qo'yilishi","Takrorlangan qo'shish usuli","Siljitish va qo'shish usuli","C tilidagi amalga oshirish","Natijaning razryadliligi","Vaqt bo'yicha taqqoslash"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Ko'pgina 8 razryadli mikrokontrollerlarda (jumladan PIC16 oilasida) apparat ko'paytirgich yo'q. Shu sababli ko'paytirish dasturiy yo'l bilan bajariladi. Ikki 8 razryadli sonning ko'paytmasi 16 razryadgacha bo'lishi mumkin, shuning uchun natija uchun ikkita bayt ajratiladi."],
  ["f","P = A · B,  0 ≤ A,B ≤ 255  →  0 ≤ P ≤ 65 025","Natija 16 razryadli o'zgaruvchida saqlanadi."],
  ["h","Birinchi usul: takrorlangan qo'shish"],
  ["p","Eng sodda usul — A sonini B marta qo'shish. Tushunish oson, ammo B katta bo'lganda sekin ishlaydi: eng yomon holatda 255 ta qo'shish bajariladi."],
  ["c","uint16_t mul_add(uint8_t a, uint8_t b)\n{\n    uint16_t p = 0;\n    while (b--)          /* b marta takrorlanadi */\n        p += a;\n    return p;\n}"],
  ["h","Ikkinchi usul: siljitish va qo'shish"],
  ["p","Bu usul qo'lda ko'paytirish qoidasini takrorlaydi: ko'paytuvchining har bir biti tekshiriladi, bit 1 bo'lsa ko'paytiriluvchi natijaga qo'shiladi, so'ng ko'paytiriluvchi bir razryad chapga siljitiladi. 8 razryadli sonlar uchun har doim atigi 8 qadam bajariladi."],
  ["c","uint16_t mul_shift(uint8_t a, uint8_t b)\n{\n    uint16_t p = 0;\n    uint16_t m = a;          /* siljitiladigan ko'paytiriluvchi */\n\n    for (uint8_t i = 0; i < 8; i++)\n    {\n        if (b & 0x01)        /* quyi bit 1 bo'lsa qo'shamiz */\n            p += m;\n        m <<= 1;             /* ko'paytiriluvchini 2 ga ko'paytirish */\n        b >>= 1;             /* keyingi bitga o'tish */\n    }\n    return p;\n}"],
  ["t",["Qadam","b ning quyi biti","Amal","p"],[
   ["1","1 (b=13=00001101)","p += 5","5"],["2","0","qo'shilmaydi","5"],
   ["3","1","p += 20","25"],["4","1","p += 40","65"],["5–8","0","qo'shilmaydi","65"]
  ]],
  ["p","Jadvalda A = 5, B = 13 uchun hisob keltirilgan: natija 65 ga teng, ya'ni 5 · 13 = 65."],
  ["h","To'liq dastur"],
  ["c","#include <xc.h>\n#include <stdint.h>\n#define _XTAL_FREQ 8000000UL\n\nuint16_t mul_shift(uint8_t a, uint8_t b);\n\nvoid main(void)\n{\n    uint8_t  a = 25, b = 17;\n    uint16_t p;\n\n    TRISB = 0x00;            /* PORTB — natijaning quyi bayti */\n    TRISD = 0x00;            /* PORTD — yuqori bayt          */\n\n    p = mul_shift(a, b);     /* 25 * 17 = 425 = 0x01A9 */\n\n    while (1)\n    {\n        PORTB = (uint8_t)(p & 0x00FF);   /* 0xA9 */\n        PORTD = (uint8_t)(p >> 8);       /* 0x01 */\n    }\n}"],
  ["n","Diqqat: natijani uint8_t o'zgaruvchiga yozsangiz, yuqori bayt yo'qoladi va 425 o'rniga 169 hosil bo'ladi. Oraliq hisoblarda ham (uint16_t) turiga keltirish shart."],
  ["h","Usullarni taqqoslash"],
  ["t",["Usul","Qadamlar soni","f = 8 MHz da taxminiy vaqt","Kod hajmi"],[
   ["Takrorlangan qo'shish","B ga teng (1–255)","2–500 µs","kichik"],
   ["Siljitish va qo'shish","har doim 8","8–12 µs","o'rtacha"],
   ["Jadvalli (kichik diapazon uchun)","1","1 µs dan kam","katta (xotira sarfi)"]
  ]],
  ["h","Interaktiv qism"],
  ["p","ALU simulyatorida SHL amalini bajarib, chapga siljitish sonni 2 ga ko'paytirishini va C bayrog'iga chiqib ketgan bitni kuzating."],
  ["sim","alu"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Variant raqamingiz N bo'lsin. A = 20 + N, B = 12 + N sonlarini siljitish usuli bilan qo'lda ko'paytiring va jadval tuzing.",
   "mul_shift funksiyasini kompilyatorda tekshiring va natijani qo'lda hisobingiz bilan solishtiring.",
   "Ikki usulning qadamlar sonini B = 3 va B = 200 uchun taqqoslang, xulosa yozing.",
   "Natijani ikkita portga bayt-bayt chiqaruvchi dastur qismini yozing.",
   "Ko'paytirishni 2 ning darajasiga (2, 4, 8) siljitish bilan almashtirish mumkinligini kod bilan ko'rsating.",
   "Kod va natija ekranining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Apparat ko'paytirgichi bo'lmagan mikrokontrollerda ko'paytirish dasturiy amalga oshiriladi. Takrorlangan qo'shish sodda, lekin bajarilish vaqti operandga bog'liq; siljitish va qo'shish usuli esa har doim sakkiz qadamda tugaydi va real vaqt tizimlari uchun afzal. Natija razryadliligini to'g'ri tanlash — bu masalada eng ko'p uchraydigan xatoning oldini oladi."]
 ],
 tests:[
  {q:"Ikki 8 razryadli sonning ko'paytmasi maksimal necha razryadli bo'ladi?",o:["8","12","16","32"],a:2,e:"255·255 = 65 025 — 16 razryadli natija."},
  {q:"PIC16 oilasida apparat ko'paytirgich bormi?",o:["Ha, hamma modelda","Yo'q, ko'paytirish dasturiy bajariladi","Faqat 16 bitli sonlar uchun","Faqat ADC bilan"],a:1,e:"PIC16 da MUL buyrug'i yo'q, ko'paytirish dastur bilan amalga oshiriladi."},
  {q:"Siljitish va qo'shish usulida 8 razryadli sonlar uchun necha qadam bajariladi?",o:["B ga teng","Har doim 8","16","1"],a:1,e:"Har bir bit uchun bitta qadam, jami 8 ta."},
  {q:"Chapga bir razryad siljitish qaysi amalga teng?",o:["2 ga bo'lish","2 ga ko'paytirish","1 qo'shish","Inversiya"],a:1,e:"m <<= 1 sonni ikki barobar oshiradi."},
  {q:"5 · 13 ni siljitish usuli bilan hisoblaganda natija qancha?",o:["55","60","65","70"],a:2,e:"13 = 1101b: 5 + 20 + 40 = 65."},
  {q:"Natijani uint8_t o'zgaruvchiga yozsak nima yuz beradi?",o:["Hech nima","Yuqori bayt yo'qoladi","Dastur to'xtaydi","Natija ikki barobar bo'ladi"],a:1,e:"8 razryadli o'zgaruvchiga faqat quyi bayt sig'adi."},
  {q:"b >>= 1 operatori nima qiladi?",o:["b ni ikki barobar oshiradi","b ni o'ngga siljitib, keyingi bitni quyi razryadga chiqaradi","b ni nollaydi","b ni inversiyalaydi"],a:1,e:"O'ngga siljitish keyingi bitni tekshirishga tayyorlaydi."},
  {q:"Takrorlangan qo'shish usulining asosiy kamchiligi nima?",o:["Kod hajmi katta","Bajarilish vaqti ko'paytuvchiga bog'liq","Natija noto'g'ri","Xotira talab qilmaydi"],a:1,e:"B katta bo'lsa juda ko'p iteratsiya bajariladi."},
  {q:"425 sonining quyi bayti qanday?",o:["0x01","0xA9","0x4A","0xFF"],a:1,e:"425 = 0x01A9; quyi bayt 0xA9."},
  {q:"Sonni 8 ga ko'paytirishning eng tez usuli qaysi?",o:["8 marta qo'shish","Uch razryad chapga siljitish","Jadvaldan o'qish","Ikkiga bo'lish"],a:1,e:"8 = 2³, demak uch marta chapga siljitish yetarli."}
 ]
},

{
 id:"S1-A4", sem:1, week:4, type:"practice", no:4,
 title:"Proteus loyihalovchining avtomatlashtirilgan ish o'rnida mikrokontrollerli qurilmani tadqiq etish",
 goal:"Proteus muhitida mikrokontrollerli sxemani yig'ish, dasturni yuklash va virtual asboblar bilan tadqiq etishni o'zlashtirish.",
 equip:["Shaxsiy kompyuter","Proteus 8 (ISIS sxema muharriri va VSM modellashtirish tizimi)","MPLAB X + XC8 kompilyatori","Tayyor HEX fayl","Darslikning LED va PWM simulyatorlari"],
 plan:["Proteus haqida umumiy ma'lumot","Loyiha yaratish","Elementlarni tanlash va joylashtirish","Sxemani ulash","HEX faylni yuklash","Virtual asboblar bilan o'lchash"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Proteus — elektron qurilmalarni loyihalash va modellashtirishning avtomatlashtirilgan tizimi. Uning ikki asosiy qismi bor: ISIS — sxema muharriri va modellashtirish muhiti, ARES — bosma plata loyihalash muhiti. VSM (Virtual System Modelling) moduli mikrokontrollerni real dastur kodi bilan birga, atrofidagi analog va raqamli komponentlar bilan bitta muhitda modellashtirish imkonini beradi."],
  ["p","Modellashtirishning amaliy ahamiyati: sxemani apparat yig'ishdan oldin tekshirish, xatolarni komponentlarni kuydirmasdan topish, o'lchash asboblari bo'lmagan sharoitda signal shakllarini ko'rish va bir necha variantni tez taqqoslash."],
  ["fig","proteus","1-rasm. Proteusda mikrokontrollerli qurilmani tadqiq etish bosqichlari"],
  ["h","Ishni bajarish tartibi"],
  ["ol",[
   "Proteus 8 ni ishga tushiring va New Project buyrug'i bilan yangi loyiha yarating; sxema shablonini (DEFAULT) tanlang.",
   "ISIS oynasida P (Pick Devices) tugmasi orqali komponentlar kutubxonasini oching.",
   "Qidiruv maydoniga PIC16F877A yozib, mikrokontrollerni tanlang va loyihaga qo'shing.",
   "Xuddi shu tarzda LED-RED, RES (rezistor), BUTTON, CRYSTAL va POT-HG elementlarini qo'shing.",
   "Elementlarni ish maydoniga joylashtiring va Terminals Mode dan POWER hamda GROUND terminallarini qo'shing.",
   "Chiqishlarni sichqoncha bilan ulang: PORTB razryadlariga rezistor orqali LED, MCLR ni 10 kΩ rezistor orqali +5 V ga.",
   "Mikrokontroller ustiga ikki marta bosing, xossalar oynasida Program File maydoniga kompilyatordan olingan HEX faylni ko'rsating va Processor Clock Frequency ni 8 MHz qilib belgilang.",
   "Virtual asboblardan OSCILLOSCOPE, DC VOLTMETER va COUNTER TIMER ni sxemaga ulang.",
   "Play tugmasi bilan modellashtirishni ishga tushiring va natijani kuzating.",
   "Pause rejimida Debug menyusi orqali registrlar va xotira holatini ko'rib chiqing."
  ]],
  ["n","Diqqat: Proteusda rezistorsiz LED yoki ulanmagan MCLR liniyasi ko'pincha modellashtirishning ishlamasligiga sabab bo'ladi. Xatolar ro'yxati Simulation Log oynasida ko'rsatiladi — ish boshlanmasa avvalo shu oynani tekshiring."],
  ["h","Tekshiriladigan dastur"],
  ["c","#include <xc.h>\n#pragma config FOSC = HS, WDTE = OFF, PWRTE = ON, LVP = OFF\n#define _XTAL_FREQ 8000000UL\n\nvoid main(void)\n{\n    ADCON1 = 0x06;        /* PORTA raqamli rejim */\n    TRISB  = 0x00;        /* PORTB chiqish       */\n    TRISD  = 0xFF;        /* PORTD kirish        */\n\n    while (1)\n    {\n        if (PORTDbits.RD0 == 0)   /* tugma bosilgan   */\n            PORTB = 0xFF;         /* barcha LED yonadi */\n        else\n            PORTB = 0x01;         /* faqat bittasi     */\n        __delay_ms(100);\n    }\n}"],
  ["h","Virtual asboblar"],
  ["t",["Asbob","Vazifasi","Nimani o'lchaymiz"],[
   ["OSCILLOSCOPE","Signal shaklini vaqt bo'yicha ko'rsatish","Impuls davri, davomiyligi, fronti"],
   ["DC/AC VOLTMETER","Kuchlanishni o'lchash","Port chiqishidagi daraja, LED dagi tushuv"],
   ["DC AMMETER","Tokni o'lchash","LED orqali oqayotgan tok"],
   ["COUNTER TIMER","Impulslarni sanash va chastota o'lchash","Generator chastotasi, PWM chastotasi"],
   ["LOGIC ANALYSER","Bir necha raqamli liniyani birga kuzatish","Portlar holatining o'zgarishi"],
   ["VIRTUAL TERMINAL","UART ma'lumotlarini ko'rsatish","Uzatilgan matn va kodlar"]
  ]],
  ["h","Interaktiv qism"],
  ["p","Proteusdagi ossillograf bilan ishlashdan oldin PWM signalining parametrlari qanday o'zgarishini quyidagi modelda kuzatib chiqing."],
  ["sim","pwm"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Proteusda PIC16F877A va 8 ta LED dan iborat sxemani yig'ing, HEX faylni yuklang va ishlashini tekshiring.",
   "Ossillograf bilan PORTB.0 chiqishidagi signal davrini o'lchang va dasturdagi kechikish qiymatiga mosligini tekshiring.",
   "DC ammetr bilan LED orqali oqayotgan tokni o'lchang va nazariy hisob bilan solishtiring.",
   "Rezistor qiymatini 330 Ω dan 1 kΩ ga o'zgartirib, tokning o'zgarishini jadvalga yozing.",
   "Tugma qo'shib, uning bosilishiga qarab LED holati o'zgarishini modellashtiring.",
   "Modellashtirish oynasi va ossillogramma ekranining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Proteus mikrokontrollerli qurilmani apparat yig'ishdan oldin to'liq tekshirish imkonini beradi: sxema yig'iladi, real HEX fayl yuklanadi va virtual asboblar bilan o'lchovlar bajariladi. Modellashtirish natijalari nazariy hisoblarga mos kelishi loyihaning to'g'ri ekanini tasdiqlaydi, farq bo'lsa — sxema yoki dasturda xato borligini ko'rsatadi."]
 ],

{

 outcomes:[

 plan:[

 body:[
  ["h","Protsessorning funksiyalari"],
  ["ul",[
   "Buyruqlarni xotiradan olish, deshifratsiya qilish va bajarish",
   "Arifmetik va mantiqiy amallarni bajarish",
   "Dastur oqimini boshqarish: shartli va shartsiz o'tishlar, qism dasturlarni chaqirish",

   "Uzilishlarga xizmat ko'rsatish va prioritetlarni hisobga olish",
   "Tizim tugunlarini takt signallari va boshqaruv signallari bilan sinxronlash"
  ]],
  ["h","Mikrodasturiy boshqaruv va uni saqlash qurilmasi"],
  ["p","Boshqaruv qurilmasi ikki xil usulda qurilishi mumkin. Qattiq mantiqli boshqaruvda har bir buyruq uchun kerakli signallar ketma-ketligi mantiqiy sxemalar bilan qotirib qo'yiladi: bu usul eng tez ishlaydi, ammo buyruqlar tizimini o'zgartirish uchun kristallni qaytadan loyihalash kerak bo'ladi."],
  ["p","Mikrodasturiy boshqaruvda esa har bir mashina buyrug'i elementar mikroamallar ketma-ketligi — mikrodastur ko'rinishida ifodalanadi. Mikrodasturlar maxsus doimiy xotirada (mikrodasturlarni saqlash qurilmasi, boshqaruv xotirasi) saqlanadi. Buyruq kodi deshifrator orqali shu xotiradagi mikrodastur boshlang'ich adresiga aylantiriladi, so'ng mikrodastur qadamma-qadam o'qilib bajariladi."],
  ["t",["Belgi","Qattiq mantiqli boshqaruv","Mikrodasturiy boshqaruv"],[
   ["Tezligi","Yuqori","Pastroq"],
   ["Buyruqlar tizimini o'zgartirish","Kristallni qayta loyihalash kerak","Mikrodasturni almashtirish yetarli"],
   ["Murakkab buyruqlar","Sxema keskin murakkablashadi","Osongina qo'shiladi"],
   ["Tipik qo'llanish","RISC protsessorlar","CISC protsessorlar"]
  ]],
  ["p","Mikrodasturning har bir qatori — mikrokomanda. Uning razryadlari bevosita boshqaruv signallariga mos keladi: registrga yozish, ALU amalini tanlash, shinani ochish va hokazo. Mikrokomandaning bir qismi esa keyingi mikrokomanda adresini ko'rsatadi."],
  ["h","Hisoblagich registrlar"],
  ["p","Hisoblagich registr — o'ziga kelgan har bir impulsdan keyin qiymatini birga oshiradigan yoki kamaytiradigan registr. Mikroprotsessorda ular bir necha joyda ishlatiladi:"],
  ["ul",[
   "Komandalar hisoblagichi (PC) — keyingi buyruq adresini avtomatik oshiradi",
   "Mikrokomandalar hisoblagichi — boshqaruv xotirasidagi joriy mikrokomanda adresini saqlaydi",
   "Stek ko'rsatkichi (SP) — stekka yozish va o'qishda avtomatik o'zgaradi",
   "Sikl hisoblagichlari — takrorlanishlar sonini sanaydi",
   "Taymer-hisoblagichlar — takt yoki tashqi impulslarni sanaydi"
  ]],
  ["p","Hisoblagich registr triggerlar zanjiridan tashkil topadi: har bir trigger to'lib ketganda keyingisiga o'tkazma beradi. n ta triggerdan iborat hisoblagich 0 dan 2^n − 1 gacha sanaydi va keyin qaytadan noldan boshlanadi."],

  ["h","Xotira turlari"],
  ["t",["Turi","Energiyaga bog'liqligi","Yozish imkoni","Qo'llanishi"],[
   ["ROM","Bog'liq emas","Ishlab chiqarishda bir marta","Ommaviy mahsulotda doimiy dastur"],
   ["EPROM","Bog'liq emas","Ultrabinafsha nur bilan o'chiriladi","Eski tizimlar"],
   ["EEPROM","Bog'liq emas","Elektr bilan bayt-bayt","Sozlamalar, kalibrlash koeffitsientlari"],
   ["Flash","Bog'liq emas","Elektr bilan blok-blok","Dastur xotirasi"],
   ["SRAM","Bog'liq","Cheksiz, tez","O'zgaruvchilar, stek"],
   ["DRAM","Bog'liq, regeneratsiya talab qiladi","Cheksiz","Katta hajmli operativ xotira"]
  ]],
  ["p","Xotiraning asosiy parametrlari: hajm (bayt yoki so'z), tashkil etilishi (masalan 8 K × 8), murojaat vaqti, yozish sikllari soni va saqlash muddati. Flash uchun odatda 10 000 – 100 000 yozish sikli, EEPROM uchun 1 000 000 gacha sikl kafolatlanadi — shuning uchun tez-tez o'zgaradigan qiymatlarni EEPROM ga uzluksiz yozish mumkin emas."],
  ["fig","mem","1-rasm. Mikrokontroller xotira fazosining taqsimoti"],
  ["h","Xotira ierarxiyasi"],
  ["p","Tez xotira qimmat, arzon xotira sekin. Shuning uchun xotira ierarxiya bo'yicha tashkil qilinadi: registrlar (eng tez, eng kam hajm) → kesh → operativ xotira → doimiy xotira → tashqi tashuvchilar. Mikrokontrollerlarda ierarxiya qisqa: registrlar, SRAM va Flash."],
  ["h","Kiritish-chiqarish qurilmalari"],
  ["p","Kiritish-chiqarish tuguni tashqi dunyo bilan protsessor o'rtasidagi moslashtiruvchi bo'g'in vazifasini bajaradi: signal darajalarini moslashtiradi, ma'lumotni buferlaydi, holat bayroqlarini shakllantiradi va kerak bo'lsa uzilish so'rovini beradi."],
  ["t",["Registr","Vazifasi"],[
   ["Ma'lumot registri","Uzatiladigan yoki qabul qilingan baytni saqlaydi"],
   ["Yo'nalish registri (TRIS)","Har bir liniyaning kirish yoki chiqish ekanini belgilaydi"],
   ["Holat registri","Tayyorlik, xatolik, band bo'lish bayroqlari"],
   ["Boshqaruv registri","Ish rejimi, tezlik, uzilish ruxsati"]
  ]],
  ["h","Kiritish-chiqarish adreslash usullari"],
  ["ol",[
   "Xotiraga proyeksiyalangan (memory-mapped) — portlar umumiy adres fazosining bir qismini egallaydi va oddiy xotira buyruqlari bilan boshqariladi. PIC va AVR shu usuldan foydalanadi.",
   "Ajratilgan adres fazosi (isolated I/O) — portlar alohida fazoda joylashadi va maxsus IN/OUT buyruqlari bilan boshqariladi. x86 arxitekturasiga xos."
  ]],
  ["p","Birinchi usulning afzalligi — maxsus buyruqlar kerak emas va portlar bilan xotira kabi to'liq ishlash mumkin. Kamchiligi — portlar adres fazosining bir qismini egallaydi."],
  ["h","Tugunlarning o'zaro ta'siri"],
  ["p","Bitta buyruqning bajarilishi uch tugunni ham ishga soladi. Masalan, MOVF PORTD, W buyrug'ida protsessor Flash dan buyruq kodini oladi (dastur xotirasi), so'ng PORTD registrini o'qiydi (kiritish qurilmasi) va natijani W registriga yozadi (protsessor ichki resursi). Shu tarzda har bir buyruq tizimning uch qismini bog'laydi."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Protsessor buyruqlarni bajaradi va tizimni boshqaradi, xotira ma'lumot va dasturni saqlaydi, kiritish-chiqarish qurilmalari esa tashqi dunyo bilan aloqani ta'minlaydi. Xotira turlari energiyaga bog'liqligi, yozish imkoni va tezligi bo'yicha farqlanadi va shu belgilarga qarab vazifaga mos tanlanadi. Mikrokontrollerlarda portlar xotira fazosida joylashgani sababli ular bilan ishlash oddiy ko'chirish buyruqlari orqali amalga oshadi."]
 ],

  ["p","Registr — ikkilik ma'lumotni vaqtincha saqlash va u ustida elementar amallarni (yozish, o'qish, siljitish) bajarish uchun mo'ljallangan tugun. Registr triggerlar to'plamidan iborat: har bir trigger bitta razryadni saqlaydi, demak n razryadli registr n ta triggerdan tashkil topadi."],

{
 id:"S1-A6", sem:1, week:6, type:"practice", no:6,
 title:"PIC mikrokontrollerlarning komandalar tizimi",
 goal:"PIC16 buyruqlar tizimining tarkibini, formatini va buyruqlarning bajarilish vaqtini amaliy o'zlashtirish.",
 equip:["Shaxsiy kompyuter","MPLAB X (Simulator rejimi)","PIC16F877A buyruqlar jadvali","Daftar","Darslikning ALU simulyatori"],
 plan:["Buyruqlar tizimining tarkibi","Buyruq formatlari","Bayt, bit va boshqaruv buyruqlari","W registr va fayl registrlari","Trassirovka","Vaqt hisobi"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PIC16 oilasida atigi 35 ta buyruq bor va ularning barchasi bir xil 14 bitli so'z ko'rinishida kodlanadi. O'tish va PC ni o'zgartiruvchi buyruqlardan tashqari hamma buyruq bitta mashina siklida bajariladi. Bu dasturning bajarilish vaqtini oldindan aniq hisoblash imkonini beradi."],
  ["p","Arxitektura akkumulyator asosida qurilgan: W (Working) registr ALU ning doimiy operandi bo'lib xizmat qiladi. Ikkinchi operand esa f — fayl registri, ya'ni ma'lumot xotirasidagi yacheyka yoki maxsus funksional registr (PORTB, TRISB, STATUS va boshqalar)."],
  ["h","Buyruqlar guruhlari"],
  ["t",["Guruh","Namunalar","Izoh"],[
   ["Bayt bilan ishlash","MOVWF f, MOVF f,d, ADDWF f,d, SUBWF f,d, CLRF f, INCF f,d","Natija d = 0 bo'lsa W ga, d = 1 bo'lsa f ga yoziladi"],
   ["Bit bilan ishlash","BSF f,b, BCF f,b, BTFSS f,b, BTFSC f,b","Alohida razryadni o'rnatish, tozalash va tekshirish"],
   ["Konstanta va boshqaruv","MOVLW k, ADDLW k, ANDLW k, CALL, GOTO, RETURN, RETFIE","k — bevosita berilgan sakkiz razryadli qiymat"]
  ]],
  ["c","; Tipik buyruqlar va ularning ma'nosi\n    MOVLW  0x0F      ; W <- 0x0F                (1 sikl)\n    MOVWF  TRISB     ; TRISB <- W               (1 sikl)\n    BSF    PORTB, 0  ; PORTB ning 0-biti = 1    (1 sikl)\n    BCF    PORTB, 0  ; PORTB ning 0-biti = 0    (1 sikl)\n    BTFSS  PORTD, 0  ; RD0 = 1 bo'lsa keyingi buyruq tashlab ketiladi\n    GOTO   LOOP      ; o'tish                   (2 sikl)\n    ADDWF  0x20, 1   ; (0x20) <- (0x20) + W\n    DECFSZ 0x21, 1   ; (0x21)-- ; natija 0 bo'lsa keyingi buyruq tashlanadi"],
  ["h","Shartli bajarish mexanizmi"],
  ["p","PIC da shartli o'tish buyruqlari yo'q. Uning o'rniga \"tekshir va tashlab ket\" (skip) buyruqlari ishlatiladi: BTFSS, BTFSC, DECFSZ, INCFSZ. Shart bajarilsa keyingi buyruq NOP bilan almashtiriladi va u ikki sikl oladi, aks holda odatdagidek bajariladi. Shu sababli PIC da shart quyidagicha yoziladi:"],
  ["c","; Tugma bosilganmi? (RD0 = 0 bo'lsa bosilgan)\nLOOP:\n    BTFSS  PORTD, 0   ; RD0 = 1 bo'lsa keyingisini tashlab ket\n    GOTO   BOSILGAN   ; RD0 = 0 -> tugma bosilgan\n    BCF    PORTB, 0   ; bosilmagan: LED o'chadi\n    GOTO   LOOP\nBOSILGAN:\n    BSF    PORTB, 0   ; LED yonadi\n    GOTO   LOOP"],
  ["h","Bajarilish vaqti hisobi"],
  ["f","t = (N1 · 1 + N2 · 2) · 4 / f_osc","N1 — bir sikli, N2 — ikki sikli buyruqlar soni."],
  ["p","Misol. f = 8 MHz, mashina sikli 500 ns. Sikl tanasi 6 ta bir sikli va 2 ta ikki sikli buyruqdan iborat bo'lsa: t = (6 + 4) · 500 ns = 5 µs. Demak sikl sekundiga taxminan 200 000 marta takrorlanadi."],
  ["h","Trassirovka namunasi"],
  ["t",["№","Buyruq","W","(0x20)","Z bayrog'i"],[
   ["1","MOVLW 0x05","05","—","o'zgarmaydi"],
   ["2","MOVWF 0x20","05","05","o'zgarmaydi"],
   ["3","MOVLW 0x03","03","05","o'zgarmaydi"],
   ["4","SUBWF 0x20, 0","02","05","0"],
   ["5","MOVLW 0x05","05","05","0"],
   ["6","SUBWF 0x20, 0","00","05","1"]
  ]],
  ["p","4-qadamda SUBWF f,0 buyrug'i (f − W) ni hisoblab natijani W ga yozadi: 05 − 03 = 02. 6-qadamda 05 − 05 = 00 bo'lgani uchun Z bayrog'i o'rnatiladi — bu solishtirish amalining PIC dagi ko'rinishi."],
  ["sim","alu"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Variant raqamingiz N bo'lsin. W = (0x10 + N) va (0x20) = 0x30 uchun ADDWF 0x20,1 va SUBWF 0x20,0 buyruqlarini bajarib, trassirovka jadvalini tuzing.",
   "BSF va BCF buyruqlaridan foydalanib, PORTB ning faqat 2- va 5-razryadlarini yoquvchi kod yozing.",
   "BTFSC buyrug'i bilan tugma holatiga qarab tarmoqlanuvchi kod yozing va uning BTFSS bilan farqini tushuntiring.",
   "DECFSZ asosida 200 martalik kechikish sikli yozing va uning bajarilish vaqtini f = 8 MHz uchun hisoblang.",
   "Buyruqlarni uch guruhga (bayt, bit, konstanta va boshqaruv) ajratib, har biriga uchtadan misol yozing.",
   "MPLAB X Simulator da dasturingizni qadamma-qadam bajarib, registrlar oynasi rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","PIC16 buyruqlar tizimi 35 ta bir xil formatli buyruqdan iborat va RISC yondashuvining aniq namunasi. Barcha amallar W registr va fayl registrlari o'rtasida bajariladi, natija yo'nalishi d bayrog'i bilan belgilanadi. Shartlar \"tekshir va tashlab ket\" buyruqlari orqali amalga oshiriladi; bajarilish vaqti buyruqlar sonidan bevosita hisoblanadi."]
 ],

{
 id:"S1-M7", sem:1, week:7, type:"lecture", no:7,
 title:"Flaglar haqida umumiy tushuncha. Flaglar turlari",
 goal:"Flaglar (bayroqlar) tushunchasini, ularning turlarini va shartli bajarilishdagi rolini o'zlashtirish.",
 outcomes:[
  "Qo'shish va ayirish buyruqlarining bayroqlarga ta'sirini aniqlay oladi",
  "Ko'p baytli arifmetikani C bayrog'i orqali tashkil qila oladi",
  "Solishtirish amalini arifmetika orqali tushuntira oladi",
  "BCD arifmetikasining xususiyatini izohlay oladi"
 ],
 plan:[
  "Flag tushunchasi",
  "Flaglar registri",
  "Arifmetik flaglar",
  "Boshqaruv flaglari",
  "Flaglar va shartli bajarilish",
  "Ko'p baytli arifmetikada flaglar"
 ],
 body:[
  ["h","Flag tushunchasi"],
  ["p","Flag (bayroq) — protsessorning holat registridagi bitta razryad bo'lib, oxirgi bajarilgan amal natijasining biror xususiyatini qayd etadi. Flaglar amal natijasining o'zini emas, balki u haqidagi qo'shimcha ma'lumotni saqlaydi: natija nolga tengmi, o'tkazma chiqdimi, ishora qandayligi va hokazo."],
  ["p","Flaglarning ahamiyati shundaki, protsessor shartli bajarilish haqidagi qarorni faqat shu bitlarga tayanib qabul qiladi. Ya'ni har qanday shartli o'tish aslida bitta flag holatini tekshirishdan iborat."],
  ["h","Flaglar turlari"],
  ["t",["Flag","Nomi","Qachon o'rnatiladi","Guruhi"],[
   ["C","Carry — o'tkazma","Eng katta razryaddan o'tkazma chiqqanda","Arifmetik"],
   ["Z","Zero — nol","Natijaning barcha razryadlari nol bo'lganda","Arifmetik"],
   ["N / S","Negative / Sign — ishora","Natijaning eng katta biti 1 bo'lganda","Arifmetik"],
   ["V / OV","Overflow — to'lib ketish","Ishorali arifmetikada natija diapazondan chiqqanda","Arifmetik"],
   ["DC / H","Digit (Half) Carry","Quyi tetradadan o'tkazma bo'lganda","Arifmetik"],
   ["P","Parity — juftlik","Natijadagi birlar soni juft bo'lganda","Arifmetik"],
   ["I / GIE","Interrupt Enable","Uzilishlarga ruxsat berilganda","Boshqaruv"],
   ["T / TO","Time-out","Watchdog vaqti tugaganda","Holat"],
   ["PD","Power Down","SLEEP rejimiga o'tilganda","Holat"]
  ]],
  ["p","Flaglar ikki guruhga bo'linadi. Birinchi guruh — amal natijasiga qarab apparat tomonidan avtomatik o'rnatiladigan arifmetik flaglar. Ikkinchi guruh — dasturchi o'zi o'rnatadigan va tozalaydigan boshqaruv flaglari (masalan uzilishlarga ruxsat biti). Holat flaglari esa protsessor qanday sababdan qayta ishga tushganini aniqlash imkonini beradi."],
  ["n","Muhim: har bir buyruq ham flaglarni o'zgartiravermaydi. Ko'chirish buyruqlari odatda flaglarga tegmaydi, inkrement va dekrement faqat Z ni yangilaydi, qo'shish va ayirish esa barcha arifmetik flaglarni o'zgartiradi. Shu sababli flagni tekshirishdan oldin oradagi buyruqlar uni buzmasligiga ishonch hosil qilish kerak."],

  ["h","Arifmetik buyruqlar tarkibi"],
  ["t",["Buyruq","Amal","Ta'sir qiladigan bayroqlar"],[
   ["ADDWF f,d","W + f","C, DC, Z"],["ADDLW k","W + konstanta","C, DC, Z"],
   ["SUBWF f,d","f − W","C, DC, Z"],["SUBLW k","konstanta − W","C, DC, Z"],
   ["INCF f,d","f + 1","Z"],["DECF f,d","f − 1","Z"],
   ["INCFSZ f,d","f + 1, natija 0 bo'lsa keyingi buyruq tashlanadi","—"],
   ["DECFSZ f,d","f − 1, natija 0 bo'lsa keyingi buyruq tashlanadi","—"]
  ]],
  ["h","Qo'shish va bayroqlar"],
  ["p","Qo'shish natijasi 8 razryaddan oshsa, chiqib ketgan bit C bayrog'iga tushadi va akkumulyatorda faqat quyi bayt qoladi. Bu holat xato emas — u ko'p baytli arifmetikaning asosi hisoblanadi."],
  ["c","  1111 0000   (0xF0 = 240)\n+ 0010 0000   (0x20 =  32)\n-----------\n1 0001 0000   natija 0x10 = 16, C = 1\n\n  Ishorasiz talqinda haqiqiy natija = 256 + 16 = 272"],
  ["p","DC (Digit Carry) bayrog'i quyi tetradadan yuqori tetradaga o'tkazma bo'lganda o'rnatiladi va BCD arifmetikasida ishlatiladi. Z bayrog'i esa natija barcha razryadlari nol bo'lganda birga teng bo'ladi."],
  ["h","Ayirish mexanizmi"],
  ["p","PIC da ayirish qo'shimcha kod orqali bajariladi: SUBWF f,d buyrug'i aslida f + (NOT W) + 1 amalini hisoblaydi. Shu sababli C bayrog'i bu yerda qarz emas, balki teskari qarz sifatida talqin qilinadi: C = 1 bo'lsa ayirish qarzsiz bajarilgan (f ≥ W), C = 0 bo'lsa qarz hosil bo'lgan (f < W)."],
  ["t",["Holat","Shart","C bayrog'i","Z bayrog'i"],[
   ["f > W","Ayirma musbat","1","0"],["f = W","Ayirma nol","1","1"],["f < W","Ayirma manfiy","0","0"]
  ]],
  ["p","Aynan shu jadval PIC da solishtirish amalini tashkil qiladi: SUBWF dan keyin C va Z bayroqlarini tekshirish orqali ikki sonning munosabati aniqlanadi."],
  ["c","; (0x20) va konstanta 0x50 ni solishtirish\n      MOVLW  0x50\n      SUBWF  0x20, 0     ; W <- (0x20) - 0x50, natija saqlanmaydi\n      BTFSS  STATUS, C\n      GOTO   KICHIK      ; C = 0 -> (0x20) < 0x50\n      BTFSC  STATUS, Z\n      GOTO   TENG        ; Z = 1 -> teng\n      GOTO   KATTA       ; qolgan holat -> katta"],
  ["h","Ko'p baytli arifmetika"],
  ["p","16 razryadli sonlarni qo'shish ikki bosqichda bajariladi: avval quyi baytlar qo'shiladi, so'ng C bayrog'i hisobga olingan holda yuqori baytlar. PIC da ADDWFC buyrug'i klassik PIC16 da yo'q, shuning uchun o'tkazma qo'lda qo'shiladi."],
  ["c","; 16 bitli qo'shish: (0x21:0x20) + (0x23:0x22) -> (0x21:0x20)\n      MOVF   0x22, 0\n      ADDWF  0x20, 1      ; quyi baytlar qo'shildi, C o'rnatilishi mumkin\n      BTFSC  STATUS, C\n      INCF   0x21, 1      ; o'tkazma bo'lsa yuqori baytga 1 qo'shiladi\n      MOVF   0x23, 0\n      ADDWF  0x21, 1      ; yuqori baytlar qo'shildi"],
  ["h","Inkrement va dekrement"],
  ["p","INCF va DECF buyruqlari faqat Z bayrog'ini yangilaydi, C ga tegmaydi. Shuning uchun 0xFF ni oshirganda natija 0x00 bo'ladi va C emas, Z bayrog'i o'rnatiladi. DECFSZ esa sikllarni tashkil qilishning asosiy vositasi: hisoblagich nolga yetganda sikldan chiqiladi."],
  ["c","; 200 martalik sikl\n      MOVLW  200\n      MOVWF  0x30\nSIKL: NOP\n      DECFSZ 0x30, 1     ; hisoblagich kamayadi, 0 bo'lsa keyingi tashlanadi\n      GOTO   SIKL\n      ; sikl tugadi"],
  ["h","BCD arifmetikasi"],
  ["p","O'nlik indikatorlar bilan ishlashda sonlar BCD ko'rinishida saqlanadi: har bir o'nlik raqam alohida tetradada. Oddiy ikkilik qo'shish BCD da noto'g'ri natija beradi, chunki tetrada 9 dan oshib ketishi mumkin. Tuzatish uchun natijaga 6 qo'shiladi va DC bayrog'i tekshiriladi. PIC16 da maxsus DAA buyrug'i yo'q, shuning uchun tuzatish dasturiy bajariladi."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Arifmetik buyruqlar C, DC va Z bayroqlarini shakllantiradi va bu bayroqlar keyingi shartli bajarilishning asosi bo'ladi. PIC da ayirish qo'shimcha kod orqali amalga oshgani uchun C teskari qarz sifatida talqin qilinadi. Ko'p baytli arifmetika C bayrog'ini bosqichlar orasida uzatish orqali tashkil qilinadi, BCD arifmetikasi esa qo'shimcha tuzatish talab qiladi."]
 ],
 tests:[
  {q:"ADDWF buyrug'i qaysi bayroqlarga ta'sir qiladi?",o:["Faqat Z","C, DC va Z","Faqat C","Hech qaysiga"],a:1,e:"Qo'shish uchta bayroqni ham yangilaydi."},
  {q:"0xF0 + 0x20 amalidan keyin akkumulyatorda nima qoladi?",o:["0x110","0x10","0xF0","0x00"],a:1,e:"Quyi bayt 0x10 qoladi, o'tkazma C ga chiqadi."},
  {q:"SUBWF f,0 buyrug'i qaysi amalni bajaradi?",o:["W − f","f − W","f + W","f AND W"],a:1,e:"Fayl registridan W ayiriladi."},
  {q:"PIC da ayirishdan keyin C = 0 bo'lsa bu nimani anglatadi?",o:["Natija nol","Qarz hosil bo'lgan, ya'ni f < W","f > W","Xato"],a:1,e:"C teskari qarz sifatida talqin qilinadi."},
  {q:"SUBWF dan keyin Z = 1 bo'lsa nima xulosa qilinadi?",o:["f > W","f < W","f = W","Xato bor"],a:2,e:"Ayirma nolga teng, demak qiymatlar teng."},
  {q:"DC bayrog'i qachon o'rnatiladi?",o:["Natija nol bo'lganda","Quyi tetradadan yuqori tetradaga o'tkazma bo'lganda","Natija manfiy bo'lganda","Har doim"],a:1,e:"Digit Carry BCD arifmetikasi uchun kerak."},
  {q:"INCF buyrug'i qaysi bayroqni yangilaydi?",o:["Faqat C","Faqat Z","C va Z","Hech qaysi"],a:1,e:"Inkrement C ga ta'sir qilmaydi."},
  {q:"16 bitli qo'shishda quyi baytlardan keyin nima tekshiriladi?",o:["Z bayrog'i","C bayrog'i va kerak bo'lsa yuqori baytga 1 qo'shiladi","DC bayrog'i","Hech nima"],a:1,e:"O'tkazma yuqori baytga uzatilishi shart."},
  {q:"DECFSZ buyrug'i nima uchun ishlatiladi?",o:["Portni o'qish","Sikl hisoblagichini kamaytirib, nolga yetganda sikldan chiqish","Bayroqlarni tozalash","Xotira yozish"],a:1,e:"Sikllarni tashkil qilishning standart usuli."},
  {q:"BCD qo'shishda tetrada 9 dan oshsa nima qilinadi?",o:["Hech nima","Natijaga 6 qo'shib tuzatiladi","Natija nollanadi","C tozalanadi"],a:1,e:"O'nlik tuzatish 6 qo'shish orqali bajariladi."}
 ]
},
{
 id:"S1-A7", sem:1, week:7, type:"practice", no:7,
 title:"PIC mikrokontrollerli qurilmalar ishini tekshirish va sozlash",
 goal:"Mikrokontrollerli qurilmadagi nosozliklarni tizimli qidirish va dasturni otladka qilish usullarini o'zlashtirish.",
 equip:["PIC o'quv stendi yoki Proteus","Multimetr","Ossillograf yoki mantiqiy probnik","MPLAB X Simulator/Debugger","Darslikning tugma va LED simulyatori"],
 plan:["Nosozliklar tasnifi","Apparat qismini tekshirish tartibi","Dasturiy otladka usullari","Break point va qadamma-qadam bajarish","Tipik xatolar","Hisobot rasmiylashtirish"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Mikrokontrollerli qurilma ishlamaganda muammo uch joyda bo'lishi mumkin: apparat qismida (montaj, quvvat, komponent), konfiguratsiyada (generator, WDT, LVP bitlari) yoki dasturda (algoritm xatosi). Tekshirish har doim oddiydan murakkabga — avval quvvat, so'ng signal, oxirida dastur mantiqi tartibida olib boriladi."],
  ["n","Xavfsizlik: o'lchashlarni faqat multimetr yoki ossillografning umumiy simi qurilma GND siga ulangan holda bajaring. Quvvat berilgan sxemada mikrosxema oyoqchalarini metall asboblar bilan qisqa tutashtirmang."],
  ["h","Apparat qismini tekshirish tartibi"],
  ["ol",[
   "Quvvat kuchlanishini VDD va VSS oyoqchalarida o'lchang: 5 V ± 0,25 V bo'lishi kerak.",
   "MCLR liniyasidagi kuchlanishni tekshiring: u 10 kΩ rezistor orqali +5 V ga tortilgan va yuqori darajada bo'lishi shart. MCLR past bo'lsa kristall doimiy reset holatida turadi.",
   "Generator ishlayotganini ossillograf bilan OSC2 da tekshiring; kvarts ishlamasa sinusga yaqin tebranish ko'rinmaydi.",
   "Port chiqishlarida daraja o'zgarishini kuzating: dastur ishlayotgan bo'lsa, LED liniyasida davriy o'zgarish bo'ladi.",
   "Kondensatorlarni tekshiring: har bir quvvat oyoqchasiga 0,1 µF bloklovchi kondensator qo'yilgan bo'lishi kerak.",
   "Ulanishlarni sxema bilan solishtiring va \"sovuq payvand\" ni lupa ostida tekshiring."
  ]],
  ["t",["Belgi","Ehtimoliy sabab","Tekshirish"],[
   ["Hech narsa ishlamaydi","Quvvat yo'q yoki MCLR pastda","VDD va MCLR da kuchlanishni o'lchash"],
   ["Kristall qayta yuklanaveradi","Watchdog yoqilgan, tozalanmagan","WDTE bitini va CLRWDT() ni tekshirish"],
   ["Dastur juda sekin ishlaydi","Generator ichki RC ga tushib qolgan","FOSC konfiguratsiyasini tekshirish"],
   ["PORTA dan hech narsa o'qilmaydi","Liniyalar analog rejimda","ADCON1 registrini sozlash"],
   ["LED xira yonadi","Rezistor qiymati katta yoki quvvat pasaygan","Tokni o'lchash, R ni hisoblash"],
   ["Tugma bir bosishga bir necha marta ishlaydi","Kontaktlar titrashi filtrlanmagan","Dasturiy kechikish qo'shish"]
  ]],
  ["h","Dasturiy otladka usullari"],
  ["ul",[
   "Qadamma-qadam bajarish (Step Into / Step Over) — har bir buyruqdan keyin registrlar holatini kuzatish",
   "To'xtash nuqtalari (breakpoint) — dasturni kerakli joyda to'xtatib, o'zgaruvchilarni tekshirish",
   "Watch oynasi — tanlangan o'zgaruvchi va registrlar qiymatini real vaqtda kuzatish",
   "Stopwatch — ikki nuqta orasidagi sikllar sonini va vaqtni o'lchash",
   "Diagnostik chiqish — bo'sh port razryadiga LED ulab, dastur qaysi tarmoqqa kirganini ko'rsatish",
   "UART orqali nosozlik xabarlarini kompyuterga yuborish"
  ]],
  ["c","/* Diagnostik belgilar bilan tekshirish */\nvoid main(void)\n{\n    init_ports();\n    PORTBbits.RB7 = 1;      /* 1-belgi: sozlash tugadi */\n\n    while (1)\n    {\n        if (PORTDbits.RD0 == 0)\n        {\n            PORTBbits.RB6 = 1;   /* 2-belgi: shart bajarildi */\n            PORTB |= 0x0F;\n        }\n        else\n        {\n            PORTBbits.RB6 = 0;\n            PORTB &= 0xF0;\n        }\n        __delay_ms(50);\n    }\n}"],
  ["h","Interaktiv qism"],
  ["p","Tugma simulyatorida drebezg rejimini yoqib, filtrsiz hisoblagichning noto'g'ri ishlashini kuzating — bu amalda eng ko'p uchraydigan \"dastur to'g'ri, lekin qurilma noto'g'ri ishlaydi\" holati."],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Stend yoki Proteusda ishlamayotgan sxema bering (o'qituvchi tomonidan xato kiritiladi) va nosozlikni tizimli tartibda toping.",
   "VDD, MCLR va OSC2 nuqtalaridagi o'lchash natijalarini jadvalga yozing.",
   "MPLAB X Simulator da breakpoint qo'yib, tugma bosilgandagi PORTD qiymatini kuzating.",
   "Stopwatch bilan asosiy sikl bajarilish vaqtini o'lchang va nazariy hisob bilan solishtiring.",
   "Yuqoridagi jadvalga o'zingiz duch kelgan ikkita yangi nosozlik belgisini qo'shing.",
   "Otladka oynasi yoki o'lchash natijalarining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Nosozlikni qidirish tizimli tartibda — quvvat, reset, generator, portlar, dastur ketma-ketligida olib boriladi. Apparat tekshiruvi multimetr va ossillograf bilan, dasturiy tekshiruv esa breakpoint, qadamma-qadam bajarish va Watch oynasi yordamida bajariladi. Diagnostik chiqishlar dastur oqimini kuzatishning eng sodda va samarali usuli bo'lib qolmoqda."]
 ],
 tests:[

{
 id:"S1-M9", sem:1, week:9, type:"lecture", no:9,
 title:"Boshqaruv sxemalari. Mikroprotsessorning ichki ma'lumotlar shinasi",
 goal:"Boshqaruv qurilmasining tuzilishini, boshqaruv signallarini shakllantirishni va mikroprotsessorning ichki ma'lumotlar shinasini o'zlashtirish.",
 outcomes:[
  "PC ning har bir buyruqdan keyingi holatini aniqlay oladi",
  "Shartsiz va shartli o'tishlarni ajrata oladi",
  "Qism dasturga o'tish va qaytish mexanizmini stek orqali tushuntira oladi",

 ],
 plan:[
  "Boshqaruv qurilmasining tuzilishi",
  "Ichki ma'lumotlar shinasi",
  "Boshqaruv signallari",
  "Komandalar hisoblagichi",
  "Qism dastur va stek",
