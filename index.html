  ["p","8N1 formati eng keng tarqalgan: 8 ma'lumot biti, paritetsiz, 1 stop bit. Bunda bitta bayt uzatish uchun 10 bit kerak bo'ladi."],
  ["f","t_bayt = 10 / v","9600 bod uchun 1,04 ms; 115200 bod uchun 87 µs."],
  ["f","v_amaliy = v / 10  (bayt/s)","9600 bod ≈ 960 bayt/s."],
  ["h","Bod tezligi va xato"],
  ["p","Bod tezligi mikrokontrollerning takt chastotasidan bo'luvchi orqali hosil qilinadi. Bo'luvchi butun son bo'lishi kerak, shuning uchun ba'zi chastota va tezlik juftliklarida nomuvofiqlik yuzaga keladi."],
  ["f","UBRR = f_osc / (16 · v) − 1","AVR uchun bod generatori qiymati. 16 MHz va 9600 bod → UBRR = 103."],
  ["p","Xato 2 % dan oshsa aloqa ishonchsiz bo'ladi. Aynan shu sababli UART ishlatiladigan qurilmalarda 11,0592 MHz yoki 14,7456 MHz kabi \"g'alati\" chastotali kvartslar qo'llanadi — ular standart bod tezliklariga butun bo'luvchi beradi."],
  ["h","RS-232 darajalari va MAX232"],
  ["t",["Parametr","TTL/CMOS (MK)","RS-232 (kompyuter)"],[
   ["Mantiqiy 1","+5 V (yoki +3,3 V)","−3…−15 V"],
   ["Mantiqiy 0","0 V","+3…+15 V"],
   ["Mantiq","To'g'ri","Inversiyalangan"],
   ["Masofa","0,5 m gacha","15 m gacha"],
   ["Shovqinga bardoshlik","Past","Yuqoriroq"]
  ]],
  ["p","Ko'rinib turibdiki, darajalar nafaqat farq qiladi, balki inversiyalangan ham. Shuning uchun mikrokontrollerni kompyuterning COM portiga bevosita ulash mumkin emas — MAX232 kabi daraja o'zgartirgich ishlatiladi. U ichki kuchlanish nasosi yordamida +5 V dan ±10 V hosil qiladi va buning uchun to'rtta tashqi kondensator talab qiladi."],
  ["n","Xavfsizlik: RS-232 liniyasini bevosita mikrokontroller portiga ulash manfiy va katta kuchlanish tufayli kirishni darhol ishdan chiqaradi. Zamonaviy platalarda esa USB-UART o'zgartirgich ishlatiladi va u allaqachon TTL darajalarida ishlaydi."],
  ["h","Kompyuter bilan aloqa"],
  ["c","void setup()\n{\n    Serial.begin(9600);\n    Serial.println(\"Tizim tayyor. Buyruq kiriting:\");\n}\n\nvoid loop()\n{\n    if (Serial.available() > 0)              /* bufer bo'sh emasmi */\n    {\n        String buyruq = Serial.readStringUntil('\\n');\n        buyruq.trim();\n\n        if (buyruq == \"LED ON\")       { digitalWrite(13, HIGH); Serial.println(\"OK: yoqildi\"); }\n        else if (buyruq == \"LED OFF\") { digitalWrite(13, LOW);  Serial.println(\"OK: ochirildi\"); }\n        else if (buyruq == \"STATUS\")  { Serial.print(\"Ishlash vaqti: \"); Serial.println(millis()/1000); }\n        else                          Serial.println(\"XATO: noma'lum buyruq\");\n    }\n}"],
  ["h","Ikki mikrokontroller o'rtasida aloqa"],
  ["p","Ikki platani UART orqali bog'lash uchun birinchisining TX liniyasi ikkinchisining RX liniyasiga, va aksincha, ulanadi; umumiy sim (GND) albatta birlashtiriladi. Umumiy sim ulanmasa signal darajalari uchun mos yo'q bo'ladi va aloqa ishlamaydi — bu tipik xato."],
  ["h","Sodda protokol tuzish"],
  ["ul",[
   "Kadr boshlanishi va oxirini belgilash (masalan ':' va '\\n')",
   "Buyruq kodi va parametrlarni ajratish",
   "Nazorat yig'indisi qo'shish (barcha baytlar yig'indisining quyi bayti)",
   "Qabul qiluvchi tomonda javob (ACK) yoki xato kodi qaytarish",

  ]],
  ["c",":01 LED 1 7A\\n\n |  |   | |\n |  |   | +-- nazorat yig'indisi\n |  |   +---- parametr\n |  +-------- buyruq\n +----------- qurilma adresi"],
  ["sim","uart"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Serial Monitor orqali buyruqlar bilan LED ni boshqaruvchi dasturni yuklang va tekshiring.",
   "Ossillograf bilan TX liniyasidagi kadrni kuzating; bir bitning davomiyligini o'lchang va bod tezligi bilan solishtiring.",
   "Variant raqamingiz N bo'lsin: (9600 · 2^(N mod 3)) tezlikda ishlashni sozlang va kadr davomiyligini hisoblang.",
   "16 MHz va 9600 bod uchun UBRR qiymatini hisoblang va haqiqiy tezlik xatosini toping.",
   "Ikki platani TX–RX qilib ulang va birinchisidan ikkinchisiga son yuboring.",
   "Umumiy simni ataylab uzib, aloqa buzilishini kuzating va sababini izohlang.",
   "Nazorat yig'indisi bilan sodda protokol yozing va buzilgan kadrni rad etishni tekshiring.",
   "Ossillogramma va Serial Monitor rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","USART asinxron rejimda start va stop bitlari bilan ajratilgan kadrlar orqali ishlaydi; 8N1 formatida bitta bayt 10 bit joy oladi. Bod tezligi takt chastotasidan bo'luvchi bilan hosil qilinadi va xato 2 % dan oshmasligi kerak. RS-232 darajalari TTL dan farq qiladi hamda inversiyalangan, shuning uchun MAX232 kabi o'zgartirgich zarur. Ishonchli aloqa uchun kadr chegaralari va nazorat yig'indisi bo'lgan sodda protokol tuziladi."]

{
 id:"S2-M26", sem:2, week:11, type:"lecture", no:26,
 title:"PIC16F8X mikrokontrollerlarining buyruqlar sistemasi",
 goal:"PIC16F8X ning 35 ta buyrug'ini guruhlarga ajratib o'zlashtirish va dastur bajarilish vaqtini hisoblashni o'rganish.",
 outcomes:[

 ],
 plan:["Buyruq formatlari","Bayt bilan ishlash buyruqlari","Bit bilan ishlash buyruqlari","Konstanta va boshqaruv buyruqlari","Shartli bajarilish","Vaqt hisobi","Tipik dastur bo'laklari"],
 body:[
  ["h","Buyruq formatlari"],
  ["p","PIC16F8X da 35 ta buyruq mavjud va ularning barchasi 14 bitli bir xil uzunlikdagi so'z bilan kodlanadi. Formatiga ko'ra ular uch guruhga bo'linadi."],
  ["fig","fmt","1-rasm. PIC16 buyruq formatlari va maydonlari"],
  ["t",["Format","Tuzilishi","Namunasi","Izoh"],[
   ["Bayt bilan ishlash","6 bit COP + d + 7 bit f","ADDWF f,d","d = 0 → natija W ga, d = 1 → f ga"],
   ["Bit bilan ishlash","4 bit COP + 3 bit b + 7 bit f","BSF f,b","b — razryad raqami (0–7)"],
   ["Konstanta va boshqaruv","6 bit COP + 8 bit k","MOVLW k","k — bevosita qiymat"]
  ]],
  ["h","Bayt bilan ishlash buyruqlari"],
  ["t",["Buyruq","Amali","Ta'sir qiladigan flaglar"],[
   ["MOVWF f","f ← W","—"],["MOVF f,d","f ni ko'chirish","Z"],
   ["CLRF f / CLRW","Nollash","Z"],["ADDWF f,d","W + f","C, DC, Z"],
   ["SUBWF f,d","f − W","C, DC, Z"],["INCF f,d / DECF f,d","f ± 1","Z"],
   ["ANDWF, IORWF, XORWF","Mantiqiy amallar","Z"],["COMF f,d","Inversiya","Z"],
   ["RLF f,d / RRF f,d","C orqali aylantirish","C"],["SWAPF f,d","Tetradalarni almashtirish","—"]
  ]],
  ["h","Bit bilan ishlash buyruqlari"],
  ["c","    BSF    PORTB, 2     ; PORTB ning 2-bitini 1 ga o'rnatish\n    BCF    PORTB, 2     ; PORTB ning 2-bitini tozalash\n    BTFSS  PORTA, 0     ; bit 1 bo'lsa keyingi buyruq tashlab ketiladi\n    BTFSC  PORTA, 0     ; bit 0 bo'lsa keyingi buyruq tashlab ketiladi"],
  ["p","Bit buyruqlari W registrini band qilmaydi va bitta siklda bajariladi, shuning uchun alohida razryadlar bilan ishlashda ular maskalash amallaridan afzal. Ammo ular read-modify-write tamoyilida ishlaydi: yacheyka o'qiladi, o'zgartiriladi va qayta yoziladi."],
  ["h","Konstanta va boshqaruv buyruqlari"],
  ["t",["Buyruq","Amali","Sikllar"],[
   ["MOVLW k","W ← k","1"],["ADDLW k / SUBLW k","W bilan arifmetika","1"],
   ["ANDLW, IORLW, XORLW","W bilan mantiq","1"],["GOTO adres","PC ← adres","2"],
   ["CALL adres","Stekka saqlab o'tish","2"],["RETURN / RETLW k","Qaytish","2"],
   ["RETFIE","Uzilishdan qaytish","2"],["CLRWDT","Watchdog ni tozalash","1"],
   ["SLEEP","Uyqu rejimiga o'tish","1"],["NOP","Amal yo'q","1"]
  ]],
  ["h","Shartli bajarilish"],
  ["p","PIC da shartli o'tish buyruqlari yo'q. Ularning o'rnini \"tekshir va tashlab ket\" buyruqlari egallaydi: BTFSS, BTFSC, DECFSZ, INCFSZ. Shart bajarilsa keyingi buyruq o'rniga NOP bajariladi va u ikki sikl oladi."],
  ["c","; Tugma bosilganmi? (RA0 = 0 bo'lsa bosilgan)\nLOOP: BTFSS  PORTA, 0     ; RA0 = 1 bo'lsa keyingisini tashlab ket\n      GOTO   BOSILGAN    ; RA0 = 0 -> bosilgan\n      BCF    PORTB, 0    ; bosilmagan: LED o'chadi\n      GOTO   LOOP\nBOSILGAN:\n      BSF    PORTB, 0    ; LED yonadi\n      GOTO   LOOP"],
  ["p","Ikki qiymatni solishtirish ham shu mexanizm bilan bajariladi: SUBWF buyrug'i ayirma hosil qiladi, so'ng STATUS registrining Z va C bitlari BTFSS yoki BTFSC bilan tekshiriladi."],
  ["h","Bajarilish vaqti hisobi"],
  ["f","t = (N1 + 2·N2) · 4 / f_osc","N1 — bir sikli buyruqlar, N2 — ikki sikli (o'tish va tashlangan) buyruqlar soni."],
  ["p","Misol. f = 4 MHz, mashina sikli 1 µs. Sikl tanasi 6 ta bir sikli va 2 ta ikki sikli buyruqdan iborat bo'lsa: t = (6 + 4) · 1 µs = 10 µs, ya'ni sikl sekundiga 100 000 marta takrorlanadi."],
  ["h","Tipik dastur bo'laklari"],
  ["c","; 1) Dasturiy kechikish (ichma-ich ikki sikl)\nDELAY: MOVLW  250\n       MOVWF  0x10\nD1:    MOVLW  200\n       MOVWF  0x11\nD2:    DECFSZ 0x11, 1\n       GOTO   D2\n       DECFSZ 0x10, 1\n       GOTO   D1\n       RETURN\n\n; 2) Portning yuguruvchi olovi\n       MOVLW  0x01\n       MOVWF  PORTB\nSHIFT: BCF    STATUS, C\n       RLF    PORTB, 1     ; chapga siljitish\n       CALL   DELAY\n       GOTO   SHIFT\n\n; 3) Jadval asosida kod o'zgartirish (7-segment)\nKOD:   ADDWF  PCL, 1\n       RETLW  0x3F        ; 0\n       RETLW  0x06        ; 1\n       RETLW  0x5B        ; 2"],
  ["n","PCL ga qo'shish orqali jadvalga sakrash faqat bitta sahifa ichida to'g'ri ishlaydi. Jadval sahifa chegarasidan o'tib ketsa, PCLATH registri ham to'g'ri sozlanishi kerak, aks holda dastur noto'g'ri adresga o'tadi."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","PIC16F8X ning 35 ta buyrug'i bayt, bit va konstanta formatlariga bo'linadi; barchasi bir xil 14 bitli so'z bilan kodlanadi. Shartli bajarilish skip buyruqlari orqali amalga oshiriladi, solishtirish esa ayirish va flaglarni tekshirishdan iborat. Buyruqlarning asosan bir siklda bajarilishi dastur vaqtini aniq hisoblash imkonini beradi."]
 ],

{
 id:"S2-L11", sem:2, week:11, type:"lab", no:11,
 title:"Mikrokontrollerli termometrni tadqiq etish",
 goal:"Harorat datchigidan signal olish, uni raqamlashtirish, kalibrlash va natijani indikatorga chiqarish tizimini tadqiq etish.",
 equip:["Arduino Uno va USB kabel","LM35 yoki DS18B20 datchigi","NTC termistor 10 kΩ va rezistor 10 kΩ","LCD 16×2","Etalon termometr, muzli suv, issiq suv"],
 plan:["Tizim tuzilmasi","Datchikni tanlash","LM35 bilan o'lchash","NTC bilan o'lchash","Raqamli datchik","Kalibrlash va xatolar"],
 body:[
  ["h","Tizim tuzilmasi"],
  ["p","Raqamli termometr to'rt bosqichdan iborat: datchik haroratni elektr kattalikka aylantiradi, moslashtiruvchi zanjir signalni ADC diapazoniga keltiradi, mikrokontroller kodni haroratga aylantiradi, indikator natijani ko'rsatadi."],
  ["fig","temp","1-rasm. Mikrokontrollerli termometrning tuzilmaviy sxemasi"],
  ["t",["Datchik","Chiqishi","Diapazoni","Aniqligi","Xususiyati"],[
   ["LM35","10 mV/°C, chiziqli","0…100 °C","±0,5 °C","Kalibrlash talab qilmaydi"],
   ["NTC termistor","Qarshilik, chiziqsiz","−40…125 °C","±1…2 °C","Arzon, hisob murakkab"],
   ["DS18B20","Raqamli, 1-Wire","−55…125 °C","±0,5 °C","ADC kerak emas, 12 razryad"],
   ["Termojuft (K tipi)","mV EYK","0…1200 °C","±2 °C","Kuchaytirgich va kompensatsiya kerak"]
  ]],
  ["h","LM35 bilan o'lchash"],
  ["c","const int DATCHIK = A0;\n\nint harorat_olish(void)          /* natija 0,1 °C birliklarida */\n{\n    long s = 0;\n    for (byte i = 0; i < 16; i++) { s += analogRead(DATCHIK); delay(2); }\n    s >>= 4;                                  /* 16 ta o'lchash o'rtachasi */\n    /* kod -> mV -> 0,1 C :  mV = s * 5000 / 1023 ;  T(0,1C) = mV / 1 */\n    return (int)(s * 5000L / 1023L / 10L);\n}"],
  ["f","T = N · U_ref · 1000 / (1023 · 10)","LM35 uchun kodni haroratga aylantirish (0,1 °C birliklarida)."],
  ["p","Uref = 5 V da bitta kod 4,88 mV ga, ya'ni 0,49 °C ga mos keladi. Aniqlikni oshirish uchun Arduino da ichki 1,1 V opora manbaiga o'tish mumkin: analogReference(INTERNAL) buyrug'idan keyin bitta kod 1,07 mV ni, ya'ni 0,107 °C ni tashkil qiladi."],
  ["h","NTC termistor bilan o'lchash"],
  ["p","NTC termistorning qarshiligi harorat ortishi bilan kamayadi va bu bog'liqlik chiziqsiz. Uni kuchlanish bo'luvchisiga ulab, qarshilikni hisoblash va Shtaynxart–Xart yoki B-parametr formulasi orqali haroratga o'tish kerak."],
  ["f","R_t = R_0 · U_ADC / (U_cc − U_ADC)","Bo'luvchidagi termistor qarshiligi."],
  ["f","1/T = 1/T0 + (1/B) · ln(R_t / R_0)","B-parametr formulasi; T kelvinda, T0 = 298,15 K, B ≈ 3950."],
  ["c","float ntc_harorat(int kod)\n{\n    float R = 10000.0 * kod / (1023.0 - kod);       /* termistor qarshiligi */\n    float t = 1.0 / (1.0/298.15 + log(R/10000.0)/3950.0);\n    return t - 273.15;                               /* selsiyga o'tish */\n}"],
  ["h","Raqamli datchik DS18B20"],
  ["p","DS18B20 haroratni o'zi o'lchaydi va natijani 1-Wire interfeysi orqali tayyor raqamli kod ko'rinishida beradi. ADC, kalibrlash va chiziqsizlik masalalari butunlay yo'qoladi. Bitta liniyaga bir necha datchik ulanishi mumkin, chunki har birining zavod seriya raqami noyob."],
  ["t",["Ko'rsatkich","LM35 + ADC","DS18B20"],[
   ["Ulanish","Analog kirish","Bitta raqamli liniya + pull-up"],
   ["Aniqlik","ADC va oporaga bog'liq","0,0625 °C gacha"],
   ["Bir necha datchik","Har biriga kanal kerak","Bitta liniyada"],
   ["O'qish vaqti","~0,1 ms","~750 ms (12 razryadda)"],
   ["Narxi","Past","Yuqoriroq"]
  ]],
  ["h","Kalibrlash va xatolar"],
  ["ol",[
   "Qurilmani etalon termometr bilan bir xil sharoitda 10 daqiqa barqarorlashtiring",
   "Ikki nuqtada o'lchang: muzli suv (0 °C) va xona yoki iliq suv harorati",
   "Farq butun diapazonda bir xil bo'lsa — nol siljishi, o'zgarib borsa — koeffitsient xatosi",
   "Tuzatmalarni dasturga kiriting va EEPROM da saqlang",
   "Tuzatishdan keyin o'lchashni takrorlab, qoldiq xatoni baholang"
  ]],
  ["n","Xato manbalari: uzun ulash simlari orqali kirgan shovqin, quvvat manbaining beqarorligi (Uref sifatida VDD ishlatilganda), datchikning o'z-o'zidan qizishi, yaqindagi issiqlik manbalari va datchikning issiqlik inersiyasi. Oxirgisi tufayli o'lchash haqiqiy haroratdan kechikib boradi."],
  ["sim","adc"],
  ["h","Topshiriqlar"],
  ["ol",[
   "LM35 ni A0 kanaliga ulang, RC filtr qo'ying va sxemani chizing.",
   "Xona haroratini o'lchab, ADC kodi, hisoblangan qiymat va etalon ko'rsatkichini jadvalga yozing.",
   "Variant raqamingiz N bo'lsin: signalizatsiya chegarasini (28 + N) °C qilib belgilang, gisterezis 2 °C bo'lsin.",
   "analogReference(INTERNAL) bilan aniqlikni oshiring va farqni qayd eting.",
   "NTC termistor bilan o'lchashni amalga oshiring va LM35 natijasi bilan solishtiring.",
   "Ikki nuqtali kalibrlash o'tkazing va tuzatmani dasturga kiriting.",
   "Datchikni iliq suvga solib, ko'rsatkichning o'rnatilish vaqtini (inersiya) o'lchang.",
   "O'lchash jadvali va qurilma rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Termometr datchik, ADC, hisoblash va indikatsiya bosqichlaridan iborat yaxlit o'lchash tizimi. LM35 chiziqli tavsifi bilan hisobni soddalashtiradi, NTC arzon lekin chiziqsiz, DS18B20 esa ADC va kalibrlashni butunlay yo'q qiladi. O'rtachalash, opora manbaini to'g'ri tanlash va ikki nuqtali kalibrlash o'lchash aniqligini sezilarli oshiradi."]
 ],
 tests:[
  {q:"LM35 datchigining chiqish tavsifi qanday?",o:["1 mV/°C","10 mV/°C","100 mV/°C","Chiziqsiz"],a:1,e:"25 °C uchun 250 mV."},
  {q:"Uref = 5 V va 10 razryadli ADC da bitta kod necha darajaga mos keladi?",o:["0,1 °C","0,49 °C","1 °C","5 °C"],a:1,e:"4,88 mV / 10 mV/°C."},
  {q:"analogReference(INTERNAL) nima beradi?",o:["Diapazonni kengaytiradi","Opora 1,1 V ga tushib, aniqlik ortadi","Tezlikni oshiradi","Shovqinni oshiradi"],a:1,e:"Bitta kod 1,07 mV ni tashkil qiladi."},
  {q:"NTC termistorning qarshiligi harorat ortganda qanday o'zgaradi?",o:["Ortadi","Kamayadi","O'zgarmaydi","Chiziqli ortadi"],a:1,e:"NTC — manfiy harorat koeffitsienti."},
  {q:"B-parametr formulasida harorat qanday birlikda hisoblanadi?",o:["Selsiy","Kelvin","Farengeyt","Foiz"],a:1,e:"Natija oxirida 273,15 ayiriladi."},
  {q:"DS18B20 ning asosiy afzalligi nimada?",o:["Arzonligi","Raqamli chiqish — ADC va kalibrlash kerak emas","Tezligi","Kichikligi"],a:1,e:"1-Wire orqali tayyor qiymat beradi."},
  {q:"12 razryadli rejimda DS18B20 o'lchash qancha vaqt oladi?",o:["1 ms","100 ms","750 ms","5 s"],a:2,e:"Aniqlik ortishi o'lchash vaqtini uzaytiradi."},
  {q:"Bitta 1-Wire liniyasiga bir necha datchik ulash mumkinmi?",o:["Yo'q","Ha, har birining noyob seriya raqami bor","Faqat ikkitasi","Faqat qisqa masofada"],a:1,e:"Adreslash zavod raqami orqali bajariladi."},
  {q:"Ikki nuqtali kalibrlash nimani aniqlaydi?",o:["Faqat nol siljishini","Nol siljishi va koeffitsient xatosini","Shovqin darajasini","Inersiyani"],a:1,e:"Ikki nuqta ikkala xato turini ajratadi."},
  {q:"Datchikning issiqlik inersiyasi nimaga olib keladi?",o:["Ko'rsatkich haqiqiy haroratdan kechikishiga","Shovqinga","Nol siljishiga","Diapazon o'zgarishiga"],a:0,e:"Tez o'zgarishlarda o'lchash orqada qoladi."}
 ]
},
{
 id:"S2-M27", sem:2, week:12, type:"lecture", no:27,
 title:"Mikrokontroller asosidagi qurilmalarni sozlash vositalari va mikroprotsessor tizimlarini sozlash",
 goal:"Mikroprotsessor tizimlarini sozlash usullarini, otladka vositalarini va nosozlik qidirish tartibini o'zlashtirish.",
 outcomes:[
  "Sozlash vositalarini turlariga ko'ra tasniflay oladi",
  "Dasturiy va apparat otladka usullarini qiyoslay oladi",
  "Nosozlik qidirishning tizimli tartibini qo'llay oladi",
  "Otladka natijalarini rasmiylashtira oladi"
 ],
 plan:["Sozlash tushunchasi","Nosozliklar tasnifi","Dasturiy vositalar","Apparat vositalari","Nosozlik qidirish tartibi","Sinov va hujjatlashtirish"],
 body:[
  ["h","Sozlash tushunchasi"],
  ["p","Sozlash (otladka) — loyihalangan qurilmani ishga tushirish va undagi xatolarni topib bartaraf etish jarayoni. Amaliyotda loyihaning umumiy mehnat sarfining 30–50 % i aynan shu bosqichga to'g'ri keladi, shuning uchun sozlash vositalarini bilish loyihalash bilan bir xil darajada muhim."],
  ["h","Nosozliklar tasnifi"],
  ["t",["Turi","Manbai","Tipik ko'rinishi"],[
   ["Montaj xatolari","Noto'g'ri ulanish, sovuq payvand, qisqa tutashuv","Qurilma umuman ishlamaydi"],
   ["Sxema xatolari","Nominal, qutblanish, yetishmayotgan element","Noto'g'ri darajalar, qizish"],
   ["Konfiguratsiya xatolari","Generator, watchdog, LVP bitlari","Kristall ishga tushmaydi yoki qayta yuklanadi"],
   ["Algoritm xatolari","Mantiq noto'g'ri tuzilgan","Ishlaydi, lekin natija noto'g'ri"],
   ["Vaqt xatolari","Kechikish, uzilish, poyga holati","Beqaror, takrorlanmaydigan nosozlik"],
   ["Resurs xatolari","Stek, xotira to'lib ketishi","Tasodifiy qayta yuklanish"]
  ]],
  ["p","Eng qiyin turi — vaqt va resurs xatolari: ular takrorlanmaydi va otladchik ostida yo'qolib qolishi mumkin, chunki qadamma-qadam bajarish vaqt munosabatlarini o'zgartiradi."],
  ["h","Dasturiy sozlash vositalari"],
  ["ul",[
   "Simulyator — kristallsiz, kompyuterda bajarish; registr va xotirani to'liq kuzatish imkonini beradi",
   "Qadamma-qadam bajarish (Step Into / Step Over) — har bir buyruqdan keyin holatni ko'rish",
   "To'xtash nuqtalari (breakpoint) — kerakli joyda to'xtatish; shartli breakpoint qiymat mos kelganda ishlaydi",
   "Watch oynasi — tanlangan o'zgaruvchilarni real vaqtda kuzatish",
   "Stopwatch — kod bo'lagining bajarilish vaqtini sikllarda o'lchash",
   "Trassirovka — bajarilgan buyruqlar tarixini yozib borish",
   "Modellashtirish muhiti (Proteus) — dastur va sxemani birga sinash"
  ]],
  ["h","Apparat sozlash vositalari"],
  ["t",["Vosita","Nimani ko'rsatadi","Qachon zarur"],[
   ["Multimetr","Kuchlanish, tok, qarshilik","Har doim, birinchi tekshiruv"],
   ["Ossillograf","Signal shakli, davri, fronti","Vaqt munosabatlari, shovqin"],
   ["Mantiqiy analizator","Bir necha raqamli liniya birga","Interfeys va shina tahlili"],
   ["Ichki sxemali emulyator (ICE)","Kristall o'rnida ishlab, to'liq nazorat","Murakkab nosozliklar"],
   ["Otladka moduli (ICD, JTAG)","Real kristallda breakpoint va kuzatish","Zamonaviy amaliyot"],
   ["Protokol analizatori","UART, I2C, SPI kadrlarini dekodlash","Aloqa muammolari"]
  ]],
  ["p","Simulyator va real kristalldagi otladka bir-birini to'ldiradi. Simulyator algoritm xatolarini topishda qulay, ammo u tashqi sxema, shovqin va real vaqt munosabatlarini aks ettirmaydi. Aksincha, ICD moduli real qurilmada ishlaydi, lekin ba'zi resurslarni (masalan bir necha port liniyasini) band qiladi."],
  ["h","Dasturiy diagnostika usullari"],
  ["ol",[
   "Diagnostik chiqish: bo'sh port razryadiga LED yoki ossillograf ulab, dastur qaysi tarmoqqa kirganini ko'rsatish",
   "UART orqali holat xabarlarini yuborish (eng ko'p ishlatiladigan usul)",
   "Oraliq qiymatlarni EEPROM ga yozib, keyin o'qib chiqish",
   "Reset sababini tekshirish va jurnalga yozish",
   "O'z-o'zini tekshirish rejimi: ishga tushganda xotira, datchik va interfeyslarni sinash"
  ]],
  ["c","/* Uzilish bajarilganini ossillografda ko'rish */\nISR(TIMER1_COMPA_vect)\n{\n    PORTB |=  (1 << PB5);   /* belgi boshlanishi */\n    ishlov();\n    PORTB &= ~(1 << PB5);   /* belgi tugashi — impuls kengligi ISR vaqtini beradi */\n}"],
  ["h","Nosozlik qidirish tartibi"],
  ["ol",[
   "Nosozlikni aniq ta'riflang: nima kutilgan, nima sodir bo'ldi, qanday sharoitda takrorlanadi",
   "Quvvat kuchlanishini va reset liniyasini o'lchang",
   "Generator ishlayotganini ossillograf bilan tekshiring",
   "Konfiguratsiya bitlarini qayta ko'rib chiqing",
   "Eng sodda dasturni (LED miltillash) yuklab, apparat qismi sog'ligini tasdiqlang",
   "Dasturni qismlarga bo'lib, har birini alohida sinang",
   "Otladchikda breakpoint qo'yib, xato yuzaga keladigan joyni toraytiring",
   "Xatoni tuzating va butun tizimni qaytadan sinovdan o'tkazing"
  ]],
  ["n","Muhim qoida: bir vaqtda faqat bitta o'zgarish kiriting. Bir necha joyni birdaniga o'zgartirsangiz, nosozlik yo'qolganda uning sababi qaysi o'zgarish ekanini aniqlab bo'lmaydi."],
  ["h","Sinov va hujjatlashtirish"],
  ["p","Sozlash tugagach qurilma sinov dasturi bo'yicha tekshiriladi: har bir funksiya alohida, so'ng butun tizim chegaraviy sharoitlarda (minimal va maksimal kuchlanish, harorat, kirish qiymatlari) sinaladi. Sinov natijalari bayonnomaga yoziladi: nima sinaldi, qanday sharoitda, qanday natija olindi."],
  ["sim","btnled"],
  ["h","Xulosa"],
  ["p","Sozlash loyihaning mehnat sarfining katta qismini egallaydi va tizimli yondashuvni talab qiladi: nosozlikni ta'riflashdan boshlab, quvvat va generatordan dastur mantiqiga qarab harakat qilinadi. Dasturiy vositalar — simulyator, breakpoint, Watch, Stopwatch; apparat vositalari — multimetr, ossillograf, mantiqiy analizator va otladka moduli. Bir vaqtda bitta o'zgarish kiritish qoidasi nosozlik sababini aniq aniqlash imkonini beradi."]
 ],
 tests:[
  {q:"Loyihaning qancha mehnat sarfi sozlash bosqichiga to'g'ri keladi?",o:["5 %","10 %","30–50 %","90 %"],a:2,e:"Shu sababli otladka vositalarini bilish muhim."},
  {q:"Qaysi nosozlik turi eng qiyin hisoblanadi?",o:["Montaj xatolari","Vaqt va resurs xatolari","Sxema xatolari","Konfiguratsiya xatolari"],a:1,e:"Ular takrorlanmaydi va otladchik ostida yo'qolishi mumkin."},
  {q:"Simulyatorning cheklovi nimada?",o:["Sekin ishlashi","Tashqi sxema, shovqin va real vaqt munosabatlarini aks ettirmasligi","Breakpoint yo'qligi","Registrlarni ko'rsatmasligi"],a:1,e:"Shuning uchun real kristallda ham sinov zarur."},
  {q:"Shartli breakpoint qachon ishlaydi?",o:["Har doim","Belgilangan shart bajarilganda","Faqat boshida","Uzilishda"],a:1,e:"Masalan o'zgaruvchi ma'lum qiymatga teng bo'lganda."},
  {q:"Stopwatch vositasi nimani o'lchaydi?",o:["Kuchlanishni","Kod bo'lagining bajarilish vaqtini (sikllarda)","Tokni","Chastotani"],a:1,e:"Vaqt talablarini tekshirish uchun."},
  {q:"Mantiqiy analizator nima uchun kerak?",o:["Analog signal shaklini ko'rish","Bir necha raqamli liniyani birga kuzatish va interfeysni tahlil qilish","Tok o'lchash","Quvvat berish"],a:1,e:"Shina va protokol tahlilida ajralmas."},
  {q:"ISR ichida port razryadini yoqib-o'chirish nimani beradi?",o:["Tezlikni","Ossillografda ISR bajarilish vaqtini o'lchash imkonini","Xotirani","Aniqlikni"],a:1,e:"Impuls kengligi xizmat qism dasturining vaqtiga teng."},
  {q:"Nosozlik qidirishda birinchi navbatda nima tekshiriladi?",o:["Dastur mantiqini","Quvvat kuchlanishi va reset liniyasini","Kompilyator versiyasini","Interfeysni"],a:1,e:"Oddiydan murakkabga tartibi."},
  {q:"Apparat qismi sog'ligini qanday tez tasdiqlash mumkin?",o:["Butun dasturni yuklab","Eng sodda LED miltillash dasturini yuklab","Ossillografsiz","Konfiguratsiyani o'chirib"],a:1,e:"Sodda dastur ishlasa, apparat asosan sog'lom."},
  {q:"Nima uchun bir vaqtda faqat bitta o'zgarish kiritiladi?",o:["Tezlik uchun","Nosozlik yo'qolganda uning sababini aniq bilish uchun","Xotira uchun","Standart talabi"],a:1,e:"Bir necha o'zgarish sababni yashiradi."}
 ]
},
{
 id:"S2-L12", sem:2, week:12, type:"lab", no:12,
 title:"ARO' (analog-raqamli o'zgartirgich) bilan ishlash",
 goal:"Analog-raqamli o'zgartirgichning parametrlarini tajribada aniqlash va o'lchash xatolarini baholashni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","Potensiometr 10 kΩ","Aniq multimetr","Rezistorlar 1 kΩ, kondensator 0,1 µF","Signal generatori (ixtiyoriy)"],
 plan:["ADC parametrlari","O'zgartirish tavsifini olish","Kvantlash xatosi","Opora manbaining ta'siri","Shovqin va o'rtachalash","Diskretlash chastotasi"],
 body:[
  ["h","Nazariy qism"],
  ["p","Arduino Uno da ATmega328P ning 10 razryadli ketma-ket yaqinlashuvchi ADC si ishlatiladi. U 6 ta kanalga ega, o'zgartirish 13 ADC takti davom etadi va standart sozlamada taxminan 100 mikrosekundni tashkil qiladi."],
  ["fig","adcsar","1-rasm. Ketma-ket yaqinlashuvchi ADC ning tuzilmasi"],
  ["f","N = U_kirish / U_ref · 1023","Kod qiymati. Uref = 5 V, U = 2,5 V → N = 511."],
  ["f","q = U_ref / 1023","Kvantlash qadami: 5 V uchun 4,88 mV, 1,1 V uchun 1,07 mV."],
  ["f","Δ = ± q / 2","Kvantlash xatosi — printsipial, yo'qotib bo'lmaydi."],
  ["h","O'zgartirish tavsifini olish"],
  ["c","void setup()\n{\n    Serial.begin(9600);\n    Serial.println(\"kod;hisoblangan_mV\");\n}\n\nvoid loop()\n{\n    int kod = analogRead(A0);\n    long mv  = (long)kod * 5000L / 1023L;\n    Serial.print(kod); Serial.print(';'); Serial.println(mv);\n    delay(500);\n}"],
  ["p","Tajribada potensiometr bilan kirish kuchlanishi 0 dan 5 V gacha o'zgartiriladi, har bir nuqtada multimetr ko'rsatkichi va ADC kodi yozib olinadi. Natijada o'zgartirish tavsifi — kirish kuchlanishining chiqish kodiga bog'liqligi hosil bo'ladi. Ideal holda u to'g'ri chiziq bo'lishi kerak."],
  ["t",["U_o'lchangan, V","Kutilayotgan kod","Olingan kod","Farq"],[
   ["0,00","0","—","—"],["1,00","205","—","—"],["2,00","409","—","—"],
   ["2,50","511","—","—"],["3,30","675","—","—"],["5,00","1023","—","—"]
  ]],
  ["h","Opora manbaining ta'siri"],
  ["p","Standart sozlamada opora sifatida quvvat kuchlanishi (VDD) ishlatiladi. Agar quvvat manbai beqaror bo'lsa yoki USB orqali kuchlanish 4,7 V ga tushsa, barcha o'lchashlar mos ravishda siljiydi — bu tizimli xato hisoblanadi."],
  ["c","analogReference(INTERNAL);   /* ichki 1,1 V opora */\ndelay(10);\nanalogRead(A0);              /* birinchi o'lchash tashlab yuboriladi */\nint kod = analogRead(A0);"],
  ["n","Opora manbaini almashtirgandan keyin birinchi o'lchash natijasi ishonchsiz bo'ladi, chunki ichki zanjir barqarorlashishi uchun vaqt kerak. Shuning uchun birinchi natija tashlab yuboriladi. Bundan tashqari INTERNAL rejimida kirish kuchlanishi 1,1 V dan oshmasligi kerak — aks holda kod 1023 da to'yinadi."],
  ["h","Shovqin va o'rtachalash"],
  ["p","Real o'lchashda kod bir necha birlikka tebranadi. Buning sabablari: quvvat manbaidagi pulsatsiya, raqamli tugunlardan kelgan shovqin, uzun ulash simlari va manba qarshiligining kattaligi."],
  ["f","σ_o'rtacha = σ / √n","n marta o'rtachalashda tasodifiy xato √n marta kamayadi."],
  ["p","Misol. Bitta o'lchashda tarqalish ±3 kod bo'lsa, 16 marta o'rtachalashdan keyin u ±0,75 kod atrofiga tushadi. Shuning uchun o'rtachalash eng sodda va samarali dasturiy filtr hisoblanadi."],
  ["c","int adc_ortacha(byte kanal, byte n)\n{\n    long s = 0;\n    for (byte i = 0; i < n; i++) { s += analogRead(kanal); delayMicroseconds(200); }\n    return (int)(s / n);\n}"],
  ["h","Diskretlash chastotasi"],
  ["p","Arduino da analogRead() taxminan 100 µs davom etadi, demak maksimal diskretlash chastotasi 10 kHz atrofida bo'ladi. Kotelnikov shartiga ko'ra bu 5 kHz gacha bo'lgan signallarni o'lchash imkonini beradi, amalda esa zaxira bilan 1 kHz gacha signal tavsiya etiladi."],

{
 id:"S2-L13", sem:2, week:13, type:"lab", no:13,
 title:"Chastotometrni tadqiq qilish",
 goal:"Chastota va davrni o'lchash usullarini, ularning xatolarini va mikrokontrollerda amalga oshirishni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","Signal generatori yoki ikkinchi Arduino (signal manbai sifatida)","Ossillograf","LCD 16×2","Rezistorlar, simlar"],
 plan:["O'lchash usullari","Impulslarni sanash","Davrni o'lchash","Usullarni tanlash chegarasi","Uzilish asosidagi amalga oshirish","Xatolarni baholash"],
 body:[
  ["h","O'lchash usullari"],
  ["p","Chastotani mikrokontrollerda ikki xil usulda o'lchash mumkin va ularning har biri o'z diapazonida aniqroq ishlaydi."],
  ["fig","freq","1-rasm. Chastotani bevosita sanash va davrni o'lchash usullari"],
  ["t",["Usul","Mohiyati","Aniq bo'ladigan diapazon","Asosiy xatosi"],[
   ["Bevosita sanash","Belgilangan vaqt (masalan 1 s) ichidagi impulslar soni sanaladi","Yuqori chastotalar","±1 impuls"],
   ["Davrni o'lchash","Bitta davr davomiyligi takt impulslari bilan o'lchanadi","Past chastotalar","±1 takt va trigger xatosi"],
   ["Bir necha davrni o'lchash","N ta davr o'lchanib, N ga bo'linadi","O'rtacha diapazon","Xato N marta kamayadi"]
  ]],
  ["f","f = N / t_o'lchash","Bevosita sanash: 1 s da 1000 impuls → 1 kHz."],
  ["f","f = 1 / T","Davrni o'lchash orqali chastota."],
  ["f","δ = ±1 / N · 100 %","Bevosita sanashning nisbiy xatosi. N = 1000 → 0,1 %."],
  ["h","Impulslarni sanash usuli"],
  ["c","volatile unsigned long impuls = 0;\nunsigned long oxirgi = 0;\n\nvoid sanash(void) { impuls++; }          /* uzilish ishlovchisi */\n\nvoid setup()\n{\n    pinMode(2, INPUT);\n    attachInterrupt(digitalPinToInterrupt(2), sanash, RISING);\n    Serial.begin(9600);\n}\n\nvoid loop()\n{\n    if (millis() - oxirgi >= 1000)        /* aniq 1 sekundlik oyna */\n    {\n        oxirgi = millis();\n        noInterrupts();\n        unsigned long f = impuls;\n        impuls = 0;\n        interrupts();\n        Serial.print(f); Serial.println(\" Hz\");\n    }\n}"],
  ["p","Hisoblagichni o'qish va nollash uzilishlar taqiqlangan holda bajariladi — aks holda o'qish paytida kelgan impuls yo'qolishi mumkin. Bu ko'p oqimli kodlardagi klassik poyga holatining oldini olish usuli."],
  ["h","Davrni o'lchash usuli"],
  ["c","void loop()\n{\n    unsigned long t_yuqori = pulseIn(3, HIGH);   /* impuls davomiyligi, µs */\n    unsigned long t_past   = pulseIn(3, LOW);\n    unsigned long T = t_yuqori + t_past;         /* to'liq davr */\n\n    if (T > 0)\n    {\n        float f = 1000000.0 / T;                 /* Hz */\n        float duty = 100.0 * t_yuqori / T;       /* to'ldirish, % */\n        Serial.print(f); Serial.print(\" Hz, D = \");\n        Serial.print(duty); Serial.println(\" %\");\n    }\n}"],
  ["p","Bu usulda bitta davr o'lchangani uchun natija tez olinadi, ammo past chastotalarda o'lchash vaqti uzayadi va shovqin bitta o'lchashga to'liq ta'sir qiladi. Shuning uchun amalda bir necha davr o'lchanib, o'rtachasi olinadi."],
  ["h","Usullarni tanlash chegarasi"],
  ["p","Ikkala usulning xatosi teng bo'ladigan chastota chegaraviy chastota deb ataladi. Undan yuqorida bevosita sanash, pastda esa davrni o'lchash aniqroq natija beradi."],
  ["f","f_chegara ≈ √(f_takt / t_o'lchash)","f_takt = 1 MHz va t = 1 s uchun chegara taxminan 1 kHz."],
  ["t",["Chastota","Tavsiya etiladigan usul","Sabab"],[
   ["< 100 Hz","Davrni o'lchash","Sanash usulida 1 s da juda kam impuls"],
   ["100 Hz – 10 kHz","Bir necha davrni o'lchash","Xato N marta kamayadi"],
   ["> 10 kHz","Bevosita sanash","1 s da ko'p impuls, ±1 xatosi ahamiyatsiz"]
  ]],
  ["n","Kirish signalini moslashtirish: o'lchanayotgan signal sinusoidal yoki shovqinli bo'lsa, uni avval Shmitt trigger yoki komparator orqali to'g'ri burchakli shaklga keltirish kerak. Aks holda bitta o'tishda bir necha soxta impuls hisoblanadi va natija bir necha marta oshib ketadi."],
  ["h","Xatolarni baholash"],
  ["ul",[
   "±1 impuls xatosi — sanash usulida ajralmas, o'lchash oynasini uzaytirish bilan kamayadi",
   "Vaqt asosi xatosi — kvarts aniqligi bilan belgilanadi (±50 ppm)",
   "Trigger xatosi — shovqin tufayli o'tish momenti siljiydi",
   "Uzilish kechikishi — yuqori chastotalarda impulslar yo'qolishi mumkin",
   "Diskretlash xatosi — davrni o'lchashda takt davri bilan cheklanadi"
  ]],
  ["p","Arduino da uzilish orqali sanash amalda 100–200 kHz gacha ishonchli ishlaydi; undan yuqori chastotalarda apparat taymer-hisoblagich kirishidan (T1 liniyasi) foydalanish kerak, chunki u impulslarni protsessor ishtirokisiz sanaydi."],
  ["sim","timer"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Signal manbaini D2 kirishiga ulang va bevosita sanash dasturini yuklang.",
   "10 Hz dan 10 kHz gacha bo'lgan kamida 6 ta chastotada o'lchang va etalon qiymat bilan solishtiring.",
   "Har bir nuqtada nisbiy xatoni hisoblab, jadvalga yozing.",
   "Variant raqamingiz N bo'lsin: o'lchash oynasini (0,5 + 0,1·N) sekund qilib o'zgartiring va xatoning o'zgarishini kuzating.",
   "pulseIn asosidagi davrni o'lchash dasturini yozing va past chastotalarda ikki usulni solishtiring.",
   "Chegaraviy chastotani hisoblang va tajribada tasdiqlang.",
   "Kirishga shovqinli signal berib, Shmitt trigger zaruratini ko'rsating.",
   "Natijalarni LCD ga chiqaruvchi qismni qo'shing.",
   "O'lchash jadvali va ossillogramma rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Chastota ikki usulda o'lchanadi: belgilangan vaqt ichidagi impulslarni sanash yoki davr davomiyligini o'lchash. Birinchisi yuqori chastotalarda, ikkinchisi past chastotalarda aniqroq; ular teng aniqlik beradigan nuqta chegaraviy chastota deb ataladi. O'lchash xatosi ±1 impuls, vaqt asosi aniqligi va trigger xatosidan tashkil topadi; kirish signalini to'g'ri burchakli shaklga keltirish esa ishonchli sanashning shartidir."]
 ],

{
 id:"S2-L14", sem:2, week:14, type:"lab", no:14,
 title:"USB orqali qurilmani MK ga ulash va tadqiq etish",
 goal:"USB interfeysi orqali mikrokontrollerni kompyuterga ulash, ma'lumot almashish va uzatish tezligini tadqiq etishni o'zlashtirish.",
 equip:["Arduino Uno va USB kabel","Kompyuter va terminal dasturi","Ossillograf (ixtiyoriy)","USB-UART moduli (CH340, CP2102)","LCD 16×2"],
 plan:["USB haqida umumiy ma'lumot","USB-UART o'zgartirgich","Ma'lumot almashish","Uzatish tezligini o'lchash","Protokol va nazorat","Quvvat masalasi"],
 body:[
  ["h","USB haqida umumiy ma'lumot"],
  ["p","USB (Universal Serial Bus) — kompyuter va periferiya o'rtasidagi universal ketma-ket interfeys. Uning asosiy xususiyatlari: to'rt simli kabel (VBUS, D+, D−, GND), differensial uzatish, avtomatik aniqlash (plug and play) va periferiyani shina orqali quvvatlantirish imkoniyati."],
  ["t",["Versiya","Tezligi","Nomi"],[
   ["USB 1.1","1,5 / 12 Mbit/s","Low / Full Speed"],
   ["USB 2.0","480 Mbit/s","High Speed"],
   ["USB 3.x","5–20 Gbit/s","Super Speed"]
  ]],
  ["p","USB da aloqani har doim xost (kompyuter) boshlaydi: qurilma o'z tashabbusi bilan ma'lumot yubora olmaydi, u faqat so'rovga javob beradi. Har bir qurilma ulanganda o'zining identifikatorlarini (VID va PID) xostga yuboradi va shu asosda kerakli drayver yuklanadi."],
  ["h","USB-UART o'zgartirgich"],
  ["p","Oddiy mikrokontrollerlarda USB kontrolleri bo'lmaydi, chunki USB protokoli murakkab va sezilarli resurs talab qiladi. Shuning uchun amalda USB-UART o'zgartirgich mikrosxemasi qo'llanadi: u kompyuter tomonidan virtual COM port sifatida ko'rinadi, mikrokontroller tomonidan esa oddiy UART bo'lib ishlaydi."],
  ["fig","rs232","1-rasm. Ketma-ket aloqa kadri va daraja moslashtirish"],
  ["t",["Mikrosxema","Xususiyati"],[
   ["CH340","Arzon, keng tarqalgan, drayver talab qilishi mumkin"],
   ["CP2102","Barqaror, kam shovqinli"],
   ["FT232","Sanoat sifatida, qimmatroq"],
   ["ATmega16U2","Arduino Uno da ishlatiladi, dasturlanadigan"]
  ]],
  ["p","Arduino Uno da aynan shu yechim qo'llanadi: platadagi ATmega16U2 kompyuter uchun virtual COM port yaratadi va uni asosiy ATmega328P ning UART liniyalariga ulaydi. Shu sababli Serial.print() bilan yuborilgan ma'lumot kompyuterda Serial Monitor da ko'rinadi."],
  ["h","Ma'lumot almashish"],
  ["c","void setup()\n{\n    Serial.begin(115200);\n    Serial.println(\"USB aloqa tayyor\");\n}\n\nvoid loop()\n{\n    if (Serial.available())\n    {\n        String s = Serial.readStringUntil('\\n');\n        s.trim();\n\n        if (s == \"OLCH\")   { Serial.print(\"ADC=\"); Serial.println(analogRead(A0)); }\n        else if (s == \"VAQT\") { Serial.print(\"T=\");   Serial.println(millis()/1000); }\n        else if (s.startsWith(\"LED \"))\n        {\n            digitalWrite(13, s.substring(4).toInt() ? HIGH : LOW);\n            Serial.println(\"OK\");\n        }\n        else Serial.println(\"XATO: noma'lum buyruq\");\n    }\n}"],
  ["h","Uzatish tezligini o'lchash"],
  ["f","v_amaliy = N_bayt / t","Amaliy o'tkazuvchanlik. 10 000 bayt 1,2 s da uzatilsa ≈ 8,3 kbayt/s."],
  ["c","void tezlikni_olchash(void)\n{\n    unsigned long t1 = millis();\n    for (int i = 0; i < 1000; i++) Serial.println(\"0123456789\");   /* 12 bayt x 1000 */\n    Serial.flush();                       /* buferning bo'shashini kutish */\n    unsigned long t2 = millis();\n\n    Serial.print(\"12000 bayt uzatildi: \");\n    Serial.print(t2 - t1); Serial.println(\" ms\");\n}"],
  ["p","Serial.flush() funksiyasi majburiy: usiz o'lchash faqat buferga yozish vaqtini ko'rsatadi, haqiqiy uzatish esa fonda davom etadi. Amaliy tezlik nazariy qiymatdan doim past bo'ladi — kadr qo'shimcha bitlari, USB paketlari va xost tomonidagi bufer kechikishi hisobiga."],
  ["h","Protokol va nazorat"],
  ["ul",[
   "Kadr chegaralarini aniq belgilash (masalan '\\n' bilan tugatish)",
   "Buyruq va parametrlarni ajratish qoidasini kelishish",
   "Nazorat yig'indisi yoki CRC qo'shish",
   "Har bir buyruqqa javob (OK yoki XATO) qaytarish",
   "Javob kelmasa qayta yuborish va urinishlar sonini cheklash",
   "Uzun ma'lumotni bloklarga bo'lib uzatish"
  ]],
  ["n","Diqqat: Arduino ning ketma-ket buferi 64 bayt. Agar kompyuter ma'lumotni dastur o'qib ulgurganidan tezroq yuborsa, bufer to'lib ketadi va baytlar yo'qoladi. Buning oldini olish uchun blokli uzatish va tasdiqlash (javob kutish) qo'llanadi."],
  ["h","Quvvat masalasi"],
  ["p","USB porti odatda 500 mA (USB 2.0) gacha tok berishi mumkin. Arduino platasi va unga ulangan kichik yuklamalar shu chegarada ishlaydi, ammo dvigatel, rele yoki lenta LED uchun alohida quvvat manbai kerak. Tashqi manba ishlatilganda umumiy sim albatta birlashtiriladi."],
  ["sim","uart"],
  ["h","Topshiriqlar"],
  ["ol",[
   "Platani USB orqali ulang va qurilma menejerida virtual COM port raqamini aniqlang.",
   "Buyruqli aloqa dasturini yuklang va OLCH, VAQT, LED buyruqlarini sinab ko'ring.",
   "Variant raqamingiz N bo'lsin: o'z buyrug'ingizni qo'shing (masalan (100 + N) qiymatini qaytaruvchi).",
   "9600, 57600 va 115200 bod tezliklarida 12 000 bayt uzatish vaqtini o'lchang va jadvalga yozing.",
   "Har bir tezlik uchun nazariy va amaliy o'tkazuvchanlikni solishtiring, farq sababini izohlang.",
   "Buferni ataylab to'ldirib, baytlar yo'qolishini kuzating va tasdiqlash mexanizmi bilan bartaraf eting.",
   "Nazorat yig'indili protokol yozing va buzilgan kadr rad etilishini tekshiring.",
   "O'lchash jadvali va terminal oynasining rasmini yuklang."
  ]],
  ["h","Xulosa"],
  ["p","Oddiy mikrokontroller USB bilan bevosita emas, USB-UART o'zgartirgich orqali ishlaydi va kompyuterda virtual COM port sifatida ko'rinadi. Amaliy uzatish tezligi nazariydan past bo'ladi, chunki kadr qo'shimcha bitlari va bufer kechikishlari hisobga olinadi. Ishonchli aloqa uchun kadr chegaralari, nazorat yig'indisi va tasdiqlash mexanizmi bo'lgan protokol tuziladi."]
 ],
 tests:[
  {q:"USB kabelidagi to'rt sim qaysilar?",o:["TX, RX, GND, VCC","VBUS, D+, D−, GND","SDA, SCL, VCC, GND","MOSI, MISO, SCK, SS"],a:1,e:"Ma'lumot differensial juftlik orqali uzatiladi."},
  {q:"USB da aloqani kim boshlaydi?",o:["Qurilma","Xost (kompyuter)","Ikkalasi ham","Drayver"],a:1,e:"Qurilma faqat so'rovga javob beradi."},

  {q:"Nima uchun oddiy MK ga USB-UART o'zgartirgich kerak?",o:["Tezlik yetmagani uchun","USB protokoli murakkab va ko'p resurs talab qilgani uchun","Quvvat yetmagani uchun","Standart talabi"],a:1,e:"O'zgartirgich virtual COM port yaratadi."},

  {q:"Arduino ning ketma-ket buferi hajmi qancha?",o:["16 bayt","64 bayt","256 bayt","1 KB"],a:1,e:"To'lib ketsa baytlar yo'qoladi."},
  {q:"Bufer to'lib ketishining oldini qanday olish mumkin?",o:["Tezlikni oshirish","Blokli uzatish va tasdiqlash (javob kutish)","Buferni o'chirish","Kabelni almashtirish"],a:1,e:"Oqimni boshqarish mexanizmi kerak."},
  {q:"USB 2.0 porti odatda qancha tok bera oladi?",o:["100 mA","500 mA","2 A","5 A"],a:1,e:"Katta yuklama uchun alohida manba kerak."},
  {q:"Amaliy uzatish tezligi nima uchun nazariydan past bo'ladi?",o:["Kabel uzunligi tufayli","Kadr qo'shimcha bitlari va bufer kechikishlari tufayli","Quvvat yetmagani uchun","Xotira kamligi uchun"],a:1,e:"Start/stop bitlari va paketlash qo'shimcha yuk beradi."}

  ["h","Tizimli magistral tushunchasi"],
  ["p","Tizimli magistral — kompyuterning kengaytirish kartalarini ona platagaz ulash uchun mo'ljallangan standartlashtirilgan interfeys. U mexanik (razyom o'lchami va kontaktlar soni), elektr (signal darajalari) va protokol (almashinuv tartibi) jihatdan to'liq tavsiflanadi."],

{

 body:[
  ["h","Masalaning qo'yilishi"],
  ["p","Yakuniy laboratoriya ishi butun kursda o'rganilgan bilimlarni birlashtiradi: analog datchikdan signal olish, ADC bilan raqamlashtirish, filtrlash, chegaraviy mantiq, indikatsiya va signalizatsiya. Qurilma havodagi yonuvchi gaz yoki tutun konsentratsiyasini kuzatib, belgilangan chegaradan oshganda ogohlantirish beradi."],

  ["f","R_s = R_L · (U_cc − U_chiqish) / U_chiqish","Sezgir element qarshiligi; R_L — yuk rezistori (odatda 10 kΩ)."],
  ["f","ppm = A · (R_s / R_0)^B","Konsentratsiyani baholash; A va B koeffitsientlari datchik hujjatidagi grafikdan olinadi, R_0 — toza havodagi qarshilik."],
  ["h","Isitish va barqarorlashish"],
  ["n","Muhim: MQ datchigining isitgichi taxminan 150 mA tok iste'mol qiladi va ishlaganda sezilarli qiziydi. Uni Arduino ning 5 V chiqishidan quvvatlantirish mumkin, lekin bir necha datchik yoki qo'shimcha yuklama bo'lsa alohida manba kerak. Datchikni ishga tushirgandan keyin kamida 1–2 daqiqa (birinchi marta ishlatilganda 24 soatgacha) qizdirish talab qilinadi, aks holda ko'rsatkichlar suzib yuradi."],
  ["h","Dastur"],
  ["c","const int DATCHIK = A0, ZUMZUMA = 8, QIZIL = 9, YASHIL = 10;\nint chegara = 400;                 /* ADC kodi bo'yicha chegara */\nconst int GISTEREZIS = 30;\nbool signal = false;\nint R0_kod = 0;\n\nint olchash(void)                  /* 16 marta o'rtachalash */\n{\n    long s = 0;\n    for (byte i = 0; i < 16; i++) { s += analogRead(DATCHIK); delay(5); }\n    return (int)(s >> 4);\n}\n\nvoid setup()\n{\n    pinMode(ZUMZUMA, OUTPUT); pinMode(QIZIL, OUTPUT); pinMode(YASHIL, OUTPUT);\n    Serial.begin(9600);\n    Serial.println(\"Datchik qizimoqda...\");\n    for (int i = 0; i < 60; i++) { delay(1000); }      /* 60 s qizdirish */\n    R0_kod = olchash();                                 /* toza havo darajasi */\n    Serial.print(\"Toza havo darajasi: \"); Serial.println(R0_kod);\n}\n\nvoid loop()\n{\n    int kod = olchash();\n\n    if (!signal && kod > chegara)              signal = true;\n    else if (signal && kod < chegara - GISTEREZIS) signal = false;\n\n    digitalWrite(ZUMZUMA, signal);\n    digitalWrite(QIZIL,   signal);\n    digitalWrite(YASHIL, !signal);\n\n    Serial.print(\"Kod: \");   Serial.print(kod);\n    Serial.print(\"  Holat: \"); Serial.println(signal ? \"XAVF\" : \"normal\");\n    delay(500);\n}"],
  ["p","Kodda uchta muhim yechim qo'llangan: 16 martalik o'rtachalash shovqinni kamaytiradi, 60 sekundlik qizdirish datchikni ishchi rejimga chiqaradi, gisterezis esa chegara atrofida signalizatsiyaning tez-tez yonib-o'chishining oldini oladi."],
  ["h","Signalizatsiya mantiqi"],
  ["t",["Holat","Sharti","Reaksiya"],[

   ["Nosozlik","kod ≈ 0 yoki ≈ 1023","Datchik uzilgan yoki tutashgan — xato xabari"]

  ["p","Nosozlikni aniqlash — ishonchli qurilmaning majburiy elementi. Datchik simi uzilsa, kirish nol yoki maksimal qiymatda qotib qoladi; dastur buni normal o'lchash deb qabul qilmasligi va xato haqida xabar berishi kerak."],

/* =====================================================================
   INTERAKTIV SIMULYATORLAR
   ===================================================================== */
const TIMERS = [];
function clearTimers(){ while(TIMERS.length) clearInterval(TIMERS.pop()); }
function every(ms, fn){ const t = setInterval(fn, ms); TIMERS.push(t); return t; }
const ledSvg = (id,c) => `<svg width="54" height="70" viewBox="0 0 54 70"><ellipse id="${id}" cx="27" cy="26" rx="17" ry="20" fill="${c}" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="40" width="34" height="7" fill="none" stroke="currentColor"/><path d="M20 47v20M34 47v20" stroke="currentColor" stroke-width="2"/></svg>`;
const bin8 = v => v.toString(2).padStart(8,"0").replace(/(....)(....)/,"$1 $2");
const hex2 = v => v.toString(16).toUpperCase().padStart(2,"0");

const SIMS = {
led:{ t:"LED simulyatori — chiqish porti", h:"PORT razryadiga yozilgan qiymat chiqish darajasini belgilaydi. Qo'lda yoqing yoki avtomatik miltillashni ishga tushiring.",
 make(b){
  b.innerHTML = `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
   <div>${ledSvg("L1","var(--rail)")}</div>
   <div style="flex:1;min-width:180px"><div class="readout" id="ro"></div></div></div>
   <div class="ctrls">
    <button class="btn sm" id="tg">Yoqish</button>
    <button class="btn sm ghost" id="bl">Avtomatik miltillash</button>
    <label>Chastota <input type="range" id="fr" min="1" max="10" value="2"><b id="fv">2 Hz</b></label>
   </div>`;
  let on=false, run=null;
  const draw=()=>{ $("#L1",b).setAttribute("fill", on?"#ff4d3d":"var(--rail)");
   $("#ro",b).textContent = `DDRB.0 = 1   (chiqish rejimi)\nPORTB.0 = ${on?1:0}\nUchiqish ≈ ${on?"4.8 V":"0.0 V"}\nI_LED  ≈ ${on?"9 mA":"0 mA"}`;
   $("#tg",b).textContent = on?"O'chirish":"Yoqish"; };
  $("#tg",b).onclick=()=>{ on=!on; draw(); };
  $("#fr",b).oninput=e=>{ $("#fv",b).textContent=e.target.value+" Hz"; if(run){stop();start();} };
  const start=()=>{ const hz=+$("#fr",b).value; run=every(500/hz,()=>{on=!on;draw();}); $("#bl",b).textContent="To'xtatish"; };
  const stop=()=>{ clearInterval(run); const i=TIMERS.indexOf(run); if(i>-1)TIMERS.splice(i,1); run=null; $("#bl",b).textContent="Avtomatik miltillash"; };
  $("#bl",b).onclick=()=>{ run?stop():start(); };
  draw();
 }},

traffic:{ t:"Svetofor — bir necha chiqishni ketma-ket boshqarish", h:"Uch razryadli chiqish kodining vaqt bo'yicha almashinuvi.",

seg7:{ t:"7-segmentli indikator", h:"Segmentlarni bosib yoqing yoki raqam tanlang — chiqish baytini kuzating.",
 make(b){
  const S={a:"M14 8h38l-7 8H21z",b:"M54 10l5 7v28l-7-6V17z",c:"M52 52l7 6-5 7-2-28z",d:"M14 72h38l-7-8H21z",e:"M12 52l7 6-2 28-5-7z",f:"M12 10l5 7v28l-7-6V17z",g:"M15 40h36l-6 6H21z"};
  const map={0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgedc",7:"abc",8:"abcdefg",9:"abcdfg",A:"abcefg",B:"fgedc",C:"afed",D:"bcdeg",E:"afged",F:"afge"};
  const ord="abcdefg".split("");
  b.innerHTML=`<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
   <svg width="90" height="100" viewBox="0 0 72 82">${ord.map(k=>`<path id="s${k}" d="${S[k]}" fill="var(--rail)" stroke="currentColor" stroke-width=".6" style="cursor:pointer"/>`).join("")}</svg>
   <div style="flex:1;min-width:190px"><div class="readout" id="ro"></div></div></div>
   <div class="ctrls" id="dg"></div>`;
  let st={a:0,b:0,c:0,d:0,e:0,f:0,g:0};
  const draw=()=>{ let v=0; ord.forEach((k,i)=>{ $("#s"+k,b).setAttribute("fill", st[k]?"#ff5a3d":"var(--rail)"); if(st[k]) v|=(1<<i); });
   $("#ro",b).textContent=`Segmentlar: ${ord.filter(k=>st[k]).join(" ")||"—"}\nPORT (dp g f e d c b a): 0b0${v.toString(2).padStart(7,"0")}\nHEX: 0x${hex2(v)}   (umumiy katod)`; };
  ord.forEach(k=>{ $("#s"+k,b).onclick=()=>{ st[k]=st[k]?0:1; draw(); }; });
  const dg=$("#dg",b);
  Object.keys(map).forEach(d=>{ const btn=el("button",{class:"btn sm ghost"},d); btn.onclick=()=>{ ord.forEach(k=>st[k]=map[d].includes(k)?1:0); draw(); }; dg.appendChild(btn); });
  const cl=el("button",{class:"btn sm ghost"},"O'chirish"); cl.onclick=()=>{ ord.forEach(k=>st[k]=0); draw(); }; dg.appendChild(cl);
  draw();
 }},

adc:{ t:"ADC simulyatori", h:"Kirish kuchlanishini o'zgartirib, raqamli kodning qanday shakllanishini kuzating.",
 make(b){
  b.innerHTML=`<div class="ctrls"><label>U_kirish <input type="range" id="u" min="0" max="500" value="250"><b id="uv">2.50 V</b></label>
   <label>Razryad <select id="n" style="width:auto"><option>8</option><option selected>10</option><option>12</option></select></label>
   <label>U_ref <select id="r" style="width:auto"><option>3.3</option><option selected>5.0</option></select></label></div>
   <svg id="g" viewBox="0 0 520 110" style="width:100%;height:110px"></svg><div class="readout" id="ro"></div>`;
  const draw=()=>{ const u=+$("#u",b).value/100, n=+$("#n",b).value, vr=+$("#r",b).value;
   const max=Math.pow(2,n)-1, code=Math.min(max,Math.round(u/vr*max)), step=vr/max, back=code*step;
   $("#uv",b).textContent=u.toFixed(2)+" V";
   const w=Math.min(1,u/vr)*480;
   $("#g",b).innerHTML=`<rect x="20" y="20" width="480" height="26" fill="none" stroke="var(--line)"/>
    <rect x="20" y="20" width="${w}" height="26" fill="var(--accent)" opacity=".8"/>
    <text x="20" y="62" font-size="11" fill="var(--muted)" font-family="monospace">0 V</text>
    <text x="500" y="62" font-size="11" text-anchor="end" fill="var(--muted)" font-family="monospace">${vr.toFixed(1)} V</text>
    <text x="${20+w}" y="82" font-size="12" text-anchor="middle" fill="var(--ink)" font-family="monospace">N = ${code}</text>`;
   $("#ro",b).textContent=`N = U/Uref · (2^n − 1) = ${u.toFixed(2)}/${vr.toFixed(1)} · ${max} = ${code}\nKod: 0x${code.toString(16).toUpperCase()}  = 0b${code.toString(2)}\nKvantlash qadami: ${(step*1000).toFixed(2)} mV\nTeskari tiklangan kuchlanish: ${back.toFixed(3)} V  (xato ${(Math.abs(u-back)*1000).toFixed(1)} mV)`; };
  ["u","n","r"].forEach(id=>{ $("#"+id,b).oninput=draw; $("#"+id,b).onchange=draw; });

 }},

timer:{ t:"Taymer-hisoblagich simulyatori", h:"Bo'luvchi va boshlang'ich qiymatni tanlab, to'lib ketish davrini hisoblang.",
 make(b){
  b.innerHTML=`<div class="ctrls"><label>f <select id="f" style="width:auto"><option>8</option><option selected>16</option><option>12</option></select> MHz</label>
   <label>Bo'luvchi <select id="p" style="width:auto"><option>1</option><option>8</option><option selected>64</option><option>256</option><option>1024</option></select></label>
   <label>Razryad <select id="n" style="width:auto"><option selected>8</option><option>16</option></select></label>
   <label>Preload <input type="number" id="pl" value="0" min="0" style="width:90px"></label>
   <button class="btn sm" id="go">Sanashni boshlash</button></div>
   <div class="bar" style="margin-top:12px"><i id="bar" style="width:0%"></i></div><div class="readout" id="ro"></div>`;
  let run=null,cnt=0,ovf=0;
  const par=()=>({f:+$("#f",b).value*1e6,p:+$("#p",b).value,n:+$("#n",b).value,pl:+$("#pl",b).value||0});
  const draw=()=>{ const {f,p,n,pl}=par(), max=Math.pow(2,n), steps=max-pl, T=steps*p/f;
   $("#bar",b).style.width=((cnt-pl)/steps*100).toFixed(1)+"%";
   $("#ro",b).textContent=`Takt: ${(1e9/f).toFixed(1)} ns,  bo'lingan takt: ${(p*1e9/f).toFixed(1)} ns\nQadamlar soni: ${max} − ${pl} = ${steps}\nTo'lib ketish davri: T = ${steps} · ${p} / ${(f/1e6)} MHz = ${(T*1000).toFixed(3)} ms\nTCNT = ${cnt}   to'lib ketishlar: ${ovf}`; };
  $("#go",b).onclick=()=>{ if(run){clearInterval(run);run=null;$("#go",b).textContent="Sanashni boshlash";return;}
   const {n,pl}=par(); cnt=pl; run=every(40,()=>{ const {n,pl}=par(); const max=Math.pow(2,n);
    cnt+=Math.max(1,Math.round((max-pl)/40)); if(cnt>=max){cnt=pl;ovf++;} draw(); });
   $("#go",b).textContent="To'xtatish"; };
  ["f","p","n","pl"].forEach(i=>{ $("#"+i,b).onchange=()=>{cnt=par().pl;draw();}; });
  draw();
 }},

uart:{ t:"UART kadr simulyatori", h:"Belgi kiriting — start, ma'lumot, paritet va stop bitlaridan iborat kadrni ko'ring.",
 make(b){
  b.innerHTML=`<div class="ctrls"><label>Belgi <input id="ch" maxlength="1" value="A" style="width:56px"></label>
   <label>Tezlik <select id="br" style="width:auto"><option>2400</option><option selected>9600</option><option>115200</option></select> bod</label>
   <label>Paritet <select id="pr" style="width:auto"><option selected>yo'q</option><option>juft</option><option>toq</option></select></label></div>
   <svg id="w" viewBox="0 0 540 96" style="width:100%;height:96px"></svg><div class="readout" id="ro"></div>`;
  const draw=()=>{ const c=($("#ch",b).value||"A").charCodeAt(0)&255, br=+$("#br",b).value, pm=$("#pr",b).value;
   const bits=[]; for(let i=0;i<8;i++) bits.push((c>>i)&1);
   const ones=bits.filter(x=>x).length;
   const par = pm==="yo'q"?null:(pm==="juft"?(ones%2):(1-ones%2));
   const seq=[{v:0,n:"ST"}].concat(bits.map((v,i)=>({v,n:"D"+i})));
   if(par!==null) seq.push({v:par,n:"P"}); seq.push({v:1,n:"SP"});

   $("#w",b).innerHTML=`${lab}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
   const tb=(seq.length)/br*1000;
   $("#ro",b).textContent=`Belgi '${String.fromCharCode(c)}' = 0x${hex2(c)} = 0b${c.toString(2).padStart(8,"0")}\nUzatish tartibi: start(0) → D0..D7 (kichik bitdan) ${par!==null?"→ paritet("+par+")":""} → stop(1)\nBitlar soni: ${seq.length},  1 bit vaqti = ${(1e6/br).toFixed(1)} µs\nKadr vaqti ≈ ${tb.toFixed(3)} ms,  sekundiga ≈ ${Math.floor(br/seq.length)} belgi`; };
  ["ch","br","pr"].forEach(i=>{ $("#"+i,b).oninput=draw; $("#"+i,b).onchange=draw; }); draw();
 }},

/* =====================================================================
   SERVER BILAN SINXRONLASH (Google Apps Script)
   Darslik Apps Script orqali ochilganda avtomatik server rejimiga o'tadi.
   Oddiy faylda ochilsa, hamma narsa avvalgidek lokal ishlaydi.
   ===================================================================== */
let SESSION_PW = "";                       /* joriy seans paroli — faqat xotirada */
const QKEY = "mpt.queue.v1";

/* ---------------------------------------------------------------
   SERVER HAVOLASI.
   Darslik Apps Script ichidan ochilsa, bu qator bo'sh qolaveradi.
   Agar faylni boshqa joyga (GitHub Pages, sayt, Drive) joylasangiz,
   Apps Script dagi /exec havolasini shu yerga qo'ying, masalan:
   const MPT_API = "https://script.google.com/macros/s/AKfy.../exec";
   --------------------------------------------------------------- */
const MPT_API = "";

const Cloud = {
  /* Apps Script muhitida google.script.run mavjud bo'ladi.
     Har safar tekshiramiz — sahifa yuklanish tartibiga bog'liq bo'lmasligi uchun. */
  get gs(){ return !!(window.google && window.google.script && window.google.script.run); },
  get on(){ return Cloud.gs || !!MPT_API; },
  init(){ cloudBadge(); },
  raw(action, payload){
    const sorov = JSON.stringify(Object.assign({ action }, payload));
    if(!Cloud.gs && MPT_API){                       /* havola orqali ishlash */
      return fetch(MPT_API, { method:"POST", redirect:"follow",
          headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: sorov })
        .then(res => res.text())
        .then(txt => { let r; try{ r = JSON.parse(txt); }catch(e){ throw new Error("Javob formati xato"); }
                       if(!r.ok) throw new Error(r.xato || "Server xatosi"); return r; });
    }
    return new Promise((ok, err) => {
      if(!Cloud.gs) return err(new Error("Server rejimi yoqilmagan"));
      let tugadi = false;
      const t = setTimeout(()=>{ if(!tugadi){ tugadi=true; err(new Error("Server javob bermadi")); } }, 30000);
      google.script.run
        .withSuccessHandler(txt => {
          if(tugadi) return; tugadi=true; clearTimeout(t);
          let r; try { r = JSON.parse(txt); } catch(e){ return err(new Error("Javob formati xato")); }
          r.ok ? ok(r) : err(new Error(r.xato || "Server xatosi"));
        })
        .withFailureHandler(e => { if(tugadi) return; tugadi=true; clearTimeout(t); err(new Error(e && e.message ? e.message : String(e))); })
        .api(sorov);
    });
  }
};
const cred = () => { const u = me(); return u ? { login: u.login, pw: u.role === "admin" ? SESSION_PW : (u.pw || SESSION_PW) } : {}; };

/* ---------- yuborilmagan amallar navbati ---------- */
function qAll(){ try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch(e){ return []; } }
function qSet(q){ try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){} }
function qAdd(action, payload){ const q = qAll(); q.push({ action, payload }); qSet(q); cloudBadge(); }

async function qFlush(){
  if(!Cloud.on) return;
  const q = qAll(); if(!q.length) return;
  const qoldi = [];
  for(const op of q){
    try { await Cloud.raw(op.action, op.payload); }
    catch(e){ qoldi.push(op); }
  }
  qSet(qoldi); cloudBadge();
}

/* ---------- fon rejimida yuborish ---------- */
function cloudPush(action, payload){
  const p = Object.assign({}, payload, cred());
  if(!Cloud.on || !p.login) return;
  Cloud.raw(action, p).then(cloudBadge).catch(() => qAdd(action, p));
}

/* ---------- holat ko'rsatkichi ---------- */
function cloudBadge(){
  const b = $("#cloudb"); if(!b) return;
  const n = qAll().length;
  if(!Cloud.on){ b.textContent = "lokal"; b.title = "Ma'lumot faqat shu qurilmada saqlanmoqda"; b.className = "badge"; }
  else if(n){ b.textContent = n + " kutmoqda"; b.title = "Yuborilmagan yozuvlar bor, ulanish tiklanganda jo'natiladi"; b.className = "badge warn"; }
  else { b.textContent = "server"; b.title = "Ma'lumot umumiy bazaga saqlanmoqda"; b.className = "badge ok"; }
}

}

function lessonState(login,id){
  const p=userData(login).progress[id];
  if(!p) return "none";
  if(p.test && p.test.score>=p.test.total*0.6) return "done";
  if(p.opened) return "part";
  return "none";
}
function progressOf(login,sem){
  const ls=semLessons(sem); if(!ls.length) return 0;
  let s=0; ls.forEach(l=>{ const st=lessonState(login,l.id); s+= st==="done"?1: st==="part"?0.4:0; });
  return Math.round(s/ls.length*100);
}
function avgScore(login){
  const d=userData(login); let t=0,n=0;
  Object.values(d.progress).forEach(p=>{ if(p.test){ t+=p.test.score/p.test.total*100; n++; } });
  return n? Math.round(t/n):0;
}

}

  $("#ph").onchange=async e=>{ try{ avatar=await fileToImg(e.target.files[0],220,.7);
    $("#pv").innerHTML=`<img src="${avatar}" style="width:84px;height:84px;object-fit:cover;border-radius:50%;border:1px solid var(--line);margin-bottom:12px">`;
   }catch(err){ $("#m").innerHTML=`<div class="msg err">${esc(err)}</div>`; } };
  $("#rg").onclick=()=>{
    const v=id=>$("#"+id).value.trim();
    const ism=v("ism"),fam=v("fam"),shr=v("shr"),grp=v("grp"),lg=v("lg").toLowerCase(),pw=$("#pw").value,pw2=$("#pw2").value;
    const err=[];
    if(!ism||!fam) err.push("Ism va familiya to'ldirilishi kerak.");
    if(!grp) err.push("Guruh ko'rsatilmadi.");
    if(lg.length<3) err.push("Login kamida 3 ta belgidan iborat bo'lsin.");
    if(/\s/.test(lg)) err.push("Loginda bo'sh joy bo'lmasin.");
    if(S.users.some(u=>u.login===lg)) err.push("Bu login band, boshqasini tanlang.");
    if(pw.length<5) err.push("Parol kamida 5 ta belgidan iborat bo'lsin.");
    if(pw!==pw2) err.push("Parol va tasdiq mos kelmadi.");
    if(err.length){ $("#m").innerHTML=`<div class="msg err">${err.map(esc).join("<br>")}</div>`; return; }
    const salt=salty();
    const yangi={login:lg,hash:hashPw(pw,salt),salt,pw,role:"student",ism,familiya:fam,sharif:shr,guruh:grp,avatar,created:nowISO()};

    const tugat=()=>{ S.users.push(yangi); S.session=lg; SESSION_PW=pw; userData(lg); save(); applyTheme();
      toast("Hisob yaratildi"); go("#/dash"); };

    if(Cloud.on){
      $("#rg").disabled=true; $("#rg").textContent="Yuborilmoqda...";
      Cloud.raw("royxat",{user:{login:lg,pw,ism,familiya:fam,sharif:shr,guruh:grp,avatar}})
        .then(()=>{ tugat(); })
        .catch(e=>{ $("#rg").disabled=false; $("#rg").textContent="Hisob yaratish";
          $("#m").innerHTML=`<div class="msg err">${esc(e.message||"Serverga ulanib bo'lmadi")}</div>`; });
      return;
    }
    tugat();
  };
}

function afterLesson(id){
  const l=byId(id); if(!l) return;
  mountSims(document);
  const u=me(), p=lp(u.login,id), idx=LESSONS.indexOf(l);
  $("#totest").onclick=()=>go("#/test/"+id);
  if($("#prev")) $("#prev").onclick=()=>go("#/lesson/"+LESSONS[idx-1].id);
  if($("#next")) $("#next").onclick=()=>go("#/lesson/"+LESSONS[idx+1].id);
  const gal=$("#imgs");
  const paint=()=>{ if(!gal) return; gal.innerHTML=p.images.map((s,i)=>`<img class="thumb" src="${s}" data-i="${i}">`).join("");
    $$(".thumb",gal).forEach(im=>im.onclick=()=>{
      const i=+im.dataset.i;
      modal(`<img src="${p.images[i]}"><div style="margin-top:10px"><button class="btn danger sm" id="del">Rasmni o'chirish</button></div>`);
      $("#del").onclick=()=>{ p.images.splice(i,1); save(); $("#modal").innerHTML=""; paint(); };
    });
  };
  paint();
  if($("#imgup")) $("#imgup").onchange=async e=>{
    try{ const s=await fileToImg(e.target.files[0],900,.68); p.images.push(s); save(); paint(); e.target.value="";
      if(Cloud.on){ toast("Rasm serverga yuborilmoqda...");
        Cloud.raw("rasm",Object.assign({darsId:id,mavzu:l.title,dataUrl:s},cred()))
          .then(()=>{ cloudBadge(); toast("Rasm yuklandi"); })
          .catch(()=>{ qAdd("rasm",Object.assign({darsId:id,mavzu:l.title,dataUrl:s},cred())); toast("Rasm navbatga qo'yildi"); });
      } else toast("Rasm yuklandi"); }
    catch(err){ toast(String(err),true); }
  };
  if($("#savework")) $("#savework").onclick=()=>{ p.tasks=$("#tasktext").value; save();
    cloudPush("hisobot",{darsId:id,mavzu:l.title,matn:p.tasks}); toast("Hisobot saqlandi"); };
}

function vTest(id){
  const l=byId(id); if(!l) return page(`<div class="card"><div class="empty">Test topilmadi.</div></div>`);
  return page(`<h1>Test — ${esc(l.title)}</h1><p class="sub">${l.tests.length} ta savol · har bir savol uchun 1 ball</p>
   <form id="qs" onsubmit="return false">${l.tests.map((t,i)=>`<div class="q" id="q${i}"><h4>${i+1}. ${esc(t.q)}</h4>
    ${t.o.map((o,j)=>`<label class="opt" data-q="${i}" data-o="${j}"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}
    <div class="exp hide" id="e${i}">${esc(t.e)}</div></div>`).join("")}</form>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="fin">Testni yakunlash</button>
   <button class="btn ghost" id="back">Darsga qaytish</button></div><div id="res"></div>`);
}
function afterTest(id){
  const l=byId(id), u=me();
  $("#back").onclick=()=>go("#/lesson/"+id);
  $("#fin").onclick=()=>{
    let sc=0, unanswered=0;
    l.tests.forEach((t,i)=>{
      const ch=$(`input[name=q${i}]:checked`);
      if(!ch){ unanswered++; }
      const v=ch?+ch.value:-1;
      if(v===t.a) sc++;
      $$(`.opt[data-q="${i}"]`).forEach(o=>{
        const j=+o.dataset.o;
        if(j===t.a) o.classList.add("right");
        else if(j===v) o.classList.add("wrong");
        $("input",o).disabled=true;
      });
      $("#e"+i).classList.remove("hide");
    });
    const p=lp(u.login,id);
    const prev=p.test?p.test.attempts:0;
    p.test={score:sc,total:l.tests.length,date:nowISO(),attempts:prev+1};
    save();
    cloudPush("natija",{darsId:id,mavzu:l.title,tur:TYPE_NM[l.type],ball:sc,maks:l.tests.length,urinish:prev+1});
    const pc=Math.round(sc/l.tests.length*100);
    $("#res").innerHTML=`<div class="card" style="margin-top:14px;text-align:center">
      <div class="score" style="color:${pc>=60?"var(--ok)":"var(--bad)"}">${sc} / ${l.tests.length}</div>
      <p class="sub">${pc}% · ${pc>=86?"a'lo":pc>=71?"yaxshi":pc>=60?"qoniqarli":"takrorlash tavsiya etiladi"}${unanswered?` · ${unanswered} ta savol javobsiz qoldi`:""}</p>
      <button class="btn ghost" id="b2">Darsga qaytish</button></div>`;
    $("#b2").onclick=()=>go("#/lesson/"+id);
    $("#fin").disabled=true;
    const rr=$("#res"); if(rr && rr.scrollIntoView) rr.scrollIntoView({behavior:"smooth",block:"center"});
  };
}

function downloadCSV(rows,name){
  const csv="\uFEFF"+rows.map(r=>r.map(c=>{ const s=String(c==null?"":c).replace(/"/g,'""'); return /[";\n,]/.test(s)?`"${s}"`:s; }).join(";")).join("\r\n");
  const a=el("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  toast("Fayl yuklab olindi");
}

/* ---------- diagramma ---------- */
function barChart(data,unit){
  if(!data.length) return `<div class="empty">Ma'lumot yo'q</div>`;
  const W=520,H=190,pad=28, max=Math.max(100,...data.map(d=>d.v)), bw=(W-pad*2)/data.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
   ${[0,.25,.5,.75,1].map(t=>`<line class="gl" x1="${pad}" y1="${10+(H-46)*t}" x2="${W-6}" y2="${10+(H-46)*t}"/>
     <text x="2" y="${14+(H-46)*t}">${Math.round(max*(1-t))}</text>`).join("")}
   ${data.map((d,i)=>{ const h=(H-46)*(d.v/max), x=pad+i*bw+bw*.18, w=bw*.64;
     return `<rect x="${x}" y="${10+(H-46)-h}" width="${w}" height="${Math.max(1,h)}" fill="var(--accent)" rx="2"/>
      <text x="${x+w/2}" y="${H-20}" text-anchor="middle">${esc(d.l)}</text>
      <text x="${x+w/2}" y="${6+(H-46)-h}" text-anchor="middle">${d.v}${unit||""}</text>`; }).join("")}</svg>`;
}

   <button class="btn" id="usave">Login va parolni saqlash</button>`);

  $("#usave").onclick=()=>{
    const nlg=$("#ulg").value.trim().toLowerCase(), npw=$("#upw").value;
    const err=[];
    if(nlg.length<3) err.push("Login kamida 3 ta belgidan iborat bo'lsin.");
    if(/\s/.test(nlg)) err.push("Loginda bo'sh joy bo'lmasin.");
    if(nlg!==u.login && S.users.some(x=>x.login===nlg)) err.push("Bu login band.");
    if(npw.length<5) err.push("Parol kamida 5 ta belgidan iborat bo'lsin.");
    if(err.length){ $("#am").innerHTML=`<div class="msg err">${err.map(esc).join("<br>")}</div>`; return; }

    if(nlg!==u.login){                       /* login o'zgarsa, ma'lumotlar ham ko'chiriladi */
      if(S.data[u.login]){ S.data[nlg]=S.data[u.login]; delete S.data[u.login]; }
      if(S.session===u.login) S.session=nlg;
      u.login=nlg;
    }
    const eskiLogin=nlg!==u.login?u.login:nlg;
    u.pw=npw; u.salt=salty(); u.hash=hashPw(npw,u.salt);
    save();
    if(Cloud.on) Cloud.raw("hisobniOzgartirish",Object.assign({nishon:eskiLogin,yangiLogin:nlg,yangiPw:npw},cred()))
      .catch(e=>toast(e.message||"Serverda yangilanmadi",true));
    $("#modal").innerHTML=""; toast("Hisob ma'lumotlari yangilandi"); render();
  };
}
function showExam(lg,s){
  const u=S.users.find(x=>x.login===lg), d=userData(lg), e=d.exam[s];
  modal(`<h3 style="margin:0 0 4px">${esc(u.familiya)} ${esc(u.ism)} — ${s}-semestr, ${e.variant}-variant</h3>
   <p class="sub">${esc(u.guruh)} · ${dstr(e.date)}</p>
   ${EXAMS[s][e.variant-1].map((q,i)=>`<div style="margin-bottom:12px"><b style="font-size:14px">${i+1}. ${esc(q)}</b>
     <div class="readout">${esc((e.answers||[])[i]||"javob yozilmagan")}</div></div>`).join("")}
   <label class="fld"><span>Ball qo'yish (0–100)</span><input type="number" id="sc" min="0" max="100" value="${e.score!=null?e.score:""}"></label>
   <button class="btn" id="ok">Bahoni saqlash</button>`);
  $("#ok").onclick=()=>{ const v=parseInt($("#sc").value,10);
    e.score=isNaN(v)?null:Math.max(0,Math.min(100,v)); save();
    if(Cloud.on) Cloud.raw("baho",Object.assign({nishon:lg,sem:s,ball:e.score},cred())).catch(()=>{});
    $("#modal").innerHTML=""; toast("Baho saqlandi"); render(); };
}

/* =====================================================================
   MARSHRUTLASH
   ===================================================================== */
function render(){
  clearTimers();
  const h=location.hash||"#/";
  const parts=h.replace(/^#\/?/,"").split("/");
  const p1=parts[0]||"", p2=parts[1]||"";
  const app=$("#app"), u=me();
  const need = r => { if(!u){ location.hash="#/login"; return false; } return true; };
  let after=null;
  if(p1==="" ){ app.innerHTML=vHome(); after=afterHome; }
  else if(p1==="login"){ if(u){ location.hash=u.role==="admin"?"#/admin":"#/dash"; return; } app.innerHTML=vLogin(); after=afterLogin; }
  else if(p1==="register"){ if(u){ location.hash="#/dash"; return; } app.innerHTML=vRegister(); after=afterRegister; }
  else if(p1==="about"){ app.innerHTML=vAbout(); }
  else if(p1==="help"){ app.innerHTML=vHelp(); after=afterHelp; }
  else if(p1==="dasturi"){ app.innerHTML=vCurriculum(); }
  else if(p1==="theme"){ app.innerHTML=vTheme(); after=afterTheme; }
  else if(!need()) return;
  else if(p1==="dash"){ if(u.role==="admin"){ location.hash="#/admin"; return; } app.innerHTML=vDash(); after=afterDash; }
  else if(p1==="sem"){ app.innerHTML=vSem(+p2||1); after=afterSem; }
  else if(p1==="lesson"){ app.innerHTML=vLesson(p2); after=()=>afterLesson(p2); }
  else if(p1==="test"){ app.innerHTML=vTest(p2); after=()=>afterTest(p2); }
  else if(p1==="results"){ app.innerHTML=vResults(); after=afterResults; }
  else if(p1==="exam"){ app.innerHTML=vExam(); after=afterExam; }
  else if(p1==="exampaper"){ app.innerHTML=vExamPaper(p2); after=()=>afterExamPaper(p2); }
  else if(p1==="profile"){ app.innerHTML=vProfile(); after=afterProfile; }
  else if(p1==="admin"){ if(u.role!=="admin"){ location.hash="#/dash"; return; } app.innerHTML=vAdmin(); after=afterAdmin; }
  else { app.innerHTML=plain(`<div class="card"><div class="empty">Sahifa topilmadi. <a href="#/">Bosh sahifaga qaytish</a></div></div>`); }
  paintNav();
  if(after) try{ after(); }catch(e){ console.error(e); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
(async function boot(){
  Cloud.init();
  await Store.init();
  await loadState();
  applyTheme();
  render();
  cloudBadge();
  if(Cloud.on){ qFlush(); setInterval(qFlush, 60000); }
})();
</script>
