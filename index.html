{
 id:"S1-A3", sem:1, week:3, type:"practice", no:3,
 title:"Ko'paytirish dasturini C dasturlash tilida tuzish",
 goal:"Ko'paytirish amalining dasturiy usullarini o'zlashtirish, uni C tilida amalga oshirish va bajarilish vaqtini baholash.",
 outcomes:[],
 plan:["Masalaning qo'yilishi","Takrorlangan qo'shish usuli","Siljitish va qo'shish usuli","C tilidagi amalga oshirish","Natijaning razryadliligi","Vaqt bo'yicha taqqoslash"],
 equip:["Shaxsiy kompyuter","MPLAB X + XC8 yoki istalgan C kompilyatori","Proteus (ixtiyoriy)","Darslikning ALU va port simulyatorlari"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Ko'pgina 8 razryadli mikrokontrollerlarda (jumladan PIC16 oilasida) apparat ko'paytirgich yo'q. Shu sababli ko'paytirish dasturiy yo'l bilan bajariladi. Ikki 8 razryadli sonning ko'paytmasi 16 razryadgacha bo'lishi mumkin, shuning uchun natija uchun ikkita bayt ajratiladi."],
  ["f","P = A · B,  0 ≤ A,B ≤ 255  →  0 ≤ P ≤ 65 025","Natija 16 razryadli o'zgaruvchida saqlanadi."],
  ["h","Birinchi usul: takrorlangan qo'shish"],
  ["p","Eng sodda usul — A sonini B marta qo'shish. Tushunish oson, ammo B katta bo'lganda sekin ishlaydi: eng yomon holatda 255 ta qo'shish bajariladi."],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","unsigned int mul_add(unsigned short a, unsigned short b)\n{\n    unsigned int p = 0;\n    while (b--)              // b marta takrorlanadi\n        p += a;\n    return p;\n}"],
  ["h","Ikkinchi usul: siljitish va qo'shish"],
  ["p","Bu usul qo'lda ko'paytirish qoidasini takrorlaydi: ko'paytuvchining har bir biti tekshiriladi, bit 1 bo'lsa ko'paytiriluvchi natijaga qo'shiladi, so'ng ko'paytiriluvchi bir razryad chapga siljitiladi. 8 razryadli sonlar uchun har doim atigi 8 qadam bajariladi."],
  ["c","unsigned int mul_shift(unsigned short a, unsigned short b)\n{\n    unsigned int p = 0;\n    unsigned int m = a;      // siljitiladigan ko'paytiriluvchi\n    unsigned short i;\n\n    for (i = 0; i < 8; i++)\n    {\n        if (b & 0x01)        // quyi bit 1 bo'lsa qo'shamiz\n            p += m;\n        m <<= 1;             // ko'paytiriluvchini 2 ga ko'paytirish\n        b >>= 1;             // keyingi bitga o'tish\n    }\n    return p;\n}"],
  ["t",["Qadam","b ning quyi biti","Amal","p"],[["1","1 (b=13=00001101)","p += 5","5"],["2","0","qo'shilmaydi","5"],["3","1","p += 20","25"],["4","1","p += 40","65"],["5–8","0","qo'shilmaydi","65"]]],
  ["p","Jadvalda A = 5, B = 13 uchun hisob keltirilgan: natija 65 ga teng, ya'ni 5 · 13 = 65."],
  ["h","To'liq dastur"],
  ["c","__CONFIG(_HS_OSC & _WDT_OFF & _PWRTE_ON & _BODEN_ON & _LVP_OFF & _CP_OFF & _WRT_OFF & _CPD_OFF);\n\nunsigned int mul_shift(unsigned short a, unsigned short b);\n\nvoid main()\n{\n    unsigned short a = 25, b = 17;\n    unsigned int p;\n\n    TRISB = 0x00;            // PORTB — natijaning quyi bayti\n    TRISD = 0x00;            // PORTD — yuqori bayt\n\n    p = mul_shift(a, b);     // 25 * 17 = 425 = 0x01A9\n\n    while (1)\n    {\n        PORTB = (unsigned short)(p & 0x00FF);   // 0xA9\n        PORTD = (unsigned short)(p >> 8);       // 0x01\n    }\n}"],
  ["n","Diqqat: natijani 8 razryadli unsigned short o'zgaruvchiga yozsangiz, yuqori bayt yo'qoladi va 425 o'rniga 169 hosil bo'ladi. Natija uchun 16 razryadli unsigned int turi tanlanadi."],

  ["ol",["Variant raqamingiz N bo'lsin. A = 20 + N, B = 12 + N sonlarini siljitish usuli bilan qo'lda ko'paytiring va jadval tuzing.","mul_shift funksiyasini mikroC PRO for PIC kompilyatorida tekshiring va natijani qo'lda hisobingiz bilan solishtiring.","Ikki usulning qadamlar sonini B = 3 va B = 200 uchun taqqoslang, xulosa yozing.","Natijani ikkita portga bayt-bayt chiqaruvchi dastur qismini yozing.","Ko'paytirishni 2 ning darajasiga (2, 4, 8) siljitish bilan almashtirish mumkinligini kod bilan ko'rsating.","Kod va natija ekranining rasmini yuklang."]],

  {q:"IR bloki buyruq kodini qaysi ikki asosiy qismga ajratadi?",o:["Kirish va chiqish signallariga ajratib yuboradi","Operatsiya kodi va operand maydonlariga ajratadi","Yuqori bayt va quyi baytga ajratib tarqatadi","Adres va ma'lumot qismlariga ajratib beradi"]},

{
 id:"S1-A4", sem:1, week:4, type:"practice", no:4,
 title:"Proteus loyihalovchining avtomatlashtirilgan ish o'rnida mikrokontrollerli qurilmani tadqiq etish",
 goal:"Proteus muhitida mikrokontrollerli sxemani yig'ish, dasturni yuklash va virtual asboblar bilan tadqiq etishni o'zlashtirish.",
 outcomes:[],
 plan:["Proteus haqida umumiy ma'lumot","Loyiha yaratish","Elementlarni tanlash va joylashtirish","Sxemani ulash","HEX faylni yuklash","Virtual asboblar bilan o'lchash"],
 equip:["Shaxsiy kompyuter","Proteus 8 (ISIS sxema muharriri va VSM modellashtirish tizimi)","MPLAB X + XC8 kompilyatori","Tayyor HEX fayl","Darslikning LED va PWM simulyatorlari"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Proteus — elektron qurilmalarni loyihalash va modellashtirishning avtomatlashtirilgan tizimi. Uning ikki asosiy qismi bor: ISIS — sxema muharriri va modellashtirish muhiti, ARES — bosma plata loyihalash muhiti. VSM (Virtual System Modelling) moduli mikrokontrollerni real dastur kodi bilan birga, atrofidagi analog va raqamli komponentlar bilan bitta muhitda modellashtirish imkonini beradi."],
  ["p","Modellashtirishning amaliy ahamiyati: sxemani apparat yig'ishdan oldin tekshirish, xatolarni komponentlarni kuydirmasdan topish, o'lchash asboblari bo'lmagan sharoitda signal shakllarini ko'rish va bir necha variantni tez taqqoslash."],
  ["fig","proteus","1-rasm. Proteusda mikrokontrollerli qurilmani tadqiq etish bosqichlari"],
  ["h","Ishni bajarish tartibi"],
  ["ol",["Proteus 8 ni ishga tushiring va New Project buyrug'i bilan yangi loyiha yarating; sxema shablonini (DEFAULT) tanlang.","ISIS oynasida P (Pick Devices) tugmasi orqali komponentlar kutubxonasini oching.","Qidiruv maydoniga PIC16F877A yozib, mikrokontrollerni tanlang va loyihaga qo'shing.","Xuddi shu tarzda LED-RED, RES (rezistor), BUTTON, CRYSTAL va POT-HG elementlarini qo'shing.","Elementlarni ish maydoniga joylashtiring va Terminals Mode dan POWER hamda GROUND terminallarini qo'shing.","Chiqishlarni sichqoncha bilan ulang: PORTB razryadlariga rezistor orqali LED, MCLR ni 10 kΩ rezistor orqali +5 V ga.","Mikrokontroller ustiga ikki marta bosing, xossalar oynasida Program File maydoniga kompilyatordan olingan HEX faylni ko'rsating va Processor Clock Frequency ni 8 MHz qilib belgilang.","Virtual asboblardan OSCILLOSCOPE, DC VOLTMETER va COUNTER TIMER ni sxemaga ulang.","Play tugmasi bilan modellashtirishni ishga tushiring va natijani kuzating.","Pause rejimida Debug menyusi orqali registrlar va xotira holatini ko'rib chiqing."]],
  ["n","Diqqat: Proteusda rezistorsiz LED yoki ulanmagan MCLR liniyasi ko'pincha modellashtirishning ishlamasligiga sabab bo'ladi. Xatolar ro'yxati Simulation Log oynasida ko'rsatiladi — ish boshlanmasa avvalo shu oynani tekshiring."],
  ["h","Tekshiriladigan dastur"],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","__CONFIG(_HS_OSC & _WDT_OFF & _PWRTE_ON & _LVP_OFF);\n\nvoid main()\n{\n    ADCON1 = 0x06;        // PORTA raqamli rejim\n    TRISB  = 0x00;        // PORTB chiqish\n    TRISD  = 0xFF;        // PORTD kirish\n\n    while (1)\n    {\n        if (PORTD.F0 == 0)    // tugma bosilgan\n            PORTB = 0xFF;     // barcha LED yonadi\n        else\n            PORTB = 0x01;     // faqat bittasi\n        Delay_ms(100);\n    }\n}"],
  ["h","Virtual asboblar"],
  ["t",["Asbob","Vazifasi","Nimani o'lchaymiz"],[["OSCILLOSCOPE","Signal shaklini vaqt bo'yicha ko'rsatish","Impuls davri, davomiyligi, fronti"],["DC/AC VOLTMETER","Kuchlanishni o'lchash","Port chiqishidagi daraja, LED dagi tushuv"],["DC AMMETER","Tokni o'lchash","LED orqali oqayotgan tok"],["COUNTER TIMER","Impulslarni sanash va chastota o'lchash","Generator chastotasi, PWM chastotasi"],["LOGIC ANALYSER","Bir necha raqamli liniyani birga kuzatish","Portlar holatining o'zgarishi"],["VIRTUAL TERMINAL","UART ma'lumotlarini ko'rsatish","Uzatilgan matn va kodlar"]]],
  ["h","Interaktiv qism"],
  ["p","Proteusdagi ossillograf bilan ishlashdan oldin PWM signalining parametrlari qanday o'zgarishini quyidagi modelda kuzatib chiqing."],
  ["sim","pwm"],
  ["h","Topshiriqlar"],
  ["ol",["Proteusda PIC16F877A va 8 ta LED dan iborat sxemani yig'ing, HEX faylni yuklang va ishlashini tekshiring.","Ossillograf bilan PORTB.0 chiqishidagi signal davrini o'lchang va dasturdagi kechikish qiymatiga mosligini tekshiring.","DC ammetr bilan LED orqali oqayotgan tokni o'lchang va nazariy hisob bilan solishtiring.","Rezistor qiymatini 330 Ω dan 1 kΩ ga o'zgartirib, tokning o'zgarishini jadvalga yozing.","Tugma qo'shib, uning bosilishiga qarab LED holati o'zgarishini modellashtiring.","Modellashtirish oynasi va ossillogramma ekranining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Proteus mikrokontrollerli qurilmani apparat yig'ishdan oldin to'liq tekshirish imkonini beradi: sxema yig'iladi, real HEX fayl yuklanadi va virtual asboblar bilan o'lchovlar bajariladi. Modellashtirish natijalari nazariy hisoblarga mos kelishi loyihaning to'g'ri ekanini tasdiqlaydi, farq bo'lsa — sxema yoki dasturda xato borligini ko'rsatadi."],
 ],
 tests:[

  {q:"Proteusning ISIS qismi nima uchun xizmat qiladi?",o:["Kristallga HEX faylni yozib beruvchi programmator","C tilidagi kodni mashina kodiga aylantirib beradi","Sxema muharriri va modellashtirish muhiti sifatida ishlaydi","Bosma plata topologiyasini loyihalash uchun ishlatiladi"]},
  {q:"Proteusning ARES qismi nimaga mo'ljallangan?",o:["Mikrokontroller hujjatini o'qib ko'rsatishga","Bosma plata loyihalash muhiti sifatida ishlashga","Dastur kodini xatolardan tozalashga mo'ljallangan","Sxemani chizish va virtual asboblar bilan o'lchashga"]},
  {q:"VSM moduli qanday imkoniyat beradi?",o:["Faqat analog filtrlarning chastota tavsifini qurib berish","MK ni real dastur kodi va atrof komponentlar bilan modellashtirish","Faqat raqamli sxemalarni statik tahlil qilish imkonini beradi","Faqat bosma plata o'lchamlarini hisoblab chiqish imkonini beradi"]},
  {q:"Modellashtirishning amaliy ahamiyati nimada?",o:["Kristallning narxini sezilarli darajada arzonlashtirib beradi","Sxemani apparat yig'ishdan oldin tekshirish imkonini beradi","Dastur hajmini avtomatik ravishda qisqartirib yuboradi","Takt chastotasini real qurilmadan yuqori qilib beradi"]},
  {q:"Modellashtirish qanday afzallikni beradi?",o:["Komponentlarni kuydirmasdan xatolarni topish imkonini beradi","Dasturdagi barcha mantiqiy xatolarni o'zi tuzatib beradi","Kristallning ishlash muddatini bir necha barobar uzaytiradi","Real qurilmani butunlay keraksiz qilib qo'yadi va sinov shart emas"]},
  {q:"Proteusda yangi loyiha qanday buyruq bilan yaratiladi?",o:["New Project buyrug'i bilan, so'ng sxema shabloni tanlanadi","Terminals Mode buyrug'i bilan, so'ng terminal qo'yiladi","Pick Devices buyrug'i bilan, so'ng kutubxona ochiladi","Debug menyusi orqali, so'ng registrlar ko'rib chiqiladi"]},
  {q:"Komponentlar kutubxonasi qaysi tugma orqali ochiladi?",o:["Play tugmasi orqali ochiladi va modellashtirish boshlanadi","Pause tugmasi orqali ochiladi va registrlar ko'rinadi","P (Pick Devices) tugmasi orqali ochib olinadi","F11 tugmasi orqali ochiladi va kompilyatsiya bajariladi"]},
  {q:"Laboratoriya sxemasida qaysi mikrokontroller ishlatiladi?",o:["KR580VM80A, u eski tizimlar uchun mo'ljallangan","PIC16F877A, u qidiruv maydoniga yozib tanlab olinadi","ATmega328P, u Arduino platasining asosiy kristallidir","STM32F103, u ARM yadrosiga asoslangan kristalldir"]},
  {q:"POWER va GROUND terminallari qaysi rejimdan qo'shiladi?",o:["Debug menyusi orqali avtomatik qo'shiladi","Terminals Mode rejimidan tanlab qo'shiladi","Simulation Log oynasidan tanlab qo'shiladi","Pick Devices kutubxonasidan tanlab qo'shiladi"]},
  {q:"MCLR liniyasi sxemada qanday ulanadi?",o:["10 kΩ rezistor orqali +5 V ta'minotga ulab qo'yiladi","Bevosita umumiy simga (yerga) ulanishi talab etiladi","Rezistor orqali PORTB razryadiga ulanishi kerak bo'ladi","Hech qayerga ulanmay, ochiq holda qoldiriladi"]},
  {q:"LED PORTB razryadlariga qanday ulanadi?",o:["Kondensator orqali ulanib, o'zgaruvchan tok o'tkaziladi","Cheklovchi rezistor orqali ulanib, tok cheklanadi","Bevosita, hech qanday element qo'shmasdan ulanadi","Transformator orqali ulanib, kuchlanish oshiriladi"]},

  {q:"Processor Clock Frequency maydoni nima uchun to'g'ri belgilanishi kerak?",o:["Kristallning korpus turini to'g'ri tanlash maqsadida","Sxemadagi rezistorlarning qiymatini aniqlash maqsadida","Dastur hajmini kamaytirish va xotirani tejash maqsadida","Modellashtirishdagi vaqt hisoblari real qurilmaga mos kelishi uchun"]},
  {q:"Modellashtirish qaysi tugma bilan ishga tushiriladi?",o:["Play tugmasi bilan ishga tushirilib, natija kuzatiladi","Pause tugmasi bilan ishga tushirilib, holat ko'rinadi","P tugmasi bilan ishga tushirilib, kutubxona ochiladi","F11 tugmasi bilan ishga tushirilib, kod yig'iladi"]},

  {q:"Proteusda modellashtirish ishga tushmasa avvalo nima qilish kerak?",o:["Butun loyihani o'chirib, qaytadan yangidan yaratish","Kompyuterni qayta ishga tushirib, dasturni yangilash","Simulation Log oynasidagi xatolar ro'yxatini tekshirish","Mikrokontrollerni boshqa modelga almashtirib ko'rish"]},
  {q:"Proteusda modellashtirish ishlamasligining tipik sabablari qaysilar?",o:["Ossillografning vaqt masshtabi noto'g'ri qo'yilgani","Rezistorsiz LED yoki ulanmagan MCLR liniyasi sabab bo'ladi","Juda ko'p virtual asbob ulangani sabab bo'lib qoladi","Loyiha nomining juda uzun yozilgani sabab bo'ladi"]},
  {q:"Dasturda ADCON1 = 0x06 qatori nimani bajaradi?",o:["PORTA liniyalarini raqamli rejimga o'tkazib qo'yadi","PORTB liniyalarini chiqish sifatida sozlab beradi","Watchdog taymerini o'chirib, qayta yuklashni to'xtatadi","ADC modulining aniqligini 10 razryadga belgilaydi"]},
  {q:"Dasturda TRISB = 0x00 va TRISD = 0xFF qatorlari nimani belgilaydi?",o:["Ikki portning ham analog rejimga o'tishini belgilaydi","PORTB kirish, PORTD chiqish sifatida sozlanishini belgilaydi","Ikki portning ham chiqish sifatida sozlanishini belgilaydi","PORTB chiqish, PORTD kirish sifatida sozlanishini belgilaydi"]},
  {q:"Dasturda PORTDbits.RD0 == 0 sharti nimani tekshiradi?",o:["ADC o'zgartirishining tugaganini tekshiradi","Kvarts generatorining ishga tushganini tekshiradi","Tugmaning bosilgan yoki bosilmaganini tekshiradi","LED ning yonib turgan yoki o'chganini tekshiradi"]},
  {q:"Tugma bosilganda dasturda PORTB ga qanday qiymat yoziladi?",o:["0x0F yoziladi va yarim portdagi LED yonadi","0xFF yoziladi va barcha LED yonib ketadi","0x01 yoziladi va faqat bitta LED yonadi","0x00 yoziladi va barcha LED o'chib qoladi"]},
  {q:"OSCILLOSCOPE virtual asbobi bilan nimani o'lchash mumkin?",o:["LED orqali oqayotgan tokning aniq qiymatini o'lchash mumkin","Impuls davri, davomiyligi va frontlarini o'lchash mumkin","Bir necha raqamli liniyani jadval ko'rinishida ko'rish","UART orqali uzatilgan matn va kodlarni ko'rish mumkin"]},
  {q:"DC AMMETER asbobi sxemada nimani o'lchaydi?",o:["Impuls davomiyligini vaqt bo'yicha o'lchab beradi","Port chiqishidagi kuchlanish darajasini o'lchab beradi","Generator chastotasini sanab, qiymatini ko'rsatadi","LED orqali oqayotgan tok qiymatini o'lchab beradi"]},
  {q:"COUNTER TIMER asbobi qanday o'lchov uchun ishlatiladi?",o:["Impulslarni sanash va chastotani o'lchash uchun ishlatiladi","Kuchlanish darajasini raqamli ko'rsatish uchun ishlatiladi","UART ma'lumotlarini matn ko'rinishida chiqarish uchun","Signal shaklini vaqt bo'yicha ko'rsatish uchun ishlatiladi"]},
  {q:"LOGIC ANALYSER asbobi qanday vazifani bajaradi?",o:["Kuchlanishdagi tushuvni aniq o'lchab, raqam bilan beradi","Faqat bitta analog signalning shaklini ko'rsatib beradi","Bir necha raqamli liniyani birga kuzatish imkonini beradi","Generator chastotasini o'zgartirib, sozlash imkonini beradi"]},
  {q:"VIRTUAL TERMINAL asbobi nima uchun ishlatiladi?",o:["Impuls davri va davomiyligini o'lchab chiqish uchun","LED dagi kuchlanish tushuvini aniqlash uchun ishlatiladi","UART orqali uzatilgan matn va kodlarni ko'rsatish uchun","Registrlar va xotira holatini jadvalda ko'rsatish uchun"]},
  {q:"Kompilyatsiya natijasi qaysi papkada hosil bo'ladi?",o:["Loyiha ildiz papkasida, .mcp fayl ko'rinishida chiqadi","Source Files papkasida, .c fayl ko'rinishida saqlanadi","Header Files papkasida, .h fayl ko'rinishida chiqadi","dist papkasida, .hex fayl ko'rinishida hosil bo'ladi"]},
  {q:"Rezistor qiymatini 330 Ω dan 1 kΩ ga oshirsak, LED toki qanday o'zgaradi?",o:["Taxminan uch barobar kamayadi, chunki qarshilik ortadi","O'zgarmaydi, chunki tok faqat kuchlanishga bog'liq","Nolga tushadi, chunki zanjir butunlay uzilib qoladi","Taxminan uch barobar ortadi, chunki qarshilik ortadi"]},
  {q:"Modellashtirish natijasi nazariy hisobga mos kelmasa, bu nimani ko'rsatadi?",o:["Sxemada yoki dasturda xato borligini ko'rsatib beradi","Nazariy hisob hech qachon amaliyotga mos kelmasligini","Kristall jismoniy nuqsonli ekanini bevosita ko'rsatadi","Proteusning o'zi noto'g'ri ishlab turganini ko'rsatadi"]},

{
 id:"S1-M5", sem:1, week:5, type:"lecture", no:5,
 title:"Mikrodasturlarni doimiy saqlash qurilmasi. Hisoblagich registrlar. Mikroprotsessor xotirasi. Xotiraning tezkor yacheykalari",
 goal:"Mikrodasturiy boshqaruv xotirasi, hisoblagich registrlar va mikroprotsessor xotirasining tashkil etilishini o'zlashtirish.",
 outcomes:["Protsessorning funksiyalarini ro'yxatlab, har birini izohlay oladi","Xotira turlarini va ularning parametrlarini qiyoslay oladi","Kiritish-chiqarish qurilmalarining adreslanish usullarini tushuntira oladi","Xotira ierarxiyasini tavsiflay oladi"],
 plan:["Mikrodasturiy boshqaruv","Mikrodasturlarni saqlash qurilmasi","Hisoblagich registrlar","Xotira turlari va parametrlari","Tezkor xotira yacheykasi","Xotira ierarxiyasi"],
 body:[
  ["h","Protsessorning funksiyalari"],
  ["ul",["Buyruqlarni xotiradan olish, deshifratsiya qilish va bajarish","Arifmetik va mantiqiy amallarni bajarish","Dastur oqimini boshqarish: shartli va shartsiz o'tishlar, qism dasturlarni chaqirish","Xotira va kiritish-chiqarish qurilmalari bilan almashinuv sikllarini shakllantirish","Uzilishlarga xizmat ko'rsatish va prioritetlarni hisobga olish","Tizim tugunlarini takt signallari va boshqaruv signallari bilan sinxronlash"]],
  ["h","Mikrodasturiy boshqaruv va uni saqlash qurilmasi"],
  ["p","Boshqaruv qurilmasi ikki xil usulda qurilishi mumkin. Qattiq mantiqli boshqaruvda har bir buyruq uchun kerakli signallar ketma-ketligi mantiqiy sxemalar bilan qotirib qo'yiladi: bu usul eng tez ishlaydi, ammo buyruqlar tizimini o'zgartirish uchun kristallni qaytadan loyihalash kerak bo'ladi."],
  ["p","Mikrodasturiy boshqaruvda esa har bir mashina buyrug'i elementar mikroamallar ketma-ketligi — mikrodastur ko'rinishida ifodalanadi. Mikrodasturlar maxsus doimiy xotirada (mikrodasturlarni saqlash qurilmasi, boshqaruv xotirasi) saqlanadi. Buyruq kodi deshifrator orqali shu xotiradagi mikrodastur boshlang'ich adresiga aylantiriladi, so'ng mikrodastur qadamma-qadam o'qilib bajariladi."],
  ["t",["Belgi","Qattiq mantiqli boshqaruv","Mikrodasturiy boshqaruv"],[["Tezligi","Yuqori","Pastroq"],["Buyruqlar tizimini o'zgartirish","Kristallni qayta loyihalash kerak","Mikrodasturni almashtirish yetarli"],["Murakkab buyruqlar","Sxema keskin murakkablashadi","Osongina qo'shiladi"],["Tipik qo'llanish","RISC protsessorlar","CISC protsessorlar"]]],
  ["p","Mikrodasturning har bir qatori — mikrokomanda. Uning razryadlari bevosita boshqaruv signallariga mos keladi: registrga yozish, ALU amalini tanlash, shinani ochish va hokazo. Mikrokomandaning bir qismi esa keyingi mikrokomanda adresini ko'rsatadi."],
  ["h","Hisoblagich registrlar"],
  ["p","Hisoblagich registr — o'ziga kelgan har bir impulsdan keyin qiymatini birga oshiradigan yoki kamaytiradigan registr. Mikroprotsessorda ular bir necha joyda ishlatiladi:"],
  ["ul",["Komandalar hisoblagichi (PC) — keyingi buyruq adresini avtomatik oshiradi","Mikrokomandalar hisoblagichi — boshqaruv xotirasidagi joriy mikrokomanda adresini saqlaydi","Stek ko'rsatkichi (SP) — stekka yozish va o'qishda avtomatik o'zgaradi","Sikl hisoblagichlari — takrorlanishlar sonini sanaydi","Taymer-hisoblagichlar — takt yoki tashqi impulslarni sanaydi"]],
  ["p","Hisoblagich registr triggerlar zanjiridan tashkil topadi: har bir trigger to'lib ketganda keyingisiga o'tkazma beradi. n ta triggerdan iborat hisoblagich 0 dan 2^n − 1 gacha sanaydi va keyin qaytadan noldan boshlanadi."],
  ["h","Xotira turlari"],
  ["t",["Turi","Energiyaga bog'liqligi","Yozish imkoni","Qo'llanishi"],[["ROM","Bog'liq emas","Ishlab chiqarishda bir marta","Ommaviy mahsulotda doimiy dastur"],["EPROM","Bog'liq emas","Ultrabinafsha nur bilan o'chiriladi","Eski tizimlar"],["EEPROM","Bog'liq emas","Elektr bilan bayt-bayt","Sozlamalar, kalibrlash koeffitsientlari"],["Flash","Bog'liq emas","Elektr bilan blok-blok","Dastur xotirasi"],["SRAM","Bog'liq","Cheksiz, tez","O'zgaruvchilar, stek"],["DRAM","Bog'liq, regeneratsiya talab qiladi","Cheksiz","Katta hajmli operativ xotira"]]],
  ["p","Xotiraning asosiy parametrlari: hajm (bayt yoki so'z), tashkil etilishi (masalan 8 K × 8), murojaat vaqti, yozish sikllari soni va saqlash muddati. Flash uchun odatda 10 000 – 100 000 yozish sikli, EEPROM uchun 1 000 000 gacha sikl kafolatlanadi — shuning uchun tez-tez o'zgaradigan qiymatlarni EEPROM ga uzluksiz yozish mumkin emas."],
  ["fig","mem","1-rasm. Mikrokontroller xotira fazosining taqsimoti"],
  ["h","Xotira ierarxiyasi"],
  ["p","Tez xotira qimmat, arzon xotira sekin. Shuning uchun xotira ierarxiya bo'yicha tashkil qilinadi: registrlar (eng tez, eng kam hajm) → kesh → operativ xotira → doimiy xotira → tashqi tashuvchilar. Mikrokontrollerlarda ierarxiya qisqa: registrlar, SRAM va Flash."],
  ["h","Kiritish-chiqarish qurilmalari"],
  ["p","Kiritish-chiqarish tuguni tashqi dunyo bilan protsessor o'rtasidagi moslashtiruvchi bo'g'in vazifasini bajaradi: signal darajalarini moslashtiradi, ma'lumotni buferlaydi, holat bayroqlarini shakllantiradi va kerak bo'lsa uzilish so'rovini beradi."],
  ["t",["Registr","Vazifasi"],[["Ma'lumot registri","Uzatiladigan yoki qabul qilingan baytni saqlaydi"],["Yo'nalish registri (TRIS)","Har bir liniyaning kirish yoki chiqish ekanini belgilaydi"],["Holat registri","Tayyorlik, xatolik, band bo'lish bayroqlari"],["Boshqaruv registri","Ish rejimi, tezlik, uzilish ruxsati"]]],
  ["h","Kiritish-chiqarish adreslash usullari"],
  ["ol",["Xotiraga proyeksiyalangan (memory-mapped) — portlar umumiy adres fazosining bir qismini egallaydi va oddiy xotira buyruqlari bilan boshqariladi. PIC va AVR shu usuldan foydalanadi.","Ajratilgan adres fazosi (isolated I/O) — portlar alohida fazoda joylashadi va maxsus IN/OUT buyruqlari bilan boshqariladi. x86 arxitekturasiga xos."]],
  ["p","Birinchi usulning afzalligi — maxsus buyruqlar kerak emas va portlar bilan xotira kabi to'liq ishlash mumkin. Kamchiligi — portlar adres fazosining bir qismini egallaydi."],
  ["h","Tugunlarning o'zaro ta'siri"],
  ["p","Bitta buyruqning bajarilishi uch tugunni ham ishga soladi. Masalan, MOVF PORTD, W buyrug'ida protsessor Flash dan buyruq kodini oladi (dastur xotirasi), so'ng PORTD registrini o'qiydi (kiritish qurilmasi) va natijani W registriga yozadi (protsessor ichki resursi). Shu tarzda har bir buyruq tizimning uch qismini bog'laydi."],
  ["sim","port"],
  ["h","Xulosa"],
  ["p","Protsessor buyruqlarni bajaradi va tizimni boshqaradi, xotira ma'lumot va dasturni saqlaydi, kiritish-chiqarish qurilmalari esa tashqi dunyo bilan aloqani ta'minlaydi. Xotira turlari energiyaga bog'liqligi, yozish imkoni va tezligi bo'yicha farqlanadi va shu belgilarga qarab vazifaga mos tanlanadi. Mikrokontrollerlarda portlar xotira fazosida joylashgani sababli ular bilan ishlash oddiy ko'chirish buyruqlari orqali amalga oshadi."],
 ],
 tests:[
  {q:"Quyidagilardan qaysi biri protsessorning funksiyasi hisoblanadi?",o:["Buyruqlarni olish, deshifratsiya qilish va bajarish","Bosma plata topologiyasini avtomatik loyihalash","Analog signalni kuchaytirib, yuklamaga uzatib berish","Ta'minot kuchlanishini barqarorlashtirib turish"]},
  {q:"Protsessor dastur oqimini qanday boshqaradi?",o:["Shartli va shartsiz o'tishlar, qism dastur chaqiruvlari orqali","Faqat takt chastotasini o'zgartirish yo'li bilan boshqaradi","Faqat uzilishlar orqali, boshqa mexanizm ishlatilmaydi","Faqat portlarga qiymat yozish yo'li bilan boshqaradi"]},
  {q:"Qattiq mantiqli boshqaruv qurilmasining xususiyati nima?",o:["Har bir buyruq mikroamallar ketma-ketligi bilan ifodalanadi","Boshqaruv signallari doimiy xotirada saqlanib turiladi","Signallar ketma-ketligi mantiqiy sxemalarda qotirib qo'yiladi","Buyruqlar tizimi dastur bilan oson almashtirilishi mumkin"]},
  {q:"Qattiq mantiqli boshqaruvda buyruqlar tizimini o'zgartirish uchun nima kerak?",o:["Konfiguratsiya bitlarini o'zgartirish kifoya qiladi","Takt chastotasini oshirish yetarli hisoblanadi","Kristallni qaytadan loyihalash talab etiladi","Faqat mikrodasturni almashtirish yetarli bo'ladi"]},
  {q:"Mikrodasturiy boshqaruvda har bir mashina buyrug'i qanday ifodalanadi?",o:["Adres shinasidagi kod qiymati ko'rinishida ifodalanadi","Bitta takt impulsining davomiyligi ko'rinishida","Elementar mikroamallar ketma-ketligi — mikrodastur ko'rinishida","Bitta mantiqiy sxemaning chiqish signali ko'rinishida"]},
  {q:"Mikrodasturlar qayerda saqlanadi?",o:["Protsessorning umumiy maqsadli registrlarida saqlanadi","Maxsus doimiy xotirada — boshqaruv xotirasida saqlanadi","Operativ xotirada, dastur ishga tushganda yuklanadi","Stek sohasida, qaytish adreslari bilan birga saqlanadi"]},
  {q:"Buyruq kodi mikrodastur bilan qanday bog'lanadi?",o:["Deshifrator orqali mikrodastur boshlang'ich adresiga aylantiriladi","Bayroqlar registriga yozilib, shart sifatida tekshiriladi","Stekka yozilib, qaytish adresi sifatida ishlatiladi","Bevosita boshqaruv signaliga aylanib, ALU ga uzatiladi"]},
  {q:"Tezlik bo'yicha qaysi boshqaruv usuli afzal?",o:["Ikkisi ham bir xil tezlikda ishlaydi","Qattiq mantiqli boshqaruv tezroq ishlaydi","Tezlik boshqaruv usuliga bog'liq bo'lmaydi","Mikrodasturiy boshqaruv tezroq ishlaydi"]},
  {q:"Murakkab buyruqlarni qo'shish qaysi usulda osonroq?",o:["Ikki usulda ham bir xil darajada qiyin hisoblanadi","Mikrodasturiy boshqaruvda, mikrodastur qo'shilsa bo'ladi","Qattiq mantiqli boshqaruvda, sxema oson kengaytiriladi","Hech qaysi usulda murakkab buyruq qo'shib bo'lmaydi"]},
  {q:"RISC va CISC protsessorlarda qanday boshqaruv usuli tipik?",o:["RISC — mikrodasturiy, CISC — qattiq mantiqli boshqaruv","Ikkisida ham faqat qattiq mantiqli boshqaruv ishlatiladi","Ikkisida ham faqat mikrodasturiy boshqaruv ishlatiladi","RISC — qattiq mantiqli, CISC — mikrodasturiy boshqaruv"]},
  {q:"Mikrokomanda nima?",o:["Protsessorning bitta takt impulsi davomiyligi o'lchovi","Mashina buyrug'ining operatsiya kodi maydonining o'zi","Mikrodasturning bir qatori, razryadlari boshqaruv signallariga mos","Xotira yacheykasining adresini ko'rsatuvchi kod qiymati"]},
  {q:"Mikrokomandaning bir qismi nimani ko'rsatadi?",o:["Takt generatorining chastota qiymatini ko'rsatadi","Keyingi mikrokomandaning adresini ko'rsatib beradi","Stek ko'rsatkichining joriy qiymatini ko'rsatadi","Dasturning umumiy hajmini bayt bilan ko'rsatadi"]},
  {q:"Hisoblagich registrga to'g'ri ta'rif qaysi?",o:["Ma'lumotni faqat parallel qabul qiladigan oddiy registr","Har kelgan impulsdan keyin qiymatini birga o'zgartiradigan registr","Ikki sonning yig'indisini hisoblab beradigan sxema","Kirish kodini chiqishlardan biriga aylantiradigan sxema"]},
  {q:"Komandalar hisoblagichi (PC) qanday vazifani bajaradi?",o:["Keyingi buyruq adresini saqlab, uni avtomatik oshiradi","Boshqaruv xotirasidagi mikrokomanda adresini saqlaydi","Stekka yozish va o'qishda avtomatik o'zgarib turadi","Takt yoki tashqi impulslarni sanab, davrni belgilaydi"]},
  {q:"Stek ko'rsatkichi (SP) qanday ishlaydi?",o:["Keyingi buyruq adresini hisoblab, uni orttirib boradi","Stekka yozish va o'qish amallarida avtomatik o'zgaradi","Sikl takrorlanishlari sonini sanab, nolga tushiradi","Boshqaruv xotirasidagi joriy adresni saqlab turadi"]},
  {q:"Hisoblagich registr qanday elementlardan tashkil topadi?",o:["Deshifrator va multipleksor sxemalaridan tashkil topadi","Triggerlar zanjiridan, har biri keyingisiga o'tkazma beradi","Analog kuchaytirgich kaskadlaridan tashkil topadi","Faqat mantiqiy VA va YOKI elementlaridan tuziladi"]},
  {q:"n ta triggerdan iborat hisoblagich qanday diapazonda sanaydi?",o:["0 dan 2^n − 1 gacha, so'ng qaytadan noldan boshlaydi","0 dan n gacha, so'ng to'xtab, kutish holatiga o'tadi","0 dan n² gacha, so'ng qaytadan noldan boshlanadi","1 dan 2^n gacha, so'ng birga qaytib keladi"]},
  {q:"ROM xotiraga ma'lumot qachon yoziladi?",o:["Ishlab chiqarish jarayonida bir marta yozib qo'yiladi","Elektr signali bilan blok-blok yozib turish mumkin","Ultrabinafsha nur bilan o'chirilgandan keyin yoziladi","Elektr signali bilan bayt-bayt yozib turish mumkin"]},
  {q:"EPROM xotira qanday o'chiriladi?",o:["Ta'minot uzilganda o'zi avtomatik o'chib ketadi","Elektr signali bilan bayt-bayt o'chirilib boriladi","Maxsus dasturiy buyruq bilan bitta blok o'chiriladi","Ultrabinafsha nur bilan o'chirilib, qaytadan yoziladi"]},
  {q:"EEPROM xotira asosan nima uchun ishlatiladi?",o:["O'zgaruvchilar va stek uchun joy sifatida ishlatiladi","Sozlamalar va kalibrlash koeffitsientlarini saqlash uchun","Dastur kodini to'liq saqlab turish uchun ishlatiladi","Katta hajmli operativ xotira sifatida ishlatiladi"]},
  {q:"Flash xotiraga yozish qanday amalga oshiriladi?",o:["Ishlab chiqarishda bir marta yozilib, keyin o'zgarmaydi","Elektr signali bilan bayt-bayt yozish amalga oshiriladi","Ultrabinafsha nur bilan o'chirib, qaytadan yoziladi","Elektr signali bilan blok-blok yozish amalga oshiriladi"]},
  {q:"SRAM xotiraning xususiyati nima?",o:["Energiyaga bog'liq, tez ishlaydi, cheksiz yoziladi","Energiyaga bog'liq, regeneratsiya talab qilib turadi","Energiyaga bog'liq emas, blok-blok yozib boriladi","Energiyaga bog'liq emas, bir marta yozib qo'yiladi"]},
  {q:"DRAM xotira SRAM dan nimasi bilan farq qiladi?",o:["Faqat bir marta yozilib, keyin o'zgartirilmaydi","Regeneratsiya (yangilash) talab qiladi, hajmi kattaroq","Ultrabinafsha nur bilan o'chirilishi talab etiladi","Energiyaga butunlay bog'liq bo'lmaydi va yo'qolmaydi"]},
  {q:"Xotiraning asosiy parametrlari qaysilar?",o:["Faqat hajm va korpus turi asosiy parametr hisoblanadi","Hajm, tashkil etilishi, murojaat vaqti, yozish sikllari","Faqat ishlab chiqaruvchi nomi va narxi hisoblanadi","Faqat ta'minot kuchlanishi va oyoqchalar soni"]},
  {q:"Flash xotira uchun odatda qancha yozish sikli kafolatlanadi?",o:["1 000 000 gacha sikl kafolatlanib beriladi","Cheksiz sikl kafolatlanadi, chegarasi mavjud emas","Faqat bitta yozish sikli kafolatlanadi, keyin o'zgarmaydi","10 000 – 100 000 sikl oralig'ida kafolatlanadi"]},

{

 title:"PIC mikrokontrollerlarining dasturlash texnologiyasi",

 outcomes:[],
 plan:["Ishlab chiqish zanjiri","Loyiha yaratish","Konfiguratsiya bitlari","Dastur tuzilmasi","Kompilyatsiya va xatolarni tuzatish","HEX faylni tekshirish"],
 equip:["Shaxsiy kompyuter","MPLAB X IDE va XC8 kompilyatori","Proteus (tekshirish uchun)","PIC16F877A hujjati (datasheet)","Darslikning port simulyatori"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PIC uchun dastur ishlab chiqish quyidagi zanjirdan iborat: masalani qo'yish va algoritm tuzish, C yoki assembler tilida kod yozish, kompilyatsiya, bog'lash (linking), HEX faylni olish, modellashtirishda tekshirish va nihoyat programmator orqali kristallga yozish. Har bir bosqichda xato aniqlanishi mumkin, shuning uchun jarayon iterativ — xato topilsa avvalgi bosqichga qaytiladi."],
  ["fig","proteus","1-rasm. Dastur ishlab chiqish va tekshirish zanjiri"],
  ["h","Loyiha yaratish tartibi"],
  ["ol",["mikroC PRO for PIC ni ishga tushiring: Project → New Project orqali yangi loyiha ustasini oching.","Device Name maydonida PIC16F877A ni tanlang.","Device Clock maydoniga kvarts chastotasini kiriting: 8.000000 MHz.","Loyihaga nom bering va papkasini tanlang; nomda bo'sh joy va kirill harflari bo'lmasin.","Kerakli kutubxonalarni (ADC, LCD) Library Manager orqali yoqing.","Kod oynasiga dasturni yozing va Build (Ctrl+F9) bilan kompilyatsiya qiling.","Konfiguratsiya bitlari Project → Edit Project oynasida yoki dasturdagi __CONFIG qatorida belgilanadi.","Natijada loyiha papkasida .hex fayl hosil bo'ladi — u modellashtirish va programmator uchun ishlatiladi."]],
  ["h","Konfiguratsiya bitlari"],
  ["p","Konfiguratsiya so'zi mikrokontrollerning apparat rejimini belgilaydi va dastur bilan birga kristallga yoziladi. Bu sozlamalar dastur ishga tushishidan oldin amal qiladi, shuning uchun ularni noto'g'ri belgilash kristallning umuman ishlamasligiga olib keladi."],
  ["t",["Bit","Vazifasi","Odatiy qiymat"],[["FOSC","Generator rejimi","HS (4–20 MHz kvarts)"],["WDTE","Watchdog taymer","OFF (o'rganish bosqichida)"],["PWRTE","Quvvat berilgandagi kechikish","ON"],["BOREN","Kuchlanish pasayganda qayta yuklash","ON"],["LVP","Past kuchlanishli dasturlash","OFF (RB3 ni port sifatida ozod qiladi)"],["CP","Kod himoyasi","OFF"]]],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","__CONFIG(_HS_OSC & _WDT_OFF & _PWRTE_ON & _BODEN_ON & _LVP_OFF & _CP_OFF & _WRT_OFF & _CPD_OFF);\n\nvoid init_ports()\n{\n    ADCON1 = 0x06;    // PORTA butunlay raqamli\n    TRISB  = 0x00;    // chiqish\n    TRISD  = 0xFF;    // kirish\n    PORTB  = 0x00;\n}\n\nvoid main()\n{\n    init_ports();\n    while (1)\n    {\n        PORTB = 0x0F;\n        Delay_ms(300);\n        PORTB = 0xF0;\n        Delay_ms(300);\n    }\n}"],
  ["h","Tipik xatolar va ularni bartaraf etish"],
  ["t",["Xato","Sababi","Yechimi"],[["Delay_ms ishlamaydi yoki vaqt noto'g'ri","Loyihada takt chastotasi (Device Clock) noto'g'ri kiritilgan","Project → Edit Project da Device Clock ni kvarts chastotasiga teng qo'ying"],["Kristall ishga tushmaydi","FOSC noto'g'ri tanlangan","Generator turiga mos rejimni belgilang"],["RB3 port sifatida ishlamaydi","LVP yoqilgan","_LVP_OFF ni belgilang"],["PORTA dan 0 o'qiladi","Liniyalar analog rejimda","ADCON1 = 0x06 bilan raqamli rejimga o'tkazing"],["Dastur bir necha soniyada qayta boshlanadi","Watchdog yoqilgan va tozalanmayapti","_WDT_OFF ni belgilang yoki asm CLRWDT buyrug'ini qo'shing"]]],
  ["h","Interaktiv qism"],
  ["sim","port"],
  ["h","Topshiriqlar"],
  ["ol",["mikroC PRO for PIC da PIC16F877A uchun loyiha yarating va yuqoridagi dasturni kompilyatsiya qiling.","Variant raqamingiz N bo'lsin: PORTB ga (0x0F + N) va uning inversiyasini navbat bilan chiqaruvchi dastur yozing.","Konfiguratsiya bitlarining har birini o'zgartirib ko'ring va natijani jadvalga yozing.","LVP = ON qilib, RB3 ni port sifatida ishlatishga urinib ko'ring va xulosa yozing.","Hosil bo'lgan HEX faylni Proteusga yuklab, ishlashini tekshiring.","Kompilyatsiya oynasi va modellashtirish natijasining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","PIC uchun dastur ishlab chiqish IDE da loyiha yaratish, konfiguratsiya bitlarini to'g'ri belgilash, kod yozish va kompilyatsiyadan iborat. Konfiguratsiya so'zi dasturdan oldin amal qilgani uchun uning xatosi eng ko'p uchraydigan ishga tushmaslik sababi hisoblanadi. Kompilyatsiya natijasi — HEX fayl bo'lib, u ham modellashtirish, ham kristallga yozish uchun yagona manba bo'lib xizmat qiladi."],
 ],

{

 body:[
  ["h","Registr tushunchasi va tuzilishi"],
  ["p","Registr — ikkilik ma'lumotni vaqtincha saqlash va u ustida elementar amallarni (yozish, o'qish, siljitish) bajarish uchun mo'ljallangan tugun. Registr triggerlar to'plamidan iborat: har bir trigger bitta razryadni saqlaydi, demak n razryadli registr n ta triggerdan tashkil topadi."],
  ["p","Triggerlarning boshqaruv kirishlari umumiy sinxronlash chizig'iga ulanadi: yozish signali kelganda barcha razryadlar bir vaqtda yangilanadi. Chiqishlar esa uch holatli buferlar orqali ichki shinaga ulanadi — shu tufayli bir vaqtda faqat bitta registr shinaga qiymat qo'yadi."],
  ["fig","regsum","1-rasm. Registr, summator va ularning boshqarish sxemasi"],
  ["h","Tuzilmaviy tasnif"],

  ["ul",["Akkumulyator — ALU amallarining asosiy operandi va natijasi saqlanadi","Umumiy registrlar — oraliq qiymatlar va ko'rsatkichlar uchun","Buyruq registri — joriy buyruq kodi","Adres registri — xotiraga murojaat adresi","Komandalar hisoblagichi va stek ko'rsatkichi — dastur oqimini boshqarish","Holat (flaglar) registri — amal natijasining xususiyatlari","Maxsus funksional registrlar (SFR) — periferiyani boshqarish va holatini o'qish","Bufer registrlari — shina bilan almashinuvda ma'lumotni ushlab turish"]],

{
 id:"S1-A6", sem:1, week:6, type:"practice", no:6,
 title:"PIC mikrokontrollerlarning komandalar tizimi",
 goal:"PIC16 buyruqlar tizimining tarkibini, formatini va buyruqlarning bajarilish vaqtini amaliy o'zlashtirish.",
 outcomes:[],
 plan:["Buyruqlar tizimining tarkibi","Buyruq formatlari","Bayt, bit va boshqaruv buyruqlari","W registr va fayl registrlari","Trassirovka","Vaqt hisobi"],
 equip:["Shaxsiy kompyuter","MPLAB X (Simulator rejimi)","PIC16F877A buyruqlar jadvali","Daftar","Darslikning ALU simulyatori"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","PIC16 oilasida atigi 35 ta buyruq bor va ularning barchasi bir xil 14 bitli so'z ko'rinishida kodlanadi. O'tish va PC ni o'zgartiruvchi buyruqlardan tashqari hamma buyruq bitta mashina siklida bajariladi. Bu dasturning bajarilish vaqtini oldindan aniq hisoblash imkonini beradi."],
  ["p","Arxitektura akkumulyator asosida qurilgan: W (Working) registr ALU ning doimiy operandi bo'lib xizmat qiladi. Ikkinchi operand esa f — fayl registri, ya'ni ma'lumot xotirasidagi yacheyka yoki maxsus funksional registr (PORTB, TRISB, STATUS va boshqalar)."],
  ["h","Buyruqlar guruhlari"],
  ["t",["Guruh","Namunalar","Izoh"],[["Bayt bilan ishlash","MOVWF f, MOVF f,d, ADDWF f,d, SUBWF f,d, CLRF f, INCF f,d","Natija d = 0 bo'lsa W ga, d = 1 bo'lsa f ga yoziladi"],["Bit bilan ishlash","BSF f,b, BCF f,b, BTFSS f,b, BTFSC f,b","Alohida razryadni o'rnatish, tozalash va tekshirish"],["Konstanta va boshqaruv","MOVLW k, ADDLW k, ANDLW k, CALL, GOTO, RETURN, RETFIE","k — bevosita berilgan sakkiz razryadli qiymat"]]],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","; mikroC PRO inline assembler: asm {} ichida PIC buyruqlari\nasm {\nLOOP:\n    MOVLW  0x0F      ; W <- 0x0F                (1 sikl)\n    MOVWF  TRISB     ; TRISB <- W               (1 sikl)\n    BSF    PORTB, 0  ; PORTB ning 0-biti = 1    (1 sikl)\n    BCF    PORTB, 0  ; PORTB ning 0-biti = 0    (1 sikl)\n    BTFSS  PORTD, 0  ; RD0 = 1 bo'lsa keyingi buyruq tashlab ketiladi\n    GOTO   LOOP      ; o'tish                   (2 sikl)\n    ADDWF  0x20, 1   ; (0x20) <- (0x20) + W\n    DECFSZ 0x21, 1   ; (0x21)-- ; natija 0 bo'lsa keyingi buyruq tashlanadi\n}"],
  ["h","Shartli bajarish mexanizmi"],
  ["p","PIC da shartli o'tish buyruqlari yo'q. Uning o'rniga \"tekshir va tashlab ket\" (skip) buyruqlari ishlatiladi: BTFSS, BTFSC, DECFSZ, INCFSZ. Shart bajarilsa keyingi buyruq NOP bilan almashtiriladi va u ikki sikl oladi, aks holda odatdagidek bajariladi. Shu sababli PIC da shart quyidagicha yoziladi:"],
  ["c","; Tugma bosilganmi? (RD0 = 0 bo'lsa bosilgan)\nasm {\nTEKSHIR:\n    BTFSS  PORTD, 0   ; RD0 = 1 bo'lsa keyingisini tashlab ket\n    GOTO   BOSILGAN   ; RD0 = 0 -> tugma bosilgan\n    BCF    PORTB, 0   ; bosilmagan: LED o'chadi\n    GOTO   TEKSHIR\nBOSILGAN:\n    BSF    PORTB, 0   ; LED yonadi\n    GOTO   TEKSHIR\n}"],
  ["h","Bajarilish vaqti hisobi"],
  ["f","t = (N1 · 1 + N2 · 2) · 4 / f_osc","N1 — bir sikli, N2 — ikki sikli buyruqlar soni."],
  ["p","Misol. f = 8 MHz, mashina sikli 500 ns. Sikl tanasi 6 ta bir sikli va 2 ta ikki sikli buyruqdan iborat bo'lsa: t = (6 + 4) · 500 ns = 5 µs. Demak sikl sekundiga taxminan 200 000 marta takrorlanadi."],
  ["h","Trassirovka namunasi"],
  ["t",["№","Buyruq","W","(0x20)","Z bayrog'i"],[["1","MOVLW 0x05","05","—","o'zgarmaydi"],["2","MOVWF 0x20","05","05","o'zgarmaydi"],["3","MOVLW 0x03","03","05","o'zgarmaydi"],["4","SUBWF 0x20, 0","02","05","0"],["5","MOVLW 0x05","05","05","0"],["6","SUBWF 0x20, 0","00","05","1"]]],
  ["p","4-qadamda SUBWF f,0 buyrug'i (f − W) ni hisoblab natijani W ga yozadi: 05 − 03 = 02. 6-qadamda 05 − 05 = 00 bo'lgani uchun Z bayrog'i o'rnatiladi — bu solishtirish amalining PIC dagi ko'rinishi."],
  ["sim","alu"],
  ["h","Topshiriqlar"],
  ["ol",["Variant raqamingiz N bo'lsin. W = (0x10 + N) va (0x20) = 0x30 uchun ADDWF 0x20,1 va SUBWF 0x20,0 buyruqlarini bajarib, trassirovka jadvalini tuzing.","BSF va BCF buyruqlaridan foydalanib, PORTB ning faqat 2- va 5-razryadlarini yoquvchi kod yozing.","BTFSC buyrug'i bilan tugma holatiga qarab tarmoqlanuvchi kod yozing va uning BTFSS bilan farqini tushuntiring.","DECFSZ asosida 200 martalik kechikish sikli yozing va uning bajarilish vaqtini f = 8 MHz uchun hisoblang.","Buyruqlarni uch guruhga (bayt, bit, konstanta va boshqaruv) ajratib, har biriga uchtadan misol yozing.","mikroC PRO for PIC da dasturingizni Software Simulator orqali qadamma-qadam bajarib, registrlar oynasi (Watch Values) rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","PIC16 buyruqlar tizimi 35 ta bir xil formatli buyruqdan iborat va RISC yondashuvining aniq namunasi. Barcha amallar W registr va fayl registrlari o'rtasida bajariladi, natija yo'nalishi d bayrog'i bilan belgilanadi. Shartlar \"tekshir va tashlab ket\" buyruqlari orqali amalga oshiriladi; bajarilish vaqti buyruqlar sonidan bevosita hisoblanadi."],
 ],
 tests:[
  {q:"PIC16 oilasida nechta buyruq mavjud?",o:["14 ta buyruq mavjud, so'z razryadliligiga teng ravishda","128 ta buyruq mavjud, bu CISC yondashuviga xos son","256 ta buyruq mavjud, bitta baytning sig'imiga teng","35 ta buyruq mavjud, bu RISC yondashuvining namunasi"]},
  {q:"PIC16 buyruqlari qanday formatda kodlanadi?",o:["Hammasi bir xil 16 bitli so'z ko'rinishida kodlanadi","Hammasi bir xil 14 bitli so'z ko'rinishida kodlanadi","O'zgaruvchan uzunlikda, 1 dan 4 baytgacha kodlanadi","Hammasi bir xil 8 bitli bayt ko'rinishida kodlanadi"]},
  {q:"PIC16 da qaysi buyruqlar bir mashina siklida bajarilmaydi?",o:["Faqat bit bilan ishlash buyruqlari ikki sikl oladi","O'tish va PC ni o'zgartiruvchi buyruqlar ikki sikl oladi","Faqat konstanta bilan ishlash buyruqlari uzoq davom etadi","Barcha buyruqlar istisnosiz bir siklda bajariladi"]},
  {q:"Buyruqlarning bir xil vaqtda bajarilishi qanday imkoniyat beradi?",o:["Xotira hajmini avtomatik ravishda tejash imkonini beradi","Takt chastotasini erkin o'zgartirish imkonini beradi","Buyruqlar sonini cheksiz ko'paytirish imkonini beradi","Dastur bajarilish vaqtini oldindan aniq hisoblash imkonini"]},
  {q:"PIC arxitekturasida W registr qanday vazifani bajaradi?",o:["ALU ning doimiy operandi — akkumulyator vazifasini bajaradi","Xotiraga murojaat adresini saqlab turish vazifasini bajaradi","Bayroqlar qiymatini saqlash vazifasini bajaradi","Joriy buyruq kodini saqlash vazifasini bajaradi"]},
  {q:"PIC buyruqlarida f nimani belgilaydi?",o:["Fayl registri — ma'lumot xotirasidagi yacheyka yoki SFR","Bevosita berilgan sakkiz razryadli konstanta qiymatini","Natija yo'nalishini, W yoki fayl registriga yozishni","Bayroq nomerini, ya'ni tekshirilayotgan razryadni"]},
  {q:"MOVWF f buyrug'i nima qiladi?",o:["Fayl registri qiymatini W registrga ko'chiradi","Konstantani bevosita W registrga yozib qo'yadi","W registr qiymatini fayl registriga ko'chiradi","Fayl registrini butunlay nollab qo'yadi"]},
  {q:"MOVLW k buyrug'i qanday amalni bajaradi?",o:["W registr qiymatini fayl registriga uzatadi","Bevosita berilgan konstantani W registrga yozadi","Fayl registriga konstantani bevosita yozadi","Fayl registri qiymatini W registrga ko'chiradi"]},
  {q:"Bayt bilan ishlash buyruqlarida d bayrog'i nimani belgilaydi?",o:["Natija yo'nalishini: d = 0 bo'lsa W ga, d = 1 bo'lsa f ga","Buyruqning necha mashina sikli olishini belgilaydi","Tekshirilayotgan razryad nomerini 0 dan 7 gacha","Konstantaning razryadliligini, 8 yoki 14 bitni"]},
  {q:"BSF f,b buyrug'i qanday amalni bajaradi?",o:["Fayl registrining b-bitini 0 holatiga tozalaydi","Fayl registrining b-bitini 1 holatiga o'rnatadi","Fayl registrining barcha bitlarini birga o'rnatadi","Fayl registrining b-bitini tekshirib, shart hosil qiladi"]},
  {q:"BCF PORTB, 0 buyrug'i nimani bajaradi?",o:["PORTB ning butun qiymatini nollab yuboradi","PORTB ning 0-razryadini tekshirib, tashlab ketadi","PORTB ning 0-razryadini nolga tozalaydi","PORTB ning 0-razryadini birga o'rnatadi"]},
  {q:"Konstanta va boshqaruv guruhiga qaysi buyruqlar kiradi?",o:["BSF, BCF, BTFSS, BTFSC — faqat bit buyruqlari","MOVWF, MOVF, ADDWF, SUBWF, CLRF, INCF buyruqlari","MOVLW, ADDLW, ANDLW, CALL, GOTO, RETURN, RETFIE","Faqat ADDWF va SUBWF arifmetik buyruqlari"]},
  {q:"PIC da shartli o'tish buyruqlari bormi?",o:["Bor, lekin ular ikki mashina sikli talab qiladi","Yo'q, uning o'rniga \"tekshir va tashlab ket\" buyruqlari bor","Bor, lekin faqat Z bayrog'i uchun ishlatilishi mumkin","Bor, har bir bayroq uchun alohida shartli o'tish mavjud"]},
  {q:"\"Tekshir va tashlab ket\" (skip) buyruqlariga qaysilar kiradi?",o:["BTFSS, BTFSC, DECFSZ va INCFSZ buyruqlari kiradi","MOVLW, MOVWF, ADDWF va SUBWF buyruqlari kiradi","GOTO, CALL, RETURN va RETFIE buyruqlari kiradi","BSF, BCF, CLRF va INCF buyruqlari kiradi"]},
  {q:"Skip buyrug'ida shart bajarilsa nima sodir bo'ladi?",o:["Buyruq qayta bajariladi va shart yana tekshiriladi","Keyingi buyruq NOP bilan almashtiriladi va ikki sikl oladi","Dastur darhol belgilangan yorliqqa o'tib ketadi","Dastur to'xtatiladi va uzilish so'rovi hosil bo'ladi"]},
  {q:"BTFSS PORTD, 0 buyrug'i qanday ishlaydi?",o:["RD0 ni birga o'rnatib, dasturni davom ettiradi","RD0 = 0 bo'lsa keyingi buyruq tashlab ketiladi","RD0 ni nolga tozalab, keyingi buyruqqa o'tadi","RD0 = 1 bo'lsa keyingi buyruq tashlab ketiladi"]},
  {q:"PIC da tugma bosilgani qanday aniqlanadi (tortuvchi rezistor bilan)?",o:["Kirish qiymati o'zgarmasa tugma bosilgan bo'ladi","Kirishda 1 bo'lsa tugma bosilgan hisoblanadi","Faqat ADC o'qib, kuchlanish o'lchanganda aniqlanadi","Kirishda 0 bo'lsa tugma bosilgan hisoblanadi"]},
  {q:"GOTO buyrug'i necha mashina sikli oladi?",o:["To'rt sikl oladi, chunki takt soniga teng bo'ladi","Sikl olmaydi, chunki u faqat yorliq belgisidir","Ikki sikl oladi, chunki u PC ni o'zgartiradi","Bir sikl oladi, boshqa buyruqlar bilan bir xil"]},
  {q:"DECFSZ 0x21, 1 buyrug'i nimani bajaradi?",o:["0x21 ning bitini tekshirib, shart hosil qiladi","0x21 ni kamaytiradi; natija 0 bo'lsa keyingi buyruq tashlanadi","0x21 ni orttiradi; natija 0 bo'lsa dastur to'xtatiladi","0x21 ni W registr bilan solishtirib, bayroq qo'yadi"]},
  {q:"ADDWF 0x20, 1 buyrug'i qanday natija beradi?",o:["W ← (0x20) + W, natija W registriga yoziladi","(0x20) ← W, oddiy ko'chirish amali bajariladi","(0x20) ← (0x20) + W, natija fayl registriga yoziladi","W ← (0x20) − W, ayirma W ga yoziladi"]},
  {q:"Bajarilish vaqti qanday formula bilan hisoblanadi?",o:["t = N1 · N2 · 4 / f_osc ko'rinishida hisoblanadi","t = (N1 + N2) / f_osc ko'rinishida hisoblanadi","t = 4 · f_osc / (N1 + N2) ko'rinishida hisoblanadi","t = (N1·1 + N2·2) · 4 / f_osc ko'rinishida hisoblanadi"]},
  {q:"f = 8 MHz da mashina sikli qancha vaqt oladi?",o:["500 ns, bu 4/8 MHz hisobidan kelib chiqadi","200 ns, bu 20 MHz uchun olingan qiymatdir","125 ns, bu bitta takt davriga to'g'ri keladi","1 µs, bu 4 MHz uchun olingan qiymatdir"]},
  {q:"6 ta bir sikli va 2 ta ikki sikli buyruqdan iborat sikl f = 8 MHz da qancha vaqt oladi?",o:["2,5 µs oladi, chunki yarim sikl hisobga olinadi","4 µs oladi, chunki 8 ta buyruq · 500 ns bo'ladi","5 µs oladi, chunki (6 + 4) · 500 ns = 5 µs","10 µs oladi, chunki har bir buyruq ikki sikl oladi"]},
  {q:"5 µs davom etadigan sikl sekundiga qancha marta takrorlanadi?",o:["Taxminan 200 000 marta takrorlanadi","Taxminan 2 000 000 marta takrorlanadi","Taxminan 5000 marta takrorlanadi","Taxminan 20 000 marta takrorlanadi"]},
  {q:"Trassirovkada MOVLW 0x05 va MOVWF 0x20 bajarilgandan keyin holat qanday?",o:["W = 05 va (0x20) = 05 bo'ladi, bayroq o'zgarmaydi","W = 20 va (0x20) = 05 bo'ladi, C bayrog'i qo'yiladi","W = 00 va (0x20) = 05 bo'ladi, Z bayrog'i o'rnatiladi","W = 05 va (0x20) = 00 bo'ladi, bayroq o'zgarmaydi"]},
  {q:"SUBWF f,0 buyrug'i qanday amalni bajaradi?",o:["f va W ni solishtirib, faqat bayroqni o'zgartiradi","(W − f) ni hisoblab, natijani fayl registriga yozadi","(f − W) ni hisoblab, natijani W registriga yozadi","(f + W) ni hisoblab, natijani W registriga yozadi"]},
  {q:"(0x20) = 05 va W = 03 bo'lsa, SUBWF 0x20, 0 natijasi qanday?",o:["W = 08 bo'ladi, chunki qiymatlar qo'shiladi","W = 05 bo'ladi, chunki fayl registri o'zgarmaydi","W = 02 bo'ladi, chunki 05 − 03 = 02 hisoblanadi","W = FE bo'ladi, chunki 03 − 05 hisoblanadi"]},
  {q:"Trassirovkada 05 − 05 amali bajarilganda nima sodir bo'ladi?",o:["Natija FF bo'ladi va C bayrog'i o'rnatiladi","Natija 00 bo'ladi, lekin bayroq o'zgarmay qoladi","Natija 05 bo'ladi va hech qanday bayroq qo'yilmaydi","Natija 00 bo'ladi va Z bayrog'i o'rnatiladi"]},
  {q:"PIC da solishtirish amali qanday amalga oshiriladi?",o:["SUBWF bilan ayirib, Z bayrog'ini tekshirish orqali","Maxsus CMP buyrug'i bilan bevosita bajariladi","BSF buyrug'i bilan bitni o'rnatish orqali","ADDWF bilan qo'shib, C bayrog'ini tekshirish orqali"]},
  {q:"PIC16 buyruqlar tizimi qaysi yondashuvning namunasi?",o:["Fon Neyman yondashuvining namunasi hisoblanadi","RISC yondashuvining aniq namunasi hisoblanadi","VLIW yondashuvining aniq namunasi hisoblanadi","CISC yondashuvining aniq namunasi hisoblanadi"]},
 ],
 checks:[{at:4,q:"ADDWF f,d buyrug'ida d = 1 bo'lsa natija qayerga yoziladi?",o:["f registriga","STATUS registriga","W registriga","Stek ko'rsatkichiga"],a:0,e:"d = 0 bo'lsa natija W ga yoziladi."},{at:9,q:"PIC da shartli o'tish buyruqlari o'rniga nima ishlatiladi?",o:["Faqat GOTO va CALL buyruqlari, ular shartni o'zi tekshiradi","Tekshir va tashlab ket buyruqlari: BTFSS, BTFSC, DECFSZ","Maxsus IF–ELSE buyruqlari mavjud va ular ishlatiladi","RETFIE va RETURN buyruqlari shartga qarab qaytaradi"],a:1,e:"Shart bajarilsa keyingi buyruq tashlab ketiladi (NOP, 2 sikl)."},{at:12,q:"f = 8 MHz da 6 ta bir sikli va 2 ta ikki sikli buyruq qancha vaqt oladi?",o:["8 µs","3 µs","5 µs","10 µs"],a:2,e:"t = (6 + 4) · 500 ns = 5 µs."},{at:15,q:"SUBWF 0x20,0 da 05 − 05 = 00 natija hosil bo'lganda qaysi bayroq o'rnatiladi?",o:["C (o'tkazma) bayrog'i","Z (nol) bayrog'i","Hech qaysi bayroq o'zgarmaydi","DC (yarim o'tkazma) bayrog'i"],a:1,e:"Bu solishtirish amalining PIC dagi ko'rinishi."}]
},
{
 id:"S1-M7", sem:1, week:7, type:"lecture", no:7,
 title:"Flaglar haqida umumiy tushuncha. Flaglar turlari",
 goal:"Flaglar (bayroqlar) tushunchasini, ularning turlarini va shartli bajarilishdagi rolini o'zlashtirish.",
 outcomes:["Qo'shish va ayirish buyruqlarining bayroqlarga ta'sirini aniqlay oladi","Ko'p baytli arifmetikani C bayrog'i orqali tashkil qila oladi","Solishtirish amalini arifmetika orqali tushuntira oladi","BCD arifmetikasining xususiyatini izohlay oladi"],
 plan:["Flag tushunchasi","Flaglar registri","Arifmetik flaglar","Boshqaruv flaglari","Flaglar va shartli bajarilish","Ko'p baytli arifmetikada flaglar"],
 body:[
  ["h","Flag tushunchasi"],
  ["p","Flag (bayroq) — protsessorning holat registridagi bitta razryad bo'lib, oxirgi bajarilgan amal natijasining biror xususiyatini qayd etadi. Flaglar amal natijasining o'zini emas, balki u haqidagi qo'shimcha ma'lumotni saqlaydi: natija nolga tengmi, o'tkazma chiqdimi, ishora qandayligi va hokazo."],
  ["p","Flaglarning ahamiyati shundaki, protsessor shartli bajarilish haqidagi qarorni faqat shu bitlarga tayanib qabul qiladi. Ya'ni har qanday shartli o'tish aslida bitta flag holatini tekshirishdan iborat."],
  ["h","Flaglar turlari"],
  ["t",["Flag","Nomi","Qachon o'rnatiladi","Guruhi"],[["C","Carry — o'tkazma","Eng katta razryaddan o'tkazma chiqqanda","Arifmetik"],["Z","Zero — nol","Natijaning barcha razryadlari nol bo'lganda","Arifmetik"],["N / S","Negative / Sign — ishora","Natijaning eng katta biti 1 bo'lganda","Arifmetik"],["V / OV","Overflow — to'lib ketish","Ishorali arifmetikada natija diapazondan chiqqanda","Arifmetik"],["DC / H","Digit (Half) Carry","Quyi tetradadan o'tkazma bo'lganda","Arifmetik"],["P","Parity — juftlik","Natijadagi birlar soni juft bo'lganda","Arifmetik"],["I / GIE","Interrupt Enable","Uzilishlarga ruxsat berilganda","Boshqaruv"],["T / TO","Time-out","Watchdog vaqti tugaganda","Holat"],["PD","Power Down","SLEEP rejimiga o'tilganda","Holat"]]],
  ["p","Flaglar ikki guruhga bo'linadi. Birinchi guruh — amal natijasiga qarab apparat tomonidan avtomatik o'rnatiladigan arifmetik flaglar. Ikkinchi guruh — dasturchi o'zi o'rnatadigan va tozalaydigan boshqaruv flaglari (masalan uzilishlarga ruxsat biti). Holat flaglari esa protsessor qanday sababdan qayta ishga tushganini aniqlash imkonini beradi."],
  ["n","Muhim: har bir buyruq ham flaglarni o'zgartiravermaydi. Ko'chirish buyruqlari odatda flaglarga tegmaydi, inkrement va dekrement faqat Z ni yangilaydi, qo'shish va ayirish esa barcha arifmetik flaglarni o'zgartiradi. Shu sababli flagni tekshirishdan oldin oradagi buyruqlar uni buzmasligiga ishonch hosil qilish kerak."],
  ["h","Arifmetik buyruqlar tarkibi"],
  ["t",["Buyruq","Amal","Ta'sir qiladigan bayroqlar"],[["ADDWF f,d","W + f","C, DC, Z"],["ADDLW k","W + konstanta","C, DC, Z"],["SUBWF f,d","f − W","C, DC, Z"],["SUBLW k","konstanta − W","C, DC, Z"],["INCF f,d","f + 1","Z"],["DECF f,d","f − 1","Z"],["INCFSZ f,d","f + 1, natija 0 bo'lsa keyingi buyruq tashlanadi","—"],["DECFSZ f,d","f − 1, natija 0 bo'lsa keyingi buyruq tashlanadi","—"]]],
  ["h","Qo'shish va bayroqlar"],
  ["p","Qo'shish natijasi 8 razryaddan oshsa, chiqib ketgan bit C bayrog'iga tushadi va akkumulyatorda faqat quyi bayt qoladi. Bu holat xato emas — u ko'p baytli arifmetikaning asosi hisoblanadi."],
  ["c","  1111 0000   (0xF0 = 240)\n+ 0010 0000   (0x20 =  32)\n-----------\n1 0001 0000   natija 0x10 = 16, C = 1\n\n  Ishorasiz talqinda haqiqiy natija = 256 + 16 = 272"],
  ["p","DC (Digit Carry) bayrog'i quyi tetradadan yuqori tetradaga o'tkazma bo'lganda o'rnatiladi va BCD arifmetikasida ishlatiladi. Z bayrog'i esa natija barcha razryadlari nol bo'lganda birga teng bo'ladi."],
  ["h","Ayirish mexanizmi"],
  ["p","PIC da ayirish qo'shimcha kod orqali bajariladi: SUBWF f,d buyrug'i aslida f + (NOT W) + 1 amalini hisoblaydi. Shu sababli C bayrog'i bu yerda qarz emas, balki teskari qarz sifatida talqin qilinadi: C = 1 bo'lsa ayirish qarzsiz bajarilgan (f ≥ W), C = 0 bo'lsa qarz hosil bo'lgan (f < W)."],
  ["t",["Holat","Shart","C bayrog'i","Z bayrog'i"],[["f > W","Ayirma musbat","1","0"],["f = W","Ayirma nol","1","1"],["f < W","Ayirma manfiy","0","0"]]],
  ["p","Aynan shu jadval PIC da solishtirish amalini tashkil qiladi: SUBWF dan keyin C va Z bayroqlarini tekshirish orqali ikki sonning munosabati aniqlanadi."],
  ["c","; (0x20) va konstanta 0x50 ni solishtirish\n      MOVLW  0x50\n      SUBWF  0x20, 0     ; W <- (0x20) - 0x50, natija saqlanmaydi\n      BTFSS  STATUS, C\n      GOTO   KICHIK      ; C = 0 -> (0x20) < 0x50\n      BTFSC  STATUS, Z\n      GOTO   TENG        ; Z = 1 -> teng\n      GOTO   KATTA       ; qolgan holat -> katta"],
  ["h","Ko'p baytli arifmetika"],
  ["p","16 razryadli sonlarni qo'shish ikki bosqichda bajariladi: avval quyi baytlar qo'shiladi, so'ng C bayrog'i hisobga olingan holda yuqori baytlar. PIC da ADDWFC buyrug'i klassik PIC16 da yo'q, shuning uchun o'tkazma qo'lda qo'shiladi."],
  ["c","; 16 bitli qo'shish: (0x21:0x20) + (0x23:0x22) -> (0x21:0x20)\n      MOVF   0x22, 0\n      ADDWF  0x20, 1      ; quyi baytlar qo'shildi, C o'rnatilishi mumkin\n      BTFSC  STATUS, C\n      INCF   0x21, 1      ; o'tkazma bo'lsa yuqori baytga 1 qo'shiladi\n      MOVF   0x23, 0\n      ADDWF  0x21, 1      ; yuqori baytlar qo'shildi"],
  ["h","Inkrement va dekrement"],
  ["p","INCF va DECF buyruqlari faqat Z bayrog'ini yangilaydi, C ga tegmaydi. Shuning uchun 0xFF ni oshirganda natija 0x00 bo'ladi va C emas, Z bayrog'i o'rnatiladi. DECFSZ esa sikllarni tashkil qilishning asosiy vositasi: hisoblagich nolga yetganda sikldan chiqiladi."],
  ["c","; 200 martalik sikl\n      MOVLW  200\n      MOVWF  0x30\nSIKL: NOP\n      DECFSZ 0x30, 1     ; hisoblagich kamayadi, 0 bo'lsa keyingi tashlanadi\n      GOTO   SIKL\n      ; sikl tugadi"],
  ["h","BCD arifmetikasi"],
  ["p","O'nlik indikatorlar bilan ishlashda sonlar BCD ko'rinishida saqlanadi: har bir o'nlik raqam alohida tetradada. Oddiy ikkilik qo'shish BCD da noto'g'ri natija beradi, chunki tetrada 9 dan oshib ketishi mumkin. Tuzatish uchun natijaga 6 qo'shiladi va DC bayrog'i tekshiriladi. PIC16 da maxsus DAA buyrug'i yo'q, shuning uchun tuzatish dasturiy bajariladi."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Arifmetik buyruqlar C, DC va Z bayroqlarini shakllantiradi va bu bayroqlar keyingi shartli bajarilishning asosi bo'ladi. PIC da ayirish qo'shimcha kod orqali amalga oshgani uchun C teskari qarz sifatida talqin qilinadi. Ko'p baytli arifmetika C bayrog'ini bosqichlar orasida uzatish orqali tashkil qilinadi, BCD arifmetikasi esa qo'shimcha tuzatish talab qiladi."],
 ],
 tests:[
  {q:"Flag (bayroq) tushunchasiga to'g'ri ta'rif qaysi?",o:["Uzilish so'rovini hosil qiluvchi tashqi signal liniyasi","Amal natijasining o'zini to'liq saqlab turuvchi registr razryadi","Holat registridagi razryad, amal natijasining xususiyatini qayd etadi","Xotiradagi yacheykaning adresini ko'rsatuvchi maxsus kod"]},
  {q:"Protsessor shartli bajarilish haqidagi qarorni nimaga tayanib qabul qiladi?",o:["Takt generatorining joriy fazasiga tayanib qabul qiladi","Buyruq kodining operand maydoni qiymatiga tayanib qabul qiladi","Stek ko'rsatkichining qiymatiga tayanib qabul qiladi","Faqat flaglar registridagi bitlar holatiga tayanib qabul qiladi"]},
  {q:"C (Carry) bayrog'i qachon o'rnatiladi?",o:["Natijaning eng katta biti 1 bo'lganda o'rnatiladi","Natijaning barcha razryadlari nol bo'lganda o'rnatiladi","Quyi tetradadan yuqori tetradaga o'tkazma bo'lganda","Eng katta razryaddan o'tkazma chiqqanda o'rnatiladi"]},
  {q:"Z (Zero) bayrog'i qanday holatda birga teng bo'ladi?",o:["Natijadagi birlar soni juft bo'lganda birga teng bo'ladi","O'tkazma chiqmaganda birga teng bo'lib qoladi","Natijaning eng katta razryadi nol bo'lganda birga teng bo'ladi","Natijaning barcha razryadlari nol bo'lganda birga teng bo'ladi"]},
  {q:"N (Negative) yoki S (Sign) bayrog'i nimani ko'rsatadi?",o:["Uzilishlarga ruxsat berilganini ko'rsatib turadi","Eng katta razryaddan o'tkazma chiqqanini ko'rsatadi","Natijaning eng katta biti 1 bo'lganini — ishorani ko'rsatadi","Natijaning nolga teng bo'lganini ko'rsatib beradi"]},
  {q:"V (Overflow) bayrog'i qachon o'rnatiladi?",o:["Ishorasiz arifmetikada o'tkazma chiqqanda o'rnatiladi","Ishorali arifmetikada natija diapazondan chiqqanda","Natija barcha razryadlari nol bo'lganda o'rnatiladi","Watchdog taymerining vaqti tugaganda o'rnatiladi"]},
  {q:"DC (Digit Carry) bayrog'i qanday holatni qayd etadi?",o:["Natijadagi birlar sonining juftligini qayd etadi","Eng katta razryaddan tashqariga o'tkazma chiqqanini","SLEEP rejimiga o'tilganini qayd etib qo'yadi","Quyi tetradadan yuqori tetradaga o'tkazma bo'lganini"]},
  {q:"P (Parity) bayrog'i nimani ko'rsatadi?",o:["Natijadagi birlar sonining juftligini ko'rsatib beradi","Quyi tetradadan o'tkazma bo'lganini ko'rsatadi","Natijaning nolga tengligini ko'rsatib beradi","Natijaning ishorasini, ya'ni manfiyligini ko'rsatadi"]},
  {q:"I yoki GIE bayrog'i qaysi guruhga kiradi va nimani belgilaydi?",o:["Arifmetik guruhga kiradi, natija ishorasini ko'rsatadi","Arifmetik guruhga kiradi, o'tkazmani qayd etib beradi","Holat guruhiga kiradi, qayta yuklash sababini ko'rsatadi","Boshqaruv guruhiga kiradi, uzilishlarga ruxsatni belgilaydi"]},
  {q:"TO (Time-out) bayrog'i qanday holatda o'rnatiladi?",o:["Uzilishlarga ruxsat berilganda o'rnatiladi","Natija diapazondan chiqib ketganda o'rnatiladi","Watchdog taymerining vaqti tugaganda o'rnatiladi","SLEEP rejimiga o'tilganda o'rnatilib qo'yiladi"]},

  {q:"Holat flaglari qanday imkoniyat beradi?",o:["Uzilishlarga ruxsat berish yoki olishga imkon beradi","Amal natijasining ishorasini aniqlab berishga imkon beradi","Protsessor qanday sababdan qayta ishga tushganini aniqlashga","BCD arifmetikasida tuzatish kiritishga imkon beradi"]},
  {q:"Ko'chirish buyruqlari flaglarga qanday ta'sir qiladi?",o:["Barcha arifmetik flaglarni yangilab qo'yadi","Odatda flaglarga tegmaydi, ularni o'zgartirmaydi","Faqat Z bayrog'ini yangilab, qolganiga tegmaydi","Faqat C bayrog'ini yangilab, qolganini tozalaydi"]},

{
 id:"S1-A7", sem:1, week:7, type:"practice", no:7,
 title:"PIC mikrokontrollerli qurilmalar ishini tekshirish va sozlash",
 goal:"Mikrokontrollerli qurilmadagi nosozliklarni tizimli qidirish va dasturni otladka qilish usullarini o'zlashtirish.",
 outcomes:[],
 plan:["Nosozliklar tasnifi","Apparat qismini tekshirish tartibi","Dasturiy otladka usullari","Break point va qadamma-qadam bajarish","Tipik xatolar","Hisobot rasmiylashtirish"],
 equip:["PIC o'quv stendi yoki Proteus","Multimetr","Ossillograf yoki mantiqiy probnik","MPLAB X Simulator/Debugger","Darslikning tugma va LED simulyatori"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Mikrokontrollerli qurilma ishlamaganda muammo uch joyda bo'lishi mumkin: apparat qismida (montaj, quvvat, komponent), konfiguratsiyada (generator, WDT, LVP bitlari) yoki dasturda (algoritm xatosi). Tekshirish har doim oddiydan murakkabga — avval quvvat, so'ng signal, oxirida dastur mantiqi tartibida olib boriladi."],
  ["n","Xavfsizlik: o'lchashlarni faqat multimetr yoki ossillografning umumiy simi qurilma GND siga ulangan holda bajaring. Quvvat berilgan sxemada mikrosxema oyoqchalarini metall asboblar bilan qisqa tutashtirmang."],
  ["h","Apparat qismini tekshirish tartibi"],
  ["ol",["Quvvat kuchlanishini VDD va VSS oyoqchalarida o'lchang: 5 V ± 0,25 V bo'lishi kerak.","MCLR liniyasidagi kuchlanishni tekshiring: u 10 kΩ rezistor orqali +5 V ga tortilgan va yuqori darajada bo'lishi shart. MCLR past bo'lsa kristall doimiy reset holatida turadi.","Generator ishlayotganini ossillograf bilan OSC2 da tekshiring; kvarts ishlamasa sinusga yaqin tebranish ko'rinmaydi.","Port chiqishlarida daraja o'zgarishini kuzating: dastur ishlayotgan bo'lsa, LED liniyasida davriy o'zgarish bo'ladi.","Kondensatorlarni tekshiring: har bir quvvat oyoqchasiga 0,1 µF bloklovchi kondensator qo'yilgan bo'lishi kerak.","Ulanishlarni sxema bilan solishtiring va \"sovuq payvand\" ni lupa ostida tekshiring."]],
  ["t",["Belgi","Ehtimoliy sabab","Tekshirish"],[["Hech narsa ishlamaydi","Quvvat yo'q yoki MCLR pastda","VDD va MCLR da kuchlanishni o'lchash"],["Kristall qayta yuklanaveradi","Watchdog yoqilgan, tozalanmagan","_WDT_OFF bitini va asm CLRWDT ni tekshirish"],["Dastur juda sekin ishlaydi","Generator ichki RC ga tushib qolgan","FOSC konfiguratsiyasini tekshirish"],["PORTA dan hech narsa o'qilmaydi","Liniyalar analog rejimda","ADCON1 registrini sozlash"],["LED xira yonadi","Rezistor qiymati katta yoki quvvat pasaygan","Tokni o'lchash, R ni hisoblash"],["Tugma bir bosishga bir necha marta ishlaydi","Kontaktlar titrashi filtrlanmagan","Dasturiy kechikish qo'shish"]]],
  ["h","Dasturiy otladka usullari"],
  ["ul",["Qadamma-qadam bajarish (Step Into / Step Over) — har bir buyruqdan keyin registrlar holatini kuzatish","To'xtash nuqtalari (breakpoint) — dasturni kerakli joyda to'xtatib, o'zgaruvchilarni tekshirish","Watch oynasi — tanlangan o'zgaruvchi va registrlar qiymatini real vaqtda kuzatish","Stopwatch — ikki nuqta orasidagi sikllar sonini va vaqtni o'lchash","Diagnostik chiqish — bo'sh port razryadiga LED ulab, dastur qaysi tarmoqqa kirganini ko'rsatish","UART orqali nosozlik xabarlarini kompyuterga yuborish"]],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","/* Diagnostik belgilar bilan tekshirish (init_ports — oldingi ishdan) */\nvoid main()\n{\n    init_ports();\n    PORTB.F7 = 1;           // 1-belgi: sozlash tugadi\n\n    while (1)\n    {\n        if (PORTD.F0 == 0)\n        {\n            PORTB.F6 = 1;   // 2-belgi: shart bajarildi\n            PORTB |= 0x0F;\n        }\n        else\n        {\n            PORTB.F6 = 0;\n            PORTB &= 0xF0;\n        }\n        Delay_ms(50);\n    }\n}"],
  ["h","Interaktiv qism"],
  ["p","Tugma simulyatorida drebezg rejimini yoqib, filtrsiz hisoblagichning noto'g'ri ishlashini kuzating — bu amalda eng ko'p uchraydigan \"dastur to'g'ri, lekin qurilma noto'g'ri ishlaydi\" holati."],
  ["sim","btnled"],
  ["h","Topshiriqlar"],
  ["ol",["Stend yoki Proteusda ishlamayotgan sxema bering (o'qituvchi tomonidan xato kiritiladi) va nosozlikni tizimli tartibda toping.","VDD, MCLR va OSC2 nuqtalaridagi o'lchash natijalarini jadvalga yozing.","mikroC PRO for PIC Software Simulator da breakpoint qo'yib, tugma bosilgandagi PORTD qiymatini kuzating.","Stopwatch bilan asosiy sikl bajarilish vaqtini o'lchang va nazariy hisob bilan solishtiring.","Yuqoridagi jadvalga o'zingiz duch kelgan ikkita yangi nosozlik belgisini qo'shing.","Otladka oynasi yoki o'lchash natijalarining rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Nosozlikni qidirish tizimli tartibda — quvvat, reset, generator, portlar, dastur ketma-ketligida olib boriladi. Apparat tekshiruvi multimetr va ossillograf bilan, dasturiy tekshiruv esa breakpoint, qadamma-qadam bajarish va Watch oynasi yordamida bajariladi. Diagnostik chiqishlar dastur oqimini kuzatishning eng sodda va samarali usuli bo'lib qolmoqda."],
 ],
 tests:[
  {q:"Mikrokontrollerli qurilma ishlamaganda muammo qaysi uch joyda bo'lishi mumkin?",o:["Faqat quvvat manbaida va ulagichlarda bo'lishi mumkin","Faqat kompilyatorda va ishlab chiqish muhitida bo'ladi","Apparat qismida, konfiguratsiyada yoki dastur algoritmida","Faqat dasturda, chunki apparat qismi doim ishonchli bo'ladi"]},
  {q:"Nosozlikni tekshirish qanday tartibda olib boriladi?",o:["Tasodifiy tartibda, qaysi element qulay bo'lsa shundan","Oddiydan murakkabga: quvvat, signal, oxirida dastur mantiqi","Faqat dastur tomonidan, apparat tekshirilmaydi","Murakkabdan oddiyga: avval dastur mantiqi, oxirida quvvat"]},
  {q:"O'lchash ishlarida qanday xavfsizlik qoidasiga rioya qilinadi?",o:["Asbob faqat quvvat o'chirilgan holda ulanishi shart","Asbob umuman ulanmay, faqat masofadan kuzatilishi kerak","Asbobning umumiy simi ta'minot plyusiga ulanishi kerak","Asbobning umumiy simi qurilma GND siga ulangan bo'lishi kerak"]},
  {q:"Quvvat berilgan sxemada nima qilish mumkin emas?",o:["Ossillograf bilan signal shaklini kuzatish mumkin emas","Mikrosxema oyoqchalarini metall asbob bilan tutashtirish","Port chiqishidagi daraja o'zgarishini kuzatish mumkin emas","Multimetr bilan kuchlanishni o'lchab ko'rish mumkin emas"]},
  {q:"VDD va VSS oyoqchalarida qanday kuchlanish bo'lishi kerak?",o:["3,3 V ± 0,5 V oralig'ida bo'lishi kerak","0 V bo'lishi kerak, aks holda nosozlik bor","12 V ± 1 V oralig'ida bo'lishi kerak","5 V ± 0,25 V oralig'ida bo'lishi kerak"]},
  {q:"MCLR liniyasi qanday holatda bo'lishi shart?",o:["Bevosita umumiy simga ulangan, past darajada bo'lishi kerak","Hech qayerga ulanmay, ochiq holatda qoldirilishi kerak","10 kΩ rezistor orqali +5 V ga tortilgan, yuqori darajada","Takt generatori chiqishiga ulangan bo'lishi talab etiladi"]},
  {q:"MCLR liniyasi past darajada bo'lsa nima sodir bo'ladi?",o:["Dastur ikki barobar tez bajarila boshlaydi","Watchdog taymeri avtomatik o'chirilib qo'yiladi","Faqat portlar ishlamay qoladi, yadro ishlaydi","Kristall doimiy reset holatida turib qoladi"]},
  {q:"Generator ishlayotganini qanday tekshirish mumkin?",o:["MCLR liniyasidagi darajani tekshirish orqali","Dastur kodining hajmini o'lchab ko'rish orqali","Multimetr bilan VDD dagi kuchlanishni o'lchash orqali","Ossillograf bilan OSC2 da tebranishni kuzatish orqali"]},
  {q:"Dastur ishlayotganini port chiqishida qanday aniqlash mumkin?",o:["LED liniyasida davriy daraja o'zgarishi kuzatiladi","Port chiqishi yuqori qarshilikli holatga o'tadi","Port chiqishida doimiy o'zgarmas daraja turadi","Port chiqishida analog signal paydo bo'ladi"]},
  {q:"Har bir quvvat oyoqchasiga qanday kondensator qo'yilishi kerak?",o:["Kondensator umuman kerak emas, ulanish yetarli","0,1 µF bloklovchi kondensator qo'yilishi kerak","1000 µF elektrolitik kondensator qo'yilishi kerak","15–22 pF yuk kondensatori qo'yilishi kerak"]},
  {q:"\"Sovuq payvand\" qanday tekshiriladi?",o:["Watch oynasida o'zgaruvchilar qiymatini kuzatish orqali","Ossillograf bilan signal shaklini vaqt bo'yicha kuzatish orqali","Lupa ostida ko'zdan kechirib, ulanishlarni tekshirish orqali","Dastur kodini otladkada qadamma-qadam bajarib ko'rish orqali"]},
  {q:"\"Hech narsa ishlamaydi\" belgisining ehtimoliy sababi nima?",o:["Watchdog yoqilgan va dasturda tozalanmagan bo'ladi","Rezistor qiymati juda katta tanlangan bo'ladi","Quvvat yo'q yoki MCLR past darajada turgan bo'ladi","Generator ichki RC rejimiga tushib qolgan bo'ladi"]},
  {q:"Kristall doimiy qayta yuklanib turishining sababi nima?",o:["Kontaktlar titrashi filtrlanmagan bo'ladi","PORTA liniyalari analog rejimda qolgan bo'ladi","Watchdog yoqilgan va dasturda tozalanmayapti","Rezistor qiymati juda katta tanlangan bo'ladi"]},
  {q:"Dastur juda sekin ishlayotgan bo'lsa, nimani tekshirish kerak?",o:["Kontaktlar titrashini — dasturiy filtr qo'yilmagan bo'lishi mumkin","FOSC konfiguratsiyasini — generator ichki RC ga tushgan bo'lishi mumkin","ADCON1 registrini — portlar analog rejimda qolgan bo'lishi mumkin","Rezistor qiymatini — chiqish toki yetarli bo'lmasligi mumkin"]},

{
 id:"S1-M8", sem:1, week:8, type:"lecture", no:8,
 title:"Kiritish-chiqarish qurilmalari. Axborotni almashtirish. Axborotni almashtirish sikllari",
 goal:"Xotira va kiritish-chiqarish qurilmalari bilan axborot almashinuv sikllarining bosqichlarini va vaqt diagrammalarini o'zlashtirish.",
 outcomes:["O'qish va yozish siklining bosqichlarini ketma-ketlikda bayon qila oladi","Sikl vaqt diagrammasini o'qiy va chiza oladi","Kutish taktlari va tayyorlik signalining vazifasini tushuntira oladi","Dasturiy so'rov, uzilishli va DMA almashinuvlarini qiyoslay oladi"],
 plan:["Almashinuv sikli tushunchasi","O'qish sikli","Yozish sikli","Kutish taktlari","Almashinuv usullari","Uzilish va DMA sikllari"],
 body:[
  ["h","Kirish"],
  ["p","Mikroprotsessorli tizimda har qanday ma'lumot uzatish alohida shina sikli doirasida bajariladi. Shina sikli — protsessorning tashqi qurilma (xotira yoki kiritish-chiqarish porti) bilan bitta bayt yoki so'z almashishiga ketadigan, aniq belgilangan taktlar ketma-ketligi. Barcha sikllar qat'iy vaqt diagrammasiga bo'ysunadi, aks holda ma'lumot buzilgan holda o'qiladi."],
  ["h","O'qish sikli"],
  ["ol",["Protsessor adres shinasiga kerakli yacheyka adresini chiqaradi","Adres barqarorlashgach, tanlash signali (CS yoki CE) faollashadi","O'qish signali (RD yoki OE) faol holatga o'tadi","Tanlangan qurilma ma'lumot shinasiga baytni qo'yadi","Ma'lumot barqarorlashuvi uchun belgilangan vaqt kutiladi","Protsessor ma'lumotni ichki registriga qabul qiladi va RD signalini olib tashlaydi","Adres va tanlash signallari bekor qilinadi, sikl tugaydi"]],
  ["fig","timing","1-rasm. O'qish va yozish sikllarining vaqt diagrammalari"],
  ["h","Yozish sikli"],
  ["p","Yozish siklida bosqichlar shunga o'xshash, faqat ma'lumotni shinaga protsessor qo'yadi va WR signali faollashadi. Bu yerda ikki muhim parametr bor: ma'lumotni WR signalidan oldin barqarorlashtirish vaqti (setup time) va WR bekor qilingandan keyin ushlab turish vaqti (hold time). Bu talablar buzilsa, xotiraga noto'g'ri qiymat yoziladi."],
  ["f","T_sikl = n · T_takt","Sikl davomiyligi. PIC da xotira sikli mashina sikliga teng: T = 4/f_osc."],
  ["h","Kutish taktlari"],
  ["p","Agar tashqi qurilma protsessordan sekinroq ishlasa, u tayyorlik signali (READY, WAIT) orqali protsessorga kutishni bildiradi. Protsessor tayyorlik kelguncha kutish taktlarini (wait states) qo'shadi. Bu sekin xotirani tez protsessor bilan ishlatish imkonini beradi, ammo umumiy unumdorlikni pasaytiradi."],
  ["n","Bir kristalli mikrokontrollerlarda ichki xotira yadro bilan bir xil tezlikda ishlagani uchun kutish taktlari kerak emas. Ular asosan tashqi xotira yoki sekin periferiya ulanganda paydo bo'ladi."],
  ["h","Axborot almashinuv usullari"],
  ["t",["Usul","Mohiyati","Afzalligi","Kamchiligi"],[["Dasturiy so'rov (polling)","Protsessor qurilma holatini davriy tekshiradi","Sodda, qo'shimcha apparat kerak emas","Protsessor vaqti behuda sarflanadi"],["Uzilish bo'yicha","Qurilma tayyor bo'lganda protsessorga signal beradi","Protsessor asosiy ishni bajaradi","Uzilishlar tizimi va prioritet kerak"],["To'g'ridan-to'g'ri kirish (DMA)","Ma'lumot protsessorsiz, kontroller boshqaruvida uzatiladi","Eng yuqori tezlik","Qo'shimcha DMA kontroller talab qiladi"]]],
  ["p","Uzilish sikli alohida ajratiladi: joriy buyruq tugagach, protsessor PC ni va holat registrini stekka joylashtiradi, uzilishlarni taqiqlaydi va uzilish vektori adresiga o'tadi. Xizmat tugagach RETFIE (yoki RETI) buyrug'i saqlangan qiymatlarni tiklaydi va dastur uzilgan joydan davom etadi."],
  ["h","Sikl parametrlarini hisoblash"],
  ["p","Misol. PIC16F877A, f = 20 MHz. Mashina sikli 200 ns. Bitta bayt o'qish sikli 200 ns davom etadi, demak nazariy jihatdan sekundiga 5 million murojaat bajarish mumkin. Agar tashqi qurilma 2 ta kutish takti talab qilsa, sikl 400 ns ga cho'ziladi va tezlik ikki baravar kamayadi."],
  ["sim","timer"],
  ["h","Xulosa"],
  ["p","Axborot almashinuvi adres qo'yish, tanlash, o'qish yoki yozish signalini berish va ma'lumotni qabul qilish bosqichlaridan iborat aniq vaqtli sikl orqali bajariladi. Sekin qurilmalar bilan ishlashda kutish taktlari qo'shiladi. Almashinuv usulini tanlash — dasturiy so'rov, uzilish yoki DMA — tizimning real vaqt talablariga va protsessor yuklamasiga bog'liq."],
 ],
 tests:[
  {q:"Shina sikli tushunchasiga to'g'ri ta'rif qaysi?",o:["Dasturning asosiy siklidagi bitta takrorlanish davomiyligi","Protsessor ichidagi registrlar o'rtasidagi ko'chirish amali","Protsessorning tashqi qurilma bilan bir bayt almashish taktlari","Takt generatorining bitta davri uchun ketadigan vaqt birligi"]},
  {q:"Shina sikllarining qat'iy vaqt diagrammasiga bo'ysunishi nima uchun zarur?",o:["Aks holda ma'lumot buzilgan holda o'qiladi yoki yoziladi","Aks holda dastur hajmi haddan tashqari oshib ketadi","Aks holda takt generatori butunlay to'xtab qolishi mumkin","Aks holda uzilishlar tizimi ishdan chiqib qoladi"]},
  {q:"O'qish siklining birinchi bosqichi nimadan iborat?",o:["Protsessor adres shinasiga kerakli yacheyka adresini chiqaradi","Tanlangan qurilma ma'lumot shinasiga baytni qo'yadi","O'qish signali (RD) darhol faol holatga o'tkaziladi","Protsessor ma'lumotni ichki registriga qabul qilib oladi"]},
  {q:"O'qish siklida tanlash signali (CS yoki CE) qachon faollashadi?",o:["Adres barqarorlashgandan keyin faollashadi","Adresdan oldin, sikl boshida faollashadi","Sikl tugashiga bir takt qolganda faollashadi","Ma'lumot shinaga qo'yilgandan keyin faollashadi"]},
  {q:"O'qish siklida RD (yoki OE) signali faollashgandan keyin nima bo'ladi?",o:["Adres shinasidagi qiymat darhol bekor qilinadi","Tanlangan qurilma ma'lumot shinasiga baytni qo'yadi","Sikl tugatilib, keyingi buyruq o'qishga o'tiladi","Protsessor yozish signalini ham faollashtirib qo'yadi"]},
  {q:"O'qish siklida ma'lumot barqarorlashuvi uchun nima qilinadi?",o:["Tanlash signali vaqtincha bekor qilinib turiladi","Takt chastotasi vaqtincha ikki barobar oshiriladi","Adres shinasi qiymati bir razryad siljitib qo'yiladi","Belgilangan vaqt kutiladi, so'ng ma'lumot qabul qilinadi"]},
  {q:"O'qish sikli qanday tugaydi?",o:["Kutish taktlari qo'shilib, sikl cho'ziladi","Adres va tanlash signallari bekor qilinadi","Yozish signali faollashtirilib, ma'lumot yoziladi","Uzilish so'rovi hosil qilinib, vektorga o'tiladi"]},
  {q:"Yozish sikli o'qish siklidan nimasi bilan farq qiladi?",o:["Tanlash signali umuman ishlatilmaydi, kerak bo'lmaydi","Sikl taktlarsiz, bir lahzada bajarilib tugaydi","Ma'lumotni shinaga protsessor qo'yadi va WR signali faollashadi","Adres shinasiga qiymat chiqarilmaydi, faqat ma'lumot uzatiladi"]},
  {q:"Yozish siklida setup time nimani belgilaydi?",o:["Kutish taktlarining umumiy sonini belgilab beradi","Ma'lumotni WR signalidan oldin barqarorlashtirish vaqtini","Adres shinasidagi qiymatning saqlanish muddatini","WR bekor qilingandan keyin ushlab turish vaqtini"]},
  {q:"Yozish siklida hold time nimani belgilaydi?",o:["Ma'lumotni WR dan oldin barqarorlashtirish vaqtini","WR bekor qilingandan keyin ma'lumotni ushlab turish vaqtini","Adresni tanlash signalidan oldin qo'yish vaqtini","Tayyorlik signalini kutish uchun ketadigan vaqtni"]},
  {q:"Setup va hold vaqt talablari buzilsa nima sodir bo'ladi?",o:["Sikl avtomatik ravishda qaytadan boshlanadi","Uzilish so'rovi hosil bo'lib, dastur to'xtaydi","Takt generatori to'xtab, kristall reset bo'ladi","Xotiraga noto'g'ri qiymat yozilib qoladi"]},
  {q:"Sikl davomiyligi qanday formula bilan ifodalanadi?",o:["T_sikl = n² · T_takt ko'rinishida ifodalanadi","T_sikl = n · T_takt ko'rinishida ifodalanadi","T_sikl = n + T_takt ko'rinishida ifodalanadi","T_sikl = T_takt / n ko'rinishida ifodalanadi"]},
  {q:"PIC da xotira sikli qanday qiymatga teng?",o:["Ikki takt davriga teng, ya'ni T = 2/f_osc bo'ladi","Mashina sikliga teng, ya'ni T = 4/f_osc bo'ladi","Takt davriga teng, ya'ni T = 1/f_osc bo'ladi","O'n ikki takt davriga teng, ya'ni T = 12/f_osc"]},
  {q:"Tashqi qurilma protsessordan sekinroq ishlasa nima qiladi?",o:["Uzilish so'rovini hosil qilib, dasturni to'xtatadi","Tayyorlik signali (READY, WAIT) orqali kutishni bildiradi","Adres shinasiga o'z adresini majburan chiqaradi","Takt generatorining chastotasini pasaytirib qo'yadi"]},
  {q:"Kutish taktlari (wait states) nima beradi va nimaga olib keladi?",o:["Xotira hajmini kengaytiradi, lekin tezlikka tegmaydi","Sekin xotirani tez protsessor bilan ishlatadi, unumdorlik pasayadi","Quvvat sarfini kamaytiradi va issiqlikni pasaytiradi","Protsessor tezligini oshiradi va unumdorlikni ko'taradi"]},
  {q:"Bir kristalli mikrokontrollerlarda kutish taktlari kerakmi?",o:["Kerak — konfiguratsiya bitlari bilan majburan yoqiladi","Kerak — har bir xotira murojaatida ikki takt qo'shiladi","Kerak emas — ichki xotira yadro bilan bir xil tezlikda ishlaydi","Kerak — ichki Flash har doim yadrodan sekinroq ishlaydi"]},
  {q:"Dasturiy so'rov (polling) usulining mohiyati nima?",o:["Qurilma tayyor bo'lganda protsessorga signal beradi","Protsessor qurilma holatini davriy ravishda tekshirib turadi","Ma'lumot bir vaqtda barcha qurilmalarga tarqatiladi","Ma'lumot protsessorsiz, kontroller boshqaruvida uzatiladi"]},

  {q:"Dasturiy so'rov usulining asosiy kamchiligi nima?",o:["Ma'lumot har doim buzilib yetib boradi","Qo'shimcha DMA kontroller talab qiladi","Protsessor vaqti behuda sarflanib ketadi","Uzilishlar tizimi va prioritet talab qilinadi"]},
