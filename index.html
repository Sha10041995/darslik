<!DOCTYPE html>
<html lang="uz" data-theme="tech">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikroprotsessor texnikasi — elektron darslik</title>
<style>
/* ============ TOKENS ============ */
:root{
  --f-ui: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans", Arial, sans-serif;
  --f-read: Georgia, "Times New Roman", "Noto Serif", serif;
  --f-mono: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  --r: 3px; --r2: 8px;
  --w: 1080px;
  --t: .16s ease;
}
html[data-theme="tech"]{
  --bg:#EDEFEA; --surface:#FFFFFF; --surface2:#F5F7F2; --ink:#121A16; --muted:#5C6B62;
  --line:#D2D9CF; --accent:#0B6E5F; --accent2:#F2B705; --on-accent:#FFFFFF;
  --ok:#1F7A46; --warn:#9A6A00; --bad:#A32B1E; --rail:#E3E7DE;
}
html[data-theme="light"]{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface2:#F0F0EE; --ink:#16181A; --muted:#5F6670;
  --line:#DCDEE0; --accent:#20507F; --accent2:#C9860B; --on-accent:#FFFFFF;
  --ok:#1F7A46; --warn:#8A6100; --bad:#9E2B20; --rail:#E8E9E7;
}
html[data-theme="dark"]{
  --bg:#0E1316; --surface:#151D22; --surface2:#1C262C; --ink:#E7EEEC; --muted:#93A5A0;
  --line:#2A3740; --accent:#2EC4B6; --accent2:#F2B705; --on-accent:#08201E;
  --ok:#3FBF77; --warn:#E0A72E; --bad:#E4695B; --rail:#1A242A;
}
html[data-theme="blue"]{
  --bg:#EDF2F9; --surface:#FFFFFF; --surface2:#E4ECF7; --ink:#101B2B; --muted:#516480;
  --line:#CBD8EA; --accent:#1B4E9B; --accent2:#E08A00; --on-accent:#FFFFFF;
  --ok:#1C7A55; --warn:#8A6100; --bad:#A22C24; --rail:#DFE8F5;
}
html[data-theme="green"]{
  --bg:#EFF4EC; --surface:#FFFFFF; --surface2:#E6EEE1; --ink:#121D14; --muted:#53674F;
  --line:#CDDAC6; --accent:#2F6B2A; --accent2:#B8760C; --on-accent:#FFFFFF;
  --ok:#2F6B2A; --warn:#8A6100; --bad:#9E2B20; --rail:#E3EBDE;
}
html[data-theme="purple"]{
  --bg:#F2EFF7; --surface:#FFFFFF; --surface2:#EAE4F3; --ink:#1B1426; --muted:#63587A;
  --line:#D9D0E8; --accent:#5B3A9B; --accent2:#C77A00; --on-accent:#FFFFFF;
  --ok:#2F7A54; --warn:#8A6100; --bad:#A22C4A; --rail:#E8E2F1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-ui);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  min-height:100vh;
}
body.hasbg::before{
  content:""; position:fixed; inset:0; z-index:-2;
  background-image:var(--bgimg); background-size:cover; background-position:center;
}
body.hasbg::after{
  content:""; position:fixed; inset:0; z-index:-1; background:var(--bg); opacity:.82;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent2); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

/* ============ SHELL ============ */
.top{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); display:flex; align-items:center;
  gap:14px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
}
.brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-.2px}
.brand svg{display:block}
.brand b{font-size:15px}
.brand span{display:block; font-size:11px; color:var(--muted); font-weight:400}
.topnav{margin-left:auto; display:flex; align-items:center; gap:6px}
.topnav .who{font-size:13px; color:var(--muted); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--surface2)}
.wrap{max-width:var(--w); margin:0 auto; padding:20px 16px 90px}

/* nav rail (desktop) */
.layout{display:grid; grid-template-columns:232px 1fr; gap:24px; max-width:var(--w); margin:0 auto; padding:20px 16px 90px}
.rail{position:sticky; top:66px; align-self:start; background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:8px}
.rail a{display:flex; gap:9px; align-items:center; padding:8px 10px; border-radius:var(--r); color:var(--ink); text-decoration:none; font-size:14px}
.rail a:hover{background:var(--surface2)}
.rail a.on{background:var(--accent); color:var(--on-accent)}
.rail hr{border:0; border-top:1px solid var(--line); margin:8px 4px}
.rail .cap{font-size:11px; color:var(--muted); padding:6px 10px 2px; letter-spacing:.02em}

/* mobile nav */
.mnav{display:none; position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--surface);
  border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(5,1fr)}
.mnav button{background:none; border:0; color:var(--muted); font-size:10.5px; display:flex;
  flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-family:inherit; cursor:pointer}
.mnav button.on{color:var(--accent)}
.mnav svg{width:20px;height:20px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr; padding-bottom:86px}
  .rail{display:none}
  .mnav{display:grid}
  .wrap{padding-bottom:86px}
}

/* ============ PRIMITIVES ============ */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:18px}
.card + .card{margin-top:14px}
.btn{font-family:inherit; font-size:14px; padding:9px 15px; border-radius:var(--r);
  border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); cursor:pointer;
  transition:filter var(--t)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:6px 11px; font-size:13px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.danger{background:var(--bad); border-color:var(--bad); color:#fff}
label.fld{display:block; margin:0 0 12px}
label.fld > span{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
input,select,textarea{font-family:inherit; font-size:15px; width:100%; padding:9px 11px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface); color:var(--ink)}
textarea{min-height:90px; resize:vertical}
input[type=file]{padding:7px; font-size:13px}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row > *{flex:1 1 200px}
.msg{padding:10px 12px; border-radius:var(--r); font-size:14px; margin:0 0 12px}
.msg.err{background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); border:1px solid color-mix(in srgb, var(--bad) 35%, transparent)}
.msg.ok{background:color-mix(in srgb, var(--ok) 12%, transparent); color:var(--ok); border:1px solid color-mix(in srgb, var(--ok) 35%, transparent)}
h1{font-size:26px; line-height:1.2; margin:0 0 6px; letter-spacing:-.4px}
h2{font-size:20px; margin:26px 0 8px; letter-spacing:-.2px}
h3{font-size:16px; margin:20px 0 6px}
.sub{color:var(--muted); font-size:14px; margin:0 0 18px}
.tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); background:var(--surface2)}
.tag.lec{border-color:var(--accent); color:var(--accent)}
.tag.pra{border-color:var(--accent2); color:var(--warn)}
.tag.lab{border-color:var(--ok); color:var(--ok)}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top}
th{background:var(--surface2); font-weight:600}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
code{font-family:var(--f-mono); font-size:13.5px; background:var(--surface2); padding:1px 4px; border-radius:3px}
pre{font-family:var(--f-mono); font-size:13px; background:var(--surface2); border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:var(--r); padding:12px; overflow-x:auto; line-height:1.45}
pre code{background:none; padding:0}
.bar{height:6px; background:var(--rail); border-radius:20px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:14px}
.stat b{display:block; font-size:28px; font-family:var(--f-mono); letter-spacing:-1px; line-height:1.1}
.stat span{font-size:12.5px; color:var(--muted)}
.empty{text-align:center; padding:34px 16px; color:var(--muted); font-size:14px}
.badge{font-family:var(--f-mono); font-size:11px; padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); background:var(--surface2); white-space:nowrap}
.badge.ok{border-color:var(--ok); color:var(--ok)}
.badge.warn{border-color:var(--accent2); color:var(--warn)}

/* ============ HERO (bosh sahifa) ============ */
.hero{position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r2); padding:28px 24px; overflow:hidden}
.hero .chip{display:inline-block; font-family:var(--f-mono); font-size:11.5px; color:var(--accent);
  border:1px solid var(--accent); border-radius:2px; padding:2px 6px}
.hero h1{font-size:clamp(27px,5.4vw,42px); margin:12px 0 10px; max-width:16ch}
.hero p{max-width:60ch; color:var(--muted); font-size:15.5px; margin:0 0 20px}
.hero .cta{display:flex; gap:10px; flex-wrap:wrap}
.chipline{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px; padding-top:18px; border-top:1px dashed var(--line)}
.chipline span{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.board{position:absolute; right:-40px; top:-10px; width:300px; opacity:.16; pointer-events:none}
@media (max-width:760px){.board{display:none}}

/* ============ HAFTA / DARS RO'YXATI ============ */
.weeks{display:flex; flex-direction:column; gap:10px}
.week{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); overflow:hidden}
.week > button{width:100%; display:flex; align-items:center; gap:12px; padding:13px 15px; background:none;
  border:0; font-family:inherit; font-size:15px; color:var(--ink); cursor:pointer; text-align:left}
.week > button:hover{background:var(--surface2)}
.wnum{font-family:var(--f-mono); font-size:12px; color:var(--on-accent); background:var(--accent);
  width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:none}
.week .ttl{flex:1; min-width:0}
.week .ttl b{display:block; font-weight:600; font-size:15px}
.week .ttl em{font-style:normal; font-size:12.5px; color:var(--muted)}
.week .pct{font-family:var(--f-mono); font-size:13px; color:var(--muted); flex:none}
.wbody{border-top:1px solid var(--line); padding:6px}
.lrow{display:flex; align-items:center; gap:10px; width:100%; padding:10px 11px; background:none; border:0;
  border-radius:var(--r); font-family:inherit; font-size:14.5px; color:var(--ink); cursor:pointer; text-align:left}
.lrow:hover{background:var(--surface2)}
.lrow .nm{flex:1; min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rail); flex:none}
.dot.part{background:var(--accent2)}
.dot.done{background:var(--ok)}
.lrow.yopiq{opacity:.55}
.lrow.yopiq .nm{text-decoration:line-through}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:8px}
.gal img{width:100%;height:110px;object-fit:cover;border-radius:var(--r);cursor:pointer;background:var(--surface2)}
.gal figcaption{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35}
.ruxsat{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px}
.ruxsat:last-child{border-bottom:0}
.ruxsat input{width:auto}
.ruxsat .nm{flex:1;min-width:0}

/* ============ DARS MATNI ============ */
.lesson{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:22px}
.lhead{border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px}
.lhead .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.lhead h1{font-size:clamp(21px,3.6vw,29px)}
.read{font-family:var(--f-read); font-size:17px; line-height:1.68; max-width:72ch}
.read p{margin:0 0 14px}
.read h2{font-family:var(--f-ui); font-size:19px; border-left:3px solid var(--accent); padding-left:10px}
.read h3{font-family:var(--f-ui)}
.read ul,.read ol{margin:0 0 14px; padding-left:22px}
.read li{margin-bottom:6px}
.read table{font-family:var(--f-ui); font-size:14px}
.formula{font-family:var(--f-mono); font-size:15.5px; background:var(--surface2); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 14px; text-align:center; margin:0 0 6px}
.fcap{font-size:13px; color:var(--muted); text-align:center; margin:0 0 16px; font-family:var(--f-ui)}
.note{font-family:var(--f-ui); font-size:14.5px; background:color-mix(in srgb, var(--accent2) 14%, transparent);
  border-left:3px solid var(--accent2); padding:11px 13px; border-radius:var(--r); margin:0 0 16px}
.fig{margin:0 0 18px; text-align:center}
.fig svg{max-width:100%; height:auto; background:var(--surface2); border:1px solid var(--line); border-radius:var(--r); padding:8px}
.fig figcaption{font-family:var(--f-ui); font-size:13px; color:var(--muted); margin-top:6px}
.pager{display:flex; gap:10px; justify-content:space-between; margin-top:20px}

/* ============ SIMULYATOR ============ */
.sim{background:var(--surface2); border:1px solid var(--line); border-radius:var(--r2); padding:14px; margin:0 0 18px; font-family:var(--f-ui)}
.sim h4{margin:0 0 4px; font-size:15px}
.sim .hint{font-size:13px; color:var(--muted); margin:0 0 12px}
.sim .ctrls{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px}
.sim .ctrls label{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px}
.sim input[type=range]{width:150px; padding:0}
.readout{font-family:var(--f-mono); font-size:13px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:8px 10px; margin-top:10px; white-space:pre-wrap; word-break:break-word}
.pinrow{display:flex; gap:6px; flex-wrap:wrap}
.pin{width:40px; height:40px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface);
  font-family:var(--f-mono); font-size:12px; cursor:pointer; color:var(--ink)}
.pin.hi{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}

/* ============ TEST ============ */
.q{border:1px solid var(--line); border-radius:var(--r2); padding:14px; margin-bottom:10px; background:var(--surface)}
.q h4{margin:0 0 10px; font-size:15.5px; font-weight:600}
.opt{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line);
  border-radius:var(--r); margin-bottom:6px; cursor:pointer; font-size:14.5px}
.opt:hover{background:var(--surface2)}
.opt input{width:auto; margin:3px 0 0; flex:none}
.opt.right{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 11%, transparent)}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 11%, transparent)}
.exp{font-size:13.5px; color:var(--muted); border-left:2px solid var(--accent); padding-left:9px; margin-top:8px}
.score{font-family:var(--f-mono); font-size:34px; letter-spacing:-1px}

/* ---------- test: savollar birma-bir ---------- */
.msg.bad{background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); border:1px solid color-mix(in srgb, var(--bad) 35%, transparent)}
.msg.warn{background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 38%, transparent)}
.tag.bad{border-color:var(--bad); color:var(--bad)}
.rules{margin:0 0 14px; padding-left:20px; font-size:14px; line-height:1.7; color:var(--text)}
.rules li{margin-bottom:5px}
.tbar{margin-bottom:12px}
.tprog{height:6px; border-radius:20px; background:var(--surface2); border:1px solid var(--line); overflow:hidden}
.tprog span{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s}
.tmeta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:7px}
.qcard .qtext{font-size:17px; line-height:1.5; margin:0 0 14px}
.qcard .opt{padding:11px 13px; font-size:15px; cursor:pointer}
.qcard .opt input{pointer-events:none}
.opt.tanlangan{border-color:var(--accent)}
.opt.bekor{opacity:.5; border-style:dashed}

/* ============ ADMIN ============ */
.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px; border-bottom:1px solid var(--line)}
.tabs button{background:none; border:0; border-bottom:2px solid transparent; padding:9px 12px;
  font-family:inherit; font-size:14px; color:var(--muted); cursor:pointer}
.tabs button.on{color:var(--ink); border-bottom-color:var(--accent)}
.chart{width:100%; height:190px}
.chart .gl{stroke:var(--line); stroke-width:1}
.chart text{font-size:10px; fill:var(--muted); font-family:var(--f-mono)}
.thumb{width:74px; height:52px; object-fit:cover; border-radius:var(--r); border:1px solid var(--line); cursor:pointer}
.swatches{display:flex; gap:8px; flex-wrap:wrap}
.sw{width:74px; border:1px solid var(--line); border-radius:var(--r2); padding:8px; cursor:pointer; background:var(--surface); font-size:12px; text-align:center; color:var(--ink); font-family:inherit}
.sw.on{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent)}
.sw i{display:block; height:26px; border-radius:var(--r); margin-bottom:5px; border:1px solid rgba(0,0,0,.12)}

/* ============ MODAL ============ */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55); display:grid; place-items:center; padding:16px}
.modal .box{background:var(--surface); border-radius:var(--r2); padding:18px; max-width:560px; width:100%; max-height:88vh; overflow:auto}
.modal img{max-width:100%; border-radius:var(--r)}
.hide{display:none!important}
@media print{.top,.rail,.mnav,.pager,.btn{display:none!important} .lesson{border:0}}

.seg.seglock{display:none}
.chk{margin:18px 0;padding:16px;border:1px solid var(--accent);border-radius:var(--r2);background:var(--surface2);font-family:var(--f-ui)}
.chk.done{border-color:var(--line);padding:8px 14px;color:var(--ink2,inherit)}
.chkh{font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:6px}
.chkq{font-weight:600;margin:0 0 10px}
.chk .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.chk .opt.ok{border-color:#2e9d5b;background:rgba(46,157,91,.12)}
.chk .opt.bad{border-color:#c0392b;opacity:.6}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="6" y="6" width="14" height="14" rx="2" fill="var(--accent)"/>
      <rect x="9.5" y="9.5" width="7" height="7" rx="1" fill="var(--on-accent)" opacity=".85"/>
      <g stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round">
        <path d="M9 6V2M13 6V2M17 6V2M9 24v-4M13 24v-4M17 24v-4M6 9H2M6 13H2M6 17H2M24 9h-4M24 13h-4M24 17h-4"/>
      </g>
    </svg>
    <div><b>Mikroprotsessor texnikasi</b><span>TDTU · elektron darslik</span></div>
  </div>
  <nav class="topnav" id="topnav"></nav>
</header>

<main id="app"></main>

<nav class="mnav" id="mnav"></nav>
<div id="modal"></div>
<script>
/* =====================================================================
   MIKROPROTSESSOR TEXNIKASI — elektron darslik (bitta fayl)
   Muallif: Abdukarimov Sherali Nurali o'g'li
   ===================================================================== */
"use strict";

/* ---------- kichik yordamchilar ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------- SHA-256 (toza JS — file:// da ham ishlaydi) ---------- */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const K = [], H = [];
  let p = 2, n = 0;
  const isP = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  for (p = 2; n < 64; p++) { if (!isP(p)) continue; if (n < 8) H[n] = (Math.pow(p, .5) % 1 * 4294967296) | 0; K[n] = (Math.pow(p, 1 / 3) % 1 * 4294967296) | 0; n++; }
  const h = H.slice(0, 8);
  const bytes = [];
  const utf = unescape(encodeURIComponent(ascii));
  for (let i = 0; i < utf.length; i++) bytes.push(utf.charCodeAt(i) & 255);
  const bl = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push((i < 4 ? (bl / Math.pow(2, i * 8)) : 0) & 255);
  const w = new Array(64);
  for (let i = 0; i < bytes.length; i += 64) {
    for (let j = 0; j < 16; j++) w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
    for (let j = 16; j < 64; j++) {
      const s0 = rr(w[j - 15], 7) ^ rr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
      const s1 = rr(w[j - 2], 17) ^ rr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let j = 0; j < 64; j++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[j] + w[j]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

/* ---------- saqlash: IndexedDB, imkoni bo'lmasa localStorage ---------- */
const Store = {
  KEY: "mpt.state.v1", mode: "local", db: null,
  init() {
    return new Promise(res => {
      let done = false;
      const fin = m => { if (done) return; done = true; Store.mode = m; res(m); };
      try {
        if (!window.indexedDB) return fin("local");
        const rq = indexedDB.open("mpt_db", 1);
        rq.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv"); };
        rq.onsuccess = e => { Store.db = e.target.result; fin("idb"); };
        rq.onerror = () => fin("local");
        setTimeout(() => fin("local"), 1500);
      } catch (e) { fin("local"); }
    });
  },
  get() {
    return new Promise(res => {
      if (Store.mode === "idb" && Store.db) {
        try {
          const tx = Store.db.transaction("kv", "readonly").objectStore("kv").get(Store.KEY);
          tx.onsuccess = () => res(tx.result ? JSON.parse(tx.result) : null);
          tx.onerror = () => res(localGet());
          return;
        } catch (e) { }
      }
      res(localGet());
    });
    function localGet() { try { const v = localStorage.getItem(Store.KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  },
  set(obj) {
    const s = JSON.stringify(obj);
    try { localStorage.setItem(Store.KEY, s); } catch (e) { }
    if (Store.mode === "idb" && Store.db) { try { Store.db.transaction("kv", "readwrite").objectStore("kv").put(s, Store.KEY); } catch (e) { } }
  }
};

/* ---------- rasmni siqib dataURL qilish ---------- */
function fileToImg(file, maxW, q) {
  return new Promise((res, rej) => {
    if (!file) return rej("Fayl tanlanmadi");
    if (!/^image\//.test(file.type)) return rej("Faqat rasm fayli yuklanadi");
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width);
        const c = el("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q || .72));
      };
      img.onerror = () => rej("Rasmni o'qib bo'lmadi");
      img.src = fr.result;
    };
    fr.onerror = () => rej("Faylni o'qib bo'lmadi");
    fr.readAsDataURL(file);
  });
}

 tests:[
  {q:"Mikroprotsessor texnikasi fanining asosiy maqsadi nimadan iborat?",o:["Analog kuchaytirgich sxemalarini loyihalashni o'rgatish","Elektr mashinalari va kuch elektronikasi asoslarini o'rganish","MP va MK tuzilishi, dasturlash va loyihalash ko'nikmasini berish","Faqat yuqori darajali dasturlash tillarini chuqur o'zlashtirish"]},
  {q:"Fan dasturining birinchi semestrida asosan nima o'rganiladi?",o:["Mikroprotsessorlarning tuzilishi va buyruqlar tizimi","Analog signallarni filtrlash va kuchaytirish usullari","Mikrokontroller interfeyslari va dasturiy ta'minoti","Shaxsiy kompyuter tarmoqlari va ma'lumotlar bazasi"]},
  {q:"Mikroprotsessor (MP) ga berilgan ta'rifni tanlang.",o:["Yadro, xotira va periferiya birlashtirilgan tugallangan tizim","Dastur bo'yicha amal bajaruvchi va tizimni boshqaruvchi kristall","Ma'lumotni uzoq muddat saqlash uchun mo'ljallangan qurilma","Analog kattalikni raqamli kodga aylantiruvchi o'zgartirgich"]},
  {q:"Mikrokontroller mikroprotsessordan nimasi bilan farq qiladi?",o:["Takt generatorisiz, ya'ni tashqi signalsiz ham ishlay oladi","Yadro, xotira va periferiya bitta kristallda birlashtirilgan","Faqat butun sonlar bilan ishlaydi, kasr sonlarni qo'llamaydi","Dasturni emas, faqat qattiq mantiq sxemasini bajara oladi"]},
  {q:"Mikroprotsessorli tizim tarkibiga nimalar kiradi?",o:["Faqat protsessor yadrosi va uning ichki registrlari","Faqat operativ xotira va doimiy xotira mikrosxemalari","Datchiklar, kuchaytirgichlar va ijrochi mexanizmlar to'plami","MP yoki MK, xotira, kiritish-chiqarish qurilmalari, shinalar"]},
  {q:"Qattiq mantiqli qurilmada vazifani o'zgartirish uchun nima qilish kerak?",o:["Takt chastotasini kerakli qiymatga sozlab qo'yish yetarli","Xotiradagi dasturning bir necha qatorini tahrirlash kifoya","Faqat ta'minot kuchlanishining qiymatini o'zgartirish yetarli","Sxemani qayta yig'ish yoki elementlarni almashtirish talab etiladi"]},
  {q:"Dasturiy boshqariladigan qurilmaning asosiy afzalligi nimada?",o:["Tashqi element va korpussiz ishlay olishi imkoniyatida","Quvvat iste'moli butunlay nolga teng bo'lib qolishida","Funksiyani sxemaga tegmasdan, dastur bilan almashtirishda","Ishlash tezligi doim qattiq mantiqdan yuqori bo'lishida"]},
  {q:"Sanoat avtomatikasi sohasida tipik yechim sifatida nima qo'llanadi?",o:["Wi-Fi moduli asosidagi maishiy texnika boshqaruvchisi","Dasturlanadigan kontroller yoki mikrokontrollerli modul","Ko'p yadroli protsessor va kesh ierarxiyasi bilan server","Puls oksimetr va elektrokardiogramma registratorlari"]},
  {q:"O'lchash texnikasida mikrokontroller qanday tarkibda qo'llanadi?",o:["Faqat indikator va klaviatura boshqaruvchisi sifatida","Ko'p yadroli protsessor va katta kesh bilan birgalikda","Bir necha MK li CAN tarmog'i ko'rinishida tashkil etiladi","MK, ADC va indikatordan iborat o'lchash kanali tarzida"]},
  {q:"Transport vositalarida mikrokontrollerlar qanday tashkil etiladi?",o:["Bitta kuchli protsessor barcha tizimlarni boshqaradi","Har bir tugun alohida, aloqasiz holda mustaqil ishlaydi","Bir necha MK CAN tarmog'iga birlashtirilib ishlatiladi","Faqat analog sxemalar yordamida boshqarish amalga oshadi"]},
  {q:"\"Xotira devori\" (memory wall) iborasi nimani anglatadi?",o:["Xotira mikrosxemasining fizik o'lchami cheklanganligini","Protsessor va xotira tezligi o'rtasidagi katta farqni","Adres shinasi razryadlari soni cheklanganligi oqibatini","Xotiraga ruxsatsiz murojaatdan himoyalash mexanizmini"]},
  {q:"Protsessor bitta amalni bajarish vaqti bilan operativ xotiradan ma'lumot olish vaqti qanday nisbatda?",o:["Amal bir necha nanosekund, xotiradan o'qish o'nlab nanosekund","Ikkisi ham bir xil, taxminan bir necha nanosekundni tashkil etadi","Xotiradan o'qish vaqti amal vaqtidan ming barobar kichikdir","Amal o'nlab nanosekund, xotiradan o'qish bir necha nanosekund"]},
  {q:"Xotira devori muammosining asosiy yechimi nima?",o:["Operativ xotira hajmini bir necha barobar oshirib yuborish","Protsessor takt chastotasini sun'iy ravishda pasaytirish","Dasturni to'liq doimiy xotirada saqlash va shundan bajarish","Protsessor va xotira orasiga tez oraliq xotira qo'yish"]},
  {q:"Kesh-xotira qanday vazifani bajaradi?",o:["Analog signalni raqamli kodga aylantirib yadroga uzatadi","Ma'lumotni elektr uzilganda ham uzoq muddat saqlab qoladi","Protsessor va operativ xotira tezligidagi farqni qoplaydi","Dasturni ruxsatsiz nusxalashdan va o'zgartirishdan himoyalaydi"]},
  {q:"Kesh-xotiraning samarali ishlashi nimaga asoslanadi?",o:["Buyruqlar sonining imkon qadar kamaytirilishiga asoslanadi","Dasturlarning lokallik xossasiga, ya'ni murojaatlar tartibiga","Xotira mikrosxemalarining juda katta hajmga ega bo'lishiga","Protsessor takt chastotasining doimiy ravishda o'sishiga"]},
  {q:"Vaqt bo'yicha lokallik nimani bildiradi?",o:["Qo'shni yacheykalarga ham tez orada murojaat qilinishini","Yaqinda ishlatilgan ma'lumot yana kerak bo'lishi ehtimolini","Dastur bajarilish vaqti oldindan aniq hisoblanishi mumkinligini","Xotiraga murojaat vaqti takt davriga teng bo'lib qolishini"]},
  {q:"Fazo bo'yicha lokallikning tipik misoli qaysi?",o:["Uzilish bo'yicha tasodifiy adreslarga o'tib ishlash tartibi","Sikl ichidagi bitta o'zgaruvchiga takror murojaat qilish","Registrlar o'rtasida ma'lumotni almashtirib turish amali","Massiv elementlarini va buyruqlarni ketma-ket o'qib borish"]},
  {q:"Fazo bo'yicha lokallik tufayli keshga nima ko'chiriladi?",o:["Xotiraning faqat birinchi sahifasi doimiy ravishda saqlanadi","Faqat so'ralgan bitta bayt, ortiqcha ma'lumotsiz ko'chiriladi","Butun blok — kesh qatori, odatda 32–64 bayt hajmda ko'chiriladi","Dasturning barcha bo'limlari bir yo'la to'liq ko'chiriladi"]},
  {q:"Kesh qatori (cache line) ning tipik hajmi qancha?",o:["1 megabaytdan katta, L3 keshning hajmiga mos keladi","4–8 kilobayt, sahifalash birligi bilan bir xil bo'ladi","32–64 bayt oralig'ida bo'ladi, bu eng ko'p uchraydigan qiymat","1–2 bayt, ya'ni bitta so'z hajmidan oshmaydi"]},
  {q:"Xotira ierarxiyasida eng tez va yadroga eng yaqin daraja qaysi?",o:["Kristalldan tashqaridagi operativ xotira mikrosxemalari","L3 kesh, barcha yadrolar uchun umumiy va 30–50 takt oladi","L1 kesh, u yadro ichida joylashgan va 1–4 takt talab etadi","Protsessor ichidagi registrlar, murojaat 0 takt turadi"]},
  {q:"L1 kesh qayerda joylashadi va u qanday tashkil etilgan?",o:["Yadro ichida, buyruq va ma'lumot uchun alohida bo'linib turadi","Kristalldan tashqarida, alohida mikrosxema sifatida turadi","Barcha yadrolar uchun umumiy, kristallning markazida turadi","Operativ xotira mikrosxemasining ichida ajratilgan soha sifatida"]},
  {q:"L3 kesh L1 va L2 dan nimasi bilan ajralib turadi?",o:["Barcha yadrolar uchun umumiy va hajmi ancha kattaroq bo'ladi","Elektr uzilganda ham ma'lumotni saqlab qolish xususiyatiga ega","Faqat buyruqlarni saqlaydi, ma'lumot uchun ishlatilmaydi","Yadro ichida joylashgani uchun eng tez daraja hisoblanadi"]},
  {q:"L1 keshning tipik hajmi qaysi oraliqda bo'ladi?",o:["256 kilobayt – 1 megabayt, yadro yonida joylashgan holda","4–32 megabayt, barcha yadrolar uchun umumiy hajm sifatida","32–64 kilobayt oralig'ida, yadroning har biri uchun alohida","O'nlab bayt, ya'ni registrlar hajmiga yaqin bo'ladi"]},
  {q:"Xotira ierarxiyasida daraja raqami ortgan sari ko'rsatkichlar qanday o'zgaradi?",o:["Hajm o'zgarmaydi, faqat narxi arzonlashib boradi","Hajm kamayadi, murojaat vaqti ham qisqaradi","Hajm ortadi, murojaat vaqti esa uzayib boradi","Hajm ham, tezlik ham bir vaqtda ortib boradi"]},
  {q:"Operativ xotiraga murojaat qancha takt talab qiladi?",o:["1–4 takt, bu L1 kesh bilan deyarli bir xil qiymat","10–20 takt, bu L2 keshga murojaat bilan tenglashadi","0 takt, ya'ni qo'shimcha kutish umuman talab etilmaydi","100–300 takt, chunki u kristalldan tashqarida joylashgan"]},
  {q:"Hit rate (p) ko'rsatkichi qanday aniqlanadi?",o:["Xato murojaatlar sonini kesh qatori hajmiga bo'lib","Keshdan topilgan murojaatlarni umumiy murojaatga bo'lib","Kesh hajmini operativ xotira hajmiga bo'lish orqali","Takt chastotasini murojaat vaqtiga ko'paytirish orqali"]},
  {q:"Amalda kesh urish ulushi (hit rate) qanday qiymatlarda bo'ladi?",o:["1 dan katta bo'lishi mumkin, chunki blok bo'lib ko'chiriladi","0,9…0,99 oralig'ida, ya'ni murojaatlarning katta qismida","0,1…0,3 oralig'ida, ya'ni murojaatlarning kichik qismida","Aniq 0,5 ga teng, chunki ikki variant teng ehtimolli bo'ladi"]},
  {q:"Xotiraga o'rtacha murojaat vaqti qanday formula bilan hisoblanadi?",o:["t = p · t_xotira + (1 − p) · t_kesh ko'rinishida hisoblanadi","t = p · t_kesh + (1 − p) · t_xotira ko'rinishida hisoblanadi","t = (t_kesh + t_xotira) / 2 ko'rinishida o'rtacha olinadi","t = t_kesh · t_xotira · p ko'rinishida ko'paytma sifatida"]},
  {q:"t_kesh = 2 takt, t_xotira = 100 takt, p = 0,95 bo'lsa o'rtacha murojaat vaqti qancha?",o:["100 takt — keshning ta'siri hisobga olinmagan holda","51 takt — ikki qiymatning oddiy o'rtachasi sifatida","6,9 takt — 0,95·2 + 0,05·100 hisobidan kelib chiqadi","2 takt — barcha murojaatlar keshdan topilgani uchun"]},
  {q:"Oddiy mikrokontrollerlarda kesh nima uchun qo'yilmaydi?",o:["Ichki Flash va SRAM yadro bilan bir xil tezlikda ishlagani uchun","Mikrokontrollerlar dastur bilan umuman ishlamagani uchun","Ta'minot quvvati kesh uchun yetarli bo'lmagani uchun","Kristallda unga joy yetmagani va narxi qimmatligi uchun"]},

 checks:[{at:9,q:"Mikrokontrollerning (MK) asosiy belgisi qaysi?",o:["Faqat kiritish-chiqarish portlaridan iborat sxema va kvarts","Xotirasiz ishlab, tashqi shinaga tayanuvchi yadro va alohida port","Yadro, xotira va periferiya bitta kristallda birlashgan","Faqat arifmetik amallarni bajaruvchi alohida kristall va tashqi xotira"],a:2,e:"MK — yadro, xotira va periferiya bitta kristallda birlashtirilgan tugallangan tizim."},{at:13,q:"Xotira devori (memory wall) deb nima ataladi?",o:["Kesh-xotira to'lib qolishi natijasidagi uzoq to'xtash holati","Xotira hajmining adres fazosidan oshib ketishi natijasidagi xato","Protsessor va operativ xotira tezligi orasidagi katta farq","Xotira yacheykalarini himoyalovchi apparat to'siq va parol"],a:2,e:"Protsessor nanosekundlarda, operativ xotira esa o'nlab nanosekundda ishlaydi."},{at:17,q:"Fazo bo'yicha lokallik nimani anglatadi?",o:["Yaqinda ishlatilgan ma'lumot yaqin kelajakda yana kerak bo'ladi, shuning uchun saqlanadi","Bitta yacheykaga murojaatdan keyin qo'shnilari ham tez kerak bo'ladi","Dastur buyruqlari xotirada faqat ketma-ket tartibda joylashtiriladi","Ma'lumot faqat bitta xotira darajasida saqlanishi shart bo'ladi, boshqasida emas"],a:1,e:"Shu sababli keshga bitta bayt emas, butun blok (kesh qatori) ko'chiriladi."},{at:23,q:"t_kesh = 2 takt, t_xotira = 100 takt, p = 0,95 bo'lsa, o'rtacha murojaat vaqti qancha?",o:["9,5 takt","5,0 takt","2,0 takt","6,9 takt"],a:3,e:"t = 0,95·2 + 0,05·100 = 6,9 takt."}]

{
 id:"S1-A1", sem:1, week:1, type:"practice", no:1,
 title:"Algoritm tushunchasi va dasturlashda algoritmlarning o'rni",
 goal:"Algoritm tushunchasi, uning xossalari va tasvirlash usullarini o'zlashtirish, mikrokontroller masalasi uchun blok-sxema tuza olish.",
 outcomes:[],
 plan:["Algoritm tushunchasi va xossalari","Tasvirlash usullari","Blok-sxema elementlari","Asosiy tuzilmalar","Amaliy masalalar yechish"],
 equip:["Shaxsiy kompyuter yoki telefon","Blok-sxema chizish uchun daftar yoki grafik muharrir","Darslikning port va svetofor simulyatorlari","Kalkulyator"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Algoritm — qo'yilgan masalani yechishga olib keladigan aniq, chekli va tartiblangan amallar ketma-ketligi. Mikrokontroller dasturi aslida algoritmning mashina tilidagi yozuvidir: dasturchi avval algoritmni ishlab chiqadi, so'ng uni C yoki assembler tilida ifodalaydi."],
  ["p","Algoritmning asosiy xossalari:"],
  ["ul",["Diskretlik — amallar alohida qadamlarga ajratilgan","Aniqlik — har bir qadam bir ma'noli tushuniladi","Tushunarlilik — ijrochi bajara oladigan amallardan iborat","Ommaviylik — bir turdagi masalalarning barchasi uchun yaroqli","Natijaviylik — chekli qadamdan so'ng natija beradi"]],
  ["p","Mikrokontroller dasturlarida natijaviylik xossasi o'ziga xos: asosiy sikl ataylab cheksiz qilinadi (while(1)), chunki qurilma quvvat berilgan vaqtning barchasida ishlashi kerak. Bu holda natijaviylik butun dasturga emas, uning har bir ichki qismiga qo'llanadi."],
  ["h","Algoritmni tasvirlash usullari"],
  ["t",["Usul","Mohiyati","Qo'llanishi"],[["So'zli","Amallar oddiy jumlalar bilan bayon qilinadi","Boshlang'ich tavsif, texnik topshiriq"],["Blok-sxema","Grafik belgilar va bog'lovchi chiziqlar","Loyiha hujjatlari, o'quv jarayoni"],["Psevdokod","Dasturlash tiliga yaqin shartli yozuv","Kod yozishdan oldingi bosqich"],["Dastur kodi","Tilning rasmiy sintaksisi","Bevosita bajarish"]]],
  ["fig","flow","1-rasm. Blok-sxemaning asosiy elementlari va oddiy algoritm namunasi"],
  ["h","Asosiy tuzilmalar"],
  ["ol",["Chiziqli tuzilma — amallar ketma-ket bajariladi. Masalan: portni sozlash, boshlang'ich qiymat berish, chiqishga qiymat yozish.","Tarmoqlanuvchi tuzilma — shart tekshiriladi va natijaga qarab ikki yo'ldan biri tanlanadi. Masalan: tugma bosilganmi?","Takrorlanuvchi tuzilma (sikl) — shart bajarilguncha amallar guruhi qayta bajariladi. Masalan: 8 ta LED ni navbat bilan yoqish.","Qism dastur (funksiya) — takrorlanadigan amallar guruhi alohida nom bilan ajratiladi va kerak joyda chaqiriladi."]],
  ["h","Masala namunasi"],
  ["p","Masala: tugma bosilganda LED yonsin, qo'yib yuborilganda o'chsin. Algoritmni uch usulda yozamiz."],
  ["c","So'zli:\n1. Portni sozla: LED chiqish, tugma kirish\n2. Tugma holatini o'qi\n3. Agar bosilgan bo'lsa LED ni yoq, aks holda o'chir\n4. 2-qadamga qayt\n\nPsevdokod:\n  sozlash()\n  while (rost) {\n      agar (tugma == 0) LED = 1\n      aks holda        LED = 0\n  }"],
  ["p","Ikkinchi masala: 1 dan N gacha sonlar yig'indisini hisoblash. Bu klassik sikl misoli bo'lib, mikrokontrollerda o'lchash natijalarini o'rtachalashda ishlatiladi."],
  ["c","yigindi = 0\ni = 1\nsikl:  agar i > N bo'lsa chiqish\n       yigindi = yigindi + i\n       i = i + 1\n       sikl ga qayt\nnatija = yigindi"],
  ["f","S = N · (N + 1) / 2","Tekshirish formulasi: N = 10 uchun S = 55. Algoritm natijasi shu qiymatga teng bo'lishi kerak."],
  ["h","Interaktiv qism"],
  ["p","Svetofor modeli tarmoqlanuvchi va takrorlanuvchi tuzilmalarning birgalikda ishlashini ko'rsatadi: har bir faza vaqti tugaganda keyingi holatga o'tiladi."],
  ["sim","traffic"],
  ["h","Topshiriqlar"],
  ["ol",["Variant raqamingiz N bo'lsin. 1 dan (10 + N) gacha sonlar yig'indisini hisoblovchi algoritmning blok-sxemasini chizing va natijani formula bilan tekshiring.","Ikkita sonning kattasini aniqlovchi algoritmni blok-sxema va psevdokod ko'rinishida yozing.","8 ta LED ni navbat bilan yoqadigan (yuguruvchi olov) algoritmni sikl yordamida tuzing.","Svetofor algoritmini blok-sxemada tasvirlang; har bir faza davomiyligini ko'rsating.","Cheksiz sikl mikrokontroller dasturida nima uchun zarurligini yozma asoslang.","Chizgan blok-sxemangiz rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Algoritm dastur yozishning birinchi va eng muhim bosqichi. Blok-sxema algoritmni ko'rgazmali tasvirlab, xatolarni kod yozishdan oldin topish imkonini beradi. Har qanday murakkab mikrokontroller dasturi chiziqli, tarmoqlanuvchi va takrorlanuvchi tuzilmalarning kombinatsiyasidan iborat bo'ladi."],
 ],
 tests:[
  {q:"Algoritm tushunchasiga to'g'ri ta'rif qaysi javobda berilgan?",o:["Dasturlash tilining rasmiy sintaksis qoidalari to'plami hisoblanadi","Elektron sxemadagi elementlarning ulanish tartibini ko'rsatuvchi chizma","Masalani yechishga olib keladigan aniq va chekli amallar ketma-ketligi","Mikrokontroller xotirasida saqlanadigan ma'lumotlar tuzilmasi turi"]},
  {q:"Mikrokontroller dasturi algoritmga qanday munosabatda bo'ladi?",o:["Algoritmdan mustaqil, faqat apparat xususiyatlariga asoslanadi","Algoritm faqat hujjat uchun kerak, kodga hech qanday aloqasi yo'q","Algoritmni almashtiradi, shuning uchun blok-sxema talab etilmaydi","Algoritmning mashina yoki yuqori darajali tildagi yozuvi hisoblanadi"]},
  {q:"Algoritmning \"diskretlik\" xossasi nimani bildiradi?",o:["Bir turdagi barcha masalalar uchun yaroqli bo'lishi lozimligini","Chekli qadamdan keyin albatta natija olinishi kerakligini","Har bir qadam faqat bitta ma'noda tushunilishi mumkinligini","Amallar alohida, bir-biridan ajratilgan qadamlarga bo'linganini"]},
  {q:"Algoritmning \"aniqlik\" xossasi nimani talab qiladi?",o:["Har bir qadam bir ma'noli tushunilishini, ikkilanish yo'qligini","Amallar sonining imkon qadar kam bo'lishini talab qiladi","Algoritm faqat bitta masala uchun yozilishi kerakligini","Natija har safar bir xil vaqtda olinishini kafolatlashini"]},
  {q:"Algoritmning \"ommaviylik\" xossasi nimani anglatadi?",o:["Amallarning ko'p takrorlanishi natijani tezlashtirishini","Algoritm ommaga tushunarli tilda yozilishi kerakligini","Bir turdagi masalalarning barchasi uchun yaroqli ekanligini","Algoritmdan bir vaqtda ko'p foydalanuvchi ishlatishi mumkinligini"]},
  {q:"Algoritmning \"natijaviylik\" xossasi nima deyiladi?",o:["Chekli qadamdan so'ng albatta natija berilishi lozimligi","Amallarning alohida qadamlarga ajratilgan bo'lishi talabi","Har bir qadam ijrochiga tushunarli bo'lishi zarurligi","Natija har doim butun son ko'rinishida chiqishi kerakligi"]},
  {q:"Algoritmning \"tushunarlilik\" xossasi nimaga qaratilgan?",o:["Natijaning foydalanuvchiga ko'rgazmali ko'rinishiga","Algoritm ijrochi bajara oladigan amallardan tuzilishiga","Algoritm matnining imkon qadar qisqa yozilishiga","Amallar sonining oldindan aniq bilinishi talabiga"]},
  {q:"Mikrokontroller dasturida natijaviylik xossasi qanday o'ziga xoslikka ega?",o:["U butunlay bekor qilinadi, chunki dastur natija bermaydi","U faqat uzilish qism dasturlariga nisbatan tekshiriladi","U butun dasturga emas, uning har bir ichki qismiga qo'llanadi","U dastur hajmi bilan belgilanadi va qadamlarga bog'liq emas"]},
  {q:"Mikrokontroller dasturida while(1) sikli nima uchun ishlatiladi?",o:["Qurilma quvvat berilgan vaqtda uzluksiz ishlab turishi uchun","Dasturni belgilangan qadamdan keyin to'xtatish maqsadida","Xotira hajmini tejash va kodni qisqartirish maqsadida","Protsessorning takt chastotasini oshirish maqsadida"]},
  {q:"Algoritmni tasvirlashning so'zli usuli qayerda qo'llanadi?",o:["Bevosita mikrokontrollerda bajarish uchun kod yozishda","Kompilyatorga uzatiladigan rasmiy yozuv sifatida","Loyiha hujjatlarida grafik chizma sifatida ishlatishda","Boshlang'ich tavsif va texnik topshiriq tayyorlashda"]},
  {q:"Blok-sxema usulining mohiyati nimada?",o:["Grafik belgilar va bog'lovchi chiziqlardan foydalanishda","Dasturlash tiliga yaqin shartli yozuv ishlatilishida","Tilning rasmiy sintaksisiga to'liq bo'ysunishida","Amallar oddiy jumlalar bilan bayon qilinishida"]},
  {q:"Psevdokod qaysi bosqichda qo'llaniladi?",o:["Loyiha topshirilgandan keyin hisobot tuzish bosqichida","Texnik topshiriq rasmiylashtirilgan dastlabki bosqichda","Qurilmani sinovdan o'tkazish va sozlash bosqichida","Kod yozishdan oldingi, algoritmni aniqlashtirish bosqichida"]},
  {q:"Psevdokodning asosiy afzalligi nimada?",o:["Dastur xotirasidan kam joy egallashi imkoniyatida","Til sintaksisiga bog'lanmay algoritm mantiqini yozish imkonida","Uni kompilyator bevosita mashina kodiga aylantira olishida","Grafik ko'rinishi tufayli xatolarni darhol ko'rsatishida"]},
  {q:"Blok-sxemada romb shakli nimani bildiradi?",o:["Shartni tekshirish va tarmoqlanish nuqtasi belgilanadi","Hisoblash amali yoki qiymat berish ko'rsatiladi","Algoritmning boshlanishi yoki tugashi belgilanadi","Ma'lumot kiritish yoki chiqarish amali ko'rsatiladi"]},
  {q:"Blok-sxemada parallelogramm nimani anglatadi?",o:["Alohida nom bilan ajratilgan qism dasturni anglatadi","Takrorlanuvchi tuzilmaning boshlanishini anglatadi","Arifmetik hisoblash va qiymat berish amalini anglatadi","Ma'lumot kiritish yoki chiqarish amalini anglatadi"]},
  {q:"Blok-sxemada to'g'ri to'rtburchak qanday amalni ifodalaydi?",o:["Shart tekshirilishini va yo'l tanlanishini ifodalaydi","Tashqi qurilmaga ma'lumot uzatishni ifodalaydi","Hisoblash yoki o'zgaruvchiga qiymat berishni ifodalaydi","Algoritmning boshlanish nuqtasini ifodalaydi"]},
  {q:"Chiziqli tuzilmaning tipik misoli qaysi?",o:["Tugma bosilganmi degan shartni tekshirib yo'l tanlash","Portni sozlash, boshlang'ich qiymat berish, chiqishga yozish","8 ta LED ni navbat bilan qayta-qayta yoqib o'chirish","Takrorlanadigan amallarni alohida funksiyaga ajratish"]},
  {q:"Qaysi tuzilma shart natijasiga qarab ikki yo'ldan birini tanlaydi?",o:["Chiziqli tuzilma, amallar ketma-ket bajarilganda","Qism dastur, u nom bilan chaqirilgan har bir holatda","Tarmoqlanuvchi tuzilma, shart tekshirilgandan keyin","Takrorlanuvchi tuzilma, sikl shartiga ko'ra qaytganda"]},
  {q:"Takrorlanuvchi tuzilma (sikl) qanday ishlaydi?",o:["Amallar faqat bir marta, ketma-ket tartibda bajariladi","Shartga qarab ikkita yo'ldan faqat biri tanlab olinadi","Amallar guruhi alohida nom bilan ajratib qo'yiladi","Amallar guruhi shart bajarilguncha qayta-qayta bajariladi"]},
  {q:"Qism dastur (funksiya) ishlatishdan maqsad nima?",o:["Xotirani butunlay band qilmasdan ishlashga erishish","Dastur bajarilish tezligini har qanday holda oshirish","Shartlarni tekshirish amalini soddalashtirib yuborish","Takrorlanadigan amallarni bir joyga yig'ib, qayta chaqirish"]},
  {q:"\"Tugma bosilganda LED yonsin\" masalasi uchun port qanday sozlanadi?",o:["Ikkisi ham kirish qilib sozlanadi, chunki holat o'qiladi","LED kirish, tugma chiqish qilib sozlanishi talab etiladi","LED ulangan chiqish, tugma ulangan kirish qilib sozlanadi","Ikkisi ham chiqish qilib sozlanadi, chunki qiymat yoziladi"]},
  {q:"Tugma va LED masalasining algoritmida 3-qadamdan keyin nima bo'ladi?",o:["Dastur tugaydi va qurilma kutish rejimiga o'tadi","Natija indikatorga chiqariladi va sikl to'xtatiladi","Port qaytadan sozlanadi, ya'ni 1-qadam bajariladi","2-qadamga qaytiladi, ya'ni tugma holati yana o'qiladi"]},
  {q:"1 dan N gacha sonlar yig'indisini tekshirish formulasi qaysi?",o:["S = (N + 1)² / 4 ko'rinishidagi kvadratik ifoda bilan","S = N · (N + 1) / 2 ko'rinishidagi formula bilan topiladi","S = N² / 2 ko'rinishidagi soddalashtirilgan ifoda bilan","S = N · (N − 1) / 2 ko'rinishidagi formula bilan topiladi"]},
  {q:"N = 10 bo'lganda 1 dan N gacha sonlar yig'indisi qancha?",o:["100 ga teng, bu N kvadrati sifatida olinadi","50 ga teng, bu o'rtacha qiymatdan hisoblanadi","45 ga teng, chunki oxirgi had qo'shilmay qoladi","55 ga teng, bu 10·11/2 hisobidan kelib chiqadi"]},
  {q:"Yig'indi hisoblash algoritmida o'zgaruvchilarga qanday boshlang'ich qiymat beriladi?",o:["yigindi = 0 va i = 1 qiymatlari beriladi","yigindi = N va i = N qiymatlari beriladi","yigindi = 1 va i = 0 qiymatlari beriladi","Ikkisi ham boshlang'ich qiymatsiz qoldiriladi"]},
  {q:"Yig'indi hisoblash algoritmi mikrokontrollerda qayerda qo'llanadi?",o:["Uzilish vektorlari jadvalini xotiraga yozishda","Takt generatorining chastotasini aniqlab olishda","O'lchash natijalarini o'rtachalab, shovqinni kamaytirishda","Portlarni dastlabki sozlash amallarini bajarishda"]},
  {q:"Svetofor modeli qaysi tuzilmalarning birgalikda ishlashini ko'rsatadi?",o:["Faqat qism dasturlarning bir-birini chaqirishini","Faqat chiziqli tuzilmaning ketma-ket bajarilishini","Tarmoqlanuvchi va takrorlanuvchi tuzilmalarning birikishini","Faqat ma'lumot kiritish va chiqarish amallarini"]},
  {q:"Blok-sxema chizishning asosiy amaliy foydasi nimada?",o:["Mantiqiy xatolarni kod yozishdan oldin aniqlab olishda","Dastur kodining hajmini sezilarli qisqartirish imkonida","Xotira yacheykalarini tejab ishlatish imkoniyatida","Protsessorning takt chastotasini oshirish imkoniyatida"]},
  {q:"Dastur kodi usuli boshqa tasvirlash usullaridan nimasi bilan ajralib turadi?",o:["Tilning rasmiy sintaksisiga bo'ysunadi va bevosita bajariladi","Shartli yozuv bo'lib, kompilyatorga uzatilmaydi","Oddiy jumlalar bilan yozilib, texnik topshiriqqa kiradi","Grafik belgilardan iborat bo'lib, hujjatlarda ishlatiladi"]},
  {q:"Murakkab mikrokontroller dasturi qanday tuzilmalardan tashkil topadi?",o:["Faqat cheksiz sikldan, shart tekshirish esa talab etilmaydi","Chiziqli, tarmoqlanuvchi va takrorlanuvchi tuzilmalar birikmasidan","Faqat qism dasturlardan, asosiy sikl esa bo'lmaydi","Faqat chiziqli ketma-ketlikdan, boshqa tuzilma kerak emas"]},
 ],
 checks:[{at:4,q:"Mikrokontroller dasturida asosiy sikl nima uchun ataylab cheksiz qilinadi?",o:["Cheksiz sikl dastur hajmini sezilarli kamaytirib, tezlikni oshiradi","Cheklangan sikl taymerni ishdan chiqarib, kristallni qizdirib qo'yadi","Kompilyator cheklangan sikllarni qabul qilmaydi va xato chiqaradi","Qurilma quvvat berilgan vaqtning barchasida ishlashi kerak"],a:3,e:"Natijaviylik xossasi butun dasturga emas, uning ichki qismlariga qo'llanadi."},{at:9,q:"Quyidagilardan qaysi biri takrorlanuvchi tuzilma (sikl) misoli?",o:["Portni sozlash va boshlang'ich qiymat berish","Takrorlanadigan amallarni alohida funksiyaga ajratish","Tugma bosilganmi yoki yo'qmi tekshirish","8 ta LED ni navbat bilan yoqish"],a:3,e:"Sikl — shart bajarilguncha amallar guruhining qayta bajarilishi."},{at:15,q:"1 dan N gacha sonlar yig'indisi qaysi formula bilan tekshiriladi?",o:["S = (N + 1)² / 2","S = N · (N + 1) / 2","S = N² / 2 + 1","S = N · (N − 1) / 2"],a:1,e:"N = 10 uchun S = 55 bo'lishi kerak."}]

{
 id:"S1-M2", sem:1, week:2, type:"lecture", no:2,
 title:"Mikroprotsessor ishlab chiqarish tarixi. Hisoblash sistemasida bir necha parallel protsessorlar. Mikroprotsessor turlari",
 goal:"Mikroprotsessorlarning rivojlanish bosqichlarini, parallel hisoblash tashkil etilishini va asosiy ishlab chiqaruvchilar mahsulotlarini o'zlashtirish.",
 outcomes:["Mikroprotsessor avlodlarini asosiy belgilariga ko'ra tavsiflay oladi","Mur qonunining mohiyatini va uning cheklovlarini tushuntira oladi","Parallel hisoblash turlarini farqlay oladi","Asosiy ishlab chiqaruvchilar va ularning mahsulotlarini qiyoslay oladi"],
 plan:["Rivojlanish bosqichlari","Mur qonuni","Chastota o'sishining chegarasi","Parallel hisoblash turlari","Ko'p yadroli tizimlar","Mikroprotsessor turlari va ishlab chiqaruvchilar"],
 body:[
  ["h","Rivojlanish bosqichlari"],
  ["p","Birinchi mikroprotsessor 1971-yilda Intel 4004 nomi bilan chiqarildi. U 4 razryadli bo'lib, 2300 tranzistordan iborat edi va 740 kHz chastotada ishlagan. Undan keyingi ellik yil davomida tranzistorlar soni milliardlarga, chastota esa gigagertslarga yetdi."],
  ["t",["Avlod","Yillar","Vakil","Razryad","Xarakterli belgisi"],[["I","1971–1973","Intel 4004, 8008","4/8","PMOS, past chastota, bir necha korpus"],["II","1974–1977","Intel 8080, KR580VM80A, MOS 6502","8","NMOS, yagona +5 V manba, uzilishlar"],["III","1978–1984","Intel 8086, Motorola 68000","16","Segmentli adreslash, konveyerning boshlanishi"],["IV","1985–1995","i386, i486","32","Kesh, himoyalangan rejim, MMU"],["V","1995–2005","Pentium, Athlon","32","Superskalyarlik, SIMD kengaytmalar"],["VI","2005–hozir","Core, Ryzen, ARM Cortex","64","Ko'p yadrolilik, integratsiyalangan grafika"]]],
  ["f","N(t) = N0 · 2^(t / 2)","Mur qonuni: kristalldagi tranzistorlar soni taxminan har ikki yilda ikki barobar ortadi."],
  ["p","Mur qonuni fizik qonun emas, balki sanoat rivojlanishining empirik kuzatuvi. So'nggi yillarda texnologik normalarning atom o'lchamiga yaqinlashishi tufayli uning bajarilishi sekinlashdi va rivojlanish asosan arxitektura hamda parallellik hisobiga davom etmoqda."],
  ["h","Chastota o'sishining chegarasi"],
  ["p","2000-yillarning boshigacha unumdorlik asosan takt chastotasini oshirish hisobiga o'sdi. Ammo CMOS sxemalarda dinamik quvvat sarfi chastotaga proporsional bo'lgani uchun chastota 3–4 GHz atrofida issiqlik chiqarish chegarasiga urildi."],
  ["f","P ≈ C · U² · f","Chastotani ikki barobar oshirish quvvatni ham taxminan ikki barobar oshiradi."],
  ["p","Shu sababli rivojlanish yo'nalishi o'zgardi: bitta yadroni tezlashtirish o'rniga bir nechta yadroni parallel ishlatishga o'tildi."],
  ["h","Parallel hisoblash turlari"],
  ["t",["Daraja","Mohiyati","Namunasi"],[["Buyruqlar darajasida","Konveyer va superskalyarlik: bir taktda bir necha buyruq","Barcha zamonaviy yadrolar"],["Ma'lumotlar darajasida (SIMD)","Bitta buyruq bir nechta ma'lumot ustida bajariladi","MMX, SSE, AVX, NEON"],["Oqimlar darajasida","Bir yadroda bir necha mantiqiy oqim","Hyper-Threading"],["Yadrolar darajasida","Bir kristalda bir necha to'liq yadro","Ko'p yadroli protsessorlar"],["Tizim darajasida","Bir necha protsessor yoki kompyuter","Serverlar, klasterlar"]]],
  ["p","Parallellikning samarasi cheklangan: dasturning ketma-ket bajariladigan qismi tezlashtirishga bo'ysunmaydi. Amdal qonuniga ko'ra, agar dasturning 10 % i ketma-ket bajarilsa, protsessorlar soni qancha bo'lishidan qat'i nazar tezlanish 10 barobardan oshmaydi."],
  ["f","S = 1 / (s + (1 − s)/n)","Amdal qonuni: s — ketma-ket qism ulushi, n — protsessorlar soni."],
  ["h","Mikroprotsessor turlari va ishlab chiqaruvchilar"],
  ["t",["Ishlab chiqaruvchi","Mahsulotlari","Sohasi"],[["Intel","Core, Xeon, Celeron, Atom","Kompyuter, server, o'rnatilgan tizimlar"],["AMD","Athlon, Ryzen, EPYC","Kompyuter va server protsessorlari"],["VIA","C3, C7, Nano","Kam quvvatli x86 yechimlar"],["NVIDIA","Tegra, grafik protsessorlar","Grafika va parallel hisoblash"],["MCST","Elbrus","Mahalliy ishlab chiqarish, VLIW arxitekturasi"],["Philips / NXP","LPC, mikrokontrollerlar","O'rnatilgan boshqarish tizimlari"],["Hitachi / Renesas","SuperH, RX oilalari","Avtomobil va sanoat elektronikasi"],["Sun / Oracle","SPARC","Server tizimlari"],["ARM (litsenziya)","Cortex-A, Cortex-M","Smartfon, MK, IoT"]]],
  ["p","Intel Celeron — kesh hajmi qisqartirilgan arzon turkum; AMD Athlon — x86 bozorida raqobat yaratgan oila; Elbrus — VLIW (keng buyruqli) arxitekturaga asoslangan, parallellikni kompilyator rejalashtiradigan protsessor. ARM esa o'zi kristall ishlab chiqarmay, arxitektura litsenziyasini sotadi va shu tufayli mobil qurilmalarda ustunlikka erishdi."],
  ["n","Muhim tendensiya: o'rnatilgan tizimlarda eng yuqori chastota emas, balki quvvat birligiga to'g'ri keladigan unumdorlik va kerakli periferiya tarkibi hal qiluvchi mezon bo'lib qolmoqda."],
  ["sim","alu"],
  ["h","Xulosa"],
  ["p","Mikroprotsessorlar 1971-yildan buyon olti avlodni bosib o'tdi; tranzistorlar soni Mur qonuni bo'yicha o'sdi, chastota esa quvvat chegarasiga urilib to'xtadi. Rivojlanish parallellikka — konveyer, SIMD, ko'p oqim va ko'p yadroga — o'tdi, ammo Amdal qonuni bu yo'lning ham chegarasini ko'rsatadi. Bugungi bozorda Intel, AMD, ARM, NVIDIA, Elbrus va boshqa ishlab chiqaruvchilar turli sohalarga ixtisoslashgan."],

 tests:[
  {q:"Birinchi mikroprotsessor qaysi nomda va qaysi yilda chiqarilgan?",o:["MOS 6502, 1975-yilda chiqarilgan arzon 8 razryadli yechim","Intel 4004, 1971-yilda chiqarilgan birinchi mikroprotsessor","Intel 8080, 1974-yilda ishlab chiqarilgan va keng tarqalgan","Zilog Z80, 1976-yilda chiqarilib bozorda ommalashgan edi"]},
  {q:"Intel 4004 mikroprotsessorining asosiy ko'rsatkichlari qanday edi?",o:["4 razryadli, 10 000 tranzistor, 1 MHz chastotada ishlagan","16 razryadli, 29 000 tranzistor, 5 MHz chastotada ishlagan","4 razryadli, 2300 tranzistor, 740 kHz chastotada ishlagan","8 razryadli, 6000 tranzistor, 2 MHz chastotada ishlagan"]},
  {q:"Mikroprotsessorlarning birinchi avlodi qanday texnologiyada tayyorlangan?",o:["PMOS texnologiyasida, past chastotada va bir necha korpusda","NMOS texnologiyasida, yagona +5 V manba bilan ta'minlangan","CMOS texnologiyasida, segmentli adreslash qo'llanilgan holda","Bipolyar texnologiyada, konveyer tashkil etilgan ko'rinishda"]},
  {q:"Ikkinchi avlod mikroprotsessorlarining xarakterli belgisi nima?",o:["NMOS, yagona +5 V manba va uzilishlar qo'llab-quvvatlangan","Segmentli adreslash va konveyerning boshlanishi kuzatilgan","Kesh, himoyalangan rejim va MMU birinchi marta joriy etilgan","Superskalyarlik hamda SIMD kengaytmalar paydo bo'lgan edi"]},
  {q:"Intel 8080 va KR580VM80A qaysi avlodga va qanday razryadga tegishli?",o:["Uchinchi avlod, 16 razryadli mikroprotsessorlar hisoblanadi","Birinchi avlod, 4 razryadli mikroprotsessorlar hisoblanadi","Ikkinchi avlod, 8 razryadli mikroprotsessorlar hisoblanadi","To'rtinchi avlod, 32 razryadli mikroprotsessorlar sanaladi"]},
  {q:"Uchinchi avlodda (1978–1984) qanday yangilik kiritildi?",o:["Ko'p yadrolilik va integratsiyalangan grafika paydo bo'ldi","Yagona +5 V manba va uzilishlar tizimi birinchi marta kirdi","Segmentli adreslash joriy etilib, konveyer qo'llanila boshladi","PMOS dan NMOS ga o'tish shu avlodda amalga oshirildi"]},
  {q:"Kesh, himoyalangan rejim va MMU qaysi avlodda joriy etildi?",o:["Beshinchi avlodda, Pentium va Athlon oilasida","Ikkinchi avlodda, Intel 8080 oilasida joriy etilgan","Oltinchi avlodda, Core va Ryzen protsessorlarida","To'rtinchi avlodda, i386 va i486 protsessorlarida"]},
  {q:"Superskalyarlik va SIMD kengaytmalar qaysi avlodning belgisi?",o:["To'rtinchi avlodning, i486 protsessorining belgisi","Oltinchi avlodning, 64 razryadli yadrolarning belgisi","Uchinchi avlodning, 16 razryadli protsessorlarning belgisi","Beshinchi avlodning, Pentium va Athlon oilasining belgisi"]},
  {q:"Oltinchi avlod (2005-yildan hozirgacha) nimasi bilan ajralib turadi?",o:["PMOS texnologiyasi va past chastotali ishlash bilan ajraladi","Segmentli adreslash va birinchi konveyer yechimlari bilan","Ko'p yadrolilik va integratsiyalangan grafika bilan ajraladi","Yagona ta'minot manbasi va uzilishlar tizimi bilan ajraladi"]},
  {q:"Mur qonuni nimani ta'riflaydi?",o:["Quvvat sarfining kuchlanish kvadratiga bog'liqligini ko'rsatadi","Xotira hajmining protsessor tezligiga bog'liqligini bildiradi","Tranzistorlar sonining har ikki yilda ikki barobar ortishini","Takt chastotasining har yili ikki barobar o'sishini ta'riflaydi"]},
  {q:"Mur qonunining maqomi qanday?",o:["Xalqaro standart sifatida rasmiy qabul qilingan talab","Matematik teorema bo'lib, qat'iy isboti mavjud hisoblanadi","Sanoat rivojlanishining empirik kuzatuvi, fizik qonun emas","Fizikaning asosiy qonunlaridan biri sifatida isbotlangan"]},
  {q:"Mur qonunining bajarilishi nima sababdan sekinlashdi?",o:["Dasturlar tranzistorlarni to'liq ishlatmay qo'ygani sababli","Texnologik normalar atom o'lchamiga yaqinlashgani sababli","Tranzistor ishlab chiqarish butunlay to'xtatilgani sababli","Xotira hajmi protsessordan oshib ketgani sababli"]},
  {q:"2000-yillar boshigacha unumdorlik asosan nima hisobiga o'sdi?",o:["Xotira shinasi razryadlarini kengaytirish hisobiga o'sdi","Kesh hajmini cheksiz kattalashtirish hisobiga o'sgan edi","Takt chastotasini muntazam oshirib borish hisobiga o'sdi","Yadrolar sonini ko'paytirish va parallellikni oshirish hisobiga"]},
  {q:"CMOS sxemalarda dinamik quvvat sarfi qanday ifodalanadi?",o:["P ≈ C · U · f² ko'rinishida, ya'ni chastota kvadratiga bog'liq","P ≈ C · U² · f ko'rinishida, ya'ni chastotaga proporsional","P ≈ C · f / U ko'rinishida, ya'ni kuchlanishga teskari bog'liq","P ≈ U² / C ko'rinishida, ya'ni sig'imga teskari proporsional"]},
  {q:"Takt chastotasi o'sishi qaysi qiymat atrofida to'xtab qoldi?",o:["740 kHz atrofida, birinchi avlod darajasida to'xtadi","20–30 GHz atrofida, nazariy chegaraga yetib to'xtadi","100 MHz atrofida, texnologik cheklov sababli to'xtadi","3–4 GHz atrofida, issiqlik chiqarish chegarasi tufayli"]},
  {q:"Chastota chegarasiga urilgandan keyin rivojlanish qaysi yo'nalishga o'tdi?",o:["Xotira hajmini cheksiz oshirish yo'nalishiga o'tilgan edi","Bitta yadroni yanada kuchli tezlashtirish yo'nalishiga","Analog hisoblash usullariga qaytish yo'nalishi tanlandi","Bir nechta yadroni parallel ishlatish yo'nalishiga o'tildi"]},
  {q:"Konveyer va superskalyarlik qaysi darajadagi parallellikka kiradi?",o:["Ma'lumotlar darajasidagi parallellikka kiradi","Tizim darajasidagi parallellikka kiradi","Buyruqlar darajasidagi parallellikka kiradi","Oqimlar darajasidagi parallellikka kiradi"]},
  {q:"SIMD iborasi nimani anglatadi?",o:["Bir necha mantiqiy oqim bitta yadroda bajarilishini","Bitta buyruq bir nechta ma'lumot ustida bajarilishini","Bitta ma'lumot bir nechta buyruq bilan ishlanishini","Bir nechta yadro bitta buyruqni navbat bilan bajarishini"]},
  {q:"MMX, SSE, AVX va NEON to'plamlari nimaning namunasi?",o:["Tizim darajasidagi klaster yechimlari namunasi sanaladi","Buyruqlar darajasidagi konveyer yechimlarining namunasi","Oqimlar darajasidagi ko'p oqimlilik namunasi hisoblanadi","Ma'lumotlar darajasidagi (SIMD) parallellik namunasi"]},
  {q:"Hyper-Threading texnologiyasi qaysi darajadagi parallellikka misol?",o:["Yadrolar darajasiga: bir kristallda bir necha to'liq yadro","Buyruqlar darajasiga, ya'ni konveyerga misol bo'ladi","Oqimlar darajasiga: bir yadroda bir necha mantiqiy oqim","Tizim darajasiga: bir necha kompyuter birlashtirilganda"]},
  {q:"Serverlar va klasterlar qaysi darajadagi parallellikka tegishli?",o:["Yadrolar darajasiga: bitta kristalldagi yadrolarga","Buyruqlar darajasiga: superskalyar bajarilishga","Tizim darajasiga: bir necha protsessor yoki kompyuter","Ma'lumotlar darajasidagi SIMD parallellikka tegishli"]},
  {q:"Parallellikning samarasini nima cheklaydi?",o:["Har bir yadro alohida takt generatorini talab qiladi","Yadrolar soni ko'paygan sari xotira hajmi kamayadi","Parallel ishlash quvvat sarfini butunlay yo'q qiladi","Dasturning ketma-ket bajariladigan qismi tezlashtirilmaydi"]},
  {q:"Amdal qonuni qanday ifodalanadi?",o:["S = 1 / (s + (1 − s)/n) ko'rinishida ifodalanadi","S = n · (1 − s) ko'rinishida ifodalanadi","S = n / (1 + s · n) ko'rinishida ifodalanadi","S = (1 − s) / (s · n) ko'rinishida ifodalanadi"]},
  {q:"Dasturning 10 % i ketma-ket bajarilsa, maksimal tezlanish qancha bo'ladi?",o:["2 barobardan oshmaydi, chunki yadrolar o'zaro kutadi","Cheksiz oshadi, agar yadrolar soni yetarli bo'lsa","10 barobardan oshmaydi, chunki S = 1/s = 1/0,1 = 10","100 barobarga yetishi mumkin, yadrolar soniga qarab"]},
  {q:"Intel kompaniyasining mahsulotlari qaysi javobda to'g'ri sanalgan?",o:["Core, Xeon, Celeron va Atom turkumlari sanaladi","Tegra, SPARC va Elbrus turkumlari sanab o'tilgan","Cortex-A, Cortex-M va LPC turkumlari sanaladi","Athlon, Ryzen va EPYC turkumlari sanab o'tilgan"]},
  {q:"Intel Celeron turkumining asosiy xususiyati nima?",o:["Kesh hajmi qisqartirilgan, arzon byudjet turkumi","Grafik hisoblash uchun maxsus mo'ljallangan turkum","VLIW arxitekturasiga asoslangan maxsus yechim","Server tizimlari uchun eng yuqori unumdorlikka ega"]},
  {q:"AMD kompaniyasining mahsulot oilalari qaysilar?",o:["LPC va boshqa mikrokontroller oilalari chiqariladi","Athlon, Ryzen va EPYC oilalari ishlab chiqariladi","SuperH va RX oilalari ishlab chiqarib kelinadi","Core, Xeon va Atom oilalari ishlab chiqariladi"]},
  {q:"Elbrus protsessorlari qaysi arxitekturaga asoslangan?",o:["RISC arxitekturasiga, qisqartirilgan buyruqlar to'plamiga","Garvard arxitekturasiga, xotiralar ajratilgan holatga","CISC arxitekturasiga, murakkab buyruqlar to'plamiga","VLIW arxitekturasiga, parallellikni kompilyator rejalashtiradi"]},
  {q:"ARM kompaniyasining biznes modeli nimaga asoslangan?",o:["Xotira mikrosxemalari ishlab chiqarib bozorga chiqarishga","Arxitektura litsenziyasini boshqa kompaniyalarga sotishga","Faqat tayyor dasturiy ta'minotni sotish hisobiga ishlashga","O'z zavodlarida kristall ishlab chiqarib sotishga asoslangan"]},
  {q:"O'rnatilgan tizimlarda protsessor tanlashda hal qiluvchi mezon nima?",o:["Faqat kristalldagi tranzistorlarning umumiy soni olinadi","Faqat eng yuqori takt chastotasi hal qiluvchi mezon bo'ladi","Quvvat birligiga unumdorlik va kerakli periferiya tarkibi","Faqat kesh hajmi va xotira shinasining kengligi hisoblanadi"]},

 checks:[{at:4,q:"Mur qonuniga ko'ra tranzistorlar soni taxminan qancha vaqtda ikki barobar ortadi?",o:["Har ikki yilda","Har yili","Har besh yilda","Har o'n yilda"],a:0,e:"Mur qonuni fizik qonun emas, balki empirik kuzatuv."},{at:8,q:"Nima uchun chastotani oshirish o'rniga yadrolar soni oshirila boshlandi?",o:["Dasturlar bitta yadroda ishlashni qat'iy taqiqlagani uchun","Ko'p yadroli kristallar arzonroq ishlab chiqarilgani va soddaroq bo'lgani uchun","Kvarts rezonatorlar yuqori chastotani umuman ushlay olmagani uchun","Quvvat sarfi chastotaga proporsional, issiqlik chegarasiga urildi"],a:3,e:"P ≈ C·U²·f: chastota 3–4 GHz atrofida issiqlik chegarasiga yetdi."},{at:12,q:"Dasturning 10 % i ketma-ket bajarilsa, Amdal qonuniga ko'ra tezlanish nima bilan cheklanadi?",o:["10 barobardan oshmaydi","5 barobardan oshmaydi","100 barobargacha o'sadi","Yadrolar soniga teng bo'ladi"],a:0,e:"Ketma-ket qism tezlashtirishga bo'ysunmaydi."},{at:15,q:"Elbrus protsessori qaysi arxitekturaga asoslangan?",o:["VLIW (keng buyruqli) arxitekturaga","8 razryadli Garvard MK arxitekturasiga","Superskalyar x86 arxitekturaga","ARM litsenziyali arxitekturaga"],a:0,e:"VLIW da parallellikni kompilyator rejalashtiradi."}]

{
 id:"S1-A2", sem:1, week:2, type:"practice", no:2,
 title:"Mikroprotsessor tizimlarida takt generatori",
 goal:"Taktlovchi generator turlarini, ularni mikrokontrollerga ulash sxemalarini va chastotaga bog'liq vaqt hisoblarini o'zlashtirish.",
 outcomes:[],
 plan:["Takt generatorining vazifasi","Generator turlari","Kvarts rezonatorli sxema","RC va ichki generator","Konfiguratsiya bitlari","Vaqt hisoblari"],
 equip:["Mikrokontroller o'quv stendi yoki Proteus","Kvarts rezonator 4, 8, 20 MHz","Kondensatorlar 15–22 pF","Rezistor va kondensator RC generator uchun","Ossillograf yoki chastotomer","Darslikning taymer va PWM simulyatorlari"],
 body:[
  ["h","Nazariy tushunchalar"],
  ["p","Takt generatori — mikroprotsessorli tizimning barcha tugunlarini sinxronlashtiruvchi davriy impulslar manbai. Buyruqlarning bajarilishi, taymerlar, ADC va ketma-ket interfeyslarning ishlash tezligi — barchasi takt chastotasidan kelib chiqadi. Generator to'xtasa, protsessor ham to'xtaydi."],
  ["fig","clock","1-rasm. Kvarts rezonatorli va RC takt generatorlarini mikrokontrollerga ulash"],
  ["t",["Generator turi","Aniqligi","Chastota diapazoni","Qo'llanishi"],[["Kvarts rezonator (XT, HS)","±0,001 % gacha","32 kHz – 20 MHz","UART, soat, o'lchash tizimlari"],["Keramik rezonator","±0,5 %","1–20 MHz","Arzon maishiy qurilmalar"],["RC zanjir (tashqi)","±5–10 %","100 kHz – 4 MHz","Vaqt aniqligi muhim bo'lmagan hollarda"],["Ichki RC generator","±1–2 %","31 kHz – 8 MHz","Tashqi elementlarsiz loyihalar"],["Tashqi generator (EC)","Manbaga bog'liq","0 – 20 MHz","Bir necha mikrosxemani sinxronlash"]]],
  ["h","Kvarts rezonatorli sxema"],
  ["p","Kvarts rezonator OSC1 va OSC2 chiqishlariga ulanadi, har bir chiqish esa 15–22 pF kondensator orqali umumiy simga bog'lanadi. Kondensator qiymati rezonator hujjatidagi yuk sig'imiga qarab tanlanadi. Rezonator mikrokontroller korpusiga imkon qadar yaqin joylashtiriladi, o'tkazgichlar qisqa bo'ladi, ostidan boshqa signal yo'llari o'tkazilmaydi."],
  ["n","Xavfsizlik va montaj qoidasi: quvvat ulangan holda rezonatorni almashtirish mumkin emas. Kvarts korpusi metall bo'lsa, u umumiy simga ulanadi — aks holda sxema shovqinga sezgir bo'ladi."],
  ["h","Vaqt hisoblari"],
  ["f","T_takt = 1 / f_osc","Takt davri. f = 8 MHz → T = 125 ns."],
  ["f","T_sikl = 4 / f_osc","PIC da mashina sikli. f = 8 MHz → 500 ns; f = 20 MHz → 200 ns."],
  ["f","t = N · T_sikl","N ta bir sikli buyruq bajarilish vaqti — dasturiy kechikishlarni hisoblash asosi."],
  ["p","Misol. PIC16F877A, f = 4 MHz. Mashina sikli 1 µs. 1 ms kechikish uchun taxminan 1000 ta bir sikli buyruq kerak; bu odatda ichma-ich joylashgan ikki sikl bilan amalga oshiriladi."],
  ["p","Dastur mikroC PRO for PIC muhitida yoziladi. Loyiha sozlamalari: MCU — PIC16F877A, takt chastotasi — 8 MHz (kvarts). Portlarning alohida razryadlariga PORTB.F0 kabi murojaat qilinadi."],
  ["c","/* mikroC PRO for PIC: konfiguratsiya va kechikish */\n__CONFIG(_HS_OSC & _WDT_OFF & _PWRTE_ON & _BODEN_ON & _LVP_OFF & _CP_OFF & _WRT_OFF & _CPD_OFF);\n\nvoid main()\n{\n    TRISB = 0x00;             // PORTB chiqish\n    while (1)\n    {\n        PORTB = 0xFF;\n        Delay_ms(500);        // 500 ms\n        PORTB = 0x00;\n        Delay_ms(500);\n    }\n}"],
  ["p","Konfiguratsiya so'zidagi FOSC bitlari generator rejimini tanlaydi: LP — past chastotali kvarts (32 kHz), XT — o'rtacha (1–4 MHz), HS — yuqori chastotali (4–20 MHz), RC — tashqi RC zanjir, INTOSC — ichki generator. Noto'g'ri rejim tanlansa, mikrokontroller umuman ishga tushmaydi — bu boshlovchilar duch keladigan eng ko'p tarqalgan xato."],
  ["h","Interaktiv qism"],
  ["p","Taymer simulyatorida chastota va bo'luvchini o'zgartirib, to'lib ketish davri qanday hisoblanishini kuzating."],
  ["sim","timer"],
  ["h","Topshiriqlar"],
  ["ol",["Variant raqamingiz N bo'lsin. f = (4 + N) MHz uchun takt davrini va PIC mashina siklini hisoblang.","Shu chastotada 100 ms kechikish uchun zarur mashina sikllari sonini toping.","Kvarts rezonatorli ulash sxemasini chizing, kondensator qiymatlarini ko'rsating va tanlashni asoslang.","XT, HS va INTOSC rejimlarini qiyoslovchi jadval tuzing: aniqlik, narx, tashqi elementlar.","Generator chastotasini ikki barobar oshirsak, taymer davri va quvvat sarfi qanday o'zgarishini hisob bilan ko'rsating.","Sxema yoki hisoblash daftaringiz rasmini yuklang."]],
  ["h","Xulosa"],
  ["p","Takt generatori tizimning barcha vaqt ko'rsatkichlarini belgilaydi. Kvarts rezonator eng yuqori aniqlikni beradi va ketma-ket aloqa uchun majburiy hisoblanadi, ichki RC generator esa tashqi elementlarni tejaydi. Konfiguratsiya bitlari orqali tanlangan generator rejimi dasturga emas, mikrokontrollerning apparat ishga tushishiga ta'sir qiladi."],
 ],
 tests:[
  {q:"Takt generatorining mikroprotsessorli tizimdagi asosiy vazifasi nima?",o:["Kirish signallarini kuchaytirib yadroga uzatib berish","Yadro va periferiyani kerakli kuchlanish bilan ta'minlash","Tizim tugunlarini sinxronlovchi davriy impulslar hosil qilish","Xotira yacheykalarini dastur boshida tozalab chiqish"]},
  {q:"Takt chastotasi tizimning qaysi ko'rsatkichlariga ta'sir qiladi?",o:["Faqat ketma-ket interfeyslarning bod tezligiga ta'sir qiladi","Buyruqlar, taymerlar, ADC va interfeyslar tezligiga ta'sir qiladi","Faqat quvvat sarfiga, boshqa ko'rsatkichlarga ta'sir qilmaydi","Faqat buyruqlarning bajarilish tezligiga ta'sir qiladi"]},
  {q:"Kvarts rezonatorning chastota aniqligi qanday?",o:["±0,001 % gacha yetadi, bu eng yuqori aniqlik hisoblanadi","±0,5 % atrofida, maishiy qurilmalarda qo'llanadi","±1–2 % oralig'ida, tashqi elementlarsiz olinadi","±5–10 % atrofida, bu arzon yechimlar uchun yetarli"]},
  {q:"Keramik rezonatorning aniqligi va qo'llanish sohasi qanday?",o:["±0,5 % aniqlik, arzon maishiy qurilmalarda ishlatiladi","±1–2 % aniqlik, tashqi elementsiz loyihalarda ishlatiladi","±5–10 % aniqlik, vaqt muhim bo'lmagan hollarda ishlatiladi","±0,001 % aniqlik, o'lchash va soat tizimlarida ishlatiladi"]},
  {q:"Tashqi RC zanjirli generatorning aniqligi qanday?",o:["±0,001 % gacha, chunki element qiymatlari barqaror","±5–10 % atrofida, element toleransiga bog'liq bo'ladi","±0,5 % atrofida, keramik rezonator darajasida bo'ladi","±0,01 % atrofida, kvartsga yaqin natija beradi"]},
  {q:"Ichki RC generatorning asosiy afzalligi nimada?",o:["Tashqi elementlarni butunlay talab qilmasligida","Bir necha mikrosxemani sinxronlab turish imkonida","Chastotani 20 MHz dan yuqoriga chiqarish imkonida","Eng yuqori chastota aniqligini ta'minlab berishida"]},
  {q:"Tashqi generator (EC) rejimi qanday maqsadda ishlatiladi?",o:["Bir necha mikrosxemani bitta manbadan sinxronlash uchun","Faqat 32 kHz past chastotali soat tizimlari uchun kerak","Tashqi elementlarni butunlay tejash maqsadida ishlatiladi","Faqat arzon maishiy qurilmalarda qo'llanadigan yechim"]},
  {q:"Kvarts rezonator mikrokontrollerning qaysi chiqishlariga ulanadi?",o:["VDD va VSS ta'minot chiqishlariga ulab qo'yiladi","MCLR va RA0 chiqishlariga ulanishi talab etiladi","OSC1 va OSC2 generator chiqishlariga ulanib qo'yiladi","RB0 va RB1 kiritish-chiqarish chiqishlariga ulanadi"]},
  {q:"Kvarts rezonator bilan birga qanday elementlar qo'yiladi?",o:["Chiqishlarga stabilitron va cheklovchi rezistor qo'yiladi","Har bir chiqishga 15–22 pF yuk kondensatorlari qo'yiladi","Har bir chiqishga himoya diodlari ketma-ket ulanadi","Chiqishlar orasiga kichik induktivlikli transformator"]},
  {q:"Kvarts bilan ishlatiladigan kondensator qiymati nimaga qarab tanlanadi?",o:["Platadagi bo'sh joy o'lchamiga qarab erkin tanlanadi","Mikrokontrollerning ta'minot kuchlanishiga qarab tanlanadi","Rezonator hujjatida ko'rsatilgan yuk sig'imiga qarab tanlanadi","Dastur hajmi va xotira sig'imiga qarab hisoblab tanlanadi"]},
  {q:"Kvarts rezonatorni platada joylashtirish qoidasi qanday?",o:["Boshqa signal yo'llari ustiga, ekranlash maqsadida qo'yiladi","MK korpusiga imkon qadar yaqin, o'tkazgichlar qisqa qilinadi","Plataning chetiga, ta'minot razyomi yoniga joylashtiriladi","MK korpusidan uzoqroqqa, issiqlik manbaidan nari qo'yiladi"]},
  {q:"Kvarts rezonator ostidan boshqa signal yo'llari o'tkazilsa nima bo'ladi?",o:["Sxema shovqinga sezgir bo'lib, ishlashi beqaror bo'ladi","Ta'minot kuchlanishi pasayib, MK ishga tushmay qoladi","Generator chastotasi avtomatik ravishda ikki barobar ortadi","Rezonator aniqligi oshadi, chunki ekranlash hosil bo'ladi"]},
  {q:"Metall korpusli kvarts rezonator bilan ishlashda qanday qoida bor?",o:["Korpus hech qayerga ulanmay, erkin qoldirilishi kerak","Korpus ta'minot plyusiga ulanishi shart hisoblanadi","Korpus umumiy simga (yerga) ulanishi talab etiladi","Korpus adres shinasining birinchi razryadiga ulanadi"]},
  {q:"Quvvat ulangan holda kvarts rezonatorni almashtirish mumkinmi?",o:["Mumkin, lekin faqat chastota 1 MHz dan kichik bo'lsa","Mumkin, agar faqat bitta oyoqcha ajratilsa yetarli","Mumkin emas, avval ta'minotni uzish talab etiladi","Mumkin, bunda hech qanday xavf yuzaga kelmaydi"]},
  {q:"Takt davri qanday formula bilan topiladi?",o:["T_takt = 1 / f_osc ko'rinishida hisoblab topiladi","T_takt = f_osc · 4 ko'rinishida hisoblab topiladi","T_takt = 4 / f_osc ko'rinishida hisoblab topiladi","T_takt = f_osc / 4 ko'rinishida hisoblab topiladi"]},
  {q:"f = 8 MHz bo'lganda takt davri qancha bo'ladi?",o:["1 µs, bu sakkiz taktning davriga teng bo'ladi","250 ns, bu ikki taktning davriga teng bo'ladi","500 ns, bu mashina siklining davriga tengdir","125 ns, bu 1/8 MHz hisobidan kelib chiqadi"]},
  {q:"PIC mikrokontrollerda mashina sikli takt davridan necha marta uzun?",o:["Bir marta, ya'ni mashina sikli takt davriga teng","Ikki marta uzun, chunki ikki takt sarflanadi","To'rt marta uzun, chunki T_sikl = 4/f_osc bo'ladi","O'n ikki marta uzun, konveyer tufayli shunday bo'ladi"]},
  {q:"f = 8 MHz bo'lsa, PIC da bitta mashina sikli qancha vaqt oladi?",o:["1 µs, bu sakkiz takt davriga to'g'ri keladi","125 ns, bu bitta takt davriga to'g'ri keladi","500 ns, bu 4/8 MHz hisobidan kelib chiqadi","250 ns, bu ikki takt davriga to'g'ri keladi"]},
  {q:"f = 20 MHz bo'lsa, PIC da mashina sikli qancha bo'ladi?",o:["500 ns, bu 8 MHz uchun olingan qiymatdir","200 ns, bu 4/20 MHz hisobidan kelib chiqadi","50 ns, bu bitta takt davrining qiymatidir","800 ns, bu to'rt takt va bo'luvchi hisobidan"]},
  {q:"N ta bir sikli buyruqning bajarilish vaqti qanday topiladi?",o:["t = T_sikl / N ko'rinishida teskari nisbat sifatida","t = N + T_sikl ko'rinishida yig'indi sifatida topiladi","t = N · T_sikl ko'rinishida ko'paytma sifatida topiladi","t = N / T_sikl ko'rinishida bo'linma sifatida topiladi"]},
  {q:"PIC16F877A, f = 4 MHz. 1 ms kechikish uchun qancha bir sikli buyruq kerak?",o:["Taxminan 100 ta buyruq kerak, bu amaliy tajribadan olingan","Taxminan 4000 ta buyruq kerak, chunki har takt 250 ns dir","Taxminan 250 ta buyruq kerak bo'ladi, bu bo'luvchi hisobidan","Taxminan 1000 ta buyruq kerak, chunki sikl 1 µs ni tashkil etadi"]},
  {q:"Uzoq dasturiy kechikish odatda qanday amalga oshiriladi?",o:["Bitta uzun sikl bilan, hisoblagich kengaytirilgan holda","Faqat uzilishlar yordamida, sikl ishlatilmagan holda","Ichma-ich joylashgan ikki sikl bilan amalga oshiriladi","Takt chastotasini vaqtincha pasaytirish yo'li bilan"]},
  {q:"XC8 kompilyatorida _XTAL_FREQ makrosi nima uchun kerak?",o:["Watchdog taymerining ishlash davrini sozlab qo'yish uchun","Mikrokontrollerning generator rejimini tanlab berish uchun","Dastur xotirasidagi joylashuv adresini belgilash uchun","Kompilyator kechikish funksiyalarini shu chastotaga hisoblashi uchun"]},
  {q:"#pragma config WDTE = OFF qatori nimani bajaradi?",o:["Portlarni kirish holatiga majburan o'tkazib qo'yadi","Generator rejimini ichki RC ga o'tkazib qo'yadi","Watchdog taymerini o'chiradi, qayta ishga tushirish bo'lmaydi","Dastur xotirasini o'qishdan himoyalab qo'yadi"]},
  {q:"FOSC bitlarining LP qiymati qanday generator rejimini tanlaydi?",o:["Yuqori chastotali kvarts rejimini, 4–20 MHz uchun","Tashqi RC zanjirli generator rejimini tanlab beradi","Past chastotali kvarts rejimini, taxminan 32 kHz uchun","O'rtacha chastotali kvarts rejimini, 1–4 MHz uchun"]},
  {q:"FOSC = XT rejimi qanday chastota diapazoni uchun mo'ljallangan?",o:["32 kHz atrofidagi past chastotalar uchun mo'ljallangan","4–20 MHz oralig'idagi yuqori chastotalar uchun","Faqat ichki generator ishlatilgan holatlar uchun","1–4 MHz oralig'idagi o'rtacha chastotalar uchun"]},
  {q:"FOSC = HS rejimi qanday chastotalar uchun tanlanadi?",o:["4–20 MHz oralig'idagi yuqori chastotalar uchun","1–4 MHz oralig'idagi o'rtacha chastotalar uchun","Chastota noma'lum bo'lgan barcha holatlar uchun","32 kHz past chastotali soat rezonatorlari uchun"]},
  {q:"Konfiguratsiyada noto'g'ri generator rejimi tanlansa nima sodir bo'ladi?",o:["Dastur xotirasidagi ma'lumot butunlay o'chib ketadi","Faqat kiritish-chiqarish portlari ishlamay qoladi","Dastur sekinlashadi, lekin ishlashda davom etadi","Mikrokontroller umuman ishga tushmaydi, dastur bajarilmaydi"]},
  {q:"Ketma-ket aloqa (UART) uchun qaysi generator afzal ko'riladi?",o:["Ichki RC generator, chunki tashqi element kerak emas","Kvarts rezonator, chunki bod tezligi xatosi kichik bo'ladi","Tashqi RC zanjir, chunki arzon va sozlash oson bo'ladi","Har qanday generator, chunki UART chastotaga bog'liq emas"]},
  {q:"Takt chastotasini ikki barobar oshirsak, taymerning to'lib ketish davri qanday o'zgaradi?",o:["To'rt barobar uzayadi, chunki sikl to'rt taktdan iborat","O'zgarmaydi, chunki davr faqat bo'luvchiga bog'liq","Ikki barobar uzayadi, chunki hisoblash sekinlashadi","Ikki barobar qisqaradi, chunki takt davri qisqaradi"]},

  {q:"Takt davri qanday formula bilan hisoblanadi?",o:["T = f · 4 formulasi bilan, f = 20 MHz → T = 80 MHz","T = f / 4 formulasi bilan, f = 20 MHz → T = 5 MHz","T = 4 / f formulasi bilan, f = 20 MHz → T = 200 ns","T = 1 / f formulasi bilan, f = 20 MHz → T = 50 ns"]},
